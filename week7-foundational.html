<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Foundational Literacy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1120px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}h1,h2,h3{color:#165487}.card p,.card li{font-size:18px;line-height:1.48;color:#55747b;font-weight:750}.box{background:#e7f0ed;border-radius:18px;padding:15px;margin:12px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Foundational Literacy</h1><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'Letter ID · Cc, Dd',html:`<p>Say, rather than sing, the alphabet while tracking each letter on the alphabet poster.</p><div class="box"><b>Review:</b> Listen for beginning sounds in <i>happy</i>, <i>octopus</i>, and <i>gum</i>.</div><p>Introduce /k/ with: <b>The colorful snake curved and coiled.</b> Introduce /d/ with: <b>Dogs with dazzling diamonds danced in my dream.</b></p><p>Introduce Cc and Dd with the Fundations cards: C, cat, /k/ and D, dog, /d/. Model mouth formation without adding a schwa. Find /k/ and /d/ in familiar words.</p>`},Tuesday:{title:'Concepts of Print · Tracking Print',html:`<p>Use the poem <b>“The Day I Decided to Become Sunshine”</b> by Vanessa Brantley-Newton.</p><div class="box">Point to the title and ask where reading begins. Read the poem while tracking each word with a finger or pointer and emphasizing the sweep to the beginning of each new line. Read it a second time and ask how the poem makes children feel.</div>`},Wednesday:{title:'Letter ID · Cc, Dd',html:`<p>Say the alphabet while tracking print. Reintroduce the letter cards and have children repeat each letter name, picture, and sound.</p><div class="box"><b>Sky writing:</b> Use two “magic fingers” to form uppercase and lowercase Cc and Dd in the air while the teacher models the movements on the board.</div><p>Reinforce the sound connection: C says /k/. D says /d/.</p>`},Thursday:{title:'Concepts of Print · Words',html:`<p>Return to <b>“The Day I Decided to Become Sunshine.”</b></p><div class="box">Remind children that when we read, we point to the words and follow them from left to right. Ask where reading begins and how they know. Read the poem while pointing to the text and sweeping from one line to the next.</div>`},Friday:{title:'Letter ID · Cc, Dd Review',html:`<p>Say the alphabet while tracking each letter on the alphabet poster.</p><div class="box"><b>Review:</b> Ask which letters and sounds children have practiced this week. Review the Fundations letter cards, then play the curriculum guessing game using clues and initial sounds.</div><p>Examples include <b>community</b> for /k/ and <b>draw</b> for /d/.</p>`}}[day];tag.textContent='WEEK 7 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
