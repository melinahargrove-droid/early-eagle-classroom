<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 7 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef;position:relative}.book.hidden{display:none}.book img{display:block;width:100%;height:100%;object-fit:contain}.image-error{display:none;position:absolute;inset:10%;align-items:center;justify-content:center;text-align:center;padding:3vw;border-radius:24px;background:#fff7e8;color:#855d28;font-weight:900;font-size:18px;line-height:1.5}.image-error.show{display:flex}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(560px,44vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-fallback{font-size:clamp(100px,10vw,180px)}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(42px,3.7vw,68px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-example{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="pageImg" alt="Adapted book page"><div class="image-error" id="imageError"></div></div><div class="stopcard" id="stop"></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit Visual</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-example" id="vocabExample"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const data={Monday:{title:'Alma and How She Got Her Name',sub:'Read 1 of 2 · What’s the story about?',prefix:'alma-and-how-she-got-her-name-',start:1,end:17,before:'Today we will read Alma and How She Got Her Name. Listen for Alma’s problem with her name and what she learns about the people she was named for.',focus:'Read the adapted text fluently. Pause only when a curriculum teaching stop appears.',note:'After reading, talk about how Alma’s father helps her realize that her long name connects her to family stories.',stops:{4:'BOOK PAGE 3 • What is Alma’s problem with her name?',7:'BOOK PAGE 9 • What do you think happened to Esperanza’s “heart”?',13:'BOOK PAGE 21 • Thumbs up if you have ever tried to tell other people about what you think is important.'},vocabs:[{after:11,kicker:'QUICK WORD · BOOK PAGE 17',word:'Spirits',definition:'Spirits means the souls of people.',example:'In the story, Alma is learning about people in her family and their spirits.',icon:'✨',slot:'week7-alma-spirits'},{after:11,kicker:'QUICK WORD · BOOK PAGE 17',word:'Ancestors',definition:'Ancestors are people you are connected to who lived long ago.',example:'Parents, grandparents, and family members from long ago are part of a family’s ancestry.',icon:'🌳',slot:'week7-alma-ancestors'}]},Tuesday:{title:'Alma and How She Got Her Name',sub:'Read 2 of 2 · Reading the pictures',prefix:'alma-and-how-she-got-her-name-',start:1,end:17,before:'Today we will read Alma again and look closely at the illustrations. Notice what the pictures help us understand about Alma, her family, and the stories behind her name.',focus:'Reread the adapted text and look closely at the illustrations.',note:'After reading, ask children to think of someone interesting or inspiring to them and one thing that person does.',stops:{5:'BOOK PAGE 5 • Notice Alma and Daddy sitting close together and looking at a photo album.',6:'BOOK PAGES 7–8 • What do you think is really happening and what might be part of Alma’s imagination?',8:'BOOK PAGES 11–12 • What do the illustrations show? What is Alma doing with the string?',11:'BOOK PAGE 18 • What is Alma’s great-aunt doing?',13:'BOOK PAGES 21–22 • Notice the signs reading “Escucha,” “Piensa,” and “Denuncia.” Ask what the people may be doing and whether children have seen people doing something like this.'}},Wednesday:{title:'Hair Love',sub:'Read 1 of 3 · Making predictions',prefix:'hair-love-',start:1,end:16,before:'Today we will read Hair Love. Use the illustrations to make predictions about Zuri, her hair, and what might happen next.',focus:'Read the adapted text fluently and use the illustrations to make predictions.',note:'Introduce Hair Love, written by Matthew A. Cherry and illustrated by Vashti Harrison.',stops:{6:'BOOK PAGE 10 • What is happening and what might happen next?',10:'BOOK PAGE 18 • How do you think Zuri will feel about Daddy’s next idea?',12:'BOOK PAGE 22 • How do Zuri and her father look? What do you predict will happen next?',14:'BOOK PAGE 26 • Mommy’s arrival is a surprise. Ask children how they predict the book will end.'},vocabs:[{after:2,kicker:'QUICK PHRASE · BOOK PAGE 1',word:'A Mind of Its Own',definition:'Something with “a mind of its own” is not easy to control.',example:'Zuri says her hair has a mind of its own because it does not always do what she expects.',icon:'💭',slot:'week7-hairlove-mind-of-its-own'},{after:6,kicker:'QUICK WORD · BOOK PAGE 10',word:'Worn-Out',definition:'Worn-out means tired from doing lots of activities.',example:'Show how your body looks when you feel very tired.',icon:'😴',slot:'week7-hairlove-worn-out'},{after:8,kicker:'QUICK PHRASE · BOOK PAGE 13',word:'A Piece of Cake',definition:'“A piece of cake” means very easy.',example:'Pretend something is so easy you can do it with a smile.',icon:'🍰',slot:'week7-hairlove-piece-of-cake'}]},Thursday:{title:'Hair Love',sub:'Read 2 of 3 · Retelling events',prefix:'hair-love-',start:1,end:16,before:'Today we will read Hair Love again and focus on what happens first, next, and last.',focus:'Reread the story and focus on telling what happened.',note:'After reading, slowly look through all the illustrations and ask: What happened first, next, and last?',stops:{7:'BOOK PAGE 12 • What happens while Zuri is in the bathroom?',12:'BOOK PAGES 21–22 • Look at the illustrations. What tools do they need?',15:'BOOK PAGE 27 • Reread the page, including the banner. What is going on? Where might Mommy be coming home from?'}},Friday:{title:'Hair Love',sub:'Read 3 of 3 · Character and connections',prefix:'hair-love-',start:1,end:16,before:'Today we will use the words and illustrations in Hair Love to get to know Zuri even more and make connections to her feelings and experiences.',focus:'Use the words and illustrations to get to know Zuri even more.',note:'After reading, look again from page 23 to the end and ask why Zuri says her hair is “hair love.”',stops:{4:'BOOK PAGE 6 • Notice how Zuri’s hair helps her be lots of things and connect this to Riley’s clothes in What Riley Wore.',9:'BOOK PAGE 15 • How do you think Zuri feels when she says, “No, Daddy?”',11:'BOOK PAGE 19 • Zuri looks like she may cry because she wants her hair just right. Ask whether children ever feel like crying when they want something to be just right.'}}};const p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',x=data[day],from=p.get('from')||'';let sequence=[];for(let i=x.start;i<=x.end;i++){sequence.push({type:'book',page:i});(x.vocabs||[]).filter(v=>v.after===i).forEach(v=>sequence.push({type:'vocab',...v}))}let step=0,beforeOpen=true,pauseShown=false,token=0;const $=id=>document.getElementById(id);$('title').textContent=x.title;$('sub').textContent=x.sub;$('chip').textContent='WEEK 7 · '+day.toUpperCase();$('notesTitle').textContent=x.title;$('focus').textContent=x.focus;$('note').textContent=x.note||'';function overview(){location.href='daily-lessons.html?week=7&day='+days.indexOf(day)+'&v='+Date.now()}function item(){return sequence[step]}function state(){const z=item();return{step,beforeOpen,pauseShown,atStart:beforeOpen&&step===0,atEnd:!beforeOpen&&step===sequence.length-1&&z.type==='book'&&(!x.stops[z.page]||pauseShown)}}window.EEASectionState=state;function notify(){try{window.dispatchEvent(new CustomEvent('eea-section-state',{detail:state()}))}catch(e){}}function showCard(label,copy){$('stop').innerHTML='<b>'+label+'</b>'+copy;$('stop').classList.add('show')}function hideCard(){$('stop').classList.remove('show')}function renderImage(page){const src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg';$('imageError').classList.remove('show');$('pageImg').style.visibility='visible';$('pageImg').onerror=()=>{$('pageImg').style.visibility='hidden';$('imageError').textContent='Book image could not load: '+src;$('imageError').classList.add('show')};$('pageImg').src=src+'?v=9'}async function renderVocab(v){const t=++token,src=window.EEAVisualStore?await EEAVisualStore.get(v.slot):null;if(t!==token)return;$('vocabCustom').hidden=!src;$('vocabFallback').style.display=src?'none':'block';$('vocabFallback').textContent=v.icon||'🖼️';if(src)$('vocabCustom').src=src;$('vocabKicker').textContent=v.kicker||'QUICK WORD';$('vocabWord').textContent=v.word;$('vocabDefinition').textContent=v.definition;$('vocabExample').textContent=v.example||'';$('vocabEdit').onclick=()=>location.href='visual-editor.html?slot='+encodeURIComponent(v.slot)+'&return='+encodeURIComponent('week7-read-aloud.html?day='+day+(from?'&from='+from:''))}function render(){const z=item(),isV=z.type==='vocab';$('book').classList.toggle('hidden',isV);$('vocabSlide').classList.toggle('show',isV);hideCard();pauseShown=false;if(isV){beforeOpen=false;renderVocab(z)}else{token++;renderImage(z.page);if(beforeOpen&&step===0)showCard('BEFORE WE READ',x.before)}$('count').textContent=isV?'Vocabulary · '+z.word:'Slide '+(z.page-x.start+1)+' of '+(x.end-x.start+1);$('fill').style.width=((step+1)/sequence.length*100)+'%';$('prev').disabled=false;$('next').textContent=beforeOpen?'Start Reading →':step===sequence.length-1?'Finish Read Aloud ✓':'Next →';notify()}$('prev').onclick=()=>{if(pauseShown){pauseShown=false;hideCard();notify();return}if(beforeOpen)return;if(step>0){step--;render();return}beforeOpen=true;render()};$('next').onclick=()=>{const z=item();if(beforeOpen){beforeOpen=false;hideCard();notify();return}if(z.type==='book'&&x.stops[z.page]&&!pauseShown){pauseShown=true;showCard('CURRICULUM TEACHING STOP — PAUSE HERE',x.stops[z.page]);$('next').textContent='Continue →';notify();return}if(pauseShown){pauseShown=false;hideCard()}if(step<sequence.length-1){step++;render()}else if(from!=='runner')overview()};$('backBtn').onclick=overview;$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');render()})();</script></body></html>
