<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 6 Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea)}.page{height:100vh;padding:3vh 5vw}.top{height:10vh;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;letter-spacing:.12em;color:#789697}.chip{padding:.6vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.card{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw}.visual{height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-size:clamp(70px,7vw,120px);font-weight:900}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:clamp(40px,3.5vw,68px);margin:1vh 0;color:#164f7f;line-height:1.04}.lead{font-size:clamp(20px,1.35vw,27px);font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh}.step{padding:1.1vh 1.2vw;background:#e7f0ed;border-radius:17px;color:#416d61;font-size:clamp(16px,1vw,20px);font-weight:900;line-height:1.35}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff}</style></head><body><main class="page"><div class="top"><div class="brand">EARLY EAGLE ACADEMY · INTRO TO CENTERS · WEEK 6</div><div class="chip" id="chip"></div></div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="prev">← Previous</button><button class="done" id="done">Done ✓</button></div></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday';const d={Monday:{icon:'🎨',title:'Exploring Beautiful Stuff + Adding Yellow',lead:'Two art experiences invite children to create with found materials and explore color mixing.',steps:['Art Studio: Remind children that the Beautiful Stuff collection is now available for creating art. Look closely at a few materials and invite ideas about what they could become.','Art Easel: Revisit paintings from last week. Add yellow to the red and blue paint choices. Invite predictions about what might happen when colors are mixed.']},Tuesday:{icon:'🧺',title:'Continue Center Work',lead:'No new center is introduced today. Children continue and deepen the Week 6 center experiences already available.',steps:['Revisit the existing center prompts and vocabulary as needed.','Support continued work with painting, Beautiful Stuff, building, caring for babies, retelling stories, observing weather, and drawing feelings.']},Wednesday:{icon:'🥣',title:'Discovery: Mixing Salt Dough',lead:'Children combine flour, salt, and water and observe how ingredients change when mixed.',steps:['Introduce flour, salt, and water. Explain that water is a liquid and that a recipe tells how ingredients are combined.','Read the recipe together while tracking the print.','Work together to measure and mix, then describe how the dough looks, smells, and feels.']},Thursday:{icon:'🔎',title:'Continue Center Work',lead:'Revisit the week’s center vocabulary and help children extend work already underway.',steps:['Check in with prompts such as: What are you noticing? What changed?','Ask: How are you working together? What might you try next?']},Friday:{icon:'✨',title:'Continue and Deepen Center Work',lead:'Children revisit, extend, document, or share work from the week’s centers.',steps:['Remind children of this week’s materials and possibilities.','Support children in extending or sharing work without introducing a new required center.']}}[day];const $=id=>document.getElementById(id);$('chip').textContent='WEEK 6 · '+day.toUpperCase();$('eye').textContent=day.toUpperCase()+' · CENTER INTRODUCTION';$('visual').textContent=d.icon;$('title').textContent=d.title;$('lead').textContent=d.lead;$('steps').innerHTML=d.steps.map(s=>'<div class="step">'+s+'</div>').join('');$('prev').onclick=()=>location.href='week6-read-aloud.html?day='+encodeURIComponent(day);$('done').onclick=()=>location.href='week6-small-groups.html?day='+encodeURIComponent(day)})();</script></body></html>
