<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Install EEA Classroom Companion</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#174e88"><link rel="icon" href="assets/app-icon.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eaf0ec;font-family:"Trebuchet MS",Arial,sans-serif;color:#174e88}.card{width:min(680px,92vw);padding:42px;border-radius:30px;background:#fffaf0;box-shadow:0 18px 55px rgba(31,70,112,.18);text-align:center}h1{margin:0 0 12px;font-size:clamp(30px,5vw,52px)}p{font-size:20px;line-height:1.45}.icon{width:150px;height:150px;margin-bottom:18px}.btn{display:inline-block;margin:10px;padding:16px 26px;border:0;border-radius:18px;background:#174e88;color:white;font-size:20px;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#6f94b5}#status{font-size:16px;min-height:24px}</style></head><body><main class="card"><img class="icon" src="assets/app-icon.svg" alt="Early Eagle Academy"><h1>Classroom Companion</h1><p>Install the Early Eagle Academy Classroom Companion so it opens in its own app window.</p><button class="btn" id="install" hidden>Install App</button><a class="btn secondary" href="index.html">Open Companion</a><p id="status">If the Install button does not appear, use your browser menu and choose <b>Install Early Eagle Academy Classroom Companion</b> or <b>Install app</b>.</p></main><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js');}let promptEvent=null;const btn=document.getElementById('install'),status=document.getElementById('status');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;btn.hidden=false;status.textContent='Ready to install.';});btn.addEventListener('click',async()=>{if(!promptEvent)return;promptEvent.prompt();const result=await promptEvent.userChoice;if(result.outcome==='accepted'){status.textContent='Installed! You can open it from your apps or desktop.';btn.hidden=true;}promptEvent=null;});window.addEventListener('appinstalled',()=>{status.textContent='Installed! You can open it from your apps or desktop.';btn.hidden=true;});</script></body></html>
