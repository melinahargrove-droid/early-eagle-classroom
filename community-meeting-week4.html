<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 4 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%);overflow:hidden}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px);line-height:1}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:rgba(214,232,237,.8);color:#386d80;font-weight:900;font-size:clamp(12px,.82vw,16px)}.close{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#174f7d;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(92,136,147,.2);border-radius:34px;background:rgba(255,254,249,.94);box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:rgba(217,234,238,.8);color:#4f7c89;font-weight:900;letter-spacing:.06em;font-size:clamp(11px,.72vw,14px)}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.cue{width:min(36vw,600px);height:min(59vh,560px);border-radius:30px;background:radial-gradient(circle at 50% 38%,#fffdf8 0,#eaf3ee 62%,#dbe9e5 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw;box-shadow:inset 0 0 0 1px rgba(96,140,145,.13)}.icon{font-size:clamp(105px,10vw,180px);line-height:1;margin-bottom:2vh}.caption{color:#557876;font-size:clamp(18px,1.25vw,24px);font-weight:900;max-width:25vw;line-height:1.25}.copy{text-align:left}.eyebrow{color:#799597;font-size:clamp(12px,.8vw,15px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px);line-height:1}.copy p{margin:1.4vh 0;color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38;max-width:39vw}.step,.quote{margin-top:1.8vh;max-width:39vw;border-radius:17px;color:#4f765e;font-weight:900}.step{padding:1.1vh 1.3vw;background:rgba(226,238,236,.72);font-size:clamp(17px,1.16vw,23px)}.quote{padding:1.5vh 1.6vw;background:#e8f1ed;font-size:clamp(24px,1.9vw,36px);line-height:1.25}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.6vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 12px 30px rgba(44,67,68,.15);display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}.source{position:absolute;right:3%;bottom:2.15%;color:#aebbb8;font-size:clamp(8px,.52vw,10px);font-weight:700;opacity:.78}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><div class="panel" id="panel"></div><div class="source" id="source"></div></main><script>(()=>{const data={Monday:{type:'MINDFUL PRACTICE · CURRICULUM',source:'Focus on Pre-K · Unit 1 · Week 4',note:'Snake Breath: Sit up tall, take a deep breath in, and breathe out slowly and smoothly with a long hissing sound. Repeat 3–5 times and notice the body slowing down.',cards:[['Get Ready','🐍','Sit tall and breathe in.','Sit up tall and take a deep breath in, filling your whole body.'],['Snake Breath','💨','One long, smooth breath out.','Breathe out slowly and smoothly with a long hissing sound.'],['Breathe & Notice','🌿','Notice your body slowing down.','Repeat 3–5 times. Notice your whole body slowing down.']]},Tuesday:{type:'CONVERSATION · CURRICULUM',source:'Focus on Pre-K · Unit 1 · Week 4',note:'Characters in our books have lots of feelings. Choose sad, shy, or angry and ask what children can do when they feel that way. Invite a few children to share; use feeling visuals if helpful.',cards:[['Choose a Feeling','🎭','Sad · shy · angry','Choose one feeling: sad, shy, or angry.'],['What Can You Do?','💭','Think of something that could help.','What can you do when you feel this way?'],['Let’s Share','💬','A few friends share ideas.','Invite a few children to share. Use feeling visuals if helpful.']]},Wednesday:{type:'GAME · CURRICULUM',source:'Focus on Pre-K · Unit 1 · Week 4',note:'Story Rounds: Begin the story, go around the circle so each child may add a word, phrase, action, or pass, then tell the whole story back. Continue once or twice around as time allows.',cards:[['Start Our Story','📖','Once upon a time…','Begin: “Once upon a time, there was a…”'],['Add to the Story','✨','One idea at a time.','Go around the circle. Each child may add a word, phrase, action—or pass.'],['Tell It Back','🗣️','Hear the story we made together.','Continue once or twice around as time allows, then read or tell the whole story back.']]},Thursday:{type:'EEA EXTENSION',source:'Early Eagle Academy · Week 4 Extension',note:'Saturday Calm-Down Practice: Pretend something you were excited about did not go as planned, show a tense or disappointed body, take one Snake Breath, then notice what a calmer body looks like.',cards:[['Plans Changed','😕','Something did not go as planned.','Pretend something you were excited about did not go as planned.'],['Show the Feeling','🧍','What does disappointment look like?','Show a tense or disappointed body.'],['Try Snake Breath','🐍','Breathe, then notice your calmer body.','Try one Snake Breath together. Then show what your calmer body looks like.']]},Friday:{type:'EEA EXTENSION',source:'Early Eagle Academy · Week 4 Extension',note:'Our Community Story: Name a neighborhood place or person, begin a short story using one idea, then add 3–5 children’s ideas to make a quick class community story.',cards:[['Think of Our Community','🏘️','Name a place or person.','Name one place or person you might find in a neighborhood.'],['Start a Story','📖','Use one idea to begin.','Teacher begins a short story using one idea.'],['Build It Together','✨','Add our class ideas.','Add 3–5 children’s ideas to make a quick class community story.']]}};const dayNames=['Monday','Tuesday','Wednesday','Thursday','Friday'],params=new URLSearchParams(location.search);let day=dayNames.includes(params.get('day'))?params.get('day'):'Monday',i=0,d=data[day];const $=id=>document.getElementById(id);function render(){d=data[day];const cards=d.cards;$('cards').innerHTML=cards.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="cue"><div class="icon">${c[1]}</div><div class="caption">${c[2]}</div></div></div><div class="copy"><div class="eyebrow">${day} · ${d.type}</div><h2>${c[0]}</h2><p>${c[3]}</p></div></article>`).join('');$('dots').innerHTML=cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');$('badge').textContent=d.type.split(' · ')[0]+' · '+(i+1)+' OF '+cards.length;$('weekLabel').textContent='WEEK 4 · '+day.toUpperCase();$('prev').disabled=i===0;$('next').textContent=i===cards.length-1?'Done ✓':'Next →';$('panel').innerHTML='<strong>Teacher guidance:</strong> '+d.note;$('source').textContent=d.source}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<d.cards.length-1){i++;render()}else location.href='week4-plan.html'};$('closeBtn').onclick=()=>location.href='week4-plan.html';$('teacher').onclick=()=>$('panel').classList.toggle('open');render()})();</script><script src="community-visual-overrides.js"></script></body></html>
