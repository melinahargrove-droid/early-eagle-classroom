="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 8 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'We All Say PLAY!',sub:'Library & Listening',kicker:'NEW MULTILINGUAL POEM',img:'assets/reading.webp',materials:'We All Play · play word cards with classroom home languages · chart paper/sentence strips with poem blanks · crayons/markers · pointers · white paper · scissors · glue · baskets · optional family audio recordings',vocab:'bilingual · community · language · multilingual · point',steps:[{title:'We Are a Community',img:'assets/focus-3s/unit-1/week-8/centers/community-play-together.png',prompt:'We learn and play together.',cue:'A community is a group of people who live, work, or do things together.',script:'Connect to the many family/friend books from Unit 1. Explain that the classroom is a community that learns and plays together.'},{title:'We All Play in Two Languages',img:'assets/focus-3s/unit-1/week-8/centers/we-all-play-two-languages.png',prompt:'“We play too! Kimêtawânaw mîna.”',cue:'We All Play is bilingual: English + Cree.',script:'Show the tagged page. Explain bilingual as speaking/reading/writing in two languages. Connect respectfully to bilingual children/families in the classroom.'},{title:'Our Languages',img:'assets/focus-3s/unit-1/week-8/centers/our-languages.png',prompt:'There are many ways to communicate.',cue:'Language is how people talk with or communicate with one another.',script:'Name classroom home languages using family-provided information. Explain that a poem containing more than two languages is multilingual.'},{title:'Read We All Say PLAY!',img:'assets/focus-3s/unit-1/week-8/centers/read-we-all-say-play.png',prompt:'Use the pointer and add play-word cards.',cue:'Children/families can support pronunciation of home-language words.',script:'Show the prepared poem. Read the title and poem while pointing to print. Model inserting language cards into blank spaces.'},{title:'Choose Languages & Illustrate',img:'assets/focus-3s/unit-1/week-8/centers/choose-languages-illustrate.png',prompt:'You can be a reader AND an illustrator.',cue:'Choose language cards and draw pictures that match play.',script:'Explain that children can choose languages to place in the poem and draw illustrations of play. Model drawing, cutting it out, and adding it to the chart.'}],teacherNote:'Use family-provided pronunciations/audio when available. The source invites children to support pronunciation of words in their own home languages; do not guess pronunciations when unsure.'},{title:'Messages to Friends 2',sub:'Writing & Drawing',kicker:'CONTINUED LESSON',img:'assets/writing.webp',materials:'children’s previous messages · varied envelopes · postcards · note cards · Week 7 stamp resource',vocab:'envelope · letter · list · message · note · postcard · stamp',steps:[{title:'Look at Our Messages',img:'assets/focus-3s/unit-1/week-8/centers/look-at-our-messages.png',prompt:'What kinds of messages have we written?',cue:'Letters · invitations · notes · lists and more',script:'Show/read 2–3 different messages children created last week and invite their authors to share about their work.'},{title:'Same & Different',img:'assets/focus-3s/unit-1/week-8/centers/same-and-different-messages.png',prompt:'How are these notes similar? How are they different?',cue:'Notice purpose, marks, pictures, words, size, and format.',script:'Invite 2–3 children to compare the messages.'},{title:'Meet More Message Materials',img:'assets/focus-3s/unit-1/week-8/centers/message-materials.png',prompt:'Notecards · postcards · envelopes · stamps',cue:'Different materials can carry different kinds of messages.',script:'Show/name each item. Explain that a postcard is a small card that can be mailed without an envelope.'},{title:'Write More Messages',prompt:'What would you like to communicate today?',cue:'Choose the message and material that fit your idea.',script:'Invite children to continue writing messages to friends using the expanded materials.'}]},Tuesday:[{title:'Triangle Hunt',sub:'Math',kicker:'NEW LESSON',img:'assets/math.webp',materials:'triangle templates placed around classroom · Building Blocks Teacher Guide pp.70, 74, 78 · clipboards · pencils · optional shape definition sheet',vocab:'angle · polygon · triangle',steps:[{title:'Meet the Triangle',prompt:'What shape is this?',cue:'A triangle has 3 connected straight sides.',script:'Hold up a triangle and invite children to identify it. Explain that triangles have three straight sides that are all connected.'},{title:'Count the Angles',prompt:'Triangles also have 3 angles.',cue:'Point and count: 1, 2, 3.',script:'Point to and count all three angles with children.'},{title:'Go on a Triangle Hunt',prompt:'Triangles are hidden around our room!',cue:'Math Center friends search; others leave hidden templates in place.',script:'Explain that triangle templates are placed throughout the classroom. If a child not currently in Math finds one, they should leave it for friends doing the hunt.'},{title:'Record What You Find',prompt:'Draw/write triangles on your clipboard.',cue:'Pencil + clipboard',script:'Explain that after finding triangles, children record them by drawing/writing on the clipboard.'},{title:'Remember the Attributes',prompt:'3 sides · 3 angles',cue:'How do you know it is a triangle?',script:'Close by repeating that triangles have three connected straight sides and three angles.'}]},{title:'Revisit Building with Boxes',sub:'Blocks',kicker:'REVISIT',img:'assets/blocks.webp',prompt:'Continue collaborative box building.',cue:'Plan, assemble, decorate, label, and build together.',materials:'Original Building with Boxes 1 materials and guidance are available through Review Original Introduction.',vocab:'ability · assemble · decorate · reach',revisit:{day:'Tuesday',item:1,week:7}}],Wednesday:[{title:'Making Musical Instruments 2',sub:'Science & Engineering',kicker:'CONTINUED LESSON',img:'assets/science.webp',materials:'children’s instruments from Week 7 · Science of Sound — Exploring Pitch on the Guitar video/projector · established instrument-making materials',vocab:'pitch · sound · volume',steps:[{title:'Play Our Instruments',prompt:'Let’s hear some instruments we made last week.',cue:'Invite creators to demonstrate.',script:'Show a few children’s instruments and ask each creator to play their instrument.'},{title:'Remember Volume',prompt:'How can you play louder? Quieter?',cue:'Volume is how loud or quiet a sound is.',script:'Review changing volume and invite children to demonstrate or explain.'},{title:'Meet Pitch',prompt:'Pitch tells how high or low a sound is.',cue:'Use your voice: high → low.',script:'Introduce pitch. Demonstrate by saying or singing something with a high voice and then a low voice.'},{title:'Watch Pitch on a Guitar',prompt:'What changes the sound?',cue:'Science of Sound — Exploring Pitch on the Guitar',script:'Show the curriculum-linked pitch video and invite children to notice high and low sounds.'},{title:'Keep Designing',prompt:'Can you change pitch AND volume?',cue:'Continue making and experimenting with instruments.',script:'Invite children to continue making instruments during Centers and experiment with changing both pitch and volume.'}]},{title:'Whole Body Self-Portraits 2',sub:'Art Studio',kicker:'CONTINUED MULTI-DAY PROJECT',img:'assets/art.webp',materials:'in-progress portraits · optional natural/recycled collage materials · glue/tape · hanging materials · Showcase invitations · crayons/colored pencils',vocab:'choose · invitation · self-portrait · showcase · trace',steps:[{title:'Finish Our BIG Art',prompt:'We have worked on these portraits for a whole week.',cue:'Big art takes time.',script:'Explain that this week children will finish their portraits and prepare for families to come to the Showcase. Reference the class calendar/date if available.'},{title:'Finish Painting',prompt:'Do you still have painting to do?',cue:'Return to your portrait and continue where you left off.',script:'Invite children who still need to paint to continue their portrait.'},{title:'Add Collage Details',prompt:'What else would you like your portrait to show?',cue:'Pictures · fabric · yarn · buttons · other optional materials',script:'Introduce optional collage materials. Model choosing a picture/material that represents something you like and adding it to the portrait.'},{title:'Prepare the Showcase',prompt:'Finished portraits will be displayed.',cue:'Our families and friends will see what we created.',script:'Explain that finished portraits will be hung for the Showcase of Learning.'},{title:'Decorate an Invitation',prompt:'An invitation tells when and where to come.',cue:'Decorate the border and take/send it to family.',script:'Show a Showcase invitation and model decorating it. Explain invitation using the curriculum definition.'}],teacherNote:'Continue honoring children’s self-expression choices from Week 7. Focus suggests adding captions/descriptions, comparing similarities/differences including height, displaying portraits in the classroom/hallway, and sending Showcase invitations to families.'}],Thursday:[{title:'Revisit We All Say PLAY!',sub:'Library & Listening',kicker:'REVISIT',img:'assets/reading.webp',prompt:'Return to our multilingual class poem.',cue:'Read, choose language cards, and add illustrations.',materials:'Original We All Say PLAY! materials and guidance are available through Review Original Introduction.',vocab:'bilingual · community · language · multilingual · point',revisit:{day:'Monday',item:0}},{title:'Revisit Triangle Hunt',sub:'Math',kicker:'REVISIT',img:'assets/math.webp',prompt:'Hunt for triangles again.',cue:'Find, identify, and record shapes with 3 connected straight sides and 3 angles.',materials:'Original Triangle Hunt materials and guidance are available through Review Original Introduction.',vocab:'angle · polygon · triangle',revisit:{day:'Tuesday',item:0}}],Friday:[{title:'Revisit Messages to Friends',sub:'Writing & Drawing',kicker:'REVISIT',img:'assets/writing.webp',prompt:'Continue creating messages with the expanded materials.',cue:'Choose a notecard, postcard, envelope, stamp, or another format that fits your idea.',materials:'Original Messages to Friends 2 materials and guidance are available through Review Original Introduction.',vocab:'envelope · letter · list · message · note · postcard · stamp',revisit:{day:'Monday',item:1}},{title:'Post Office 2',sub:'Dramatic Play',kicker:'CONTINUED LESSON',img:'assets/dramatic-play.webp',materials:'empty closable boxes · painter’s tape · newspaper/recycled packing material · quarter sheets of white paper · real/pretend scale · an object to model sending',vocab:'communicate · envelope · letter · mail · package · scale · stamp',steps:[{title:'Remember Our Post Office',prompt:'What have you done at the Post Office?',cue:'Mail letters, cards, and messages.',script:'Remind children that Dramatic Play became a post office last week. Invite a few children to share their experiences.'},{title:'Meet a Package',prompt:'Sometimes we send things that are not paper.',cue:'A package is an object packed in a bundle or box to send to someone.',script:'Introduce package and explain that people may go to a post office to send objects to someone else.'},{title:'Choose a Box & Pack It',prompt:'Find a box that fits the object.',cue:'Use packing material to keep it secure.',script:'Model bringing an object to the post office, choosing a fitting box, and wrapping/packing it securely with recycled packing material.'},{title:'Tape & Address It',prompt:'Close it securely and write where it should go.',cue:'Tape the box and add the recipient/address.',script:'Model taping the package closed and writing the recipient/address on top.'},{title:'Weigh the Package',prompt:'How much does it weigh?',cue:'A scale is a tool used to see how much something weighs.',script:'Show how a postal employee weighs the package on a scale to help determine postage.'}]}]]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday,runner=params.get('eeaRunner')==='1';let i=Math.max(0,Math.min(items.length-1,Number(params.get('item'))||0)),step=Math.max(0,Number(params.get('step'))||0),visualToken=0;const slot=()=>`week8-centers-${dayName.toLowerCase()}-${i}`+(items[i]?.steps?`-step-${step}`:'');async function applyVisual(d){const token=++visualToken;let src='';try{await EEAVisualStore.migrate();src=await EEAVisualStore.get(slot())}catch(e){}if(token!==visualToken)return;$('pic').src=src||d.steps?.[step]?.img||d.img;$('restoreVisual').style.display=src?'inline-block':'none'}function render(){const d=items[i],s=d.steps?.[step];$('pic').src=d.steps?.[step]?.img||d.img;applyVisual(d);$('title').textContent=s?.title||d.title;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker+(d.steps?` · STEP ${step+1}/${d.steps.length}`:'');$('prompt').textContent=s?.prompt||d.prompt;$('cue').textContent=s?.cue||d.cue;$('noteTitle').textContent=s?.title||d.title;$('notes').textContent=(s?.script||'')+(d.teacherNote?'\n\n'+d.teacherNote:'')||(d.revisit?'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Review Original Introduction if the group needs the full teaching sequence.':'');$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='FOCUS ON 3s · WEEK 8 · '+dayName.toUpperCase();$('review').style.display=d.revisit?'inline-block':'none';$('doneBtn').textContent=d.steps&&step<d.steps.length-1?'Next Step →':i<items.length-1?'Next Center →':'Done ✓';$('panel').classList.remove('open')}function back(){location.href='daily-lessons.html?week=8&day='+Math.max(0,['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(dayName))}$('back').onclick=back;$('doneBtn').onclick=()=>{const d=items[i];if(d.steps&&step<d.steps.length-1){step++;render()}else if(i<items.length-1){i++;step=0;render()}else if(!runner)back()};$('teacherBtn').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('review').onclick=()=>{const d=items[i];if(d.revisit)location.href='week8-intro-centers.html?day='+d.revisit.day+'&item='+d.revisit.item+'&review=1'};$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);
