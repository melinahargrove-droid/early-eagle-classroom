<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Today’s Plan</title><style>:root{--navy:#165487;--line:#c9dadd;--green:#e8f3df;--blue:#e6f1fb;--gold:#fff1c9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf7ec,#eef4ef);font-family:"Trebuchet MS",Arial,sans-serif;color:#174f76}.page{min-height:100vh;padding:14px 24px}.top{text-align:center}.top h1{margin:0;color:var(--navy);font-size:38px}.top p{margin:4px 0 12px;font-weight:900;color:#52717a}.days{display:flex;justify-content:center;gap:6px;margin-bottom:10px}.days button{border:1px solid var(--line);border-radius:999px;background:#fffdf8;padding:8px 18px;font-weight:900;color:#52717a;cursor:pointer}.days button.active{background:#6f9ead;color:white}.card{max-width:1370px;margin:auto;background:#fffdf8;border:1.5px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 28px rgba(65,92,96,.1)}.head{padding:12px 24px;border-bottom:1px solid #e1e8e5}.head h2{margin:0;color:var(--navy);font-size:28px}.row{display:grid;grid-template-columns:90px 48px 1fr 160px;align-items:center;min-height:54px;padding:4px 22px;border-top:1px solid #e5eae6}.time{font-size:17px;font-weight:900;color:var(--navy)}.ico{font-size:27px;text-align:center}.what b{display:block;font-size:18px;color:var(--navy)}.what span{font-size:13px;color:#55747b}.open{border:1px solid #bad6b0;background:var(--green);color:#426f49;border-radius:11px;padding:8px;font-weight:900;cursor:pointer}.read{background:var(--blue);border-color:#bad7ed;color:#275d87}.directions{background:var(--gold);border-color:#e8cc84;color:#856323}.routine .open{visibility:hidden}.footer{padding:10px;text-align:center;color:#829491;font-size:12px}</style></head><body><main class="page"><div class="top"><h1>Today’s Plan</h1><p id="sub"></p></div><div class="days" id="days"></div><section class="card"><div class="head"><h2 id="heading"></h2></div><div id="rows"></div><div class="footer">Week 6 production build • custom story illustrations deferred to visual production pass.</div></section></main><script>(()=>{const names=['Monday','Tuesday','Wednesday','Thursday','Friday'];let day='Monday';const community={Monday:'Tree Pose',Tuesday:'Conversation • What can you do when you feel bored?',Wednesday:'We Are Walking… • Neighborhood game',Thursday:'Weather Noticing Breath',Friday:'All Is Well + Week Reflection'},reads={Monday:'My Day with Gong Gong • Read 3',Tuesday:'My Day with Gong Gong • Read 4',Wednesday:'Goodbye Summer, Hello Autumn • Read 1',Thursday:'Goodbye Summer, Hello Autumn • Read 2',Friday:'Goodbye Summer, Hello Autumn • Read 3'},centers={Monday:'Art Studio • Exploring Beautiful Stuff + Art Easel • Add Yellow',Tuesday:'Blocks • Building Where We Live + Dramatic Play • Caring for Babies',Wednesday:'Discovery • Mixing Salt Dough + Library & Listening • Retelling Stories',Thursday:'Science & Engineering • Observing Weather + Writing & Drawing • Drawing Feelings',Friday:'Continue Centers'},foundational={Monday:'Letter ID • Hh, Gg',Tuesday:'Concepts of Print • “Me in My Community” • Return Sweep',Wednesday:'Letter ID • Hh, Gg • Sky Writing',Thursday:'Concepts of Print • “Me in My Community” • Return Sweep',Friday:'Letter Review • Mm, Aa, Ll, Oo, Hh, Gg • Guessing Game'},stories={Monday:'The Long Way to the Corner Store',Tuesday:'The Yellow Button',Wednesday:'The Wind That Changed the Walk',Thursday:'The Little Weather Reporter',Friday:'You Tell a Community Story'},closing={Monday:'What Helped Them Communicate?',Tuesday:'Acting Reflection',Wednesday:'What Changed Outside?',Thursday:'Weather Detective',Friday:'One Change I Noticed'};const base=[['8:10','🌞','Community Meeting','', 'community'],['8:20','📖','Read Aloud','', 'read'],['8:45','🥣','Breakfast','',null],['9:00','🖍️','Intro to Centers','', 'introcenters'],['9:10','🧺','Centers','Choose where friends will play and learn','centers'],['during','🔤','Foundational Literacy','', 'foundational'],['during','🙂','Literacy Small Group','Writing Basics • Skills Reinforcement • Sequencing Cards • Fine Motor Development','smallgroup'],['during','🔢','Building Blocks','Daily numeracy, patterns, counting, and number experiences','building'],['10:15','🛝','Recess','',null],['11:00','🍽️','Lunch','',null],['After lunch','🌙','Nap','',null],['2:00','🍎','Snack','',null],['2:30+','💭','Storytelling','', 'story'],['2:30+','❤️','Closing Circle','', 'closing']];function render(){sub.textContent=day+' • Week 6';heading.textContent=day+'’s Plan';days.innerHTML=names.map(n=>`<button data-day="${n}" class="${n===day?'active':''}">${n}</button>`).join('');rows.innerHTML=base.map(r=>{let detail=r[3];if(r[2]==='Community Meeting')detail=community[day];if(r[2]==='Read Aloud')detail=reads[day];if(r[2]==='Intro to Centers')detail=centers[day];if(r[2]==='Foundational Literacy')detail=foundational[day];if(r[2]==='Storytelling')detail=stories[day];if(r[2]==='Closing Circle')detail=closing[day];const routine=!r[4],cls=r[4]==='read'?'open read':['smallgroup','foundational','building'].includes(r[4])?'open directions':'open';return `<div class="row ${routine?'routine':''}"><div class="time">${r[0]}</div><div class="ico">${r[1]}</div><div class="what"><b>${r[2]}</b><span>${detail}</span></div><button class="${cls}" ${r[4]?`data-lesson="${r[4]}"`:''}>${r[4]==='read'?'Read Aloud':r[4]==='smallgroup'?'Choose Activity':r[4]==='centers'?'Choose Centers':r[4]?'Open Lesson':''}</button></div>`}).join('')}document.addEventListener('click',e=>{const d=e.target.closest('[data-day]');if(d){day=d.dataset.day;render();return}const b=e.target.closest('[data-lesson]');if(!b)return;const l=b.dataset.lesson,paths={community:'community-meeting-week6.html',read:'week6-read-aloud.html',introcenters:'week6-intro-centers.html',centers:'week6-centers.html',foundational:'week6-foundational.html',smallgroup:'week6-small-groups.html',building:'week6-building-blocks.html',story:'week6-storytelling.html',closing:'closing-circle-week6.html'};location.href=`${paths[l]}?day=${encodeURIComponent(day)}&from=plan`});render()})();</script></body></html>
