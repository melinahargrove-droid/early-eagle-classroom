<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 4 Storytelling</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea);color:#174f7d}.page{height:100vh;padding:3vh 5vw}.top{height:9vh;font-weight:900;letter-spacing:.12em;color:#789697}.card{height:75vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:45% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.visual{height:56vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;font-size:26px;font-weight:900;color:#527673}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:54px;line-height:1;margin:1vh 0;color:#164f7f}.lead{font-size:23px;line-height:1.4;font-weight:900;color:#527673}.cue{margin-top:2vh;background:#e7f0ed;border-radius:18px;padding:1.4vh 1.2vw;font-size:18px;font-weight:900;color:#416d61}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.panel{display:none;position:fixed;right:4vw;top:10vh;width:42vw;max-height:78vh;overflow:auto;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:25px;padding:3vh 2vw;box-shadow:0 15px 35px #0002}.panel.open{display:block}.panel h2{color:#164f7f}.panel p{white-space:pre-line;font:17px/1.5 Georgia,serif;color:#3e5f5c}</style></head><body><main class="page"><div class="top">EARLY EAGLE ACADEMY · STORYTELLING · WEEK 4</div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="cue" id="cue"></div></div></section><div class="bottom"><button id="storyBtn">⌃ Teacher Story</button><button onclick="location.href='week4-plan.html'">Done ✓</button></div><aside class="panel" id="panel"><h2 id="pt"></h2><p id="text"></p></aside></main><script>const d={Monday:{title:'The Blue Paint Drop',visual:'Visual placeholder: a child at an easel watching one blue drop slide down a painting.',lead:'Picture a bright easel, one blue paint cup, and a drop that does something unexpected.',cue:'Story Acting: paint carefully, notice the drip, feel frustrated, pause, and discover a new idea.',text:`Milo dipped his brush into the blue paint. Today was his first day painting at the easel, and he had a plan. He wanted to paint a big blue lake.\n\nHe pulled the brush across the paper. Swish. Swish. The lake grew wider.\n\nThen a fat drop of blue paint rolled off his brush. It landed near the top of the paper.\n\nPlop.\n\nBefore Milo could touch it, the drop began sliding down.\n\n“Stop!” Milo whispered.\n\nThe drop did not stop. It made a long blue trail right through his lake. Milo’s shoulders tightened. “That wasn’t my plan.”\n\nHe almost rubbed the paper with his hand. Then he remembered how the class had practiced slowing their bodies. Milo put the brush down and took one slow breath.\n\nHe looked again. The blue trail curved all the way to the bottom of the page.\n\n“It looks like a river,” he said.\n\nMilo picked up his brush. He added tiny blue lines beside the trail. Then he painted a little bridge over it.\n\nWhen he stepped back, his picture was not the lake he had planned. It was a lake with a river and a bridge.\n\nMilo smiled. “I didn’t plan the drop,” he said, “but I like where it went.”`},Tuesday:{title:'The Long Way Home',visual:'Visual placeholder: child and caregiver walking through a neighborhood past a library, bakery, and park.',lead:'Imagine walking home when the usual street is closed and you have to choose another way.',cue:'Story Acting: walk, find the closed street, feel disappointed, look around, and discover new neighborhood places.',text:`Lena and Papa always walked home the same way. They passed the red mailbox, the little tree with the crooked trunk, and the corner where a dog sometimes barked hello.\n\nBut today a bright orange sign blocked their street.\n\n“Road closed,” Papa read. “We have to go another way.”\n\nLena frowned. “But this is OUR way.”\n\n“I know,” Papa said. “It feels strange when a plan changes.”\n\nThey turned down a street Lena had never walked before. First they passed a library. Through the window, Lena saw rows and rows of books.\n\nThen they passed a bakery. Warm, sweet air floated out the door.\n\nNext they came to a tiny park with two benches and a garden full of yellow flowers.\n\nLena slowed down. “I didn’t know this was here.”\n\nPapa smiled. “Neither did I.”\n\nThe new way home took longer. Lena still missed the crooked tree and the barking dog. But when they reached their house, she had a new idea.\n\n“Tomorrow,” she said, “can we take the long way again?”`},Wednesday:{title:'The Playdough Problem',visual:'Visual placeholder: children mixing a bowl of playdough that looks sticky and messy.',lead:'Picture a bowl of ingredients changing as three friends try to make playdough together.',cue:'Story Acting: pour, stir, notice sticky dough, share ideas, make a change, and try again.',text:`Nora, Jay, and Cam were helping make playdough. Nora poured. Jay stirred. Cam watched the mixture swirl around the bowl.\n\nAt first it looked powdery. Then lumpy. Then very, very sticky.\n\nJay lifted the spoon. A long stretchy blob followed it into the air.\n\n“Uh-oh,” he said.\n\nCam touched one finger to the dough. It stuck to him. “It’s glue-dough!”\n\nEveryone laughed, but Nora looked worried. “Did we ruin it?”\n\nThey looked closely at the mixture. They talked about what they noticed. Their teacher helped them think about what the recipe needed next.\n\nThey made one small change and stirred again.\n\nRound and round went the spoon. Slowly, the sticky mixture began pulling away from the bowl.\n\nCam pressed it gently. “It feels like playdough now!”\n\nThe three friends rolled it into one giant ball.\n\nNora smiled. “It changed a lot.”\n\nJay nodded. “So did our plan.”`},Thursday:{title:'The Closed Library Door',visual:'Visual placeholder: child and aunt standing at a library door with a CLOSED sign.',lead:'Imagine being excited for something special and finding out it cannot happen the way you planned.',cue:'Story Acting: hurry to the library, discover it is closed, show disappointment, breathe, and make a new special plan.',text:`Every Thursday, Theo and Auntie Rae went to the library after school. Theo loved pushing the heavy glass door and choosing one book for Auntie Rae to read that night.\n\nThis Thursday, Theo hurried up the steps. He reached for the handle.\n\nIt did not move.\n\nOn the door was a sign: CLOSED.\n\nTheo stared at it. “But it’s Thursday.”\n\nAuntie Rae read the sign. “The library had to close early today.”\n\nTheo’s eyes filled with tears. “But this is our library day.”\n\nAuntie Rae sat beside him on the step. She did not tell him to cheer up. She just stayed close.\n\nAfter a while, Theo took a slow breath.\n\n“I still wanted a story,” he said.\n\nAuntie Rae thought. “What if we make one?”\n\nSo they walked home slowly. Theo invented a story about a purple cat who lived inside a clock. Auntie Rae added a tiny mouse who wore yellow boots.\n\nBy the time they reached home, Theo was laughing.\n\nThe library had been closed. Theo was still disappointed. But Thursday had found a different kind of story.`},Friday:{title:'You Tell a Saturday Story',visual:'Visual placeholder: neighborhood places and a child imagining a day with someone special.',lead:'Today you are the storyteller. Imagine a special day with someone you care about.',cue:'Prompts: Where do you go? What are you excited about? What changes or goes wrong? What do you do next?',text:`Invite a child to tell an original story about a special day with someone they care about.\n\nSupport only as needed: Who is with you? Where are you going? What are you excited to do? Does anything change or go wrong? How does your character feel? What happens next? How does the story end?\n\nLet the child’s ideas lead. Invite classmates to act out the story when appropriate.`}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday;eye.textContent=day.toUpperCase()+(day==='Friday'?' · CHILD STORYTELLER':' · TEACHER STORY');title.textContent=x.title;visual.textContent=x.visual;lead.textContent=x.lead;cue.textContent=x.cue;pt.textContent=x.title;text.textContent=x.text;if(day==='Friday')storyBtn.textContent='⌃ Teacher Prompt';storyBtn.onclick=()=>panel.classList.toggle('open');</script></body></html>
