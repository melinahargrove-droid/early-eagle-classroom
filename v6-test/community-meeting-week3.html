<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Week 3 Community Meeting</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%);overflow:hidden}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px);line-height:1}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:rgba(214,232,237,.8);color:#386d80;font-weight:900;font-size:clamp(12px,.82vw,16px)}.close{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#174f7d;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(92,136,147,.2);border-radius:34px;background:rgba(255,254,249,.94);box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:rgba(217,234,238,.8);color:#4f7c89;font-weight:900;letter-spacing:.06em;font-size:clamp(11px,.72vw,14px)}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.placeholder{width:min(36vw,600px);height:min(59vh,560px);border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#557876;font-size:clamp(22px,1.6vw,30px);font-weight:900}.copy{text-align:left}.eyebrow{color:#799597;font-size:clamp(12px,.8vw,15px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px);line-height:1}.copy p{margin:1.4vh 0;color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38;max-width:39vw}.steps{display:grid;gap:1vh;margin-top:1.8vh;max-width:39vw}.step{padding:1vh 1.3vw;border-radius:17px;background:rgba(226,238,236,.72);color:#4f765e;font-size:clamp(17px,1.16vw,23px);font-weight:900}.quote{margin-top:2vh;padding:1.5vh 1.6vw;border-radius:20px;background:#e8f1ed;color:#426f65;font-size:clamp(24px,1.9vw,36px);font-weight:900;line-height:1.25;max-width:39vw}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.6vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 12px 30px rgba(44,67,68,.15);display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}.source{position:absolute;right:3%;bottom:2.15%;color:#aebbb8;font-size:clamp(8px,.52vw,10px);font-weight:700;opacity:.78}
</style></head>
<body><main class="page">
<header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header>
<section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section>
<button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><div class="panel" id="panel"></div><div class="source">Focus on Pre-K · Unit 1 · Week 3</div>
</main>
<script>(()=>{
const dayNames=['Monday','Tuesday','Wednesday','Thursday','Friday'];const params=new URLSearchParams(location.search);let day=dayNames.findIndex(x=>x.toLowerCase()===(params.get('day')||'monday').toLowerCase());if(day<0)day=0;let i=0;
const prompts=['What is something you like to do with your family?','How can you help a friend?','What is something you like to do with your family?','How can you help a friend?','Choose the question that is most accessible for today’s group.'];
function cardsForDay(){return [
{label:'MINDFUL PRACTICE',eye:dayNames[day]+' · Bunny Breath',title:'Bunny Breath',art:'Visual placeholder: child pretending to be a little bunny and breathing calmly.',body:'Breathing like a bunny is both calming and energizing!',extra:'<div class="steps"><div class="step">Sit with a straight back.</div><div class="step">Take 3 little sniffs in through your nose.</div><div class="step">Breathe out slowly through your mouth.</div><div class="step">Repeat 3–5 times, then breathe normally.</div></div>'},
{label:'CONVERSATION',eye:dayNames[day]+' · Conversation',title:'Let’s Talk',art:'Visual placeholder: preschool friends talking and listening in a circle.',body:'A few friends can share an idea today.',extra:'<div class="quote">'+prompts[day]+'</div>'},
{label:'GAME',eye:dayNames[day]+' · Name Songs',title:'Sing Our Names',art:'Visual placeholder: preschool children singing together in a circle.',body:'Sing a familiar song that lets us put each friend’s name into the song.',extra:'<div class="steps"><div class="step">Possible choices: We’re All a Family Under One Sky</div><div class="step">The More We Get Together</div><div class="step">Willaby Wallaby Woo</div><div class="step">The Name Game</div></div>'}
]}
const cardsBox=document.getElementById('cards'),dots=document.getElementById('dots'),badge=document.getElementById('badge'),prev=document.getElementById('prev'),next=document.getElementById('next'),weekLabel=document.getElementById('weekLabel'),panel=document.getElementById('panel');
function teacherText(){return '<strong>Teacher guidance:</strong> Choose the conversation question that is most accessible to children in your classroom community; sharing about families may be complicated for some children. Let only a few children respond each day and keep track so others have opportunities later in the week. Notice how children respond to quiet breathing, which name songs they prefer, and how they manage themselves in the group.'}
function render(){const cards=cardsForDay();cardsBox.innerHTML=cards.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="placeholder">${c.art}</div></div><div class="copy"><div class="eyebrow">${c.eye}</div><h2>${c.title}</h2><p>${c.body}</p>${c.extra||''}</div></article>`).join('');dots.innerHTML=cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');badge.textContent=cards[i].label+' · '+(i+1)+' OF '+cards.length;weekLabel.textContent='WEEK 3 · '+dayNames[day].toUpperCase();prev.disabled=i===0;next.textContent=i===cards.length-1?'Done ✓':'Next →';panel.innerHTML=teacherText()}
prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{const cards=cardsForDay();if(i<cards.length-1){i++;render()}else location.href='week3-plan.html'};document.getElementById('closeBtn').onclick=()=>location.href='week3-plan.html';document.getElementById('teacher').onclick=()=>panel.classList.toggle('open');render();
})();</script></body></html>
