<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 3 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%);overflow:hidden}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px)}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:#d6e8ed;color:#386d80;font-weight:900}.close{width:56px;height:56px;border-radius:50%;border:1px solid #ccd9d6;background:#fffdf8;color:#174f7d;font-size:28px;font-weight:900}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid #d4e1de;border-radius:34px;background:#fffef9;overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:#d9eaee;color:#4f7c89;font-weight:900}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.cue{width:min(36vw,600px);height:min(59vh,560px);border-radius:30px;background:#eaf3ee;display:flex;align-items:center;justify-content:center;padding:2vw}.cue img{width:100%;height:100%;object-fit:contain;border-radius:22px}.copy h2{margin:1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px)}.eyebrow{color:#799597;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy p{color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38}.steps{display:grid;gap:1vh}.step,.quote{padding:1vh 1.3vw;border-radius:17px;background:#e2eeec;color:#4f765e;font-size:clamp(17px,1.16vw,23px);font-weight:900}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button,.teacher{border:1px solid #ccd9d6;border-radius:18px;padding:1vh 1.4vw;font-weight:900}.next{background:#668f99;color:#fff}.dots{display:flex;gap:.55vw}.dot{width:13px;height:13px;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);background:#fffdf8;color:#315f70}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;display:none}.panel.open{display:block}.source{position:absolute;right:3%;bottom:2.15%;color:#aebbb8;font-size:10px}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ Teacher Note</button><div class="panel" id="panel"></div><div class="source" id="source"></div></main><script>(()=>{const VISKEY='eea-custom-visuals-v1';function custom(){try{return JSON.parse(localStorage.getItem(VISKEY)||'{}')||{}}catch(e){return{}}}const v=custom(),pic=(slot,fallback)=>v[slot]||fallback;const monday=[{label:'MINDFUL PRACTICE',eye:'Monday · Bunny Breath',title:'Sit Like a Bunny',img:pic('week3-bunny-sit','assets/community/week3-bunny-sit.svg'),caption:'Sit tall like a little bunny.',body:'Breathing like a bunny can help our bodies feel calm and ready.',extra:'<div class="step">Sit with a straight back and get comfortable.</div>'},{label:'BUNNY BREATH',eye:'Monday · Bunny Breath',title:'Sniff, Sniff, Sniff',img:pic('week3-bunny-sniff','assets/community/week3-bunny-sniff.svg'),caption:'Three tiny sniffs in.',body:'Pretend you are a little bunny sniffing around.',extra:'<div class="steps"><div class="step">Take 3 little sniffs in through your nose.</div><div class="step">Then breathe out slowly through your mouth.</div></div>'},{label:'BUNNY BREATH',eye:'Monday · Bunny Breath',title:'Breathe & Notice',img:pic('week3-bunny-calm','assets/community/week3-bunny-calm.svg'),caption:'Slow breath. Calm body.',body:'Repeat 3–5 times. Then close your eyes and breathe normally.',extra:'<div class="step">Notice how your body feels.</div>'}];const tuesday=[{label:'CONVERSATION',eye:'Tuesday · Conversation',title:'Think of Your Idea',img:'assets/community/week3-think-idea.svg',body:'Today we will share one idea with our classroom community.',extra:'<div class="step">Choose the question that feels best for our group today.</div>'},{label:'CONVERSATION',eye:'Tuesday · Conversation',title:'Let’s Talk',img:'assets/community/week3-family-friends-talk.svg',body:'Choose one question:',extra:'<div class="steps"><div class="step">What is something you like to do with your family?</div><div class="step">How can you help a friend?</div></div>'},{label:'SHARE',eye:'Tuesday · Conversation',title:'A Few Friends Share',img:'assets/community/week3-share-listen.svg',body:'A few friends can tell us their ideas today.',extra:'<div class="step">Listen while each friend shares.</div>'}];const wednesday=[{label:'GAME',eye:'Wednesday · Name Songs',title:'Get Ready to Sing',img:'assets/community/week3-name-listen.svg',body:'Today our game is a song that uses our friends’ names.',extra:'<div class="step">Listen for your name!</div>'},{label:'NAME SONGS',eye:'Wednesday · Name Songs',title:'Sing Our Names',img:'assets/community/week3-name-sing.svg',body:'Choose a familiar name song and put each child’s name into it.',extra:'<div class="step">Sing together.</div>'},{label:'NAME SONGS',eye:'Wednesday · Name Songs',title:'Everybody Belongs',img:'assets/community/week3-name-belong.svg',body:'Keep singing until several friends have heard their names.',extra:'<div class="step">Every name belongs.</div>'}];const thursday=[{label:'EEA EXTENSION',eye:'Thursday · Listening Like Rabbit',title:'What Does Listening Look Like?',img:'assets/community/week3-listening-ready.svg',body:'Show me what your body looks like when you are really listening.'},{label:'PARTNER PRACTICE',eye:'Thursday · Listening Like Rabbit',title:'Tell Me One Thing',img:'assets/community/week3-partner-talk-listen.svg',body:'One friend tells one small thing about today.',extra:'<div class="quote">The other friend just listens.</div>'},{label:'SWITCH',eye:'Thursday · Listening Like Rabbit',title:'Now Switch!',img:'assets/community/week3-partner-switch.svg',body:'Now the listener gets a turn to speak.'}];const friday=[{label:'EEA EXTENSION',eye:'Friday · Feelings Freeze',title:'Pick a Feeling',img:'assets/community/week3-feelings-pick.svg',body:'Think of one feeling we talked about this week.'},{label:'FEELINGS GAME',eye:'Friday · Feelings Freeze',title:'Show It — No Words!',img:'assets/community/week3-feelings-freeze.svg',body:'Use your face and body to show the feeling without saying its name.',extra:'<div class="quote">Freeze!</div>'},{label:'GUESS & CONNECT',eye:'Friday · Feelings Freeze',title:'What Feeling Do You See?',img:'assets/community/week3-feelings-guess.svg',body:'Friends guess the feeling.'}];const allDays=[monday,tuesday,wednesday,thursday,friday],dayNames=['Monday','Tuesday','Wednesday','Thursday','Friday'];const params=new URLSearchParams(location.search);let day=Math.max(0,dayNames.findIndex(x=>x.toLowerCase()===(params.get('day')||'Monday').toLowerCase())),i=0;function render(){const cards=allDays[day],c=cards[i];cardsBox.innerHTML=cards.map((x,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="cue"><img src="${x.img}" alt=""></div></div><div class="copy"><div class="eyebrow">${x.eye}</div><h2>${x.title}</h2><p>${x.body}</p>${x.extra||''}</div></article>`).join('');dots.innerHTML=cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');badge.textContent=c.label+' · '+(i+1)+' OF '+cards.length;weekLabel.textContent='WEEK 3 · '+dayNames[day].toUpperCase();prev.disabled=i===0;next.textContent=i===cards.length-1?'Done ✓':'Next →';panel.innerHTML='<strong>Teacher Note:</strong> Use the lesson guidance for today.';source.textContent='Focus on Pre-K · Unit 1 · Week 3'}prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<allDays[day].length-1){i++;render()}else location.href='week3-plan.html'};closeBtn.onclick=()=>location.href='week3-plan.html';teacher.onclick=()=>panel.classList.toggle('open');render()})();</script></body></html>
