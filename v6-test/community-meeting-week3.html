e',title:'Repeat & Settle',img:'assets/community/week3-bunny-calm.svg',caption:'3–5 times, then breathe normally.',body:'When you are done, close your eyes and breathe normally.',extra:''}];const songs=[{label:'NAME SONGS',eye:'Community Meeting Game',title:'Sing Our Names',img:'assets/community/week3-name-sing.svg',caption:'Put each friend’s name into a song.',body:'Choose a familiar song where each child’s name can be inserted.',extra:'<div class="steps"><div class="step">We’re All a Family Under One Sky</div><div class="step">The More We Get Together</div><div class="step">Willaby Wallaby Woo</div><div class="step">The Name Game</div></div>'},{label:'NAME SONGS',eye:'Community Meeting Game',title:'Notice Our Favorite',img:'assets/community/week3-name-belong.svg',caption:'Which name song does our class enjoy?',body:'Continue giving children opportunities to hear their names in the song.',extra:''}];const all=[bunny,songs,songs,bunny,bunny],cards=all[day];let i=0;const $=id=>document.getElementById(id);function render(){$('cards').innerHTML=cards.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="cue"><img src="${c.img}" alt="${c.caption}"></div></div><div class="copy"><div class="eyebrow">${c.eye}</div><h2>${c.title}</h2><p>${c.body}</p>${c.extra}</div></article>`).join('');$('dots').innerHTML=cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');$('badge').textContent=cards[i].label+' · '+(i+1)+' OF '+cards.length;$('weekLabel').textContent='FOCUS ON 3s · WEEK 3 · '+days[day].toUpperCase();$('prev').disabled=i===0;$('next').textContent=i===cards.length-1?'Done ✓':'Next →';$('panel').innerHTML=day===1||day===2?'<strong>Focus on 3s:</strong> Sing a song into which each child’s name can be inserted. Notice which name song children like and whether the group develops a favorite.':'<strong>Focus on 3s:</strong> Sit with a straight back. Take three sniffs in through the nose, then breathe out slowly through the
