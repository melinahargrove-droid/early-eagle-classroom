<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 3 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%);overflow:hidden}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px);line-height:1}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:rgba(214,232,237,.8);color:#386d80;font-weight:900;font-size:clamp(12px,.82vw,16px)}.close{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#174f7d;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(92,136,147,.2);border-radius:34px;background:rgba(255,254,249,.94);box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:rgba(217,234,238,.8);color:#4f7c89;font-weight:900;letter-spacing:.06em;font-size:clamp(11px,.72vw,14px)}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.cue{width:min(36vw,600px);height:min(59vh,560px);border-radius:30px;background:radial-gradient(circle at 50% 38%,#fffdf8 0,#eaf3ee 62%,#dbe9e5 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw;box-shadow:inset 0 0 0 1px rgba(96,140,145,.13)}.cue .icon{font-size:clamp(105px,10vw,180px);line-height:1;margin-bottom:2vh}.cue .caption{color:#557876;font-size:clamp(18px,1.25vw,24px);font-weight:900;max-width:25vw;line-height:1.25}.copy{text-align:left}.eyebrow{color:#799597;font-size:clamp(12px,.8vw,15px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px);line-height:1}.copy p{margin:1.4vh 0;color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38;max-width:39vw}.steps{display:grid;gap:1vh;margin-top:1.8vh;max-width:39vw}.step{padding:1vh 1.3vw;border-radius:17px;background:rgba(226,238,236,.72);color:#4f765e;font-size:clamp(17px,1.16vw,23px);font-weight:900}.quote{margin-top:2vh;padding:1.5vh 1.6vw;border-radius:20px;background:#e8f1ed;color:#426f65;font-size:clamp(24px,1.9vw,36px);font-weight:900;line-height:1.25;max-width:39vw}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.6vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 12px 30px rgba(44,67,68,.15);display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}.source{position:absolute;right:3%;bottom:2.15%;color:#aebbb8;font-size:clamp(8px,.52vw,10px);font-weight:700;opacity:.78}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><div class="panel" id="panel"></div><div class="source" id="source"></div></main><script>(()=>{const monday=[{label:'MINDFUL PRACTICE',eye:'Monday · Bunny Breath',title:'Sit Like a Bunny',icon:'🐰',caption:'Sit tall and get comfortable.',body:'Breathing like a bunny can help our bodies feel calm and ready.',extra:'<div class="step">Sit with a straight back and get comfortable.</div>'},{label:'BUNNY BREATH',eye:'Monday · Bunny Breath',title:'Sniff, Sniff, Sniff',icon:'🐇',caption:'Three tiny sniffs in.',body:'Pretend you are a little bunny sniffing around.',extra:'<div class="steps"><div class="step">Take 3 little sniffs in through your nose.</div><div class="step">Then breathe out slowly through your mouth.</div></div>'},{label:'BUNNY BREATH',eye:'Monday · Bunny Breath',title:'Breathe & Notice',icon:'🌿',caption:'Slow breath. Calm body.',body:'Repeat 3–5 times. Then close your eyes and breathe normally.',extra:'<div class="step">Notice how your body feels.</div>'}];const tuesday=[{label:'CONVERSATION',eye:'Tuesday · Conversation',title:'Think of Your Idea',icon:'💭',caption:'Think quietly first.',body:'Today we will share one idea with our classroom community.',extra:'<div class="step">Choose the question that feels best for our group today.</div>'},{label:'CONVERSATION',eye:'Tuesday · Conversation',title:'Let’s Talk',icon:'💬',caption:'Families and friends give us ideas to share.',body:'Choose one question:',extra:'<div class="steps"><div class="step">What is something you like to do with your family?</div><div class="step">How can you help a friend?</div></div>'},{label:'SHARE',eye:'Tuesday · Conversation',title:'A Few Friends Share',icon:'👂',caption:'One friend talks. We listen.',body:'A few friends can tell us their ideas today.',extra:'<div class="step">Listen while each friend shares. More friends will get a turn another day.</div>'}];const wednesday=[{label:'GAME',eye:'Wednesday · Name Songs',title:'Get Ready to Sing',icon:'🎵',caption:'Listen for your name!',body:'Today our game is a song that uses our friends’ names.',extra:'<div class="step">Listen for your name!</div>'},{label:'NAME SONGS',eye:'Wednesday · Name Songs',title:'Sing Our Names',icon:'🎶',caption:'Sing each friend’s name.',body:'Choose a familiar name song and put each child’s name into it.',extra:'<div class="steps"><div class="step">The More We Get Together</div><div class="step">Willaby Wallaby Woo</div><div class="step">The Name Game</div></div>'},{label:'NAME SONGS',eye:'Wednesday · Name Songs',title:'Everybody Belongs',icon:'🫶',caption:'Every name belongs in our circle.',body:'Keep singing until several friends have heard their names.',extra:'<div class="step">Notice which song our class enjoys most.</div>'}];const thursday=[{label:'EEA EXTENSION',eye:'Thursday · Listening Like Rabbit',title:'What Does Listening Look Like?',icon:'👂',caption:'Eyes and body ready to listen.',body:'In The Rabbit Listened, Rabbit helped by staying close and listening.',extra:'<div class="step">Show me what your body looks like when you are really listening.</div>'},{label:'PARTNER PRACTICE',eye:'Thursday · Listening Like Rabbit',title:'Tell Me One Thing',icon:'🗣️',caption:'One talks. One listens.',body:'Turn to a partner. One friend tells one small thing about today.',extra:'<div class="quote">The other friend just listens.</div>'},{label:'SWITCH',eye:'Thursday · Listening Like Rabbit',title:'Now Switch!',icon:'🔄',caption:'Trade jobs with your partner.',body:'Now the listener gets a turn to speak.',extra:'<div class="step">We can help a friend by giving them time and attention.</div>'}];const friday=[{label:'EEA EXTENSION',eye:'Friday · Feelings Freeze',title:'Pick a Feeling',icon:'🙂',caption:'Think of a feeling.',body:'Think of one feeling we talked about this week.',extra:'<div class="step">Happy · sad · angry · worried · excited · calm</div>'},{label:'FEELINGS GAME',eye:'Friday · Feelings Freeze',title:'Show It — No Words!',icon:'🎭',caption:'Use your face and body.',body:'Use your face and body to show the feeling without saying its name.',extra:'<div class="quote">Freeze!</div>'},{label:'GUESS & CONNECT',eye:'Friday · Feelings Freeze',title:'What Feeling Do You See?',icon:'🔎',caption:'Look for face and body clues.',body:'Friends guess the feeling, then we choose another friend to show one.',extra:'<div class="step">Our faces and bodies can give clues about how we feel.</div>'}];const allDays=[monday,tuesday,wednesday,thursday,friday],dayNames=['Monday','Tuesday','Wednesday','Thursday','Friday'];const params=new URLSearchParams(location.search);let day=Math.max(0,dayNames.findIndex(x=>x.toLowerCase()===(params.get('day')||'Monday').toLowerCase())),i=0;const cardsBox=document.getElementById('cards'),dots=document.getElementById('dots'),badge=document.getElementById('badge'),prev=document.getElementById('prev'),next=document.getElementById('next'),weekLabel=document.getElementById('weekLabel'),panel=document.getElementById('panel'),source=document.getElementById('source');function currentCards(){return allDays[day]}function teacherText(){if(day===0)return '<strong>Curriculum activity:</strong> Bunny Breath. Model three short sniffs through the nose followed by one slow breath out through the mouth. Repeat 3–5 times, then return to normal breathing.';if(day===1)return '<strong>Curriculum activity:</strong> Conversation Prompt. Choose either “What is something you like to do with your family?” or “How can you help a friend?” based on what is most accessible for the class. Invite only a few children to respond and keep track of turns across the week.';if(day===2)return '<strong>Curriculum activity:</strong> Name Songs. Use a familiar song that allows each child’s name to be inserted. Notice which songs the class prefers.';if(day===3)return '<strong>EEA Thursday extension:</strong> This activity connects directly to <em>The Rabbit Listened</em>. Keep the partner turns brief and focus on what listening looks and feels like rather than requiring a long conversation.';return '<strong>EEA Friday extension:</strong> Feelings Freeze revisits the week’s work with <em>Sometimes I’m Bombaloo</em>, Feeling Masks, and noticing facial/body clues. Children may pass or copy a teacher-modeled feeling if they need support.'}function render(){const cards=currentCards();cardsBox.innerHTML=cards.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="cue"><div class="icon">${c.icon}</div><div class="caption">${c.caption}</div></div></div><div class="copy"><div class="eyebrow">${c.eye}</div><h2>${c.title}</h2><p>${c.body}</p>${c.extra||''}</div></article>`).join('');dots.innerHTML=cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');badge.textContent=cards[i].label+' · '+(i+1)+' OF '+cards.length;weekLabel.textContent='WEEK 3 · '+dayNames[day].toUpperCase();prev.disabled=i===0;next.textContent=i===cards.length-1?'Done ✓':'Next →';panel.innerHTML=teacherText();source.textContent=day<3?'Focus on Pre-K · Unit 1 · Week 3':'Early Eagle Academy · Week 3 Extension'}prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{const cards=currentCards();if(i<cards.length-1){i++;render()}else location.href='week3-plan.html'};document.getElementById('closeBtn').onclick=()=>location.href='week3-plan.html';document.getElementById('teacher').onclick=()=>panel.classList.toggle('open');render()})();</script></body></html>
