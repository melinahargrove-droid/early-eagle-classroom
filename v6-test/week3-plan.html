<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Today’s Plan</title><style>:root{--navy:#165487;--line:#c9dadd;--green:#e8f3df;--blue:#e6f1fb;--gold:#fff1c9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf7ec,#eef4ef);font-family:"Trebuchet MS",Arial,sans-serif;color:#174f76}.page{min-height:100vh;padding:14px 24px}.top{text-align:center}.top h1{margin:0;color:var(--navy);font-size:38px}.top p{margin:4px 0 12px;font-weight:900;color:#52717a}.days{display:flex;justify-content:center;gap:6px;margin-bottom:10px}.days button{border:1px solid var(--line);border-radius:999px;background:#fffdf8;padding:8px 18px;font-weight:900;color:#52717a;cursor:pointer}.days button.active{background:#6f9ead;color:white}.card{max-width:1370px;margin:auto;background:#fffdf8;border:1.5px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 28px rgba(65,92,96,.1)}.head{padding:12px 24px;border-bottom:1px solid #e1e8e5}.head h2{margin:0;color:var(--navy);font-size:28px}.row{display:grid;grid-template-columns:90px 48px 1fr 160px;align-items:center;min-height:58px;padding:5px 22px;border-top:1px solid #e5eae6}.time{font-size:17px;font-weight:900;color:var(--navy)}.ico{font-size:27px;text-align:center}.what b{display:block;font-size:18px;color:var(--navy)}.what span{font-size:13px;color:#55747b}.open{border:1px solid #bad6b0;background:var(--green);color:#426f49;border-radius:11px;padding:8px;font-weight:900;cursor:pointer}.read{background:var(--blue);border-color:#bad7ed;color:#275d87}.directions{background:var(--gold);border-color:#e8cc84;color:#856323}.routine .open{visibility:hidden}.footer{padding:12px;text-align:center;color:#829491;font-size:12px}</style></head><body><main class="page"><div class="top"><h1>Today’s Plan</h1><p id="sub">Monday • Week 3</p></div><div class="days" id="days"></div><section class="card"><div class="head"><h2 id="heading"></h2></div><div id="rows"></div><div class="footer">Population mode • visuals can be replaced later without changing the lesson structure.</div></section></main><script>(()=>{const names=['Monday','Tuesday','Wednesday','Thursday','Friday'];let day='Monday';const reads={Monday:'Sometimes I’m Bombaloo • Read 1',Tuesday:'Sometimes I’m Bombaloo • Read 2',Wednesday:'Sometimes I’m Bombaloo • Read 3',Thursday:'The Rabbit Listened • Read 1',Friday:'The Rabbit Listened • Read 2'},centers={Monday:'Dressing Up + Retelling Stories',Tuesday:'Being Scientists + Making Lines',Wednesday:'Feeling Masks',Thursday:'Amazing Buildings',Friday:'Continue Centers'},stories={Monday:'The Crumpled Picture',Tuesday:'The Quiet Scientist',Wednesday:'The Mask With Two Feelings',Thursday:'The Wobbly Building',Friday:'You Tell the Feeling Story'},closing={Monday:'Show Me a Feeling',Tuesday:'One Helpful Thing',Wednesday:'Bunny Goodbye',Thursday:'Listening Ears',Friday:'We Can Help'};const base=[['8:10','🐰','Community Meeting','Bunny Breath • helping/family prompt • name songs','community'],['8:20','📖','Read Aloud','', 'read'],['8:45','🥣','Breakfast','',null],['9:00','🖍️','Intro to Centers','', 'introcenters'],['9:10','🧺','Centers','Choose where friends will play and learn','centers'],['during','🙂','Literacy Small Group','Feelings Memory','smallgroup'],['10:15','🛝','Recess','',null],['11:00','🍽️','Lunch','',null],['After lunch','🌙','Nap','',null],['2:00','🍎','Snack','',null],['2:30+','💭','Storytelling','', 'story'],['2:30+','❤️','Closing Circle','', 'closing']];function render(){sub.textContent=day+' • Week 3';heading.textContent=day+'’s Plan';days.innerHTML=names.map(n=>`<button data-day="${n}" class="${n===day?'active':''}">${n}</button>`).join('');rows.innerHTML=base.map(r=>{let detail=r[3];if(r[2]==='Read Aloud')detail=reads[day];if(r[2]==='Intro to Centers')detail=centers[day];if(r[2]==='Storytelling')detail=stories[day];if(r[2]==='Closing Circle')detail=closing[day];const routine=!r[4];const cls=r[4]==='read'?'open read':r[4]==='smallgroup'?'open directions':'open';return `<div class="row ${routine?'routine':''}"><div class="time">${r[0]}</div><div class="ico">${r[1]}</div><div class="what"><b>${r[2]}</b><span>${detail}</span></div><button class="${cls}" ${r[4]?`data-lesson="${r[4]}"`:''}>${r[4]==='read'?'Read Aloud':r[4]==='smallgroup'?'Directions':r[4]==='centers'?'Choose Centers':r[4]?'Open Lesson':''}</button></div>`}).join('')}document.addEventListener('click',e=>{const d=e.target.closest('[data-day]');if(d){day=d.dataset.day;render();return}const b=e.target.closest('[data-lesson]');if(b){const lesson=b.dataset.lesson;if(lesson==='read'){location.href=`week3-read-aloud.html?day=${encodeURIComponent(day)}&from=plan`;return}if(lesson==='introcenters'){location.href=`week3-intro-centers.html?day=${encodeURIComponent(day)}&from=plan`;return}if(lesson==='centers'){location.href=`center-choice.html?day=${encodeURIComponent(day)}&week=3&from=week3-plan`;return}location.href=`week3-lessons.html?day=${encodeURIComponent(day)}&lesson=${encodeURIComponent(lesson)}&from=plan`}});render()})();</script></body></html>
