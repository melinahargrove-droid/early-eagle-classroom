<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Week 1 Read Aloud</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:12px}h1{margin:.2vh 0 0;color:#164f7f;font-size:32px;line-height:1}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book img{display:block;width:100%;height:100%;object-fit:contain}.side{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.45vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18)}.side.show{display:block}.side h2{font-size:18px;margin:0 0 .65vh;color:#9a6c13}.stop{color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stop b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin:.3vh 0 .45vh}.stop .part{padding:.2vh 0 .75vh;border-bottom:1px solid rgba(228,197,109,.35)}.stop .part:last-child{border-bottom:0;padding-bottom:0}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<main class="page">
<header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header>
<section class="stage"><div class="book"><img id="bookImg" alt="Adapted book page"></div><div class="side" id="side"><h2>Pause Here</h2><div class="stop" id="stop"></div></div></section>
<aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside>
<footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer>
</main>
<script>
(()=>{
const p=new URLSearchParams(location.search),day=p.get('day')||'Monday';
const lolaPages=Array.from({length:14},(_,i)=>'../lola-read1/book-'+String(i+1).padStart(2,'0')+'.png');
const mangoPages=['../too-many-mangos/tm-01.png',...Array.from({length:14},(_,i)=>'assets/mangos/mango-'+String(i+2).padStart(2,'0')+'.jpg')];
const P=(label,text)=>`<div class="part"><b>${label}</b>${text}</div>`;
const data={
Monday:{title:'Lola Goes to School',sub:'Read 1 of 3 · What’s the story about?',pages:lolaPages,notes:'Introduce the title, author Anna McQuinn, and illustrator Rosalind Beardshaw. Read the adapted story fluently and pause only for the teaching stops shown on the book page.',stops:{1:P('BEFORE WE READ','What ideas do you have about starting school?'),5:P('QUICK WORD · JUMPING PANTS','Pants you can jump and play in! Can you show me one tiny pretend jump?'),7:P('STOP & THINK','What are some things Lola does to get ready for school? Show a thumb up if you did any of those things today!'),11:P('STOP & THINK','We have read over half of the book! What are some things Lola does at school?'),14:P('QUICK WORD · EXHAUSTING','Taking a lot of energy; making a person very, very tired. Show shoulders slumping and eyes closing.')+P('AFTER READING','What did Lola do at school that you also do at school?')}},
Tuesday:{title:'Lola Goes to School',sub:'Read 2 of 3 · Reading the words and pictures',pages:lolaPages,notes:'Reintroduce the text. Read again, focusing on Lola’s feelings and children’s connections to their own experiences.',stops:{1:P('BEFORE WE READ','Let’s pay attention to the words and illustrations to get to know Lola.'),7:P('STOP & THINK','Why do you think everyone gets up so early? How might Lola be feeling the night before school and in the morning?'),10:P('STOP & THINK','What’s happening? Let’s look at the picture and listen to the words. How might Lola feel now?'),13:P('QUICK CONNECTION · MOTIONS','Motions are movements or gestures. Lola knows all the motions to this song—that probably makes her feel good!'),14:P('AFTER READING','How does Lola feel at the end of the story? Why? Thumbs up if you have felt that way!')+P('CLOSING','Today we paid attention to the words and illustrations to get to know Lola. We thought about our own experiences, too.')}},
Wednesday:{title:'Lola Goes to School',sub:'Read 3 of 3 · Act out the story',pages:lolaPages,notes:'Reintroduce the story. This time, pause and act out some of the things Lola does. Keep pretend movements simple and within each child’s own space.',stops:{1:P('BEFORE WE READ','This time, as we read, we will pause and act out some of the things Lola does. Let’s try it!'),4:P('ACT IT OUT','Lola is packing her bag for school. Let’s pretend to pack our bags! What should we put inside?'),12:P('ACT IT OUT','Lola and Julia are building a castle with blocks. Let’s all pretend to build a castle with blocks!'),14:P('ACT IT OUT','Lola eats a snack and falls asleep. Let’s pretend to eat a snack... and fall asleep!')+P('AFTER READING','What did you think about acting out parts of the story? What is your favorite part of the story?')+P('CLOSING','Sometimes acting out a story can help us understand it even more. We’ll do this with other books we read!')}},
Thursday:{title:'Too Many Mangos',sub:'Read 1 of 4 · What’s the story about?',pages:mangoPages,notes:'Introduce the title, author Tammy Paikai, and illustrator Don Robinson. Make the mango connection before reading, then read fluently and pause at the teaching stops shown here.',stops:{1:P('BEFORE WE READ','Thumbs up if you have ever tasted mango. It’s a tropical fruit that grows in warm places. Let’s see what the characters do with too many mangos!'),3:P('QUICK WORD · TUG','To pull hard. Show me with your body how you would tug a mango off a tree branch.'),4:P('STOP & THINK','What is the problem in the book? Make a face like Grandpa. Maybe Grandpa is thinking hard about what to do!'),6:P('QUICK WORDS · ALOHA & MAHALO','Aloha — Hello in Hawaiian. Mahalo — Thank you in Hawaiian.'),10:P('STOP & THINK','We have read over half of the book! What are some things the neighbors share with Kama and Nani?'),14:P('STOP & THINK','What do Kama, Nani, and Grandpa do with the gifts they have received from their neighbors?'),15:P('AFTER READING','How does sharing mangoes make Kama, Nani, Grandpa, and the neighbors feel? How do you feel when you share with someone?')+P('CLOSING','Maybe in Discovery Center you can make some of the foods in the story out of playdough. We’ll read this book again tomorrow.')}},
Friday:{title:'Too Many Mangos',sub:'Read 2 of 4 · First half and retell',pages:mangoPages.slice(0,8),notes:'Read only the first half of Too Many Mangos today. Stop after the mapped pages 14–15 image, then retell what happened. Do not continue into the second half.',stops:{1:P('BEFORE WE READ','Let’s read Too Many Mangos again. This time we’ll read the first half of the book and then stop and tell what happened.'),5:P('STOP & THINK','What is Kama and Nani’s idea for fixing the problem?'),8:P('LOOK & THINK','Look at this illustration and listen to the words. What are the children sharing?')+P('RETELL TOGETHER','Let’s look back through the pictures. What happened first, next, and after that?')+P('CLOSING','In Read Aloud today, we read part of Too Many Mangos. We’ll read the second half of the book next time.')}}
};
const d=data[day]||data.Monday;let page=1;const $=id=>document.getElementById(id);$('bookTitle').textContent=d.title;$('subTitle').textContent=d.sub;$('chip').textContent='WEEK 1 · '+day.toUpperCase();$('notesTitle').textContent=d.title;$('notesCopy').textContent=d.notes;
function show(){$('bookImg').src=d.pages[page-1];$('count').textContent='Slide '+page+' of '+d.pages.length;$('fill').style.width=(page/d.pages.length*100)+'%';$('prev').disabled=page===1;$('next').textContent=page===d.pages.length?'Finish Read Aloud ✓':'Next →';const s=d.stops[page]||'';$('stop').innerHTML=s;$('side').classList.toggle('show',!!s)}
$('prev').onclick=()=>{if(page>1){page--;show()}};$('next').onclick=()=>{if(page<d.pages.length){page++;show()}else location.href='daily-lessons.html'};$('backBtn').onclick=()=>location.href='daily-lessons.html';$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');show();
})();
</script>
</body>
</html>
