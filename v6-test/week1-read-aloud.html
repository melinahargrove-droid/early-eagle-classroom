<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Week 1 Read Aloud</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:12px}h1{margin:.2vh 0 0;color:#164f7f;font-size:32px;line-height:1}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef;cursor:pointer}.book.hidden{display:none}.book img{display:block;width:100%;height:100%;object-fit:contain}.side{display:none;position:absolute;right:2vw;bottom:2vh;width:min(520px,42vw);max-height:72%;overflow:auto;z-index:30;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.45vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18)}.side.show{display:block}.side h2{font-size:18px;margin:0 0 .65vh;color:#9a6c13}.stop{color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stop b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin:.3vh 0 .45vh}.stop .part{padding:.2vh 0 .75vh;border-bottom:1px solid rgba(228,197,109,.35)}.stop .part:last-child{border-bottom:0;padding-bottom:0}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7);box-shadow:inset 0 0 0 1px rgba(90,135,145,.15)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-default{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.vocab-default>svg,.vocab-visual>img{display:block;width:100%;height:100%;object-fit:contain}.vocab-duo{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.vocab-duo-item{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#557876;font-weight:900}.vocab-duo-item svg{width:100%;height:78%}.vocab-duo-item span{font-size:18px}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer;box-shadow:0 4px 12px #0002}.vocab-copy{text-align:left}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-gesture{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:40;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<main class="page">
<header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header>
<section class="stage">
<div class="book" id="book" title="Click the page after reading to show or hide the teaching stop"><img id="bookImg" alt="Adapted book page"></div>
<div class="side" id="side"><h2>Pause Here</h2><div class="stop" id="stop"></div></div>
<div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-default" id="vocabDefault"></div><img id="vocabCustom" alt="Custom vocabulary visual" hidden><button class="vocab-edit" id="vocabEdit">✎ Edit</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabTitle"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-gesture" id="vocabGesture"></div></div></div>
</section>
<aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside>
<footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer>
</main>
<script src="visual-store.js"></script>
<script>
(()=>{
const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',runner=p.get('eeaRunner')==='1';
const lolaPages=Array.from({length:14},(_,i)=>'../lola-read1/book-'+String(i+1).padStart(2,'0')+'.png');
const mangoPages=['../too-many-mangos/tm-01.png',...Array.from({length:14},(_,i)=>'assets/mangos/mango-'+String(i+2).padStart(2,'0')+'.jpg')];
const P=(label,text)=>`<div class="part"><b>${label}</b>${text}</div>`;
const sprite=(viewBox,label)=>`<svg viewBox="${viewBox}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${label}"><image href="assets/u1-vocab-sprite-1.png" x="0" y="0" width="1536" height="1024"/></svg>`;
const vocab={
'Jumping Pants':{slot:'week1-lola-jumping-pants',kicker:'QUICK WORD · BOOK PAGES 5–6',definition:'Pants you can jump and play in!',gesture:'Can you show me one tiny pretend jump?',visual:()=>sprite('636 184 254 206','Jumping Pants')},
'Exhausting':{slot:'week1-lola-exhausting',kicker:'QUICK WORD · BOOK PAGES 23–24',definition:'Taking a lot of energy; making a person very, very tired.',gesture:'Show shoulders slumping and eyes closing.',visual:()=>sprite('336 184 254 206','Exhausting')},
'Motions':{slot:'week1-lola-motions',kicker:'QUICK CONNECTION · BOOK PAGE 20',definition:'Motions are movements or gestures.',gesture:'Can you show one motion you know from a song?',visual:()=>sprite('964 221 199 162','Motions')},
'Tug':{slot:'week1-mangos-tug',kicker:'QUICK WORD · BOOK PAGE 4',definition:'To pull hard.',gesture:'Show me with your body how you would tug a mango off a tree branch.',visual:()=>sprite('339 739 274 222','Tug')},
'Aloha & Mahalo':{slot:'week1-mangos-aloha-mahalo',kicker:'QUICK WORDS · BOOK PAGE 10',definition:'Aloha means hello in Hawaiian. Mahalo means thank you in Hawaiian.',gesture:'Practice saying “Aloha” and “Mahalo” together.',visual:()=>`<div class="vocab-duo"><div class="vocab-duo-item">${sprite('346 466 262 213','Aloha')}<span>Aloha</span></div><div class="vocab-duo-item">${sprite('1246 469 262 213','Mahalo')}<span>Mahalo</span></div></div>`}
};
const data={
Monday:{title:'Lola Goes to School',sub:'Read 1 of 3 · What’s the story about?',pages:lolaPages,notes:'Introduce the title, author Anna McQuinn, and illustrator Rosalind Beardshaw. Read the adapted story fluently and use the teaching stops after reading the mapped page.',stops:{1:P('BEFORE WE READ','What ideas do you have about starting school?'),7:P('BOOK PAGES 9–10 · STOP & THINK','What are some things Lola does to get ready for school? Show a thumb up if you did any of those things today!'),11:P('BOOK PAGES 17–18 · STOP & THINK','We have read over half of the book! What are some things Lola does at school?')}},
Tuesday:{title:'Lola Goes to School',sub:'Read 2 of 3 · Reading the words and pictures',pages:lolaPages,notes:'Reintroduce the text. Read again, focusing on Lola’s feelings and children’s connections to their own experiences.',stops:{1:P('BEFORE WE READ','Let’s pay attention to the words and illustrations to get to know Lola.'),7:P('BOOK PAGE 9 · STOP & THINK','Why do you think everyone gets up so early? How might Lola be feeling the night before school and in the morning?'),10:P('BOOK PAGE 15 · STOP & THINK','What’s happening? Let’s look at the picture and listen to the words. How might Lola feel now?'),14:P('AFTER READING','How does Lola feel at the end of the story? Why? Thumbs up if you have felt that way!')+P('CLOSING','Today we paid attention to the words and illustrations to get to know Lola. We thought about our own experiences, too.')}},
Wednesday:{title:'Lola Goes to School',sub:'Read 3 of 3 · Act out the story',pages:lolaPages,notes:'Reintroduce the story. Pause after the mapped pages and act out some of the things Lola does.',stops:{1:P('BEFORE WE READ','This time, as we read, we will pause and act out some of the things Lola does. Let’s try it!'),4:P('BOOK PAGE 4 · ACT IT OUT','Lola is packing her bag for school. Let’s pretend to pack our bags! What should we put inside?'),11:P('BOOK PAGE 18 · ACT IT OUT','Lola and Julia are building a castle with blocks. Let’s all pretend to build a castle with blocks!'),14:P('BOOK PAGE 24 · ACT IT OUT','Lola eats a snack and falls asleep. Let’s pretend to eat a snack... and fall asleep!')+P('AFTER READING','What did you think about acting out parts of the story? What is your favorite part of the story?')+P('CLOSING','Sometimes acting out a story can help us understand it even more. We’ll do this with other books we read!')}},
Thursday:{title:'Too Many Mangos',sub:'Read 1 of 4 · What’s the story about?',pages:mangoPages,notes:'Introduce the title, author Tammy Paikai, and illustrator Don Robinson. Read fluently and use each stop after the printed page has been read.',stops:{1:P('BEFORE WE READ','Thumbs up if you have ever tasted mango. It’s a tropical fruit that grows in warm places. Let’s see what the characters do with too many mangos!'),4:P('BOOK PAGE 7 · STOP & THINK','What is the problem in the book? Make a face like Grandpa. Maybe Grandpa is thinking hard about what to do!'),10:P('BOOK PAGE 19 · STOP & THINK','We have read over half of the book! What are some things the neighbors share with Kama and Nani?'),14:P('BOOK PAGE 27 · STOP & THINK','What do Kama, Nani, and Grandpa do with the gifts they have received from their neighbors?'),15:P('AFTER READING','How does sharing mangoes make Kama, Nani, Grandpa, and the neighbors feel? How do you feel when you share with someone?')+P('CLOSING','Maybe in Discovery Center you can make some of the foods in the story out of playdough. We’ll read this book again tomorrow.')}},
Friday:{title:'Too Many Mangos',sub:'Read 2 of 4 · First half and retell',pages:mangoPages.slice(0,8),notes:'Read only the first half of Too Many Mangos today. Stop after the mapped pages 14–15 image, then retell what happened. Do not continue into the second half.',stops:{1:P('BEFORE WE READ','Let’s read Too Many Mangos again. This time we’ll read the first half of the book and then stop and tell what happened.'),5:P('BOOK PAGE 9 · STOP & THINK','What is Kama and Nani’s idea for fixing the problem?'),8:P('BOOK PAGE 15 · LOOK & THINK','Look at this illustration and listen to the words. What are the children sharing?')+P('RETELL TOGETHER','Let’s look back through the pictures. What happened first, next, and after that?')+P('CLOSING','In Read Aloud today, we read part of Too Many Mangos. We’ll read the second half of the book next time.')}}
};
const d=data[day]||data.Monday;
let sequence=d.pages.map((src,i)=>({type:'book',src,page:i+1}));
function insertAfterPage(page,item){const i=sequence.findIndex(x=>x.type==='book'&&x.page===page);if(i>=0)sequence.splice(i+1,0,item)}
if(day==='Monday'){insertAfterPage(5,{type:'vocab',word:'Jumping Pants'});insertAfterPage(14,{type:'vocab',word:'Exhausting',stop:P('AFTER READING','What did Lola do at school that you also do at school?')})}
if(day==='Tuesday')insertAfterPage(12,{type:'vocab',word:'Motions'});
if(day==='Thursday'){insertAfterPage(3,{type:'vocab',word:'Tug'});insertAfterPage(6,{type:'vocab',word:'Aloha & Mahalo'})}
let step=0,visualLoad=0,currentStop='';const $=id=>document.getElementById(id);$('bookTitle').textContent=d.title;$('subTitle').textContent=d.sub;$('chip').textContent='WEEK 1 · '+day.toUpperCase();$('notesTitle').textContent=d.title;$('notesCopy').textContent=d.notes;
async function loadVocabVisual(item){const config=vocab[item.word],token=++visualLoad;$('vocabTitle').textContent=item.word;$('vocabKicker').textContent=config.kicker;$('vocabDefinition').textContent=config.definition;$('vocabGesture').textContent=config.gesture;$('vocabDefault').innerHTML=config.visual();const src=await EEAVisualStore.get(config.slot);if(token!==visualLoad)return;$('vocabCustom').hidden=!src;$('vocabDefault').style.display=src?'none':'flex';if(src)$('vocabCustom').src=src;else $('vocabCustom').removeAttribute('src');$('vocabEdit').onclick=()=>{const ret='week1-read-aloud.html?day='+encodeURIComponent(day);location.href='visual-editor.html?slot='+encodeURIComponent(config.slot)+'&return='+encodeURIComponent(ret)}}
function show(){const item=sequence[step],isVocab=item.type==='vocab';$('book').classList.toggle('hidden',isVocab);$('vocabSlide').classList.toggle('show',isVocab);$('side').style.display='none';$('side').classList.remove('show');currentStop='';if(isVocab){currentStop=item.stop||'';$('stop').innerHTML=currentStop;loadVocabVisual(item)}else{visualLoad++;$('bookImg').src=item.src;currentStop=d.stops[item.page]||'';$('stop').innerHTML=currentStop}$('count').textContent='Slide '+(step+1)+' of '+sequence.length;$('fill').style.width=((step+1)/sequence.length*100)+'%';$('prev').disabled=step===0&&!runner;$('prev').textContent=step===0&&runner?'← Community Meeting':'← Previous';$('next').textContent=step===sequence.length-1?'Finish Read Aloud ✓':'Next →'}
$('book').onclick=()=>{if(!currentStop)return;const open=$('side').classList.toggle('show');$('side').style.display=open?'block':'none'};
$('prev').onclick=()=>{if(step>0){step--;show();return}if(runner){const dayIndex=['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(day);parent.location.href='lesson-runner-week1.html?week=1&day='+(dayIndex<0?0:dayIndex)+'&section=0&v='+Date.now()}};$('next').onclick=()=>{if(step<sequence.length-1){step++;show()}else location.href='daily-lessons.html'};$('backBtn').onclick=()=>location.href='daily-lessons.html';$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');show();
})();
</script>
</body>
</html>
