ex}.quickcard{width:min(820px,72vw);min-height:44vh;border-radius:28px;background:#fffdf8;border:2px solid #e4c56d;box-shadow:0 22px 55px rgba(35,56,63,.24);display:grid;grid-template-columns:42% 1fr;gap:2.6vw;align-items:center;padding:3vh 3vw}.quickpic{width:100%;aspect-ratio:1.25;border-radius:22px;background:#f3f7f3;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #d6e5e1}.quickpic img{display:block;max-width:100%;max-height:100%;object-fit:contain}.quickcopy{text-align:left}.quickkicker{color:#9a6c13;font-size:14px;font-weight:900;letter-spacing:.1em}.quickcopy h2{margin:.7vh 0 1vh;color:#164f7f;font-size:clamp(42px,4vw,70px)}.quickdef{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.3}.quickgesture{display:none;margin-top:1.6vh;padding:1vh 1.1vw;border-radius:16px;background:#e7f2f0;color:#4f765e;font-size:clamp(17px,1.15vw,22px);font-weight:900}.quickgesture.show{display:block}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:40;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}

(()=>{

const P=(label,text)=>`<div class="part"><b>${label}</b>${text}</div>`;
const sprite=(viewBox,label)=>`<svg viewBox="${viewBox}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${label}"><image href="assets/u1-vocab-sprite-1.png" x="0" y="0" width="1536" height="1024"/></svg>`;
const vocab={
'Motions':{slot:'week1-lola-motions',kicker:'QUICK CONNECTION · BOOK PAGE 20',definition:'Motions are movements or gestures.',gesture:'Can you show one motion you know from a song?',visual:()=>sprite('964 221 199 162','Motions')},
'Tug':{slot:'week1-mangos-tug',kicker:'QUICK WORD · BOOK PAGE 4',definition:'To pull hard.',gesture:'Show me with your body how you would tug a mango off a tree branch.',visual:()=>sprite('339 739 274 222','Tug')},
'Aloha & Mahalo':{slot:'week1-mangos-aloha-mahalo',kicker:'QUICK WORDS · BOOK PAGE 10',definition:'Aloha means hello in Hawaiian. Mahalo means thank you in Hawaiian.',gesture:'Practice saying “Aloha” and “Mahalo” together.',visual:()=>`<div class="vocab-duo"><div class="vocab-duo-item">${sprite('346 466 262 213','Aloha')}<span>Aloha</span></div><div class="vocab-duo-item">${sprite('1246 469 262 213','Mahalo')}<span>Mahalo</span></div></div>`}
};
const data={
Monday:{title:'Lola Goes to School',sub:'Read 1 of 2 · What’s the story about?',book:'lola',pages:lolaPages,notes:'Focus on Pre-K 3s · Unit 1 Week 1. Introduce Family and Friends and the Read Aloud routine. Introduce the title, author Anna McQuinn, and illustrator Rosalind Beardshaw. Read the full text fluently and pause at the curriculum stopping points.',before:P('BEFORE READING','This is our first unit; it is called Family and Friends. Every day we will have a Read Aloud time, where we read a book together and talk about it. The title of today’s book is Lola Goes to School. Let’s read and find out what Lola does when she goes to school.'),stopsByBookPage:{3:P('BOOK PAGE 3 · VOCABULARY','To visit is to go somewhere and see a person or a place. Lola and her family visited her new school before she started.'),10:P('BOOK PAGE 10 · STOP & THINK','What are some things Lola does to get ready for school? Show me thumbs up if you did any of those things today!'),11:P('BOOK PAGE 11 · VOCABULARY','Ms. Suzan welcomes everyone. Welcome means to greet someone happily.')},after:P('AFTER READING','What are some things Lola does at school?')+P('CLOSING','Today we read to find out what Lola does on her first day of school. We talked about our first day of school too! In Centers you can do some of the things that Lola did when she started school. We’ll read this book again tomorrow.')},
Tuesday:{title:'Lola Goes to School',sub:'Read 2 of 2 · Characters and Connections',book:'lola',pages:lolaPages,notes:'Focus on Pre-K 3s · Unit 1 Week 1. Reintroduce Lola Goes to School. Read the book and pause at the Focus on 3s stopping points, encouraging children to use the words and illustrations to describe Lola and connect her feelings to their own experiences.',before:P('BEFORE READING','It’s Read Aloud time again. We will read Lola Goes to School one more time. Let’s listen carefully to the words and illustrations to get to know Lola.'),stopsByBookPage:{9:P('BOOK PAGE 9 · STOP & THINK','How might Lola be feeling the night before school and when she wakes up in the morning? How do you know? Look closely at the illustrations.'),14:P('BOOK PAGE 14 · VOCABULARY','Lola decides to read. Decides means to make a choice.'),15:P('BOOK PAGE 15 · STOP & THINK','What’s happening? Let’s look at the picture and listen to the words. How might Lola feel now?')},after:P('AFTER READING','How does Lola feel at the end of the book? Why did she feel that way? Thumbs up if you have also felt that way! Invite 1–2 children to share their experiences.')+P('CLOSING','In Read Aloud today, we paid attention to the words and illustrations to get to know Lola. We also thought about our own experiences.')},
Wednesday:{title:'Familiar Books From Home',sub:'Favorite Books From Home · Flexible teacher-led read',book:'familiar',pages:[],notes:'Focus on Pre-K 3s · Unit 1 Week 1. Select one or two children’s favorite books from home, books about subjects children are interested in, or familiar classroom stories. Before teaching, skim the selected book and choose a few vocabulary words and 2–3 useful stopping points. Vocabulary and exact questions depend on the selected text.',before:P('BEFORE READING','Today, we will read one of a child’s favorite books from home. Introduce the title, invite the child to tell the group a little about the book, and name the author and illustrator. Make a connection to what children already know, then tell them what you will read to find out.'),stopsByBookPage:{},after:P('WHILE READING','Read the full selected text fluently. Pause 2–3 times to define useful vocabulary, ask what is happening, and use the illustrations to support comprehension. The exact stopping points depend on the book you selected.')+P('AFTER READING','Ask 1–2 questions appropriate to the selected book. Possibilities from the curriculum include: Why do you like this book? Why is this book important to you or your family? What is your favorite part?')+P('CLOSING','Thank the child for sharing the book. Leave it in the Library and Listening Center so children can explore it again by themselves or with a friend.')},
Thursday:{title:'Naming Ceremony',sub:'Read 1 of 2 · What’s the story about?',book:'naming',pages:[],notes:'Focus on Pre-K 3s · Unit 1 Week 1 Day 4. Reinforce Read Aloud expectations and introduce Naming Ceremony by Seina Wedlick, illustrated by Jenin Mohammed. Read the full text fluently. The Focus on 3s curriculum calls for pauses at printed pages 1, 8, 11, 21, 25, and 26. The Companion uses the official Focus on 3s adapted-text sequence as its visual reading support.',before:P('BEFORE READING','It’s time for our Read Aloud! When we listen to a story, we look at the pictures and listen to the words. After the story is all done, we can talk about it. Show the meeting agreements visual. Today we will read a new book called Naming Ceremony. Seina Wedlick is the author; she wrote the words. Jenin Mohammed is the illustrator; she made the pictures. This is Amira. In this story, Amira’s family welcomes a new baby. They have a ceremony, a special time when family and friends come over to give presents and propose names. Let’s read and find out what the family names their baby.'),stopsByBookPage:{},after:P('CURRICULUM TEACHING STOPS','Page 1: Amira is excited—happy and she cannot wait. Connect to feeling excited about the first week of school. Page 8: tradition means something a family or community does again and again that is special to them; Amira’s family has a naming ceremony each time a new baby is born. Page 11: thankful means feeling happy about having or doing something; model a thumbs-up connection. Page 21: Amira looks nervous—tight hands and a worried face; invite a thumbs-up connection to feeling nervous. Page 25: celebrate means doing something special for a person or important day; ask how children’s families like to celebrate. Page 26: Habiba means beloved—very, very loved and special.')+P('AFTER READING','Return to printed page 27 and ask: What happened at the naming ceremony for Amira’s baby sister?')+P('CLOSING','Today in Centers you can pretend to have a celebration. In Dramatic Play, you could prepare some food to share, just like Amira’s family did.')},
Friday:{title:'Naming Ceremony',sub:'Read 2 of 2 · Characters and Connections',book:'naming',pages:[],notes:'Focus on Pre-K 3s · Unit 1 Week 1 Day 5. This is not a cover-to-cover reread. Begin at printed page 9 and revisit selected characters and events through page 26, then discuss the illustration on page 27. Use the official Focus on 3s adapted-text sequence as visual support.',before:P('OPENING','It’s time for our Read Aloud. Do you remember this book? Let’s read some parts of Naming Ceremony again and talk about the story together. Remember Amira? She has a new baby in her family. Put a thumbs up if you know anyone who is a baby.'),stopsByBookPage:{},after:P('REREAD & REVISIT','Start at printed page 9. Revisit pages 9–10 and 13–14, inviting children to remember the characters. On page 11, ask children what they see happening as the family prepares food. On page 15, draw attention to the large print and read the sound words together. Continue through pages 16–26, briefly revisiting remembered characters and events.')+P('DISCUSSION · PAGE 27','Look at all of Amira’s family and friends coming to give the new baby gifts. They are being kind and thoughtful to the new baby. Think about a time when you did something thoughtful for someone else. What did you do? Model with a real example of something thoughtful you observed a child or adult do in the classroom this week.')+P('CLOSING','Your names are very special, just like baby Habiba. In Centers today you might want to write your name on your artwork, or ask a teacher to write your name for you.')}
};
const d=data[day]||data.Monday;
if(d.book==='familiar'){document.body.classList.add('familiar-read');}
function printedPagesFor(book,imageIndex){if(book==='lola'){if(imageIndex<3)return[];const first=2*imageIndex-5;return[first,first+1]}if(book==='mango'){if(imageIndex===1)return[];if(imageIndex===15)return[28];const first=2*imageIndex-2;return[first,first+1]}return[]}
let sequence=d.pages.map((src,i)=>({type:'book',src,imageIndex:i+1,bookPages:printedPagesFor(d.book,i+1)}));
if(d.book==='familiar')sequence=[{type:'book',src:'assets/reading.webp',imageIndex:1,bookPages:[],stop:d.before+d.after}];
if(d.book==='naming'){
 const deck='19irt8YqpRQzG75JITqu4aQXZNnwTKoTeKpPuV7Ow8l8';
 const slideIds=["p2","p3","p4","p5","p6","p7","p8","p9","p10","p11","p12","p13","p14","p15","p16"];
 const adapted=[
 'Amira is excited.',
 'Mama puts on baby sister’s bracelet. Amira is nervous to pick a name for baby sister.',
 'Baby sister will get special gifts when she wakes up. Names are gifts from our friends and families.',
 'Amira looks at the bracelet. It is special.',
 'Ding! Dong! Grandma Nana is here. The cousins are here.',
 'Grandma Nana says “Shakira”. Her gift is a name. Shakira means thankful.',
 'Miki is here. Her gift is a red flower.',
 'Uncle Ali is here.',
 'Uncle Ali says “Uhwe”. His gift is a name. Uhwe means moonlight.',
 'Tamas is here. His gift is a toy.',
 'Amira is nervous. Will baby sister like her gift?',
 'Baby sister is awake!',
 'Mama says “Habiba”. Her gift is a name. Habiba means beloved.',
 'Everyone gives Habiba their gift.',
 'It’s Amira’s turn. Amira says “Otta”. Otta means friend. Amira loves her baby sister.'
 ];
 sequence=adapted.map((text,i)=>({type:'book',src:'https://docs.google.com/presentation/d/'+deck+'/export/png?pageid='+slideIds[i],imageIndex:i+1,bookPages:[],stop:(i===0?d.before:'')+P('ADAPTED TEXT',text)+(i===adapted.length-1?d.after:'')}));
}
function findBookImageContaining(bookPage){return sequence.findIndex(x=>x.type==='book'&&x.bookPages.includes(bookPage))}
function insertAfterBookPage(bookPage,item){const i=findBookImageContaining(bookPage);if(i>=0)sequence.splice(i+1,0,item)}
function lastBookIndex(){return sequence.reduce((last,x,i)=>x.type==='book'?i:last,-1)}

if(day==='Thursday'){insertAfterBookPage(4,{type:'vocab',word:'Tug'});insertAfterBookPage(10,{type:'vocab',word:'Aloha & Mahalo'})}
function stopForBookItem(item,sequenceIndex){if(item.type!=='book')return item.stop||'';let html='';if(sequenceIndex===0&&d.before)html+=d.before;for(const [page,text] of Object.entries(d.stopsByBookPage||{})){const curriculumPage=Number(page);const imageOverride=d.stopImageIndexByCurriculumPage&&d.stopImageIndexByCurriculumPage[curriculumPage];const matches=imageOverride?item.imageIndex===imageOverride:item.bookPages.includes(curriculumPage);if(matches)html+=text}if(d.after&&d.afterBookPage&&item.bookPages.includes(d.afterBookPage))html+=d.after;else if(d.after&&!d.afterBookPage&&sequenceIndex===lastBookIndex())html+=d.after;return html}
const quickCues={jumping:{kicker:'QUICK WORD · BOOK PAGE 6',title:'Jumping Pants',definition:'Pants you can jump and play in.',image:'assets/lesson-visuals/jumping-pants.png',alt:'Child jumping in comfortable pants'},exhausting:{kicker:'QUICK WORD · BOOK PAGE 25',title:'Exhausting',definition:'Taking a lot of energy; making a person very, very tired.',gesture:'Show shoulders slumping and eyes closing.',image:'assets/lesson-visuals/exhausting.png',alt:'Child looking exhausted'}};
let step=0,visualLoad=0,currentStop='',quickOpen=false,quickCueId='',quickSeen=new Set(),afterExhaustingReady=false;const $=id=>document.getElementById(id);$('bookTitle').textContent=d.title;$('subTitle').textContent=d.sub;$('chip').textContent='WEEK 1 · '+day.toUpperCase();$('notesTitle').textContent=d.title;$('notesCopy').textContent=d.notes;
async function loadVocabVisual(item){const config=vocab[item.word],token=++visualLoad;$('vocabTitle').textContent=item.word;$('vocabKicker').textContent=config.kicker;$('vocabDefinition').textContent=config.definition;$('vocabGesture').textContent=config.gesture;$('vocabDefault').innerHTML=config.visual();const src=await EEAVisualStore.get(config.slot);if(token!==visualLoad)return;$('vocabCustom').hidden=!src;$('vocabDefault').style.display=src?'none':'flex';if(src)$('vocabCustom').src=src;else $('vocabCustom').removeAttribute('src');$('vocabEdit').onclick=()=>{const ret='week1-read-aloud.html?day='+encodeURIComponent(day);location.href='visual-editor.html?slot='+encodeURIComponent(config.slot)+'&return='+encodeURIComponent(ret)}}
function cueForCurrent(item){return null}
function showQuick(id){const q=quickCues[id];quickOpen=true;quickCueId=id;quickSeen.add(id);$('quickKicker').textContent=q.kicker;$('quickTitle').textContent=q.title;$('quickDefinition').textContent=q.definition;$('quickGesture').textContent=q.gesture||'';$('quickGesture').classList.toggle('show',!!q.gesture);$('quickPic').style.display='block';$('quickPic').src=q.image;$('quickPic').alt=q.alt||q.title;$('quickPic').onerror=()=>{$('quickPic').style.display='none'};$('quickWord').classList.add('show');$('side').style.display='none';$('side').classList.remove('show');$('next').textContent='Continue →'}
function hideQuick(){quickOpen=false;quickCueId='';$('quickWord').classList.remove('show')}
function show(){hideQuick();const item=sequence[step],isVocab=item.type==='vocab';$('book').classList.toggle('hidden',isVocab);$('vocabSlide').classList.toggle('show',isVocab);$('side').style.display='none';$('side').classList.remove('show');currentStop=stopForBookItem(item,step);$('stop').innerHTML=currentStop;if(isVocab){loadVocabVisual(item)}else{visualLoad++;$('bookImg').src=item.src}let label='Slide '+(step+1)+' of '+sequence.length;if(!isVocab&&item.bookPages.length){label='Book page'+(item.bookPages.length>1?'s ':' ')+item.bookPages.join('–')+' · '+label}else if(isVocab&&item.curriculumBookPage){label='Book page '+item.curriculumBookPage+' cue · '+label}$('count').textContent=label;$('fill').style.width=((step+1)/sequence.length*100)+'%';$('prev').disabled=step===0&&!runner;$('prev').textContent=step===0&&runner?'← Community Meeting':'← Previous';const cue=cueForCurrent(item);const needsQuick=cue&&!quickSeen.has(cue);$('next').textContent=(step===sequence.length-1&&!needsQuick)?'Finish Read Aloud ✓':'Next →'}
$('book').onclick=()=>{if(!currentStop)return;const open=$('side').classList.toggle('show');$('side').style.display=open?'block':'none'};
