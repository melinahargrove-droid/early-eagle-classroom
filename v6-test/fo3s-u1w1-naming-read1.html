<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naming Ceremony Read 1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f6f1e5;color:#174f7d}.page{height:100vh;padding:2.5vh 4vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:10vh;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.1em;color:#789697}.brand h1{margin:.4vh 0;color:#164f7f;font-size:clamp(32px,2.7vw,52px)}.chip{height:max-content;background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.card{height:72vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:38% 1fr;gap:3vw;align-items:center;padding:3vh}.visual{height:60vh;border-radius:26px;background:#edf4f0;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,9vw,160px);text-align:center}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h2{font-size:clamp(34px,3vw,58px);line-height:1.05;margin:1vh 0;color:#164f7f}.copy p{font-size:clamp(18px,1.15vw,23px);line-height:1.4;font-weight:850;color:#527673}.note{background:#e7f0ed;border-radius:18px;padding:1.1vh;color:#416d61;font-weight:850;line-height:1.4}.bottom{height:11vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900}.bottom .next{background:#668f99;color:#fff}.progress{font-weight:900;color:#789697}</style></head><body><main class="page"><header><div class="brand">EARLY EAGLE ACADEMY · READ ALOUD · FOCUS ON PRE-K 3s<h1>Naming Ceremony · Read 1</h1></div><div class="chip">U1 · W1 · THURSDAY</div></header><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><p id="say"></p><div class="note" id="note"></div></div></section><div class="bottom"><button id="prev">← Community Meeting</button><div class="progress" id="progress"></div><button class="next" id="next">Next →</button></div></main><script>(()=>{const cards=[{icon:'👀',eye:'BEFORE READING',title:'Meeting Agreements',say:'Look at the pictures, listen to the words, and talk together after the story.',note:'Use the official Meeting Agreements visual when it is added to the app assets.'},{icon:'📖',eye:'BOOK INTRODUCTION',title:'Meet Amira and Her Family',say:'Introduce Naming Ceremony by Seina Wedlick, illustrated by Jenin Mohammed. Amira’s family is welcoming a new baby and will have a special naming ceremony.',note:'Read the text fluently, pausing at the official Fo3s teaching stops.'},{icon:'😊',eye:'PAGE 1',title:'excited',say:'Amira is excited—happy and unable to wait. Have you felt excited during our first week of school? Show a thumbs up.',note:'Official Fo3s vocabulary stop.'},{icon:'🔁',eye:'PAGE 8',title:'tradition',say:'A tradition is something a family or community does again and again because it is special.',note:'Official Fo3s vocabulary stop.'},{icon:'💛',eye:'PAGE 11',title:'thankful',say:'Thankful means feeling happy about having or doing something. Are you thankful for something we get to play with at school? Show a thumbs up.',note:'Official Fo3s vocabulary/connection stop.'},{icon:'😟',eye:'PAGE 21',title:'Amira Feels Nervous',say:'Look closely at Amira. Her hands are tight and her face looks worried. Have you ever felt nervous? Show a thumbs up.',note:'Official Fo3s feelings/connection stop.'},{icon:'🎉',eye:'PAGE 25',title:'celebrate',say:'Celebrate means doing something special for a person or an important day. How does your family like to celebrate?',note:'Official Fo3s vocabulary/connection stop.'},{icon:'❤️',eye:'PAGE 26',title:'beloved',say:'The baby is named Habiba. Beloved means very, very loved and special.',note:'Official Fo3s vocabulary stop.'},{icon:'💬',eye:'AFTER READING · PAGE 27',title:'What Happened?',say:'What happened at the naming ceremony for Amira’s baby sister?',note:'Invite children to recall important events/details.'},{icon:'🍲',eye:'CLOSING',title:'Connect to Centers',say:'In Dramatic Play, you can pretend to have a celebration and prepare food like Amira’s family.',note:'Close Read 1 and connect the story to children’s play.'}];let i=0,$=x=>document.getElementById(x);function draw(){let c=cards[i];$('visual').textContent=c.icon;$('eye').textContent=c.eye;$('title').textContent=c.title;$('say').textContent=c.say;$('note').innerHTML='<b>Teacher note:</b> '+c.note;$('progress').textContent=(i+1)+' of '+cards.length;$('prev').textContent=i===0?'← Community Meeting':'← Previous';$('next').textContent=i===cards.length-1?'Next: Today in Centers →':'Next →'}$('prev').onclick=()=>{if(i===0)location.href='fo3s-u1w1-community-thursday.html';else{i--;draw()}};$('next').onclick=()=>{if(i<cards.length-1){i++;draw()}else location.href='fo3s-u1w1-revisits-thursday.html'};draw()})();</script></body></html>
