<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Week 5 Read Aloud</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book img{display:block;width:100%;height:100%;object-fit:contain}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(560px,44vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}.runtime-error{display:none;position:absolute;left:2vw;top:2vh;z-index:20;background:#fff3cd;border:2px solid #d49b00;border-radius:14px;padding:12px 16px;color:#664d03;font-weight:900}
</style>
</head>
<body>
<main class="page">
<header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title">Week 5 Read Aloud</h1><div class="sub" id="sub">Loading lesson…</div></div><div class="actions"><div class="chip" id="chip">WEEK 5</div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header>
<section class="stage"><div id="runtimeError" class="runtime-error"></div><div class="book"><img id="pageImg" alt="Adapted book page"></div><div class="stopcard" id="stop"></div></section>
<aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle">Teacher Notes</h3><p id="focus"></p><p id="note"></p></aside>
<footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count">Preparing book…</span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer>
</main>
<script>
(function () {
  "use strict";
  var days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
  var data = {
    Monday:{title:"Everybody in the Red Brick Building",sub:"Read 1 of 3 · What happens in the story?",prefix:"red-brick-building-",start:1,end:17,before:"Today we will read Everybody in the Red Brick Building. Listen for what happens in the story and notice how one sound leads to another.",focus:"Read the full text fluently, pausing only at the curriculum-designated places.",note:"After reading, use book pages 9–10, 17–18, and 21–22 to support retelling Natalia’s little story.",stops:{4:"BOOK PAGE 3 • HOWL — Howl means to cry loudly. Notice how the big writing helps show how loudly Izzie cried!",6:"BOOK PAGE 8 • CHALLENGE — Benny challenged, or invited, Cairo and Miles to play a game. What noise woke these three up?",7:"BOOK PAGE 10 • LAUNCH — Launch means to send into the air.",9:"BOOK PAGES 13–14 • READ THE PICTURE — There are almost no words here except the siren sound. What’s going on?",11:"BOOK PAGE 18 • PREDICT — Not many people are in the illustration. Where do you think everyone went?"}},
    Tuesday:{title:"Everybody in the Red Brick Building",sub:"Read 2 of 3 · Retelling events",prefix:"red-brick-building-",start:1,end:17,before:"Today we will read the story again and use the illustrations to help retell what happened first, next, and after that.",focus:"Read the full text fluently and use the collage illustrations to retell events in order.",note:"After reading, slowly page through the whole story. Ask what happened first, next, and after that, and notice how the story begins and ends.",stops:{11:"BOOK PAGE 17 • COLLAGE — Look closely at the collage. What do you notice? What is happening at this point in the story?",15:"BOOK PAGE 26 • WORDS + PICTURES — Look at the collage and listen as the words are reread. What do you see and hear? What’s happening?"}},
    Wednesday:{title:"Everybody in the Red Brick Building",sub:"Read 3 of 3 · Acting out the story",prefix:"red-brick-building-",start:1,end:17,before:"The rug can become our stage today. Children may act out characters or sounds from the story, and anyone may choose to pass.",focus:"Read the story aloud while children act out a selected scene or the whole story.",note:"Children may play any character—even Pepper the cat or the car alarm—and may pass if they do not want to act.",stops:{}},
    Thursday:{title:"My Day with Gong Gong",sub:"Read 1 of 4 · What’s the story about?",prefix:"my-day-with-gong-gong-",start:1,end:19,before:"Today we will meet May and Gong Gong. Listen for how they communicate and how May’s feelings change during their day together.",focus:"Read the full text fluently, pausing only at the curriculum-designated places.",note:"After reading, ask whether children know someone who speaks a different language and how they communicate.",stops:{3:"BOOK PAGE 1 • COMMUNICATING — May and Gong Gong do not seem to speak the same language. Look at the pictures and words. How does May seem to feel?",7:"BOOK PAGE 9 • HELLO — What does everyone say to Gong Gong? ‘Nie Hou’ means hello in Cantonese. Notice how happy Gong Gong looks greeting people in his neighborhood.",10:"BOOK PAGE 15 • STOMP — We have read about half of the book. Show how you stomp your feet. How do you usually feel when you stomp? Do you think May feels that way?",13:"BOOK PAGE 21 • CHEERING UP — What is one way Gong Gong cheers up May?",19:"END — What happens at the end of the book?"}},
    Friday:{title:"My Day with Gong Gong",sub:"Read 2 of 4 · Retelling the first half",prefix:"my-day-with-gong-gong-",start:3,end:11,before:"Today we will reread the first half of My Day with Gong Gong and use the pictures to tell what happened first, next, and after that.",focus:"Read only the first half. Stop the text after book page 14, then use the page 16 illustration to support retelling.",note:"The final displayed spread is for the Page 16 illustration prompt, not for continuing the text.",stops:{6:"BOOK PAGE 6 • CHINESE ZODIAC — Monkey is the zodiac sign matching the year May was born. What does May see that she likes?",9:"BOOK PAGE 12 • MAY’S FEELINGS — Look at the illustration and listen as the words are reread. How is May feeling? Why? How do you feel when you are hungry?",10:"BOOK PAGE 14 • FRUSTRATED — May is so frustrated that she stomps at the birds. What is one reason she is upset? STOP THE READ-ALOUD TEXT AFTER PAGE 14.",11:"BOOK PAGE 16 • LOOK ONLY — Look at the illustration. How does May feel? Use this picture to support the first-half retell."}}
  };
  function byId(id){ return document.getElementById(id); }
  var params = new URLSearchParams(window.location.search);
  var requestedDay = params.get("day");
  var day = days.indexOf(requestedDay) >= 0 ? requestedDay : "Monday";
  var lesson = data[day];
  var from = params.get("from") || "";
  var page = lesson.start;
  var beforeOpen = true;
  var pauseShown = false;
  var title = byId("title"), sub = byId("sub"), chip = byId("chip"), pageImg = byId("pageImg"), stop = byId("stop"), prev = byId("prev"), next = byId("next"), count = byId("count"), fill = byId("fill");
  title.textContent = lesson.title;
  sub.textContent = lesson.sub;
  chip.textContent = "WEEK 5 · " + day.toUpperCase();
  byId("notesTitle").textContent = lesson.title;
  byId("focus").textContent = lesson.focus;
  byId("note").textContent = lesson.note || "";
  function sectionState(){ return {page:page,beforeOpen:beforeOpen,pauseShown:pauseShown,atStart:beforeOpen && page===lesson.start,atEnd:!beforeOpen && page===lesson.end && (!lesson.stops[page] || pauseShown)}; }
  window.EEASectionState = sectionState;
  function notify(){ try{ window.dispatchEvent(new CustomEvent("eea-section-state",{detail:sectionState()})); }catch(e){} }
  function showCard(label, copy){ stop.innerHTML = "<b>" + label + "</b>" + copy; stop.classList.add("show"); }
  function hideCard(){ stop.classList.remove("show"); }
  function overview(){ window.location.href = "daily-lessons.html?week=5&day=" + days.indexOf(day) + "&v=" + Date.now(); }
  function finish(){ if(from === "daily" || from === "runner"){ window.location.href = "lesson-runner-week5.html?week=5&day=" + days.indexOf(day) + "&section=2&v=" + Date.now(); } else { overview(); } }
  function render(){
    var total = lesson.end - lesson.start + 1;
    var pos = page - lesson.start + 1;
    pageImg.src = "assets/" + lesson.prefix + String(page).padStart(2,"0") + ".jpg?v=93";
    count.textContent = "Slide " + pos + " of " + total;
    fill.style.width = ((pos/total)*100) + "%";
    if(beforeOpen){ showCard("BEFORE WE READ", lesson.before); next.textContent = "Start Reading →"; }
    else if(pauseShown && lesson.stops[page]){ showCard("CURRICULUM TEACHING STOP — PAUSE HERE", lesson.stops[page]); next.textContent = page===lesson.end ? "Finish Read Aloud ✓" : "Continue →"; }
    else { hideCard(); next.textContent = page===lesson.end ? "Finish Read Aloud ✓" : "Next →"; }
    notify();
  }
  prev.addEventListener("click",function(){
    if(pauseShown){ pauseShown=false; render(); return; }
    if(beforeOpen){ return; }
    if(page>lesson.start){ page--; render(); return; }
    beforeOpen=true; render();
  });
  next.addEventListener("click",function(){
    if(beforeOpen){ beforeOpen=false; render(); return; }
    if(lesson.stops[page] && !pauseShown){ pauseShown=true; render(); return; }
    if(pauseShown){ pauseShown=false; }
    if(page<lesson.end){ page++; render(); } else { finish(); }
  });
  byId("backBtn").addEventListener("click",overview);
  byId("notesBtn").addEventListener("click",function(){ byId("notesPanel").classList.toggle("open"); });
  byId("closeNotes").addEventListener("click",function(){ byId("notesPanel").classList.remove("open"); });
  pageImg.addEventListener("error",function(){ var box=byId("runtimeError"); box.textContent="Book image could not load: "+pageImg.getAttribute("src"); box.style.display="block"; });
  pageImg.addEventListener("load",function(){ byId("runtimeError").style.display="none"; });
  render();
}());
</script>
</body>
</html>
