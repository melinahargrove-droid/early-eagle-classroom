<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 5 Read Aloud</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:1.5vh 3vw}.top{height:9vh;display:flex;justify-content:space-between}.meta{font-weight:900;letter-spacing:.12em;color:#789697}.top h1{margin:.35vh 0;font-size:34px;color:#164f7f}.chip{font-weight:900;background:#dcecf0;border-radius:999px;padding:9px 16px;height:max-content}.stage{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:66% 1fr;gap:2.5vw;align-items:center;padding:2.5vh 3vw}.book{height:68vh;border-radius:24px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.book img{max-width:100%;max-height:100%;object-fit:contain;display:block}.copy h2{font-size:30px;margin:0 0 1vh;color:#164f7f}.copy p{font-size:16px;line-height:1.35;font-weight:800;color:#527673}.stop{background:#fff0c9;border:2px solid #e4c56d;border-radius:18px;padding:1.3vh 1vw;margin-top:1vh;font-size:16px;font-weight:900;color:#71591f;line-height:1.35}.stop:empty{display:none}.stop b{display:block;color:#9a6c13;letter-spacing:.08em;margin-bottom:.4vh}.note{background:#e7f0ed;border-radius:18px;padding:1.1vh 1vw;margin-top:1vh;font-size:15px;font-weight:900;color:#416d61}.controls{display:flex;justify-content:center;align-items:center;gap:12px;height:10vh}.controls button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 18px;font-weight:900;cursor:pointer}.controls .done{background:#668f99;color:#fff;border-color:#668f99}.count{font-weight:900;color:#66858b;min-width:90px;text-align:center}</style></head><body><main class="page"><header class="top"><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div id="sub"></div></div><div class="chip" id="chip"></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"></div><div class="copy"><h2>Today’s Read</h2><p id="focus"></p><div class="stop" id="stop"></div><div class="note" id="note"></div></div></section><div class="controls"><button id="prev">← Previous</button><div class="count" id="count"></div><button id="next">Next →</button><button class="done" onclick="location.href='week5-plan.html'">Done ✓</button></div></main><script>const d={Monday:{title:'Everybody in the Red Brick Building',sub:'Read 1 of 3 · What happens in the story?',prefix:'red-brick-building-',pages:17,focus:'Read the full text fluently, pausing only at the curriculum-designated places.',note:'After reading, use the illustrations to retell Natalia’s little story through the book.',stops:{3:'PAGE 3 • HOWL • Howl means to cry loudly. Notice how the big letters help show how loudly Izzie cried!',5:'PAGE 8 • CHALLENGE • Benny challenged, or invited, Cairo and Miles to play a game. What noise woke these three up?',6:'PAGE 10 • LAUNCH • Launch means to send into the air.',8:'PAGES 13–14 • READ THE PICTURE • There are almost no words here except the siren sound. What’s going on?',10:'PAGE 18 • PREDICT • Not many people are in the illustration. Where do you think everyone went?'}},Tuesday:{title:'Everybody in the Red Brick Building',sub:'Read 2 of 3 · Retelling events',prefix:'red-brick-building-',pages:17,focus:'Read the full text fluently and use the collage illustrations to retell events in order.',note:'After reading, slowly page through the whole story. Ask what happened first, next, and after that, and notice how the story begins and ends.',stops:{10:'PAGE 17 • COLLAGE • Look closely at the collage. What do you notice? What is happening at this point in the story?',14:'PAGE 26 • WORDS + PICTURES • Look at the collage and listen as the words are reread. What do you see and hear? What’s happening?'}},Wednesday:{title:'Everybody in the Red Brick Building',sub:'Read 3 of 3 · Acting out the story',prefix:'red-brick-building-',pages:17,focus:'Read the story aloud while children act out a selected scene or the whole story.',note:'The rug becomes the stage. Children may play any character—even Pepper the cat or the car alarm—and may pass if they do not want to act.',stops:{}},Thursday:{title:'My Day with Gong Gong',sub:'Read 1 of 4 · What’s the story about?',prefix:'my-day-with-gong-gong-',pages:21,focus:'Read the full text fluently, pausing only at the curriculum-designated places.',note:'After reading, ask whether children know someone who speaks a different language and how they communicate.',stops:{2:'PAGE 1 • COMMUNICATING • May and Gong Gong do not seem to speak the same language. Look at the pictures and words. How does May seem to feel?',6:'PAGE 9 • HELLO • What does everyone say to Gong Gong? “Nie Hou” means hello in Cantonese. Notice how happy Gong Gong looks greeting people in his neighborhood.',9:'PAGE 15 • STOMP • We are about halfway through. Show how you stomp your feet. How do you usually feel when you stomp? Do you think May feels that way?',12:'PAGE 21 • CHEERING UP • What is one way Gong Gong cheers up May?',21:'END • What happens at the end of the book?'}},Friday:{title:'My Day with Gong Gong',sub:'Read 2 of 4 · Retelling the first half',prefix:'my-day-with-gong-gong-',pages:9,focus:'Read only the first half. Stop the text after book page 14, then use the next illustration to support retelling.',note:'After reading, look back through the first half and ask what happened first, next, and after that. On the last displayed spread, use the picture only for the Page 16 feeling prompt.',stops:{4:'PAGE 6 • CHINESE ZODIAC • Monkey is the zodiac sign matching the year May was born. What does May see that she likes?',7:'PAGE 12 • MAY’S FEELINGS • Look at the illustration and listen as the words are reread. How is May feeling? Why? How do you feel when you are hungry?',8:'PAGE 14 • FRUSTRATED • May is so frustrated that she stomps at the birds. What is one reason she is upset?',9:'PAGE 16 • LOOK ONLY • Look at the illustration. How does May feel? Use this picture to support the first-half retell.'}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday,page=1;title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 5 · '+day.toUpperCase();focus.textContent=x.focus;note.textContent=x.note||'';function show(){pageImg.src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg';count.textContent=page+' of '+x.pages;prev.disabled=page===1;next.disabled=page===x.pages;let s=x.stops[page]||'';stop.innerHTML=s?'<b>CURRICULUM STOP</b>'+s:''}prev.onclick=()=>{if(page>1){page--;show()}};next.onclick=()=>{if(page<x.pages){page++;show()}};show();</script></body></html>
