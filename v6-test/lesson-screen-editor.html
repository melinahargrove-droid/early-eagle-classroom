<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Lesson Screen</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 62%,#e4eee9)}.wrap{max-width:980px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:38px}.back{border:1px solid #cbdde0;background:#fffdf8;color:#245c78;border-radius:14px;padding:10px 16px;font-weight:900;cursor:pointer}.card{margin-top:22px;background:#fffdf9;border:1.5px solid #cbdde0;border-radius:26px;padding:26px;box-shadow:0 14px 34px rgba(54,79,77,.08)}label{display:block;font-weight:900;margin:14px 0 6px;color:#456d78}input,textarea{width:100%;border:1.5px solid #c9dce0;border-radius:14px;background:white;padding:12px 14px;font:inherit;color:#174f7d}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hint{font-size:13px;color:#6d8584;margin-top:6px}.actions,.imageActions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}.actions button,.imageActions button,.uploadLabel{border:0;border-radius:14px;padding:12px 18px;font-weight:900;cursor:pointer}.save{background:#668f99;color:white}.delete{background:#f4e5e2;color:#8b4f49}.secondary,.uploadLabel{background:#e7f2f8;color:#245c78}.preview{margin-top:18px;border:1px dashed #b9cdd1;border-radius:20px;padding:18px;background:#f7fbf8}.preview h2{margin:0 0 8px;font-size:30px}.preview .body{font-size:20px;font-weight:800;color:#567674;white-space:pre-wrap}.preview .prompt{margin-top:14px;background:#e7f0ed;border-radius:14px;padding:12px;font-weight:900;color:#416d61}.preview .visual{min-height:170px;display:flex;align-items:center;justify-content:center;font-size:74px;text-align:center;margin:4px 0 14px}.preview .visual img{display:block;max-width:100%;max-height:260px;object-fit:contain;border-radius:18px}.imageBox{margin-top:14px;border:1px solid #d8e4e5;border-radius:18px;padding:16px;background:#fbfdfb}.imageBox strong{display:block;margin-bottom:6px}.imageStatus{font-size:13px;color:#6d8584}.uploadLabel{display:inline-block}#imageFile{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div id="crumb" style="font-weight:900;color:#789697;letter-spacing:.08em"></div><h1 id="heading">Add Screen</h1></div><button class="back" id="cancel">Cancel</button></div><section class="card"><div class="row"><div><label for="title">Screen title</label><input id="title" maxlength="80" placeholder="Example: Weather Symbols"></div><div><label for="visual">Emoji fallback</label><input id="visual" maxlength="8" placeholder="🌦️"></div></div><div class="imageBox"><strong>Screen image</strong><div class="imageStatus" id="imageStatus">No image selected. The emoji will be used instead.</div><div class="imageActions"><label class="uploadLabel" for="imageFile">🖼 Upload Image</label><input id="imageFile" type="file" accept="image/*"><button type="button" class="secondary" id="removeImage" hidden>Remove Image</button></div></div><label for="body">Main text</label><textarea id="body" maxlength="900" placeholder="What should children see or hear on this screen?"></textarea><label for="prompt">Prompt or direction</label><textarea id="prompt" maxlength="500" placeholder="Optional question, action, or teacher direction"></textarea><label for="note">Teacher note</label><textarea id="note" maxlength="700" placeholder="Optional note shown only when Teacher Note is opened"></textarea><div class="hint">Teacher-added screens are saved for this week, day, and lesson section. Uploaded images are stored in the app’s visual library, not inside the lesson record.</div><div class="preview"><div class="visual" id="pVisual">🌦️</div><h2 id="pTitle">Your Screen</h2><div class="body" id="pBody">Your main text will appear here.</div><div class="prompt" id="pPrompt">Optional prompt</div></div><div class="actions"><button class="delete" id="deleteBtn" hidden>Delete Screen</button><button class="save" id="save">Save Screen</button></div></section></main><script src="visual-store.js"></script><script>(()=>{const q=new URLSearchParams(location.search),week=Number(q.get('week'))||1,day=Math.max(0,Math.min(4,Number(q.get('day'))||0)),section=Math.max(0,Math.min(20,Number(q.get('section'))||0)),editId=q.get('id')||'',days=['Monday','Tuesday','Wednesday','Thursday','Friday'],sections=['Community Meeting','Read Aloud','Centers','Storytelling','Closing Circle'],KEY='eea-added-lesson-screens',RESUME='eea-lesson-resume';const $=id=>document.getElementById(id);function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return {}}}function write(x){localStorage.setItem(KEY,JSON.stringify(x))}function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}const bucket=`w${week}-d${day}-s${section}`;let data=read(),list=Array.isArray(data[bucket])?data[bucket]:[],current=editId?list.find(x=>x.id===editId):null,pendingImage='',removeExisting=false;const screenId=current?current.id:'screen-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);const imageKey=`lesson-added-${screenId}`;$('crumb').textContent=`WEEK ${week} · ${days[day].toUpperCase()} · ${(sections[section]||('SECTION '+(section+1))).toUpperCase()}`;$('heading').textContent=current?'Edit Screen':'Add Screen';if(current){$('title').value=current.title||'';$('visual').value=current.visual||'';$('body').value=current.body||'';$('prompt').value=current.prompt||'';$('note').value=current.note||'';$('deleteBtn').hidden=false}async function existingImage(){try{return await EEAVisualStore.get(imageKey)}catch(e){return''}}async function preview(){const visual=$('pVisual'),img=pendingImage||(!removeExisting?await existingImage():'');visual.innerHTML='';if(img){const el=document.createElement('img');el.src=img;el.alt='Lesson screen preview';visual.appendChild(el);$('imageStatus').textContent=pendingImage?'New image ready to save.':'Saved image is in use.';$('removeImage').hidden=false}else{visual.textContent=$('visual').value.trim()||'🌦️';$('imageStatus').textContent='No image selected. The emoji will be used instead.';$('removeImage').hidden=true}$('pTitle').textContent=$('title').value.trim()||'Your Screen';$('pBody').textContent=$('body').value.trim()||'Your main text will appear here.';$('pPrompt').textContent=$('prompt').value.trim()||'Optional prompt'}['title','visual','body','prompt'].forEach(id=>$(id).addEventListener('input',preview));$('imageFile').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{pendingImage=String(r.result||'');removeExisting=false;preview()};r.readAsDataURL(file)};$('removeImage').onclick=()=>{pendingImage='';removeExisting=true;$('imageFile').value='';preview()};function back(){location.href=`lesson-runner-week${week}.html?week=${week}&day=${day}&section=${section}&v=${Date.now()}`}$('cancel').onclick=back;$('save').onclick=async()=>{if(pendingImage)await EEAVisualStore.set(imageKey,pendingImage);else if(removeExisting)await EEAVisualStore.remove(imageKey);const item={id:screenId,title:$('title').value.trim()||'Teacher Added Screen',visual:$('visual').value.trim()||'⭐',imageKey,titleImage:false,body:$('body').value.trim(),prompt:$('prompt').value.trim(),note:$('note').value.trim(),updatedAt:Date.now()};let idx;if(current){idx=list.findIndex(x=>x.id===current.id);list=list.map(x=>x.id===current.id?item:x)}else{list.push(item);idx=list.length-1}data[bucket]=list;write(data);localStorage.setItem(RESUME,JSON.stringify({date:today(),week,day,section,mode:'custom',customIndex:Math.max(0,idx)}));back()};$('deleteBtn').onclick=async()=>{if(!current)return;if(confirm('Delete this teacher-added screen?')){try{await EEAVisualStore.remove(imageKey)}catch(e){}data[bucket]=list.filter(x=>x.id!==current.id);write(data);localStorage.setItem(RESUME,JSON.stringify({date:today(),week,day,section,mode:'builtin',customIndex:null}));back()}};preview()})();</script></body></html>
