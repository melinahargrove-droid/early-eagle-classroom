<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 7 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f6f1e5}.app,.stage{width:100%;height:100%}.stage{background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .08s}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Week 7 daily lesson"></iframe></section></main><script>(()=>{const params=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const day=Math.max(0,Math.min(4,Number(params.get('day'))||0));let section=Math.max(0,Math.min(6,Number(params.get('section'))||0));const flow=['community-meeting-week7.html','week7-read-aloud.html','week7-intro-centers.html','week7-small-groups.html','week7-building-blocks.html','week7-storytelling.html','closing-circle-week7.html'];const frame=document.getElementById('frame');localStorage.setItem('eea-daily-week','7');localStorage.setItem('eea-daily-day',String(day));const overview=()=>location.href=`daily-lessons.html?week=7&day=${day}&v=${Date.now()}`;function advance(){if(section>=6){location.href='index.html';return}section++;load()}function retreat(){if(section<=0){overview();return}section--;load()}function controls(doc){const finalButton=section>=4?doc.querySelector('.back'):null;return{next:doc.getElementById('next'),prev:doc.getElementById('prev'),done:doc.getElementById('done')||doc.getElementById('doneBtn')||doc.querySelector('.done')||finalButton,exit:doc.getElementById('closeBtn')||doc.getElementById('backBtn')||doc.getElementById('exit')}}function state(){try{const fn=frame.contentWindow.EEASectionState;return typeof fn==='function'?fn():null}catch(e){return null}}function communityState(doc){const cards=[...doc.querySelectorAll('.card')],index=cards.findIndex(x=>x.classList.contains('active'));return{index:index<0?0:index,total:cards.length}}function boundary(btn,type,on){if(btn)btn.dataset.eeaBoundary=on?type:''}function sync(doc){const c=controls(doc);[c.next,c.prev,c.done].forEach(b=>{if(b)b.dataset.eeaBoundary=''});if(section===0){const s=communityState(doc);if(c.prev){c.prev.disabled=false;boundary(c.prev,'back',s.index===0);if(s.index===0)c.prev.textContent='← Day Overview'}if(c.next){const end=s.total>0&&s.index===s.total-1;boundary(c.next,'forward',end);if(end)c.next.textContent='Next: Read Aloud →'}return}if(section===1){const s=state();if(c.prev){c.prev.disabled=false;c.prev.style.display='block';boundary(c.prev,'back',!!(s&&s.atStart));c.prev.textContent=s&&s.atStart?'← Community Meeting':'← Previous'}if(s&&c.next){boundary(c.next,'forward',!!s.atEnd);if(s.atEnd)c.next.textContent='Next: Centers →'}return}if(section===2){if(c.prev){c.prev.disabled=false;boundary(c.prev,'back',true);c.prev.textContent='← Read Aloud'}if(c.done){boundary(c.done,'forward',true);c.done.textContent='Next: Small Groups →'}return}if(section===3){if(c.done){boundary(c.done,'forward',true);c.done.textContent='Next: Building Blocks →'}return}if(section===4){if(c.done){boundary(c.done,'forward',true);c.done.textContent='Next: Storytelling →'}return}if(section===5){if(c.done){boundary(c.done,'forward',true);c.done.textContent='Next: Closing Circle →'}return}if(section===6&&c.done){boundary(c.done,'finish',true);c.done.textContent='Finish Today ✓'}}async function waitForVisuals(){try{const win=frame.contentWindow,doc=win.document;if(section===0){if(win.EEAVisualsReady)await win.EEAVisualsReady;return}if(section>=2){let script=doc.getElementById('eeaLessonVisualEdit');if(!script){script=doc.createElement('script');script.id='eeaLessonVisualEdit';script.src='lesson-visual-edit.js?v=20260823-1054';await new Promise(resolve=>{script.onload=resolve;script.onerror=resolve;doc.head.appendChild(script)})}if(win.EEAVisualsReady)await win.EEAVisualsReady}}catch(e){}}async function prepare(){let doc,win;try{win=frame.contentWindow;doc=win.document;if(!doc?.body)return}catch(e){return}sync(doc);const resync=()=>setTimeout(()=>sync(doc),0);win.addEventListener('eea-section-state',resync);doc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset.eeaBoundary;if(x){e.preventDefault();e.stopImmediatePropagation();if(x==='back')retreat();else if(x==='finish')location.href='index.html';else advance();return}const c=controls(doc);if(c.exit&&b===c.exit){e.preventDefault();e.stopImmediatePropagation();overview();return}resync()},true);await waitForVisuals();sync(doc);frame.style.opacity=1}function load(){frame.style.opacity=0;frame.src=`${flow[section]}?day=${encodeURIComponent(days[day])}&from=runner&week=7&section=${section}&v=${Date.now()}`}frame.addEventListener('load',()=>setTimeout(prepare,30));load()})();</script></body></html>
