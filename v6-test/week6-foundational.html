<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Foundational Literacy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{min-height:100vh;padding:24px}.card{max-width:1150px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:28px}.tag{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}.card h1,.card h2{color:#165487}.card h1{font-size:38px}.card h2{font-size:28px}.card p,.card li{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}.say{background:#e7f0ed;border-radius:18px;padding:15px;margin:12px 0}.bottom{display:flex;justify-content:center;gap:14px;margin-top:18px}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff;border-color:#668f99}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Foundational Literacy</h1><h2 id="title"></h2><div id="content"></div><div class="bottom"><button id="prev">← Writing</button><button class="done" id="done">Done ✓</button></div></section></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',from=p.get('from')||'';const d={Monday:{title:'Letter ID • Hh, Gg',html:`<p>Say—not sing—the alphabet while tracking each letter with a pointer. Review Mm, Aa, Ll, and Oo and ask what sounds children have practiced.</p><div class="say"><b>Listen for /h/:</b> Happy helpers clean up hula hoops.<br><b>Listen for /g/:</b> Goats glue glitter on gumdrops.</div><p>Introduce <b>Hh</b> and <b>Gg</b> with the letter cards: <b>H, hat, /h/</b> and <b>G, game, /g/</b>.</p><div class="say"><b>Mouth formation:</b> For /h/, open the mouth and notice the push of air from the back of the throat. For /g/, keep the mouth slightly open with the tongue working in the back of the mouth. Clip /g/ so it does not become “guh.”</div><p>Find /h/ and /g/ in words and objects. Curriculum examples include hello, house, hat, hop, goodbye, gold, Gong Gong, garden, glue, gumdrop, and egg as a final sound.</p>`},Tuesday:{title:'Concepts of Print • Return Sweep',html:`<p>Introduce <b>“Me in My Community” by MaryKate Heavey</b>. Point to the title. Read while tracking the print from top to bottom and left to right, visibly sweeping to the beginning of each new line.</p><div class="say">A community fits together like PB&amp;J<br>Giggle, grin, glide and gallop away<br>Hopping happily to be a helping hand<br>Play the guitar with a brand new band<br>Be kind to those along the way<br>Happy, hopeful, and true<br>Belonging is part of the community crew</div><p>Briefly define unfamiliar words such as <b>gallop</b>. Read the poem again and listen for /g/ in “Giggle, grin, glide and gallop away.”</p>`},Wednesday:{title:'Letter ID • Hh, Gg • Sky Writing',html:`<p>Say the alphabet while tracking the poster. Review the previously introduced letter cards and repeat each letter name, picture, and sound with clean, clipped sounds.</p><p>Invite children to stand. Use two “magic fingers” and a straight “laser” arm to sky-write uppercase and lowercase <b>Hh</b> and <b>Gg</b>.</p><div class="say"><b>Uppercase H:</b> big line down; hop to the top right and make another big line down; connect the big lines with a little line.<br><b>Uppercase G:</b> make a big curve to the left and around to the middle; add a little line to the right.</div><p>Also model lowercase h and g, then reinforce: <b>What says /h/? H says /h/.</b> and <b>What says /g/? G says /g/.</b></p>`},Thursday:{title:'Concepts of Print • Return Sweep',html:`<p>Return to <b>“Me in My Community.”</b></p><div class="say">Remind children: When we read, we follow the words from left to right. When we reach the end of a line, we sweep down to the beginning of the next line.</div><p>Point to the text and visibly demonstrate the return sweep as you read the poem.</p>`},Friday:{title:'Letter Review • Hh, Gg',html:`<p>Say the alphabet while tracking the poster. Review Mm, Aa, Ll, Oo, Hh, and Gg using the letter cards and repeat each letter name, picture, and sound.</p><p>Play the curriculum guessing game. Show a letter card, give clues including the initial sound, and allow children time to think.</p><ul><li><b>/h/ → hammer:</b> a helpful tool for attaching things; it sounds “tap, tap, tap.”</li><li><b>/g/ → garden:</b> a place where people grow vegetables and flowers.</li><li><b>/g/ → guitar:</b> a musical instrument with strings and a wooden body.</li></ul><div class="say"><b>Optional extension: Find the Letter.</b> Put letter cards in the middle of a circle. Name a letter or sound and invite a child or pair to find a matching card, show it to the group, and check whether it matches.</div>`}}[day];const $=id=>document.getElementById(id);$('tag').textContent='WEEK 6 · '+day.toUpperCase();$('title').textContent=d.title;$('content').innerHTML=d.html;$('prev').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEARetreat==='function'){parent.EEARetreat();return}location.href='week6-writing.html?day='+encodeURIComponent(day)};$('done').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEAAdvance==='function'){parent.EEAAdvance();return}location.href='week6-small-groups.html?day='+encodeURIComponent(day)}})();</script></body></html>
