<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Foundational Literacy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{min-height:100vh;padding:24px}.card{max-width:1150px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:28px}.tag{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}.card h1,.card h2{color:#165487}.card h1{font-size:38px}.card h2{font-size:28px}.card p,.card li{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}.say{background:#e7f0ed;border-radius:18px;padding:15px}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Foundational Literacy</h1><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week6-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'Letter ID • Hh, Gg',html:`<p>Say the alphabet while tracking each letter. Review Mm, Aa, Ll, and Oo, then introduce Hh and Gg.</p><div class="say"><b>Listen for /h/:</b> “Happy helpers clean up hula hoops.”<br><b>Listen for /g/:</b> “Goats glue glitter on gumdrops.”</div><p>Use the letter cards: <b>H, hat, /h/</b> and <b>G, game, /g/</b>. Practice clean, clipped sounds and notice /h/ and /g/ in words such as hello, house, goodbye, Gong Gong, garden, and glue.</p>`},Tuesday:{title:'Concepts of Print • Return Sweep',html:`<p>Introduce the poem <b>“Me in My Community” by MaryKate Heavey</b>. Track print from top to bottom and left to right, emphasizing the return sweep at the end of each line.</p><div class="say">A community fits together like PB&J<br>Giggle, grin, glide and gallop away<br>Hopping happily to be a helping hand<br>Play the guitar with a brand new band<br>Be kind to those along the way<br>Happy, hopeful, and true<br>Belonging is part of the community crew</div><p>Reread and listen for the /g/ sound in “Giggle, grin, glide, and gallop away.”</p>`},Wednesday:{title:'Letter ID • Hh, Gg • Sky Writing',html:`<p>Review Hh and Gg with the letter cards. Invite children to stand and use two “magic fingers” with a straight “laser” arm to sky-write uppercase and lowercase Hh and Gg.</p><div class="say">Reinforce: <b>What says /h/? H says /h/.</b><br><b>What says /g/? G says /g/.</b></div>`},Thursday:{title:'Concepts of Print • Return Sweep',html:`<p>Return to <b>“Me in My Community.”</b> Point to the words while reading left to right. At the end of each line, visibly sweep down and back to the beginning of the next line.</p>`},Friday:{title:'Letter Review • Hh, Gg',html:`<p>Say the alphabet while tracking the poster. Review Mm, Aa, Ll, Oo, Hh, and Gg.</p><p>Play the curriculum guessing game with initial sounds. Examples:</p><ul><li>/h/: a tool that sounds “tap, tap, tap” — <b>hammer</b></li><li>/g/: a place where people grow vegetables and flowers — <b>garden</b></li><li>/g/: a wooden musical instrument with strings — <b>guitar</b></li></ul>`}}[day];tag.textContent='WEEK 6 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
