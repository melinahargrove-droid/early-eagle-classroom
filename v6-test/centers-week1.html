<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Intro to Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.3vh 4.8vw;display:grid;grid-template-columns:46% 1fr;gap:4.5vw;align-items:center}.visual{position:relative;height:60vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;padding:3vh 2vw}.visual img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;border-radius:22px}.editVisual{position:absolute;left:14px;bottom:14px;z-index:35;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.95);color:#245c82;padding:.55vh .8vw;font-weight:900;font-size:clamp(11px,.72vw,14px);cursor:pointer;box-shadow:0 4px 12px #0002}.small{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px)}.content h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.sub{font-size:clamp(20px,1.35vw,27px);color:#527673;font-weight:900}.prompt{margin-top:2vh;padding:1.5vh 1.4vw;border-radius:19px;background:#e7f0ed;color:#416d61;font-size:clamp(21px,1.5vw,29px);font-weight:900;line-height:1.3}.reminder{margin-top:1.5vh;color:#557876;font-size:clamp(17px,1.12vw,22px);font-weight:850;line-height:1.4}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.review,.teacher,.next,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.teacher,.review{background:#fffdf8;color:#245c78}.review{border-color:#b9ced2}.next,.done{background:#668f99;color:white;border-color:#668f99}.done{position:absolute;right:3.2vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(530px,37vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.45;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · INTRO TO CENTERS</div><h1>Today in Centers</h1></div><div class="actions"><div class="chip" id="chip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="visual"><img id="art" alt="Center visual"></div><div class="content"><div class="small" id="small"></div><h2 id="title"></h2><div class="sub" id="sub"></div><div class="prompt" id="prompt"></div><div class="reminder" id="reminder"></div></div></section><div class="bottom"><button class="review" id="review" style="display:none">↺ Review Original Introduction</button><button class="teacher" id="teacher">⌃ &nbsp; Teacher Notes</button><button class="next" id="next" style="display:none">Next Center →</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS / VOCABULARY</div><p id="materials"></p></aside></main><script>(()=>{const all={Monday:[{title:'Crayons + Markers',sub:'Writing & Drawing',img:'assets/art.webp',small:'NEW CENTER',prompt:'Meet our Writing & Drawing Center',reminder:'We can draw or write to share our ideas.',notes:'Use the teaching sequence on screen. Teacher Notes preserve the curriculum materials, vocabulary, facilitation, differentiation, and standards.',materials:'Materials: crayons · markers · white paper · optional photograph of Writing & Drawing Center\nVocabulary: create · decide · explore · represent\nFacilitation: What drawing material will you choose? What colors do you want to use? What do you want to tell about your drawing? Would you like me to write any words for you? Where should we write your name?',steps:[{title:'Meet Writing & Drawing',prompt:'We have a Writing and Drawing Center in our classroom!',reminder:'Point to the center or show a photograph. Explain that children can use different materials to create, draw, or write to share ideas.',script:'We have a Writing and Drawing Center in our classroom! In our Writing and Drawing Center, we have different materials you can use to create, or make things, using drawing and writing. You can draw or write to share your ideas.'},{title:'Choose Your Tool',img:'assets/week1-writing-center-choose-tool-watercolor.png',prompt:'Markers or crayons — what will you decide to use?',reminder:'Hold up a crayon and marker and model making a choice. Connect choosing materials to Lola choosing things to play with at school.',script:'Today we are going to use markers and crayons. You can decide, or make a choice, about which you want to use, just like Lola got to choose different things to play with in her classroom.'},{title:'Talk About Your Drawing',img:'assets/week1-writing-center-share-drawing-watercolor.png',prompt:'You can create and share ideas with your friends.',reminder:'Model talking with a friend about what you are making and showing/telling about a drawing.',script:'When you’re at Writing and Drawing, you can talk with your friends and ask them about what they’re making, and you can show your friends what you make and tell them about your drawing.'},{title:'Listen for the Click!',img:'assets/week1-writing-center-marker-click-watercolor.png',prompt:'Take the cap off → draw → put the cap back on until it CLICKS.',reminder:'Model the entire marker routine and pause so children can listen for the click.',script:'I think I’ll choose to draw with a marker. I’ll take off the cap, and draw on my paper. When I’m all done, I’ll put the cap back on the marker and press down until I hear a click. Listen to see if you can hear the click!'},{title:'Paper Is for Drawing',img:'assets/week1-writing-center-paper-drawing-watercolor.png',prompt:'Markers and crayons stay on the paper.',reminder:'Set the curriculum expectation explicitly: not on tables or other classroom materials.',script:'Markers and crayons are for writing on paper. It is important to write just on the paper, not on the tables or anything else in our classroom. Paper is for writing and drawing!'},{title:'Take Care of the Markers',img:'assets/week1-writing-center-uncapped-markers-watercolor.png',prompt:'Cap it tightly so it is ready for the next friend.',reminder:'Model capping the marker. Ask what children think would happen if the cap were left off, then return it and choose another color.',script:'Now I know that the marker cap is on tight, and that keeps the marker good and ready for other friends to use. What do you think would happen if I didn’t put the cap on the marker? I’ll put it back in the cup and choose another color.'},{title:'When You’re Finished',img:'assets/week1-writing-center-cubby-finished-work-watercolor.png',prompt:'Ask a teacher for your name → put your work in your cubby → choose another place to play.',reminder:'Model the clean-up/finished-work routine exactly as it works in your classroom.',script:'When I’m done drawing, I’ll ask a teacher to write my name on my paper, and put it in my cubby. Then I can choose another place to play.'}]},{title:'Playdough',sub:'Science & Engineering',img:'assets/science.webp',small:'NEW CENTER',prompt:'Explore playdough with your senses.',reminder:'Touch · smell · see · roll · pinch · press',notes:'Focus on 3s Week 1 Exploring Playdough.',materials:'Materials: prepared playdough · Five Senses visuals · playdough topic board\nVocabulary: explore · senses · smell · touch · see · roll · pinch · press\nFacilitation: What do you notice? How does it look, smell, feel? What are your hands doing to change its shape?',steps:[{title:'Meet Science & Engineering',prompt:'We use our senses to explore.',reminder:'Introduce the Science & Engineering Center and the senses of touch, smell, and sight.',script:'In our class, we have a Science and Engineering Center! Here, we will use our senses of touch, smell, and sight to work with playdough. We will use this playdough to roll, pinch, and press to make creations.'},{title:'Use Your Senses',img:'assets/week1-science-playdough-children-watercolor.png',prompt:'How does the playdough feel? Smell? Look?',reminder:'Demonstrate touching, smelling, and looking at the playdough.',script:'This playdough feels ____. The playdough smells like _____. I can make a sound with the playdough like this…'},{title:'What Else Can We Do?',img:'assets/week1-science-playdough-can-watercolor.png',prompt:'What else can we do with playdough?',reminder:'Collect children’s ideas, then invite them to explore during Centers.',script:'What else can we do with playdough? I can’t wait to see what you will try with playdough today in our Science and Engineering Center.'}]}],Tuesday:[{title:'Exploring Books',sub:'Library & Listening',img:'assets/reading.webp',small:'NEW CENTER',prompt:'Meet Library & Listening',reminder:'Choose · gentle hands · turn pages · put books back',notes:'Focus on 3s Week 1 Looking at Books.',materials:'Materials: Lola Goes to School · Unit books · varied familiar/identity-affirming books\nVocabulary: book · choose · gentle · page\nFacilitation: Why did you choose this book? What do you notice? What is happening? Does it remind you of anything?',steps:[{title:'Meet Library & Listening',prompt:'Lola reads books at school. We have a place for books, too!',reminder:'Connect to Lola Goes to School and point to/show the classroom center.',script:'In Lola Goes to School, Lola reads books in a tent and thinks about ideas. We have a Library and Listening Center in our classroom, too. This is a place where you can sit and read books.'},{title:'Choose a Book',prompt:'Look carefully and choose a book.',reminder:'Demonstrate looking between two books and deciding on one.',script:'When you first come to the Center, you will choose, or pick, a book.'},{title:'Gentle Hands',img:'assets/focus-3s/unit-1/week-1/centers/library-listening/gentle-hands-full.png',prompt:'Books are special. Turn the pages carefully.',reminder:'Model front cover, gentle page turning, and noticing/talking about an illustration.',script:'Books are special, they help us to learn. We want to enjoy them and take care of them. We must be gentle, or careful, and turn the pages carefully. I love this book because _____!'},{title:'Put It Back',prompt:'Put your book back before choosing another.',reminder:'Demonstrate carefully returning the book to its bin or shelf.',script:'I wonder which books you will enjoy looking at this week!'}]},{title:'Blocks Exploration',sub:'Blocks',img:'assets/blocks.webp',small:'NEW CENTER',prompt:'Meet the Block Center',reminder:'Take blocks out · build · put them back',notes:'Focus on 3s Week 1 Free Exploration.',materials:'Materials: Lola Goes to School building page · one type of block · Playing in Blocks routine visual · Simple Block Structures-Neighborhoods visual · blocks topic board\nVocabulary: explore · build · create · structure · stable',steps:[{title:'Remember Lola’s Castle',prompt:'Lola and her friends built a castle with blocks.',reminder:'Show the flagged Lola image of Lola and friends building.',script:'In Lola Goes to School, Lola and her friends built a castle out of blocks. We have blocks in our classroom too!'},{title:'How We Build',prompt:'Take blocks from the shelf and build on the floor or carpet.',reminder:'Model taking blocks out and building a simple structure.',script:'We build with blocks in our block area like this: first, we take blocks off the shelf or out of the bin and put them on the floor or carpet. Then we use our imagination and build.'},{title:'Blocks Go Back Home',prompt:'Use the shelf pictures to put blocks back where they belong.',reminder:'Model returning blocks to their labeled places.',script:'When we are finished building with our blocks we put them back on the shelf or in the bin. Look at the pictures to put the blocks in their proper places.'},{title:'Explore & Create',prompt:'A castle—or something completely different?',reminder:'Invite children to explore block sizes and shapes.',script:'Today, you can visit our block area and explore the different sizes and shapes of our blocks. You might build a castle, like Lola and her friends, or you can create something different.'}]}],Wednesday:[{title:'Cooking',sub:'Dramatic Play',img:'assets/dramatic-play.webp',small:'NEW CENTER',prompt:'Meet Dramatic Play',reminder:'Pretend · prepare · cook · clean up',notes:'Focus on 3s Week 1 Cooking.',materials:'Materials: Lola Goes to School · kitchen furniture · culturally representative play food/tools · labeled containers · cookbooks/recipes · cooking visuals/topic board\nVocabulary: chop · cook · ingredient · prepare · mix · recipe',steps:[{title:'Meet Dramatic Play',prompt:'Here you can pretend to be anyone or anything.',reminder:'Gather around Dramatic Play or show a photograph. Connect to Lola playing dress-up.',script:'In Lola Goes to School, Lola plays dress up. In our classroom, we have an area like that too. This is the Dramatic Play Center. In this Center, you can pretend to be anyone or anything. The Dramatic Play Center will change throughout the year.'},{title:'Our Kitchen',prompt:'Kitchens are places where people prepare food.',reminder:'Give a simple tour and model the furniture/appliances.',script:'Right now, the Dramatic Play Center is set up like a kitchen. Kitchens are places where people prepare, or make, different kinds of food.'},{title:'Let’s Make Soup',prompt:'What ingredients do we need?',reminder:'Model pretending to be a family member, checking a recipe, and choosing ingredients.',script:'I might pretend to be a grandma making food for her family. Cooking food is one way people show they care for each other. I will cook some soup. What ingredients do I need? Let me check the recipe.'},{title:'First, Next, Then, Finally',prompt:'Pretend to prepare and cook the food step by step.',reminder:'Model washing/chopping, stove/pot, mixing, serving, using sequential language.',script:'Model referencing the recipe and use first, next, then, finally while preparing the pretend soup. Put it in a bowl and serve it: Would you like some soup?'},{title:'Clean Up the Kitchen',prompt:'Use the labels to put everything back.',reminder:'Model the complete clean-up routine using labeled bins/shelves.',script:'Model and talk through clean up. Look at the labels on bins and shelves and put items back in the correct location.'}]},{title:'Paper Collages',sub:'Art Studio',img:'assets/art.webp',small:'NEW CENTER',prompt:'Meet the Art Studio',reminder:'Choose · glue · create · clean up',notes:'Focus on 3s Week 1 Paper Collages.',materials:'Materials: Lola Goes to School p.19 · varied paper pieces · background paper · adhesive · optional Art Studio photo · Art Studio Routine · Using a Glue Stick visual · Collage Artists resource\nVocabulary: adhere · collage · decide',steps:[{title:'Meet the Art Studio',prompt:'Explore materials and share your ideas through art.',reminder:'Point to/show the Art Studio and connect to Lola’s friend painting at the easel on page 19.',script:'We have an Art Studio in our classroom! This is a place where you can explore and try different materials to share your ideas. In Lola Goes to School, Lola’s friend created art by painting at an easel.'},{title:'What Is a Collage?',prompt:'A collage uses different pieces glued onto paper.',reminder:'Show paper pieces and examples; invite children to notice collages by artists.',script:'Today in the Art Studio we can make collages. A collage is a kind of art where different pieces are glued on paper to make a picture. You can use these pieces of paper to make your own collage.'},{title:'Choose & Glue',prompt:'Decide on a piece. Use just a little glue.',reminder:'Model choosing a paper piece, twisting up only a little glue, and gently rubbing glue on the paper.',script:'I think I’ll decide, or choose, to put this red piece on my collage. I’ll use a glue stick to adhere, or stick the paper on. I’ll take the cap off and twist the end so just a little bit of glue comes out.'},{title:'Cap the Glue',prompt:'Put the cap back on so the glue is ready for the next artist.',reminder:'Model capping the glue and putting it away.',script:'When I’m all done, I’ll put the cap right back on the glue stick, so it won’t dry out and it will be ready for the next artist!'},{title:'Finished Artwork',prompt:'Put your collage on the drying rack, then choose another place to play.',reminder:'Model the finished-work routine. Remind children any design is welcome and friends may work together.',script:'Then I will put my collage on the drying rack and choose another place to play. You can make any design you like. You could even work with a friend to make a collage. I can’t wait to see what you create!'}]}],Thursday:[{title:'Revisit Playdough',sub:'Science & Engineering',img:'assets/science.webp',small:'REVISIT',prompt:'Return to Playdough',reminder:'Children return to the playdough experience and established Science & Engineering routines.',notes:'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Teacher Notes for a quick reminder, or Review Original Introduction if the group needs the full original teaching sequence.',materials:'Original materials, vocabulary, facilitation, and differentiation remain available through the original introduction.',revisit:{day:'Monday',item:1}},{title:'Revisit Collage',sub:'Art Studio',img:'assets/art.webp',small:'REVISIT',prompt:'Return to Paper Collages',reminder:'Children return to the Paper Collages experience and established Art Studio routines.',notes:'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Teacher Notes for a quick reminder, or Review Original Introduction if the group needs the full original teaching sequence.',materials:'Original materials, vocabulary, facilitation, and differentiation remain available through the original introduction.',revisit:{day:'Wednesday',item:1}}],Friday:[{title:'Revisit Cooking',sub:'Dramatic Play',img:'assets/dramatic-play.webp',small:'REVISIT',prompt:'Return to Cooking',reminder:'Children return to the Cooking experience and established Dramatic Play routines.',notes:'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Teacher Notes for a quick reminder, or Review Original Introduction if the group needs the full original teaching sequence.',materials:'Original materials, vocabulary, facilitation, and differentiation remain available through the original introduction.',revisit:{day:'Wednesday',item:0}},{title:'Revisit Blocks',sub:'Blocks',img:'assets/blocks.webp',small:'REVISIT',prompt:'Return to Blocks',reminder:'Children return to Free Exploration Blocks and established Block Center routines.',notes:'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Teacher Notes for a quick reminder, or Review Original Introduction if the group needs the full original teaching sequence.',materials:'Original materials, vocabulary, facilitation, and differentiation remain available through the original introduction.',revisit:{day:'Tuesday',item:1}}]};const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',target=p.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html',items=all[day]||all.Monday;let i=Math.max(0,Math.min(items.length-1,Number(p.get('item'))||0)),step=Math.max(0,Number(p.get('step'))||0),visualToken=0;const $=id=>document.getElementById(id),asset=src=>{if(!src)return src;if(src.startsWith('assets/'))return '/early-eagle-classroom/v6-test/'+src+'?v=20260919-b96353';return src},slot=()=>`week1-centers-${day.toLowerCase()}-${i}`+(items[i]?.steps?`-step-${step}`:'');function render(){const d=items[i],s=d.steps?.[step];$('chip').textContent='WEEK 1 · '+day.toUpperCase()+` · ${i+1}/${items.length}`+(d.steps?` · STEP ${step+1}/${d.steps.length}`:'');$('art').src=asset(d.steps?.[step]?.img||d.img);$('small').textContent=d.small;$('title').textContent=s?.title||d.title;$('sub').textContent=d.sub;$('prompt').textContent=s?.prompt||d.prompt;$('reminder').textContent=s?.reminder||d.reminder;$('noteTitle').textContent=s?.title||d.title;$('notes').textContent=s?.script||d.notes;$('materials').textContent=d.materials;$('review').style.display=d.revisit?'inline-block':'none';$('next').style.display=(d.steps&&step<d.steps.length-1)||i<items.length-1?'inline-block':'none';$('next').textContent=d.steps&&step<d.steps.length-1?'Next Step →':'Next Center →';$('done').style.display=i===items.length-1&&(!d.steps||step===d.steps.length-1)?'inline-block':'none';$('panel').classList.remove('open')}$('next').onclick=()=>{const d=items[i];if(d.steps&&step<d.steps.length-1){step++;render()}else if(i<items.length-1){i++;step=0;render()}};$('done').onclick=$('exit').onclick=()=>location.href=target;$('review').onclick=()=>{const d=items[i];if(!d.revisit)return;location.href='centers-week1.html?day='+encodeURIComponent(d.revisit.day)+'&item='+d.revisit.item+'&review=1&from='+encodeURIComponent(p.get('from')||'')};$('teacher').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');render()})();</script></body></html>
