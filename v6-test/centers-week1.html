<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Intro to Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.3vh 4.8vw;display:grid;grid-template-columns:46% 1fr;gap:4.5vw;align-items:center}.visual{position:relative;height:60vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;padding:3vh 2vw}.visual img{max-width:92%;max-height:55vh;object-fit:contain;border-radius:22px}.editVisual{position:absolute;left:14px;bottom:14px;z-index:35;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.95);color:#245c82;padding:.55vh .8vw;font-weight:900;font-size:clamp(11px,.72vw,14px);cursor:pointer;box-shadow:0 4px 12px #0002}.small{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px)}.content h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.sub{font-size:clamp(20px,1.35vw,27px);color:#527673;font-weight:900}.prompt{margin-top:2vh;padding:1.5vh 1.4vw;border-radius:19px;background:#e7f0ed;color:#416d61;font-size:clamp(21px,1.5vw,29px);font-weight:900;line-height:1.3}.reminder{margin-top:1.5vh;color:#557876;font-size:clamp(17px,1.12vw,22px);font-weight:850;line-height:1.4}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.next,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.teacher{background:#fffdf8;color:#245c78}.next,.done{background:#668f99;color:white;border-color:#668f99}.done{position:absolute;right:3.2vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(530px,37vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.45;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · INTRO TO CENTERS</div><h1>Today in Centers</h1></div><div class="actions"><div class="chip" id="chip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="visual"><img id="art" alt="Center visual"><button class="editVisual" id="editVisual">✎ Edit Visual</button></div><div class="content"><div class="small" id="small"></div><h2 id="title"></h2><div class="sub" id="sub"></div><div class="prompt" id="prompt"></div><div class="reminder" id="reminder"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Notes</button><button class="next" id="next" style="display:none">Next Center →</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS / VOCABULARY</div><p id="materials"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Crayons + Markers',sub:'Writing & Drawing',img:'assets/art.webp',small:'NEW CENTER',prompt:'Meet our Writing & Drawing Center',reminder:'We can draw or write to share our ideas.',notes:'Use the teaching sequence on screen. Teacher Notes preserve the curriculum materials, vocabulary, facilitation, differentiation, and standards.',materials:'Materials: crayons · markers · white paper · optional photograph of Writing & Drawing Center\nVocabulary: create · decide · explore · represent\nFacilitation: What drawing material will you choose? What colors do you want to use? What do you want to tell about your drawing? Would you like me to write any words for you? Where should we write your name?',steps:[{title:'Meet Writing & Drawing',prompt:'We have a Writing and Drawing Center in our classroom!',reminder:'Point to the center or show a photograph. Explain that children can use different materials to create, draw, or write to share ideas.',script:'We have a Writing and Drawing Center in our classroom! In our Writing and Drawing Center, we have different materials you can use to create, or make things, using drawing and writing. You can draw or write to share your ideas.'},{title:'Choose Your Tool',prompt:'Markers or crayons — what will you decide to use?',reminder:'Hold up a crayon and marker and model making a choice. Connect choosing materials to Lola choosing things to play with at school.',script:'Today we are going to use markers and crayons. You can decide, or make a choice, about which you want to use, just like Lola got to choose different things to play with in her classroom.'},{title:'Talk About Your Drawing',prompt:'You can create and share ideas with your friends.',reminder:'Model talking with a friend about what you are making and showing/telling about a drawing.',script:'When you’re at Writing and Drawing, you can talk with your friends and ask them about what they’re making, and you can show your friends what you make and tell them about your drawing.'},{title:'Listen for the Click!',prompt:'Take the cap off → draw → put the cap back on until it CLICKS.',reminder:'Model the entire marker routine and pause so children can listen for the click.',script:'I think I’ll choose to draw with a marker. I’ll take off the cap, and draw on my paper. When I’m all done, I’ll put the cap back on the marker and press down until I hear a click. Listen to see if you can hear the click!'},{title:'Paper Is for Drawing',prompt:'Markers and crayons stay on the paper.',reminder:'Set the curriculum expectation explicitly: not on tables or other classroom materials.',script:'Markers and crayons are for writing on paper. It is important to write just on the paper, not on the tables or anything else in our classroom. Paper is for writing and drawing!'},{title:'Take Care of the Markers',prompt:'Cap it tightly so it is ready for the next friend.',reminder:'Model capping the marker. Ask what children think would happen if the cap were left off, then return it and choose another color.',script:'Now I know that the marker cap is on tight, and that keeps the marker good and ready for other friends to use. What do you think would happen if I didn’t put the cap on the marker? I’ll put it back in the cup and choose another color.'},{title:'When You’re Finished',prompt:'Ask a teacher for your name → put your work in your cubby → choose another place to play.',reminder:'Model the clean-up/finished-work routine exactly as it works in your classroom.',script:'When I’m done drawing, I’ll ask a teacher to write my name on my paper, and put it in my cubby. Then I can choose another place to play.'}]},{title:'Playdough',sub:'Science & Engineering',img:'assets/science.webp',small:'NEW CENTER',prompt:'What can your hands do with playdough?',reminder:'Roll it. Pinch it. Press it. Playdough stays at the table.',notes:'Invite children to notice the playdough with touch, smell, and sight. Demonstrate rolling, pinching, and pressing.',materials:'Playdough · roll · pinch · press'}],Tuesday:[{title:'Exploring Books',sub:'Library & Listening',img:'assets/reading.webp',small:'NEW CENTER',prompt:'What book would you like to explore?',reminder:'Use gentle hands. Look at the cover and pictures, turn pages carefully, and return the book when you are finished.',notes:'Focus on 3s Week 1: Exploring Books. Model choosing a book, looking at the cover and illustrations, turning pages carefully, talking about a book, and returning it.',materials:'Classroom books · book bins · cover · pictures · pages'},{title:'Blocks Exploration',sub:'Blocks',img:'assets/blocks.webp',small:'NEW CENTER',prompt:'What can you discover with our blocks?',reminder:'Look at the shapes and sizes. Build carefully and keep blocks in the Blocks Center.',notes:'Focus on 3s Week 1: Free Exploration in Blocks. Introduce the available blocks and invite children to explore their shapes, sizes, and possibilities.',materials:'Unit blocks · explore · build · shape · size'}],Wednesday:[{title:'Cooking',sub:'Dramatic Play',img:'assets/dramatic-play.webp',small:'NEW CENTER',prompt:'What could you pretend to cook?',reminder:'Pretend together, share the food and tools, and put things back when you finish.',notes:'Focus on 3s Week 1: Cooking. Introduce the Dramatic Play cooking materials and support children in pretending to prepare and share food.',materials:'Play food · dishes · kitchen tools · cooking materials'},{title:'Paper Collages',sub:'Art Studio',img:'assets/art.webp',small:'NEW CENTER',prompt:'What can you create by putting pieces of paper together?',reminder:'Choose paper pieces, arrange them, and use the collage materials carefully.',notes:'Focus on 3s Week 1: Paper Collages. Introduce collage materials and invite children to explore arranging and combining paper pieces.',materials:'Paper pieces · collage materials · arrange · combine'}],Thursday:[{title:'Revisit Playdough',sub:'Science & Engineering',img:'assets/science.webp',small:'REVISIT',prompt:'What do you remember about exploring playdough?',reminder:'Roll it, pinch it, press it, and keep the playdough in the center.',notes:'Focus on 3s Week 1 Day 4: Revisit the Playdough experience introduced on Day 1. Briefly remind children of the established materials and routines rather than introducing a new center.',materials:'Playdough · revisit established routines'},{title:'Revisit Collage',sub:'Art Studio',img:'assets/art.webp',small:'REVISIT',prompt:'What could you try with the collage materials today?',reminder:'Choose and arrange paper pieces, use the materials carefully, and clean up when you finish.',notes:'Focus on 3s Week 1 Day 4: Revisit Paper Collages from Day 3. Remind children of the established materials and routines and invite continued exploration.',materials:'Paper pieces · collage materials · revisit established routines'}],Friday:[{title:'Revisit Cooking',sub:'Dramatic Play',img:'assets/dramatic-play.webp',small:'REVISIT',prompt:'What could you pretend to cook or prepare today?',reminder:'Pretend together, share the food and tools, and put things back when you finish.',notes:'Focus on 3s Week 1 Day 5: Revisit Cooking from Day 3. Briefly remind children of the established Dramatic Play materials and routines and invite continued pretend play.',materials:'Play food · dishes · kitchen tools · revisit established routines'},{title:'Revisit Blocks',sub:'Blocks',img:'assets/blocks.webp',small:'REVISIT',prompt:'What could you explore or build with the blocks today?',reminder:'Look at the shapes and sizes, build carefully, and return blocks to the Blocks Center.',notes:'Focus on 3s Week 1 Day 5: Revisit the Blocks exploration from Day 2. Briefly remind children of the established materials and routines and invite continued exploration.',materials:'Unit blocks · explore · build · revisit established routines'}]};const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',target=p.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html',items=all[day]||all.Monday;let i=Math.max(0,Math.min(items.length-1,Number(p.get('item'))||0)),step=0,visualToken=0;const $=id=>document.getElementById(id),slot=()=>`week1-centers-${day.toLowerCase()}-${i}`;async function applyVisual(d){const token=++visualToken;let src='';try{await EEAVisualStore.migrate();src=await EEAVisualStore.get(slot())}catch(e){}if(token!==visualToken)return;$('art').src=src||d.img}function render(){const d=items[i],s=d.steps?.[step];$('chip').textContent='WEEK 1 · '+day.toUpperCase()+` · ${i+1}/${items.length}`+(d.steps?` · STEP ${step+1}/${d.steps.length}`:'');$('art').src=d.img;applyVisual(d);$('small').textContent=d.small;$('title').textContent=s?.title||d.title;$('sub').textContent=d.sub;$('prompt').textContent=s?.prompt||d.prompt;$('reminder').textContent=s?.reminder||d.reminder;$('noteTitle').textContent=s?.title||d.title;$('notes').textContent=s?.script||d.notes;$('materials').textContent=d.materials;$('next').style.display=(d.steps&&step<d.steps.length-1)||i<items.length-1?'inline-block':'none';$('next').textContent=d.steps&&step<d.steps.length-1?'Next Step →':'Next Center →';$('done').style.display=i===items.length-1&&(!d.steps||step===d.steps.length-1)?'inline-block':'none';$('panel').classList.remove('open')}$('next').onclick=()=>{const d=items[i];if(d.steps&&step<d.steps.length-1){step++;render()}else if(i<items.length-1){i++;step=0;render()}};$('done').onclick=$('exit').onclick=()=>location.href=target;$('teacher').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);q.set('item',String(i));const back='centers-week1.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(back)};render()})();</script></body></html>
