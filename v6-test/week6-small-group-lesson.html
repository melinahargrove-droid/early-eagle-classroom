<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Small Group</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f7f2e7}.page{height:100vh;padding:4vh 6vw}.card{height:80vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;padding:5vh 6vw;display:grid;grid-template-columns:35% 1fr;gap:5vw;align-items:center}.visual{height:52vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;font-size:90px}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:55px;margin:1vh 0;color:#164f7f}.lead{font-size:25px;font-weight:900;color:#527673}.steps{display:grid;gap:1vh;margin-top:2vh}.step{background:#e7f0ed;border-radius:16px;padding:1.1vh 1vw;font-size:18px;font-weight:900;color:#416d61}.bottom{display:flex;justify-content:center;gap:14px;margin-top:2vh}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff;border-color:#668f99}</style></head><body><main class="page"><section class="card"><div class="visual" id="icon"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="back">← Small Group Choices</button><button class="done" id="done">Done with Small Groups ✓</button></div></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const d={writing:{icon:'✏️',title:'Writing Basics',lead:'Communicate about yourself through drawing.',steps:['Remind children of the true story you told during Writing and briefly revisit Wave. Explain that writers can communicate through words and through images.','Model choosing one part of your true story to draw. Begin with pencil and explain that a sketch is a quick drawing used to get an idea onto paper.','Invite children to think of a true story about themselves and sketch one part of it. Ask: “What might you sketch to show part of your story?”','Support children in adding meaningful details, then allow them to add color with crayons. For now, do not add adult-written words other than children’s names.']},skills:{icon:'🔤',title:'Skills Reinforcement',lead:'Week 6 is aligned with Heggerty Week 3 skills.',steps:['Rhyme repetition: sun/fun, fox/socks, in/fin, den/fen, last/fast.','Initial phoneme isolation: food /f/, gold /g/, time /t/, cool /c/, dog /d/.','Blending words: dog-wood, good-bye, butter-fly, out-side, sun-set.','Final sound isolation: trees /s/, dash /sh/, flop /p/, build /d/, sit /t/.','Segmenting compound words: dogwood, goodbye, butterfly, outside, sunset. Use the Week 6 Rhyming Word Match-Up, Initial Phoneme Isolation, or Blending Words Card Game as appropriate.']},sequence:{icon:'🧩',title:'My Day with Gong Gong Sequencing',lead:'Put important events in order from first to last.',steps:['Review the five sequencing cards: Gong Gong arrives while May looks anxious; May and Gong Gong walk through the neighborhood; May cries after the bird incident; Gong Gong gives May a gift; May and Gong Gong hug and say “I love you.”','Talk together about what is happening on each card.','Model choosing the first card, then have children work together to place the remaining events in order.','Ask: “What do you think is the most important event in the story?”']},fine:{icon:'🤏',title:'Fine Motor Development',lead:'Choose activities based on observation and children’s individual goals.',steps:['Use observation and IEP goals, when applicable, to choose an activity that builds fine-motor skill and stamina.','Use the established Fine Motor Development options from the curriculum introduction.','Provide only the amount of support each child needs.']}};const p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',x=d[p.get('activity')]||d.writing,from=p.get('from')||'';const $=id=>document.getElementById(id);$('icon').textContent=x.icon;$('eye').textContent='WEEK 6 · '+day.toUpperCase();$('title').textContent=x.title;$('lead').textContent=x.lead;$('steps').innerHTML=x.steps.map(s=>'<div class="step">'+s+'</div>').join('');$('back').onclick=()=>location.href='week6-small-groups.html?day='+encodeURIComponent(day)+'&from='+encodeURIComponent(from||'runner');$('done').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEAAdvance==='function'){parent.EEAAdvance();return}location.href='week6-storytelling.html?day='+encodeURIComponent(day)} })();</script></body></html>
