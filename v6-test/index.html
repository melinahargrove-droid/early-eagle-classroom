<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEA Classroom Companion — V6 Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e4e7}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#123d78}#app{position:relative;width:100vw;height:100vh;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.ui{position:absolute;inset:0;z-index:2}.panel{position:absolute}.shell{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.panel h2{position:absolute;z-index:2;left:0;right:0;margin:0;text-align:center;color:#fff;font-size:26px;font-weight:900}.schedule h2{top:2.05%}.next h2{top:4.75%}.star h2{top:4%}.friends h2{top:3.5%}.date-card{position:absolute;left:1.2%;top:2.2%;width:9.1%;height:8.2%;z-index:3}.date-card>img{position:absolute;inset:0;width:100%;height:100%}.date-copy{position:absolute;left:37%;right:11%;top:19%;bottom:18%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900}.weekday{font-size:clamp(14px,1vw,20px)}.full{font-size:clamp(8px,.58vw,12px)}.schedule{left:10%;top:12%;width:20%;height:69%}.schedule-list{position:absolute;z-index:2;left:7%;right:7%;top:15%;bottom:5%;display:flex;flex-direction:column;justify-content:space-evenly}.schedule-row{display:grid;grid-template-columns:20% 1fr 11%;align-items:center;column-gap:4%;height:9.2%;padding:.6% 4%;border-radius:13px;font-weight:900;font-size:clamp(17px,1.2vw,24px);cursor:pointer}.schedule-row img{width:100%;height:86%;object-fit:contain}.schedule-row.active{background:rgba(184,211,232,.48)}.status-circle{justify-self:end;width:clamp(15px,1.15vw,22px);height:clamp(15px,1.15vw,22px);border:2px solid #6d91b5;border-radius:50%}.schedule-row.done .status-circle{background:#6f99c4}.schedule-row.done .status-circle:after{content:'✓';color:white}.next{left:31%;top:10%;width:38%;height:51%}.next-content{position:absolute;z-index:2;left:8%;right:8%;top:18%;bottom:7%;display:flex;align-items:center;justify-content:center;gap:2.5%}.next-content img{width:43%;height:92%;object-fit:contain}.next-title{font-weight:900;font-size:clamp(46px,4.35vw,84px)}.timer{left:31%;top:61%;width:38%;height:20%}.timer-value{position:absolute;z-index:2;left:0;right:0;top:27%;text-align:center;font-size:clamp(44px,4vw,78px);font-weight:900}.star{left:70%;top:12%;width:20%;height:32%}.star-name{position:absolute;z-index:2;left:5%;right:5%;bottom:9%;text-align:center;font-size:clamp(22px,1.7vw,34px);font-weight:900}.friends{left:70%;top:44%;width:20%;height:37%}.friends-count{position:absolute;z-index:2;inset:25% 8% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center}.friends-count strong{font-size:clamp(48px,4vw,78px)}.friends-count span{font-size:clamp(14px,1.05vw,21px);font-weight:900}.utility{position:absolute;width:4.8%;height:12.5%}.utility img{width:100%;height:75%;object-fit:contain}.eddie{left:90%;top:.3%}.teacher{left:95%;top:.3%}.tool-row{position:absolute;left:11.8%;top:83.3%;width:76.4%;height:14.7%;display:grid;grid-template-columns:repeat(8,1fr);gap:1%}.tool{position:relative;height:100%}.clickable{cursor:pointer}.tile{position:absolute;inset:0;width:100%;height:100%}.art{position:absolute;z-index:2;object-fit:contain;left:10%;top:5%;width:80%;height:75%}.tool span{position:absolute;z-index:3;left:1%;right:1%;bottom:9%;text-align:center;font-size:clamp(12px,.92vw,18px);font-weight:900;white-space:nowrap}</style></head><body><main id="app"><img class="bg" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png"><section class="ui"><div class="date-card"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/date%20panel.png"><div class="date-copy"><div class="weekday" id="weekday"></div><div class="full" id="fulldate"></div></div></div><section class="panel schedule"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-1_Tall_Home_Panel_Master.png"><h2>Schedule</h2><div class="schedule-list" id="schedule-list"></div></section><section class="panel next"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-2_Wide_Home_Panel_Master.png"><h2>Now</h2><div class="next-content"><img id="next-icon"><div class="next-title" id="next-title"></div></div></section><section class="panel timer"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-5_Classroom_Timer_Panel.png"><div class="timer-value">5:00</div></section><section class="panel star"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-3_Star_of_the_Day_Panel.png"><h2>Star</h2><div class="star-name">Addison</div></section><section class="panel friends"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-4_Friends_Today_Panel.png"><h2>Friends</h2><div class="friends-count"><strong id="home-friends-count">0</strong><span>friends here</span></div></section><div class="utility eddie"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3B_Eddie_Says.png"></div><div class="utility teacher"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3A_Teacher_Mode.png"></div><div class="tool-row" id="tools"></div></section></main><script>(()=>{const base='https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/',tile=base+'EEA_v6_4B_Home_Tool_Tile_Master.png',arts=base+'Tool%20Illustrations/',sched=base+'Schedule%20Icons/';const tools=[['Attendance',arts+'EEA_v6_4B-2A_Attendance.png','attendance.html'],['Choose a Friend',arts+'EEA_v6_4B-2B_Choose_A_Friend.png','choose-a-friend.html'],['Center Choice',arts+'EEA_v6_4B-2C_Center_Choice.png'],['Timer',arts+'EEA_v6_4B-2D_Timer.png'],['Clean Up Song',arts+'EEA_v6_4B-2E_Clean_Up_Song.png'],['Movement',sched+'EEA_v6_4D-2H_Schedule_Dancing_Movement.png'],['Calm Down',arts+'EEA_v6_4B-2G_Calm_Down_Break.png'],['Daily Lessons',arts+'EEA_v6_4B-2H_Daily_Lessons.png']];document.getElementById('tools').innerHTML=tools.map((t,i)=>`<div class="tool ${t[2]?'clickable':''}" data-i="${i}"><img class="tile" src="${tile}"><img class="art" src="${t[1]}"><span>${t[0]}</span></div>`).join('');document.querySelectorAll('.tool').forEach(e=>{let t=tools[+e.dataset.i];if(t[2])e.onclick=()=>location.href=t[2]});const items=[['Centers','EEA_v6_4D-2A_Schedule_Centers.png'],['Breakfast','EEA_v6_4D-2C_Schedule_Breakfast.png'],['Circle Time','EEA_v6_4D-2B_Schedule_Circle_Time.png'],['Recess','EEA_v6_4D-2D_Schedule_Recess.png'],['Lunch','EEA_v6_4D-2E_Schedule_Lunch.png'],['Nap','EEA_v6_4D-2F_Schedule_Nap.png'],['Snack','EEA_v6_4D-2G_Schedule_Snack.png']];let cur=0;function render(){document.getElementById('schedule-list').innerHTML=items.map((x,i)=>`<div class="schedule-row ${i<cur?'done':i===cur?'active':''}" data-i="${i}"><img src="${sched+x[1]}"><span>${x[0]}</span><span class="status-circle"></span></div>`).join('');document.querySelectorAll('.schedule-row').forEach(r=>r.onclick=()=>{let i=+r.dataset.i;if(i===cur)cur++;else if(i<cur)cur=i;render()});let x=items[Math.min(cur,items.length-1)];document.getElementById('next-icon').src=sched+x[1];document.getElementById('next-title').textContent=cur>=items.length?'Our day is complete!':x[0]}render();let n=new Date();document.getElementById('weekday').textContent=n.toLocaleDateString('en-US',{weekday:'long'});document.getElementById('fulldate').textContent=n.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});document.getElementById('home-friends-count').textContent=localStorage.getItem('eea-attendance-count')||0})();</script></body></html>
