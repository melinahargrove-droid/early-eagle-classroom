<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EEA Classroom Companion — V6 Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e4e7}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#123d78}#app{position:relative;width:100vw;height:100vh;overflow:hidden}.view{position:absolute;inset:0}.hidden{display:none!important}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}.ui{position:absolute;inset:0;z-index:2}.home-panels-art{position:absolute;z-index:1;left:8.2%;top:6.1%;width:82.8%;height:83.7%;object-fit:fill;pointer-events:none}.panel{position:absolute;z-index:2}
.date-card{position:absolute;left:1.2%;top:2.2%;width:9.1%;height:8.2%;z-index:3}.date-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.date-copy{position:absolute;left:37%;right:11%;top:19%;bottom:18%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;color:#123d78}.date-copy .weekday{font-size:clamp(14px,1vw,20px);line-height:1.05}.date-copy .full{margin-top:5%;font-size:clamp(8px,.58vw,12px);line-height:1.1}
.schedule{left:10%;top:12%;width:20%;height:69%}.schedule-list{position:absolute;z-index:2;left:7%;right:7%;top:17%;bottom:5%;display:flex;flex-direction:column;justify-content:space-evenly}.schedule-row{position:relative;display:grid;grid-template-columns:20% 1fr 11%;align-items:center;column-gap:4%;height:9.2%;padding:.6% 4%;border-radius:13px;font-weight:900;font-size:clamp(17px,1.2vw,24px);line-height:1;cursor:pointer;user-select:none;transition:background .18s ease,transform .12s ease,box-shadow .18s ease}.schedule-row:hover{background:rgba(207,225,238,.42);box-shadow:inset 0 0 0 1px rgba(58,105,151,.1)}.schedule-row:active{transform:scale(.985)}.schedule-row img{width:100%;height:86%;object-fit:contain;pointer-events:none}.schedule-row.active{background:rgba(184,211,232,.48);box-shadow:inset 0 0 0 1.5px rgba(58,105,151,.13)}.status-circle{justify-self:end;width:clamp(15px,1.15vw,22px);height:clamp(15px,1.15vw,22px);border:2px solid #6d91b5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(10px,.72vw,14px);font-weight:900;background:rgba(255,255,255,.45);pointer-events:none}.schedule-row.done .status-circle{background:#6f99c4;border-color:#6f99c4}.schedule-row.done .status-circle::after{content:'✓'}.schedule-row.done .activity-name{opacity:.78}
.next{left:31%;top:10%;width:38%;height:51%}.next-content{position:absolute;z-index:2;left:8%;right:8%;top:22%;bottom:7%;display:flex;align-items:center;justify-content:center;gap:2.5%}.next-content img{width:43%;height:92%;object-fit:contain;transform:translateX(4%)}.next-copy{text-align:left;min-width:0;transform:translateX(-2%)}.next-title{font-weight:900;font-size:clamp(46px,4.35vw,84px);line-height:1;color:#123d78;white-space:nowrap}.next-content.finished img{display:none}.next-content.finished .next-copy{text-align:center;transform:none}.next-content.finished .next-title{font-size:clamp(34px,3vw,58px)}.next-content.recess-weather{cursor:pointer}.next-content.recess-weather img{width:43%;height:100%;object-fit:contain;transform:translate(-8%,3%)}.next-content.recess-weather .next-copy{transform:none}.next-content.recess-weather:hover img{filter:drop-shadow(0 7px 7px rgba(35,76,119,.16))}
.timer{left:31%;top:61%;width:38%;height:20%;overflow:visible}.quick-timer-ui{position:absolute;left:5%;right:5%;top:25%;bottom:4%}.quick-timer-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.quick-time{position:absolute;z-index:3;left:6%;top:3%;width:70%;height:44%;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,3.2vw,62px);font-weight:900;color:#123d78;line-height:1;pointer-events:none}.quick-hotspot{position:absolute;z-index:4;border:0;background:transparent;padding:0;cursor:pointer;border-radius:999px}.quick-hotspot:active{transform:scale(.97)}.quick-plus{left:83%;top:4%;width:14%;height:43%}.quick-start{left:3%;top:53%;width:30%;height:42%}.quick-pause{left:35%;top:53%;width:30%;height:42%}.quick-stop{left:67%;top:53%;width:30%;height:42%}
.star{left:70%;top:12%;width:20%;height:32%;cursor:pointer;transition:transform .16s ease,filter .16s ease}.star:hover{transform:translateY(-2px) scale(1.015);filter:drop-shadow(0 6px 6px rgba(35,76,119,.15))}.star:active{transform:scale(.985)}.home-star-art{position:absolute;z-index:2;left:25%;top:27%;width:54%;height:54%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 5px 4px rgba(45,74,95,.12))}.star-name{position:absolute;z-index:3;left:5%;right:5%;bottom:7%;text-align:center;font-size:clamp(22px,1.7vw,34px);font-weight:900}.friends{left:70%;top:44%;width:20%;height:37%}.friends-count{position:absolute;z-index:2;inset:29% 8% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center}.friends-count strong{font-size:clamp(48px,4vw,78px);line-height:1}.friends-count span{margin-top:4%;font-size:clamp(14px,1.05vw,21px);font-weight:900}
.utility{position:absolute;width:4.8%;height:12.5%;z-index:4}.utility img{display:block;width:100%;height:75%;object-fit:contain}.eddie{left:90%;top:.3%}.teacher{left:95%;top:.3%}
.tool-row{position:absolute;z-index:3;left:11.8%;top:83.3%;width:76.4%;height:14.7%;display:grid;grid-template-columns:repeat(8,1fr);background:url('assets/buttons.png') center/100% 100% no-repeat}.tool{border:0;background:transparent;min-width:0;height:100%;padding:0}.tool.clickable{cursor:pointer;transition:transform .16s ease,filter .16s ease}.tool.clickable:hover{transform:translateY(-3px) scale(1.02);filter:drop-shadow(0 7px 7px rgba(35,76,119,.18))}.tool.clickable:active{transform:translateY(1px) scale(.98)}
.center-stay-shortcut{position:absolute;z-index:12;left:7.4%;top:46%;width:3.4vw;height:11vh;transform:translate(-50%,-50%);border:0;background:transparent;box-shadow:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .16s ease}.center-stay-shortcut img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(45,75,100,.16))}.center-stay-shortcut:hover{filter:drop-shadow(0 5px 5px rgba(35,76,119,.18))}.center-stay-shortcut:active{transform:translate(-50%,-50%) scale(.96)}
</style>
</head>
<body>
<main id="app"><section id="home-view" class="view"><img class="bg" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png" alt=""><section class="ui">
<img class="home-panels-art" src="assets/home%20panels.png" alt="">
<div class="date-card"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/date%20panel.png" alt=""><div class="date-copy"><div class="weekday" id="weekday"></div><div class="full" id="fulldate"></div></div></div>
<section class="panel schedule"><div class="schedule-list" id="schedule-list"></div></section>
<section class="panel next"><div class="next-content" id="next-content"><img id="next-icon" alt=""><div class="next-copy"><div class="next-title" id="next-title"></div></div></div></section>
<section class="panel timer"><div class="quick-timer-ui"><img class="quick-timer-art" src="assets/home%20timer.png" alt="Quick timer controls"><div class="quick-time" id="quick-time">5:00</div><button class="quick-hotspot quick-plus" id="quick-plus" aria-label="Add one minute"></button><button class="quick-hotspot quick-start" id="quick-start" aria-label="Start timer"></button><button class="quick-hotspot quick-pause" id="quick-pause" aria-label="Pause timer"></button><button class="quick-hotspot quick-stop" id="quick-stop" aria-label="Stop timer"></button></div></section>
<section class="panel star" id="star-panel"><img class="home-star-art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Content%20Assets/EEA_v6_4D-1_Star_of_the_Day_Star.png" alt=""><div class="star-name">Addison</div></section>
<section class="panel friends"><div class="friends-count"><strong id="home-friends-count">0</strong><span>friends here</span></div></section>
<div class="utility eddie"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3B_Eddie_Says.png" alt="Eddie Says"></div><div class="utility teacher"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3A_Teacher_Mode.png" alt="Teacher Mode"></div>
<button class="center-stay-shortcut" id="center-stay-shortcut" type="button" aria-label="Stay in Your Center"><img src="assets/egg.webp" alt="Stay in Your Center"></button>
<div class="tool-row" aria-label="Home tools"><button class="tool clickable" id="attendance-tool" aria-label="Attendance"></button><button class="tool clickable" id="friend-tool" aria-label="Choose a Friend"></button><button class="tool clickable" id="center-choice-tool" aria-label="Center Choice"></button><button class="tool clickable" id="timer-tool" aria-label="Timer"></button><button class="tool" aria-label="Clean Up Song"></button><button class="tool clickable" id="movement-tool" aria-label="Movement"></button><button class="tool" aria-label="Calm Down"></button><button class="tool" aria-label="Daily Lessons"></button></div>
</section></section></main>
<script>
(function(){const $=id=>document.getElementById(id);const iconBase='https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/';const schedule=[{name:'Centers',icon:'EEA_v6_4D-2A_Schedule_Centers.png'},{name:'Breakfast',icon:'EEA_v6_4D-2C_Schedule_Breakfast.png'},{name:'Circle Time',icon:'EEA_v6_4D-2B_Schedule_Circle_Time.png'},{name:'Recess',icon:'EEA_v6_4D-2D_Schedule_Recess.png'},{name:'Lunch',icon:'EEA_v6_4D-2E_Schedule_Lunch.png'},{name:'Nap',icon:'EEA_v6_4D-2F_Schedule_Nap.png'},{name:'Snack',icon:'EEA_v6_4D-2G_Schedule_Snack.png'}];let currentIndex=0;function chooseScheduleRow(index){if(index===currentIndex){currentIndex=Math.min(currentIndex+1,schedule.length)}else{currentIndex=index}renderAll()}function renderSchedule(){$('schedule-list').innerHTML=schedule.map((item,i)=>`<div class="schedule-row${i<currentIndex?' done':i===currentIndex?' active':' upcoming'}" data-index="${i}" role="button" tabindex="0" aria-label="${item.name}"><img src="${iconBase}${item.icon}" alt=""><span class="activity-name">${item.name}</span><span class="status-circle"></span></div>`).join('');document.querySelectorAll('.schedule-row').forEach(row=>{const activate=()=>chooseScheduleRow(Number(row.dataset.index));row.addEventListener('click',activate);row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}})})}function renderCurrent(){const content=$('next-content'),icon=$('next-icon'),title=$('next-title');content.onclick=null;content.classList.remove('recess-weather');icon.removeAttribute('style');if(currentIndex>=schedule.length){content.classList.add('finished');title.textContent='Our day is complete!';icon.removeAttribute('src');return}content.classList.remove('finished');const item=schedule[currentIndex];if(item.name==='Recess'){icon.src='assets/Eddie%20recess.png';title.textContent='Recess';content.classList.add('recess-weather');content.onclick=()=>{window.location.href='weather.html'}}else{icon.src=iconBase+item.icon;title.textContent=item.name}}function renderAll(){renderSchedule();renderCurrent()}renderAll();
const now=new Date();$('weekday').textContent=now.toLocaleDateString('en-US',{weekday:'long'});$('fulldate').textContent=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
let quickSeconds=300,quickRemaining=300,quickRunning=false,quickInterval=null;function drawQuickTimer(){const m=Math.floor(quickRemaining/60),s=quickRemaining%60;$('quick-time').textContent=`${m}:${String(s).padStart(2,'0')}`;}function clearQuickInterval(){if(quickInterval){clearInterval(quickInterval);quickInterval=null}}function startQuickTimer(){if(quickRunning||quickRemaining<=0)return;quickRunning=true;quickInterval=setInterval(()=>{if(quickRemaining>0){quickRemaining--;drawQuickTimer()}if(quickRemaining<=0){quickRunning=false;clearQuickInterval()}},1000)}function pauseQuickTimer(){quickRunning=false;clearQuickInterval()}function stopQuickTimer(){quickRunning=false;clearQuickInterval();quickRemaining=quickSeconds;drawQuickTimer()}function addQuickMinute(){quickSeconds+=60;quickRemaining+=60;drawQuickTimer()}$('quick-plus').onclick=addQuickMinute;$('quick-start').onclick=startQuickTimer;$('quick-pause').onclick=pauseQuickTimer;$('quick-stop').onclick=stopQuickTimer;drawQuickTimer();
$('attendance-tool').onclick=()=>{window.location.href='attendance.html'};$('friend-tool').onclick=()=>{window.location.href='choose-a-friend.html'};$('center-choice-tool').onclick=()=>{window.location.href='center-choice.html'};$('center-stay-shortcut').onclick=()=>{window.location.href='stay-in-your-center.html'};$('timer-tool').onclick=()=>{window.location.href='timer.html'};$('movement-tool').onclick=()=>{window.location.href='movement.html'};$('star-panel').onclick=()=>{window.location.href='star-of-the-day.html'};
})();
</script>
</body>
</html>
