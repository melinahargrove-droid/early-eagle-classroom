<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e4e7}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#123d78}#app{position:relative;width:100vw;height:100vh;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}.ui{position:absolute;inset:0;z-index:2}.editable{position:absolute}.panel>.shell{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.panel h2{position:absolute;z-index:2;left:0;right:0;margin:0;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(20,50,90,.35);font-size:clamp(19px,1.45vw,29px);font-weight:900;line-height:1}.date{left:3.5%;top:4.2%;width:5%;height:4%;font-weight:900;text-shadow:0 1px 2px #fff}.date .weekday{font-size:clamp(15px,1.15vw,22px)}.date .full{font-size:clamp(9px,.66vw,13px)}
.schedule{left:10%;top:12%;width:20%;height:69%}.schedule h2{top:4.3%;font-size:clamp(18px,1.34vw,27px)}.schedule-list{position:absolute;z-index:2;left:7%;right:7%;top:15%;bottom:5%;display:flex;flex-direction:column;justify-content:space-evenly}.schedule-row{position:relative;display:grid;grid-template-columns:20% 1fr 11%;align-items:center;column-gap:4%;height:9.2%;padding:.6% 4%;border-radius:13px;font-weight:900;font-size:clamp(17px,1.2vw,24px);line-height:1;cursor:pointer;user-select:none;transition:background .2s ease}.schedule-row img{width:100%;height:86%;object-fit:contain}.schedule-row .activity-name{min-width:0}.schedule-row.active{background:rgba(184,211,232,.48);box-shadow:inset 0 0 0 1.5px rgba(58,105,151,.13)}.status-circle{justify-self:end;width:clamp(15px,1.15vw,22px);height:clamp(15px,1.15vw,22px);border:2px solid #6d91b5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(10px,.72vw,14px);font-weight:900;background:rgba(255,255,255,.45)}.schedule-row.done .status-circle{background:#6f99c4;border-color:#6f99c4}.schedule-row.done .status-circle::after{content:'✓'}.schedule-row.done .activity-name{opacity:.78}.schedule-row.upcoming{cursor:default}
.next{left:31%;top:10%;width:38%;height:51%}.next h2{top:7%;font-size:clamp(21px,1.6vw,32px)}.next-content{position:absolute;z-index:2;left:8%;right:8%;top:18%;bottom:7%;display:flex;align-items:center;justify-content:center;gap:2.5%}.next-content img{width:43%;height:92%;object-fit:contain;transform:translateX(4%)}.next-copy{text-align:left;min-width:0;transform:translateX(-2%)}.next-title{font-weight:900;font-size:clamp(46px,4.35vw,84px);line-height:1;color:#123d78;white-space:nowrap}.next-content.finished img{display:none}.next-content.finished .next-copy{text-align:center;transform:none}.next-content.finished .next-title{font-size:clamp(34px,3vw,58px)}
.timer{left:31%;top:61%;width:38%;height:20%}.timer-value{position:absolute;z-index:2;left:0;right:0;top:27%;text-align:center;font-size:clamp(44px,4vw,78px);font-weight:900;line-height:1}.star{left:70%;top:12%;width:20%;height:32%}.star h2{top:7%;font-size:clamp(19px,1.42vw,28px)}.star-name{position:absolute;z-index:2;left:5%;right:5%;bottom:9%;text-align:center;font-size:clamp(22px,1.7vw,34px);font-weight:900}.friends{left:70%;top:44%;width:20%;height:37%}.friends h2{top:5%;font-size:clamp(19px,1.42vw,28px)}.friends-count{position:absolute;z-index:2;inset:25% 8% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center}.friends-count strong{font-size:clamp(48px,4vw,78px);line-height:1}.friends-count span{margin-top:4%;font-size:clamp(14px,1.05vw,21px);font-weight:900}.utility{width:4.8%;height:12.5%;text-align:center;font-weight:900;font-size:clamp(7px,.5vw,10px)}.utility img{display:block;width:100%;height:75%;object-fit:contain}.eddie{left:90%;top:.3%}.teacher{left:95%;top:.3%}
.tool-row{left:11.8%;top:83.3%;width:76.4%;height:14.7%;display:grid;grid-template-columns:repeat(8,1fr);gap:1%;align-items:stretch}.tool{position:relative;min-width:0;height:100%}.tile{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.art{position:absolute;z-index:2;left:19%;top:6%;width:62%;height:57%;object-fit:contain}.tool span{position:absolute;z-index:3;left:2%;right:2%;bottom:7%;text-align:center;font-size:clamp(10px,.78vw,15px);font-weight:900;line-height:1.05;white-space:nowrap}.art-mode .art{outline:2px dashed #315f91;outline-offset:2px;cursor:pointer}.art-mode .art.selected-art{outline:3px solid #ff9f1c}
#editbar{position:fixed;z-index:1000;top:10px;right:10px;background:rgba(248,244,232,.96);border:2px solid #315f91;border-radius:14px;padding:8px 10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:94vw;font:700 12px Arial;color:#123d78}#editbar button{border:1px solid #315f91;background:#fff;border-radius:9px;padding:7px 10px;font-weight:700;color:#123d78;cursor:pointer}#editbar button.on{background:#315f91;color:#fff}.artctl{display:none}.art-mode .artctl{display:inline-block}#status{min-width:110px}.editing .editable{outline:2px dashed rgba(30,92,153,.75);cursor:move;touch-action:none}.editing .editable.selected{outline:3px solid #ff9f1c;z-index:100}.handle{display:none;position:absolute;width:18px;height:18px;right:-9px;bottom:-9px;border-radius:50%;background:#ff9f1c;border:2px solid #fff;z-index:200;cursor:nwse-resize}.editing .selected>.handle{display:block}#layoutOutput{position:fixed;z-index:1100;inset:8% 10%;background:#fff;border:3px solid #315f91;border-radius:16px;padding:18px;display:none}#layoutOutput textarea{width:100%;height:75%;font:13px monospace}
</style>
</head>
<body>
<div id="editbar"><button id="toggleEdit">Layout Mode</button><button id="toggleArt">Button Art Mode</button><button class="artctl" data-a="up">Up</button><button class="artctl" data-a="down">Down</button><button class="artctl" data-a="left">Left</button><button class="artctl" data-a="right">Right</button><button class="artctl" data-a="small">Smaller</button><button class="artctl" data-a="large">Larger</button><button class="artctl" data-a="reset">Reset Art</button><button class="artctl" id="copyArt">Copy Art Values</button><button id="resetLayout">Reset to Clean Layout</button><button id="copyLayout">Copy Layout</button><span id="status">View mode</span></div>
<div id="layoutOutput"><b id="outputTitle">Layout values</b><p id="outputHelp">Copy this text and paste it into our chat.</p><textarea id="layoutText"></textarea><button id="closeOutput">Close</button></div>
<main id="app"><img class="bg" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png" alt=""><section class="ui"><div class="date editable" data-key="date"><div class="weekday" id="weekday"></div><div class="full" id="fulldate"></div></div><section class="panel schedule editable" data-key="schedule"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-1_Tall_Home_Panel_Master.png" alt=""><h2>Schedule</h2><div class="schedule-list" id="schedule-list"></div></section><section class="panel next editable" data-key="next"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-2_Wide_Home_Panel_Master.png" alt=""><h2>What's Happening?</h2><div class="next-content" id="next-content"><img id="next-icon" alt=""><div class="next-copy"><div class="next-title" id="next-title"></div></div></div></section><section class="panel timer editable" data-key="timer"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-5_Classroom_Timer_Panel.png" alt=""><div class="timer-value">5:00</div></section><section class="panel star editable" data-key="star"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-3_Star_of_the_Day_Panel.png" alt=""><h2>Star of the Day</h2><div class="star-name">Addison</div></section><section class="panel friends editable" data-key="friends"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-4_Friends_Today_Panel.png" alt=""><h2>Friends Today</h2><div class="friends-count"><strong>20</strong><span>friends here</span></div></section><div class="utility eddie editable" data-key="eddie"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3B_Eddie_Says.png" alt=""><span>Eddie Says</span></div><div class="utility teacher editable" data-key="teacher"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3A_Teacher_Mode.png" alt=""><span>Teacher Mode</span></div><div class="tool-row editable" data-key="toolRow"><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2A_Attendance.png"><span>Attendance</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2B_Choose_A_Friend.png"><span>Choose a Friend</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2C_Center_Choice.png"><span>Center Choice</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2D_Timer.png"><span>Timer</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2E_Clean_Up_Song.png"><span>Clean Up Song</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/EEA_v6_4D-2H_Schedule_Dancing_Movement.png"><span>Movement</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2G_Calm_Down_Break.png"><span>Calm Down</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2H_Daily_Lessons.png"><span>Daily Lessons</span></div></div></section></main>
<script>
(function(){const $=id=>document.getElementById(id),iconBase='https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/',schedule=[{name:'Centers',icon:'EEA_v6_4D-2A_Schedule_Centers.png'},{name:'Breakfast',icon:'EEA_v6_4D-2C_Schedule_Breakfast.png'},{name:'Circle Time',icon:'EEA_v6_4D-2B_Schedule_Circle_Time.png'},{name:'Recess',icon:'EEA_v6_4D-2D_Schedule_Recess.png'},{name:'Lunch',icon:'EEA_v6_4D-2E_Schedule_Lunch.png'},{name:'Nap',icon:'EEA_v6_4D-2F_Schedule_Nap.png'},{name:'Snack',icon:'EEA_v6_4D-2G_Schedule_Snack.png'}];let currentIndex=0;const scheduleList=$('schedule-list');function renderSchedule(){scheduleList.innerHTML=schedule.map((item,i)=>`<div class="schedule-row${i<currentIndex?' done':i===currentIndex?' active':' upcoming'}" data-index="${i}"><img src="${iconBase}${item.icon}" alt=""><span class="activity-name">${item.name}</span><span class="status-circle"></span></div>`).join('');scheduleList.querySelectorAll('.schedule-row').forEach(row=>row.onclick=()=>{const i=+row.dataset.index;if(i===currentIndex){currentIndex++;renderAll()}else if(i<currentIndex){currentIndex=i;renderAll()}})}function renderCurrent(){const content=$('next-content'),icon=$('next-icon'),title=$('next-title');if(currentIndex>=schedule.length){content.classList.add('finished');title.textContent='Our day is complete!';icon.removeAttribute('src');return}content.classList.remove('finished');icon.src=iconBase+schedule[currentIndex].icon;title.textContent=schedule[currentIndex].name}function renderAll(){renderSchedule();renderCurrent()}renderAll();const now=new Date();$('weekday').textContent=now.toLocaleDateString('en-US',{weekday:'long'});$('fulldate').textContent=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const app=$('app'),els=[...document.querySelectorAll('.editable')],toggle=$('toggleEdit'),statusEl=$('status');let editing=false,selected=null,action=null,start={};els.forEach(el=>{const h=document.createElement('i');h.className='handle';el.appendChild(h);el.onpointerdown=e=>{if(!editing)return;e.preventDefault();els.forEach(x=>x.classList.remove('selected'));selected=el;el.classList.add('selected');const r=el.getBoundingClientRect(),a=app.getBoundingClientRect();action=e.target.classList.contains('handle')?'resize':'drag';start={x:e.clientX,y:e.clientY,left:r.left-a.left,top:r.top-a.top,w:r.width,h:r.height};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!editing||!action||selected!==el)return;const a=app.getBoundingClientRect(),dx=e.clientX-start.x,dy=e.clientY-start.y;if(action==='drag'){el.style.left=(start.left+dx)/a.width*100+'%';el.style.top=(start.top+dy)/a.height*100+'%'}else{el.style.width=Math.max(35,start.w+dx)/a.width*100+'%';el.style.height=Math.max(25,start.h+dy)/a.height*100+'%'}};el.onpointerup=()=>{action=null;saveLayout()}});toggle.onclick=()=>{if(artMode)toggleArt();editing=!editing;document.body.classList.toggle('editing',editing);toggle.classList.toggle('on',editing);toggle.textContent=editing?'Done Moving':'Layout Mode';statusEl.textContent=editing?'Move/resize layout':'View mode'};function layout(){const o={};els.forEach(el=>{const r=el.getBoundingClientRect(),a=app.getBoundingClientRect();o[el.dataset.key]={left:+((r.left-a.left)/a.width*100).toFixed(2),top:+((r.top-a.top)/a.height*100).toFixed(2),width:+(r.width/a.width*100).toFixed(2),height:+(r.height/a.height*100).toFixed(2)}});return o}const layoutKey='eea-v6-layout-structural-v1';function saveLayout(){localStorage.setItem(layoutKey,JSON.stringify(layout()))}try{const o=JSON.parse(localStorage.getItem(layoutKey));if(o)els.forEach(el=>{const v=o[el.dataset.key];if(v){el.style.left=v.left+'%';el.style.top=v.top+'%';el.style.width=v.width+'%';el.style.height=v.height+'%'}})}catch(e){}
const arts=[...document.querySelectorAll('.art')],artToggle=$('toggleArt'),artKey='eea-v6-art-adjust-v1';let artMode=false,chosen=null;function toggleArt(){artMode=!artMode;document.body.classList.toggle('art-mode',artMode);artToggle.classList.toggle('on',artMode);artToggle.textContent=artMode?'Done Art':'Button Art Mode';if(!artMode){arts.forEach(a=>a.classList.remove('selected-art'));chosen=null;statusEl.textContent='View mode'}else statusEl.textContent='Click a button picture'}artToggle.onclick=()=>{if(editing){editing=false;document.body.classList.remove('editing');toggle.classList.remove('on');toggle.textContent='Layout Mode'}toggleArt()};arts.forEach((a,i)=>{a.dataset.i=i;a.onclick=e=>{if(!artMode)return;e.stopPropagation();arts.forEach(x=>x.classList.remove('selected-art'));chosen=a;a.classList.add('selected-art');statusEl.textContent=a.parentElement.querySelector('span').textContent}});function vals(a){return{l:parseFloat(a.style.left)||19,t:parseFloat(a.style.top)||6,w:parseFloat(a.style.width)||62,h:parseFloat(a.style.height)||57}}function artValues(){const o={};arts.forEach((a,i)=>o[i]=vals(a));return o}function saveArts(){localStorage.setItem(artKey,JSON.stringify(artValues()))}try{const o=JSON.parse(localStorage.getItem(artKey));if(o)arts.forEach((a,i)=>{if(o[i]){a.style.left=o[i].l+'%';a.style.top=o[i].t+'%';a.style.width=o[i].w+'%';a.style.height=o[i].h+'%'}})}catch(e){}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!chosen){statusEl.textContent='Click a button picture first';return}let v=vals(chosen),a=b.dataset.a;if(a==='up')v.t-=1.5;if(a==='down')v.t+=1.5;if(a==='left')v.l-=1.5;if(a==='right')v.l+=1.5;if(a==='small'){v.l+=1.5;v.t+=1.5;v.w-=3;v.h-=3}if(a==='large'){v.l-=1.5;v.t-=1.5;v.w+=3;v.h+=3}if(a==='reset')v={l:19,t:6,w:62,h:57};chosen.style.left=v.l+'%';chosen.style.top=v.t+'%';chosen.style.width=v.w+'%';chosen.style.height=v.h+'%';saveArts()});$('copyArt').onclick=()=>{const t=JSON.stringify(artValues(),null,2);$('outputTitle').textContent='Button art values';$('layoutText').value=t;$('layoutOutput').style.display='block';navigator.clipboard?.writeText(t)};$('resetLayout').onclick=()=>{localStorage.removeItem(layoutKey);location.reload()};$('copyLayout').onclick=()=>{const t=JSON.stringify(layout(),null,2);$('outputTitle').textContent='Layout values';$('layoutText').value=t;$('layoutOutput').style.display='block';navigator.clipboard?.writeText(t)};$('closeOutput').onclick=()=>$('layoutOutput').style.display='none';})();
</script></body></html>
