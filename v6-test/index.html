<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EEA Classroom Companion — V6 Test</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e4e7}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#123d78}#app{position:relative;width:100vw;height:100vh;overflow:hidden}.view{position:absolute;inset:0}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}.ui{position:absolute;inset:0;z-index:2}.home-panels-art{position:absolute;z-index:1;left:8.2%;top:6.1%;width:82.8%;height:83.7%;object-fit:fill;pointer-events:none}.panel{position:absolute;z-index:2}.date-card{position:absolute;left:1.2%;top:2.2%;width:9.1%;height:8.2%;z-index:3}.date-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.date-copy{position:absolute;left:37%;right:11%;top:19%;bottom:18%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900}.date-copy .weekday{font-size:clamp(14px,1vw,20px)}.date-copy .full{margin-top:5%;font-size:clamp(8px,.58vw,12px)}.schedule{left:10%;top:12%;width:20%;height:69%}.schedule-list{position:absolute;left:7%;right:7%;top:17%;bottom:5%;display:flex;flex-direction:column;justify-content:space-evenly;transform:translate(7.1%,-3.7%)}.schedule-row{display:grid;grid-template-columns:20% 1fr 11%;align-items:center;column-gap:4%;height:9.2%;padding:.6% 4%;border-radius:13px;font-weight:900;font-size:clamp(17px,1.2vw,24px);cursor:pointer}.schedule-row img{width:100%;height:86%;object-fit:contain}.schedule-row.active{background:rgba(184,211,232,.48)}.status-circle{justify-self:end;width:clamp(15px,1.15vw,22px);height:clamp(15px,1.15vw,22px);border:2px solid #6d91b5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}.schedule-row.done .status-circle{background:#6f99c4}.schedule-row.done .status-circle::after{content:'✓'}.next{left:31%;top:10%;width:38%;height:51%}.next-content{position:absolute;left:8%;right:8%;top:22%;bottom:7%;display:flex;al </style></head><body><main id="app"><section class="view"><img class="bg" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png"><section class="ui"><img class="home-panels-art" src="assets/home%20panels.png"><div class="date-card"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/date%20panel.png"><div class="date-copy"><div class="weekday" id="weekday"></div><div class="full" id="fulldate"></div></div></div><section class="panel schedule"><div class="schedule-list" id="schedule-list"></div></section><section class="panel next"><div class="next-content" id="next-content"><img id="next-icon"><div class="next-title" id="next-title"></div></div></section><section class="panel timer"><div class="quick-timer-ui"><div class="quick-time" id="quick-time">5:00</div><img class="quick-timer-art" src="assets/new%20home%20timer.png"><div class="quick-controls"><button type="button" class="quick-hotspot quick-start" id="quick-start" aria-label="Start timer"></button><button type="button" class="quick-hotspot quick-pause" id="quick-pause" aria-label="Pause timer"></button><button type="button" class="quick-hotspot quick-stop" id="quick-stop" aria-label="Reset timer"></button><button type="button" class="quick-hotspot quick-plus" id="quick-plus" aria-label="Add one minute"></button></div></div></section><section class="panel star" id="star-panel"><img class="home-star-art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Content%20Assets/EEA_v6_4D-1_Star_of_the_Day_Star.png"><div class="star-name" id="home-star-name"></div></section><section class="panel friends"><div class="friends-count"><strong id="home-friends-count">0</strong><span>friends here</span></div></section><div class="utility eddie"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3B_Eddie_Says.png"></div><div class="utility teacher"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3A_Teacher_Mode.png"></div><button type="button" class="center-stay-shortcut" id="center-stay-shortcut"><img src="assets/egg.webp"></button><div class="tool-row"><button class="tool" id="attendance-tool"></button><button class="tool" id="friend-tool"></button><button class="tool" id="center-choice-tool"></button><button class="tool" id="timer-tool"></button><button class="tool" id="clean-up-tool"></button><button class="tool" id="movement-tool"></button><button class="tool" id="calm-down-tool"></button><button class="tool" id="lessons-tool"></button></div></section></section></main><script>
(function(){const DAILY_RESET_KEY='eea-last-daily-reset-date',MORNING_KEY='eea-last-morning-attendance-date',CALENDAR_KEY='eea-school-calendar',SETTINGS_KEY='eea-app-settings',MEDIA_KEY='eea-media-config';const DAILY_KEYS=['eea-attendance-present','eea-attendance-count','eea-choose-friend-used','eea-choose-friend-remaining','eea-center-choice-selections','eea-center-choice-history','eea-center-choice-current','eea-timer-state','eea-home-timer-state','eea-schedule-progress','eea-now-activity'];function localDateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function calendarEntry(d){try{const data=JSON.parse(localStorage.getItem(CALENDAR_KEY)||'{}')||{};return data[localDateKey(d)]||null}catch(e){return null}}function isSchoolDay(d=new Date()){const entry=calendarEntry(d);if(entry)return entry.type==='school';const day=d.getDay();return day>=1&&day<=5}function resetDailyState(dateKey){DAILY_KEYS.forEach(k=>localStorage.removeItem(k));localStorage.setItem('eea-attendance-present','[]');localStorage.setItem('eea-attendance-count','0');localStorage.setItem(DAILY_RESET_KEY,dateKey)}function runDailyLifecycle(){const now=new Date(),today=localDateKey(now);if(localStorage.getItem(DAILY_RESET_KEY)!==today)resetDailyState(today);if(isSchoolDay(now)&&localStorage.getItem(MORNING_KEY)!==today){localStorage.setItem(MORNING_KEY,today);location.replace('attendance.html');return false}return true}function scheduleMidnightLifecycle(){const now=new Date(),next=new Date(now);next.setHours(24,0,0,80);setTimeout(()=>{const today=localDateKey(new Date());resetDailyState(today);if(isSchoolDay(new Date())){localStorage.setItem(MORNING_KEY,today);location.href='attendance.html'}else scheduleMidnightLifecycle()},Math.max(1000,next-now))}if(!runDailyLifecycle())return;scheduleMidnightLifecycle();const $=id=>document.getElementById(id),iconBase='https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/';function mediaItem(cat,fallback){try{const items=JSON.parse(localStorage.getItem(MEDIA_KEY)||'[]');if(Array.isArray(items)){const item=items.find(x=>x&&x.cat===cat);if(item){if(item.active===false)return null;return {source:String(item.source||fallback),type:item.type||''}}}}catch(e){}return {source:fallback,type:'Built into App'}}function openMedia(cat,fallback,opts={}){const item=mediaItem(cat,fallback);if(!item||!item.source)return false;let target=item.source;if(opts.autoplay&&!/^https?:\/\//i.test(target)){target+=(target.includes('?')?'&':'?')+'autoplay=1'}location.href=target;return true}function setMediaButtonState(id,cat,fallback){const b=$(id);if(!b)return;const item=mediaItem(cat,fallback);b.classList.toggle('media-off',!item);b.setAttribute('aria-disabled',item?'false':'true')}const defaults=[{name:'Centers',picture:iconBase+'EEA_v6_4D-2A_Schedule_Centers.png',active:true},{name:'Breakfast',picture:iconBase+'EEA_v6_4D-2C_Schedule_Breakfast.png',active:true},{name:'Circle Time',picture:iconBase+'EEA_v6_4D-2B_Schedule_Circle_Time.png',active:true},{name:'Recess',picture:iconBase+'EEA_v6_4D-2D_Schedule_Recess.png',active:true},{name:'Lunch',picture:iconBase+'EEA_v6_4D-2E_Schedule_Lunch.png',active:true},{name:'Nap',picture:iconBase+'EEA_v6_4D-2F_Schedule_Nap.png',active:true},{name:'Snack',picture:iconBase+'EEA_v6_4D-2G_Schedule_Snack.png',active:true}];let schedule=defaults;try{const saved=JSON.parse(localStorage.getItem('eea-schedule-config')||'null');if(Array.isArray(saved)&&saved.length)schedule=saved.filter(x=>x.active!==false).map(x=>({name:x.name||'Activity',picture:x.picture||'',active:true}))}catch(e){}let currentIndex=Math.max(0,Math.min(Number(localStorage.getItem('eea-schedule-progress')||0),Math.max(0,schedule.length-1)));function setNextImage(src){const icon=$('next-icon');if(!src){icon.style.visibility='hidden';return}icon.style.visibility='visible';icon.src=src}function renderSchedule(){$('schedule-list').innerHTML=schedule.map((x,i)=>`<div class="schedule-row ${i<currentIndex?'done':i===currentIndex?'active':''}" data-i="${i}">${x.picture?`<img src="${x.picture}">`:'<span></span>'}<span>${x.name}</span><span class="status-circle"></span></div>`).join('');document.querySelectorAll('.schedule-row').forEach(r=>r.onclick=()=>{const i=Number(r.dataset.i);currentIndex=i===currentIndex?Math.min(currentIndex+1,schedule.length):i;localStorage.setItem('eea-schedule-progress',String(currentIndex));renderSchedule()});const x=schedule[currentIndex];if(!x){$('next-title').textContent='Our day is complete!';$('next-icon').style.visibility='hidden';return}$('next-title').innerHTML=x.name==='Circle Time'?'Circle<br>Time':x.name;setNextImage(x.picture)}renderSchedule();const n=new Date();$('weekday').textContent=n.toLocaleDateString('en-US',{weekday:'long'});$('fulldate').textContent=n.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});$('home-star-name').textContent=localStorage.getItem('eea-current-star')||'Addison';$('home-friends-count').textContent=localStorage.getItem('eea-attendance-count')||'0';let appSettings={timer:5,autoCleanUp:true};try{appSettings={...appSettings,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(e){}const display=$('quick-time'),startButton=$('quick-start'),pauseButton=$('quick-pause'),stopButton=$('quick-stop'),plusButton=$('quick-plus');let selectedSeconds=Math.max(60,Number(appSettings.timer||5)*60),remainingSeconds=selectedSeconds,running=false,intervalId=null;function renderTime(){const minutes=Math.floor(remainingSeconds/60),seconds=remainingSeconds%60;display.textContent=`${minutes}:${String(seconds).padStart(2,'0')}`}function clearTicker(){if(intervalId!==null){clearInterval(intervalId);intervalId=null}}function finishTimer(){running=false;clearTicker();renderTime();if(appSettings.autoCleanUp!==false)openMedia('Clean Up','clean-up-song.html',{autoplay:true})}function startTimer(){if(running||remainingSeconds<=0)return;running=true;clearTicker();intervalId=setInterval(()=>{if(!running)return;if(remainingSeconds>0)remainingSeconds--;renderTime();if(remainingSeconds<=0)finishTimer()},1000)}function pauseTimer(){running=false;clearTicker()}function stopTimer(){running=false;clearTicker();remainingSeconds=selectedSeconds;renderTime()}function addMinute(){selectedSeconds+=60;remainingSeconds+=60;renderTime()}startButton.onclick=startTimer;pauseButton.onclick=pauseTimer;stopButton.onclick=stopTimer;plusButton.onclick=addMinute;renderTime();$('attendance-tool').onclick=()=>location.href='attendance.html';$('friend-tool').onclick=()=>location.href='choose-a-friend.html';$('center-choice-tool').onclick=()=>location.href='center-choice.html';$('timer-tool').onclick=()=>location.href='timer.html';$('clean-up-tool').onclick=()=>openMedia('Clean Up','clean-up-song.html');$('movement-tool').onclick=()=>openMedia('Movement','movement.html');$('calm-down-tool').onclick=()=>openMedia('Calm Down','calm-down.html');$('lessons-tool').onclick=()=>openMedia('Daily Lessons','daily-lessons.html');setMediaButtonState('clean-up-tool','Clean Up','clean-up-song.html');setMediaButtonState('movement-tool','Movement','movement.html');setMediaButtonState('calm-down-tool','Calm Down','calm-down.html');setMediaButtonState('lessons-tool','Daily Lessons','daily-lessons.html');$('center-stay-shortcut').onclick=()=>location.href='stay-in-your-center.html';$('star-panel').onclick=()=>location.href='star-of-the-day.html';document.querySelector('.eddie').onclick=()=>location.href='weather.html';document.querySelector('.teacher').onclick=()=>location.href='teachers-desk.html';})();
</script></body></html>
