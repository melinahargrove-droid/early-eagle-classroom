<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EEA Classroom Companion — V6 Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e4e7}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#123d78}#app{position:relative;width:100vw;height:100vh;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}.ui{position:absolute;inset:0;z-index:2}.panel{position:absolute}.panel>.shell{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.panel h2{position:absolute;z-index:2;left:0;right:0;top:3.5%;margin:0;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(20,50,90,.35);font-size:28px;font-weight:900;line-height:1}
.date-card{position:absolute;left:1.2%;top:2.2%;width:9.1%;height:8.2%;z-index:3}.date-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.date-copy{position:absolute;left:42%;right:6%;top:22%;bottom:15%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;color:#123d78}.date-copy .weekday{font-size:clamp(14px,1vw,20px);line-height:1.05}.date-copy .full{margin-top:5%;font-size:clamp(8px,.58vw,12px);line-height:1.1}
.schedule{left:10%;top:12%;width:20%;height:69%}.schedule-list{position:absolute;z-index:2;left:7%;right:7%;top:15%;bottom:5%;display:flex;flex-direction:column;justify-content:space-evenly}.schedule-row{position:relative;display:grid;grid-template-columns:20% 1fr 11%;align-items:center;column-gap:4%;height:9.2%;padding:.6% 4%;border-radius:13px;font-weight:900;font-size:clamp(17px,1.2vw,24px);line-height:1;cursor:pointer;user-select:none;transition:background .2s ease}.schedule-row img{width:100%;height:86%;object-fit:contain}.schedule-row.active{background:rgba(184,211,232,.48);box-shadow:inset 0 0 0 1.5px rgba(58,105,151,.13)}.status-circle{justify-self:end;width:clamp(15px,1.15vw,22px);height:clamp(15px,1.15vw,22px);border:2px solid #6d91b5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(10px,.72vw,14px);font-weight:900;background:rgba(255,255,255,.45)}.schedule-row.done .status-circle{background:#6f99c4;border-color:#6f99c4}.schedule-row.done .status-circle::after{content:'✓'}.schedule-row.done .activity-name{opacity:.78}.schedule-row.upcoming{cursor:default}
.next{left:31%;top:10%;width:38%;height:51%}.next-content{position:absolute;z-index:2;left:8%;right:8%;top:18%;bottom:7%;display:flex;align-items:center;justify-content:center;gap:2.5%}.next-content img{width:43%;height:92%;object-fit:contain;transform:translateX(4%)}.next-copy{text-align:left;min-width:0;transform:translateX(-2%)}.next-title{font-weight:900;font-size:clamp(46px,4.35vw,84px);line-height:1;color:#123d78;white-space:nowrap}.next-content.finished img{display:none}.next-content.finished .next-copy{text-align:center;transform:none}.next-content.finished .next-title{font-size:clamp(34px,3vw,58px)}
.timer{left:31%;top:61%;width:38%;height:20%}.timer-value{position:absolute;z-index:2;left:0;right:0;top:27%;text-align:center;font-size:clamp(44px,4vw,78px);font-weight:900;line-height:1}.star{left:70%;top:12%;width:20%;height:32%}.star-name{position:absolute;z-index:2;left:5%;right:5%;bottom:9%;text-align:center;font-size:clamp(22px,1.7vw,34px);font-weight:900}.friends{left:70%;top:44%;width:20%;height:37%}.friends-count{position:absolute;z-index:2;inset:25% 8% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center}.friends-count strong{font-size:clamp(48px,4vw,78px);line-height:1}.friends-count span{margin-top:4%;font-size:clamp(14px,1.05vw,21px);font-weight:900}
.utility{position:absolute;width:4.8%;height:12.5%}.utility img{display:block;width:100%;height:75%;object-fit:contain}.eddie{left:90%;top:.3%}.teacher{left:95%;top:.3%}
.tool-row{position:absolute;left:11.8%;top:83.3%;width:76.4%;height:14.7%;display:grid;grid-template-columns:repeat(8,1fr);gap:1%;align-items:stretch}.tool{position:relative;min-width:0;height:100%}.tile{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.art{position:absolute;z-index:2;object-fit:contain}.tool:nth-child(1) .art{left:13%;top:10.5%;width:74%;height:69%}.tool:nth-child(2) .art{left:13%;top:7.5%;width:74%;height:69%}.tool:nth-child(3) .art{left:14.5%;top:10.5%;width:71%;height:66%}.tool:nth-child(4) .art{left:14.5%;top:12%;width:71%;height:66%}.tool:nth-child(5) .art{left:5.5%;top:3%;width:89%;height:84%}.tool:nth-child(6) .art{left:8.5%;top:4.5%;width:83%;height:78%}.tool:nth-child(7) .art{left:10%;top:3%;width:80%;height:75%}.tool:nth-child(8) .art{left:5.5%;top:1.5%;width:89%;height:84%}.tool span{position:absolute;z-index:3;left:1%;right:1%;bottom:9%;text-align:center;font-size:clamp(12px,.92vw,18px);font-weight:900;line-height:1.02;white-space:nowrap}
#date-controls{position:fixed;z-index:1000;right:12px;bottom:12px;background:rgba(248,244,232,.97);border:2px solid #315f91;border-radius:14px;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:700 12px Arial;color:#123d78}#date-controls button{border:1px solid #315f91;background:#fff;border-radius:8px;padding:7px 9px;font-weight:700;color:#123d78;cursor:pointer}#date-controls button:hover{background:#eef5fb}#date-status{min-width:120px}.date-copy.editing{outline:2px dashed #315f91;outline-offset:2px}
</style>
</head>
<body>
<div id="date-controls"><b>Date text:</b><button data-d="left">←</button><button data-d="right">→</button><button data-d="up">↑</button><button data-d="down">↓</button><button id="copyDate">Copy Text Values</button><button id="resetDate">Reset</button><span id="date-status">Temporary controls</span></div>
<main id="app"><img class="bg" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png" alt=""><section class="ui">
<div class="date-card"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/date%20panel.png" alt=""><div class="date-copy editing" id="date-copy"><div class="weekday" id="weekday"></div><div class="full" id="fulldate"></div></div></div>
<section class="panel schedule"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-1_Tall_Home_Panel_Master.png" alt=""><h2>Schedule</h2><div class="schedule-list" id="schedule-list"></div></section><section class="panel next"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-2_Wide_Home_Panel_Master.png" alt=""><h2>Now</h2><div class="next-content" id="next-content"><img id="next-icon" alt=""><div class="next-copy"><div class="next-title" id="next-title"></div></div></div></section><section class="panel timer"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-5_Classroom_Timer_Panel.png" alt=""><div class="timer-value">5:00</div></section><section class="panel star"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-3_Star_of_the_Day_Panel.png" alt=""><h2>Star</h2><div class="star-name">Addison</div></section><section class="panel friends"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-4_Friends_Today_Panel.png" alt=""><h2>Friends</h2><div class="friends-count"><strong>20</strong><span>friends here</span></div></section><div class="utility eddie"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3B_Eddie_Says.png" alt="Eddie Says"></div><div class="utility teacher"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3A_Teacher_Mode.png" alt="Teacher Mode"></div><div class="tool-row"><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2A_Attendance.png"><span>Attendance</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2B_Choose_A_Friend.png"><span>Choose a Friend</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2C_Center_Choice.png"><span>Center Choice</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2D_Timer.png"><span>Timer</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2E_Clean_Up_Song.png"><span>Clean Up Song</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/EEA_v6_4D-2H_Schedule_Dancing_Movement.png"><span>Movement</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2G_Calm_Down_Break.png"><span>Calm Down</span></div><div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2H_Daily_Lessons.png"><span>Daily Lessons</span></div></div></section></main>
<script>(function(){const $=id=>document.getElementById(id),iconBase='https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/';const schedule=[{name:'Centers',icon:'EEA_v6_4D-2A_Schedule_Centers.png'},{name:'Breakfast',icon:'EEA_v6_4D-2C_Schedule_Breakfast.png'},{name:'Circle Time',icon:'EEA_v6_4D-2B_Schedule_Circle_Time.png'},{name:'Recess',icon:'EEA_v6_4D-2D_Schedule_Recess.png'},{name:'Lunch',icon:'EEA_v6_4D-2E_Schedule_Lunch.png'},{name:'Nap',icon:'EEA_v6_4D-2F_Schedule_Nap.png'},{name:'Snack',icon:'EEA_v6_4D-2G_Schedule_Snack.png'}];let currentIndex=0;function renderSchedule(){$('schedule-list').innerHTML=schedule.map((item,i)=>`<div class="schedule-row${i<currentIndex?' done':i===currentIndex?' active':' upcoming'}" data-index="${i}"><img src="${iconBase}${item.icon}" alt=""><span class="activity-name">${item.name}</span><span class="status-circle"></span></div>`).join('');document.querySelectorAll('.schedule-row').forEach(row=>row.onclick=()=>{const i=+row.dataset.index;if(i===currentIndex){currentIndex++;renderAll()}else if(i<currentIndex){currentIndex=i;renderAll()}})}function renderCurrent(){const content=$('next-content'),icon=$('next-icon'),title=$('next-title');if(currentIndex>=schedule.length){content.classList.add('finished');title.textContent='Our day is complete!';icon.removeAttribute('src');return}content.classList.remove('finished');icon.src=iconBase+schedule[currentIndex].icon;title.textContent=schedule[currentIndex].name}function renderAll(){renderSchedule();renderCurrent()}renderAll();const now=new Date();$('weekday').textContent=now.toLocaleDateString('en-US',{weekday:'long'});$('fulldate').textContent=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});const copy=$('date-copy'),base={l:42,r:6,t:22,b:15},v={...base};function apply(){copy.style.left=v.l+'%';copy.style.right=v.r+'%';copy.style.top=v.t+'%';copy.style.bottom=v.b+'%';$('date-status').textContent=`L ${v.l.toFixed(1)} R ${v.r.toFixed(1)} T ${v.t.toFixed(1)} B ${v.b.toFixed(1)}`};document.querySelectorAll('[data-d]').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.d;if(a==='left'){v.l-=1;v.r+=1}if(a==='right'){v.l+=1;v.r-=1}if(a==='up'){v.t-=1;v.b+=1}if(a==='down'){v.t+=1;v.b-=1}apply()});$('resetDate').onclick=()=>{Object.assign(v,base);apply()};$('copyDate').onclick=async()=>{const text=JSON.stringify({left:v.l,right:v.r,top:v.t,bottom:v.b},null,2);try{await navigator.clipboard.writeText(text);$('date-status').textContent='Copied!'}catch(e){alert(text)}};apply()})();</script>
</body></html>
