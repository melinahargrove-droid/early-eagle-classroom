<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EEA Classroom Companion — V6 Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e4e7}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#123d78}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#d9e4e7}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;user-select:none;pointer-events:none}
.ui{position:absolute;inset:0;z-index:2}
.panel{position:absolute}.panel>.shell{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.panel h2{position:absolute;z-index:2;left:0;right:0;margin:0;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(20,50,90,.35);font-size:clamp(12px,.95vw,19px);font-weight:900}
.date{position:absolute;left:4%;top:12.5%;text-align:left;font-weight:900;text-shadow:0 1px 2px #fff}.date .weekday{font-size:clamp(15px,1.15vw,22px)}.date .full{font-size:clamp(9px,.66vw,13px)}
.schedule{left:5.5%;top:20%;width:15.5%;height:34%}.schedule h2{top:4.7%}.schedule-list{position:absolute;z-index:2;left:10%;right:9%;top:19%;bottom:7%;display:flex;flex-direction:column;gap:2.5%}.row{display:flex;align-items:center;gap:5%;height:23%;padding:2% 5%;border-radius:13px;font-weight:900;font-size:clamp(9px,.66vw,13px)}.row.active{background:rgba(177,207,231,.58)}.row img{width:30%;height:100%;object-fit:contain}
.next{left:27%;top:20%;width:36%;height:17.5%}.next h2{top:8%}.next-content{position:absolute;z-index:2;left:12%;right:10%;top:30%;bottom:10%;display:flex;align-items:center;justify-content:center;gap:5%}.next-content img{height:100%;width:27%;object-fit:contain}.next-title{font-weight:900;font-size:clamp(18px,1.75vw,34px)}.next-sub{font-size:clamp(9px,.7vw,14px);font-weight:800}
.timer{left:31.5%;top:40.5%;width:27%;height:11.5%}.timer h2{top:10%}.timer-value{position:absolute;z-index:2;left:0;right:0;top:36%;text-align:center;font-size:clamp(25px,2.35vw,45px);font-weight:900}
.star{left:68%;top:20%;width:13%;height:17.5%}.star h2{top:6%}.star-art{position:absolute;z-index:2;left:29%;top:27%;width:42%;height:43%;object-fit:contain}.star-name{position:absolute;z-index:2;left:5%;right:5%;bottom:8%;text-align:center;font-size:clamp(10px,.75vw,15px);font-weight:900}
.friends{left:82.5%;top:20%;width:9.5%;height:17.5%}.friends h2{top:6%;font-size:clamp(10px,.75vw,15px)}.friends-count{position:absolute;z-index:2;inset:34% 8% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center}.friends-count strong{font-size:clamp(25px,2.35vw,45px)}.friends-count span{font-size:clamp(8px,.58vw,12px);font-weight:900}
.utilities{position:absolute;right:6.3%;top:40.5%;display:flex;gap:1.05vw}.utility{width:4.8vw;text-align:center;font-weight:900;font-size:clamp(7px,.5vw,10px)}.utility img{display:block;width:100%;height:4.8vw;object-fit:contain}
.tools{position:absolute;left:9%;right:6%;bottom:2.5%;height:17%;display:flex;gap:.8%;align-items:end;justify-content:center}.tool{position:relative;width:13.2%;height:100%}.tile{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.art{position:absolute;z-index:2;left:21%;top:8%;width:58%;height:54%;object-fit:contain}.tool span{position:absolute;z-index:3;left:4%;right:4%;bottom:8%;text-align:center;font-size:clamp(8px,.62vw,12px);font-weight:900;line-height:1.05}
</style>
</head>
<body>
<main id="app">
<img class="bg" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png" alt="">
<section class="ui">
<div class="date"><div class="weekday" id="weekday"></div><div class="full" id="fulldate"></div></div>
<section class="panel schedule"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-1_Tall_Home_Panel_Master.png" alt=""><h2>Today's Schedule</h2><div class="schedule-list">
<div class="row active"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/EEA_v6_4D-2A_Schedule_Centers.png" alt=""><span>Centers</span></div>
<div class="row"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/EEA_v6_4D-2C_Schedule_Breakfast.png" alt=""><span>Breakfast</span></div>
<div class="row"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/EEA_v6_4D-2B_Schedule_Circle_Time.png" alt=""><span>Circle Time</span></div>
<div class="row"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/EEA_v6_4D-2D_Schedule_Recess.png" alt=""><span>Recess</span></div>
</div></section>
<section class="panel next"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-2_Wide_Home_Panel_Master.png" alt=""><h2>What's Next?</h2><div class="next-content"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/EEA_v6_4D-2C_Schedule_Breakfast.png" alt=""><div><div class="next-title">Breakfast</div><div class="next-sub">Coming up next</div></div></div></section>
<section class="panel timer"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-5_Classroom_Timer_Panel.png" alt=""><h2>Classroom Timer</h2><div class="timer-value">5:00</div></section>
<section class="panel star"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-3_Star_of_the_Day_Panel.png" alt=""><h2>Star of the Day</h2><img class="star-art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Content%20Assets/EEA_v6_4D-1_Star_of_the_Day_Star.png" alt=""><div class="star-name">Addison</div></section>
<section class="panel friends"><img class="shell" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Information%20Panels/EEA_v6_4C-4_Friends_Today_Panel.png" alt=""><h2>Friends Today</h2><div class="friends-count"><strong>20</strong><span>friends here</span></div></section>
<div class="utilities"><div class="utility"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3B_Eddie_Says.png" alt=""><span>Eddie Says</span></div><div class="utility"><img src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Utility%20Icons/EEA_v6_4B-3A_Teacher_Mode.png" alt=""><span>Teacher Mode</span></div></div>
<nav class="tools">
<div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2A_Attendance.png"><span>Attendance</span></div>
<div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2B_Choose_A_Friend.png"><span>Choose a Friend</span></div>
<div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2C_Center_Choice.png"><span>Center Choice</span></div>
<div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2D_Timer.png"><span>Timer</span></div>
<div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2E_Clean_Up_Song.png"><span>Clean Up Song</span></div>
<div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2G_Calm_Down_Break.png"><span>Calm Down</span></div>
<div class="tool"><img class="tile" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/EEA_v6_4B_Home_Tool_Tile_Master.png"><img class="art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Tool%20Illustrations/EEA_v6_4B-2H_Daily_Lessons.png"><span>Daily Lessons</span></div>
</nav>
</section>
</main>
<script>
const now=new Date();document.getElementById('weekday').textContent=now.toLocaleDateString('en-US',{weekday:'long'});document.getElementById('fulldate').textContent=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
</script>
