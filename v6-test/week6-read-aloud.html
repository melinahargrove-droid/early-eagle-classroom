<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Read Aloud</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:1.5vh 3vw}.top{height:9vh;display:flex;justify-content:space-between}.meta{font-weight:900;letter-spacing:.12em;color:#789697}.top h1{margin:.35vh 0;font-size:34px;color:#164f7f}.chip{font-weight:900;background:#dcecf0;border-radius:999px;padding:9px 16px;height:max-content}.stage{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:66% 1fr;gap:2.5vw;align-items:center;padding:2.5vh 3vw}.book{height:68vh;border-radius:24px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;overflow:hidden}.book img{max-width:100%;max-height:100%;object-fit:contain;display:block}.copy h2{font-size:30px;margin:0 0 1vh;color:#164f7f}.copy p{font-size:16px;line-height:1.35;font-weight:800;color:#527673}.stop{background:#fff0c9;border:2px solid #e4c56d;border-radius:18px;padding:1.3vh 1vw;margin-top:1vh;font-size:16px;font-weight:900;color:#71591f;line-height:1.35}.stop:empty{display:none}.stop b{display:block;color:#9a6c13;letter-spacing:.06em;margin-bottom:.5vh}.note{background:#e7f0ed;border-radius:18px;padding:1.1vh 1vw;margin-top:1vh;font-size:15px;font-weight:900;color:#416d61}.controls{display:flex;justify-content:center;align-items:center;gap:12px;height:10vh}.controls button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 18px;font-weight:900;cursor:pointer}.controls .done{background:#668f99;color:#fff;border-color:#668f99}.count{font-weight:900;color:#66858b;min-width:90px;text-align:center}</style></head><body><main class="page"><header class="top"><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div id="sub"></div></div><div class="chip" id="chip"></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"></div><div class="copy"><h2>Today’s Read</h2><p id="focus"></p><div class="stop" id="stop"></div><div class="note" id="note"></div></div></section><div class="controls"><button id="prev">← Previous</button><div class="count" id="count"></div><button id="next">Next →</button><button class="done" onclick="location.href='week6-plan.html'">Done ✓</button></div></main><script>const d={Monday:{title:'My Day with Gong Gong',sub:'Read 3 of 4 · Retelling the second half',prefix:'my-day-with-gong-gong-',start:11,end:19,focus:'Begin with book page 17 and read through the end. Use the words and illustrations to retell the second half.',note:'After reading, page back through the second half and ask what happened first, next, and after that.',stops:{12:'BOOK PAGE 18 • What does Gong Gong give May? May looks surprised. Show on your face how you look when you feel surprised.',14:'BOOK PAGE 23 • The sky looks rosy, so it seems late in the day. They have spent the whole day together! How does May communicate with Gong Gong now?',17:'BOOK PAGE 29 • May and Gong Gong have seen many places and people during the day. What is one?',18:'BOOK PAGE 31 • May has learned some words in Cantonese to communicate with her grandfather. What is something she learns to say?'}},Tuesday:{title:'My Day with Gong Gong',sub:'Read 4 of 4 · Acting out the story',prefix:'my-day-with-gong-gong-',start:3,end:19,focus:'Read the story aloud while children act out a selected scene, sequence of events, or the whole story.',note:'The curriculum suggests the park sequence from book pages 12–22 as one sequence that may work well. Children may play any character and may pass. Take turns being May and Gong Gong.',stops:{}},Wednesday:{title:'Goodbye Summer, Hello Autumn',sub:'Read 1 of 3 · What’s happening in the book?',prefix:'goodbye-summer-hello-autumn-',start:3,end:17,focus:'Read the full text fluently, pausing only at the curriculum-designated moments.',note:'After reading, return to book pages 3–10 and act with gestures/body movements like the animals, people, flowers, and other things affected by summer ending.',stops:{4:'BOOK PAGE 4 • Who is talking?',7:'BOOK PAGE 10 • The animals and things the child says “hello” to talk back. They tell how the changing season is affecting them!',10:'BOOK PAGES 15–16 • Look at the illustrations and listen to the words. What does the breezy wind do to people and things? Is it a strong wind or a gentle breeze? How can you tell?',14:'BOOK PAGE 24 • What happens to the sunsets when summer is coming to an end?'}},Thursday:{title:'Goodbye Summer, Hello Autumn',sub:'Read 2 of 3 · Describing places and things',prefix:'goodbye-summer-hello-autumn-',start:3,end:17,focus:'Read the full text fluently. Describe places and things using both the words and illustrations.',note:'After reading, slowly revisit the illustrations and ask how weather affects the people, animals, places, and things in the story.',stops:{5:'BOOK PAGE 6 • Look at the illustrations. What do you notice about the place, the animals, and the person?',11:'BOOK PAGES 17–18 • Look at the illustrations and listen to the words again. What do you see and hear that tells you how the season is changing?'}},Friday:{title:'Goodbye Summer, Hello Autumn',sub:'Read 3 of 3 · Acting out the story',prefix:'goodbye-summer-hello-autumn-',start:3,end:17,focus:'Read the story aloud while children act out a selected scene or the whole story.',note:'Children can be any person, animal, or thing—from a beaver to the wind. Prompt acting with questions such as “Can you show us a tree swaying?” or “Can you show us a fox looking for food?” Children may pass.',stops:{}}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday,page=x.start;title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 6 · '+day.toUpperCase();focus.textContent=x.focus;note.textContent=x.note||'';function show(){pageImg.src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg';count.textContent=(page-x.start+1)+' of '+(x.end-x.start+1);prev.disabled=page===x.start;next.disabled=page===x.end;let s=x.stops[page]||'';stop.innerHTML=s?'<b>CURRICULUM TEACHING STOPS — Pause only at these designated moments</b>'+s:''}prev.onclick=()=>{if(page>x.start){page--;show()}};next.onclick=()=>{if(page<x.end){page++;show()}};show();</script></body></html>
