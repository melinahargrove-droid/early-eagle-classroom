<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 6 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef;position:relative}.book img{display:block;width:100%;height:100%;object-fit:contain}.image-error{display:none;position:absolute;inset:10%;align-items:center;justify-content:center;text-align:center;padding:3vw;border-radius:24px;background:#fff7e8;color:#855d28;font-weight:900;font-size:18px;line-height:1.5}.image-error.show{display:flex}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(560px,44vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title">Week 6 Read Aloud</h1><div class="sub" id="sub">Loading today’s book…</div></div><div class="actions"><div class="chip" id="chip">WEEK 6</div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"><div class="image-error" id="imageError"></div></div><div class="stopcard" id="stop"></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',runner=p.get('eeaRunner')==='1',$=id=>document.getElementById(id);const reads={Monday:{title:'Drum City',sub:'Read 1 of 3 · Introduce the book',before:'Introduce Drum City, written by Thea Guidone and illustrated by Vanessa Newton. Invite 1–2 cover predictions and gently use laps as drums while listening.',stops:[['PAGES 1–2','A beat is a musical rhythm. Clap/drum a simple rhythm and invite children to join.'],['PAGES 3–4','What are the children using for instruments? Notice pots, bowls, and kitchen tools.'],['PAGES 5–6','Stand and march in place.'],['PAGES 7–8','A hum of the city includes low sounds. What sounds might you hear in this picture?'],['PAGES 9–10','People wonder about the sound—they want to know more. Who is coming?'],['PAGES 13–14','Act out clapping and stomping.'],['PAGES 21–22','Drum hard with more force; drum soft gently/lightly.'],['AFTER READING · PAGES 17–18','How does the city become a city of drums? Connect to Science & Engineering sounds/instruments.']]},Tuesday:{title:'Drum City',sub:'Read 2 of 3 · Listen for the beat',before:'Yesterday we saw one boy begin drumming and soon the whole city was drumming. Today listen for how the author helps us hear and feel the beat and rhythm.',stops:[['PAGES 1–4','Create a beat with bodies—clap hands/thighs or stomp. Establish a steady beat and read the text while children drum along.'],['PAGES 7–8','Read the text and draw out the word “hum.”'],['PAGES 9–10','Read with a regular beat. Read “thumping and pound, the echo resounding” more slowly while keeping the beat.'],['PAGES 11–12','Read STOP loudly, pause, point to the word, and notice that it is written in all capital letters.'],['PAGES 21–22','Read “hard” loudly, “soft” in a lower voice, and “blue” in a sad voice.'],['AFTER READING','Where else have you played or heard a strong beat? How did it feel? What kinds of sounds do you hear in your neighborhood? Invite 2–3 responses to each.']],Wednesday:{title:'Things We Do — “Hug”',sub:'Poem 1 of 2 · Hug by Pat Mora',before:'Introduce Things We Do as a book containing poems by many poets. Explain that a poem is a kind of writing that often has rhyme/rhythm and a poet writes poems. Show the enlarged poem “Hug” by Pat Mora. Ask: Who do you like to hug? Explain that you will read it once, then read it again together.',stops:[['FIRST READ','Read the poem straight through while tracking print with a pointer/finger. Emphasize rhyming words and explain vocabulary as needed. Note that it is short, like a tiny story.'],['SECOND READ · RHYME','Explain rhyme: words sound the same in the middle and end. Children show thumbs up when they hear rhyming words. Pause on “do,” “too,” and “whoo-hoo.” Name the three rhyming words afterward.'],['THIRD READ · ACT IT OUT','Invite children to act out each line. How can we show “hug”? Pretend to hug ourselves. How can we show “love”? Perhaps hands shaped like a heart. How can we act out “pet”? Explain a pet is an animal that lives with people.'],['CLOSING','Tell children another poem from Things We Do will be read later in the week. Hang this poem in Library & Listening so children can revisit it and use the pointer.']]},Thursday:{title:'Drum City',sub:'Read 3 of 3 · Act out the story',before:'Seat children around the perimeter of the rug. Today we will act out Drum City. The perimeter is the audience and the inside is the stage. Invite children to enter the stage as characters. Children may say “pass” or use the established pass gesture if they prefer to watch.',stops:[['ACT OUT SELECTED SCENES','Read and select several scenes to act out. Show the pages. To include more actors, children may portray people in the city and vehicles. Use props such as bowls and kitchen tools as pretend instruments.'],['AFTER READING','What did you think about acting out the story today? Close by telling children the class will act out other stories soon.']]}}};const d=reads[day]||reads.Monday;$('title').textContent=d.title;$('sub').textContent=d.sub;$('chip').textContent='FOCUS ON 3s · WEEK 6 · '+day.toUpperCase();let step=-1;function render(){const before=step<0,z=before?null:d.stops[step];$('pageImg').src='assets/reading.webp';$('stop').classList.add('show');$('stop').innerHTML='<b>'+(before?'BEFORE WE READ':z[0])+'</b>'+(before?d.before:z[1]);$('count').textContent=before?'Before Reading':'Teaching Stop '+(step+1)+' of '+d.stops.length;$('prev').disabled=before;$('next').textContent=step===d.stops.length-1?'Finish Read Aloud ✓':'Next →'}$('prev').onclick=()=>{if(step>=0){step--;render()}};$('next').onclick=()=>{if(step<d.stops.length-1){step++;render()}else if(!runner)location.href='daily-lessons.html?week=6&day='+(day==='Thursday'?3:day==='Wednesday'?2:day==='Tuesday'?1:0)};$('back').onclick=()=>location.href='daily-lessons.html?week=6&day='+(day==='Tuesday'?1:0);render()})();</script></body></html>
