ep+1)+' of '+d.stops.length;$('prev').disabled=before;$('next').textContent=step===d.stops.length-1?'Finish Read Aloud ✓':'Next →'}$('prev').onclick=()=>{if(step>=0){step--;render()}};$('next').onclick=()=>{if(step<d.stops.length-1){step++;render()}else if(!runner)location.href='daily-lessons.html?week=6&day=0'};$('back').onclick=()=>location.href='daily-lessons.html?week=6&day=0';render()})();</script></body></html>
