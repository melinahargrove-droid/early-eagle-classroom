<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book img{display:block;width:100%;height:100%;object-fit:contain}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);z-index:5;background:rgba(255,253,248,.96);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"></div><div class="stopcard" id="stop"></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>const d={Monday:{title:'My Day with Gong Gong',sub:'Read 3 of 4 · Retelling the second half',prefix:'my-day-with-gong-gong-',start:11,end:19,focus:'Begin with book page 17 and read through the end. Use the words and illustrations to retell the second half.',note:'After reading, page back through the second half and ask what happened first, next, and after that.',stops:{12:'BOOK PAGE 18 • What does Gong Gong give May? May looks surprised. Show on your face how you look when you feel surprised.',14:'BOOK PAGE 23 • The sky looks rosy, so it seems late in the day. They have spent the whole day together! How does May communicate with Gong Gong now?',17:'BOOK PAGE 29 • May and Gong Gong have seen many places and people during the day. What is one?',18:'BOOK PAGE 31 • May has learned some words in Cantonese to communicate with her grandfather. What is something she learns to say?'}},Tuesday:{title:'My Day with Gong Gong',sub:'Read 4 of 4 · Acting out the story',prefix:'my-day-with-gong-gong-',start:3,end:19,focus:'Read the story aloud while children act out a selected scene, sequence of events, or the whole story.',note:'The curriculum suggests the park sequence from book pages 12–22 as one sequence that may work well. Children may play any character and may pass. Take turns being May and Gong Gong.',stops:{}},Wednesday:{title:'Goodbye Summer, Hello Autumn',sub:'Read 1 of 3 · What’s happening in the book?',prefix:'goodbye-summer-hello-autumn-',start:3,end:17,focus:'Read the full text fluently, pausing only at the curriculum-designated moments.',note:'After reading, return to book pages 3–10 and act with gestures/body movements like the animals, people, flowers, and other things affected by summer ending.',stops:{4:'BOOK PAGE 4 • Who is talking?',7:'BOOK PAGE 10 • The animals and things the child says “hello” to talk back. They tell how the changing season is affecting them!',10:'BOOK PAGES 15–16 • Look at the illustrations and listen to the words. What does the breezy wind do to people and things? Is it a strong wind or a gentle breeze? How can you tell?',14:'BOOK PAGE 24 • What happens to the sunsets when summer is coming to an end?'}},Thursday:{title:'Goodbye Summer, Hello Autumn',sub:'Read 2 of 3 · Describing places and things',prefix:'goodbye-summer-hello-autumn-',start:3,end:17,focus:'Read the full text fluently. Describe places and things using both the words and illustrations.',note:'After reading, slowly revisit the illustrations and ask how weather affects the people, animals, places, and things in the story.',stops:{5:'BOOK PAGE 6 • Look at the illustrations. What do you notice about the place, the animals, and the person?',11:'BOOK PAGES 17–18 • Look at the illustrations and listen to the words again. What do you see and hear that tells you how the season is changing?'}},Friday:{title:'Goodbye Summer, Hello Autumn',sub:'Read 3 of 3 · Acting out the story',prefix:'goodbye-summer-hello-autumn-',start:3,end:17,focus:'Read the story aloud while children act out a selected scene or the whole story.',note:'Children can be any person, animal, or thing—from a beaver to the wind. Prompt acting with questions such as “Can you show us a tree swaying?” or “Can you show us a fox looking for food?” Children may pass.',stops:{}}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday,page=x.start;title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 6 · '+day.toUpperCase();notesTitle.textContent=x.title;focus.textContent=x.focus;note.textContent=x.note||'';function show(){const total=x.end-x.start+1,pos=page-x.start+1;pageImg.src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg?v=2';count.textContent='Slide '+pos+' of '+total;fill.style.width=(pos/total*100)+'%';prev.disabled=page===x.start;next.textContent=page===x.end?'Finish Read Aloud ✓':'Next →';const s=x.stops[page]||'';stop.innerHTML=s?'<b>CURRICULUM TEACHING STOP — PAUSE HERE</b>'+s:'';stop.classList.toggle('show',!!s)}prev.onclick=()=>{if(page>x.start){page--;show()}};next.onclick=()=>{if(page<x.end){page++;show()}else location.href='week6-plan.html'};backBtn.onclick=()=>location.href='week6-plan.html';notesBtn.onclick=()=>notesPanel.classList.toggle('open');closeNotes.onclick=()=>notesPanel.classList.remove('open');show();</script></body></html>
