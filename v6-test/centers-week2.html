*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f6f1e5}.page{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e4eee9 100%)}.top{position:absolute;left:3%;right:3%;top:2.5%;height:10%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.11em;font-size:clamp(11px,.72vw,15px)}.brand h1{margin:.35vh 0 0;color:#164f7f;font-size:clamp(28px,2.4vw,46px);line-height:1}.week{padding:.8vh 1.5vw;border-radius:999px;background:rgba(211,230,236,.78);border:1px solid rgba(91,140,156,.18);color:#47798a;font-weight:900;letter-spacing:.04em}.homewrap{display:flex;justify-content:flex-end}.home{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:rgba(255,253,247,.94);color:#164f7f;font-size:clamp(21px,1.5vw,29px);font-weight:900;cursor:pointer}.days{position:absolute;top:13.5%;left:50%;transform:translateX(-50%);display:flex;gap:.65vw}.days button{border:1.3px solid rgba(89,130,146,.18);background:rgba(255,253,247,.92);color:#557b83;border-radius:999px;padding:.75vh 1.15vw;font-weight:900;font-size:clamp(12px,.8vw,15px);cursor:pointer}.days button.active{background:#668f99;color:white}.stage{position:absolute;left:7%;right:7%;top:20%;bottom:11%;border:1.6px solid rgba(89,139,151,.22);border-radius:31px;background:rgba(255,254,249,.92);box-shadow:0 16px 44px rgba(53,76,74,.07);display:grid;grid-template-columns:43% 1fr;gap:4vw;align-items:center;padding:4.2%}.visual{height:100%;display:flex;align-items:center;justify-content:center}.piccard{width:min(34vw,560px);height:min(52vh,500px);border-radius:30px;background:linear-gradient(150deg,rgba(224,237,234,.82),rgba(250,244,232,.92));border:1.5px solid rgba(93,139,145,.18);display:flex;align-items:center;justify-content:center;padding:3vh 2vw}.piccard img{width:92%;height:92%;object-fit:contain;border-radius:22px}.copy .kicker{color:#789697;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(12px,.82vw,16px)}.copy h2{margin:1.2vh 0 .5vh;color:#174f7d;font-size:clamp(39px,3.45vw,66px);line-height:1.03}.copy .sub{color:#527678;font-size:clamp(20px,1.35vw,27px);font-weight:900;margin-bottom:2vh}.prompt{background:rgba(225,239,234,.78);border-radius:22px;padding:1.6vh 1.5vw;color:#416d61;font-size:clamp(22px,1.55vw,30px);font-weight:900;line-height:1.3}.rule{margin-top:1.6vh;color:#5c7975;font-size:clamp(17px,1.15vw,22px);font-weight:800;line-height:1.4}.teacher{margin-top:2vh;border:0;border-radius:16px;background:#668f99;color:white;padding:1vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.panel{position:absolute;z-index:8;right:7%;top:21%;width:min(470px,31vw);max-height:65vh;overflow:auto;padding:2vh 1.4vw;border-radius:24px;background:rgba(255,253,247,.99);border:1.5px solid rgba(83,120,128,.18);box-shadow:0 18px 38px rgba(44,67,68,.18);display:none}.panel.open{display:block}.panel .label{color:#789697;font-weight:900;font-size:11px;letter-spacing:.08em}.panel h3{margin:.6vh 0 1vh;color:#315f70;font-size:clamp(20px,1.4vw,28px)}.panel p{color:#58716f;font-weight:700;line-height:1.45;font-size:clamp(13px,.9vw,17px)}.panel .vocab{padding:1vh .8vw;border-radius:14px;background:rgba(226,238,236,.65);font-weight:800}.close{float:right;border:0;background:transparent;color:#315f70;font-size:22px;font-weight:900;cursor:pointer}.footer{position:absolute;left:7%;right:7%;bottom:3.5%;display:flex;justify-content:space-between;align-items:center}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:16px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.prev{background:rgba(255,253,247,.94);color:#245c78}.next{background:#668f99;color:white}.dots{display:flex;gap:.55vw}.dot{width:12px;height:12px;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}
</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Intro to Centers</h1></div><div class="week" id="week">UNIT 1 · WEEK 2 · MONDAY</div><div class="homewrap"><button class="home" id="back">←</button></div></header><div class="days" id="days"><button>Monday</button><button>Tuesday</button><button>Wednesday</button><button>Thursday</button><button>Friday</button></div><section class="stage"><div class="visual"><div class="piccard"><img id="pic" alt="Center illustration"></div></div><div class="copy"><div class="kicker" id="kicker"></div><h2 id="title"></h2><div class="sub" id="sub"></div><div class="prompt" id="prompt"></div><div class="rule" id="rule"></div><button class="teacher" id="teacherBtn">Teacher Notes</button></div></section><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous Day</button><div class="dots" id="dots"></div><button class="nav next" id="next">Next Day →</button></footer></main><script>
const data=[
{title:'Playdough With Tools',sub:'Discovery Center',kicker:'MONDAY · INTRODUCE',img:'assets/science.webp',prompt:'What can these tools help us do with playdough?',rule:'We can roll, press, flatten, smooth, and cut the playdough. Tools stay with the playdough and are used carefully.',materials:'Playdough; rolling pins; playdough scissors/knives; sticks; cookie cutters; Playdough Tools visuals.',vocab:'pinch · press · roll · smooth',notes:'Remind children that last week they shaped playdough with their hands. Introduce the added tools one at a time. Demonstrate flattening, pressing, rolling, smoothing, and cutting. Invite a few ideas for other ways the tools might be used with playdough.'},
{title:'Structures & People',sub:'Blocks Center',kicker:'TUESDAY · INTRODUCE',img:'assets/blocks.webp',prompt:'What kind of place could you build for people?',rule:'Buildings can be homes, stores, schools, or other places people use. Blocks and people figures stay in the Blocks Center.',materials:'A few blocks; people figures; Too Many Mangos pages showing neighbors and friends.',vocab:'build · building · neighbor · structure',notes:'Connect to Too Many Mangos and the people in the neighborhood. Show the people figures. Model building a simple shelter or building for a figure. Ask children what other kinds of buildings they could make for people.'},
{title:'Drawing Materials',sub:'Art Studio',kicker:'WEDNESDAY · REVISIT',img:'assets/art.webp',prompt:'How do we take care of our drawing tools?',rule:'When a marker is finished, push the cap until you hear the CLICK. Put crayons, markers, and colored pencils back in their containers.',materials:'Crayons; markers; colored pencils; paper; a couple of children’s drawings if available.',vocab:'draw · colored pencil · crayon · materials · marker',notes:'Revisit children’s experience in Art Studio. Show the added markers and colored pencils. Model taking a marker cap off, making a few lines, and replacing the cap by pressing until it snaps. Remind children they may draw together and should return materials when finished.'},
{title:'Cooking Together',sub:'Dramatic Play',kicker:'THURSDAY · REVISIT',img:'assets/dramatic-play.webp',prompt:'What could you cook and share with a friend?',rule:'We share the pretend food and tools, take turns, and put everything back when our cooking is finished.',materials:'Dramatic Play cooking materials; Too Many Mangos pages showing food exchanges if desired.',vocab:'cook · prepare · stove · refrigerator · ingredients',notes:'Invite children to remember what they have already done in Dramatic Play. Connect to Too Many Mangos: neighbors share foods and Grandpa makes fruit salad. Encourage children to pretend to prepare and cook foods together and ask one another to share.'},
{title:'Looking at Books',sub:'Library & Listening',kicker:'FRIDAY · REVISIT',img:'assets/reading.webp',prompt:'How do we take care of our classroom books?',rule:'Use gentle hands. Open from the front, turn pages carefully, and return the book to its bin or shelf when you are done.',materials:'Several classroom books; book bins or shelf; book-care visuals if used.',vocab:'bin · book · choose · gentle · page · read',notes:'Revisit the Library & Listening Center. Model choosing a book, opening the front cover, turning pages gently, noticing something in an illustration, and putting the book back in its correct place. Invite children to share a book they have enjoyed.'}
];let day=0;const btns=[...document.querySelectorAll('#days button')];const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const names=['Monday','Tuesday','Wednesday','Thursday','Friday'];const requested=params.get('day');if(requested&&names.includes(requested))day=names.indexOf(requested);const returnTo=params.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html';function render(){const d=data[day];$('pic').src=d.img;$('title').textContent=d.title;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker;$('prompt').textContent=d.prompt;$('rule').textContent=d.rule;$('noteTitle').textContent=d.title;$('notes').textContent=d.notes;$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='UNIT 1 · WEEK 2 · '+btns[day].textContent.toUpperCase();btns.forEach((b,i)=>b.classList.toggle('active',i===day));$('dots').innerHTML=data.map((_,i)=>`<span class="dot ${i===day?'active':''}"></span>`).join('');$('prev').style.visibility=day===0?'hidden':'visible';$('next').textContent=day===4?'Done ✓':'Next Day →';$('panel').classList.remove('open')}btns.forEach((b,i)=>b.onclick=()=>{day=i;render()});$('prev').onclick=()=>{if(day>0){day--;render()}};$('next').onclick=()=>{if(day<4){day++;render()}else location.href=returnTo};$('back').onclick=()=>location.href=returnTo;$('teacherBtn').onclick=()=>$('panel').classList.add('open');$('close').onclick=()=>$('panel').classList.remove('open');render();
</script></body></html>
