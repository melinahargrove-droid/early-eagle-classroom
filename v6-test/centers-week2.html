<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 2 Intro to Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f6f1e5}.page{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e4eee9 100%)}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.11em;font-size:clamp(10px,.7vw,14px)}.brand h1{margin:.3vh 0 0;color:#164f7f;font-size:clamp(30px,2.5vw,48px);line-height:1}.right{display:flex;align-items:center;gap:.8vw}.week{padding:.55vh .9vw;border-radius:999px;background:rgba(211,230,236,.75);color:#47798a;font-weight:900;font-size:clamp(11px,.74vw,14px)}.closebtn{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#164f7f;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(89,139,151,.22);border-radius:34px;background:rgba(255,254,249,.95);box-shadow:0 18px 48px rgba(53,76,74,.08);display:grid;grid-template-columns:48% 1fr;gap:3.4vw;align-items:center;padding:4.2% 4.8%}.visual{height:100%;display:flex;align-items:center;justify-content:center}.piccard{width:min(39vw,650px);height:min(60vh,585px);border-radius:32px;background:linear-gradient(145deg,rgba(226,238,236,.82),rgba(251,244,231,.95));border:1.5px solid rgba(93,139,145,.16);display:flex;align-items:center;justify-content:center;padding:3vh 2vw}.piccard img{width:94%;height:94%;object-fit:contain;border-radius:24px}.copy .eyebrow{color:#789697;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(12px,.82vw,16px)}.copy h2{margin:1vh 0 .5vh;color:#174f7d;font-size:clamp(44px,4vw,76px);line-height:1}.centername{color:#527678;font-size:clamp(21px,1.4vw,28px);font-weight:900;margin-bottom:2vh}.prompt{font-size:clamp(25px,1.75vw,34px);line-height:1.3;color:#496d70;font-weight:900;max-width:38vw}.cue{margin-top:2vh;padding:1.4vh 1.5vw;border-radius:20px;background:#e7f1ed;color:#426f65;font-size:clamp(23px,1.65vw,32px);font-weight:900;line-height:1.25;max-width:38vw}.cue strong{color:#174f7d}.teacher{position:absolute;left:50%;bottom:2.1%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.62vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.done{position:absolute;right:8.5%;bottom:2.1%;border:0;border-radius:18px;background:#668f99;color:#fff;padding:1vh 1.5vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.panel{position:absolute;z-index:10;right:7%;top:14%;width:min(500px,33vw);max-height:72vh;overflow:auto;padding:2vh 1.5vw;border-radius:24px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 18px 38px rgba(44,67,68,.18);display:none}.panel.open{display:block}.panel .label{color:#789697;font-weight:900;font-size:11px;letter-spacing:.08em}.panel h3{margin:.6vh 0 1vh;color:#315f70;font-size:clamp(21px,1.45vw,29px)}.panel p{color:#58716f;font-weight:700;line-height:1.45;font-size:clamp(13px,.9vw,17px)}.panel .vocab{padding:1vh .8vw;border-radius:14px;background:rgba(226,238,236,.65);font-weight:800}.x{float:right;border:0;background:transparent;color:#315f70;font-size:22px;font-weight:900;cursor:pointer}@media(max-width:900px){.stage{grid-template-columns:1fr;top:11%;bottom:12%;padding:3%}.visual{height:42%}.piccard{width:80vw;height:34vh}.copy{text-align:center}.prompt,.cue{max-width:none}.done{right:4%}.teacher{left:28%}}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 2 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard"><img id="pic" alt="Center illustration"></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script>const data=[{title:'Playdough With Tools',sub:'Discovery Center',kicker:'MONDAY · INTRODUCE',img:'assets/science.webp',prompt:'What can these tools help us do with playdough?',cue:'Roll · press · flatten · smooth · cut',materials:'Playdough; rolling pins; playdough scissors/knives; sticks; cookie cutters; Playdough Tools visuals.',vocab:'pinch · press · roll · smooth',notes:'Remind children that last week they shaped playdough with their hands. Introduce the added tools one at a time. Demonstrate flattening, pressing, rolling, smoothing, and cutting. Invite a few ideas for other ways the tools might be used with playdough.'},{title:'Structures & People',sub:'Blocks Center',kicker:'TUESDAY · INTRODUCE',img:'assets/blocks.webp',prompt:'What kind of place could you build for people?',cue:'Build a place for someone.',materials:'A few blocks; people figures; Too Many Mangos pages showing neighbors and friends.',vocab:'build · building · neighbor · structure',notes:'Connect to Too Many Mangos and the people in the neighborhood. Show the people figures. Model building a simple shelter or building for a figure. Ask children what other kinds of buildings they could make for people.'},{title:'Drawing Materials',sub:'Art Studio',kicker:'WEDNESDAY · REVISIT',img:'assets/art.webp',prompt:'How do we take care of our drawing tools?',cue:'Marker cap on until you hear the <strong>CLICK!</strong>',materials:'Crayons; markers; colored pencils; paper; a couple of children’s drawings if available.',vocab:'draw · colored pencil · crayon · materials · marker',notes:'Revisit children’s experience in Art Studio. Show the added markers and colored pencils. Model taking a marker cap off, making a few lines, and replacing the cap by pressing until it snaps. Remind children they may draw together and should return materials when finished.'},{title:'Cooking Together',sub:'Dramatic Play',kicker:'THURSDAY · REVISIT',img:'assets/dramatic-play.webp',prompt:'What could you cook and share with a friend?',cue:'Cook · share · take turns · clean up',materials:'Dramatic Play cooking materials; Too Many Mangos pages showing food exchanges if desired.',vocab:'cook · prepare · stove · refrigerator · ingredients',notes:'Invite children to remember what they have already done in Dramatic Play. Connect to Too Many Mangos: neighbors share foods and Grandpa makes fruit salad. Encourage children to pretend to prepare and cook foods together and ask one another to share.'},{title:'Looking at Books',sub:'Library & Listening',kicker:'FRIDAY · REVISIT',img:'assets/reading.webp',prompt:'How do we take care of our classroom books?',cue:'Gentle hands · careful pages · books back home',materials:'Several classroom books; book bins or shelf; book-care visuals if used.',vocab:'bin · book · choose · gentle · page · read',notes:'Revisit the Library & Listening Center. Model choosing a book, opening the front cover, turning pages gently, noticing something in an illustration, and putting the book back in its correct place. Invite children to share a book they have enjoyed.'}];const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search),names=['Monday','Tuesday','Wednesday','Thursday','Friday'];const requested=params.get('day');let day=Math.max(0,names.findIndex(n=>n.toLowerCase()===(requested||'Wednesday').toLowerCase()));const returnTo=params.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html';function render(){const d=data[day];$('pic').src=d.img;$('title').textContent=d.title;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker;$('prompt').textContent=d.prompt;$('cue').innerHTML=d.cue;$('noteTitle').textContent=d.title;$('notes').textContent=d.notes;$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='WEEK 2 · '+names[day].toUpperCase();$('panel').classList.remove('open')}$('back').onclick=()=>location.href=returnTo;$('doneBtn').onclick=()=>location.href=returnTo;$('teacherBtn').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');render();</script></body></html>
