="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 2 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={
Monday:[
{title:'Exploring Playdough 2',sub:'Science & Engineering',kicker:'CONTINUED LESSON',img:'assets/science.webp',materials:'I Love Us pancake page · playdough · playdough tools · playdough tools visuals',vocab:'senses · roll · smooth · pinch · press',steps:[
{title:'New Tools for Playdough',img:'assets/focus-3s/unit-1/week-2/centers/science-engineering/playdough-tools.png',prompt:'We are adding tools to continue exploring and making creations.',cue:'Look at the tools. What might they help us do?',script:'This week at the Science and Engineering Center, we will add some tools to playdough to continue exploring and making creations. Demonstrate using some of the playdough tools.'},
{title:'Make a Pancake',img:'assets/focus-3s/unit-1/week-2/centers/science-engineering/make-a-pancake.png',prompt:'Can you make a pancake like the family in I Love Us?',cue:'Use a tool to flatten the playdough.',script:'You can even pretend to make a meal for your family and friends with the playdough and tools. Can you make a pancake like the ones in the book I Love Us? Show the pancake illustration and model using playdough tools to flatten the playdough into a pancake shape.'},
{title:'Foods Our Families Make',img:'assets/focus-3s/unit-1/week-2/centers/science-engineering/family-food-creations.png',prompt:'What other kinds of food do you make with your family?',cue:'Share an idea, then create!',script:'What other kinds of food do you make with your family? Collect ideas from children. I’m looking forward to seeing all the wonderful things you create this week in Science and Engineering.'}]},
{title:'Names',sub:'Writing & Drawing',kicker:'NEW LESSON',img:'assets/writing.webp',materials:'Naming Ceremony · 2 prepared name cards per child · extra cards · markers/crayons other than black · binder ring or basket',vocab:'beloved · decorate · meaningful',steps:[
{title:'Names Can Be Meaningful',prompt:'Names can be really special.',cue:'Remember the names Amira’s family chose?',script:'Hold up Naming Ceremony. In Naming Ceremony, Amira’s family really thinks hard about what names they want to give to their new baby. Naming a new baby is an important job! Each person has a name idea that is meaningful, or really special.'},
{title:'These Are Our Names',prompt:'What do you notice about your name?',cue:'Look closely at the printed names.',script:'Hold up some of the name cards and read them, tracking the print. These are some of your names. We have cards for each of you.'},
{title:'Decorate Your Name Card',prompt:'Add colors and designs around your name.',cue:'Keep the black box/name easy to read.',script:'Today we will decorate, or add colors and designs, to our name cards. While we decorate, we can talk about what we love about our names and what makes them meaningful to us. During Centers, remind children to decorate outside the black box so the name remains legible. Name writing is not the goal of this experience.'}]}
],
Tuesday:[
{title:'Collaborative Collages',sub:'Art Studio',kicker:'CONTINUED LESSON',img:'assets/art.webp',materials:'Shhh! The Baby’s Asleep collage illustrations · butcher paper/posterboard · masking tape · Week 1 collages · collage materials',vocab:'adhere · collage · decide · collaborate',steps:[
{title:'Remember Our Collages',prompt:'We have made many collages in the Art Studio!',cue:'Look back at some of our artwork.',script:'Show some children’s collages from the previous week. Invite the artists to share something about their artwork or briefly describe their work.'},
{title:'An Illustrator Used Collage',prompt:'What do you notice about these pictures?',cue:'Elissambura used collage, too.',script:'The artist who made the pictures for Shhh! The Baby’s Asleep, Elissambura, also used collage. Show 1–2 illustrations and ask: What do you notice?'},
{title:'One BIG Collage',prompt:'We can all work on this collage together.',cue:'Collaborate means work together.',script:'Today in the Art Studio there is a BIG piece of paper. We need a large paper because we will create a collaborative collage—a big collage that we all work on together. We can each add pieces and keep working on it all week.'},
{title:'What Will You Add?',prompt:'Which materials will you decide to add?',cue:'Choose materials and share ideas.',script:'Show available collage materials. I wonder which materials you will decide, or choose, to add to our collaborative collage? What do you think you will try? Invite a few children to share.'},
{title:'Optional New Tools',prompt:'Paper here can be torn—or cut safely when we are ready.',cue:'Art paper can be torn; books stay safe.',script:'If introducing tearing, model tearing Art Studio paper into smaller pieces and explicitly distinguish it from books. If introducing scissors, model safe scissor use. Only include these options when appropriate for your group.'}]},
{title:'Free Exploration 2',sub:'Blocks',kicker:'CONTINUED LESSON',img:'assets/blocks.webp',materials:'blocks · documentation of prior structures · I Love Us tower-building page · selected new materials such as people, animals, or vehicles',vocab:'explore · build · create · structure · stable',steps:[
{title:'Remember Our Buildings',prompt:'What have we already built in Blocks?',cue:'Look at our photos or remember our structures.',script:'In I Love Us! A Book About Family, we saw families help each other build towers out of blocks. In our Block Center last week, we built lots of different kinds of structures too! Show photos of structures children built or read their quotes.'},
{title:'New Materials',prompt:'What could we add to our block play?',cue:'People · animals · vehicles—or materials that fit our play.',script:'This week, we will add some [vehicles, people, animals, etc.] to our Block Center. Choose additions based on what children have actually been building and the pretend play you have observed.'},
{title:'Try Them in Your Building',prompt:'How could you use the new materials?',cue:'Add them to a structure or story.',script:'Model some ways the selected new materials can be incorporated into block creations.'}]}
],
Wednesday:[
{title:'Caring for Babies 1',sub:'Dramatic Play',kicker:'NEW LESSON',img:'assets/dramatic-play.webp',materials:'Naming Ceremony · I Love Us! · Shhh! The Baby’s Asleep · diverse baby dolls · baby furniture · bottles · blankets · diapers · clothing · carriers · bowls/spoons · stuffed animals · fabric · labeled containers · topic board',vocab:'care · comfort · feed · rock · wrap',steps:[
{title:'Families Care for Babies',prompt:'How did the family help the baby in Shhh!?',cue:'They helped the baby get enough sleep.',script:'In many of our books, we see families caring for babies in their homes. In Shhh! The Baby’s Asleep, the whole family cares for the baby by making sure the baby gets enough sleep. Show the book.'},
{title:'Babies in Dramatic Play',prompt:'What is one way to care for a baby?',cue:'Our Dramatic Play Center has babies and care items.',script:'Our Dramatic Play Center will change often. This week, you will find babies and some things to help care for babies, like a crib and diapers. When you visit Dramatic Play, you can care for babies and make sure they have what they need. Invite one child to share one way to care for a baby and model that idea.'},
{title:'Feed the Baby',prompt:'A baby might need food.',cue:'Pretend to feed the baby with a bottle.',script:'I might take care of my baby by feeding her with a bottle. Model.'},
{title:'Comfort the Baby',prompt:'How can we help a crying baby feel better?',cue:'Rock · wrap · speak gently.',script:'Babies cry sometimes. I might comfort her, or help her feel better, by rocking or wrapping her with a blanket. Model: “Shh, baby, it’s ok. Mama’s here, you’re safe.”'},
{title:'Clean Up Baby Care',prompt:'Baby things have places to go, too.',cue:'Fold blankets and use the labeled bins.',script:'Model and talk through the clean-up process. Show how to fold blankets and put them back into bins and where the baby materials are housed.'}]},
{title:'Looking at Books 2',sub:'Library & Listening',kicker:'CONTINUED LESSON',img:'assets/reading.webp',materials:'classroom books · established Library & Listening organization',vocab:'book · choose · gentle · page',steps:[
{title:'Remember Library & Listening',prompt:'What have you found in our Library & Listening Center?',cue:'Books help us enjoy stories and learn information.',script:'Have you visited the Library and Listening Center yet? What did you find there? Point to the Center and invite one child to share. Remember, this is a place where you can sit with books to enjoy stories and learn information.'},
{title:'Handle Books Gently',prompt:'Open the cover and turn pages carefully.',cue:'Gentle hands protect our books.',script:'Demonstrate picking up a book, opening the front cover, and gently turning the pages.'},
{title:'Invite a Friend',prompt:'Would you like to read with me?',cue:'Tell a friend something you like about the book.',script:'It’s enjoyable to read books with friends. Model: “I love this book because ____! I want to tell other people about it. Would you like to read with me?”'},
{title:'Read Side by Side',prompt:'Choose together · sit together · take turns.',cue:'Make sure both friends can see and reach the book.',script:'Demonstrate sitting side by side with the book accessible to both children, telling a friend something appealing about it, and carefully putting it away. This week, children can choose a book together and take turns turning pages.'}]}
