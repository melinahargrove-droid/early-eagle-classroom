rmanent marker with a box around each name; extra cards; markers and/or crayons other than black; binder ring or basket.',vocab:'beloved · decorate · meaningful',notes:'Focus on 3s Week 2: Names. Show Naming Ceremony and connect to the meaningful names given to the baby. Read several children’s name cards while tracking the print. Explain that children will decorate their name cards and can talk about what they love about their names. The curriculum specifically notes that name writing is not the goal of this experience; support children in noticing their names in print and decorating outside the black box.'}]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday;let i=0;function render(){const d=items[i];$('pic').src=d.img;$('title').textContent=d.title;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker;$('prompt').textContent=d.prompt;$('cue').textContent=d.cue;$('noteTitle').textContent=d.title;$('notes').textContent=d.notes;$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='FOCUS ON 3s · WEEK 2 · '+dayName.toUpperCase();$('doneBtn').textContent=i<items.length-1?'Next Center →':'Done ✓';$('panel').classList.remove('open')}$('back').onclick=()=>location.href='daily-lessons.html?week=2&day=0';$('doneBtn').onclick=()=>{if(i<items.length-1){i++;render()}else if(new URLSearchParams(location.search).get('eeaRunner')!=='1')location.href='daily-lessons.html?week=2&day=0'};$('teacherBtn').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');render();</script></script></body></html>
