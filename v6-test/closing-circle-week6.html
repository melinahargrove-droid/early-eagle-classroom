ather Detective',html:`<p>Use one finger for each clue you can name.</p><div class="box"><b>Quick activity:</b> Name one clue that could tell you the weather or season is changing—something you might see, hear, feel, or notice people wearing.</div>`},Friday:{title:'One Change I Noticed',html:`<p>Think back across this week’s stories, weather observations, center work, and conversations.</p><div class="box"><b>Turn and Talk:</b> Tell a partner one change you noticed this week—in the weather, in a story character, in something you created, or in something you learned.</div>`}}[day];tag.textContent='WEEK 6 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
