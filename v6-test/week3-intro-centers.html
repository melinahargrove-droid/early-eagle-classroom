="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 3 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Feelings Paintings',sub:'Art Studio',kicker:'NEW LESSON',img:'assets/art.webp',materials:'Allie All Along · finger paint · finger paint paper · table covers/trays · class Feelings Chart or Feelings Visuals · baby wipes · smocks',vocab:'angry · calm · covered · create · excited · joyful · furious · lonely · mix · sad · worried',steps:[{title:'Remember Allie’s Colors',prompt:'What colors did Allie become?',cue:'Colors can help us think and talk about feelings.',script:'Remember all the colors Allie became in Allie All Along? Show the book and flip to some pages where Allie changes color. Name the colors.'},{title:'Meet Finger Paint',prompt:'Choose colors to create a painting.',cue:'Your painting could be a feelings painting.',script:'Today in the Art Studio we have many colors of finger paint for you to use to create, or make, a painting. You can choose as many colors as you want. Your painting could be a feelings painting. You could think about a feeling while you paint, maybe one of the feelings Allie had.'},{title:'Look at Our Feelings',prompt:'What does this feeling look like on a face?',cue:'Use our Feelings Chart and try the expressions.',script:'Show the Feelings Chart, read the words with each picture, and invite children to make the corresponding facial expressions.'},{title:'Paint & Mix',prompt:'What happens when colors mix?',cue:'Use your fingers—or an adapted tool if needed—to put paint on paper.',script:'Model: “I think I will choose blue paint and mix it, put it together, with green.” Dab a finger in paint and swirl it on the paper.'},{title:'Covered in Paint',prompt:'My fingers are covered—paint is all over them!',cue:'Clean hands when you are finished.',script:'My fingers are covered in paint—there is paint all over! When you’re all done, wash your hands or clean them with a wipe. Model wiping fingers clean.'},{title:'Ready for the Next Artist',prompt:'Put your painting to dry and set out fresh paper.',cue:'I wonder what colors you will use to paint your feelings.',script:'Then you can put your painting to dry and put out a new piece of paper for the next artist. I wonder what colors you will use to paint your feelings.'}]},Tuesday:[{title:'Making Playdough',sub:'Science & Engineering',kicker:'NEW LESSON',img:'assets/science.webp',materials:'Playdough Recipe · playdough tools · flour · oil · salt · cream of tartar · boiling water · optional color/scents/herbs · craft sticks · mixing bowl/spoons · simple actions visuals · topic board',vocab:'senses · smell · touch · roll · sticky · calm · mix',steps:[{title:'We Will Make Playdough',prompt:'Today we will mix ingredients to make our own playdough!',cue:'Use touch, smell, and sight as we explore.',script:'This week, we will use our senses of touch, smell, and sight to work with more playdough. This time, we will mix, or put ingredients together, to make our own playdough! Show and name the ingredients.'},{title:'Read the Recipe',prompt:'A recipe tells us how to combine the ingredients.',cue:'Look at the recipe together.',script:'Show the recipe. Here is a recipe that tells us how to combine the ingredients. Let’s read the recipe together.'},{title:'Measure & Pretend to Mix',prompt:'First flour · second water · third salt.',cue:'Pretend to measure and mix with me.',script:'As you read, model using the measuring cup. Have children pretend to mix each ingredient. The curriculum example says: First, two cups flour. Second, one cup water. Third, one cup salt. Follow the actual Playdough Recipe when making the batch during Centers.'},{title:'Come Help Make It',prompt:'Visit Science & Engineering if you want to help make playdough.',cue:'We will keep our playdough here for the rest of the week.',script:'Come over to the Science and Engineering Center if you want to help make playdough today. We will leave the playdough in the Center for the rest of the week.'},{title:'Notice With Your Senses',prompt:'How does it look, feel, and smell?',cue:'Some people use playdough to help their bodies calm down.',script:'As you play, use your eyes, hands, and nose to notice how the playdough looks, feels, and smells. Some people like to use playdough to help them calm down. How does playing with playdough make you feel?'}]},{title:'Looking at Books 3',sub:'Library & Listening',kicker:'CONTINUED LESSON',img:'assets/reading.webp',materials:'classroom Library & Listening books · sticky notes',vocab:'book · choose · gentle · page',steps:[{title:'Remember Reading Together',prompt:'What have you enjoyed in Library & Listening?',cue:'Remember sitting side by side and turning pages gently.',script:'I noticed that many of you visited Library and Listening last week. Highlight a real positive experience from your class, such as children sitting side by side or turning pages carefully and gently.'},{title:'Find a Favorite Part',prompt:'What part of a book do you like most?',cue:'It might be funny, happy, or remind you of your family.',script:'Sometimes when we read a book, we discover a favorite part, or the part we like most. Perhaps something makes you happy, is funny, or reminds you of your family.'},{title:'Tag It With a Sticky Note',prompt:'Use a sticky note to tag your favorite part.',cue:'Then you can tell a friend about it.',script:'This week, when you visit Library and Listening, you can use a sticky note to tag your favorite part of the book. Afterwards, you can tell a friend about it.'},{title:'Model the Routine',prompt:'Choose → read → tag → tell a friend.',cue:'Show where your favorite part is.',script:'Demonstrate choosing a book, opening and reading it, tagging a favorite part, and then telling a friend: “Have you read this book before? Let me tell you about my favorite part. I tagged it here.”'}]}]]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday,runner=params.get('eeaRunner')==='1';let i=Math.max(0,Math.min(items.length-1,Number(params.get('item'))||0)),step=Math.max(0,Number(params.get('step'))||0),visualToken=0;const slot=()=>`week3-centers-${dayName.toLowerCase()}-${i}`+(items[i]?.steps?`-step-${step}`:'');async function applyVisual(d){const token=++visualToken; nt(slot())+'&return='+encodeURIComponent(backUrl)};$('restoreVisual').onclick=async()=>{try{await EEAVisualStore.remove(slot())}catch(e){}applyVisual(items[i])};render()})();</script></body></html>
