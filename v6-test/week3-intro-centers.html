t-transform:uppercase;font-size:clamp(12px,.82vw,16px)}.copy h2{margin:1vh 0 .5vh;color:#174f7d;font-size:clamp(44px,4vw,76px);line-height:1}.centername{color:#527678;font-size:clamp(21px,1.4vw,28px);font-weight:900;margin-bottom:2vh}.prompt{font-size:clamp(25px,1.75vw,34px);line-height:1.3;color:#496d70;font-weight:900;max-width:38vw}.cue{margin-top:2vh;padding:1.4vh 1.5vw;border-radius:20px;background:#e7f1ed;color:#426f65;font-size:clamp(23px,1.65vw,32px);font-weight:900;line-height:1.25;max-width:38vw}.cue strong{color:#174f7d}.teacher{position:absolute;left:50%;bottom:2.1%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.62vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.done{position:absolute;right:8.5%;bottom:2.1%;border:0;border-radius:18px;background:#668f99;color:#fff;padding:1vh 1.5vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.panel{position:absolute;z-index:10;right:7%;top:14%;width:min(500px,33vw);max-height:72vh;overflow:auto;padding:2vh 1.5vw;border-radius:24px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 18px 38px rgba(44,67,68,.18);display:none}.panel.open{display:block}.panel .label{color:#789697;font-weight:900;font-size:11px;letter-spacing:.08em}.panel h3{margin:.6vh 0 1vh;color:#315f70;font-size:clamp(21px,1.45vw,29px)}.panel p{color:#58716f;font-weight:700;line-height:1.45;font-size:clamp(13px,.9vw,17px)}.panel .vocab{padding:1vh .8vw;border-radius:14px;background:rgba(226,238,236,.65);font-weight:800}.x{float:right;border:0;background:transparent;color:#315f70;font-size:22px;font-weight:900;cursor:pointer}@media(max-width:900px){.stage{grid-template-columns:1fr;top:11%;bottom:12%;padding:3%}.visual{height:42%}.piccard{width:80vw;height:34vh}.copy{text-align:center}.prompt,.cue{max-width:none}.done{right:4%}.teacher{left:28%}}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 3 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Feelings Paintings',sub:'Art Studio',kicker:'NEW LESSON',img:'assets/art.webp',materials:'Allie All Along · finger paint · finger paint paper · table covers/trays · class Feelings Chart or Feelings Visuals · baby wipes · smocks',vocab:'angry · calm · covered · create · excited · joyful · furious · lonely · mix · sad · worried',steps:[{title:'Remember Allie’s Colors',prompt:'What colors did Allie become?',cue:'Colors can help us think and talk about feelings.',script:'Remember all the colors Allie became in Allie All Along? Show the book and flip to some pages where Allie changes color. Name the colors.'},{title:'Meet Finger Paint',prompt:'Choose colors to create a painting.',cue:'Your painting could be a feelings painting.',script:'Today in the Art Studio we have many colors of finger paint for you to use to create, or make, a painting. You can choose as many colors as you want. Your painting could be a feelings painting. You could think about a feeling while you paint, maybe one of the feelings Allie had.'},{title:'Look at Our Feelings',prompt:'What does this feeling look like on a face?',cue:'Use our Feelings Chart and try the expressions.',script:'Show the Feelings Chart, read the words with each picture, and invite children to make the corresponding facial expressions.'},{title:'Paint & Mix',prompt:'What happens when colors mix?',cue:'Use your fingers—or an adapted tool if needed—to put paint on paper.',script:'Model: “I think I will choose blue paint and mix it, put it together, with green.” Dab a finger in paint and swirl it on the paper.'},{title:'Covered in Paint',prompt:'My fingers are covered—paint is all over them!',cue:'Clean hands when you are finished.',script:'My fingers are covered in paint—there is paint all over! When you’re all done, wash your hands or clean them with a wipe. Model wiping fingers clean.'},{title:'Ready for the Next Artist',prompt:'Put your painting to dry and set out fresh paper.',cue:'I wonder what colors you will use to paint your feelings.',script:'Then you can put your painting to dry and put out a new piece of paper for the next artist. I wonder what colors you will use to paint your feelings.'}]},Tuesday:[{title:'Making Playdough',sub:'Science & Engineering',kicker:'NEW LESSON',img:'assets/science.webp',materials:'Playdough Recipe · playdough tools · flour · oil · salt · cream of tartar · boiling water · optional color/scents/herbs · craft sticks · mixing bowl/spoons · simple actions visuals · topic board',vocab:'senses · smell · touch · roll · sticky · calm · mix',steps:[{title:'We Will Make Playdough',prompt:'Today we will mix ingredients to make our own playdough!',cue:'Use touch, smell, and sight as we explore.',script:'This week, we will use our senses of touch, smell, and sight to work with more playdough. This time, we will mix, or put ingredients together, to make our own playdough! Show and name the ingredients.'},{title:'Read the Recipe',prompt:'A recipe tells us how to combine the ingredients.',cue:'Look at the recipe together.',script:'Show the recipe. Here is a recipe that tells us how to combine the ingredients. Let’s read the recipe together.'},{title:'Measure & Pretend to Mix',prompt:'First flour · second water · third salt.',cue:'Pretend to measure and mix with me.',script:'As you read, model using the measuring cup. Have children pretend to mix each ingredient. The curriculum example says: First, two cups flour. Second, one cup water. Third, one cup salt. Follow the actual Playdough Recipe when making the batch during Centers.'},{title:'Come Help Make It',prompt:'Visit Science & Engineering if you want to help make playdough.',cue:'We will keep our playdough here for the rest of the week.',script:'Come over to the Science and Engineering Center if you want to help make playdough today. We will leave the playdough in the Center for the rest of the week.'},{title:'Notice With Your Senses',prompt:'How does it look, feel, and smell?',cue:'Some people use playdough to help their bodies calm down.',script:'As you play, use your eyes, hands, and nose to notice how the playdough looks, feels, and smells. Some people like to use playdough to help them calm down. How does playing with playdough make you feel?'}]},{title:'Looking at Books 3',sub:'Library & Listening',kicker:'CONTINUED LESSON',img:'assets/reading.webp',materials:'classroom Library & Listening books · sticky notes',vocab:'book · choose · gentle · page',steps:[{title:'Remember Reading Together',prompt:'What have you enjoyed in Library & Listening?',cue:'Remember sitting side by side and turning pages gently.',script:'I noticed that many of you visited Library and Listening last week. Highlight a real positive experience from your class, such as children sitting side by side or turning pages carefully and gently.'},{title:'Find a Favorite Part',prompt:'What part of a book do you like most?',cue:'It might be funny, happy, or remind you of your family.',script:'Sometimes when we read a book, we discover a favorite part, or the part we like most. Perhaps something makes you happy, is funny, or reminds you of your family.'},{title:'Tag It With a Sticky Note',prompt:'Use a sticky note to tag your favorite part.',cue:'Then you can tell a friend about it.',script:'This week, when you visit Library and Listening, you can use a sticky note to tag your favorite part of the book. Afterwards, you can tell a friend about it.'},{title:'Model the Routine',prompt:'Choose → read → tag → tell a friend.',cue:'Show where your favorite part is.',script:'Demonstrate choosing a book, opening and reading it, tagging a favorite part, and then telling a friend: “Have you read this book before? Let me tell you about my favorite part. I tagged it here.”'}]}],Wednesday:[{title:'When I Was a Baby Stories',sub:'Writing & Drawing',kicker:'NEW LESSON',img:'assets/writing.webp',materials:'Naming Ceremony · Shhh! The Baby’s Asleep · white paper · blank 3–4 page books · crayons/markers · baby photographs when available · baby drawing guidance',vocab:'care · comfort · feed · pretend · rock · true · wrap',steps:[{title:'Families Care for Babies',prompt:'What do families do to care for babies?',cue:'Feed · comfort · hold · rock · wrap',script:'In Naming Ceremony and Shhh! The Baby’s Asleep, families care for their babies and make sure they have what they need. Show illustrations. What do you notice the families doing to take care of their babies? Point out rocking or wrapping.'},{title:'Think About Baby Stories',prompt:'What story could you tell about a baby?',cue:'A story may be true or pretend.',script:'The curriculum asks, “How did your family care for you when you were a baby?” Use this only when appropriate for the children in your group. Children may tell true or imagined stories and do not need baby photographs.'},{title:'Be a Storyteller',prompt:'Tell a story and draw the pictures.',cue:'A teacher can write your words exactly as you say them.',script:'Today, in Writing and Drawing, you can be a storyteller. You can tell a story about when you were a baby. I can help write the words and you can draw pictures in a blank book or on paper. Writing a story is a way to share your ideas with other people.'}],teacherNote:'Important inclusion guidance from Focus on 3s: personal baby-history prompts may be triggering for some children, including children in foster care or with abuse/neglect histories, and some children may not have baby photos or caregivers who knew them as babies. When needed, omit or reframe the experience as “How do adults take care of babies?” Children may draw themselves as babies and may tell true or pretend stories.'},{title:'Taking Care of Babies 2',sub:'Dramatic Play',kicker:'CONTINUED LESSON',img:'assets/dramatic-play.webp',materials:'Established Week 2 Caring for Babies materials',vocab:'care · comfort · feed · rock · wrap',steps:[{title:'Remember Caring for Babies',prompt:'How did you care for babies last week?',cue:'Share one thing you remember.',script:'Did you visit Dramatic Play last week? How did you care for babies? Invite one child to share.'},{title:'Choose Today’s Focus',prompt:'What would help our Dramatic Play today?',cue:'Choose ONE curriculum option based on what you observed.',script:'Focus gives three options for this introduction. Choose what fits your class: (1) model changing a diaper—remove diaper, wipe baby clean, and wrap diaper around the baby; (2) highlight a real positive interaction from last week where children made a plan together; OR (3) bring a real cleanup/play dilemma to the group and invite a knowledgeable child to help demonstrate a solution.'},{title:'Keep Caring Together',prompt:'Let’s continue taking care of babies this week!',cue:'Care for babies and work together with friends.',script:'Let’s continue to take care of babies this week!'}]}],Thursday:[{title:'Favorite Places Part 1',sub:'Blocks',kicker:'NEW LESSON',img:'assets/blocks.webp',materials:'blocks/building materials · family/child photos or drawings when appropriate · neighborhood/community photos · paper/writing tools for labels · Building Neighborhoods Visual Menu · blocks topic board',vocab:'build · structure · neighborhood · inspiration',steps:[{title:'Special Places in I Love Us',prompt:'Where did families spend time together?',cue:'Outside · a yard · a playground · other special places',script:'In I Love Us, we saw families spending time together in different special places. They watched planes and birds outside, celebrated in a yard, and built with blocks on a playground.'},{title:'Our Special Places',prompt:'What places are special to us?',cue:'School · neighborhood · playground · library · other meaningful places',script:'There are many special places to us—our school, our neighborhood, the space around where we live, and lots of other places. Show or discuss photographs/places children and families have shared or familiar places near school.'},{title:'Build a Favorite Place',prompt:'Use blocks to create a structure inspired by a favorite place.',cue:'Inspiration means something that gives you an idea.',script:'Today we will use blocks to create structures—things people build that stand up by themselves—inspired by our favorite places. We will put materials together to build, and these photos can inspire us, or give us ideas about what we can build.'},{title:'Model From a Picture',prompt:'How can a picture give us a building idea?',cue:'Look → choose blocks → build a simple structure',script:'Model making a simple structure based on one of the images.'}],teacherNote:'Focus on 3s inclusion note: consider housing insecurity or relocation when discussing homes/neighborhoods. Special places can include school, a playground, library, or other places meaningful to the child; do not require a home-based example.'},{title:'Revisit When I Was a Baby Stories',sub:'Writing & Drawing',kicker:'REVISIT',img:'assets/writing.webp',prompt:'Return to our baby stories.',cue:'Tell or draw a true or pretend story.',materials:'Original When I Was a Baby Stories materials and guidance are available through Review Original Introduction.',vocab:'care · comfort · feed · pretend · rock · true · wrap',revisit:{day:'Wednesday',item:0}}],Friday:[{title:'Finger Painting',sub:'Art Studio',kicker:'SCHEDULED CONTINUATION',img:'assets/art.webp',prompt:'Explore finger paint again.',cue:'Use the finger-paint materials and routines already introduced.',materials:'The Week 3 Weekly Plan names “Finger Painting,” but the Unit 1 Digital Arc does not provide a separate linked Finger Painting lesson. Use the materials/routines from Feelings Paintings.',vocab:'covered · create · mix',revisit:{day:'Monday',item:0},teacherNote:'Source note: “Finger Painting” appears in the Week 3 Weekly Plan, but no separate Finger Painting lesson is linked in the Unit 1 Digital Arc. Early Eagle is therefore treating this as a continuation of the finger-paint experience introduced through Feelings Paintings rather than inventing a new Focus lesson.'},{title:'Revisit Feelings Paintings',sub:'Art Studio',kicker:'REVISIT',img:'assets/art.webp',prompt:'Return to feelings paintings.',cue:'Think about a feeling and the colors you might use.',materials:'Original Feelings Paintings materials and guidance are available through Review Original Introduction.',vocab:'angry · calm · covered · create · excited · joyful · furious · lonely · mix · sad · worried',revisit:{day:'Monday',item:0}}]]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday,runner=params.get('eeaRunner')==='1';let i=Math.max(0,Math.min(items.length-1,Number(params.get('item'))||0)),step=Math.max(0,Number(params.get('step'))||0),visualToken=0;const slot=()=>`week3-centers-${dayName.toLowerCase()}-${i}`+(items[i]?.steps?`-step-${step}`:'');async function applyVisual(d){const token=++visualToken;let src='';try{await EEAVisualStore.migrate();src=await EEAVisualStore.get(slot())}catch(e){}if(token!==visualToken)return;$('pic').src=src||d.steps?.[step]?.img||d.img;$('restoreVisual').style.display=src?'inline-block':'none'}function render(){const d=items[i],s=d.steps?.[step];$('pic').src=d.steps?.[step]?.img||d.img;applyVisual(d);$('title').textContent=s?.title||d.title;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker+(d.steps?` · STEP ${step+1}/${d.steps.length}`:'');$('prompt').textContent=s?.prompt||d.prompt;$('cue').textContent=s?.cue||d.cue;$('noteTitle').textContent=s?.title||d.title;$('notes').textContent=(s?.script||'')+(d.teacherNote?'\n\n'+d.teacherNote:'')||(d.revisit?'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Review Original Introduction if the group needs the full teaching sequence.':'');$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='FOCUS ON 3s · WEEK 3 · '+dayName.toUpperCase();$('review').style.display=d.revisit?'inline-block':'none';$('doneBtn').textContent=d.steps&&step<d.steps.length-1?'Next Step →':i<items.length-1?'Next Center →':'Done ✓';$('panel').classList.remove('open')}function back(){location.href='daily-lessons.html?week=3&day='+Math.max(0,['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(dayName))}$('back').onclick=back;$('doneBtn').onclick=()=>{const d=items[i];if(d.steps&&step<d.steps.length-1){step++;render()}else if(i<items.length-1){i++;step=0;render()}else if(!runner)back()};$('teacherBtn').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('review').onclick=()=>{const d=items[i];if(d.revisit)location.href='week3-intro-centers.html?day='+d.revisit.day+'&item='+d.revisit.item+'&review=1'};$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);q.set('item',String(i));q.set('step',String(step));const backUrl='week3-intro-centers.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(backUrl)};$('restoreVisual').onclick=async()=>{try{await EEAVisualStore.remove(slot())}catch(e){}applyVisual(items[i])};render()})();</script></body></html>
