<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Intro to Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.3vh 4.8vw;display:grid;grid-template-columns:46% 1fr;gap:4.5vw;align-items:center}.visual{height:60vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;padding:3vh 2vw}.visual img{max-width:92%;max-height:55vh;object-fit:contain;border-radius:22px}.small{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px)}.content h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.sub{font-size:clamp(20px,1.35vw,27px);color:#527673;font-weight:900}.prompt{margin-top:2vh;padding:1.5vh 1.4vw;border-radius:19px;background:#e7f0ed;color:#416d61;font-size:clamp(21px,1.5vw,29px);font-weight:900;line-height:1.3}.reminder{margin-top:1.5vh;color:#557876;font-size:clamp(17px,1.12vw,22px);font-weight:850;line-height:1.4}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.next,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.teacher{background:#fffdf8;color:#245c78}.next,.done{background:#668f99;color:white;border-color:#668f99}.done{position:absolute;right:3.2vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(530px,37vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.45;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · INTRO TO CENTERS</div><h1>Today in Centers</h1></div><div class="actions"><div class="chip" id="chip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="visual"><img id="art" alt="Center visual"></div><div class="content"><div class="small" id="small"></div><h2 id="title"></h2><div class="sub" id="sub"></div><div class="prompt" id="prompt"></div><div class="reminder" id="reminder"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Notes</button><button class="next" id="next" style="display:none">Next Center →</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS / VOCABULARY</div><p id="materials"></p></aside></main><script>(()=>{const all={Monday:[{title:'Dressing Up',sub:'Dramatic Play',img:'assets/dramatic-play.webp',small:'NEW CENTER EXPERIENCE',prompt:'What would you like to pretend to be?',reminder:'Use fabric and clothespins to create an outfit and use your imagination.',notes:'Connect to What Riley Wore. Invite children to notice Riley’s different outfits and how Riley uses imagination. Introduce fabric and clothespins as open-ended dress-up materials and model how children can use them to create outfits and pretend.',materials:'Fabric · clothespins · imagination · outfit · pretend'},{title:'Retelling Stories',sub:'Library & Listening',img:'assets/reading.webp',small:'NEW CENTER EXPERIENCE',prompt:'Which story would you like to tell again?',reminder:'Choose a familiar book and use the character puppets to retell what happened.',notes:'Introduce retelling familiar Read Alouds with character puppets. Model choosing a familiar book, identifying its characters, and using the puppets to act out or retell events from the story.',materials:'Familiar Read Aloud book · character puppets · character · retell'}],Tuesday:[{title:'Being Scientists',sub:'Science & Engineering',img:'assets/science.webp',small:'NEW CENTER EXPERIENCE',prompt:'What might you discover when you look closely?',reminder:'Scientists use their senses and tools to notice and observe.',notes:'Open Science & Engineering by introducing the idea that scientists notice phenomena in the world and observe closely. Review the five senses and demonstrate tools children can use to investigate natural materials.',materials:'5 Senses visual · Portrait of a Scientist: Entomologist · natural materials · magnifying lens · eye dropper · observe · phenomenon · scientist · senses · tool'},{title:'Making Lines',sub:'Writing & Drawing',img:'assets/art.webp',small:'NEW CENTER EXPERIENCE',prompt:'What kinds of lines can you make?',reminder:'Try straight, curved, squiggly, thick, and thin lines to show your ideas.',notes:'Introduce Writing & Drawing as a place to communicate ideas using pictures, letters, words, marks, and lines. Demonstrate several kinds of lines with different drawing tools and paper sizes.',materials:'Different sizes of paper · drawing tools · curved · squiggle · straight · thick · thin'}],Wednesday:[{title:'Feeling Masks',sub:'Art Studio',img:'assets/art.webp',small:'NEW CENTER EXPERIENCE',prompt:'What feeling will your mask show?',reminder:'Choose a feeling, then make the eyes and mouth show how that feeling looks.',notes:'Connect to Katie’s changing feelings in Sometimes I’m Bombaloo and the illustrator’s representation of Katie’s angry face. Invite children to choose a feeling and create a mask that represents it.',materials:'Sometimes I’m Bombaloo · photos of children making feeling faces · mask-making materials · popsicle sticks · mask · feelings'}],Thursday:[{title:'Amazing Buildings',sub:'Blocks',img:'assets/blocks.webp',small:'NEW CENTER EXPERIENCE',prompt:'How can you make your building strong and stable?',reminder:'Balance the blocks carefully. If it falls, try again and keep building.',notes:'Connect to Taylor’s block structure in The Rabbit Listened. Notice how the blocks are placed and invite children to experiment with balance and stability as they create their own amazing buildings.',materials:'The Rabbit Listened · Building Neighborhoods visuals · unit blocks · amazing · build · building · balance · stable'}],Friday:[{title:'Continue Centers',sub:'No new center today',img:'assets/reading.webp',small:'REVISIT & CONTINUE',prompt:'Which center would you like to keep exploring?',reminder:'Return to an idea from this week and keep working, wondering, pretending, or creating.',notes:'There is no new Center introduction today. Briefly revisit the week’s Center experiences and invite children to return to an experience they want to continue or deepen.',materials:'No new materials required for Intro to Centers'}]};const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',target='week3-plan.html',items=all[day]||all.Monday;let i=0;const $=id=>document.getElementById(id);function render(){const d=items[i];$('chip').textContent='WEEK 3 · '+day.toUpperCase()+` · ${i+1}/${items.length}`;$('art').src=d.img;$('small').textContent=d.small;$('title').textContent=d.title;$('sub').textContent=d.sub;$('prompt').textContent=d.prompt;$('reminder').textContent=d.reminder;$('noteTitle').textContent=d.title;$('notes').textContent=d.notes;$('materials').textContent=d.materials;$('next').style.display=i<items.length-1?'inline-block':'none';$('done').style.display=i===items.length-1?'inline-block':'none';$('panel').classList.remove('open')}$('next').onclick=()=>{if(i<items.length-1){i++;render()}};$('done').onclick=$('exit').onclick=()=>location.href=target;$('teacher').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');render()})();</script></body></html>
