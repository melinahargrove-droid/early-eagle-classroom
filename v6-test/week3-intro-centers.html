<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Intro to Centers</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:#174f76}body{background:linear-gradient(180deg,#fbf8ee,#edf4ef)}.page{min-height:100vh;padding:18px 26px}.top{max-width:1420px;margin:auto;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:#789697}.top h1{margin:3px 0;color:#165487;font-size:38px}.sub{font-weight:900;color:#55747b}.right{display:flex;gap:9px;align-items:center}.chip{padding:8px 14px;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.close{width:48px;height:48px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:25px;font-weight:900;cursor:pointer}.days{max-width:1420px;margin:12px auto;display:flex;justify-content:center;gap:7px}.days button{border:1px solid #cadbdd;border-radius:999px;background:#fffdf8;padding:8px 18px;color:#52717a;font-weight:900;cursor:pointer}.days button.active{background:#6f9ead;color:white}.card{max-width:1420px;margin:auto;background:#fffdf8;border:1.5px solid #c9dadd;border-radius:26px;box-shadow:0 14px 34px rgba(65,92,96,.09);overflow:hidden}.hero{padding:20px 28px 15px;border-bottom:1px solid #e3e9e6;background:linear-gradient(90deg,#f7fbf8,#fffdf8)}.hero h2{margin:0;color:#165487;font-size:31px}.hero p{margin:5px 0 0;color:#55747b;font-weight:800}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;padding:18px}.box{border:1px solid #dce6e2;border-radius:20px;padding:17px 19px;background:#fff}.box h3{margin:0 0 9px;color:#315f70;font-size:20px}.box p,.box li{font-size:16px;line-height:1.45;color:#506f70;font-weight:700}.box ul{margin:6px 0;padding-left:21px}.say{background:#e9f3ef;border-color:#cfe1da}.say p{font-size:19px;color:#315f70}.materials{background:#f8f3e7}.vocab{background:#eef4fa}.word{display:inline-block;margin:4px 5px 4px 0;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid #d6e2e4;color:#315f70;font-weight:900}.prompt{background:#fff3d5;border-color:#ead8a6}.footer{max-width:1420px;margin:12px auto;text-align:center}.done{border:0;border-radius:999px;background:#668f99;color:#fff;font-weight:900;padding:11px 28px;cursor:pointer;font-size:15px}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.right{flex-wrap:wrap;justify-content:flex-end}}</style></head><body><main class="page"><header class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · INTRO TO CENTERS</div><h1>Intro to Centers</h1><div class="sub" id="daySub"></div></div><div class="right"><div class="chip" id="chip"></div><button class="close" id="back">×</button></div></header><nav class="days" id="days"></nav><section class="card"><div class="hero"><h2 id="title"></h2><p id="purpose"></p></div><div class="grid"><section class="box say"><h3>💬 Introduce It</h3><div id="intro"></div></section><section class="box materials"><h3>🧺 Bring to the Meeting</h3><ul id="materials"></ul></section><section class="box vocab"><h3>💡 Words to Use</h3><div id="vocab"></div></section><section class="box prompt"><h3>👀 Show & Ask</h3><ul id="prompts"></ul></section></div></section><div class="footer"><button class="done" id="done">Done ✓</button></div></main><script>(()=>{const names=['Monday','Tuesday','Wednesday','Thursday','Friday'];const q=new URLSearchParams(location.search);let day=q.get('day')||'Monday';const data={Monday:{title:'Dramatic Play: Dressing Up + Library & Listening: Retelling Stories',purpose:'Introduce two new ways children can use imagination and familiar stories during Centers.',intro:[`In <i>What Riley Wore</i>, Riley chooses different outfits and uses imagination. This week in Dramatic Play, you can use fabric and clothespins to dress up and pretend, too.`,`In Library & Listening, you can choose a book we have read and use its character puppets to retell the story.`],materials:['A piece of fabric and a few clothespins','One familiar Read Aloud book and its character puppets'],vocab:['fabric','imagination','outfit','pretend','character','retell'],prompts:['What do you notice about Riley’s outfits?','What would you like to pretend to be?','What is happening with the character here?','Which book might you retell today?']},Tuesday:{title:'Science & Engineering: Being Scientists + Writing & Drawing: Making Lines',purpose:'Open Science & Engineering and introduce careful observation; introduce Writing & Drawing as a place to communicate ideas with marks and lines.',intro:[`This week we are opening Science and Engineering. Scientists notice things happening in the world and observe closely using their senses and tools.`,`At Writing & Drawing, you can make pictures, letters, words, and many different kinds of lines to show your ideas.`],materials:['5 Senses visual','Portrait of a Scientist: Entomologist','Two bins of natural materials','Magnifying lens and eye dropper','Different sizes of paper and several drawing tools'],vocab:['observe','phenomenon','scientist','senses','tool','curved','squiggle','straight','thick','thin'],prompts:['Can you name your five senses?','What do you think this scientist is doing?','What might you discover using these tools?','What other kinds of lines could I make?']},Wednesday:{title:'Art Studio: Feeling Masks',purpose:'Connect Katie’s changing feelings in Sometimes I’m Bombaloo to creating a mask that represents a feeling.',intro:[`Katie has many different feelings in <i>Sometimes I’m Bombaloo</i>. The illustrator even shows Katie’s angry face like a monster mask.`,`Starting today in Art Studio, you can make your own mask that shows a feeling. Choose a feeling, choose your materials, and decide how the face will show that feeling.`],materials:[`<i>Sometimes I’m Bombaloo</i> with the relevant pages ready`,`Photos of children making different feeling faces`,`A selection of mask-making materials and popsicle sticks`],vocab:['mask','feelings','angry','happy','sad','frustrated'],prompts:['What other feelings does Katie have during the story?','What feeling will your mask show?','What will the eyes and mouth look like?','Which materials will you choose?']},Thursday:{title:'Blocks: Amazing Buildings',purpose:'Extend children’s block exploration by connecting Taylor’s sturdy structure to balance and stability.',intro:[`In <i>The Rabbit Listened</i>, Taylor carefully places blocks to make a sturdy structure, then adds more blocks on top.`,`Today you can use the blocks to make your own amazing buildings. If a building falls, you can try again and help each other.`],materials:[`<i>The Rabbit Listened</i> with Taylor’s building pages ready`,`Building Neighborhoods visuals`,`A few unit blocks for demonstrating`],vocab:['amazing','build','building','balance','stable'],prompts:['What do you notice about how Taylor placed the blocks?','What could make a building stable?','How can you balance blocks on top?','What will make your building amazing?']},Friday:{title:'Continue Centers',purpose:'No new Center is introduced today. Children revisit and deepen the Center experiences introduced earlier in the week.',intro:[`Today there is no new Center lesson. Briefly remind children of this week’s choices and invite them to return to an experience they want to continue.`],materials:['No new materials required for Intro to Centers'],vocab:[],prompts:['Which Center would you like to revisit today?','What idea do you want to keep working on?','How can you help or share ideas with a friend?']}};function render(){const d=data[day];daySub.textContent=day+' • Week 3';chip.textContent='WEEK 3 · '+day.toUpperCase();title.textContent=d.title;purpose.textContent=d.purpose;days.innerHTML=names.map(n=>`<button data-day="${n}" class="${n===day?'active':''}">${n}</button>`).join('');intro.innerHTML=d.intro.map(x=>`<p>${x}</p>`).join('');materials.innerHTML=d.materials.map(x=>`<li>${x}</li>`).join('');vocab.innerHTML=d.vocab.length?d.vocab.map(x=>`<span class="word">${x}</span>`).join(''):'<p>No new vocabulary today.</p>';prompts.innerHTML=d.prompts.map(x=>`<li>${x}</li>`).join('')}document.addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(b){day=b.dataset.day;render()}});back.onclick=done.onclick=()=>location.href='week3-plan.html';render()})();</script></body></html>
