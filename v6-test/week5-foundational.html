<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 5 Foundational Literacy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:4vh 6vw}.card{height:80vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;padding:5vh 6vw;display:grid;grid-template-columns:34% 1fr;gap:5vw;align-items:center}.visual{height:52vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;text-align:center;font-size:60px;font-weight:900;color:#527673;white-space:pre-line}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:55px;margin:1vh 0;color:#164f7f}.lead{font-size:24px;font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh}.step{background:#e7f0ed;border-radius:16px;padding:1.1vh 1vw;font-size:18px;font-weight:900;color:#416d61}.bottom{text-align:center;margin-top:2vh}.bottom button{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 24px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button onclick="location.href='week5-plan.html'">Done ✓</button></div></main><script>const d={Monday:{title:'Letter ID: Ll, Oo',visual:'L l\nO o',lead:'Listen for /l/ and /ŏ/, then connect each sound with its printed letter.',steps:['Say the alphabet while tracking the alphabet poster. Review beginning sounds from M and A.','Listen to: “Luis likes to listen and laugh at the library.” What sound repeats? /l/','Listen to: “The odd octopus swims to the otter to play.” What sound repeats? /ŏ/','Introduce Ll: L, lamp, /l/. Introduce Oo: O, octopus, /ŏ/. Notice how the mouth makes each sound.']},Tuesday:{title:'“Laugh” • Top to Bottom',visual:'TOP\n↓\nBOTTOM',lead:'When we begin reading, we start at the top of the page.',steps:['Display the curriculum poem “Laugh” by Jen Bryant on chart paper.','Point to the top and title before reading.','Track the print from left to right on each line while reading from top to bottom.','Invite children to listen for words that sound like laughter, such as “tee-hee” and “haw-haw.”']},Wednesday:{title:'Letter ID: Ll, Oo',visual:'L l\nO o',lead:'Review Ll and Oo, then practice forming the letters in the air.',steps:['Say and repeat each letter name, picture, and sound.','Use two “magic fingers” and a straight arm to sky-write uppercase and lowercase L.','Sky-write uppercase and lowercase O with a continuous curve.','Reconnect formation to sound: L says /l/; O says /ŏ/.']},Thursday:{title:'“Laugh” • Top to Bottom',visual:'TOP\n↓\nBOTTOM',lead:'Return to the poem and practice where reading begins.',steps:['Show the poem “Laugh” again. Point to the bottom and top and ask where reading should begin.','Read from the top, tracking the print.','Listen again for the words that sound like laughter.']},Friday:{title:'Letter Review',visual:'M m  A a\nL l  O o',lead:'Review Mm, Aa, Ll, and Oo and use sound clues to guess words.',steps:['Say the alphabet while tracking the poster.','Review each Fundations card: letter name, picture, and sound.','Play the curriculum guessing game with clues for words beginning with the target sounds—such as ladybug, lemon, or octopus.']}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday;eye.textContent='FOUNDATIONAL LITERACY · WEEK 5 · '+day.toUpperCase();title.textContent=x.title;visual.textContent=x.visual;lead.textContent=x.lead;steps.innerHTML=x.steps.map(s=>'<div class="step">'+s+'</div>').join('');</script></body></html>
