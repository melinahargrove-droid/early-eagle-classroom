<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%)}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px);line-height:1}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:rgba(214,232,237,.8);color:#386d80;font-weight:900;font-size:clamp(12px,.82vw,16px)}.close{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#174f7d;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(92,136,147,.2);border-radius:34px;background:rgba(255,254,249,.94);box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:rgba(217,234,238,.8);color:#4f7c89;font-weight:900;letter-spacing:.06em;font-size:clamp(11px,.72vw,14px)}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.picture{width:min(36vw,600px);height:min(59vh,560px);object-fit:contain;border-radius:24px}.copy h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px);line-height:1}.eyebrow{color:#799597;font-size:clamp(12px,.8vw,15px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy p{margin:1.4vh 0;color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38;max-width:39vw}.step,.quote{margin-top:1.6vh;padding:1.2vh 1.4vw;border-radius:18px;background:#e8f1ed;color:#426f65;font-size:clamp(19px,1.35vw,27px);font-weight:900;line-height:1.3;max-width:39vw}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.6vh 1.35vw;font-weight:900;cursor:pointer}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 12px 30px rgba(44,67,68,.15);display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><div class="panel" id="panel"><b>Week 1 routine:</b> Practice Belly Breaths for about 30 seconds, invite children to share how they feel about starting school, then play Name Ball with a soft ball. Echo each child’s name in the same way the child communicates it.</div></main><script>(()=>{const params=new URLSearchParams(location.search),day=params.get('day')||'Monday',target=params.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html';const cards=[{label:'MINDFUL PRACTICE',pic:'../community/belly-breaths-visual.jpg',eye:'Belly Breaths',title:'Breathe In & Out',body:'Put one hand on your belly. Breathe in slowly… then breathe out slowly.',extra:'<div class="step">In… 1 · 2 · 3 &nbsp;&nbsp; Out… 1 · 2 · 3</div>'},{label:'CONVERSATION',pic:'../community/school-feelings-visual.jpg',eye:'How Are You Feeling?',title:'Starting School',body:'Think about how you feel about starting school this year.',extra:'<div class="quote">How do you feel about starting school?</div>'},{label:'GAME',pic:'../community/name-ball-visual.jpg',eye:'Name Ball',title:'Say Your Name',body:'When the ball comes to you, tell us your name. Then we will say it back!',extra:'<div class="step">Gentle tosses · listen to each friend · echo the name</div>'}];let i=0;const $=id=>document.getElementById(id);function render(){$('weekLabel').textContent='WEEK 1 · '+day.toUpperCase();$('cards').innerHTML=cards.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><img class="picture" src="${c.pic}" alt=""></div><div class="copy"><div class="eyebrow">${c.eye}</div><h2>${c.title}</h2><p>${c.body}</p>${c.extra}</div></article>`).join('');$('badge').textContent=cards[i].label+' · '+(i+1)+' OF '+cards.length;$('dots').innerHTML=cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');$('prev').disabled=i===0;$('next').textContent=i===cards.length-1?'Done ✓':'Next →'}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<cards.length-1){i++;render()}else location.href=target};$('closeBtn').onclick=()=>location.href=target;$('teacher').onclick=()=>$('panel').classList.toggle('open');render()})();</script></body></html>
