<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:2vh 1.4vw 1.5vh;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:8.5vh;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(85,135,150,.18)}.meta{color:#648b91;font-weight:900;letter-spacing:.1em;font-size:clamp(10px,.72vw,14px)}h1{margin:.4vh 0 0;color:#164f7f;font-size:clamp(22px,1.7vw,34px)}.actions{display:flex;gap:.7vw;align-items:center}.chip,.iconbtn,.notesbtn{border:1px solid rgba(82,128,142,.16);background:rgba(255,253,247,.92);color:#245c82;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(61,85,82,.05)}.chip{padding:.75vh 1.1vw;border-radius:15px;background:rgba(215,234,239,.8)}.iconbtn{width:clamp(42px,2.8vw,54px);aspect-ratio:1;border-radius:50%;font-size:clamp(18px,1.3vw,25px)}.stage{position:relative;height:78vh;margin-top:1.2vh;border:1.5px solid rgba(89,139,151,.24);border-radius:27px;background:rgba(255,254,249,.9);display:flex;align-items:center;justify-content:center;overflow:hidden}.notesbtn{position:absolute;right:1.2vw;top:1.2vh;padding:.8vh 1vw;border-radius:14px;background:rgba(211,233,240,.9);z-index:3}.card{width:86%;height:78%;border-radius:30px;border:1.5px solid rgba(96,140,145,.18);background:radial-gradient(circle at 50% 18%,rgba(255,255,251,.96),rgba(224,236,233,.7) 65%,rgba(249,244,232,.84));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 5vw;box-shadow:0 10px 28px rgba(62,88,86,.06);transition:opacity .14s,transform .14s}.card.switching{opacity:.18;transform:scale(.988)}.visual{width:clamp(125px,9vw,175px);aspect-ratio:1;border-radius:50%;background:rgba(255,253,247,.82);display:flex;align-items:center;justify-content:center;font-size:clamp(66px,5vw,96px);box-shadow:0 5px 16px rgba(76,105,102,.06)}.card h2{margin:2vh 0 .6vh;color:#315f70;font-size:clamp(32px,2.6vw,50px);line-height:1.08}.copy{color:#587875;font-weight:800;font-size:clamp(19px,1.35vw,26px);line-height:1.42;max-width:65vw}.step{margin-top:1.8vh;padding:.5vh .9vw;border-radius:999px;background:rgba(118,155,159,.12);color:#78908e;font-weight:900;font-size:clamp(10px,.72vw,14px);letter-spacing:.05em}.card.cover-card{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:5vw;align-items:center;text-align:left;padding:4vh 7vw;background:radial-gradient(circle at 72% 25%,rgba(222,238,235,.72),rgba(255,253,247,.94) 52%,rgba(248,242,230,.86))}.cover-wrap{height:58vh;max-height:610px;display:flex;align-items:center;justify-content:center}.cover-wrap img{max-height:100%;max-width:100%;object-fit:contain;border-radius:8px;box-shadow:0 16px 32px rgba(51,64,67,.18)}.cover-info{display:flex;flex-direction:column;align-items:flex-start}.cover-kicker{color:#719298;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.cover-info h2{margin:1.2vh 0 .8vh;font-size:clamp(38px,3vw,58px);color:#164f7f}.cover-byline{color:#527678;font-size:clamp(16px,1.05vw,21px);font-weight:800;line-height:1.5}.cover-question{margin-top:3vh;padding:1.4vh 1.4vw;border-radius:18px;background:rgba(216,234,237,.62);color:#4f765e;font-size:clamp(21px,1.5vw,29px);font-weight:900}.cover-card .step{justify-self:start}.footer{height:8vh;display:grid;grid-template-columns:15% 1fr 15%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:16px;padding:1.1vh 1.2vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.prev{background:rgba(255,253,247,.94);color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:rgba(177,214,230,.5);overflow:hidden;margin-top:.65vh}.fill{height:100%;background:#6ea6c2;border-radius:999px;transition:width .2s}.panel{position:absolute;right:1.2vw;top:7vh;width:min(430px,32vw);padding:1.5vh 1.2vw;border-radius:20px;background:rgba(255,253,247,.98);border:1.4px solid rgba(83,120,128,.18);box-shadow:0 12px 28px rgba(44,67,68,.14);z-index:5;display:none}.panel.open{display:block}.panel h3{margin:.2vh 0 .5vh;color:#315f70}.panel p{margin:.3vh 0 1.1vh;color:#58716f;font-weight:700;line-height:1.4}.label{color:#7b9899;font-weight:900;font-size:12px;letter-spacing:.06em}</style></head><body><main class="page"><header><div><div class="meta">READ ALOUD · UNIT 1 · WEEK 1</div><h1>Lola Goes to School · Read 1 of 3</h1></div><div class="actions"><div class="chip">Monday</div><button class="iconbtn" id="backBtn">←</button><button class="iconbtn" onclick="location.href='index.html'">⌂</button></div></header><section class="stage"><button class="notesbtn" id="notesBtn">Teacher Notes</button><div class="card" id="card"><div class="visual" id="visual"></div><h2 id="title"></h2><div class="copy" id="copy"></div><div class="step" id="step"></div></div><aside class="panel" id="panel"><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">VOCABULARY</div><p id="vocab"></p><div class="label">MATERIALS / PAGE</div><p id="materials"></p></aside></section><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const coverUrl='https://cdn.amightygirl.com/catalog/product/cache/1/image/9df78eab33525d08d6e5fb8d27136e95/l/o/lola_goes_to_school.jpg';const cards=[{title:'Lola Goes to School',icon:'▤',copy:'Read 1 of 3 · What’s the story about?',materials:'Lola Goes to School',notes:'Objectives: ask and answer questions about a story read aloud; make connections between the story and children’s own experiences.',vocab:'decide · exhausting · jumping pants · motion · visit · welcome'},{title:'Before Reading',icon:'♥',copy:'Together in Our Community is about friends, family, school, and you. Every day we will read together and talk about what we read.',materials:'Lola Goes to School',notes:'Introduce the book. Anna McQuinn is the author; Rosalind Beardshaw is the illustrator. Connect to children’s ideas about starting school.',vocab:'—'},{title:'Quick Word: Jumping Pants',icon:'↟',copy:'“Jumping pants” are pants you can jump and play in!',materials:'Lola Goes to School · page 6',notes:'Pause briefly at page 6 for the vocabulary explanation. Keep it quick and playful.',vocab:'jumping pants — pants to jump and play in'},{title:'Getting Ready for School',icon:'✓',copy:'What are some things Lola does to get ready for school? Show a thumb up if you did any of those things today!',materials:'Lola Goes to School · page 10',notes:'Model the connection with a thumb up, then invite children to connect Lola’s preparations to their own morning.',vocab:'—'},{title:'What Happens at School?',icon:'?',copy:'We have read over half of the book! What are some things Lola does at school?',materials:'Lola Goes to School · page 17',notes:'Invite a couple of responses, then continue reading.',vocab:'—'},{title:'Show “Exhausting”',icon:'☾',copy:'Show shoulders slumping and eyes closing.',materials:'Lola Goes to School · page 25',notes:'Use the gesture to support the meaning of exhausting.',vocab:'exhausting — taking a lot of energy; making a person very, very tired'}];const key='eea-daily-lessons-u1-w1-0';let step=0;try{const s=JSON.parse(localStorage.getItem(key));if(Number.isInteger(s?.raStep))step=Math.max(0,Math.min(cards.length-1,s.raStep))}catch(e){}const $=id=>document.getElementById(id);function save(markDone=false){let s={current:1,done:[],raStep:step};try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}s.current=1;s.raStep=step;if(markDone&&!s.done.includes(1))s.done.push(1);localStorage.setItem(key,JSON.stringify(s))}function render(){const c=cards[step],card=$('card');card.classList.toggle('cover-card',step===0);if(step===0){card.innerHTML=`<div class="cover-wrap"><img src="${coverUrl}" alt="Lola Goes to School book cover"></div><div class="cover-info"><div class="cover-kicker">TODAY’S BOOK · READ 1</div><h2>Lola Goes to School</h2><div class="cover-byline">Written by Anna McQuinn<br>Illustrated by Rosalind Beardshaw</div><div class="cover-question">What do you notice on the cover?</div><div class="step" id="step">READ 1 · 1 OF ${cards.length}</div></div>`}else{card.innerHTML=`<div class="visual" id="visual">${c.icon}</div><h2 id="title">${c.title}</h2><div class="copy" id="copy">${c.copy}</div><div class="step" id="step">READ 1 · ${step+1} OF ${cards.length}</div>`}$('count').textContent=`${step+1} of ${cards.length}`;$('fill').style.width=`${((step+1)/cards.length)*100}%`;$('noteTitle').textContent=c.title;$('notes').textContent=c.notes;$('vocab').textContent=c.vocab;$('materials').textContent=c.materials;$('prev').disabled=step===0;$('next').textContent=step===cards.length-1?'Finish Read Aloud ✓':'Next →';save()}function move(n){$('card').classList.add('switching');setTimeout(()=>{step+=n;render();$('card').classList.remove('switching')},120)}$('prev').onclick=()=>{if(step>0)move(-1)};$('next').onclick=()=>{if(step<cards.length-1)move(1);else{save(true);location.href='daily-lessons.html'}};$('backBtn').onclick=()=>{save();location.href='daily-lessons.html'};$('notesBtn').onclick=()=>{$('panel').classList.toggle('open')};render()})();</script></body></html>
