<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Clean Up Song</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}.video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.close{position:absolute;z-index:40;top:2vh;right:2vw;width:clamp(50px,3.6vw,70px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(54,85,107,.26);background:rgba(255,252,244,.95);color:#173f72;font-size:clamp(28px,2vw,38px);font-weight:900;cursor:pointer}.playback{position:absolute;z-index:45;right:2vw;top:10.5vh;display:flex;gap:8px}.playback button,.cal button{border:0;border-radius:999px;padding:9px 13px;background:#dfeaf1;color:#173f72;font-weight:900;cursor:pointer}.playback .primary,.cal .primary{background:#173f72;color:#fff}.lyric-wrap{position:absolute;z-index:30;left:50%;bottom:11vh;transform:translateX(-50%);width:min(82vw,1570px);min-height:12vh;display:flex;align-items:center;justify-content:center;padding:1.2vh 3vw;border-radius:30px;background:rgba(255,249,235,.95);pointer-events:none}.lyric{font-size:clamp(30px,2.75vw,54px);font-weight:900;text-align:center}.cal{position:absolute;z-index:60;left:2vw;top:2vh;width:min(420px,42vw);background:rgba(255,249,235,.98);border-radius:22px;padding:0 16px 14px}.cal-head{margin:0 -16px 12px;padding:12px 16px;border-radius:22px 22px 0 0;background:#dfeaf1;font-size:19px;font-weight:900;cursor:grab;touch-action:none}.cal-line{font-size:14px;font-weight:900;min-height:42px}.cal-time{font-size:13px;margin:6px 0 10px}.cal-buttons{display:flex;gap:7px;flex-wrap:wrap}.cal small{display:block;margin-top:9px}.start-overlay{position:absolute;z-index:35;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18);pointer-events:none}.start-overlay button{pointer-events:auto;border:0;border-radius:999px;padding:18px 30px;background:#fff9eb;color:#173f72;font-size:clamp(22px,2vw,36px);font-weight:900}.audio-status{position:absolute;z-index:46;right:2vw;top:16.5vh;background:#fff9eb;color:#173f72;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:900}.hidden{display:none}</style></head><body><main class="stage"><video id="video" class="video" controls playsinline preload="metadata" muted><source src="assets/EEA-Clean-Up-Song-web.mp4" type="video/mp4"></video><audio id="audio" preload="metadata"><source src="assets/Circle%20Time.mp3" type="audio/mpeg"></audio><div class="start-overlay" id="start-overlay"><button id="start-play">▶ Play Clean Up Song WITH SOUND</button></div><button class="close" onclick="location.href='index.html'">×</button><div class="playback"><button id="play-pause" class="primary">▶ Play</button><button id="sound">🔊 Sound On</button><button id="restart-video">↺ Restart</button></div><div class="audio-status" id="audio-status">MP3 audio ready</div><section class="lyric-wrap"><div class="lyric" id="lyric"></div></section><aside class="cal" id="cal"><div class="cal-head" id="cal-head">Lyric Timing Controls ↔ drag me</div><div class="cal-line" id="cal-line"></div><div class="cal-time">Cue: <strong id="cue-time"></strong> | Video: <strong id="video-time">0.00</strong></div><div class="cal-buttons"><button id="prev">Previous lyric</button><button id="next">Next lyric</button><button id="minus1">−1 sec</button><button id="plus1">+1 sec</button><button id="minus025">−0.25</button><button id="plus025">+0.25</button><button id="jump" class="primary">Jump to cue</button><button id="shiftAllMinus">All −1 sec</button><button id="shiftAllPlus">All +1 sec</button><button id="hide">Hide controls</button></div><small>First-pass timing. Adjust each cue until the lyric lands correctly.</small></aside></main><script>(()=>{const v=document.getElementById('video'),a=document.getElementById('audio'),ly=document.getElementById('lyric'),ov=document.getElementById('start-overlay'),pp=document.getElementById('play-pause'),sb=document.getElementById('sound'),st=document.getElementById('audio-status');const lines=["Listen to the song, it's time to go,","Clean up, clean up, now you know!","Put the toys away, put them in their place,","Put the toys away, put them in their place,","Pick them up and clean up fast,","Make it fun, make it last!","Put the toys away, put them in their place,","Put the toys away, put them in their place,","Pick them up and clean up fast,","Make it fun, make it last!","When the cleaning is all done,","Gather 'round, it's time for fun!","Come and sit in Circle Time,","Learning songs and nursery rhyme!","Find your spot and sit down slow,","Hands in your lap, ready to go.","Quiet bodies, listening ears,","Circle Time is finally here!"];const d=[0,10,21,32,43,53,64,75,86,96,107,118,129,140,151,161,172,182];let c;try{c=JSON.parse(localStorage.getItem('eeaCleanupLyricCues'))||d.slice()}catch(e){c=d.slice()}if(!Array.isArray(c)||c.length!==lines.length)c=d.slice();let s=0;const save=()=>localStorage.setItem('eeaCleanupLyricCues',JSON.stringify(c));function idx(t){let x=0;for(let i=0;i<c.length;i++){if(t>=c[i])x=i;else break}return x}function rl(){ly.textContent=lines[idx(v.currentTime||0)];document.getElementById('video-time').textContent=(v.currentTime||0).toFixed(2)}function rc(){document.getElementById('cal-line').textContent=(s+1)+'. '+lines[s];document.getElementById('cue-time').textContent=c[s].toFixed(2)+' sec'}function adj(x){c[s]=Math.max(0,+(c[s]+x).toFixed(2));if(s>0)c[s]=Math.max(c[s],c[s-1]+.05);if(s<c.length-1)c[s]=Math.min(c[s],c[s+1]-.05);save();rc();rl()}function shift(x){c=c.map(q=>Math.max(0,+(q+x).toFixed(2)));save();rc();rl()}function syncAudio(force=false){if(force||Math.abs(a.currentTime-v.currentTime)>.25)a.currentTime=v.currentTime}function label(){pp.textContent=v.paused?'▶ Play':'❚❚ Pause'}async function play(){try{syncAudio(true);a.muted=false;a.volume=1;await a.play();await v.play();ov.style.display='none';st.textContent='MP3 audio: PLAYING • 100%';label()}catch(e){ov.style.display='flex';st.textContent='Tap Play again to allow MP3 audio'}}function pause(){v.pause();a.pause();label()}v.addEventListener('timeupdate',()=>{rl();syncAudio(false)});v.addEventListener('seeked',()=>{syncAudio(true);rl()});v.addEventListener('play',()=>{if(a.paused){syncAudio(true);a.play().catch(()=>{})}ov.style.display='none';label()});v.addEventListener('pause',()=>{a.pause();label()});v.addEventListener('ended',()=>{a.pause();label()});a.addEventListener('play',()=>st.textContent='MP3 audio: PLAYING • '+Math.round(a.volume*100)+'%');a.addEventListener('error',()=>st.textContent='MP3 audio failed to load');document.getElementById('start-play').onclick=play;pp.onclick=()=>v.paused?play():pause();sb.onclick=()=>{a.muted=false;a.volume=1;st.textContent='MP3 audio: ON • 100%';if(v.paused)play()};document.getElementById('restart-video').onclick=()=>{v.currentTime=0;a.currentTime=0;play()};document.getElementById('prev').onclick=()=>{s=Math.max(0,s-1);rc()};document.getElementById('next').onclick=()=>{s=Math.min(lines.length-1,s+1);rc()};document.getElementById('minus1').onclick=()=>adj(-1);document.getElementById('plus1').onclick=()=>adj(1);document.getElementById('minus025').onclick=()=>adj(-.25);document.getElementById('plus025').onclick=()=>adj(.25);document.getElementById('jump').onclick=()=>{v.currentTime=c[s];a.currentTime=c[s];play()};document.getElementById('shiftAllMinus').onclick=()=>shift(-1);document.getElementById('shiftAllPlus').onclick=()=>shift(1);document.getElementById('hide').onclick=()=>document.getElementById('cal').classList.add('hidden');const box=document.getElementById('cal'),h=document.getElementById('cal-head');let drag=false,dx=0,dy=0;h.onpointerdown=e=>{drag=true;h.setPointerCapture(e.pointerId);let r=box.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;box.style.left=r.left+'px';box.style.top=r.top+'px'};h.onpointermove=e=>{if(drag){box.style.left=Math.max(0,Math.min(innerWidth-box.offsetWidth,e.clientX-dx))+'px';box.style.top=Math.max(0,Math.min(innerHeight-50,e.clientY-dy))+'px'}};h.onpointerup=()=>drag=false;rc();rl();label()})();</script></body></html>
