<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Clean Up Time!</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#075b9e;background:#dfeaf1}.shell{width:100vw;height:100vh;padding:16px 24px 18px;background:radial-gradient(circle at 20% 12%,rgba(255,255,255,.55),transparent 30%),linear-gradient(#edf5ef,#e8f0df);border:5px solid #86b6cb;border-radius:42px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;position:relative}.title{text-align:center;font-size:clamp(42px,5vw,72px);font-weight:900;letter-spacing:.5px;line-height:1;margin-top:-2px}.close{position:absolute;right:26px;top:20px;width:64px;height:64px;border-radius:50%;border:0;background:#fffaf0;color:#075b9e;font-size:34px;box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer}.banner{justify-self:center;background:linear-gradient(#e6f6bd,#d4efa4);border:1px solid #b9d98e;border-radius:22px;padding:10px 30px;font-size:clamp(20px,2.1vw,32px);font-weight:700;font-style:italic;color:#4f7f42;box-shadow:0 3px 8px rgba(0,0,0,.06)}.content{display:grid;grid-template-columns:minmax(0,1.92fr) minmax(360px,1fr);gap:24px;min-height:0}.video-card,.lyrics-card{border:3px solid #9cc6d9;border-radius:30px;overflow:hidden;background:#fffdf7;position:relative;box-shadow:0 8px 20px rgba(63,101,122,.08)}.video-card{background:#000;display:flex;align-items:center;justify-content:center}.video-card video{width:100%;height:100%;object-fit:contain;background:#000}.lyrics-card{padding:24px 28px 26px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}.lyrics-head{justify-self:center;background:linear-gradient(#dff0fb,#cbe7f7);border-radius:28px;padding:14px 26px;font-size:clamp(18px,1.7vw,27px);font-weight:900;white-space:nowrap}.lyric-stage{display:flex;align-items:center;justify-content:center;text-align:center;padding:36px 24px}.lyric{font-size:clamp(32px,3vw,53px);line-height:1.18;font-weight:900;color:#075b9e;max-width:100%}.dots{text-align:center;font-size:22px;color:#a2b3bd;letter-spacing:9px;padding-bottom:2px}.controls{display:grid;grid-template-columns:auto auto auto auto 1fr auto;align-items:center;gap:11px;min-height:72px}.controls button{border:0;border-radius:20px;padding:16px 24px;font-size:clamp(18px,1.8vw,28px);font-weight:900;color:#fff;box-shadow:0 5px 10px rgba(0,0,0,.14);cursor:pointer;white-space:nowrap}.play{background:#88c52f}.pause{background:#f2b53d}.restart{background:#3b97c7}.rewind-menu{position:relative}.rewind-main{background:#fff8e7!important;color:#075b9e!important;box-shadow:0 3px 8px rgba(0,0,0,.09)!important;font-size:clamp(15px,1.3vw,20px)!important;padding:13px 16px!important}.rewind-options{position:absolute;left:0;bottom:calc(100% + 8px);display:none;gap:6px;background:rgba(255,250,240,.98);padding:8px;border-radius:16px;box-shadow:0 5px 14px rgba(0,0,0,.12);z-index:10}.rewind-menu.open .rewind-options{display:flex}.rewind-options button{background:#fff!important;color:#075b9e!important;box-shadow:none!important;font-size:15px!important;padding:9px 11px!important;border:1px solid #d5e2e8!important}.timeline{display:flex;align-items:center;gap:9px;min-width:0;color:#4c6b7d;font-size:16px;font-weight:800}.bar{flex:1;height:15px;border-radius:999px;background:#d4e2e8;overflow:hidden;cursor:pointer;min-width:100px}.fill{height:100%;width:0;background:#6fb3d1}.song-label{white-space:nowrap}.volume{display:flex;align-items:center;gap:8px;color:#4c6b7d}.volume input{width:120px}@media(max-width:1100px){.content{grid-template-columns:64% 36%;gap:14px}.lyrics-card{padding:18px}.lyric-stage{padding:20px 12px}.controls{gap:7px}.controls button{padding:13px 17px}.song-label{display:none}.volume input{width:90px}}@media(max-width:850px){.shell{border-radius:22px;padding:10px}.content{grid-template-columns:1fr;grid-template-rows:57% 43%;gap:8px}.title{font-size:38px}.banner{font-size:18px;padding:7px 16px}.lyrics-card{padding:12px}.lyrics-head{padding:8px 16px}.lyric{font-size:28px}.controls{grid-template-columns:repeat(4,auto) 1fr;min-height:55px}.volume{display:none}.controls button{padding:10px 12px;font-size:17px}}
</style></head><body><main class="shell"><button class="close" onclick="location.href='index.html'">×</button><div class="title">Clean Up Time!</div><div class="banner">Let's work together and make our classroom shine!</div><section class="content"><div class="video-card"><video id="video" playsinline preload="metadata" muted><source src="assets/Early%20Eagle%20Academy%20Clean%20Up%20Song.mp4" type="video/mp4"></video></div><aside class="lyrics-card"><div class="lyrics-head">♪ Sing &amp; Read Along ♫</div><div class="lyric-stage"><div class="lyric" id="lyric">Listen...<br>the clean-up song<br>is starting!</div></div><div class="dots">● ● ●</div></aside></section><footer class="controls"><button id="play" class="play">▶ Play</button><button id="pause" class="pause">Ⅱ Pause</button><button id="restart" class="restart">↻ Restart</button><div class="rewind-menu" id="rewind-menu"><button class="rewind-main" id="rewind-toggle">↶ Back ▴</button><div class="rewind-options"><button id="back5">5 sec</button><button id="back2">2 sec</button><button id="back1">1 sec</button></div></div><div class="timeline"><span id="current">0:00</span><div class="bar" id="bar"><div class="fill" id="fill"></div></div><span class="song-label">Clean Up Song</span><span id="duration">0:00</span></div><div class="volume">🔊 <input id="volume" type="range" min="0" max="1" step=".05" value=".85"></div></footer></main><audio id="audio" preload="auto" src="assets/Circle%20Time.mp3"></audio><script>
(()=>{const v=document.getElementById('video'),a=document.getElementById('audio'),lyric=document.getElementById('lyric'),fill=document.getElementById('fill'),cur=document.getElementById('current'),dur=document.getElementById('duration'),vol=document.getElementById('volume'),rewindMenu=document.getElementById('rewind-menu');const lines=["Listen... the clean-up song is starting!","When you hear the music start to play,","Stop your games and put things away,","Listen to the song, it's time to go,","Clean up, clean up, now you know!","Put the toys away, put them in their place,","Put the toys away, put them in their place,","Pick them up and clean up fast,","Make it fun, make it last!","Put the toys away, put them in their place,","Put the toys away, put them in their place,","Pick them up and clean up fast,","Make it fun, make it last!","When the cleaning is all done,","Gather 'round, it's time for fun!","Come and sit in Circle Time,","Learning songs and nursery rhyme!","Find your spot and sit down slow,","Hands in your lap, ready to go.","Quiet bodies, listening ears,","Circle Time is finally here!"];const cues=[0,4,12,20,28,38,48,58,68,78,88,98,108,120,132,144,154,164,174,184,190];function idx(t){let n=0;for(let i=0;i<cues.length;i++){if(t>=cues[i])n=i;else break}return n}function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function render(){const t=a.currentTime||0,d=a.duration||0,i=idx(t);lyric.textContent=lines[i]||'';cur.textContent=fmt(t);dur.textContent=fmt(d);fill.style.width=(d?Math.min(100,t/d*100):0)+'%'}function sync(force=false){if(force||Math.abs((v.currentTime||0)-(a.currentTime||0))>.25)v.currentTime=a.currentTime}async function start(){sync(true);a.volume=Number(vol.value);try{await a.play();v.play().catch(()=>{})}catch(e){}}function pause(){a.pause();v.pause()}function restart(){a.currentTime=0;v.currentTime=0;start()}function back(sec){const was=!a.paused;a.currentTime=Math.max(0,a.currentTime-sec);v.currentTime=a.currentTime;render();rewindMenu.classList.remove('open');if(was)start()}a.volume=.85;a.addEventListener('loadedmetadata',render);a.addEventListener('timeupdate',()=>{sync(false);render()});a.addEventListener('ended',pause);document.getElementById('play').onclick=start;document.getElementById('pause').onclick=pause;document.getElementById('restart').onclick=restart;document.getElementById('rewind-toggle').onclick=()=>rewindMenu.classList.toggle('open');document.getElementById('back5').onclick=()=>back(5);document.getElementById('back2').onclick=()=>back(2);document.getElementById('back1').onclick=()=>back(1);vol.oninput=()=>a.volume=Number(vol.value);document.getElementById('bar').onclick=e=>{if(!a.duration)return;const r=e.currentTarget.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration;v.currentTime=a.currentTime;render()};document.addEventListener('click',e=>{if(!rewindMenu.contains(e.target))rewindMenu.classList.remove('open')});render()})();
</script></body></html>
