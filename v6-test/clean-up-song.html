<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Clean Up Song</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#e9f0f2}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:
linear-gradient(180deg,rgba(245,249,247,.97),rgba(229,238,241,.96)),
url("https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png") center/cover no-repeat}
.close{position:absolute;z-index:30;top:2.1vh;right:2vw;width:clamp(48px,3.5vw,66px);aspect-ratio:1;border-radius:50%;border:1.4px solid rgba(67,99,118,.34);background:rgba(255,253,247,.94);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900;cursor:pointer}
.header{position:absolute;z-index:20;top:2.5vh;left:50%;transform:translateX(-50%);width:min(80vw,1450px);text-align:center}
h1{margin:0;font-size:clamp(44px,4.1vw,78px);line-height:1;color:#173f72;font-weight:900;text-shadow:0 2px 0 rgba(255,255,255,.75)}
.subtitle{margin-top:.8vh;font-size:clamp(18px,1.4vw,27px);color:#5c715d;font-weight:800}
.video-wrap{position:absolute;z-index:10;left:50%;top:15.2vh;transform:translateX(-50%);width:min(76vw,1460px);height:64vh;border-radius:34px;padding:clamp(10px,1vw,18px);background:rgba(255,252,244,.82);border:1.5px solid rgba(87,116,132,.22);box-shadow:0 12px 30px rgba(43,69,84,.12)}
.video-stage{position:relative;width:100%;height:100%;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#d9e8ec,#cbdde3);display:flex;align-items:center;justify-content:center}
.placeholder{width:88%;text-align:center;color:#45677b}
.placeholder .icon{font-size:clamp(74px,7vw,132px);line-height:1}
.placeholder strong{display:block;margin-top:1vh;font-size:clamp(28px,2.3vw,44px);color:#173f72}
.placeholder span{display:block;margin-top:.7vh;font-size:clamp(16px,1.15vw,23px);font-weight:800}
.lyric-wrap{position:absolute;z-index:20;left:50%;bottom:5.2vh;transform:translateX(-50%);width:min(72vw,1380px);min-height:10vh;display:flex;align-items:center;justify-content:center;padding:1.1vh 3vw;border-radius:26px;background:rgba(255,252,244,.92);border:1.4px solid rgba(83,113,130,.22);box-shadow:0 7px 18px rgba(48,72,84,.09)}
.lyric{font-size:clamp(28px,2.25vw,44px);font-weight:900;line-height:1.15;text-align:center;color:#173f72}
</style>
</head>
<body>
<main class="stage">
  <button class="close" type="button" aria-label="Close" onclick="window.location.href='index.html'">×</button>
  <header class="header">
    <h1>Clean Up Song</h1>
    <div class="subtitle">Time to clean our classroom together.</div>
  </header>

  <section class="video-wrap" aria-label="Clean Up Song video area">
    <div class="video-stage">
      <div class="placeholder">
        <div class="icon">▶</div>
        <strong>Clean Up Song Video</strong>
        <span>We’ll place the finished video here after the page layout is approved.</span>
      </div>
    </div>
  </section>

  <section class="lyric-wrap" aria-label="Current lyric">
    <div class="lyric">Lyrics will appear here one line at a time.</div>
  </section>
</main>
</body>
</html>
