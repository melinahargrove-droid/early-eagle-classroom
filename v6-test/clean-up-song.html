<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Clean Up Song</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#dfe8ee;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72}.app{display:grid;grid-template-columns:62% 38%;height:100vh;overflow:hidden}.left{position:relative;background:#000;display:flex;align-items:center;justify-content:center}.left video{width:100%;height:100%;object-fit:contain;background:#000}.close{position:absolute;top:18px;left:18px;z-index:5;width:52px;height:52px;border-radius:50%;border:0;background:#fff9eb;color:#173f72;font-size:30px;font-weight:900}.controls{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;z-index:5}.controls button{border:0;border-radius:999px;padding:12px 18px;font-weight:900;color:#173f72;background:#fff9eb}.controls .primary{background:#173f72;color:#fff}.right{background:#fff9eb;padding:24px;overflow:auto;border-left:8px solid #c7d9e5}.right h1{margin:0 0 6px;font-size:28px}.right p{margin:0 0 14px;font-size:14px}.now{background:white;border:2px solid #c5d8e4;border-radius:18px;padding:16px;margin-bottom:14px}.now .count{font-size:13px;font-weight:900;color:#5b7488}.now textarea{width:100%;min-height:78px;margin-top:8px;border:2px solid #bdd0dc;border-radius:12px;padding:10px;font:inherit;font-weight:800;color:#173f72;resize:vertical}.big{width:100%;border:0;border-radius:16px;padding:16px;margin-top:10px;font-size:20px;font-weight:900;background:#173f72;color:white}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;border:0;border-radius:999px;padding:10px;font-weight:900;background:#dfeaf1;color:#173f72}.danger{background:#f2d9d9!important;color:#7d2d2d!important}.status{min-height:20px;margin:8px 0;font-size:13px;font-weight:900;color:#2f6d45}.list{margin-top:16px}.item{padding:9px 10px;border-radius:10px;margin-bottom:6px;background:white;border:1px solid #e1e9ee;font-size:13px;cursor:pointer}.item.current{outline:3px solid #9fc2d8}.time{font-weight:900;color:#52718a}.hint{font-size:12px;color:#5f6e78;margin-top:6px}.copy{width:100%;margin-top:10px;border:0;border-radius:999px;padding:11px;background:#dfeaf1;color:#173f72;font-weight:900}@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:48% 52%}.right{border-left:0;border-top:8px solid #c7d9e5}}
</style></head><body><div class="app"><section class="left"><video id="video" playsinline preload="metadata" muted><source src="assets/EEA-Clean-Up-Song-web.mp4" type="video/mp4"></video><audio id="audio" preload="auto" src="../audio/circle-time-clean-up.mp3"></audio><button class="close" onclick="location.href='index.html'">×</button><div class="controls"><button id="restart">↺ Restart</button><button id="play" class="primary">▶ Play</button></div></section><aside class="right"><h1>Lyrics</h1><p>Fast mode: type/fix the lyric, then press <b>STAMP THIS LYRIC NOW</b> exactly when you hear it begin.</p><div class="now"><div class="count" id="count"></div><textarea id="text"></textarea><button class="big" id="stamp">STAMP THIS LYRIC NOW →</button><div class="row"><button id="save">Save words</button><button id="prev">← Previous</button><button id="next">Next →</button><button id="delete" class="danger">Delete</button></div><div class="status" id="status"></div><div class="hint">Keyboard shortcut: press <b>Space</b> to stamp the current lyric while the song plays.</div></div><div class="list" id="list"></div><button class="copy" id="copy">Copy final lyric list + times</button></aside></div><script>
(()=>{const v=document.getElementById('video'),a=document.getElementById('audio'),play=document.getElementById('play'),text=document.getElementById('text'),count=document.getElementById('count'),status=document.getElementById('status'),list=document.getElementById('list');const defaults=["When you hear the music start to play.","Clean up, clean up, now you know!","Put the toys away, put them in their place,","Put the toys away, put them in their place,","Pick them up and clean up fast,","Make it fun, make it last!","Put the toys away, put them in their place,","Put the toys away, put them in their place,","Pick them up and clean up fast,","Make it fun, make it last!","When the cleaning is all done,","Gather 'round, it's time for fun!","Come and sit in Circle Time,","Learning songs and nursery rhyme!","Find your spot and sit down slow,","Hands in your lap, ready to go.","Quiet bodies, listening ears,","Circle Time is finally here!"];let lines,cues;try{lines=JSON.parse(localStorage.getItem('eeaCleanupLyrics'))||defaults.slice()}catch(e){lines=defaults.slice()}try{cues=JSON.parse(localStorage.getItem('eeaCleanupLyricCues'))||lines.map((_,i)=>i*10)}catch(e){cues=lines.map((_,i)=>i*10)}if(!Array.isArray(lines)||!lines.length)lines=defaults.slice();if(!Array.isArray(cues)||cues.length!==lines.length)cues=lines.map((_,i)=>i*10);let selected=0;const saveAll=()=>{localStorage.setItem('eeaCleanupLyrics',JSON.stringify(lines));localStorage.setItem('eeaCleanupLyricCues',JSON.stringify(cues))};function render(){selected=Math.max(0,Math.min(selected,lines.length-1));count.textContent=`Lyric ${selected+1} of ${lines.length} • ${cues[selected].toFixed(2)} sec`;text.value=lines[selected]||'';list.innerHTML='';lines.forEach((x,i)=>{const d=document.createElement('div');d.className='item'+(i===selected?' current':'');d.innerHTML=`<span class="time">${i+1}. ${cues[i].toFixed(2)}s</span> — ${x}`;d.onclick=()=>{selected=i;render()};list.appendChild(d)})}function syncVideo(){if(Math.abs((v.currentTime||0)-(a.currentTime||0))>.25)v.currentTime=a.currentTime}async function start(){v.currentTime=a.currentTime;try{await a.play();v.play().catch(()=>{});play.textContent='❚❚ Pause'}catch(e){status.textContent='Tap Play again to start'}}function pause(){a.pause();v.pause();play.textContent='▶ Play'}function saveWords(){const val=text.value.trim();if(val){lines[selected]=val;saveAll();render();status.textContent='✓ Words saved';setTimeout(()=>status.textContent='',900)}}function stamp(){saveWords();cues[selected]=+(a.currentTime||0).toFixed(2);saveAll();status.textContent=`✓ Lyric ${selected+1} stamped at ${cues[selected].toFixed(2)}s`;if(selected<lines.length-1)selected++;render();setTimeout(()=>status.textContent='',900)}function del(){if(lines.length<=1)return;lines.splice(selected,1);cues.splice(selected,1);if(selected>=lines.length)selected=lines.length-1;saveAll();render();status.textContent='✓ Lyric deleted';setTimeout(()=>status.textContent='',900)}a.addEventListener('timeupdate',syncVideo);a.addEventListener('ended',pause);play.onclick=()=>a.paused?start():pause();document.getElementById('restart').onclick=()=>{a.currentTime=0;v.currentTime=0;start()};document.getElementById('save').onclick=saveWords;document.getElementById('stamp').onclick=stamp;document.getElementById('prev').onclick=()=>{selected=Math.max(0,selected-1);render()};document.getElementById('next').onclick=()=>{selected=Math.min(lines.length-1,selected+1);render()};document.getElementById('delete').onclick=del;document.getElementById('copy').onclick=async()=>{const out=lines.map((x,i)=>`${i+1}. [${cues[i].toFixed(2)}s] ${x}`).join('\n');try{await navigator.clipboard.writeText(out);status.textContent='✓ Copied'}catch(e){status.textContent='Copy blocked'}};document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement!==text){e.preventDefault();stamp()}});render()})();
</script></body></html>
