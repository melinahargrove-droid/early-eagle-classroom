<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Clean Up Song</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#dfe8ee;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72}.app{display:grid;grid-template-columns:62% 38%;height:100vh;overflow:hidden}.left{position:relative;background:#000;display:flex;align-items:center;justify-content:center}.left video{width:100%;height:100%;object-fit:contain;background:#000}.close{position:absolute;top:18px;left:18px;z-index:5;width:52px;height:52px;border-radius:50%;border:0;background:#fff9eb;color:#173f72;font-size:30px;font-weight:900;cursor:pointer}.controls{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;z-index:5;flex-wrap:wrap;justify-content:center}.controls button{border:0;border-radius:999px;padding:12px 18px;font-weight:900;color:#173f72;background:#fff9eb;cursor:pointer}.controls .primary{background:#173f72;color:#fff}.right{background:#fff9eb;padding:28px 30px;overflow:hidden;border-left:8px solid #c7d9e5;display:flex;flex-direction:column}.right h1{margin:0 0 8px;font-size:30px}.sub{margin:0 0 18px;font-size:14px;color:#5f6e78}.current{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;background:white;border:3px solid #c5d8e4;border-radius:26px;padding:28px;box-shadow:0 8px 22px rgba(44,75,98,.08)}.current-text{font-size:clamp(30px,3vw,54px);line-height:1.18;font-weight:900}.progress{margin-top:16px;font-size:14px;font-weight:900;color:#52718a;text-align:center}.note{margin-top:10px;font-size:12px;text-align:center;color:#71808b}.status{position:absolute;right:18px;top:18px;background:#fff9eb;color:#173f72;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:900;z-index:5}@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:52% 48%}.right{border-left:0;border-top:8px solid #c7d9e5;padding:18px}.current-text{font-size:clamp(26px,6vw,44px)}}
</style></head><body><div class="app"><section class="left"><video id="video" playsinline preload="metadata" muted><source src="assets/EEA-Clean-Up-Song-web.mp4" type="video/mp4"></video><audio id="audio" preload="auto" src="../audio/circle-time-clean-up.mp3"></audio><button class="close" onclick="location.href='index.html'">×</button><div class="status" id="status">Ready</div><div class="controls"><button id="back5">↶ 5 sec</button><button id="back2">↶ 2 sec</button><button id="back1">↶ 1 sec</button><button id="restart">↺ Restart</button><button id="play" class="primary">▶ Play</button></div></section><aside class="right"><h1>Clean Up Song</h1><p class="sub">Video on the left • lyrics on the right</p><div class="current"><div class="current-text" id="lyric"></div></div><div class="progress" id="progress"></div><div class="note">Best-effort lyric timing for now. We can fine-tune it later.</div></aside></div><script>
(()=>{const v=document.getElementById('video'),a=document.getElementById('audio'),play=document.getElementById('play'),status=document.getElementById('status'),lyric=document.getElementById('lyric'),progress=document.getElementById('progress');
const lines=[
"When you hear the music start to play,",
"Stop your games and put things away,",
"Listen to the song, it's time to go,",
"Clean up, clean up, now you know!",
"Put the toys away, put them in their place,",
"Put the toys away, put them in their place,",
"Pick them up and clean up fast,",
"Make it fun, make it last!",
"Put the toys away, put them in their place,",
"Put the toys away, put them in their place,",
"Pick them up and clean up fast,",
"Make it fun, make it last!",
"When the cleaning is all done,",
"Gather 'round, it's time for fun!",
"Come and sit in Circle Time,",
"Learning songs and nursery rhyme!"
];
// Rough first-pass cues only; intentionally easy to revise later.
const cues=[0,8,16,24,36,47,58,69,80,91,102,113,132,144,156,168];
function idx(t){let n=0;for(let i=0;i<cues.length;i++){if(t>=cues[i])n=i;else break}return n}
function render(){const i=idx(a.currentTime||0);lyric.textContent=lines[i];progress.textContent=`Lyric ${i+1} of ${lines.length}`}
function syncVideo(force=false){if(force||Math.abs((v.currentTime||0)-(a.currentTime||0))>.25)v.currentTime=a.currentTime}
async function start(){syncVideo(true);try{await a.play();v.play().catch(()=>{});play.textContent='❚❚ Pause';status.textContent='Playing'}catch(e){status.textContent='Tap Play again to start'}}
function pause(){a.pause();v.pause();play.textContent='▶ Play';status.textContent='Paused'}
function back(sec){const wasPlaying=!a.paused;a.currentTime=Math.max(0,a.currentTime-sec);v.currentTime=a.currentTime;render();if(wasPlaying)start()}
a.addEventListener('timeupdate',()=>{syncVideo(false);render()});a.addEventListener('ended',()=>{pause();status.textContent='Finished'});play.onclick=()=>a.paused?start():pause();document.getElementById('restart').onclick=()=>{a.currentTime=0;v.currentTime=0;start()};document.getElementById('back5').onclick=()=>back(5);document.getElementById('back2').onclick=()=>back(2);document.getElementById('back1').onclick=()=>back(1);render()})();
</script></body></html>
