<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Unit 2 Week 1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f6f0e4 59%,#e4eee9)}.page{height:100vh;padding:2.2vh 3vw}.top{height:10vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-weight:900;letter-spacing:.11em;color:#789697;font-size:12px}.top h1{margin:.5vh 0 0;color:#164f7f;font-size:clamp(34px,3vw,56px);line-height:1}.sub{margin-top:.6vh;color:#557876;font-size:clamp(15px,1vw,20px);font-weight:850}.actions{display:flex;gap:.6vw;align-items:center}.chip{padding:.65vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.exit{width:50px;height:50px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:26px;font-weight:900;cursor:pointer}.stage{height:75vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdf9;box-shadow:0 14px 34px rgba(54,79,77,.07);padding:3vh 3vw;overflow:auto}.lesson{max-width:1300px;margin:auto}.kicker{font-weight:900;letter-spacing:.1em;color:#9b7b5d;font-size:12px}.lesson h2{font-size:clamp(34px,3vw,58px);line-height:1.05;margin:.6vh 0 1.2vh;color:#164f7f}.lead{font-size:clamp(19px,1.35vw,27px);line-height:1.35;color:#527673;font-weight:900;margin-bottom:2vh}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1vw}.box{border-radius:20px;background:#eef4ef;border:1px solid rgba(89,130,146,.14);padding:1.5vh 1.3vw}.box b{display:block;color:#245c78;margin-bottom:.65vh;font-size:13px;letter-spacing:.05em}.box p,.box li{font-size:clamp(14px,.92vw,18px);line-height:1.42;color:#536f6d;font-weight:800}.box p{margin:.45vh 0}.box ul{margin:.5vh 0;padding-left:1.2em}.quote{background:#fff6e7;border-color:#ead8ad}.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw}.choice{border-radius:22px;background:#eef4ef;border:1px solid #cbdde0;padding:1.4vh 1.2vw;min-height:16vh}.choice h3{margin:.4vh 0 .65vh;color:#164f7f;font-size:clamp(18px,1.25vw,24px)}.choice p{margin:0;color:#557876;font-weight:800;line-height:1.35;font-size:clamp(13px,.85vw,17px)}.footer{height:10vh;display:grid;grid-template-columns:18% 1fr 18%;align-items:center;gap:1vw}.nav{border:1.3px solid #cbdde0;border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.done{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}@media(max-width:900px){.choicegrid{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.stage{height:76vh}}</style></head><body><main class="page"><header class="top"><div><div class="eyebrow" id="eyebrow">EARLY EAGLE ACADEMY · UNIT 2 · WEEK 1</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="exit" id="exit">×</button></div></header><section class="stage"><div class="lesson" id="lesson"></div></section><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav done" id="done">Next →</button></footer></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',view=p.get('view')||'community';const centerData={Monday:[{title:'Art Studio · City Collages',lead:'Children create torn-paper collages to represent the city.',steps:['Look at collage illustrations and at My City for ideas about representing city features.','Model tearing paper into shapes, arranging pieces, and using adhesive.','Invite children to choose many kinds of paper and create city features with collage.']},{title:'Library & Listening · Jobs That Make a City Work',lead:'Children use unit books as research to find evidence of people working.',steps:['Show a flagged illustration of a person doing a job and ask what the person is doing and how the work helps the city.','Demonstrate using one sticky note to flag evidence in a book.','Invite children to research in books and talk with classmates about what they find.'] }],Tuesday:[{title:'Blocks · City Structures',lead:'Children use various building materials to build city structures.',steps:['Look at structures in My City and ask what kinds of structures children notice.','Show blocks, cardboard rolls, boxes, and other building materials.','Following children’s suggestions, model beginning a skyscraper or another city structure.']},{title:'Discovery · Reflections in Water',lead:'Children investigate finding and making reflections in water.',steps:['Revisit the puddle reflection in My City and a reflection in The Lost Package.','Use a mirror to connect reflections to what children see in water.','Demonstrate making bubbles with soap and water, then look for reflections in bubbles or still water.'] }],Wednesday:[{title:'Dramatic Play · Post Office',lead:'Children help set up a post office for pretend play.',steps:['Connect to Max mailing a letter in My City and explain that a post office is one way people communicate across a city.','Ask children what materials a post office needs and record their ideas.','Explore available props; children can make additional props, then pretend to buy stamps, mail letters, sort packages, and be mail carriers.']},{title:'Writing & Drawing · Writing to Friends and Family',lead:'Children draw and write messages about their city.',steps:['Connect to Max sending a letter in My City.','Show letter and postcard formats plus envelopes.','Invite children to draw pictures or write words to send a message to someone in the classroom, family, or community.'] }],Thursday:[{title:'Art Easel · Painting City Features',lead:'Children paint details or features of the city.',steps:['Look at selected city features in My City and ask what children notice.','Use city photos/paintings for additional inspiration.','Model deciding what to paint, referring to an image, and beginning a painting.']},{title:'Science & Engineering · Structures and Shadows',lead:'Children build structures and investigate the shadows they make.',steps:['Connect city buildings to architecture and the structures children have already begun in Blocks.','Build a simple stable structure and use a flashlight to ask: What makes a shadow?','Move the light source to different angles and notice how the shadow changes; children can continue the investigation inside a box at the center.'] }],Friday:[{title:'Continue and Deepen Center Work',lead:'No new center introduction is listed for Day 5.',steps:['Revisit the Week 1 centers already introduced.','Support children in extending their city-building, post-office, writing, art, reflection, research, and shadow investigations.']}]};const foundational={Monday:{title:'Letter ID · Tt',lead:'Listen for /t/ and connect the sound to the letter Tt.',boxes:[['Materials','Alphabet poster, pointer, Fundations letter card Tt.'],['Teach','Say the alphabet rather than singing it. Emphasize /t/ in “Tatiana tried to tap.” Ask for the first sound heard in all four words, then display Tt and connect T to /t/.'],['Articulation','For /t/, the tip of the tongue touches the top of the mouth behind the teeth. Hold a palm in front of the mouth to feel a small puff of air.'],['Connection','Think of children and school adults whose names begin with T.']]},Tuesday:{title:'Letter ID · Ii',lead:'Introduce Ii and focus on the short /ĭ/ sound.',boxes:[['Materials','Alphabet poster, pointer, Fundations letter card Ii.'],['Teach','Emphasize /ĭ/ in “Iggy iguana itches.” Ask what sound begins each word. Display Ii and connect I to /ĭ/; note that I also has another sound, but today focuses on /ĭ/.'],['Articulation','Scrunch your nose and “itch it” while producing /ĭ/; feel the sound in the nose a little.'],['Connection','Think of children and school adults whose names begin with I.']]},Wednesday:{title:'Concepts of Print · Spaces Between Words',lead:'Use “Three Little Kittens” to notice where one word ends and the next begins.',boxes:[['Set Up','Write or project “Three Little Kittens.” Begin at the title and read from left to right.'],['Notice','Point out the spaces in the title: Three · Little · Kittens. Explain that spaces tell us when one word ends and a new word begins.'],['Read Again','Read the poem a second time. Ask: What is silly in this poem? Do kittens really wear mittens?']]},Thursday:{title:'Concepts of Print · Spaces + Rhyme',lead:'Revisit “Three Little Kittens,” spaces between words, and rhyming words.',boxes:[['Print Concept','Ask where reading begins. Count the three words in the title, noticing the spaces between them.'],['Rhyme','Read the poem two times. Ask what rhyming words children hear: kittens/mittens and dear/fear.']]},Friday:{title:'Letter Formation and Review',lead:'Form T/t and I/i, then review previously practiced letters and sounds.',boxes:[['Materials','Alphabet poster, pointer, Fundations letter cards Ma, Aa, Ll, Oo, Hh, Gg, Cc, Dd, Tt, Ii.'],['Tt','Skywrite uppercase T: big line down, then a little line left to right across the top. Offer similar guidance for lowercase t and reinforce /t/.'],['Ii','Skywrite uppercase I: big line down, little line across the top, then another across the bottom. Offer similar guidance for lowercase i and reinforce /ĭ/.'],['Review','Show the letter cards and have children repeat each letter name, picture, and sound.']]}};const building={Monday:{title:'Building Blocks · Day 1',lead:'Baker’s Truck + Make Number Pizzas',boxes:[['Numeracy','Recite “Baker’s Truck” together with gestures. The rhyme ends with five big pizzas.'],['Make Number Pizzas','Add toppings to a pizza while children count along. Ask how many toppings there are and how they know. Repeat with different numbers up to 5 or more.'],['Preview','Children will make their own pizzas during small-group time.']]},Tuesday:{title:'Building Blocks · Day 2',lead:'Baker’s Truck + Place Scenes',boxes:[['Numeracy','Recite “Baker’s Truck” together with gestures.'],['Place Scenes','Place five counters on a scene and tell a number story. Invite children to help tell another story using a new scene.'],['Preview','Children can use counters or other objects to make a scene and tell their own stories in the Math Center.']]},Wednesday:{title:'Building Blocks · Day 3',lead:'Count and Move in Patterns + I Spy Two Eyes or Where’s One? + Snapshots',boxes:[['Count and Move','Count aloud in patterns of four, using movements such as clap, clap, clap, jump, then pause; continue the pattern.'],['Read Aloud Math','Read I Spy Two Eyes or Where’s One? Return to pages and count objects together to check quantities.'],['Snapshots','Briefly show an array of 3–5 toppings. Ask children to take a mental snapshot, show how many with fingers, then explain how they knew.']]},Thursday:{title:'Building Blocks · Day 4',lead:'Count and Move in Patterns + Number Me Five',boxes:[['Count and Move','Count aloud in patterns of five, using a repeating movement pattern such as four claps and a spin.'],['Number Me Five','Ask children to show something of five on their body. Encourage them to count to justify how they know there are five.']]},Friday:{title:'Building Blocks · Day 5',lead:'Five Dancing Dolphins + Snapshots',boxes:[['Numeracy','Recite “Five Dancing Dolphins,” building from one dolphin to five.'],['Snapshots','Briefly show an array of 3–5 toppings. Children take a mental snapshot, show the quantity with fingers, and explain how they knew.']]}};const data={community:{title:'Community Meeting',sub:'Choose from the verified Week 1 meeting options.',choice:true,choices:[['⭐','Star Pose','Stand with feet wide and arms extended like a strong, stable structure. Take deep breaths. Children may also do the pose seated.'],['🖐️','Five Finger Breathing','Trace up each finger while breathing in and trace down while breathing out, continuing across the hand and back again.'],['🏙️','Conversation Prompt','Introduce Building Our Working City and invite children to share what they know about the city. The source prompt names Boston.'],['✨','Magic Ball','Use imagination to transform a ball into different kinds of balls, then pass it around in a way that matches its imagined quality.'],['🚲','Bicycles','Pretend to ride bicycles around the city, choosing destinations, pedaling, stopping, and describing what children see.'],['🧱','Problem Stories','Use Problem Stories characters to act out a short scenario based on something children are working through, such as sharing.']]},foundational:{title:foundational[day].title,sub:'Foundational Literacy · Unit 2 Week 1',cards:[foundational[day]]},writing:{title:'Writing · Personal Recount',sub:'Week 1 includes two whole-group writing lessons; the source does not assign them to specific weekdays.',choice:true,choices:[['1','Lesson 1 · Deconstruction: Purpose','Use My Day with Gong Gong and a previous shared experience to introduce personal recount as a genre: a true story from someone’s life. Retell a few events and close by naming the new genre.'],['2','Lesson 2 · Modeling: Telling Personal Recounts','Model an oral personal recount with an orientation (who, when, where), a short sequence of events, and a conclusion that may include a feeling.'],['✏️','Small-Group Connection','Later, children tell a personal recount to a partner and choose one event to represent through drawing.']]},centers:{title:'Intro to Centers',sub:'Center introductions are assigned by day in the Week 1 At-a-Glance.',cards:centerData[day].map(x=>({title:x.title,lead:x.lead,boxes:[['Introduce',x.steps.join(' • ')]]}))},smallgroups:{title:'Literacy Small Groups',sub:'Choose the activity you are teaching with this group.',choice:true,choices:[['✏️','Writing · Personal Recount','Adult-led: children tell a true personal story, then choose one event to draw. If ready, they may draw another event and number pages to show sequence.'],['🔤','Skills Reinforcement','With adult support, revisit specific foundational literacy skills. The curriculum points to the Week 1 Skills Reinforcement sheet aligned with Heggerty Week 7.'],['🧩','Knowledge Building · My City Dominoes','Match city-structure/sign images on domino cards. Keep playing cooperatively until all cards are connected; ask what children see around the city.'],['🤏','Fine Motor Development','With minimal support, choose activities based on observation and individual fine-motor goals and stamina.']]},building:{title:building[day].title,sub:'Building Blocks · Week 6 clipboard sequence used in Unit 2 Week 1',cards:[building[day]]},storytelling:{title:'Storytelling and Story Acting',sub:'Week 1 At-a-Glance: Capture Children’s Stories and Dramatize Them.',choice:true,choices:[['📝','Capture a Child’s Story','Use the established classroom storytelling routine to record a child’s story.'],['🎭','Dramatize the Story','Invite children to act out the captured story using the established story-acting routine.']]},closing:{title:'Closing Circle',sub:'End the teaching day and return to Home.',cards:[{title:'Close the Day',lead:'Use your established Closing Circle routine.',boxes:[['Week 1 Focus','Building Our Working City: people design and build what communities need, and people’s work is interconnected.'],['Teacher Note','The uploaded Week 1 curriculum does not provide a separate Closing Circle lesson, so no new curriculum prompt has been invented here.']]}]}}[view];let index=0;const $=id=>document.getElementById(id);$('title').textContent=data.title;$('sub').textContent=data.sub;$('chip').textContent='UNIT 2 · WEEK 1 · '+day.toUpperCase();$('exit').onclick=()=>location.href='daily-lessons.html?week=9&day='+days.indexOf(day);function cardHtml(c){const boxes=(c.boxes||[]).map(b=>`<div class="box"><b>${b[0]}</b><p>${b[1]}</p></div>`).join('');return `<div class="kicker">${day.toUpperCase()} · UNIT 2 WEEK 1</div><h2>${c.title}</h2>${c.lead?`<div class="lead">${c.lead}</div>`:''}<div class="grid">${boxes}</div>`}function render(){if(data.choice){$('lesson').innerHTML=`<div class="kicker">UNIT 2 · WEEK 1</div><h2>${data.title}</h2><div class="lead">${data.sub}</div><div class="choicegrid">${data.choices.map(c=>`<article class="choice"><div style="font-size:34px">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></article>`).join('')}</div>`;$('count').textContent='Choice screen';$('fill').style.width='100%';$('prev').textContent='← Previous';$('done').textContent='Done ✓';return}const cards=data.cards||[];$('lesson').innerHTML=cardHtml(cards[index]);$('count').textContent=(index+1)+' of '+cards.length;$('fill').style.width=((index+1)/cards.length*100)+'%';$('prev').textContent=index===0?'← Previous':'← Previous';$('done').textContent=index===cards.length-1?'Done ✓':'Next →'}function state(){if(data.choice)return{atStart:true,atEnd:true,index:0,total:1};const total=(data.cards||[]).length;return{atStart:index===0,atEnd:index===total-1,index,total}}window.EEASectionState=state;function notify(){window.dispatchEvent(new CustomEvent('eea-section-state',{detail:state()}))}$('prev').onclick=()=>{if(data.choice||index===0)return;index--;render();notify()};$('done').onclick=()=>{if(data.choice)return;const total=data.cards.length;if(index<total-1){index++;render();notify()}};render();notify()})();</script></body></html>
