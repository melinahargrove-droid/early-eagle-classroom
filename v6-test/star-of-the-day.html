<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star of the Day — Early Eagle Academy</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#123d78;background:#d9e4e7}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(1.035)}
.wash{position:absolute;inset:0;background:rgba(248,242,224,.07);pointer-events:none}
.close{position:absolute;z-index:10;top:3.4vh;right:3vw;width:clamp(54px,4.5vw,80px);height:clamp(54px,4.5vw,80px);border:2px solid rgba(199,157,91,.52);border-radius:50%;background:rgba(253,248,233,.95);box-shadow:0 4px 12px rgba(39,71,103,.17);color:#174e88;font-size:clamp(31px,2.5vw,46px);font-weight:900;line-height:1;cursor:pointer;transition:transform .15s ease}
.close:hover{transform:scale(1.04)}
.close:active{transform:scale(.96)}
.page-title{position:absolute;z-index:4;left:0;right:0;top:12.4vh;text-align:center;font-size:clamp(38px,4.1vw,74px);font-weight:900;line-height:1;color:#174e88;text-shadow:0 2px 0 rgba(255,255,255,.72)}
.title-leaf{display:inline-block;font-size:.55em;vertical-align:.12em;margin:0 .28em;color:#6d8c6c}
.star-zone{position:absolute;z-index:3;left:50%;top:49.5%;width:min(42vw,720px);height:min(51vh,570px);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center}
.star-art{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 11px 9px rgba(45,74,95,.15));transition:transform .58s cubic-bezier(.2,.9,.26,1.25),filter .58s ease}
.sparkle{position:absolute;z-index:3;color:#2f679d;opacity:.82;text-shadow:0 1px 0 rgba(255,255,255,.55);font-size:clamp(24px,2.5vw,44px);transform:scale(.8);transition:transform .55s cubic-bezier(.2,.9,.26,1.3),opacity .35s ease}
.s1{left:-2%;top:29%}.s2{right:-2%;top:22%;color:#e6a31a}.s3{left:6%;bottom:15%;color:#e6a31a}.s4{right:7%;bottom:10%}.s5{left:14%;top:7%;font-size:clamp(18px,1.8vw,34px);color:#e6a31a}.s6{right:14%;top:8%;font-size:clamp(18px,1.8vw,34px)}
.banner{position:absolute;z-index:5;left:50%;bottom:3.8vh;transform:translateX(-50%);width:min(46vw,820px);height:clamp(112px,14vh,154px);border:2px solid rgba(190,144,75,.55);border-radius:30px;background:rgba(253,248,233,.96);box-shadow:0 8px 18px rgba(43,71,98,.16),inset 0 0 28px rgba(221,195,143,.1);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 4%;overflow:hidden}
.banner::after{content:'✦';position:absolute;bottom:8%;left:50%;transform:translateX(-50%);font-size:clamp(15px,1.15vw,22px);color:#e6a31a;opacity:.85}
.prompt,.name{font-weight:900;color:#174e88;line-height:1;transition:opacity .28s ease,transform .55s cubic-bezier(.2,.9,.26,1.25)}
.prompt{border:0;background:transparent;font:900 clamp(30px,3vw,54px)/1 "Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174e88;cursor:pointer;padding:0 0 10px;white-space:nowrap}
.prompt:hover{transform:scale(1.025)}
.prompt:active{transform:scale(.97)}
.name{position:absolute;left:4%;right:4%;top:50%;transform:translateY(-50%) scale(.72);font-size:clamp(48px,5vw,92px);opacity:0;padding-bottom:10px}
.revealed .prompt{opacity:0;pointer-events:none;transform:scale(.75)}
.revealed .name{opacity:1;transform:translateY(-50%) scale(1)}
.revealed .star-art{transform:scale(1.045);filter:drop-shadow(0 15px 11px rgba(45,74,95,.18))}
.revealed .sparkle{transform:scale(1.12)}
@media(max-aspect-ratio:1.35/1){
  .page-title{top:13vh;font-size:clamp(34px,4.6vw,60px)}
  .star-zone{width:54vw;height:48vh;top:49%}
  .banner{width:62vw;bottom:3vh}
}
</style>
</head>
<body>
<main class="stage" id="stage">
<img class="bg" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png" alt="">
<div class="wash"></div>
<button class="close" type="button" aria-label="Close" onclick="history.length>1?history.back():location.href='index.html'">×</button>
<div class="page-title"><span class="title-leaf">❧</span>Star of the Day<span class="title-leaf">❧</span></div>
<section class="star-zone" aria-live="polite">
<span class="sparkle s1">✦</span><span class="sparkle s2">✦</span><span class="sparkle s3">✧</span><span class="sparkle s4">✦</span><span class="sparkle s5">✧</span><span class="sparkle s6">✧</span>
<img class="star-art" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Content%20Assets/EEA_v6_4D-1_Star_of_the_Day_Star.png" alt="Smiling watercolor star">
</section>
<section class="banner" aria-live="polite">
<button class="prompt" id="reveal" type="button">Reveal Our Star!</button>
<div class="name" id="star-name">Addison</div>
</section>
</main>
<script>
const stage=document.getElementById('stage');
const reveal=document.getElementById('reveal');
const nameEl=document.getElementById('star-name');
const params=new URLSearchParams(location.search);
const previewName=params.get('name');
if(previewName) nameEl.textContent=previewName;
reveal.addEventListener('click',()=>{
  stage.classList.add('revealed');
  reveal.setAttribute('aria-hidden','true');
});
</script>
</body>
</html>
