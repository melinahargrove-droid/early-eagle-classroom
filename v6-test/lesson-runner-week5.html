<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 5 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;color:#174f7d;background:#f6f1e5}.app{height:100%;padding:1.2vh 1.5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.top{height:8.5vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid #d7e3e2}.brand small{color:#719298;font-weight:900;letter-spacing:.1em}.brand h1{margin:.2vh 0 0}.daytitle{font-weight:900}.topright{justify-self:end}.top button{border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.pill{border-radius:16px;padding:.8vh 1vw}.home{width:48px;height:48px;border-radius:50%;font-size:21px}.dash{height:88vh;display:grid;grid-template-columns:16.5vw 1fr 12.5vw;gap:.8vw;padding-top:1vh}.side,.tools{border:1.4px solid #d5e1df;border-radius:22px;background:#fffef9;padding:1.2vh .8vw}.side h3,.tools h3{margin:.3vh .2vw 1vh}.count{font-size:11px;color:#789697;font-weight:900}.resume{padding:.7vh .6vw;border-radius:12px;background:#eef5f4;color:#557876;font-size:11px;font-weight:800;margin:.7vh 0}.path{display:flex;flex-direction:column;gap:.48vh}.path button{width:100%;text-align:left;border:1px solid #d8e2df;border-radius:14px;background:#fffdf8;color:#245c78;padding:.68vh .6vw;cursor:pointer}.path b{display:block;font-size:12px}.path span{display:block;color:#718985;font-size:9.7px}.path .active{background:#dcecf5;box-shadow:inset 4px 0 0 #5c9ac5}.path .doneStep{background:#edf5e8}.stage{position:relative;border:1.5px solid #d5e1df;border-radius:24px;overflow:hidden;background:#fff}.stage iframe{border:0;width:100%;height:100%;display:block}.tools section{border:1px solid #d8e2df;border-radius:16px;padding:1vh .7vw;margin-bottom:1vh}.tools button{display:block;width:100%;border:0;border-radius:12px;padding:1vh .4vw;margin:.6vh 0;background:#e7f2f8;color:#245c78;font-weight:900;cursor:pointer}.tools .edit{background:#edf3e6;color:#4f704b}.custom{position:absolute;inset:0;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 62%,#e4eee9);padding:3vh 3vw;z-index:5}.custom.show{display:flex}.ctop{display:flex;justify-content:space-between;align-items:center}.ck{color:#789697;font-weight:900;letter-spacing:.1em}.cbody{flex:1;display:grid;grid-template-columns:35% 1fr;gap:4vw;align-items:center;background:#fffdf9;border:1.5px solid #cbdde0;border-radius:30px;padding:4vh 4vw;margin:2vh 0}.cv{min-height:40vh;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,10vw,175px)}.cv img{max-width:100%;max-height:48vh;object-fit:contain;border-radius:24px}.cc h2{font-size:clamp(42px,4vw,76px);margin:0 0 2vh}.ct{font-size:clamp(21px,1.5vw,30px);font-weight:850;line-height:1.4;color:#557876;white-space:pre-wrap}.cp{margin-top:2vh;padding:1.5vh 1.3vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(18px,1.2vw,24px);font-weight:900;white-space:pre-wrap}.cnav{display:flex;align-items:center;justify-content:space-between}.cnav button,.note{border:1px solid #d4e0df;border-radius:16px;padding:1vh 1.2vw;font-weight:900;cursor:pointer}.note,.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:white}.panel{display:none;position:absolute;right:3vw;bottom:10vh;width:min(500px,38vw);z-index:20;background:#fffdf9;border:1.5px solid #c9dce0;border-radius:20px;padding:18px;box-shadow:0 12px 30px #0002;color:#557876;font-weight:800}.panel.show{display:block}</style></head><body><main class="app"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Lessons</h1></div><div class="daytitle"><span id="dayName"></span> · Week 5</div><div class="topright"><button class="pill" id="overview">Day Overview</button> <button class="home" id="home">⌂</button></div></header><div class="dash"><aside class="side"><h3>Today’s Lesson Path</h3><div class="count" id="count"></div><div class="resume">Your place is saved automatically.</div><div class="path" id="path"></div></aside><section class="stage"><iframe id="frame"></iframe><section class="custom" id="custom"><div class="ctop"><div class="ck" id="ck"></div><button class="note" id="note">Teacher Note</button></div><div class="cbody"><div class="cv" id="cv">⭐</div><div class="cc"><h2 id="ctitle"></h2><div class="ct" id="ct"></div><div class="cp" id="cp"></div></div></div><div class="cnav"><button class="prev" id="cprev">← Previous</button><span id="ccount"></span><button class="next" id="cnext">Next →</button></div><aside class="panel" id="panel"></aside></section></section><aside class="tools"><section><h3>Edit This Lesson</h3><button class="edit" id="manage">✎ Edit Lesson</button><button class="edit" id="add">＋ Add Screen</button></section><section><h3>Quick Tools</h3><button onclick="location.href='timer.html'">Timer</button><button onclick="location.href='clean-up.html'">Clean Up Song</button><button onclick="location.href='choose-a-friend.html'">Choose a Friend</button></section></aside></div></main><script src="visual-store.js"></script><script>(()=>{const W=5,p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(6,Number(p.get('section'))||0)),cm=false,ci=0;const names=['Community Meeting','Read Aloud','Centers','Small Groups','Building Blocks','Storytelling','Closing Circle'],icons=['🌞','📖','🧩','🔤','🔷','✨','🏁'],subs=['Start together','Today’s book','Center lesson','Literacy & writing','Math','Tell our story','Reflect & say goodbye'],flow=['community-meeting-week5.html','week5-read-aloud.html','week5-intro-centers.html','week5-small-groups.html','week5-building-blocks.html','week5-storytelling.html','closing-circle-week5.html'],frame=document.getElementById('frame'),custom=document.getElementById('custom'),path=document.getElementById('path'),pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},R='eea-lesson-resume',A='eea-added-lesson-screens',CK=()=>`eea-lesson-complete-${today()}-w${W}-d${day}`;document.getElementById('dayName').textContent=days[day];localStorage.setItem('eea-daily-week',W);localStorage.setItem('eea-daily-day',day);localStorage.setItem('eea-daily-date',today());function data(){try{return JSON.parse(localStorage.getItem(A)||'{}')||{}}catch(e){return{}}}function added(){const x=data()[`w${W}-d${day}-s${section}`];return Array.isArray(x)?x:[]}function res(){try{const r=JSON.parse(localStorage.getItem(R)||'null');return r&&r.date===today()&&+r.week===W&&+r.day===day&&+r.section===section?r:null}catch(e){return null}}function save(){localStorage.setItem(R,JSON.stringify({date:today(),week:W,day,section,mode:cm?'custom':'builtin',customIndex:cm?ci:null}))}function done(){try{const x=JSON.parse(localStorage.getItem(CK())||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function mark(i){const x=done();if(!x.includes(i)){x.push(i);x.sort((a,b)=>a-b);localStorage.setItem(CK(),JSON.stringify(x))}}function draw(){const x=done();path.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===section?'active':''} ${x.includes(i)?'doneStep':''}"><b>${icons[i]} ${n}${x.includes(i)?' ✓':''}</b><span>${subs[i]}</span></button>`).join('');[...path.children].forEach(b=>b.onclick=()=>enter(+b.dataset.i,true));document.getElementById('count').textContent=`${x.length} of 7 complete`}function overview(){save();location.href=`daily-lessons.html?week=${W}&day=${day}&v=${Date.now()}`}function enter(i,start=true){section=Math.max(0,Math.min(6,i));ci=0;cm=start&&added().length>0;load()}function advance(){mark(section);if(section===6){localStorage.removeItem(R);location.href='index.html';return}enter(section+1,true)}function retreat(){if(section===0){overview();return}enter(section-1,false)}async function showCustom(){const list=added();if(!list.length){cm=false;builtin();return}ci=Math.max(0,Math.min(list.length-1,ci));const s=list[ci];custom.classList.add('show');frame.style.display='none';document.getElementById('ck').textContent=`TEACHER ADDED · ${names[section].toUpperCase()}`;const v=document.getElementById('cv');v.innerHTML='';let img='';try{if(s.imageKey)img=await EEAVisualStore.get(s.imageKey)}catch(e){}if(img){const im=document.createElement('img');im.src=img;v.appendChild(im)}else v.textContent=s.visual||'⭐';document.getElementById('ctitle').textContent=s.title||'Teacher Added Screen';document.getElementById('ct').textContent=s.body||'';const pr=document.getElementById('cp');pr.textContent=s.prompt||'';pr.style.display=s.prompt?'block':'none';document.getElementById('ccount').textContent=`Added screen ${ci+1} of ${list.length}`;document.getElementById('cnext').textContent=ci===list.length-1?'Continue to Lesson →':'Next →';const pn=document.getElementById('panel');pn.textContent=s.note||'No teacher note for this screen.';pn.classList.remove('show');save()}document.getElementById('cprev').onclick=()=>{if(ci>0){ci--;showCustom()}else retreat()};document.getElementById('cnext').onclick=()=>{if(ci<added().length-1){ci++;showCustom()}else{cm=false;builtin()}};document.getElementById('note').onclick=()=>document.getElementById('panel').classList.toggle('show');function controls(d){const final=section>=4?d.querySelector('.back'):null;return{next:d.getElementById('next'),prev:d.getElementById('prev'),done:d.getElementById('done')||d.getElementById('doneBtn')||d.querySelector('.done')||final,exit:d.getElementById('closeBtn')||d.getElementById('backBtn')||d.getElementById('exit')}}function state(){try{const f=frame.contentWindow.EEASectionState;return typeof f==='function'?f():null}catch(e){return null}}function sync(d){const c=controls(d),st=state();if(c.prev){let first=section>=2;if(section===0){const cards=[...d.querySelectorAll('.card')],i=cards.findIndex(x=>x.classList.contains('active'));first=i<=0}else if(section===1)first=st?!!st.atStart:!!c.prev.disabled;c.prev.disabled=false;c.prev.dataset.boundary=first?'1':'0';if(first)c.prev.textContent=added().length?'← Added Screen':'← '+(section?names[section-1]:'Day Overview')}if(c.next){let end=section===0?/Done/i.test(c.next.textContent||''):section===1?(st?!!st.atEnd:/Finish Read Aloud/i.test(c.next.textContent||'')):false;c.next.dataset.boundary=end?'1':'0';if(end)c.next.textContent='Next: '+names[section+1]+' →'}if(c.done&&section>=2){c.done.dataset.boundary='1';c.done.textContent=section===6?'Finish Today ✓':'Next: '+names[section+1]+' →'}}async function prep(){let d,w;try{w=frame.contentWindow;d=w.document;if(!d?.body)return}catch(e){return}sync(d);const rs=()=>setTimeout(()=>sync(d),0);w.addEventListener('eea-section-state',rs);d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();if(b.id==='prev'){if(added().length){cm=true;ci=added().length-1;showCustom()}else retreat()}else advance();return}const c=controls(d);if(c.exit&&b===c.exit){e.preventDefault();e.stopImmediatePropagation();overview();return}rs()},true)}function builtin(){custom.classList.remove('show');frame.style.display='block';cm=false;save();const s=flow[section],sep=s.includes('?')?'&':'?';frame.onload=()=>setTimeout(prep,30);frame.src=s+sep+`day=${encodeURIComponent(days[day])}&from=runner&week=${W}&section=${section}&v=${Date.now()}`}function load(){draw();if(cm&&added().length)showCustom();else builtin()}document.getElementById('overview').onclick=overview;document.getElementById('home').onclick=()=>{save();location.href='index.html'};document.getElementById('add').onclick=()=>{save();location.href=`lesson-screen-editor.html?week=${W}&day=${day}&section=${section}`};document.getElementById('manage').onclick=()=>{save();location.href=`lesson-screen-manager.html?week=${W}&day=${day}&section=${section}`};window.addEventListener('pagehide',save);const r=res();if(r&&r.mode==='custom'&&added().length){cm=true;ci=+r.customIndex||0}load()})();</script></body></html>
