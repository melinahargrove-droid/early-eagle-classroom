<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 5 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f6f1e5}.app,.stage{width:100%;height:100%}.stage{background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:1!important;transition:opacity .08s}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Week 5 daily lesson"></iframe></section></main><script>(()=>{const params=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const day=Math.max(0,Math.min(4,Number(params.get('day'))||0));const flow=['community-meeting-week5.html','week5-read-aloud.html','week5-intro-centers.html','week5-foundational.html','week5-small-groups.html','week5-building-blocks.html','week5-storytelling.html','closing-circle-week5.html'];const labels=['Community Meeting','Read Aloud','Intro to Centers','Foundational Literacy','Literacy Small Groups','Building Blocks','Storytelling','Closing Circle'];let section=Math.max(0,Math.min(flow.length-1,Number(params.get('section'))||0));const frame=document.getElementById('frame');localStorage.setItem('eea-daily-week','5');localStorage.setItem('eea-daily-day',String(day));const pad=n=>String(n).padStart(2,'0'),todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},resumeKey='eea-lesson-resume',autoKey='eea-lesson-auto-resume';function saveResume(next){localStorage.setItem(resumeKey,JSON.stringify({date:todayKey(),week:5,day,section:next}))}function clearResume(){localStorage.removeItem(resumeKey);localStorage.removeItem(autoKey)}const overview=()=>location.href=`daily-lessons.html?week=5&day=${day}&v=${Date.now()}`;function advance(){if(section>=flow.length-1){clearResume();location.href='index.html';return}const next=section+1;saveResume(next);if(section===1){localStorage.setItem(autoKey,todayKey());location.href='choose-a-friend.html';return}section=next;load()}function retreat(){if(section<=0){overview();return}section--;load()}function controls(doc){return{next:doc.getElementById('next'),prev:doc.getElementById('prev'),done:doc.getElementById('done')||doc.getElementById('doneBtn')||doc.querySelector('.done')||doc.querySelector('.bottom button:last-child')||doc.querySelector('.back'),exit:doc.getElementById('closeBtn')||doc.getElementById('backBtn')||doc.getElementById('exit')}}function state(){try{const fn=frame.contentWindow.EEASectionState;return typeof fn==='function'?fn():null}catch(e){return null}}function communityState(doc){const cards=[...doc.querySelectorAll('.card')],index=cards.findIndex(c=>c.classList.contains('active'));return{index:index<0?0:index,total:cards.length}}function centersState(doc){const label=doc.getElementById('eye')?.textContent||'',match=label.match(/(\d+)\s+OF\s+(\d+)/i);return match?{index:Number(match[1])-1,total:Number(match[2])}:{index:0,total:1}}function smallGroupLesson(doc){return !!(doc.getElementById('done')||doc.getElementById('doneBtn'))&&/Small Group/i.test(doc.title||'')}function boundary(btn,type,on){if(btn)btn.dataset.eeaBoundary=on?type:''}function sync(doc){const c=controls(doc);[c.next,c.prev,c.done].forEach(b=>{if(b)b.dataset.eeaBoundary=''});if(section===0){const s=communityState(doc);if(c.prev){c.prev.disabled=false;boundary(c.prev,'back',s.index===0);c.prev.textContent=s.index===0?'← Day Overview':'← Previous'}if(c.next){const end=s.total>0&&s.index===s.total-1;boundary(c.next,'forward',end);if(end)c.next.textContent='Next: Read Aloud →'}return}if(section===1){const s=state();if(c.prev&&s){c.prev.disabled=false;boundary(c.prev,'back',!!s.atStart);c.prev.textContent=s.atStart?'← Community Meeting':'← Previous'}if(c.next&&s){boundary(c.next,'forward',!!s.atEnd);if(s.atEnd)c.next.textContent='Finish Read Aloud → Choose a Friend'}return}if(section===2){const s=centersState(doc);if(c.prev){c.prev.disabled=false;boundary(c.prev,'back',s.index===0);c.prev.textContent=s.index===0?'← Read Aloud':'← Previous Center'}if(c.done){const end=s.index===s.total-1;boundary(c.done,'forward',end);if(end)c.done.textContent='Next: Foundational Literacy →'}return}if(section===4&&!smallGroupLesson(doc))return;if(c.done){boundary(c.done,section===flow.length-1?'finish':'forward',true);c.done.textContent=section===flow.length-1?'Finish Today ✓':'Next: '+labels[section+1]+' →'}}async function waitForVisuals(){try{const win=frame.contentWindow,doc=win.document;if(section===0){if(win.EEAVisualsReady)await win.EEAVisualsReady;return}if(section>=2){let script=doc.getElementById('eeaLessonVisualEdit');if(!script){script=doc.createElement('script');script.id='eeaLessonVisualEdit';script.src='lesson-visual-edit.js?v=20260823-1054';await new Promise(resolve=>{script.onload=resolve;script.onerror=resolve;doc.head.appendChild(script)})}if(win.EEAVisualsReady)await win.EEAVisualsReady}}catch(e){}}async function prepare(){let doc,win;try{win=frame.contentWindow;doc=win.document;if(!doc?.body)return}catch(e){return}sync(doc);const resync=()=>setTimeout(()=>sync(doc),0);win.addEventListener('eea-section-state',resync);doc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset.eeaBoundary;if(x){e.preventDefault();e.stopImmediatePropagation();if(x==='back')retreat();else if(x==='finish'){clearResume();location.href='index.html'}else advance();return}const c=controls(doc);if(c.exit&&b===c.exit){e.preventDefault();e.stopImmediatePropagation();overview();return}resync()},true);await waitForVisuals();sync(doc);frame.style.opacity=1}function load(){frame.style.opacity=0;const sep=flow[section].includes('?')?'&':'?';frame.src=`${flow[section]}${sep}day=${encodeURIComponent(days[day])}&from=runner&week=5&section=${section}&v=${Date.now()}`}frame.addEventListener('load',()=>setTimeout(prepare,30));load()})();</script></body></html>
