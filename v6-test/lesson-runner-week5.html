<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 5 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f6f1e5}.app,.stage{width:100%;height:100%}.stage{background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .08s}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Week 5 daily lesson"></iframe></section></main><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(6,Number(p.get('section'))||0));const flow=['community-meeting-week5.html','week5-read-aloud.html','week5-intro-centers.html','week5-small-groups.html','week5-building-blocks.html','week5-storytelling.html','closing-circle-week5.html'];const frame=document.getElementById('frame');localStorage.setItem('eea-daily-week','5');localStorage.setItem('eea-daily-day',String(day));function overview(){location.href=`daily-lessons.html?week=5&day=${day}&v=${Date.now()}`}function advance(){if(section>=6){location.href='index.html';return}section++;load()}function retreat(){if(section===0){overview();return}section--;load()}function activeCommunityIndex(d){const cards=[...d.querySelectorAll('.card')];const i=cards.findIndex(c=>c.classList.contains('active'));return i<0?0:i}function readStopVisible(d){const s=d.getElementById('stop');return !!s&&s.classList.contains('show')}function prepare(){let d;try{d=frame.contentWindow.document;if(!d?.body)return}catch(e){return}const next=d.getElementById('next'),prev=d.getElementById('prev');const done=d.getElementById('done')||d.querySelector('.done')||((section===4||section===5||section===6)?d.querySelector('.bottom button:last-child'):null);const exit=d.getElementById('closeBtn')||d.getElementById('backBtn');function sync(){if(section===0&&prev){const first=activeCommunityIndex(d)===0;prev.disabled=false;prev.dataset.boundary=first?'1':'0';prev.textContent=first?'← Day Overview':'← Previous'}if(section===0&&next&&/Done/i.test(next.textContent||'')){next.dataset.boundary='1';next.textContent='Next: Read Aloud →'}if(section===1&&prev){const first=/Slide\s+1\s+of/i.test(d.getElementById('count')?.textContent||'')&&!readStopVisible(d);prev.disabled=false;prev.dataset.boundary=first?'1':'0';prev.textContent=first?'← Community Meeting':'← Previous'}if(section===1&&next&&/Finish Read Aloud/i.test(next.textContent||'')){next.dataset.boundary='1';next.textContent='Next: Centers →'}if(section===2&&done)done.textContent='Next: Small Groups →';if(section===3&&done)done.textContent='Next: Building Blocks →';if(section===4&&done)done.textContent='Next: Storytelling →';if(section===5&&done)done.textContent='Next: Closing Circle →';if(section===6&&done)done.textContent='Finish Today ✓'}sync();d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='prev'&&b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();retreat();return}if(b.id==='next'&&b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();advance();return}if(done&&b===done&&section>=2){e.preventDefault();e.stopImmediatePropagation();section===6?location.href='index.html':advance();return}if(exit&&b===exit){e.preventDefault();e.stopImmediatePropagation();overview();return}setTimeout(sync,0)},true);frame.style.opacity=1}function load(){frame.style.opacity=0;frame.src=`${flow[section]}?day=${encodeURIComponent(days[day])}&from=runner&week=5&section=${section}&v=${Date.now()}`}frame.addEventListener('load',()=>setTimeout(prepare,30),{once:true})}frame.addEventListener('load',()=>setTimeout(prepare,30));load()})();</script></body></html>
