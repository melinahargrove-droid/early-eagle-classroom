<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 3 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f6f1e5}.app{width:100%;height:100%;padding:0;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.stage{width:100%;height:100vh;background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .08s}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Daily lesson"></iframe></section></main><script>(()=>{const p=new URLSearchParams(location.search),day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(5,Number(p.get('section'))||0)),landing=p.get('landing')==='end'?'end':'start';const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const flow=['community-meeting-week3.html','week3-read-aloud.html','week3-intro-centers.html','week3-small-groups.html','week3-storytelling.html','closing-circle-week3.html'];const frame=document.getElementById('frame');localStorage.setItem('eea-daily-week','3');localStorage.setItem('eea-daily-day',String(day));const key=()=>`eea-complete-w3-d${day}`;function completed(){try{const a=JSON.parse(localStorage.getItem(key())||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function mark(i){const c=completed();if(!c.includes(i)){c.push(i);localStorage.setItem(key(),JSON.stringify(c))}}function overview(){location.href=`daily-lessons.html?week=3&day=${day}&v=${Date.now()}`}function jump(i,end=false){section=Math.max(0,Math.min(5,i));landing=end?'end':'start';localStorage.setItem('eea-daily-section',String(section));load()}function advance(){mark(section);if(section===5){location.href='index.html';return}jump(section+1)}function retreat(){if(section===0){overview();return}jump(section-1,true)}function activeCommunityIndex(d){const cards=[...d.querySelectorAll('.card')];const i=cards.findIndex(c=>c.classList.contains('active'));return i<0?0:i}function moveEnd(d){if(section===0){const next=d.getElementById('next');let g=0;while(next&&g++<30&&!/Done/i.test(next.textContent||''))next.click()}else if(section===1){const next=d.getElementById('next');let g=0;while(next&&g++<100&&!/Finish Read Aloud/i.test(next.textContent||''))next.click()}else if(section===2){const next=d.getElementById('next');let g=0;while(next&&next.style.display!=='none'&&g++<10)next.click()}}async function ensureVisuals(w,d){try{if(section===0){if(w.EEAVisualsReady)await w.EEAVisualsReady;return}if(section>=2){let s=d.getElementById('eeaLessonVisualEdit');if(!s){s=d.createElement('script');s.id='eeaLessonVisualEdit';s.src='lesson-visual-edit.js?v=20260823-1054';await new Promise(resolve=>{s.onload=resolve;s.onerror=resolve;d.head.appendChild(s)})}if(w.EEAVisualsReady)await w.EEAVisualsReady}}catch(e){}}async function prepare(){let w,d;try{w=frame.contentWindow;d=w.document;if(!d?.body)return}catch(e){return}if(landing==='end')moveEnd(d);landing='start';const prev=d.getElementById('prev'),next=d.getElementById('next'),done=d.getElementById('done')||d.getElementById('doneBtn'),exit=d.getElementById('exit')||d.getElementById('closeBtn')||d.getElementById('backBtn');function readState(){try{return typeof w.EEASectionState==='function'?w.EEASectionState():null}catch(e){return null}}function sync(){if(section===0&&prev){const first=activeCommunityIndex(d)===0;prev.disabled=false;prev.dataset.boundary=first?'1':'0';prev.textContent=first?'← Day Overview':'← Previous'}if(section===1&&prev){const st=readState();const first=st?!!st.atStart:/Slide\s+1\s+of/i.test(d.getElementById('count')?.textContent||'');prev.dataset.boundary=first?'1':'0';prev.disabled=false;prev.textContent=first?'← Community Meeting':'← Previous'}if(section===1&&next){const st=readState();const final=st?!!st.atEnd:/Finish Read Aloud/i.test(next.textContent||'');next.dataset.boundary=final?'1':'0';if(final)next.textContent='Next: Centers →'}if(section===0&&next&&/Done/i.test(next.textContent||'')){next.dataset.boundary='1';next.textContent='Next: Read Aloud →'}}sync();d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='prev'&&b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();retreat();return}if(b.id==='next'&&b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();advance();return}if((b.id==='done'||b.id==='doneBtn')&&section>=2){e.preventDefault();e.stopImmediatePropagation();advance();return}if(['exit','closeBtn','backBtn'].includes(b.id)){e.preventDefault();e.stopImmediatePropagation();overview();return}setTimeout(sync,0)},true);if(section===1){w.addEventListener('eea-section-state',()=>setTimeout(sync,0))}if(done&&section>=2)done.onclick=e=>{e.preventDefault();advance()};if(exit)exit.onclick=e=>{e.preventDefault();overview()};await ensureVisuals(w,d);setTimeout(sync,40);frame.style.opacity=1}function load(){frame.style.opacity=0;let src=flow[section];const join=src.includes('?')?'&':'?';src+=join+`day=${encodeURIComponent(days[day])}&eeaRunner=1&week=3&dayIndex=${day}&section=${section}&landing=${landing}&v=${Date.now()}`;frame.src=src}frame.addEventListener('load',()=>setTimeout(()=>prepare(),30));load()})();</script></body></html>
