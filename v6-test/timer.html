<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Timer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#f7f1e7}
button{font:inherit}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:url("assets/timer%20background.png") center/cover no-repeat}
.close{position:absolute;z-index:40;top:2.1vh;right:2vw;width:clamp(48px,3.5vw,66px);aspect-ratio:1;border-radius:50%;border:1.4px solid rgba(67,99,118,.36);background:rgba(255,253,247,.92);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900;cursor:pointer}
.header{position:absolute;z-index:20;top:2.3vh;left:50%;transform:translateX(-50%);width:min(72vw,1320px);text-align:center}
h1{margin:0;font-size:clamp(44px,4.25vw,80px);line-height:1;font-weight:900;color:#173f72;text-shadow:0 2px 0 rgba(255,255,255,.72)}
.subtitle{margin-top:.8vh;font-size:clamp(18px,1.4vw,27px);font-weight:800;color:#5c715d;text-shadow:0 1px 0 rgba(255,255,255,.75)}

.timer-wrap{position:absolute;z-index:15;left:50%;top:15.8vh;transform:translateX(-50%);width:min(37vw,565px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.timer-disc{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 7px 13px rgba(50,75,84,.07))}
.timer-base,.timer-fill{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.timer-fill{transform:scale(var(--front-scale,1)) rotate(var(--front-rotation,0deg));transform-origin:50% 50%}
.timer-fill-mask{position:absolute;inset:0;--elapsed:0%;-webkit-mask-image:conic-gradient(from -90deg,transparent 0 var(--elapsed),rgba(0,0,0,.32) calc(var(--elapsed) + .35%),#000 calc(var(--elapsed) + .9%) 100%);mask-image:conic-gradient(from -90deg,transparent 0 var(--elapsed),rgba(0,0,0,.32) calc(var(--elapsed) + .35%),#000 calc(var(--elapsed) + .9%) 100%);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.timer-fill-mask.done{-webkit-mask-image:none;mask-image:none;opacity:0}
.time{position:relative;z-index:4;font-family:"Arial Rounded MT Bold",Arial,sans-serif;font-size:clamp(76px,7vw,136px);font-weight:900;letter-spacing:-.035em;color:#173f72;text-shadow:0 2px 0 rgba(255,255,255,.72)}

.adjust-panel{position:absolute;z-index:50;left:1.2vw;top:16vh;width:clamp(220px,15vw,280px);padding:14px 16px 15px;border-radius:20px;border:1.2px solid rgba(75,106,124,.28);background:rgba(255,252,244,.92);box-shadow:0 4px 14px rgba(38,63,76,.10);color:#173f72}
.adjust-panel h2{margin:0 0 10px;text-align:center;font-size:clamp(17px,1.15vw,22px);line-height:1.1}
.adjust-control{margin-top:10px}.adjust-control label{display:block;font-size:clamp(13px,.9vw,17px);font-weight:900;margin-bottom:3px}.adjust-control input{width:100%;accent-color:#4e9bd2}.adjust-value{text-align:center;margin-top:2px;font-family:Arial,sans-serif;font-size:13px;color:#557082}
.reset-adjust{width:100%;margin-top:12px;padding:8px 10px;border-radius:12px;border:1px solid rgba(75,106,124,.30);background:rgba(255,255,255,.72);color:#173f72;font-weight:900;cursor:pointer}

.quick-row{position:absolute;z-index:20;left:50%;bottom:16.4vh;transform:translateX(-50%);display:flex;gap:clamp(9px,.8vw,15px)}
.quick{width:clamp(72px,5.6vw,106px);height:clamp(64px,7vh,82px);border-radius:16px;border:1.2px solid rgba(91,119,136,.26);background:rgba(255,252,244,.90);color:#173f72;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(45,75,100,.055);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.quick strong{font-size:clamp(22px,1.65vw,32px)}.quick span{margin-top:4px;font-size:clamp(11px,.78vw,15px)}
.quick.active{background:linear-gradient(180deg,rgba(224,238,244,.98),rgba(190,216,229,.94));border-color:rgba(86,131,156,.36)}
.quick:disabled{cursor:default;opacity:.62}
.controls{position:absolute;z-index:20;left:50%;bottom:5.3vh;transform:translateX(-50%);display:flex;gap:clamp(13px,1vw,20px);align-items:center}
.control{height:clamp(56px,6.2vh,72px);min-width:clamp(126px,9.6vw,176px);padding:0 1.25vw;border-radius:19px;border:1.15px solid rgba(93,126,144,.26);color:#173f72;font-weight:900;font-size:clamp(18px,1.25vw,24px);cursor:pointer;box-shadow:0 3px 8px rgba(55,69,74,.045)}
.control.start{background:linear-gradient(180deg,rgba(226,237,216,.97),rgba(192,214,184,.94))}
.control.pause{background:linear-gradient(180deg,rgba(249,234,200,.97),rgba(232,208,166,.94))}
.control.stop{background:linear-gradient(180deg,rgba(244,216,206,.97),rgba(226,190,181,.94))}
.control:disabled{opacity:.52;cursor:default}
button:not(:disabled):hover{filter:brightness(1.02)}button:not(:disabled):active{transform:scale(.97)}
@media(max-height:760px){.timer-wrap{top:15vh;width:min(34vw,510px)}.quick-row{bottom:15.2vh}.controls{bottom:3.7vh}}
</style>
</head>
<body>
<main class="stage">
  <button class="close" type="button" aria-label="Close" onclick="window.location.href='index.html'">×</button>
  <header class="header">
    <h1>Classroom Timer</h1>
    <div class="subtitle" id="subtitle">Choose a time, then press Start.</div>
  </header>

  <aside class="adjust-panel" aria-label="Timer image adjustment controls">
    <h2>Blue Timer Image</h2>
    <div class="adjust-control">
      <label for="frontScale">Size</label>
      <input id="frontScale" type="range" min="70" max="110" step="1" value="100">
      <div class="adjust-value" id="frontScaleValue">100%</div>
    </div>
    <div class="adjust-control">
      <label for="frontRotation">Rotate</label>
      <input id="frontRotation" type="range" min="-180" max="180" step="1" value="0">
      <div class="adjust-value" id="frontRotationValue">0°</div>
    </div>
    <button class="reset-adjust" id="resetFrontAdjust" type="button">Reset Image</button>
  </aside>

  <section class="timer-wrap" aria-label="Classroom timer">
    <div class="timer-disc">
      <img class="timer-base" src="../timer%20back.png" alt="">
      <div class="timer-fill-mask" id="timerFillMask">
        <img class="timer-fill" id="timerFrontImage" src="../timer%20front.png" alt="">
      </div>
      <div class="time" id="timeDisplay">5:00</div>
    </div>
  </section>

  <div class="quick-row" aria-label="Quick timer choices">
    <button class="quick" data-minutes="1"><strong>1</strong><span>min</span></button>
    <button class="quick" data-minutes="3"><strong>3</strong><span>min</span></button>
    <button class="quick active" data-minutes="5"><strong>5</strong><span>min</span></button>
    <button class="quick" data-minutes="10"><strong>10</strong><span>min</span></button>
    <button class="quick" data-minutes="15"><strong>15</strong><span>min</span></button>
  </div>

  <div class="controls" aria-label="Timer controls">
    <button class="control start" id="startBtn" type="button">▶ Start</button>
    <button class="control pause" id="pauseBtn" type="button" disabled>Ⅱ Pause</button>
    <button class="control stop" id="stopBtn" type="button">■ Stop</button>
  </div>
</main>
<script>
(()=>{
  const display=document.getElementById('timeDisplay');
  const fillMask=document.getElementById('timerFillMask');
  const timerFrontImage=document.getElementById('timerFrontImage');
  const subtitle=document.getElementById('subtitle');
  const startBtn=document.getElementById('startBtn');
  const pauseBtn=document.getElementById('pauseBtn');
  const stopBtn=document.getElementById('stopBtn');
  const quickButtons=[...document.querySelectorAll('.quick')];
  const frontScale=document.getElementById('frontScale');
  const frontRotation=document.getElementById('frontRotation');
  const frontScaleValue=document.getElementById('frontScaleValue');
  const frontRotationValue=document.getElementById('frontRotationValue');
  const resetFrontAdjust=document.getElementById('resetFrontAdjust');

  let selectedSeconds=5*60;
  let remainingMs=selectedSeconds*1000;
  let running=false;
  let lastStamp=0;
  let frame=null;

  function updateFrontImage(){
    const scale=Number(frontScale.value)/100;
    const rotation=Number(frontRotation.value);
    timerFrontImage.style.setProperty('--front-scale',scale);
    timerFrontImage.style.setProperty('--front-rotation',`${rotation}deg`);
    frontScaleValue.textContent=`${frontScale.value}%`;
    frontRotationValue.textContent=`${rotation}°`;
  }
  frontScale.addEventListener('input',updateFrontImage);
  frontRotation.addEventListener('input',updateFrontImage);
  resetFrontAdjust.addEventListener('click',()=>{
    frontScale.value=100;
    frontRotation.value=0;
    updateFrontImage();
  });

  function format(ms){
    const total=Math.max(0,Math.ceil(ms/1000));
    return `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
  }

  function paint(){
    display.textContent=format(remainingMs);
    const total=selectedSeconds*1000;
    const elapsed=total ? Math.min(100,Math.max(0,(1-remainingMs/total)*100)) : 100;
    fillMask.style.setProperty('--elapsed',`${elapsed}%`);
    fillMask.classList.toggle('done',remainingMs<=0);
  }

  function setRunningUI(isRunning){
    quickButtons.forEach(b=>b.disabled=isRunning || remainingMs<selectedSeconds*1000);
    pauseBtn.disabled=!isRunning;
    startBtn.textContent=isRunning?'▶ Running':(remainingMs<selectedSeconds*1000 && remainingMs>0?'▶ Resume':'▶ Start');
    startBtn.disabled=isRunning || remainingMs<=0;
  }

  function tick(stamp){
    if(!running)return;
    if(!lastStamp)lastStamp=stamp;
    const delta=stamp-lastStamp;
    lastStamp=stamp;
    remainingMs=Math.max(0,remainingMs-delta);
    paint();
    if(remainingMs<=0){
      running=false;
      lastStamp=0;
      subtitle.textContent="Time's up!";
      setRunningUI(false);
      return;
    }
    frame=requestAnimationFrame(tick);
  }

  quickButtons.forEach(button=>button.addEventListener('click',()=>{
    if(running)return;
    quickButtons.forEach(b=>b.classList.remove('active'));
    button.classList.add('active');
    selectedSeconds=Number(button.dataset.minutes)*60;
    remainingMs=selectedSeconds*1000;
    subtitle.textContent='Choose a time, then press Start.';
    fillMask.classList.remove('done');
    paint();
    setRunningUI(false);
  }));

  startBtn.addEventListener('click',()=>{
    if(running || remainingMs<=0)return;
    running=true;
    lastStamp=0;
    subtitle.textContent='Timer is running.';
    setRunningUI(true);
    frame=requestAnimationFrame(tick);
  });

  pauseBtn.addEventListener('click',()=>{
    if(!running)return;
    running=false;
    lastStamp=0;
    if(frame)cancelAnimationFrame(frame);
    subtitle.textContent='Timer paused.';
    setRunningUI(false);
  });

  stopBtn.addEventListener('click',()=>{
    running=false;
    lastStamp=0;
    if(frame)cancelAnimationFrame(frame);
    remainingMs=selectedSeconds*1000;
    subtitle.textContent='Choose a time, then press Start.';
    fillMask.classList.remove('done');
    paint();
    setRunningUI(false);
  });

  updateFrontImage();
  paint();
  setRunningUI(false);
})();
</script>
</body>
</html>
