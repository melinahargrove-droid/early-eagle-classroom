<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Timer</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#f7f1e7}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:url("assets/timer%20background.png") center/cover no-repeat}.close{position:absolute;z-index:40;top:2.1vh;right:2vw;width:clamp(48px,3.5vw,66px);aspect-ratio:1;border-radius:50%;border:1.4px solid rgba(67,99,118,.36);background:rgba(255,253,247,.92);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900}.header{position:absolute;z-index:20;top:2.3vh;left:50%;transform:translateX(-50%);width:min(72vw,1320px);text-align:center}h1{margin:0;font-size:clamp(44px,4.25vw,80px);line-height:1}.subtitle{margin-top:.8vh;font-size:clamp(18px,1.4vw,27px);font-weight:800;color:#5c715d}.timer-wrap{position:absolute;z-index:15;left:50%;top:15.8vh;transform:translateX(-50%);width:min(37vw,565px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}.timer-disc{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}.timer-base,.timer-fill{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.timer-fill{transform:scale(.94) rotate(20deg)}.timer-fill-mask{position:absolute;inset:0;--elapsed:0%;mask-image:conic-gradient(from 0deg,transparent 0 var(--elapsed),#000 calc(var(--elapsed) + .9%) 100%)}.timer-fill-mask.done{opacity:0}.time{position:relative;z-index:4;font-family:Arial,sans-serif;font-size:clamp(76px,7vw,136px);font-weight:900}.quick-row{position:absolute;z-index:20;left:50%;bottom:15.2vh;transform:translate(-50%,46px);display:flex;gap:8px}.quick{width:clamp(96px,7.5vw,144px);height:clamp(68px,7.8vh,94px);border:0;background:transparent url("assets/timer%20buttons.png") no-repeat;background-size:500% 200%;font-size:0}.quick[data-minutes="1"]{background-position:0 0}.quick[data-minutes="3"]{background-position:25% 0}.quick[data-minutes="5"]{background-position:50% 0}.quick[data-minutes="10"]{background-position:75% 0}.quick[data-minutes="15"]{background-position:100% 0}.quick.active{transform:scale(1.07)}.controls{position:absolute;z-index:20;left:50%;bottom:3.2vh;transform:translate(-50%,20px);display:flex;gap:14px}.control{width:clamp(170px,13vw,248px);height:clamp(72px,8.8vh,105px);border:0;background:transparent url("assets/timer%20buttons.png") no-repeat;background-size:300% 200%;font-size:0}.control.start{background-position:0 100%}.control.pause{background-position:50% 100%}.control.stop{background-position:100% 100%}.control:disabled,.quick:disabled{opacity:.45}</style></head><body><main class="stage"><button class="close" onclick="location.href='index.html'">×</button><header class="header"><h1>Classroom Timer</h1><div class="subtitle" id="subtitle">Choose a time, then press Start.</div></header><section class="timer-wrap"><div class="timer-disc"><img class="timer-base" src="../timer%20back.png"><div class="timer-fill-mask" id="timerFillMask"><img class="timer-fill" src="../timer%20front.png"></div><div class="time" id="timeDisplay">5:00</div></div></section><div class="quick-row"><button class="quick" data-minutes="1"></button><button class="quick" data-minutes="3"></button><button class="quick active" data-minutes="5"></button><button class="quick" data-minutes="10"></button><button class="quick" data-minutes="15"></button></div><div class="controls"><button class="control start" id="startBtn"></button><button class="control pause" id="pauseBtn" disabled></button><button class="control stop" id="stopBtn"></button></div></main><script>(()=>{const display=document.getElementById('timeDisplay'),fill=document.getElementById('timerFillMask'),subtitle=document.getElementById('subtitle'),start=document.getElementById('startBtn'),pause=document.getElementById('pauseBtn'),stop=document.getElementById('stopBtn'),quick=[...document.querySelectorAll('.quick')];let selected=300,remaining=300000,running=false,last=0,frame=null,audioCtx=null,cleanupLaunching=false;function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}function paint(){display.textContent=fmt(remaining);fill.style.setProperty('--elapsed',`${Math.min(100,Math.max(0,(1-remaining/(selected*1000))*100))}%`);fill.classList.toggle('done',remaining<=0)}function ui(){quick.forEach(b=>b.disabled=running||remaining<selected*1000);pause.disabled=!running;start.disabled=running||remaining<=0}async function chime(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();const now=audioCtx.currentTime;[659,784,988].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,now+i*.2);g.gain.exponentialRampToValueAtTime(.2,now+i*.2+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.2+.8);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.2);o.stop(now+i*.2+.85)})}catch(e){}}function launchCleanup(){if(cleanupLaunching)return;cleanupLaunching=true;setTimeout(()=>{location.href='clean-up-song.html?autoplay=1&from=classroom-timer'},700)}function tick(t){if(!running)return;if(!last)last=t;remaining=Math.max(0,remaining-(t-last));last=t;paint();if(remaining<=0){running=false;last=0;subtitle.textContent="Time's up! Clean up time!";chime();ui();launchCleanup();return}frame=requestAnimationFrame(tick)}quick.forEach(b=>b.onclick=()=>{if(running)return;quick.forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=+b.dataset.minutes*60;remaining=selected*1000;cleanupLaunching=false;subtitle.textContent='Choose a time, then press Start.';paint();ui()});start.onclick=()=>{if(running||remaining<=0)return;running=true;last=0;cleanupLaunching=false;subtitle.textContent=remaining===selected*1000?'The timer has started.':'Timer resumed.';ui();frame=requestAnimationFrame(tick)};pause.onclick=()=>{running=false;last=0;if(frame)cancelAnimationFrame(frame);subtitle.textContent='Timer paused.';ui()};stop.onclick=()=>{running=false;last=0;cleanupLaunching=false;if(frame)cancelAnimationFrame(frame);remaining=selected*1000;subtitle.textContent='Choose a time, then press Start.';paint();ui()};paint();ui()})();</script></body></html>
