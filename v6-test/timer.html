<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Timer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#f7f1e7}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:url("assets/timer%20background.png") center/cover no-repeat}.close{position:absolute;z-index:40;top:2.1vh;right:2vw;width:clamp(48px,3.5vw,66px);aspect-ratio:1;border-radius:50%;border:1.4px solid rgba(67,99,118,.36);background:rgba(255,253,247,.92);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900;cursor:pointer}.header{position:absolute;z-index:20;top:2.3vh;left:50%;transform:translateX(-50%);width:min(72vw,1320px);text-align:center}h1{margin:0;font-size:clamp(44px,4.25vw,80px);line-height:1;font-weight:900;color:#173f72;text-shadow:0 2px 0 rgba(255,255,255,.72)}.subtitle{margin-top:.8vh;font-size:clamp(18px,1.4vw,27px);font-weight:800;color:#5c715d;text-shadow:0 1px 0 rgba(255,255,255,.75)}.timer-wrap{position:absolute;z-index:15;left:50%;top:15.8vh;transform:translateX(-50%);width:min(37vw,565px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}.timer-disc{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 7px 13px rgba(50,75,84,.07))}.timer-base,.timer-fill{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.timer-fill{transform:scale(.94) rotate(20deg);transform-origin:50% 50%}.timer-fill-mask{position:absolute;inset:0;--elapsed:0%;-webkit-mask-image:conic-gradient(from 0deg at 50% 50%,transparent 0 var(--elapsed),rgba(0,0,0,.32) calc(var(--elapsed) + .35%),#000 calc(var(--elapsed) + .9%) 100%);mask-image:conic-gradient(from 0deg at 50% 50%,transparent 0 var(--elapsed),rgba(0,0,0,.32) calc(var(--elapsed) + .35%),#000 calc(var(--elapsed) + .9%) 100%)}.timer-fill-mask.done{-webkit-mask-image:none;mask-image:none;opacity:0}.time{position:relative;z-index:4;font-family:"Arial Rounded MT Bold",Arial,sans-serif;font-size:clamp(76px,7vw,136px);font-weight:900;letter-spacing:-.035em;color:#173f72;text-shadow:0 2px 0 rgba(255,255,255,.72)}.quick-row{position:absolute;z-index:20;left:50%;bottom:15.2vh;transform:translate(-50%,46px);display:flex;gap:clamp(4px,.5vw,10px);align-items:center}.quick{width:clamp(96px,7.5vw,144px);height:clamp(68px,7.8vh,94px);padding:0;border:0;background-color:transparent;background-image:url("assets/timer%20buttons.png");background-repeat:no-repeat;background-size:500% 200%;cursor:pointer;color:transparent;font-size:0;filter:drop-shadow(0 3px 4px rgba(49,73,90,.08));transition:transform .12s ease,filter .12s ease,opacity .12s ease}.quick[data-minutes="1"]{background-position:0% 0%}.quick[data-minutes="3"]{background-position:25% 0%}.quick[data-minutes="5"]{background-position:50% 0%}.quick[data-minutes="10"]{background-position:75% 0%}.quick[data-minutes="15"]{background-position:100% 0%}.quick.active{transform:scale(1.07);filter:drop-shadow(0 4px 6px rgba(37,92,132,.24))}.quick:disabled{cursor:default;opacity:.58}.controls{position:absolute;z-index:20;left:50%;bottom:3.2vh;transform:translate(-50%,20px);display:flex;gap:clamp(8px,.8vw,16px);align-items:center}.control{width:clamp(170px,13vw,248px);height:clamp(72px,8.8vh,105px);padding:0;border:0;background-color:transparent;background-image:url("assets/timer%20buttons.png");background-repeat:no-repeat;background-size:300% 200%;cursor:pointer;color:transparent;font-size:0;filter:drop-shadow(0 4px 5px rgba(49,73,90,.10));transition:transform .12s ease,filter .12s ease,opacity .12s ease}.control.start{background-position:0% 100%}.control.pause{background-position:50% 100%}.control.stop{background-position:100% 100%}.control:disabled{opacity:.45;cursor:default}button:not(:disabled):active{transform:scale(.97)}.quick.active:not(:disabled):active{transform:scale(1.02)}@media(max-height:760px){.timer-wrap{top:15vh;width:min(34vw,510px)}.quick-row{bottom:14.5vh}.controls{bottom:2.2vh}}
</style>
</head>
<body>
<main class="stage">
<button class="close" type="button" aria-label="Close" onclick="location.href='index.html'">×</button>
<header class="header"><h1>Classroom Timer</h1><div class="subtitle" id="subtitle">Choose a time, then press Start.</div></header>
<section class="timer-wrap"><div class="timer-disc"><img class="timer-base" src="../timer%20back.png" alt=""><div class="timer-fill-mask" id="timerFillMask"><img class="timer-fill" src="../timer%20front.png" alt=""></div><div class="time" id="timeDisplay">5:00</div></div></section>
<div class="quick-row"><button class="quick" data-minutes="1" aria-label="1 minute"></button><button class="quick" data-minutes="3" aria-label="3 minutes"></button><button class="quick active" data-minutes="5" aria-label="5 minutes"></button><button class="quick" data-minutes="10" aria-label="10 minutes"></button><button class="quick" data-minutes="15" aria-label="15 minutes"></button></div>
<div class="controls"><button class="control start" id="startBtn" type="button" aria-label="Start timer"></button><button class="control pause" id="pauseBtn" type="button" aria-label="Pause timer" disabled></button><button class="control stop" id="stopBtn" type="button" aria-label="Stop timer"></button></div>
</main>
<script>
(()=>{
const display=document.getElementById('timeDisplay'),fillMask=document.getElementById('timerFillMask'),subtitle=document.getElementById('subtitle'),startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn'),stopBtn=document.getElementById('stopBtn'),quickButtons=[...document.querySelectorAll('.quick')];
let selectedSeconds=300,remainingMs=300000,running=false,lastStamp=0,frame=null,audioCtx=null,lastAnnouncementAt=0,startInProgress=false;
function format(ms){const total=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`}
function paint(){display.textContent=format(remainingMs);const total=selectedSeconds*1000;const elapsed=total?Math.min(100,Math.max(0,(1-remainingMs/total)*100)):100;fillMask.style.setProperty('--elapsed',`${elapsed}%`);fillMask.classList.toggle('done',remainingMs<=0)}
function setRunningUI(isRunning){quickButtons.forEach(b=>b.disabled=isRunning||remainingMs<selectedSeconds*1000);pauseBtn.disabled=!isRunning;startBtn.disabled=isRunning||startInProgress||remainingMs<=0}
async function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx.state==='running'}catch(e){return false}}
function announceStarted(){if(!('speechSynthesis' in window))return;const now=Date.now();if(now-lastAnnouncementAt<2000)return;lastAnnouncementAt=now;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('The timer has started.');u.rate=.92;u.pitch=1;u.volume=1;const voices=speechSynthesis.getVoices();const preferred=voices.find(v=>/Microsoft Zira|Aria|Jenny|Ava|Samantha|Google US English/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang));if(preferred)u.voice=preferred;speechSynthesis.speak(u)}catch(e){}}
async function playFinishChime(){try{const ok=await ensureAudio();if(!ok||!audioCtx)return;const now=audioCtx.currentTime+.02;const master=audioCtx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.72,now+.03);master.gain.setValueAtTime(.72,now+.75);master.gain.exponentialRampToValueAtTime(.0001,now+3.2);master.connect(audioCtx.destination);[[659.25,0],[783.99,.34],[987.77,.72]].forEach(([freq,offset])=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,now+offset);gain.gain.setValueAtTime(.0001,now+offset);gain.gain.exponentialRampToValueAtTime(.92,now+offset+.02);gain.gain.setValueAtTime(.72,now+offset+.42);gain.gain.exponentialRampToValueAtTime(.0001,now+offset+2.15);osc.connect(gain);gain.connect(master);osc.start(now+offset);osc.stop(now+offset+2.2)})}catch(e){}}
function tick(stamp){if(!running)return;if(!lastStamp)lastStamp=stamp;remainingMs=Math.max(0,remainingMs-(stamp-lastStamp));lastStamp=stamp;paint();if(remainingMs<=0){running=false;lastStamp=0;subtitle.textContent="Time's up!";playFinishChime();setRunningUI(false);return}frame=requestAnimationFrame(tick)}
quickButtons.forEach(button=>button.addEventListener('click',()=>{if(running||startInProgress)return;quickButtons.forEach(b=>b.classList.remove('active'));button.classList.add('active');selectedSeconds=Number(button.dataset.minutes)*60;remainingMs=selectedSeconds*1000;subtitle.textContent='Choose a time, then press Start.';fillMask.classList.remove('done');paint();setRunningUI(false)}));
startBtn.addEventListener('click',async()=>{if(running||startInProgress||remainingMs<=0)return;const isFresh=remainingMs===selectedSeconds*1000;startInProgress=true;running=true;lastStamp=0;subtitle.textContent=isFresh?'The timer has started.':'Timer resumed.';setRunningUI(true);await ensureAudio();startInProgress=false;setRunningUI(true);if(isFresh)announceStarted();frame=requestAnimationFrame(tick)});
pauseBtn.addEventListener('click',()=>{if(!running)return;running=false;startInProgress=false;lastStamp=0;if(frame)cancelAnimationFrame(frame);subtitle.textContent='Timer paused.';setRunningUI(false)});
stopBtn.addEventListener('click',()=>{running=false;startInProgress=false;lastStamp=0;if(frame)cancelAnimationFrame(frame);if('speechSynthesis' in window)speechSynthesis.cancel();remainingMs=selectedSeconds*1000;subtitle.textContent='Choose a time, then press Start.';fillMask.classList.remove('done');paint();setRunningUI(false)});
paint();setRunningUI(false);
})();
</script>
</body>
</html>
