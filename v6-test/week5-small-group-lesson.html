<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 5 Small Group</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#174f7d;background:#f7f2e7}.page{height:100vh;padding:4vh 6vw}.card{height:80vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;padding:5vh 6vw;display:grid;grid-template-columns:35% 1fr;gap:5vw;align-items:center}.visual{height:52vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;font-size:90px}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:55px;margin:1vh 0;color:#164f7f}.lead{font-size:25px;font-weight:900;color:#527673}.steps{display:grid;gap:1vh;margin-top:2vh}.step{background:#e7f0ed;border-radius:16px;padding:1.1vh 1vw;font-size:18px;font-weight:900;color:#416d61}.bottom{text-align:center;margin-top:2vh}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><section class="card"><div class="visual" id="icon"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="back">← Small Group Choices</button></div></main><script>const d={writing:{icon:'🖍️',title:'Writing Basics',lead:'Use color choices to communicate information about yourself in a drawing.',steps:['Take out the self-drawing from the Week 4 writing folder.','Think about colors you want to use to communicate who you are.','Add color while talking about your choices. Colors may be realistic or imaginative.','Return the drawing to the writing folder when finished.']},skills:{icon:'🔤',title:'Skills Reinforcement',lead:'Revisit specific foundational literacy skills that need more practice.',steps:['Use observation to identify a skill that would benefit from another brief practice.','Use the Week 5 Skills Reinforcement support aligned with Heggerty Week 2.','Keep practice targeted and responsive to the children in the group.']},charades:{icon:'🎭',title:'More Charades!',lead:'Act out activities from Everybody in the Red Brick Building while classmates guess.',steps:['Model the game with activities from the book.','Possible curriculum examples: a cat jumping, launching a toy rocket, a baby crying, turning off a car alarm, or falling back to sleep.','One or two children act while the others guess.','At the end ask: “What do you do if you wake up in the middle of the night?”']},fine:{icon:'🤏',title:'Fine Motor Development',lead:'Choose practice based on observation and individual fine-motor goals.',steps:['Observe current skills and stamina.','Select an appropriate activity from the established fine-motor options.','Provide the amount of support each child needs.']}};let p=new URLSearchParams(location.search),day=p.get('day')||'Monday',x=d[p.get('activity')]||d.writing;icon.textContent=x.icon;eye.textContent='WEEK 5 · '+day.toUpperCase();title.textContent=x.title;lead.textContent=x.lead;steps.innerHTML=x.steps.map(s=>'<div class="step">'+s+'</div>').join('');back.onclick=()=>location.href='week5-small-groups.html?day='+encodeURIComponent(day);</script></body></html>
