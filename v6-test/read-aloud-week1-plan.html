<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e6}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.back{position:fixed;z-index:50;right:18px;top:14px;width:54px;height:54px;border-radius:50%;border:1px solid #bdd0d5;background:#fffdf8;color:#245c82;font:900 26px/1 "Trebuchet MS",Arial,sans-serif;cursor:pointer;box-shadow:0 5px 14px #395b6318}</style></head><body><button class="back" id="back" aria-label="Back to Today's Plan">×</button><iframe id="frame"></iframe><script>(()=>{const p=new URLSearchParams(location.search),day=(p.get('day')||'Monday').toLowerCase(),files={monday:'read-aloud.html',tuesday:'read-aloud-2.html',wednesday:'read-aloud-3.html',thursday:'too-many-mangos-read-1.html',friday:'too-many-mangos-read-2.html'},f=document.getElementById('frame');document.getElementById('back').onclick=()=>location.href='daily-lessons-v2.html';function enhance(d){const card=d.getElementById('card');if(!card)return;const style=d.createElement('style');style.textContent='.card.inline-overlaid{position:relative;width:94%!important;height:88%!important;padding:0!important;background:rgba(255,254,249,.98)!important;overflow:hidden!important}.inlinePrompt{position:absolute;right:2vw;bottom:2vh;width:min(520px,42vw);max-height:68%;overflow:auto;z-index:20;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.2);text-align:left}.inlinePrompt .visual,.inlinePrompt .vocab-visual{display:none!important}.inlinePrompt .step{display:none!important}.inlinePrompt .prompt-kicker,.inlinePrompt .cover-kicker{color:#9a6c13!important;font-size:11px!important;letter-spacing:.08em!important;margin:0 0 .5vh!important}.inlinePrompt h2,.inlinePrompt .word-pill,.inlinePrompt .vocab-copy h2{font-size:20px!important;line-height:1.15!important;margin:.2vh 0 .7vh!important;color:#9a6c13!important}.inlinePrompt .copy,.inlinePrompt .definition,.inlinePrompt .vocab-definition,.inlinePrompt .vocab-gesture{font-size:17px!important;line-height:1.35!important;max-width:none!important;color:#71591f!important;font-weight:900!important;margin:.4vh 0!important}.inlinePrompt .vocab-copy{display:block!important}.inlinePrompt svg{display:none!important}';d.head.appendChild(style);let lastSpread='';const apply=()=>{if(card.classList.contains('inline-overlaid'))return;if(card.classList.contains('spread-card')){lastSpread=card.innerHTML;return}const isPrompt=card.classList.contains('prompt-card')||card.classList.contains('word-card')||card.classList.contains('vocab-card');if(isPrompt&&lastSpread){const prompt=card.innerHTML;card.className='card spread-card inline-overlaid';card.innerHTML=lastSpread+'<div class="inlinePrompt">'+prompt+'</div>'}};new MutationObserver(()=>setTimeout(apply,0)).observe(card,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});apply()}f.src=files[day]||files.monday;f.addEventListener('load',()=>{try{const path=f.contentWindow.location.pathname;if(path.endsWith('/daily-lessons.html')||path.endsWith('/index.html')){location.href='daily-lessons-v2.html';return}const d=f.contentDocument,b=d.getElementById('backBtn');if(b)b.onclick=(e)=>{e.preventDefault();location.href='daily-lessons-v2.html'};enhance(d)}catch(e){}})})();</script></body></html>
