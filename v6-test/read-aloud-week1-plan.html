<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e6}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.back{position:fixed;z-index:50;right:18px;top:14px;width:54px;height:54px;border-radius:50%;border:1px solid #bdd0d5;background:#fffdf8;color:#245c82;font:900 26px/1 "Trebuchet MS",Arial,sans-serif;cursor:pointer;box-shadow:0 5px 14px #395b6318}</style></head><body><button class="back" id="back" aria-label="Back to Today's Plan">×</button><iframe id="frame"></iframe><script>(()=>{const p=new URLSearchParams(location.search),day=(p.get('day')||'Monday').toLowerCase(),files={monday:'read-aloud.html',tuesday:'read-aloud-2.html',wednesday:'read-aloud-3.html',thursday:'too-many-mangos-read-1.html',friday:'too-many-mangos-read-2.html'},f=document.getElementById('frame');document.getElementById('back').onclick=()=>location.href='daily-lessons-v2.html';f.src=files[day]||files.monday;f.addEventListener('load',()=>{try{const path=f.contentWindow.location.pathname;if(path.endsWith('/daily-lessons.html')||path.endsWith('/index.html')){location.href='daily-lessons-v2.html';return}const d=f.contentDocument,b=d.getElementById('backBtn');if(b)b.onclick=(e)=>{e.preventDefault();location.href='daily-lessons-v2.html'}}catch(e){}})})();</script></body></html>
