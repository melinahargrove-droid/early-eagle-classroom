<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Unit 2 Week 1 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:1.5vh 2vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.35vh 0 0;font-size:clamp(30px,2.7vw,52px);line-height:1;color:#164f7f}.sub{margin:.4vh 0;color:#557876;font-size:16px;font-weight:850}.actions{display:flex;gap:.6vw;align-items:center}.chip{padding:.6vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:24px;font-weight:900;cursor:pointer}.stage{height:78vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdf9;box-shadow:0 14px 36px rgba(54,79,77,.07);display:grid;grid-template-columns:38% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.bookmode{height:58vh;border-radius:28px;background:linear-gradient(145deg,#e8f0eb,#fbf6ea);border:1px solid rgba(89,130,146,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw}.bookmode .icon{font-size:clamp(70px,7vw,120px)}.bookmode b{margin-top:1.2vh;color:#245c78;font-size:clamp(20px,1.5vw,28px)}.bookmode p{color:#617b77;font-weight:800;line-height:1.4;font-size:clamp(14px,.9vw,18px)}.copy .kicker{font-weight:900;letter-spacing:.1em;color:#9b7b5d;font-size:12px}.copy h2{font-size:clamp(36px,3.2vw,62px);line-height:1.05;margin:.7vh 0 1.4vh;color:#164f7f}.prompt{font-size:clamp(19px,1.35vw,27px);font-weight:900;line-height:1.38;color:#527673}.note{margin-top:2vh;padding:1.4vh 1.2vw;border-radius:18px;background:#fff4dd;color:#755e33;font-size:clamp(14px,.9vw,18px);font-weight:850;line-height:1.4}.footer{height:9vh;display:grid;grid-template-columns:18% 1fr 18%;align-items:center;gap:1vw}.nav{border:1.3px solid #cbdde0;border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.book-cover{max-width:100%;max-height:43vh;object-fit:contain;border-radius:14px;box-shadow:0 7px 20px rgba(40,60,50,.17)}.book-cover[hidden]{display:none}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · UNIT 2 · WEEK 1 · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="bookmode"><img id="bookImg" class="book-cover" alt="Book cover" hidden><div class="icon" id="icon">📖</div><b id="bookCue"></b><p id="bookNote"></p></div><div class="copy"><div class="kicker" id="kicker"></div><h2 id="stepTitle"></h2><div class="prompt" id="prompt"></div><div class="note" id="note"></div></div></section><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="week9-read-aloud.js"></script></body></html>
