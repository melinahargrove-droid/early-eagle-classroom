<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Unit 2 Week 1 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:1.5vh 2vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.35vh 0 0;font-size:clamp(30px,2.7vw,52px);line-height:1;color:#164f7f}.sub{margin:.4vh 0;color:#557876;font-size:16px;font-weight:850}.actions{display:flex;gap:.6vw;align-items:center}.chip{padding:.6vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:24px;font-weight:900;cursor:pointer}.stage{height:78vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdf9;box-shadow:0 14px 36px rgba(54,79,77,.07);display:grid;grid-template-columns:38% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.bookmode{height:58vh;border-radius:28px;background:linear-gradient(145deg,#e8f0eb,#fbf6ea);border:1px solid rgba(89,130,146,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw}.bookmode .icon{font-size:clamp(70px,7vw,120px)}.bookmode b{margin-top:1.2vh;color:#245c78;font-size:clamp(20px,1.5vw,28px)}.bookmode p{color:#617b77;font-weight:800;line-height:1.4;font-size:clamp(14px,.9vw,18px)}.copy .kicker{font-weight:900;letter-spacing:.1em;color:#9b7b5d;font-size:12px}.copy h2{font-size:clamp(36px,3.2vw,62px);line-height:1.05;margin:.7vh 0 1.4vh;color:#164f7f}.prompt{font-size:clamp(19px,1.35vw,27px);font-weight:900;line-height:1.38;color:#527673}.note{margin-top:2vh;padding:1.4vh 1.2vw;border-radius:18px;background:#fff4dd;color:#755e33;font-size:clamp(14px,.9vw,18px);font-weight:850;line-height:1.4}.footer{height:9vh;display:grid;grid-template-columns:18% 1fr 18%;align-items:center;gap:1vw}.nav{border:1.3px solid #cbdde0;border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · UNIT 2 · WEEK 1 · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="bookmode"><div class="icon" id="icon">📖</div><b id="bookCue"></b><p id="bookNote"></p></div><div class="copy"><div class="kicker" id="kicker"></div><h2 id="stepTitle"></h2><div class="prompt" id="prompt"></div><div class="note" id="note"></div></div></section><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday';const D={Monday:{title:'My City',sub:'Read 1 of 3 · What happens in the story?',book:'Physical-book mode until your scans are added.',steps:[['BEFORE READING','Introduce Building Our Working City. Explain that My City is a mostly wordless book by Joanne Liu about Max walking through his city to mail a letter. Invite children to look closely at the pictures to imagine the story.','Connect to children’s experiences in their city.'],['READ THE BOOK','Show each page slowly and narrate the events while children study the illustrations.','The curriculum suggests simple narration and pausing at the printed-page cues below.'],['PRINTED PAGE 7','Max is looking down at a blue shape.','Show printed page 7.'],['PRINTED PAGES 8–9','Ask what Max and another person see when they look into the puddle. Name the reflection as a new/different perspective on the city.','Show printed pages 8–9.'],['PRINTED PAGES 16–17','Notice that Max catches the leaf and is looking up, giving another new perspective on the city.','Show printed pages 16–17.'],['PRINTED PAGE 23','Pause after more than half the book and ask children to recall some of Max’s adventures; turn back to pages they mention.','Then continue reading.'],['PRINTED PAGE 24','Ask how the daylight is changing, why, and how the illustrations look different.','Show printed page 24.'],['AFTER READING','Ask: What were some of Max’s adventures?','Connect to looking at reflections in Discovery or setting up a post office in Dramatic Play.'] ]},Tuesday:{title:'My City',sub:'Read 2 of 3 · Telling the story',book:'Physical-book mode until your scans are added.',steps:[['BEFORE READING','Reintroduce My City. Tell children they will collaboratively tell one version of the story, offering details about what is happening, what someone is saying, and what they feel.','Emphasize that a wordless book can be told differently each time.'],['COLLABORATIVE TELLING','Move slowly through all illustrations. Model narration for the first one or two pages, then invite a child to narrate each page that follows.','Supply descriptive vocabulary or sentence starters as needed. Allow children to pass their turn.'],['CHARACTER FEELINGS','When appropriate, prompt children to describe characters’ emotions, such as how Max might feel when he catches the leaf.','Keep the focus on evidence in the illustrations.'],['AFTER READING','Ask: How does Max feel at the end of the story? Why? Then ask for a thumbs-up if children have felt that way and what made them feel that way.','Close by naming that the class used illustrations to tell one version of the story and connected to characters’ feelings and their own experiences.']]},Wednesday:{title:'My City',sub:'Read 3 of 3 · Acting out the story',book:'Physical-book mode until your scans are added.',steps:[['BEFORE READING','Seat children around the perimeter of the rug. Explain that you will show the illustrations, narrate a version of the story, and invite children to enter the stage to play a character.','Children may pass. Remind them they can be anyone or anything in the book.'],['ACT OUT THE STORY','Narrate the story, including elements of the previous day’s telling as well as new elements. Slowly show the illustrations and pause for children to act out a selected scene or the whole story, depending on the group.','The curriculum even invites children to portray non-human elements, such as a plastic bag floating in the wind.'],['AFTER READING','Discuss: How was acting out a wordless book the same or different from acting out a book with words?','Listen for children’s reflections on what worked, what was challenging, and what they understood through acting.']]},Thursday:{title:'Daniel’s Good Day',sub:'Read 1 of 3 · What happens in the story?',book:'Use the adapted text/book. Page-image mode can be added later without changing these lesson cues.',steps:[['BEFORE READING','Introduce Daniel’s Good Day by Micha Archer. Explain that Daniel walks through his neighborhood meeting different people, much like Max walks through his city in My City.','Invite a connection: Who have you met while walking in your neighborhood?'],['READ THE FULL TEXT','Read the text fluently, pausing at the printed-page cues below.','Use the adapted text/book in reading order.'],['PRINTED PAGE 5 · QUICK WORD','A steady wind is a wind that is calm and does not change much.','Vocabulary: steady.'],['PRINTED PAGE 7','Ask for one person Daniel has met so far and what makes a good day for that person.','Show printed page 7.'],['PRINTED PAGE 15','Pause about halfway through. Name a few more people Daniel meets and what makes a good day for them; turn back through pages to support responses.','Then continue reading.'],['PRINTED PAGE 19','Ask why the baker and bus driver might be smiling.','Show printed page 19.'],['AFTER READING','Ask: What is one reason Daniel has a good day? What makes a good day for you?','Connect to thinking about jobs that make the city work in Library & Listening.']]},Friday:{title:'Daniel’s Good Day',sub:'Read 2 of 3 · Reading the pictures',book:'Use the adapted text/book. Page-image mode can be added later without changing these lesson cues.',steps:[['BEFORE READING','Reintroduce Daniel’s Good Day. Tell children that this time they will look closely at the illustrations.','Read the text fluently, pausing at the printed-page cues.'],['PRINTED PAGES 2–3','Ask what children notice happening on the street as Daniel walks by. Point out that many characters seen later can already be spotted here.','Show printed pages 2–3.'],['PRINTED PAGE 12','Ask why someone selling newspapers and magazines might be happy about busy sidewalks and friendly faces. Look closely at how different pieces of paper are used to make collage illustrations.','Show printed page 12.'],['PRINTED PAGES 23–24','Look at the illustration of people in the park. Ask: What is one thing you like to do in the park?','Show printed pages 23–24.'],['AFTER READING','Name that today the class looked closely at the pictures.','Connect to making a collage inspired by Daniel’s Good Day in Art Studio.']]}}[day];let i=0;const $=id=>document.getElementById(id);$('title').textContent=D.title;$('sub').textContent=D.sub;$('chip').textContent='UNIT 2 · WEEK 1 · '+day.toUpperCase();$('backBtn').onclick=()=>location.href='daily-lessons.html?week=9&day='+days.indexOf(day);function render(){const s=D.steps[i];$('kicker').textContent=s[0];$('stepTitle').textContent=s[0].replace(/^[^·]+·?\s*/,'')||s[0];$('prompt').textContent=s[1];$('note').textContent=s[2]||'';$('bookCue').textContent=s[0].includes('PAGE')?s[0]:'READ ALOUD';$('bookNote').textContent=D.book;$('count').textContent=(i+1)+' of '+D.steps.length;$('fill').style.width=((i+1)/D.steps.length*100)+'%';$('prev').textContent=i===0?'← Previous':'← Previous';$('next').textContent=i===D.steps.length-1?'Finish Read Aloud →':'Next →';notify()}function state(){return{step:i,atStart:i===0,atEnd:i===D.steps.length-1}}window.EEASectionState=state;function notify(){try{window.dispatchEvent(new CustomEvent('eea-section-state',{detail:state()}))}catch(e){}}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<D.steps.length-1){i++;render()}};render()})();</script></body></html>
