<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle — Add Lesson</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:5vh 4vw}.card{background:#fffdf9;border:1px solid #cbdde0;border-radius:28px;padding:30px;box-shadow:0 16px 40px #0001}h1{font-size:42px;margin:0 0 8px}.sub{color:#668287;font-weight:800;margin-bottom:26px}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:900;margin:14px 0 6px}input,textarea,select{width:100%;border:1.5px solid #cbdde0;border-radius:14px;padding:12px;font:inherit;color:#315f70;background:#fff}textarea{min-height:120px;resize:vertical}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:900;font-size:16px;cursor:pointer}.cancel{background:#eef2ee;color:#315f70}.save{background:#668f99;color:white}.hint{padding:12px 14px;background:#eaf2ef;border-radius:14px;color:#557876;font-weight:800;margin-top:16px}.pageitem.dragging{opacity:.45}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:8px}.mini{border:1px solid #cbdde0;border-radius:10px;background:#fffdf8;color:#315f70;padding:6px 9px;font-weight:900;cursor:pointer}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script></head><body><main class="wrap"><section class="card"><h1>Add a Lesson</h1><div class="sub" id="where"></div><div class="row"><div><label>Lesson type</label><select id="type"><option value="simple">Simple Lesson</option><option value="slides">Slides</option><option value="readaloud">Read Aloud Builder</option></select><label>Lesson title</label><input id="title" placeholder="Example: Apple Taste Test"></div><div><label>Place it</label><select id="position"><option value="0">Before Community Meeting</option><option value="1">After Community Meeting</option><option value="2">After Read Aloud</option><option value="3">After Centers</option><option value="4">After Storytelling</option></select></div></div><label>What will children see?</label><textarea id="student" placeholder="Simple child-facing direction or prompt"></textarea><label>Teacher notes</label><textarea id="teacher" placeholder="Materials, setup, questions, reminders..."></textarea><div id="readBuilder" style="display:none"><label>Read Aloud pages</label><div class="row"><div><label>Upload page images</label><input id="imageFiles" type="file" accept="image/*" multiple></div><div><label>Or upload a PDF</label><input id="pdfFile" type="file" accept="application/pdf"></div></div><div class="hint">Upload page images together and Early Eagle will create the pages in file order. PDF import will be added after image upload is stable.</div><div id="pages"></div><button class="btn cancel" type="button" id="addPage">+ Add Blank Page</button></div><div class="hint">Your Focus on 3s curriculum remains locked and unchanged.</div><div class="actions"><button class="btn cancel" id="cancel">Cancel</button><button class="btn save" id="save">Save Lesson</button></div></section></main><script>(()=>{const p=new URLSearchParams(location.search),week=Number(p.get('week'))||1,day=Number(p.get('day'))||0,editId=p.get('id'),names=['Monday','Tuesday','Wednesday','Thursday','Friday'],KEY='eea-teacher-lessons-v1',type=document.getElementById('type'),builder=document.getElementById('readBuilder'),pages=document.getElementById('pages');let pageData=[];const kinds=['STOP & THINK','VOCABULARY','ACT IT OUT','TEACHER NOTE','CUSTOM'];function addPop(i){pageData[i].popouts=pageData[i].popouts||[];pageData[i].popouts.push({kind:'STOP & THINK',word:'',definition:'',gesture:'',prompt:''});drawPages()}function drawPages(){pages.innerHTML=pageData.map((x,i)=>`<div class="pageitem" draggable="true" data-pageitem="${i}" style="border:1px solid #cbdde0;border-radius:16px;padding:12px;margin:10px 0"><div class="pagehead"><b>☰ Page ${i+1}</b><div><button type="button" class="mini deletepage" data-page="${i}">Delete</button> <span class="poptools"><button type="button" class="btn cancel addpop" data-page="${i}">+ Pop-Out</button></span></div></div>${x.image?'<img src="'+x.image+'" style="max-width:180px;max-height:120px;object-fit:contain;margin:8px 0;border-radius:10px">':''}<div>${(x.popouts||[]).map((o,j)=>`<div style="background:#f4f7f3;border-radius:12px;padding:10px;margin:8px 0"><select data-i="${i}" data-j="${j}" data-k="kind">${kinds.map(k=>'<option '+(k===o.kind?'selected':'')+'>'+k+'</option>').join('')}</select>${o.kind==='VOCABULARY'?'<input data-i="'+i+'" data-j="'+j+'" data-k="word" placeholder="Vocabulary word" value="'+(o.word||'')+'"><input data-i="'+i+'" data-j="'+j+'" data-k="definition" placeholder="Child-friendly definition" value="'+(o.definition||'')+'"><input data-i="'+i+'" data-j="'+j+'" data-k="gesture" placeholder="Optional gesture/action" value="'+(o.gesture||'')+'">':''}<textarea data-i="${i}" data-j="${j}" data-k="prompt" placeholder="Teacher prompt or note">${o.prompt||''}</textarea></div>`).join('')}</div></div>`).join('');pages.querySelectorAll('.addpop').forEach(b=>b.onclick=()=>addPop(Number(b.dataset.page)));pages.querySelectorAll('.deletepage').forEach(b=>b.onclick=()=>{pageData.splice(Number(b.dataset.page),1);drawPages()});let drag=null;pages.querySelectorAll('.pageitem').forEach(el=>{el.ondragstart=()=>{drag=Number(el.dataset.pageitem);el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const to=Number(el.dataset.pageitem);if(drag===null||drag===to)return;const moved=pageData.splice(drag,1)[0];pageData.splice(to,0,moved);drag=null;drawPages()}});pages.querySelectorAll('[data-i][data-j]').forEach(el=>el.onchange=el.oninput=()=>{pageData[Number(el.dataset.i)].popouts[Number(el.dataset.j)][el.dataset.k]=el.value;if(el.dataset.k==='kind')drawPages()})}type.onchange=()=>{builder.style.display=['readaloud','slides'].includes(type.value)?'block':'none';document.querySelectorAll('.poptools').forEach(x=>x.style.display=type.value==='readaloud'?'':'none')};document.getElementById('addPage').onclick=()=>{pageData.push({image:'',popouts:[]});drawPages()};document.getElementById('imageFiles').onchange=async e=>{const files=[...e.target.files];for(const file of files){const image=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)});pageData.push({image,popouts:[]})}drawPages()};document.getElementById('pdfFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;const status=document.getElementById('where'),old=status.textContent;status.textContent='Importing PDF pages…';try{const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const bytes=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjs.getDocument({data:bytes}).promise;for(let n=1;n<=pdf.numPages;n++){status.textContent='Importing PDF page '+n+' of '+pdf.numPages+'…';const page=await pdf.getPage(n),vp=page.getViewport({scale:1.35}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:ctx,viewport:vp}).promise;pageData.push({image:canvas.toDataURL('image/jpeg',.88),popouts:[]})}drawPages()}catch(err){alert('This PDF could not be imported. You can still upload page images instead.')}finally{status.textContent=old;e.target.value=''}};if(editId){let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const d=all.find(x=>x.id===editId);if(d){type.value=d.type||'simple';document.getElementById('title').value=d.title||'';document.getElementById('student').value=d.student||'';document.getElementById('teacher').value=d.teacher||'';document.getElementById('position').value=String(d.position??0);pageData=d.pages||[];builder.style.display=['readaloud','slides'].includes(type.value)?'block':'none';drawPages();document.querySelectorAll('.poptools').forEach(x=>x.style.display=type.value==='readaloud'?'':'none')}}document.getElementById('where').textContent='Unit 1 · Week '+week+' · '+names[day];const back=()=>location.href='daily-lessons.html?week='+week+'&day='+day;document.getElementById('cancel').onclick=back;document.getElementById('save').onclick=()=>{const title=document.getElementById('title').value.trim();if(!title){document.getElementById('title').focus();return}let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const item={id:editId||'t'+Date.now(),type:type.value,week,day,position:Number(document.getElementById('position').value),title,student:document.getElementById('student').value.trim(),teacher:document.getElementById('teacher').value.trim(),pages:['readaloud','slides'].includes(type.value)?pageData:[],created:Date.now()};const at=all.findIndex(x=>x.id===editId);if(at>=0)all[at]=item;else all.push(item);localStorage.setItem(KEY,JSON.stringify(all));back()}})();</script></body></html>
