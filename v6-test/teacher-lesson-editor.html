<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle — Add Lesson</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:5vh 4vw}.card{background:#fffdf9;border:1px solid #cbdde0;border-radius:28px;padding:30px;box-shadow:0 16px 40px #0001}h1{font-size:42px;margin:0 0 8px}.sub{color:#668287;font-weight:800;margin-bottom:26px}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:900;margin:14px 0 6px}input,textarea,select{width:100%;border:1.5px solid #cbdde0;border-radius:14px;padding:12px;font:inherit;color:#315f70;background:#fff}textarea{min-height:120px;resize:vertical}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:900;font-size:16px;cursor:pointer}.cancel{background:#eef2ee;color:#315f70}.save{background:#668f99;color:white}.hint{padding:12px 14px;background:#eaf2ef;border-radius:14px;color:#557876;font-weight:800;margin-top:16px}</style></head><body><main class="wrap"><section class="card"><h1>Add a Lesson</h1><div class="sub" id="where"></div><div class="row"><div><label>Lesson type</label><select id="type"><option value="simple">Simple Lesson</option><option value="readaloud">Read Aloud Builder</option></select><label>Lesson title</label><input id="title" placeholder="Example: Apple Taste Test"></div><div><label>Place it</label><select id="position"><option value="0">Before Community Meeting</option><option value="1">After Community Meeting</option><option value="2">After Read Aloud</option><option value="3">After Centers</option><option value="4">After Storytelling</option></select></div></div><label>What will children see?</label><textarea id="student" placeholder="Simple child-facing direction or prompt"></textarea><label>Teacher notes</label><textarea id="teacher" placeholder="Materials, setup, questions, reminders..."></textarea><div id="readBuilder" style="display:none"><label>Read Aloud pages</label><div id="pages"></div><button class="btn cancel" type="button" id="addPage">+ Add Page</button><div class="hint">For each page, add an image URL for now, then attach a teacher pop-out. File/PDF upload comes next.</div></div><div class="hint">Your Focus on 3s curriculum remains locked and unchanged.</div><div class="actions"><button class="btn cancel" id="cancel">Cancel</button><button class="btn save" id="save">Save Lesson</button></div></section></main><script>(()=>{const p=new URLSearchParams(location.search),week=Number(p.get('week'))||1,day=Number(p.get('day'))||0,names=['Monday','Tuesday','Wednesday','Thursday','Friday'],KEY='eea-teacher-lessons-v1',type=document.getElementById('type'),builder=document.getElementById('readBuilder'),pages=document.getElementById('pages');let pageData=[];function drawPages(){pages.innerHTML=pageData.map((x,i)=>`<div style="border:1px solid #cbdde0;border-radius:16px;padding:12px;margin:10px 0"><b>Page ${i+1}</b><input data-i="${i}" data-k="image" placeholder="Image URL" value="${x.image||''}"><input data-i="${i}" data-k="label" placeholder="Pop-out label (STOP & THINK, VOCABULARY...)" value="${x.label||''}"><textarea data-i="${i}" data-k="prompt" placeholder="Teacher pop-out prompt">${x.prompt||''}</textarea></div>`).join('');pages.querySelectorAll('[data-i]').forEach(el=>el.oninput=()=>pageData[Number(el.dataset.i)][el.dataset.k]=el.value)}type.onchange=()=>builder.style.display=type.value==='readaloud'?'block':'none';document.getElementById('addPage').onclick=()=>{pageData.push({image:'',label:'STOP & THINK',prompt:''});drawPages()};document.getElementById('where').textContent='Unit 1 · Week '+week+' · '+names[day];const back=()=>location.href='daily-lessons.html?week='+week+'&day='+day;document.getElementById('cancel').onclick=back;document.getElementById('save').onclick=()=>{const title=document.getElementById('title').value.trim();if(!title){document.getElementById('title').focus();return}let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}all.push({id:'t'+Date.now(),type:type.value,week,day,position:Number(document.getElementById('position').value),title,student:document.getElementById('student').value.trim(),teacher:document.getElementById('teacher').value.trim(),pages:type.value==='readaloud'?pageData:[],created:Date.now()});localStorage.setItem(KEY,JSON.stringify(all));back()}})();</script></body></html>
