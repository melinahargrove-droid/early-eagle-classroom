<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fo3s U1W1 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f6f1e5;color:#174f7d}.page{height:100vh;padding:3vh 5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}.top{height:10vh;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.11em;color:#789697}.brand h1{margin:.5vh 0;font-size:clamp(34px,3vw,58px);color:#164f7f}.chip{height:max-content;background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.card{height:70vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.visual{height:52vh;border-radius:28px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;font-size:clamp(100px,10vw,180px)}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h2{font-size:clamp(44px,4vw,76px);margin:1vh 0;color:#164f7f}.copy p{font-size:clamp(20px,1.45vw,28px);font-weight:850;color:#527673;line-height:1.4}.teacher{background:#e7f0ed;border-radius:18px;padding:1.2vh 1.2vw;color:#416d61;font-weight:850;line-height:1.4}.bottom{height:12vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900;cursor:pointer}.bottom .next{background:#668f99;color:#fff}.dots{display:flex;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:#d3dfdc}.dot.on{background:#668f99}</style></head><body><main class="page"><header class="top"><div class="brand">EARLY EAGLE ACADEMY · FOCUS ON PRE-K 3s<h1>Community Meeting</h1></div><div class="chip">UNIT 1 · WEEK 1 · MONDAY</div></header><section class="card"><div class="visual" id="icon"></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><p id="say"></p><div class="teacher" id="note"></div></div></section><div class="bottom"><button id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></main><script>(()=>{const cards=[{icon:'⚽',title:'Meet the Name Ball',say:'We are going to play a game with our names. This soft ball is our Name Ball.',note:'Have the group sit in a circle. Introduce any soft ball as the Name Ball.'},{icon:'🤲',title:'Hold the Ball, Share Your Name',say:'When the Name Ball comes to you, tell us your name in any way that works for you.',note:'A child may say their name, use their name card, point to their name card, or use another communication method.'},{icon:'💬',title:'Echo the Name',say:'When our friend shares their name, we will say their name back the same way.',note:'The curriculum suggests children can communicate their name according to their mood—for example upbeat or with a yawn—and the group echoes it in the same manner.'},{icon:'🫶',title:'Everyone Gets a Turn',say:'We will gently pass or toss the Name Ball so every friend gets a turn.',note:'Be sure every child has an accessible way to participate and communicate names. Notice how children manage themselves and respond to one another.'}];let i=0;const $=x=>document.getElementById(x);function draw(){$('icon').textContent=cards[i].icon;$('eye').textContent='NAME BALL · '+(i+1)+' OF '+cards.length;$('title').textContent=cards[i].title;$('say').textContent=cards[i].say;$('note').innerHTML='<b>Teacher note:</b> '+cards[i].note;$('dots').innerHTML=cards.map((_,n)=>'<span class="dot '+(n===i?'on':'')+'"></span>').join('');$('prev').disabled=i===0;$('next').textContent=i===cards.length-1?'Next: Read Aloud →':'Next →'}$('prev').onclick=()=>{if(i>0){i--;draw()}};$('next').onclick=()=>{if(i<cards.length-1){i++;draw()}else location.href='fo3s-u1w1-lola-read1.html'};draw()})();</script></body></html>
