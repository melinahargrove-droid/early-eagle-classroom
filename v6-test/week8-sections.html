<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 8</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d}body{background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea)}button{font:inherit;cursor:pointer}.page{height:100vh;padding:3vh 5vw}.top{height:10vh;display:flex;justify-content:space-between;align-items:flex-start}.brand,.eye,.label{font-weight:900;letter-spacing:.1em;color:#789697}.chip{padding:.6vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.card{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw}.visual{height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-size:clamp(70px,7vw,120px);font-weight:900}.copy h1{font-size:clamp(40px,3.5vw,68px);margin:1vh 0;color:#164f7f;line-height:1.04}.lead{font-size:clamp(20px,1.35vw,27px);font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh}.stepbox{padding:1.1vh 1.2vw;background:#e7f0ed;border-radius:17px;color:#416d61;font-size:clamp(16px,1vw,20px);font-weight:900;line-height:1.35}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900}.bottom .done,.back{background:#668f99;color:#fff}.choices{max-width:1500px;margin:3vh auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.25vw}.choice{min-height:59vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdf8;box-shadow:0 14px 34px rgba(54,79,77,.08);padding:2.8vh 1.7vw;display:flex;flex-direction:column}.symbol{height:18vh;border-radius:24px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;font-size:clamp(62px,6vw,105px)}.choice h2{margin:.7vh 0;color:#164f7f;font-size:clamp(24px,1.8vw,35px);line-height:1.05}.choice p{color:#527673;font-size:clamp(14px,.9vw,18px);font-weight:800;line-height:1.4}.open{margin-top:auto;align-self:flex-start;border:0;border-radius:999px;background:#668f99;color:#fff;padding:1vh 1.3vw;font-weight:900}.exit{width:54px;height:54px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900}.detail{max-width:1150px;margin:1vh auto;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:30px;padding:4vh 4vw}.detail h1{font-size:clamp(38px,3vw,58px);margin:1vh 0;color:#164f7f}.detail p,.detail li{font-size:clamp(17px,1.1vw,22px);line-height:1.5;font-weight:800;color:#527673}.detail .box{background:#e7f0ed;border-radius:18px;padding:2vh 1.5vw;margin:2vh 0}.storycard{height:75vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:45% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.storyvis{height:56vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;font-size:26px;font-weight:900;color:#527673}.storycopy h1{font-size:54px;line-height:1;margin:1vh 0;color:#164f7f}.cue{margin-top:2vh;background:#e7f0ed;border-radius:18px;padding:1.4vh 1.2vw;font-size:18px;font-weight:900;color:#416d61}.panel{display:none;position:fixed;right:4vw;top:10vh;width:42vw;max-height:78vh;overflow:auto;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:25px;padding:3vh 2vw;box-shadow:0 15px 35px #0002}.panel.open{display:block}.closecard{height:70vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;padding:5vh 6vw;display:grid;grid-template-columns:40% 1fr;gap:5vw;align-items:center}.closevis{height:50vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;font-size:100px}.closecopy h2{font-size:60px;margin:1vh 0;color:#164f7f;line-height:1}.body{font-size:24px;font-weight:900;color:#527673;line-height:1.35}.prompt{margin-top:2vh;padding:2vh 1.5vw;border-radius:20px;background:#e7f0ed;color:#416d61;font-size:30px;font-weight:900;line-height:1.25}.plain{max-width:1120px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.plain h1,.plain h2,.plain h3{color:#165487}.plain p{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}.plain .box{background:#e7f0ed;border-radius:18px;padding:15px;margin:12px 0}</style></head><body><main id="root"></main><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',view=p.get('view')||'centers',root=document.getElementById('root'),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const centers={Monday:{icon:'✏️',title:'Writing & Drawing · Our Classroom Community',lead:'Children draw the people who make up their classroom community.',steps:['Invite children to draw classmates, teachers, and themselves.','Offer mirrors, photos, name strips, and letters as supports.','Model asking someone how to spell their name and adding it to the picture.','Continue Art Studio: Representing Hair; Blocks: Building Furniture; Discovery: Soap and Water; Dramatic Play: Caring for Hair; Library & Listening: Retelling Stories; Science & Engineering: Observing Ourselves.']},Tuesday:{icon:'🎨',title:'Art Easel · Painting Inspired by Frederick',lead:'Children use Leo Lionni’s collage illustrations as inspiration for color mixing and painting.',steps:['Look closely at the colors and shapes in Frederick.','Invite children to mix colors and visualize before they paint.','Continue the other Week 8 centers already in progress.']},Wednesday:{icon:'✨',title:'Continue and Deepen Center Work',lead:'No new center is introduced today.',steps:['Support the Week 8 center experiences already in progress.','Notice where children are extending ideas from read alouds, family/community work, and art experiences.']},Thursday:{icon:'🧩',title:'Continue and Deepen Center Work',lead:'Children revisit Week 8 centers with growing independence.',steps:['Support children in returning to favorite centers and adding new ideas.','Use conversation to extend collaboration, problem solving, and community connections.']},Friday:{icon:'⭐',title:'Continue and Reflect on Center Work',lead:'Children revisit Week 8 experiences and notice how their classroom community works together.',steps:['Support the Week 8 center experiences already in progress.','Invite children to notice something they made, learned, or did with another person this week.']}};const writing={Monday:['Our Field Trip in Sequential Order','Recall the class field-trip experience using sequence language such as first, next, and last.'],Tuesday:['Our Field Trip in Sequential Order','Continue drawing and discussing events from the field trip in order.'],Wednesday:['Retell Trip to the Museum','Use children’s drawings and oral language to retell the museum trip.'],Thursday:['Retell Trip to the Museum','Continue retelling and representing remembered events.'],Friday:['Continue Field Trip Retelling','Revisit children’s drawings and oral retellings as needed.']};const skills={Monday:['Unit 1 Foundational Literacy Review','Review previously introduced phonological-awareness and letter-identification skills. Use the Week 8 review sequence rather than introducing a new letter pair.'],Tuesday:['Poem · “You, Me, and Our Community”','Use the Week 8 poem for concepts of print, oral language, and community vocabulary.'],Wednesday:['Letter Identification Review','Revisit familiar letter names and sounds using established classroom routines and Fundations supports.'],Thursday:['Concepts of Print Review','Return to familiar print concepts while reading and discussing the Week 8 poem.'],Friday:['Week 8 Review','Revisit the Unit 1 skills children need most.']};const knowledge={Monday:['Classroom Community Talk','Use names, classroom photos, and familiar unit vocabulary to talk about the people and routines that make a classroom community.'],Tuesday:['Community Vocabulary','Use the Week 8 poem and picture cards to strengthen oral language about people helping, playing, and working together.'],Wednesday:['Knowledge Building · Picture Cards','Use picture cards and familiar unit vocabulary to strengthen knowledge and oral language.'],Thursday:['Story & Community Connections','Use familiar pictures from Unit 1 books to compare how characters help, care for, and contribute to their communities.'],Friday:['Unit 1 Knowledge Review','Revisit familiar picture cards and invite children to explain a word, person, place, or idea they remember from the unit.']};const building={Monday:['Building Shapes / The Shape of Things','Read one of the Building Blocks big books and discuss familiar shapes.'],Tuesday:['Shape Show · Wake Up, Jack in the Box · Snapshots','Practice noticing, naming, and representing shapes through whole-group routines.'],Wednesday:['Shape Show · Rectangles','Explore rectangles and find examples in the classroom.'],Thursday:['Shape Show · Squares','Explore squares and find examples in the classroom.'],Friday:['Week 8 Shape Review','Revisit the Week 8 Building Blocks shape experiences and vocabulary.']};const stories={Monday:{title:'A Place for Everyone',visual:'Visual placeholder: children making room for one another around a classroom table.',lead:'Imagine a classroom project where everyone finds a way to help.',cue:'Visualize: paper, blocks, markers, children sharing space, and one child finding a job that matters.',text:'A group of children wants to make a model of their classroom community. One child draws people, another builds tables with blocks, another makes tiny books, and another is not sure what to do. The group pauses, listens, and finds a job that fits: making name cards for everyone. When the model is finished, every child can point to something they contributed.\n\nStory Acting: several classmates and a teacher.'},Tuesday:{title:'The Colors Frederick Saved',visual:'Visual placeholder: field mice remembering warm colors during winter.',lead:'Picture a community using remembered colors and words to help one another through a cold day.',cue:'Visualize: gray winter, warm sunlight, red poppies, blue sky, and mice listening together.',text:'On a cold gray day, a family of mice begins to feel tired of winter. One mouse remembers Frederick’s idea and starts describing a bright yellow sun. Another remembers red flowers. Another remembers blue sky. Soon everyone is contributing a color, a word, or a memory, and the hideout feels warmer because they are imagining together.\n\nStory Acting: several mice.'},Wednesday:{title:'First, Next, Last',visual:'Visual placeholder: children looking at three field-trip drawings arranged in order.',lead:'Imagine friends using drawings to put a shared experience back in order.',cue:'Visualize: three pictures, children pointing, remembering, disagreeing kindly, and finally finding the sequence.',text:'Three classmates look at drawings from a field trip. They know all three things happened, but the pictures are mixed up. One child remembers what happened first. Another remembers what came next. They listen to one another and use details in the pictures to decide what happened last. When they finish, they retell the whole trip together.\n\nStory Acting: three classmates and a teacher.'},Thursday:{title:'The Square Sign',visual:'Visual placeholder: children searching the classroom for a shape that will work for a sign.',lead:'Imagine a group solving a classroom problem by noticing shapes around them.',cue:'Visualize: rectangles, squares, circles, children comparing edges and corners, and a finished classroom sign.',text:'A class wants to make a sign for a new center. The children search for a piece of cardboard that will work. They compare rectangles and squares, count sides, and notice corners. They choose a square and decorate it together, each child adding one small part.\n\nStory Acting: several classmates.'},Friday:{title:'Child Storyteller Day',visual:'Visual placeholder: a child sharing a story while classmates prepare to act it out.',lead:'Today the child is the storyteller and the community helps bring the story to life.',cue:'Prompts: Who is in your story? Where are they? What happens first, next, and last? How does it end?',text:'Invite one child to tell a short true or imaginary story. Use gentle prompts only as needed, then invite classmates to act it out. Notice how the storyteller, actors, and listeners each contribute something different to the shared story.'}};const closing={Monday:{icon:'🤝',title:'How Did We Help?',body:'Today we thought about the people who make up our classroom community and the ways everyone contributes.',prompt:'What is one way you helped our classroom community today?'},Tuesday:{icon:'🎨',title:'Something We Can Share',body:'Frederick reminds us that people can contribute in different ways—including ideas, words, colors, and imagination.',prompt:'What is something you can share with a group besides a toy?'},Wednesday:{icon:'🧠',title:'Remembering Together',body:'Today we used drawings, words, and one another’s memories to retell experiences in order.',prompt:'What helped you remember something today?'},Thursday:{icon:'🧩',title:'Different Jobs Matter',body:'A community works because people notice problems, share ideas, and take different roles.',prompt:'What is one classroom job or helpful action that matters?'},Friday:{icon:'⭐',title:'Our Community Grew',body:'We have spent eight weeks learning how to listen, care, solve problems, tell stories, and learn together.',prompt:'Finish the sentence: “Our classroom community is _____.” You may pass if you prefer to listen.'}};function shellTop(label){return `<div class="top"><div class="brand">EARLY EAGLE ACADEMY · ${label} · WEEK 8</div><div class="chip">WEEK 8 · ${day.toUpperCase()}</div></div>`}function renderCenters(){const d=centers[day];root.innerHTML=`<main class="page">${shellTop('INTRO TO CENTERS')}<section class="card"><div class="visual">${d.icon}</div><div class="copy"><div class="eye">${day.toUpperCase()} · CENTER INTRODUCTION</div><h1>${d.title}</h1><div class="lead">${d.lead}</div><div class="steps">${d.steps.map(s=>`<div class="stepbox">${s}</div>`).join('')}</div></div></section><div class="bottom"><button id="prev">← Previous</button><button class="done" id="done">Done ✓</button></div></main>`}function renderChoices(){root.innerHTML=`<main class="page"><header class="top"><div><div class="brand">EARLY EAGLE ACADEMY · LITERACY SMALL GROUPS</div><h1 style="margin:.5vh 0 0;font-size:clamp(34px,3vw,58px);color:#164f7f">Small Group Choices</h1><div class="lead" style="font-size:20px">Choose the activity you’re teaching with this group.</div></div><div style="display:flex;gap:.7vw;align-items:center"><div class="chip">WEEK 8 · ${day.toUpperCase()}</div><button class="exit" id="exit">×</button></div></header><section class="choices"><article class="choice" data-a="writing"><div class="symbol">✏️</div><div class="label">ADULT-LED WRITING</div><h2>${writing[day][0]}</h2><p>${writing[day][1]}</p><button class="open">Open Directions →</button></article><article class="choice" data-a="skills"><div class="symbol">🔤</div><div class="label">FOUNDATIONAL LITERACY</div><h2>${skills[day][0]}</h2><p>${skills[day][1]}</p><button class="open">Open Directions →</button></article><article class="choice" data-a="knowledge"><div class="symbol">🧩</div><div class="label">KNOWLEDGE BUILDING</div><h2>${knowledge[day][0]}</h2><p>${knowledge[day][1]}</p><button class="open">Open Directions →</button></article><article class="choice" data-a="fine"><div class="symbol">🤏</div><div class="label">MINIMAL SUPPORT</div><h2>Fine Motor Development</h2><p>Offer fine-motor practice based on observation and individual goals.</p><button class="open">Open Directions →</button></article></section></main>`;document.getElementById('exit').onclick=()=>location.href='daily-lessons.html?week=8&day='+days.indexOf(day);document.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>renderDetail(c.dataset.a))}function renderDetail(a){const m=a==='writing'?writing[day]:a==='skills'?skills[day]:a==='knowledge'?knowledge[day]:['Fine Motor Development','Offer fine-motor activities with minimal support to build stamina, hand strength, coordination, and control. Choose tools and tasks based on observation and individual goals.'];const labels={writing:'ADULT-LED WRITING',skills:'FOUNDATIONAL LITERACY',knowledge:'KNOWLEDGE BUILDING',fine:'MINIMAL SUPPORT'};root.innerHTML=`<main class="page">${shellTop('LITERACY SMALL GROUPS')}<section class="detail"><div class="label">${labels[a]}</div><h1>${m[0]}</h1><div class="box"><p>${m[1]}</p></div><p>Keep the group responsive to children’s current needs. Model briefly, invite active participation, and give children repeated chances to explain, practice, draw, write, or manipulate materials.</p><div class="bottom"><button id="choose">← Small Group Choices</button><button class="done" id="done">Done ✓</button></div></section></main>`;document.getElementById('choose').onclick=renderChoices}function renderBuilding(){const d=building[day];root.innerHTML=`<main class="page"><section class="plain"><div class="brand">WEEK 8 · ${day.toUpperCase()}</div><h1>Building Blocks</h1><h2>${d[0]}</h2><div class="box"><p>${d[1]}</p></div><button class="back">Done ✓</button></section></main>`}function renderStory(){const d=stories[day];root.innerHTML=`<main class="page"><div class="brand" style="height:9vh">EARLY EAGLE ACADEMY · STORYTELLING · WEEK 8</div><section class="storycard"><div class="storyvis">${d.visual}</div><div class="storycopy"><div class="eye">${day.toUpperCase()}${day==='Friday'?' · CHILD STORYTELLER':' · TEACHER STORY'}</div><h1>${d.title}</h1><div class="lead">${d.lead}</div><div class="cue">${d.cue}</div></div></section><div class="bottom"><button id="storyBtn">⌃ ${day==='Friday'?'Teacher Prompt':'Teacher Story'}</button><button class="back">Done ✓</button></div><aside class="panel" id="panel"><h2>${d.title}</h2><p style="white-space:pre-line;font:17px/1.5 Georgia,serif;color:#3e5f5c">${d.text}</p></aside></main>`;document.getElementById('storyBtn').onclick=()=>document.getElementById('panel').classList.toggle('open')}function renderClosing(){const d=closing[day];root.innerHTML=`<main class="page"><header style="height:10vh"><div class="brand">EARLY EAGLE ACADEMY · CLOSING CIRCLE</div><h1 style="font-size:42px;margin:.5vh 0;color:#164f7f">Ending Our Day Together</h1></header><section class="closecard"><div class="closevis">${d.icon}</div><div class="closecopy"><div class="eye">WEEK 8 · ${day.toUpperCase()}</div><h2>${d.title}</h2><div class="body">${d.body}</div><div class="prompt">${d.prompt}</div></div></section><div class="bottom"><button class="back">Done ✓</button></div></main>`}if(view==='centers')renderCenters();else if(view==='smallgroups')renderChoices();else if(view==='building')renderBuilding();else if(view==='storytelling')renderStory();else renderClosing()})();</script></body></html>
