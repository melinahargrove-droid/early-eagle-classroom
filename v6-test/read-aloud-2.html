ass="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{function motionSprite(){return `<svg viewBox="980 184 170 206" preserveAspectRatio="xMidYMid meet" role="img" aria-label="motion"><image href="assets/u1-vocab-sprite-1.png" x="0" y="0" width="1536" height="1024"/></svg>`}const cards=[{type:'cover',src:'https://www.charlesbridge.com/cdn/shop/products/lola-goes-to-school-cover.jpg?v=1586797786',title:'Lola Goes to School',notes:'Reintroduce the text. Tell children to pay attention to the words and illustrations to get to know Lola.',materials:'Lola Goes to School',vocab:'—'},{type:'prompt',title:'Let’s Get to Know Lola',icon:'♡',kicker:'BEFORE WE READ',copy:'Let’s pay attention to the words and illustrations to get to know Lola.',notes:'Read the book again, focusing on Lola’s feelings and children’s connections to their own experiences.',materials:'Before reading · 1 minute',vocab:'—'},{type:'spread',title:'Pages 1–2',src:'../lola-read1/book-03.png',notes:'Continue reading.',materials:'Adapted text · pages 1–2',vocab:'—'},{type:'spread',title:'Pages 3–4',src:'../lola-read1/book-04.png',notes:'Continue reading.',materials:'Adapted text · pages 3–4',vocab:'visit'},{type:'spread',title:'Pages 5–6',src:'../lola-read1/book-05.png',notes:'Continue reading.',materials:'Adapted text · pages 5–6',vocab:'jumping pants'},{type:'spread',title:'Pages 7–8',src:'../lola-read1/book-06.png',notes:'Continue reading.',materials:'Adapted text · pages 7–8',vocab:'—'},{type:'spread',title:'Pages 9–10',src:'../lola-read1/book-07.png',notes:'Read through this spread, then pause for the feelings question.',materials:'Adapted text · pages 9–10 / curriculum stop page 9',vocab:'—'},{type:'prompt',title:'How Might Lola Feel?',icon:'♡',kicker:'STOP & THINK',copy:'Why do you think everyone gets up so early? How might Lola be feeling the night before school and in the morning?',notes:'Invite children to infer Lola’s feelings from the words and illustrations and connect them to their own feelings.',materials:'Curriculum stopping point · page 9',vocab:'—'},{type:'spread',title:'Pages 11–12',src:'../lola-read1/book-08.png',notes:'Continue reading.',materials:'Adapted text · pages 11–12',vocab:'welcome'},{type:'spread',title:'Pages 13–14',src:'../lola-read1/book-09.png',notes:'Continue reading.',materials:'Adapted text · pages 13–14',vocab:'decide'},{type:'spread',title:'Pages 15–16',src:'../lola-read1/book-10.png',notes:'Read this spread, then pause to study the picture and words.',materials:'Adapted text · pages 15–16 / curriculum stop page 15',vocab:'—'},{type:'prompt',title:'Look and Listen',icon:'?',kicker:'STOP & THINK',copy:'What’s happening? Let’s look at the picture and listen to the words. How might Lola feel now?',notes:'Support children in describing Lola using evidence from the illustration and text.',materials:'Curriculum stopping point · page 15',vocab:'—'},{type:'spread',title:'Pages 17–18',src:'../lola-read1/book-11.png',notes:'Continue reading.',materials:'Adapted text · pages 17–18',vocab:'—'},{type:'spread',title:'Pages 19–20',src:'../lola-read1/book-12.png',notes:'Continue reading.',materials:'Adapted text · pages 19–20',vocab:'motion'},{type:'spread',title:'Pages 21–22',src:'../lola-read1/book-13.png',notes:'Read through this spread, then pause for the curriculum explanation of motions.',materials:'Adapted text · pages 21–22 / curriculum stop page 20',vocab:'motion'},{type:'prompt',title:'Motions',sprite:true,kicker:'QUICK CONNECTION',copy:'Motions are movements or gestures. Lola knows all the motions to this song—that probably makes her feel good!',notes:'Briefly reinforce the meaning of motions and connect knowing the song motions to Lola’s feelings.',materials:'Curriculum stopping point · page 20',vocab:'motion — movements or gestures'},{type:'spread',title:'Pages 23–24',src:'../lola-read1/book-14.png',notes:'Read to the end of the adapted story.',materials:'Adapted text · pages 23–24',vocab:'exhausting'},{type:'prompt',title:'How Does Lola Feel?',icon:'♡',kicker:'AFTER READING',copy:'How does Lola feel at the end of the story? Why? Thumbs up if you have felt that way!',notes:'Invite children to describe Lola’s feelings and connect them to their own experiences.',materials:'After reading · 2 minutes',vocab:'—'},{type:'prompt',title:'We Got to Know Lola',icon:'♥',kicker:'CLOSING',copy:'Today we paid attention to the words and illustrations to get to know Lola. We thought about our own experiences, too.',notes:'Close the Read Aloud and transition to the next part of the day.',materials:'Closing · 1 minute',vocab:'—'}];const key='eea-daily-lessons-u1-w1-1',version='lola-read2-v5';let step=0;try{const s=JSON.parse(localStorage.getItem(key));if(s?.raVersion===version&&Number.isInteger(s?.raStep))step=Math.max(0,Math.min(cards.length-1,s.raStep))}catch(e){}const $=id=>document.getElementById(id);function save(done=false){let s={current:1,done:[],raStep:step,raVersion:version};try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}s.current=1;s.raStep=step;s.raVersion=version;if(done&&!s.done.includes(1))s.done.push(1);localStorage.setItem(key,JSON.stringify(s))}function render(){const c=cards[step],card=$('card');card.className='card';$('panel').classList.remove('open');if(c.type==='cover'){card.classList.add('cover-card');card.innerHTML=`<div class="cover-wrap"><img src="${c.src}" alt="Lola Goes to School book cover"></div><div class="cover-info"><div class="cover-kicker">TODAY’S BOOK · READ 2</div><h2>Lola Goes to School</h2><div class="cover-byline">Written by Anna McQuinn<br>Illustrated by Rosalind Beardshaw</div><div class="cover-question">Let’s get to know Lola.</div><div class="step">READ 2 · ${step+1} OF ${cards.length}</div></div>`}else if(c.type==='spread'){card.classList.add('spread-card');card.innerHTML=`<div class="spread-image"><img src="${c.src}" alt="Lola Goes to School ${c.title}"></div><div class="step">READ 2 · ${step+1} OF ${cards.length}</div>`}else{card.classList.add('prompt-card');const visual=c.sprite?`<div class="spritevisual">${motionSprite()}</div>`:`<div class="visual">${c.icon}</div>`;card.innerHTML=`<div class="prompt-kicker">${c.kicker}</div>${visual}<h2>${c.title}</h2><div class="copy">${c.copy}</div><div class="step">READ 2 · ${step+1} OF ${cards.length}</div>`}$('count').textContent=`${step+1} of ${cards.length}`;$('fill').style.width=((step+1)/cards.length*100)+'%';$('noteTitle').textContent=c.title;$('notes').textContent=c.notes||'Continue reading.';$('vocab').textContent=c.vocab||'—';$('materials').textContent=c.materials||'Lola Goes to School';$('prev').disabled=step===0;$('next').textContent=step===cards.length-1?'Finish Read Aloud ✓':'Next →';save()}$('prev').onclick=()=>{if(step>0){step--;render()}};$('next').onclick=()=>{if(step<cards.length-1){step++;render()}else{save(true);location.href='daily-lessons.html'}};$('backBtn').onclick=()=>{save();location.href='daily-lessons.html'};$('notesBtn').onclick=()=>$('panel').classList.toggle('open');render()})();</script></body></html>
