<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 4 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f6f1e5}.app,.stage{width:100%;height:100%}.stage{background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .08s}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Week 4 daily lesson"></iframe></section></main><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(6,Number(p.get('section'))||0));const flow=['community-meeting-week4.html','week4-read-aloud.html','week4-intro-centers.html','week4-small-groups.html','week4-building-blocks.html','week4-storytelling.html','closing-circle-week4.html'];const frame=document.getElementById('frame');localStorage.setItem('eea-daily-week','4');localStorage.setItem('eea-daily-day',String(day));function overview(){location.href=`daily-lessons.html?week=4&day=${day}&v=${Date.now()}`}function advance(){if(section>=6){location.href='index.html';return}section++;load()}function retreat(){if(section===0){overview();return}section--;load()}function stopVisible(d){const s=d.getElementById('stop');return !!s&&s.classList.contains('show')}function prepare(){let d;try{d=frame.contentWindow.document;if(!d?.body)return}catch(e){return}const next=d.getElementById('next'),prev=d.getElementById('prev'),exit=d.getElementById('exit')||d.getElementById('closeBtn')||d.getElementById('backBtn');if(section===0){if(prev){const cards=[...d.querySelectorAll('.card')],active=cards.findIndex(c=>c.classList.contains('active'));if(active<=0){prev.disabled=false;prev.textContent='← Day Overview';prev.onclick=e=>{e.preventDefault();overview()}}}if(next){const sync=()=>{if(/Done/i.test(next.textContent||''))next.textContent='Next: Read Aloud →'};sync();new MutationObserver(sync).observe(next,{childList:true,subtree:true,characterData:true});next.addEventListener('click',e=>{if(/Next: Read Aloud/i.test(next.textContent||'')){e.preventDefault();e.stopImmediatePropagation();advance()}},true)}}else if(section===1){if(prev){const syncPrev=()=>{const first=/Slide\s+1\s+of/i.test(d.getElementById('count')?.textContent||'');if(first){prev.disabled=false;prev.textContent='← Community Meeting'}};syncPrev();new MutationObserver(syncPrev).observe(d.getElementById('count')||d.body,{childList:true,subtree:true,characterData:true});prev.addEventListener('click',e=>{if(/Community Meeting/i.test(prev.textContent||'')){e.preventDefault();e.stopImmediatePropagation();retreat()}},true)}if(next){next.addEventListener('click',e=>{const final=/Finish Read Aloud/i.test(next.textContent||'');const stop=d.getElementById('stop'),hasStop=!!stop?.textContent.trim();if(final&&(!hasStop||stopVisible(d))){e.preventDefault();e.stopImmediatePropagation();advance()}},true)}}else if(section===2){const done=d.getElementById('done');if(done){done.textContent='Next: Small Groups →';done.onclick=e=>{e.preventDefault();advance()}}}else if(section===3){if(exit){exit.textContent='→';exit.setAttribute('aria-label','Next: Building Blocks');exit.onclick=e=>{e.preventDefault();advance()}}}else if(section===4){const b=d.querySelector('.bottom button');if(b){b.textContent='Next: Storytelling →';b.onclick=e=>{e.preventDefault();advance()}}}else if(section===5){const bs=[...d.querySelectorAll('.bottom button')],b=bs[bs.length-1];if(b){b.textContent='Next: Closing Circle →';b.onclick=e=>{e.preventDefault();advance()}}}else if(section===6){const b=d.querySelector('.bottom button');if(b){b.textContent='Finish Today ✓';b.onclick=e=>{e.preventDefault();location.href='index.html'}}}if(exit&&section!==3)exit.onclick=e=>{e.preventDefault();overview()};frame.style.opacity=1}function load(){frame.style.opacity=0;frame.src=`${flow[section]}?day=${encodeURIComponent(days[day])}&from=runner&week=4&section=${section}&v=${Date.now()}`}frame.addEventListener('load',()=>setTimeout(prepare,30));load()})();</script></body></html>
