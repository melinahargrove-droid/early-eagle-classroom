<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 4 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f6f1e5}.app,.stage{width:100%;height:100%}.stage{background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .08s}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Week 4 daily lesson"></iframe></section></main><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(6,Number(p.get('section'))||0));const flow=['community-meeting-week4.html','week4-read-aloud.html','week4-intro-centers.html','week4-small-groups.html','week4-building-blocks.html','week4-storytelling.html','closing-circle-week4.html'];const frame=document.getElementById('frame');localStorage.setItem('eea-daily-week','4');localStorage.setItem('eea-daily-day',String(day));function overview(){location.href=`daily-lessons.html?week=4&day=${day}&v=${Date.now()}`}function advance(){if(section>=6){location.href='index.html';return}section++;load()}function retreat(){if(section===0){overview();return}section--;load()}function activeCommunityIndex(d){const cards=[...d.querySelectorAll('.card')];const i=cards.findIndex(c=>c.classList.contains('active'));return i<0?0:i}function readStopVisible(d){const s=d.getElementById('stop');return !!s&&s.classList.contains('show')}async function ensureVisuals(w,d){try{if(section===0){if(w.EEAVisualsReady)await w.EEAVisualsReady;return}if(section>=2){let s=d.getElementById('eeaLessonVisualEdit');if(!s){s=d.createElement('script');s.id='eeaLessonVisualEdit';s.src='lesson-visual-edit.js?v=20260823-1054';await new Promise(resolve=>{s.onload=resolve;s.onerror=resolve;d.head.appendChild(s)})}if(w.EEAVisualsReady)await w.EEAVisualsReady}}catch(e){}}async function prepare(){let w,d;try{w=frame.contentWindow;d=w.document;if(!d?.body)return}catch(e){return}const next=d.getElementById('next'),prev=d.getElementById('prev'),done=d.getElementById('done')||d.getElementById('doneBtn')||((section===4||section===6)?d.querySelector('.bottom button'):null),exit=d.getElementById('exit')||d.getElementById('closeBtn')||d.getElementById('backBtn');function sync(){if(section===0&&prev){const first=activeCommunityIndex(d)===0;prev.disabled=false;prev.dataset.boundary=first?'1':'0';prev.textContent=first?'← Day Overview':'← Previous'}if(section===0&&next&&/Done/i.test(next.textContent||'')){next.dataset.boundary='1';next.textContent='Next: Read Aloud →'}if(section===1&&prev){const count=d.getElementById('count')?.textContent||'',first=day===3?/Slide\s+10\s+of/i.test(count):/Slide\s+1\s+of/i.test(count);prev.dataset.boundary=first?'1':'0';prev.disabled=false;prev.textContent=first?'← Community Meeting':'← Previous'}if(section===1&&next){const labelFinal=/Finish Read Aloud/i.test(next.textContent||''),mustShowFinalStop=day===2&&!readStopVisible(d),final=labelFinal&&!mustShowFinalStop;next.dataset.boundary=final?'1':'0';if(final)next.textContent='Next: Centers →'}if(section===2&&done)done.textContent='Next: Small Groups →';if(section===4&&done)done.textContent='Next: Storytelling →';if(section===5&&done)done.textContent='Next: Closing Circle →';if(section===6&&done)done.textContent='Finish Today ✓'}sync();d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='prev'&&b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();retreat();return}if(b.id==='next'&&b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();advance();return}if(done&&b===done&&section>=2){e.preventDefault();e.stopImmediatePropagation();if(section===6)location.href='index.html';else advance();return}if(['exit','closeBtn','backBtn'].includes(b.id)){e.preventDefault();e.stopImmediatePropagation();overview();return}setTimeout(sync,0)},true);await ensureVisuals(w,d);setTimeout(sync,40);frame.style.opacity=1}function load(){frame.style.opacity=0;frame.src=`${flow[section]}?day=${encodeURIComponent(days[day])}&from=runner&week=4&section=${section}&v=${Date.now()}`}frame.addEventListener('load',()=>setTimeout(()=>prepare(),30));load()})();</script></body></html>
