<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 4 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f6f1e5}.app{width:100%;height:100%;padding:1.2vh 1.5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.top{height:8.5vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid rgba(89,139,151,.22)}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.1em;font-size:11px}.brand h1{margin:.2vh 0 0;font-size:clamp(28px,2.2vw,43px)}.daytitle{font-weight:900}.topright{display:flex;justify-content:flex-end;gap:.6vw}.pill,.home{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.pill{border-radius:16px;padding:.8vh 1vw}.home{width:48px;height:48px;border-radius:50%;font-size:21px}.dash{height:88vh;display:grid;grid-template-columns:16.5vw 1fr 12.5vw;gap:.8vw;padding-top:1vh}.side,.tools{border:1.4px solid rgba(89,139,151,.23);border-radius:22px;background:rgba(255,254,249,.9);padding:1.2vh .8vw}.side{display:flex;flex-direction:column}.side h3,.tools h3{margin:.3vh .2vw 1vh;font-size:16px}.count{font-size:11px;color:#789697;font-weight:900;margin-bottom:1vh}.resumeNote{padding:.7vh .6vw;border-radius:12px;background:#eef5f4;color:#557876;font-size:11px;font-weight:800;margin-bottom:1vh}.path{display:flex;flex-direction:column;gap:.48vh}.path button{width:100%;text-align:left;border:1px solid rgba(89,130,146,.17);border-radius:14px;background:#fffdf8;color:#245c78;padding:.68vh .6vw;cursor:pointer}.path button b{display:block;font-size:12px}.path button span{display:block;color:#718985;font-size:9.7px}.path button.active{background:#dcecf5;border-color:#8fbfd8;box-shadow:inset 4px 0 0 #5c9ac5}.path button.doneStep{background:#edf5e8;border-color:#b6d29f}.stage{position:relative;border:1.5px solid rgba(89,139,151,.25);border-radius:24px;background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block}.tools section{border:1px solid rgba(89,130,146,.16);border-radius:16px;padding:1vh .7vw;margin-bottom:1vh;background:#fffdf8}.tools button{display:block;width:100%;border:0;border-radius:12px;padding:1vh .4vw;margin:.6vh 0;background:#e7f2f8;color:#245c78;font-weight:900;cursor:pointer}.tools .editBtn{background:#edf3e6;color:#4f704b}.custom{position:absolute;inset:0;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 62%,#e4eee9);padding:3vh 3vw;z-index:5}.custom.show{display:flex}.customTop{display:flex;justify-content:space-between;align-items:center}.customKicker{color:#789697;font-weight:900;letter-spacing:.1em}.customBody{flex:1;display:grid;grid-template-columns:35% 1fr;gap:4vw;align-items:center;background:#fffdf9;border:1.5px solid #cbdde0;border-radius:30px;padding:4vh 4vw;margin:2vh 0}.customVisual{min-height:40vh;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,10vw,175px)}.customVisual img{max-width:100%;max-height:48vh;object-fit:contain;border-radius:24px}.customCopy h2{font-size:clamp(42px,4vw,76px);margin:0 0 2vh;color:#164f7f}.customText{font-size:clamp(21px,1.5vw,30px);font-weight:850;line-height:1.4;color:#557876;white-space:pre-wrap}.customPrompt{margin-top:2vh;padding:1.5vh 1.3vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(18px,1.2vw,24px);font-weight:900;white-space:pre-wrap}.customNav{display:flex;align-items:center;justify-content:space-between}.customNav button,.noteBtn{border:1px solid #d4e0df;border-radius:16px;padding:1vh 1.2vw;font-weight:900;cursor:pointer}.customPrev,.noteBtn{background:#fffdf8;color:#245c78}.customNext{background:#668f99;color:white}.teacherPanel{display:none;position:absolute;right:3vw;bottom:10vh;width:min(500px,38vw);z-index:20;background:#fffdf9;border:1.5px solid #c9dce0;border-radius:20px;padding:18px;box-shadow:0 12px 30px #0002;color:#557876;font-weight:800}.teacherPanel.show{display:block}</style></head><body><main class="app"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Lessons</h1></div><div class="daytitle"><span id="dayName"></span> · Week 4</div><div class="topright"><button class="pill" id="overviewBtn">Day Overview</button><button class="home" id="homeBtn">⌂</button></div></header><div class="dash"><aside class="side"><h3>Today’s Lesson Path</h3><div class="count" id="count"></div><div class="resumeNote">Your place is saved automatically.</div><div class="path" id="path"></div></aside><section class="stage"><iframe id="frame" title="Daily lesson"></iframe><section class="custom" id="custom"><div class="customTop"><div class="customKicker" id="customKicker"></div><button class="noteBtn" id="customNote">Teacher Note</button></div><div class="customBody"><div class="customVisual" id="customVisual">⭐</div><div class="customCopy"><h2 id="customTitle"></h2><div class="customText" id="customText"></div><div class="customPrompt" id="customPrompt"></div></div></div><div class="customNav"><button class="customPrev" id="customPrev">← Previous</button><span id="customCount" style="font-weight:900;color:#6e8785"></span><button class="customNext" id="customNext">Next →</button></div><aside class="teacherPanel" id="teacherPanel"></aside></section></section><aside class="tools"><section><h3>Edit This Lesson</h3><button class="editBtn" id="manageScreens">✎ Edit Lesson</button><button class="editBtn" id="addScreen">＋ Add Screen</button></section><section><h3>Quick Tools</h3><button onclick="location.href='timer.html'">Timer</button><button onclick="location.href='clean-up.html'">Clean Up Song</button><button onclick="location.href='choose-a-friend.html'">Choose a Friend</button></section></aside></div></main><script src="visual-store.js"></script><script>(()=>{const W=4,p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(6,Number(p.get('section'))||0)),customMode=false,customIndex=0;const names=['Community Meeting','Read Aloud','Centers','Small Groups','Building Blocks','Storytelling','Closing Circle'],icons=['🌞','📖','🧩','🔤','🔷','✨','🏁'],subs=['Start together','Today’s book','Center lesson','Literacy & writing','Math','Tell our story','Reflect & say goodbye'],flow=['community-meeting-week4.html','week4-read-aloud.html','week4-intro-centers.html','week4-small-groups.html','week4-building-blocks.html','week4-storytelling.html','closing-circle-week4.html'],frame=document.getElementById('frame'),custom=document.getElementById('custom'),path=document.getElementById('path'),pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},RESUME='eea-lesson-resume',ADDED='eea-added-lesson-screens',completeKey=()=>`eea-lesson-complete-${today()}-w${W}-d${day}`;document.getElementById('dayName').textContent=days[day];localStorage.setItem('eea-daily-week',String(W));localStorage.setItem('eea-daily-day',String(day));localStorage.setItem('eea-daily-date',today());function data(){try{return JSON.parse(localStorage.getItem(ADDED)||'{}')||{}}catch(e){return{}}}function added(){const a=data()[`w${W}-d${day}-s${section}`];return Array.isArray(a)?a:[]}function getResume(){try{const r=JSON.parse(localStorage.getItem(RESUME)||'null');return r&&r.date===today()&&Number(r.week)===W&&Number(r.day)===day&&Number(r.section)===section?r:null}catch(e){return null}}function saveResume(){localStorage.setItem(RESUME,JSON.stringify({date:today(),week:W,day,section,mode:customMode?'custom':'builtin',customIndex:customMode?customIndex:null}))}function completed(){try{const a=JSON.parse(localStorage.getItem(completeKey())||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function mark(i){const a=completed();if(!a.includes(i)){a.push(i);a.sort((x,y)=>x-y);localStorage.setItem(completeKey(),JSON.stringify(a))}}function renderPath(){const c=completed();path.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===section?'active':''} ${c.includes(i)?'doneStep':''}"><b>${icons[i]} ${n}${c.includes(i)?' ✓':''}</b><span>${subs[i]}</span></button>`).join('');[...path.children].forEach(b=>b.onclick=()=>enter(Number(b.dataset.i),true));document.getElementById('count').textContent=`${c.length} of ${names.length} complete`}function overview(){saveResume();location.href=`daily-lessons.html?week=${W}&day=${day}&v=${Date.now()}`}function home(){saveResume();location.href='index.html'}function enter(i,start=true){section=Math.max(0,Math.min(names.length-1,i));customIndex=0;customMode=start&&added().length>0;load()}function advance(){mark(section);if(section===names.length-1){localStorage.removeItem(RESUME);location.href='index.html';return}enter(section+1,true)}function retreat(){if(section===0){overview();return}enter(section-1,false)}async function renderCustom(){const list=added();if(!list.length){customMode=false;loadBuiltIn();return}customIndex=Math.max(0,Math.min(list.length-1,customIndex));const s=list[customIndex];custom.classList.add('show');frame.style.display='none';document.getElementById('customKicker').textContent=`TEACHER ADDED · ${names[section].toUpperCase()}`;const v=document.getElementById('customVisual');v.innerHTML='';let img='';try{if(s.imageKey)img=await EEAVisualStore.get(s.imageKey)}catch(e){}if(img){const el=document.createElement('img');el.src=img;el.alt=s.title||'Lesson visual';v.appendChild(el)}else v.textContent=s.visual||'⭐';document.getElementById('customTitle').textContent=s.title||'Teacher Added Screen';document.getElementById('customText').textContent=s.body||'';const pr=document.getElementById('customPrompt');pr.textContent=s.prompt||'';pr.style.display=s.prompt?'block':'none';document.getElementById('customCount').textContent=`Added screen ${customIndex+1} of ${list.length}`;document.getElementById('customNext').textContent=customIndex===list.length-1?'Continue to Lesson →':'Next →';const panel=document.getElementById('teacherPanel');panel.textContent=s.note||'No teacher note for this screen.';panel.classList.remove('show');saveResume()}document.getElementById('customPrev').onclick=()=>{if(customIndex>0){customIndex--;renderCustom()}else retreat()};document.getElementById('customNext').onclick=()=>{if(customIndex<added().length-1){customIndex++;renderCustom()}else{customMode=false;loadBuiltIn()}};document.getElementById('customNote').onclick=()=>document.getElementById('teacherPanel').classList.toggle('show');function controls(d){const finalButton=section>=4?d.querySelector('.back'):null;return{next:d.getElementById('next'),prev:d.getElementById('prev'),done:d.getElementById('done')||d.getElementById('doneBtn')||d.querySelector('.done')||finalButton,exit:d.getElementById('exit')||d.getElementById('closeBtn')||d.getElementById('backBtn')}}function state(){try{const fn=frame.contentWindow.EEASectionState;return typeof fn==='function'?fn():null}catch(e){return null}}function sync(d){const c=controls(d),st=state();if(c.prev){let first=section>=2;if(section===0){const cards=[...d.querySelectorAll('.card')],i=cards.findIndex(x=>x.classList.contains('active'));first=i<=0}else if(section===1){const count=d.getElementById('count')?.textContent||'';first=st?!!st.atStart:(day===3?/Slide\s+10\s+of/i.test(count):/Slide\s+1\s+of/i.test(count))}c.prev.disabled=false;c.prev.dataset.boundary=first?'1':'0';if(first)c.prev.textContent=added().length?'← Added Screen':'← '+(section?names[section-1]:'Day Overview')}if(c.next){let end=false;if(section===0)end=/Done/i.test(c.next.textContent||'');else if(section===1){end=st?!!st.atEnd:/Finish Read Aloud/i.test(c.next.textContent||'');if(day===2&&d.getElementById('stop')&&!d.getElementById('stop').classList.contains('show'))end=false}c.next.dataset.boundary=end?'1':'0';if(end)c.next.textContent='Next: '+names[section+1]+' →'}if(c.done&&section>=2){c.done.dataset.boundary='1';c.done.textContent=section===names.length-1?'Finish Today ✓':'Next: '+names[section+1]+' →'}}async function prepare(){let d,w;try{w=frame.contentWindow;d=w.document;if(!d?.body)return}catch(e){return}sync(d);const resync=()=>setTimeout(()=>sync(d),0);w.addEventListener('eea-section-state',resync);d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();if(b.id==='prev'){if(added().length){customMode=true;customIndex=added().length-1;renderCustom()}else retreat()}else advance();return}const c=controls(d);if(c.exit&&b===c.exit){e.preventDefault();e.stopImmediatePropagation();overview();return}resync()},true);setTimeout(()=>sync(d),40)}function loadBuiltIn(){custom.classList.remove('show');frame.style.display='block';customMode=false;saveResume();const s=flow[section],join=s.includes('?')?'&':'?';frame.onload=()=>setTimeout(prepare,30);frame.src=s+join+`day=${encodeURIComponent(days[day])}&from=runner&week=${W}&section=${section}&v=${Date.now()}`}function load(){renderPath();if(customMode&&added().length)renderCustom();else loadBuiltIn()}document.getElementById('overviewBtn').onclick=overview;document.getElementById('homeBtn').onclick=home;document.getElementById('addScreen').onclick=()=>{saveResume();location.href=`lesson-screen-editor.html?week=${W}&day=${day}&section=${section}`};document.getElementById('manageScreens').onclick=()=>{saveResume();location.href=`lesson-screen-manager.html?week=${W}&day=${day}&section=${section}`};window.addEventListener('pagehide',saveResume);const r=getResume();if(r&&r.mode==='custom'&&added().length){customMode=true;customIndex=Number(r.customIndex)||0}else customMode=false;load()})();</script></body></html>
