<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 2 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f6f1e5}.app{width:100%;height:100%;padding:1.2vh 1.5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.top{height:8.5vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid rgba(89,139,151,.22)}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.1em;font-size:11px}.brand h1{margin:.2vh 0 0;font-size:clamp(28px,2.2vw,43px)}.daytitle{font-weight:900;font-size:clamp(15px,1.1vw,21px)}.topright{display:flex;justify-content:flex-end;gap:.6vw}.pill,.home{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.pill{border-radius:16px;padding:.8vh 1vw}.home{width:48px;height:48px;border-radius:50%;font-size:21px}.dash{height:88vh;display:grid;grid-template-columns:15vw 1fr 12.5vw;gap:.8vw;padding-top:1vh}.side,.tools{border:1.4px solid rgba(89,139,151,.23);border-radius:22px;background:rgba(255,254,249,.9);padding:1.2vh .8vw}.side{display:flex;flex-direction:column}.side h3,.tools h3{margin:.3vh .2vw 1vh;font-size:16px}.count{font-size:11px;color:#789697;font-weight:900;margin:0 .2vw 1vh}.path{display:flex;flex-direction:column;gap:.55vh}.path button{width:100%;text-align:left;border:1px solid rgba(89,130,146,.17);border-radius:15px;background:#fffdf8;color:#245c78;padding:.82vh .7vw;cursor:pointer}.path button b{display:block;font-size:13px}.path button span{display:block;color:#718985;font-size:10.5px;margin-top:.2vh}.path button.active{background:#dcecf5;border-color:#8fbfd8}.path button.doneStep{background:#edf5e8;border-color:#b6d29f}.continue{margin-top:auto;border:0;border-radius:15px;padding:1.1vh .5vw;background:#5c9ac5;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.stage{position:relative;border:1.5px solid rgba(89,139,151,.25);border-radius:24px;background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .08s}.tools section{border:1px solid rgba(89,130,146,.16);border-radius:16px;padding:1vh .7vw;margin-bottom:1vh;background:#fffdf8}.tools button{display:block;width:100%;border:0;border-radius:12px;padding:1vh .4vw;margin:.6vh 0;background:#e7f2f8;color:#245c78;font-weight:900;cursor:pointer}.focus .top,.focus .dash>.side,.focus .dash>.tools{display:none}.focus .app{padding:0}.focus .dash{height:100vh;display:block;padding:0}.focus .stage{width:100%;height:100%;border:0;border-radius:0}.done{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.done.show{display:flex}.done h1{font-size:clamp(42px,4vw,76px);margin:0 0 18px}.done p{font-size:22px;font-weight:800;color:#557876}.done button{border:0;border-radius:18px;padding:14px 22px;background:#668f99;color:#fff;font-weight:900;font-size:18px;cursor:pointer}</style></head><body><main class="app"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Lessons</h1></div><div class="daytitle"><span id="dayName"></span> · Week 2</div><div class="topright"><button class="pill" id="overviewBtn">Day Overview</button><button class="home" onclick="location.href='index.html'">⌂</button></div></header><div class="dash"><aside class="side"><h3>Today’s Lesson Path</h3><div class="count" id="count"></div><div class="path" id="path"></div><button class="continue" id="continue">Continue Teaching</button></aside><section class="stage"><iframe id="frame" title="Daily lesson"></iframe></section><aside class="tools"><section><h3>Teacher Materials</h3><div>Today’s lesson materials</div></section><section><h3>Quick Tools</h3><button onclick="location.href='timer.html'">5-Minute Timer</button><button onclick="location.href='clean-up.html'">Clean Up Song</button><button onclick="location.href='choose-friend.html'">Choose a Friend</button></section></aside></div></main><section class="done" id="done"><div><h1>Today’s Lessons Are Complete!</h1><p>You made it through all six Week 2 sections.</p><button onclick="location.href='index.html'">Home</button></div></section><script>(()=>{const p=new URLSearchParams(location.search),day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(5,Number(p.get('section'))||0)),landing=p.get('landing')==='end'?'end':'start';const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const names=['Community Meeting','Read Aloud','Centers','Literacy Small Groups','Storytelling','Closing Circle'];const icons=['🌞','📖','🧩','🔤','✨','🏁'];const subs=['Start together','Today’s book','Center lesson','Clothing Memory','Tell our story','Reflect & say goodbye'];const read=days.map(d=>'week2-read-aloud.html?day='+encodeURIComponent(d));const flow=[Array(5).fill('community-meeting-week2.html'),read,Array(5).fill('centers-week2.html'),Array(5).fill('literacy-small-groups-week2.html'),Array(5).fill('storytelling-week2.html'),Array(5).fill('closing-circle-week2.html')];const frame=document.getElementById('frame'),done=document.getElementById('done'),path=document.getElementById('path');document.getElementById('dayName').textContent=days[day];localStorage.setItem('eea-daily-week','2');localStorage.setItem('eea-daily-day',String(day));const key=()=>`eea-complete-w2-d${day}`;function completed(){try{const a=JSON.parse(localStorage.getItem(key())||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function render(){document.body.classList.add('focus');const c=completed();path.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===section?'active':''} ${c.includes(i)?'doneStep':''}"><b>${icons[i]} ${n}${c.includes(i)?' ✓':''}</b><span>${subs[i]}</span></button>`).join('');[...path.children].forEach(b=>b.onclick=()=>jump(Number(b.dataset.i)));document.getElementById('count').textContent=`${c.length} of 6 complete`}function mark(i){const c=completed();if(!c.includes(i)){c.push(i);localStorage.setItem(key(),JSON.stringify(c))}}function jump(i,end=false){section=Math.max(0,Math.min(5,i));landing=end?'end':(completed().includes(section)?'restart':'start');localStorage.setItem('eea-daily-section',String(section));load()}function advance(){if(section<=1)resetInternal();mark(section);if(section===5){location.href='index.html';return}jump(section+1)}function retreat(){if(section===0){location.href=`daily-lessons.html?week=2&day=${day}`;return}jump(section-1,true)}function resetInternal(){try{const d=frame.contentWindow.document,prev=d.getElementById('prev');let g=0;while(prev&&g++<220&&!prev.disabled)prev.click()}catch(e){}}function moveStart(d){if(section>1)return;const prev=d.getElementById('prev');let g=0;while(prev&&g++<220&&!prev.disabled)prev.click()}function moveEnd(d){const next=d.getElementById('next');if(!next)return;let g=0;if(section===0)while(g++<80&&!/Next Day|Done/i.test(next.textContent||''))next.click();else if(section===1)while(g++<200&&!/Finish Read Aloud|Done/i.test(next.textContent||''))next.click()}function prepare(){let w,d;try{w=frame.contentWindow;d=w.document;if(!d?.body)return}catch(e){return}if(landing==='end')moveEnd(d);else if(landing==='restart')moveStart(d);landing='start';const prev=d.getElementById('prev'),next=d.getElementById('next'),back=d.getElementById('backBtn'),doneBtn=d.getElementById('done')||d.getElementById('doneBtn'),exitBtn=d.getElementById('exit')||d.getElementById('back')||d.getElementById('closeBtn');function isVocab(){return !!d.querySelector('.vocab-slide.show')}function sync(){if(prev){const boundary=section===0?!!prev.disabled:(section===1?!!prev.disabled:section>=2);prev.dataset.boundary=boundary?'1':'0';if(boundary){prev.disabled=false;prev.textContent=section===0?'← Day Overview':'← '+names[section-1]}else if(section===1){prev.textContent='← Previous'}}if(next){const boundary=section>=2||(section===0?/Next Day|Done/i.test(next.textContent||''):/Finish Read Aloud|Done/i.test(next.textContent||''));next.dataset.boundary=boundary?'1':'0';if(boundary)next.textContent=section===5?'Finish Day ✓':'Next: '+names[section+1]+' →'}}sync();if(section===1&&next){d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.id!=='next'||isVocab())return;const side=d.getElementById('side'),stop=d.getElementById('stop');if(!side||!stop||!stop.textContent.trim())return;const visible=side.style.display==='block'||side.classList.contains('show');if(!visible){e.preventDefault();e.stopImmediatePropagation();side.classList.add('show');side.style.display='block';next.textContent='Continue →';return}side.classList.remove('show');side.style.display='none'},true)}d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='prev'&&b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();retreat();return}if(b.id==='next'&&b.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();advance();return}if((b.id==='done'||b.id==='doneBtn')&&section>=2){e.preventDefault();e.stopImmediatePropagation();advance();return}if(['backBtn','exit','back','closeBtn'].includes(b.id)){e.preventDefault();e.stopImmediatePropagation();location.href=`daily-lessons.html?week=2&day=${day}`;return}setTimeout(sync,0)},true);if(back)back.onclick=e=>{e.preventDefault();location.href=`daily-lessons.html?week=2&day=${day}`};if(doneBtn&&section>=2)doneBtn.onclick=e=>{e.preventDefault();advance()};if(exitBtn)exitBtn.onclick=e=>{e.preventDefault();location.href=`daily-lessons.html?week=2&day=${day}`};if(section>=2&&section<=5&&!d.getElementById('week2VisualOverrides')){const s=d.createElement('script');s.id='week2VisualOverrides';s.src='week2-visual-overrides.js';d.head.appendChild(s)}setTimeout(sync,40);frame.style.opacity=1}function load(){done.classList.remove('show');render();frame.style.display='block';frame.style.opacity=0;let src=flow[section][day];src+=(src.includes('?')?'&':'?')+`eeaRunner=1&week=2&dayIndex=${day}&section=${section}&landing=${landing}&v=${Date.now()}`;frame.src=src}frame.addEventListener('load',()=>setTimeout(prepare,30));document.getElementById('overviewBtn').onclick=()=>location.href=`daily-lessons.html?week=2&day=${day}`;document.getElementById('continue').onclick=()=>jump(section);load()})();</script></body></html>
