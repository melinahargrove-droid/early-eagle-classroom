<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fo3s U1W1 Monday Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:3vh 5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:10vh;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.11em;color:#789697}.brand h1{margin:.5vh 0;color:#164f7f;font-size:clamp(34px,3vw,58px)}.chip{height:max-content;background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.card{height:70vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:40% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.visual{height:52vh;border-radius:28px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;font-size:clamp(100px,10vw,180px)}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h2{font-size:clamp(38px,3.5vw,66px);margin:1vh 0;color:#164f7f}.copy p{font-size:clamp(19px,1.3vw,25px);font-weight:850;line-height:1.4;color:#527673}.note{background:#e7f0ed;border-radius:18px;padding:1.2vh 1.2vw;color:#416d61;font-weight:850;line-height:1.4}.bottom{height:12vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900;cursor:pointer}.bottom .next{background:#668f99;color:#fff}.progress{font-weight:900;color:#789697}</style></head><body><main class="page"><header><div class="brand">EARLY EAGLE ACADEMY · INTRO TO CENTERS · FOCUS ON PRE-K 3s<h1>Monday Center Introductions</h1></div><div class="chip">U1 · W1 · MONDAY</div></header><section class="card"><div class="visual" id="icon"></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><p id="say"></p><div class="note" id="note"></div></div></section><div class="bottom"><button id="prev">← Read Aloud</button><div class="progress" id="progress"></div><button class="next" id="next">Next →</button></div></main><script>(()=>{const cards=[{icon:'🖍️',eye:'WRITING & DRAWING',title:'Meet Writing & Drawing',say:'In our Writing and Drawing Center, we have different materials you can use to create, or make things, using drawing and writing. You can draw or write to share your ideas.',note:'Point to the center or show a photograph if it is not visible.'},{icon:'🖍️🖊️',eye:'CRAYONS + MARKERS',title:'You Can Decide',say:'Today we are going to use markers and crayons. You can decide, or make a choice, about which you want to use, just like Lola got to choose different things to play with in her classroom.',note:'Hold up a crayon and marker and model making a choice.'},{icon:'🖊️',eye:'MATERIAL CARE',title:'Listen for the Click',say:'When I’m all done with a marker, I put the cap back on and press until I hear a click.',note:'Model drawing on paper, recapping the marker tightly, and returning it to the cup. Explain that this keeps it ready for other friends.'},{icon:'📄',eye:'EXPECTATION',title:'Paper Is for Drawing',say:'Markers and crayons are for writing on paper—not on the tables or other things in our classroom.',note:'Model the expectation and explain the clean-up routine: ask a teacher to write the child’s name, put the work in the cubby, then choose another place to play.'},{icon:'🧪',eye:'SCIENCE & ENGINEERING',title:'Meet Science & Engineering',say:'In our Science and Engineering Center, we will use our senses of touch, smell, and sight to work with playdough.',note:'Bring a small amount of playdough to Intro to Centers. Child-sized balls should be prepared at the center.'},{icon:'👃',eye:'EXPLORE WITH SENSES',title:'Look, Smell, Feel',say:'This playdough feels ____. The playdough smells like ____. What do you notice?',note:'Demonstrate touching, smelling, and looking. The source also invites making a sound with the playdough and collecting children’s ideas.'},{icon:'🤲',eye:'PLAYDOUGH ACTIONS',title:'Roll · Pinch · Press',say:'We can roll, pinch, and press the playdough to make creations. What else can we do with playdough?',note:'During Centers, encourage children to describe how it looks, smells, and feels and how their hands change its shape—rolling, pinching, squishing, and smashing.'}];let i=0;const $=x=>document.getElementById(x);function draw(){const c=cards[i];$('icon').textContent=c.icon;$('eye').textContent=c.eye;$('title').textContent=c.title;$('say').textContent=c.say;$('note').innerHTML='<b>Teacher note:</b> '+c.note;$('progress').textContent=(i+1)+' of '+cards.length;$('prev').textContent=i===0?'← Read Aloud':'← Previous';$('next').textContent=i===cards.length-1?'Next: Storytelling →':'Next →'}$('prev').onclick=()=>{if(i===0)location.href='fo3s-u1w1-lola-read1.html';else{i--;draw()}};$('next').onclick=()=>{if(i<cards.length-1){i++;draw()}else location.href='fo3s-u1w1-storytelling.html'};draw()})();</script></body></html>
