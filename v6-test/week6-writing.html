<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Writing Basics</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1100px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}.card h1,.card h2{color:#165487}.card p,.card li{font-size:18px;line-height:1.5;color:#55747b;font-weight:750}.box{background:#e7f0ed;border-radius:18px;padding:16px;margin:14px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Writing Basics</h1><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week6-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'Storytelling • Teacher Models a True Story',html:`<p>Explain that communities tell stories and that a person who tells stories is a <b>storyteller</b>. Tell a brief true story about yourself.</p><div class="box">Ask: <b>What is my story about?</b></div><p>Close by explaining that you told the story to communicate something important about yourself so the children can get to know you better.</p>`},Tuesday:{title:'Turn and Talk • Introduce the Routine',html:`<p>Explain that Turn and Talk lets children share ideas with one classmate. Talking is another way people communicate and helps children get ready for writing.</p><p>Have two children model sitting together, facing each other, using low voices, taking turns speaking and listening.</p><div class="box">Practice prompt: <b>What is one of your favorite foods?</b></div>`},Wednesday:{title:'Turn and Talk • Practice',html:`<p>Provide an authentic opportunity to practice the Turn and Talk routine: face your partner, use a low voice, one partner talks while the other listens, then switch.</p><div class="box">Connect the prompt to the day: <b>What is one thing you noticed in <i>Goodbye Summer, Hello Autumn</i>?</b></div>`},Thursday:{title:'Turn and Talk • Practice',html:`<p>Reinforce taking turns, listening, and returning attention to the group signal.</p><div class="box">Prompt: <b>What kind of weather do you like? Why?</b></div>`},Friday:{title:'Turn and Talk • Practice and Reflect',html:`<p>Use Turn and Talk again so the routine becomes familiar.</p><div class="box">Prompt: <b>What is one thing you learned or made this week that you want your partner to know?</b></div><p>Briefly notice what is working well in partner talk and what needs more practice.</p>`}}[day];tag.textContent='WEEK 6 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
