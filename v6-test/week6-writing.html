<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Writing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1100px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}.card h1,.card h2{color:#165487}.card p,.card li{font-size:18px;line-height:1.5;color:#55747b;font-weight:750}.box{background:#e7f0ed;border-radius:18px;padding:16px;margin:14px 0}.bottom{display:flex;justify-content:center;gap:14px;margin-top:18px}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff;border-color:#668f99}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Writing</h1><h2 id="title"></h2><div id="content"></div><div class="bottom"><button id="prev">← Centers</button><button class="done" id="done">Done ✓</button></div></section></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',from=p.get('from')||'';const d={Monday:{title:'Lesson 1 • Storytelling',html:`<p>Explain that one thing a community does is tell stories and that the class will tell many stories to each other during the year. Introduce <b>storyteller</b>: a person who tells stories.</p><div class="box">Tell a brief, true story about yourself. Then ask: <b>What is my story about?</b></div><p>Close by explaining that you told a true story to <b>communicate</b> something important about yourself so the children can get to know you better.</p>`},Tuesday:{title:'Lesson 2 • Turn and Talk',html:`<p>Explain that during <b>Turn and Talk</b>, children can share ideas with one classmate instead of the whole group. Talking is another way people communicate and also helps get ready for writing.</p><p>Invite two children to model. Partners sit together facing each other, use voices only loud enough for their partner to hear, and take turns speaking and listening.</p><div class="box">Curriculum practice prompt: <b>What is one of your favorite foods?</b></div><p>Give the first partner time to respond, use your planned signal to stop, switch speaker/listener roles, and then signal both partners to return attention to the group.</p><p>Now have everyone try with their partner. Circulate to support the routine. If time allows, practice with additional low-risk prompts.</p>`},Wednesday:{title:'Ongoing Practice • Turn and Talk',html:`<p>The Week 6 Writing document contains two introductory lessons rather than a new required Writing lesson for every day.</p><div class="box">Use an authentic opportunity during classroom learning to practice the Turn and Talk routine introduced Tuesday: face the partner, use a low voice, take turns sharing/listening, and return attention when the group signal is given.</div>`},Thursday:{title:'Ongoing Practice • Turn and Talk',html:`<p>Continue giving children authentic opportunities to use Turn and Talk.</p><div class="box">Observe how children work in pairs. Notice which parts of the routine are becoming independent and which need reinforcement or reteaching.</div>`},Friday:{title:'Ongoing Practice • Turn and Talk',html:`<p>Continue using Turn and Talk authentically during classroom learning.</p><div class="box">Reinforce the curriculum's purpose: talking is one way people communicate, and partners take turns sharing and listening to one another's ideas.</div>`}}[day];const $=id=>document.getElementById(id);$('tag').textContent='WEEK 6 · '+day.toUpperCase();$('title').textContent=d.title;$('content').innerHTML=d.html;$('prev').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEARetreat==='function'){parent.EEARetreat();return}location.href='week6-intro-centers.html?day='+encodeURIComponent(day)};$('done').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEAAdvance==='function'){parent.EEAAdvance();return}location.href='week6-foundational.html?day='+encodeURIComponent(day)}})();</script></body></html>
