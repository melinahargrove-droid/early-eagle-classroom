<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 6 Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea)}.page{height:100vh;padding:3vh 5vw}.top{height:10vh;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;letter-spacing:.12em;color:#789697}.chip{padding:.6vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.card{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw}.visual{height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-size:clamp(70px,7vw,120px);font-weight:900}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:clamp(40px,3.5vw,68px);margin:1vh 0;color:#164f7f;line-height:1.04}.lead{font-size:clamp(20px,1.35vw,27px);font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh}.step{padding:1.1vh 1.2vw;background:#e7f0ed;border-radius:17px;color:#416d61;font-size:clamp(16px,1vw,20px);font-weight:900;line-height:1.35}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff}</style></head><body><main class="page"><div class="top"><div class="brand">EARLY EAGLE ACADEMY · INTRO TO CENTERS · WEEK 6</div><div class="chip" id="chip"></div></div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="prev">← Previous</button><button class="done" id="done">Done ✓</button></div></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday';const d={Monday:{icon:'🎨',title:'Art Studio + Art Easel',lead:'Introduce Exploring Beautiful Stuff and add yellow to Mixing and Painting.',steps:['Art Studio — remind children that last week they sorted and organized the Beautiful Stuff collection. Explain that the recycled and natural materials can now be used to make art. Look closely at a few materials and ask what they remind children of and what they might create.','Show the recycled-material artwork images. Invite children to notice how an artist can use found materials and to think about working together and sharing ideas.','Art Easel — revisit a couple of paintings from last week. Remind children that they mixed blue and red, then add yellow this week. Ask what they notice and what they think might happen when yellow is mixed with blue or red.','Remind children of clean-up expectations, including leaving brushes ready for the next person.']},Tuesday:{icon:'🧺',title:'Continue Week 6 Center Work',lead:'No new center introduction is listed for today in the Week 6 At a Glance.',steps:['Continue the available Week 6 center experiences.','Use the official center facilitation prompts and vocabulary as needed rather than introducing an additional required activity.']},Wednesday:{icon:'🥣',title:'Discovery: Mixing Salt Dough',lead:'Introduce the Week 6 Discovery experience listed for Day 3.',steps:['Use the official Mixing Salt Dough center guidance for the introduction.','Children combine ingredients and notice how materials change as they are mixed.']},Thursday:{icon:'🔎',title:'Continue Week 6 Center Work',lead:'No new center introduction is listed for today in the Week 6 At a Glance.',steps:['Continue and deepen the existing Week 6 center experiences.','Revisit official prompts, vocabulary, and materials as needed.']},Friday:{icon:'✨',title:'Continue Week 6 Center Work',lead:'No new center introduction is listed for today in the Week 6 At a Glance.',steps:['Continue, extend, document, or share work already underway.','Do not add a new required center unless it is supported by the curriculum materials.']}}[day];const $=id=>document.getElementById(id);$('chip').textContent='WEEK 6 · '+day.toUpperCase();$('eye').textContent=day.toUpperCase()+' · CENTER INTRODUCTION';$('visual').textContent=d.icon;$('title').textContent=d.title;$('lead').textContent=d.lead;$('steps').innerHTML=d.steps.map(s=>'<div class="step">'+s+'</div>').join('');$('prev').onclick=()=>location.href='week6-read-aloud.html?day='+encodeURIComponent(day);$('done').onclick=()=>location.href='week6-writing.html?day='+encodeURIComponent(day)})();</script></body></html>
