<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Intro to Centers</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{min-height:100vh;padding:22px}.head{max-width:1200px;margin:auto}.head h1{margin:0;color:#165487}.card{max-width:1200px;margin:18px auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:26px;padding:26px}.tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697}.card h2{font-size:34px;margin:5px 0;color:#165487}.card h3{color:#416d61}.card p,.card li{font-size:18px;line-height:1.5;font-weight:750;color:#55747b}.box{background:#e7f0ed;border-radius:16px;padding:14px;margin:12px 0}.back{background:#668f99;color:white;border:0;border-radius:999px;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><div class="head"><div class="tag">EARLY EAGLE ACADEMY · WEEK 6</div><h1>Intro to Centers</h1></div><section class="card"><div class="tag" id="day"></div><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week6-plan.html'">Done ✓</button></section></main><script>const n=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'Exploring Beautiful Stuff + Adding Yellow',html:`<h3>Art Studio: Exploring Beautiful Stuff</h3><p>Remind children that last week they sorted and organized the Beautiful Stuff collection. Explain that the recycled and natural materials can now be used to create art.</p><div class="box">Look closely at a few materials. What do they remind you of? What ideas do you have for what to create?</div><h3>Art Easel: Mixing and Painting</h3><p>Show paintings from last week. Add yellow to the red and blue paint choices. Invite predictions and ideas about mixing yellow with red or blue.</p>`},Tuesday:{title:'Building Where We Live + Caring for Babies',html:`<h3>Blocks: Building Where We Live</h3><p>Show photos of children’s Week 5 structures. Add people figures and invite children to represent people who live with them and neighbors who live nearby.</p><h3>Dramatic Play: Caring for Babies</h3><p>Revisit how children cared for babies. Use photos or observations to support collaboration, turn-taking, and clean-up routines.</p>`},Wednesday:{title:'Mixing Salt Dough + Retelling Stories',html:`<h3>Discovery: Mixing Salt Dough</h3><p>Introduce flour, salt, and water. Explain that water is a liquid and that the recipe tells how to combine the ingredients. Read the recipe together.</p><div class="box">Children will work together to measure and mix, then describe how the dough looks, smells, and feels.</div><h3>Library & Listening: Retelling Stories</h3><p>Add <i>Goodbye Summer, Hello Autumn</i> and its character puppets. Revisit how to use and carefully return book puppets.</p>`},Thursday:{title:'Observing Weather + Drawing Feelings',html:`<h3>Science & Engineering: Observing Weather</h3><p>Show Weather Observation Notebook pages and Clothing for Weather visuals. Invite children to continue recording weather and add clothing that would help people feel comfortable.</p><h3>Writing & Drawing: Drawing Feelings</h3><p>Ask how children felt when they arrived and how they feel now. Show examples of drawings that communicate feelings and invite children to represent their own.</p>`},Friday:{title:'Continue and Deepen Center Work',html:`<p>No new center is introduced today. Revisit the week’s vocabulary and help children extend work already underway in Beautiful Stuff, salt dough, neighborhood blocks, retelling, weather observation, caring for babies, painting, and drawing feelings.</p>`}}[n];day.textContent='WEEK 6 · '+n.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
