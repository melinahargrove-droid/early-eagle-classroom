<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 6 Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea)}.page{height:100vh;padding:3vh 5vw}.top{height:10vh;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;letter-spacing:.12em;color:#789697}.chip{padding:.6vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.card{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw}.visual{height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-size:clamp(70px,7vw,120px);font-weight:900}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:clamp(40px,3.5vw,68px);margin:1vh 0;color:#164f7f;line-height:1.04}.lead{font-size:clamp(20px,1.35vw,27px);font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh;max-height:44vh;overflow:auto;padding-right:.4vw}.step{padding:1.1vh 1.2vw;background:#e7f0ed;border-radius:17px;color:#416d61;font-size:clamp(15px,.95vw,19px);font-weight:900;line-height:1.35}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff}</style></head><body><main class="page"><div class="top"><div class="brand">EARLY EAGLE ACADEMY · INTRO TO CENTERS · WEEK 6</div><div class="chip" id="chip"></div></div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="prev">← Read Aloud</button><button class="done" id="done">Done ✓</button></div></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',from=p.get('from')||'';const d={Monday:{icon:'🎨',title:'Week 6 Center Updates',lead:'Use the official Week 6 continuation prompts plus the new Beautiful Stuff experience.',steps:['ART STUDIO — Last week children sorted and organized Beautiful Stuff. Explain that these recycled or natural materials can now be used to make art. Look closely and ask: What do they remind you of? What could you create?','ART EASEL — Revisit Week 5 paintings. Add yellow to the red and blue paint choices. Ask what children notice and what they might paint with their new colors. Remind children to leave brushes ready for the next painter.','BLOCKS — Continue building places where people live. Add people figures and invite children to represent people who live with them and neighbors who live nearby.','DRAMATIC PLAY — Revisit Caring for Babies using Week 5 photos/videos. Ask how children cared for babies. Use the curriculum option that best fits the class: support collaboration/taking turns OR make a plan for where baby items belong at clean-up.','LIBRARY & LISTENING — Continue retelling with puppets. As new texts are added, add their puppets too; demonstrate keeping each book and puppet set together when needed.','SCIENCE & ENGINEERING — Continue Weather Observation Notebooks. Invite children to add clothing people could wear to be comfortable in the weather they observe, using the Clothing for Weather visuals.','WRITING & DRAWING — Revisit Drawing Feelings. Ask: How did you feel when you came to school today? How are you feeling now? What made you feel that way? Remind children they can communicate feelings through drawings.']},Tuesday:{icon:'🧺',title:'Continue Week 6 Center Work',lead:'No new center introduction is assigned to Day 2 in the Week 6 At a Glance.',steps:['Continue the Week 6 experiences introduced or revisited Monday.','Use the official facilitation language and vocabulary for each center as children work; do not add an invented Day 2 lesson.']},Wednesday:{icon:'🥣',title:'Discovery: Mixing Salt Dough',lead:'Introduce the official Day 3 Discovery experience.',steps:['Explain that children have made playdough together and will now make another kind of dough called salt dough using three ingredients: flour, water, and salt.','Show the ingredients. Explain that water is a liquid—something that can be poured.','Read the salt dough recipe together while tracking the print.','During Centers, help children work together to measure and mix. Encourage them to notice and describe how the dough looks, smells, and feels and what happens if the ingredients change.']},Thursday:{icon:'🔎',title:'Continue Week 6 Center Work',lead:'No new center introduction is assigned to Day 4 in the Week 6 At a Glance.',steps:['Continue and deepen the official Week 6 center experiences.','Revisit the documented prompts, materials, and vocabulary when useful rather than creating a separate required lesson.']},Friday:{icon:'✨',title:'Continue Week 6 Center Work',lead:'No new center introduction is assigned to Day 5 in the Week 6 At a Glance.',steps:['Continue, extend, document, or share work already underway in the Week 6 centers.','Use the official center extensions when they match children’s interests; do not add an unsupported required center.']}}[day];const $=id=>document.getElementById(id);$('chip').textContent='WEEK 6 · '+day.toUpperCase();$('eye').textContent=day.toUpperCase()+' · CENTER INTRODUCTION';$('visual').textContent=d.icon;$('title').textContent=d.title;$('lead').textContent=d.lead;$('steps').innerHTML=d.steps.map(s=>'<div class="step">'+s+'</div>').join('');$('prev').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEARetreat==='function'){parent.EEARetreat();return}location.href='week6-read-aloud.html?day='+encodeURIComponent(day)};$('done').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEAAdvance==='function'){parent.EEAAdvance();return}location.href='week6-writing.html?day='+encodeURIComponent(day)}})();</script></body></html>
