="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 6 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Joyful Drawing or Painting 2',sub:'Art Studio',kicker:'CONTINUED LESSON',img:'assets/art.webp',materials:'existing Joyful Wall artwork/descriptions · established drawing and painting materials',vocab:'different · joyful · proud · strong',steps:[{title:'Remember Our Joyful Art',prompt:'Have you made a joyful drawing or painting?',cue:'Thumbs up if you have visited this experience.',script:'Ask whether children have visited the Art Studio to make a joyful drawing or painting—art showing something that makes them very happy.'},{title:'Look at Our Joyful Wall',prompt:'What brings our classmates joy?',cue:'Look at several pieces and listen to their descriptions.',script:'Show examples from the Joyful Wall and read children’s descriptions of what brings them joy.'},{title:'A New Idea Can Grow',prompt:'Seeing a friend’s idea might remind you of another thing that makes you happy.',cue:'Teacher models a new personal idea.',script:'Model the curriculum language: seeing the artwork gave you a new idea about something else that makes you feel really happy.'},{title:'Add More Joy',prompt:'You can make another drawing or painting today.',cue:'We will keep adding to our Joyful Wall.',script:'Invite children to return to Art Studio and make another joyful artwork. Explain that the class will keep adding new paintings and drawings to the Joyful Wall.'}]},{title:'Friends at School Book 2',sub:'Writing & Drawing',kicker:'CONTINUED LESSON',img:'assets/writing.webp',materials:'previous Friends at School pages · child photos · one popsicle stick per child · glue/tape · established writing/drawing materials',vocab:'cleanup · community · together · enjoy · cooperate',steps:[{title:'Read Our Class Pages',prompt:'What have we written about friends at school?',cue:'Share a few pages made last week.',script:'Explain that children have been making pages about playing, cleaning up, and cooperating with classroom community members. Invite a few children to share/read/describe their pages.'},{title:'What Do Friends Like to Do?',prompt:'What are some things our classmates like to do with friends?',cue:'Invite 2–3 ideas.',script:'Ask what classmates like to do with friends at school and invite 2–3 responses.'},{title:'Keep Writing Our Book',prompt:'Did you try something new or play with a new friend?',cue:'Write and draw about another school-friend experience.',script:'Explain that children can continue writing/drawing different things they like to do with friends, including something new they tried or a new friend they played with.'},{title:'Meet the Friend Puppets',prompt:'Use our class puppets to remember—or make up—a story.',cue:'Then write and draw about it.',script:'Show the paper puppets made from children’s photos on popsicle sticks. Explain that they can help children remember or invent stories about things they like to do with friends, then write/draw those stories.'}]},Tuesday:[{title:'Pizza Shop',sub:'Dramatic Play',kicker:'NEW LESSON',img:'assets/dramatic-play.webp',materials:'Little Red Hen · pizza shop images · takeout boxes/pans · pretend dough/toppings · aprons/tablecloths/dishes · signs/menus/order slips · clipboards/writing tools · cash register/play money · role tags · pizza-making steps',vocab:'knead · order · size · stretch · toppings',steps:[{title:'Hen Made Pizza',prompt:'What did Hen buy ingredients to make?',cue:'Pizza!',script:'Show a few pages from The Little Red Hen Makes a Pizza and recall that Hen bought ingredients to make pizza.'},{title:'What Is a Pizza Shop?',prompt:'Have you visited a pizza restaurant or shop?',cue:'Share what it was like—or use the “me too” signal.',script:'Explain that a pizza shop is a place where people can buy pizza. Invite 2–3 experiences, and use the “me too” signal for shared experiences.'},{title:'Notice Pizza Shops',prompt:'What do you notice in these pictures?',cue:'Look for people, tools, food, menus, and spaces.',script:'Show pizza-shop images and invite 1–2 observations.'},{title:'Knead & Stretch Dough',prompt:'Press · fold · pull',cue:'Hen kneaded and stretched the dough.',script:'Show pages 15–16. Explain knead as pressing/folding dough and stretch as pulling it so it gets bigger. Act out/model the motions.'},{title:'Open Our Pizza Shop',prompt:'Our Dramatic Play Center is adding a pizza shop!',cue:'Children can help create it.',script:'Show/name the pizza-shop materials. Explain that children may help sort ingredients, make signs/menus, create props, and name the shop.'},{title:'Customer & Chef',prompt:'Order → toppings → make the pizza.',cue:'Model both sides of the interaction.',script:'Model a customer ordering a pizza and naming toppings. Then model a chef looking at the order and making the pizza.'}],teacherNote:'Focus on 3s explicitly says the pizza shop may be delayed or skipped if children are still deeply engaged in or have not had enough time with the supermarket. Make the decision based on children’s interests.'},{title:'Partner Building 2',sub:'Blocks',kicker:'CONTINUED LESSON',img:'assets/blocks.webp',materials:'blocks · photos of children partner building · photos of neighborhood/local buildings',vocab:'cooperate · steady · ability',steps:[{title:'Remember Partner Building',prompt:'What have we built with partners?',cue:'Look at photographs from the Block Center.',script:'Show photos of children partner building. Ask what they have built and some ways they have worked together.'},{title:'Build Tall Together',prompt:'How tall can you and a partner build?',cue:'Continue cooperating on one structure.',script:'Explain that this week children will continue building with partners and see how tall they can build a structure.'},{title:'What Makes It Steady?',prompt:'How can a tall structure stand without falling?',cue:'Think about support, block placement, and teamwork.',script:'Ask what could make a structure steady so it can stand very tall. Use children’s ideas during Centers.'}]}],Wednesday:[{title:'Number Pizzas',sub:'Math',kicker:'NEW LESSON',img:'assets/math.webp',materials:'Little Red Hen pizza page · pizza templates · yellow/red counters · number dot cards · Building Blocks Teacher Guide p.40',vocab:'less · more · equal',steps:[{title:'Remember Hen’s Pizza',prompt:'What toppings do you like?',cue:'Look at the finished pizza in the book.',script:'Show Hen’s pizza with toppings. Explain that this week Math will add toppings to pizza templates. Ask children what toppings they like.'},{title:'Count 2 Toppings',prompt:'I need 2 pepperonis. Help me count.',cue:'1, 2. How do we know there are two?',script:'Place two counters on the pizza and count them with children. Ask how they know there are two toppings.'},{title:'One More',prompt:'What if I want one more topping?',cue:'More means a bigger amount.',script:'Introduce more using the curriculum definition and invite ideas about what to do to the pizza.'},{title:'One Less',prompt:'What if I want one less topping?',cue:'Less means a smaller amount.',script:'Introduce less and invite children to explain what could be done.'},{title:'Make It Equal',prompt:'What if I want the same amount as my friend?',cue:'Equal means the same amount.',script:'Model: a friend has 1 and I want 1. Ask what to do so the amounts are equal.'}]},{title:'Exploring Music and Sound',sub:'Science & Engineering',kicker:'NEW LESSON',img:'assets/science.webp',materials:'Drum City · Boomwhackers or other safe sound-making materials such as pots/pans/wooden spoons/containers',vocab:'pitch · percussion · sound · vibration · volume',steps:[{title:'Percussion in Drum City',prompt:'How did people create music?',cue:'They hit different objects together.',script:'Show Drum City pages with children drumming. Explain that instruments played by hitting with a hand or stick are called percussion; examples include drums, xylophones, and even pianos.'},{title:'Meet the Boomwhackers',prompt:'These are percussion instruments.',cue:'Explore different safe ways to play them.',script:'Show Boomwhackers. Model hitting one on the floor, hitting two together, and hitting one with a hand.'},{title:'Notice Sound & Vibration',prompt:'What do you hear and feel?',cue:'Vibration means small rapid back-and-forth movements.',script:'Ask children to observe different sounds and vibrations the Boomwhackers make.'},{title:'Change the Pitch',prompt:'Can you make or compare high and low sounds?',cue:'Pitch ranges from low to high.',script:'Introduce pitch and invite children to explore/compare higher and lower sounds.'},{title:'Change the Volume',prompt:'Can you make the sound quiet or loud?',cue:'Volume is the amount of sound.',script:'Introduce volume and invite children to experiment with quieter and louder sounds.'},{title:'Make a Band',prompt:'Can you put your sounds together with a friend?',cue:'What sounds are you thinking about making?',script:'Invite children to combine sounds with friends to make a band and collect their ideas.'}],teacherNote:'Focus suggests quieter options for children who prefer them: place a Boomwhacker on a table and tap with a craft stick, offer noise-blocking headphones, use only two tubes for easier comparison, or begin with loud/quiet before high/low.'}],Thursday:[{title:'Storytelling with Props 2',sub:'Library & Listening',kicker:'CONTINUED LESSON',img:'assets/reading.webp',materials:'new Unit books such as Drum City · character puppets · large fabric swatches · additional story props such as baby doll or pretend pizza',vocab:'character · retell',steps:[{title:'Remember Storytelling With Props',prompt:'What did you find and do here last week?',cue:'Share experiences from Library & Listening.',script:'Invite a few children to share their experiences with storytelling with props.'},{title:'Retell a Story',prompt:'Use books and puppets to tell a story again.',cue:'Retell means tell the story again.',script:'Explain that children can use books and puppets to retell stories. When retelling, they tell what the characters did or said.'},{title:'Meet New Props',prompt:'Fabric and other props can help you become a character.',cue:'Choose props that fit the story.',script:'Show the new fabric swatch and other props added based on the stories children are retelling.'},{title:'Retell With a Friend',prompt:'Would you like to retell a story with me?',cue:'Working together means listening and making decisions.',script:'Explain that children may retell with a friend. Model asking a friend to work together, choosing a book together, sitting side by side, and reviewing the story.'},{title:'Choose Story Roles',prompt:'Who will narrate? Who will play each character?',cue:'Make the decisions together.',script:'Model deciding who will be the narrator and who will play which characters.'}]},{title:'Revisit Joyful Drawing or Painting',sub:'Art Studio',kicker:'REVISIT',img:'assets/art.webp',prompt:'Return to the Joyful Wall.',cue:'Create another picture of something that brings you joy.',materials:'Original Joyful Drawing or Painting 2 materials and guidance are available through Review Original Introduction.',vocab:'different · joyful · proud · strong',revisit:{day:'Monday',item:0}}],Friday:[{title:'Revisit Pizza Shop',sub:'Dramatic Play',kicker:'REVISIT',img:'assets/dramatic-play.webp',prompt:'Return to the Pizza Shop.',cue:'Order, make, and serve pizza—or continue Supermarket play if that is still the better fit for the group.',materials:'Original Pizza Shop materials and guidance are available through Review Original Introduction.',vocab:'knead · order · size · stretch · toppings',revisit:{day:'Tuesday',item:0}},{title:'Revisit Storytelling with Props',sub:'Library & Listening',kicker:'REVISIT',img:'assets/reading.webp',prompt:'Return to retelling stories with props.',cue:'Choose a story, props, and roles—alone or with a friend.',materials:'Original Storytelling with Props 2 materials and guidance are available through Review Original Introduction.',vocab:'character · retell',revisit:{day:'Thursday',item:0}}]]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday,runner=params.get('eeaRunner')==='1';let i=Math.max(0,Math.min(items.length-1,Number(params.g day+'&item='+d.revisit.item+'&review=1'};$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);q.set('item',String(i));q.set('step',String(step));const backUrl='week6-intro-centers.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(backUrl)};$('restoreVisual').onclick=async()=>{try{await EEAVisualStore.remove(slot())}catch(e){}applyVisual(items[i])};render()})();</script></body></html>
