<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 5 Community Meeting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea)}.page{height:100vh;padding:3vh 5vw}.top{display:flex;justify-content:space-between;align-items:center;height:10vh}.brand{font-weight:900;letter-spacing:.12em;color:#789697}.week{background:#dcecf0;padding:9px 18px;border-radius:999px;font-weight:900}.card{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw;box-shadow:0 15px 36px rgba(54,79,77,.07)}.visual{height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-size:28px;font-weight:900}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:clamp(45px,4.4vw,82px);line-height:1;margin:1vh 0;color:#164f7f}.lead{font-size:clamp(21px,1.6vw,31px);font-weight:900;line-height:1.35;color:#527673}.steps{margin-top:2vh;display:grid;gap:1vh}.step{background:#e7f0ed;border-radius:17px;padding:1.2vh 1.2vw;font-size:clamp(17px,1.15vw,22px);font-weight:900;color:#416d61}.bottom{height:10vh;display:flex;justify-content:center;align-items:center}.done{border:0;border-radius:999px;background:#668f99;color:#fff;padding:12px 28px;font-weight:900;font-size:17px;cursor:pointer}</style></head><body><main class="page"><div class="top"><div class="brand">EARLY EAGLE ACADEMY · COMMUNITY MEETING</div><div class="week" id="week"></div></div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button class="done" onclick="location.href='week5-plan.html'">Done ✓</button></div></main><script>const d={Monday:{eye:'MINDFUL PRACTICE · CURRICULUM',title:'Mountain Pose',lead:'Stand tall, reach high, and take a couple of slow breaths.',visual:'Visual placeholder: children standing tall in Mountain Pose.',steps:['Stand tall and straight with feet parallel and facing forward.','Press palms together at the chest, then reach up high.','Take a couple of breaths, then slowly lower your arms.']},Tuesday:{eye:'CONVERSATION · CURRICULUM',title:'Sounds Around Us',lead:'Everybody in the Red Brick Building is full of sounds. What sounds are part of our community?',visual:'Visual placeholder: neighborhood and classroom sound symbols.',steps:['Remember sounds from the story: a baby crying, a parrot screeching, stomping feet, and a siren.','Ask: “What sounds do you hear around your neighborhood or at school?”','Follow with: “How do you feel about loud sounds? What kind of sounds do you like?”']},Wednesday:{eye:'GAME · CURRICULUM',title:'I Hear',lead:'Listen, respond, and act out sounds together.',visual:'Visual placeholder: children listening with hands cupped near their ears.',steps:['Teacher says: “I hear…” Children respond together: “What do you hear?”','Name an imagined sound, such as a baby crying. Children act out the sound.','Repeat with adult or child ideas. Make space for different ways of noticing and communicating.']},Thursday:{eye:'EEA EXTENSION',title:'Quiet Sound Detective',lead:'How many tiny sounds can we notice when the room becomes very still?',visual:'Visual placeholder: children quietly listening around the classroom.',steps:['Sit comfortably and become very quiet for about 20 seconds.','Listen for one small sound you might usually miss.','Each child may name, imitate, point to, or otherwise communicate one sound they noticed.']},Friday:{eye:'EEA EXTENSION',title:'Community Sound Story',lead:'Let’s turn the sounds from our week into one quick class story.',visual:'Visual placeholder: red brick building surrounded by playful sound marks.',steps:['Begin: “One evening in our neighborhood, everything was quiet until…”','Invite several children to add one sound or action to the story.','End by bringing the neighborhood back to calm and quiet together.']}};let day=new URLSearchParams(location.search).get('day')||'Monday';if(!d[day])day='Monday';let x=d[day];week.textContent='WEEK 5 · '+day.toUpperCase();eye.textContent=x.eye;title.textContent=x.title;lead.textContent=x.lead;visual.textContent=x.visual;steps.innerHTML=x.steps.map(s=>'<div class="step">'+s+'</div>').join('');</script></body></html>
