let APPLE=null,FALL=null;
async function loadConfigs(){if(themeId==='apple-orchard')APPLE=await fetch(BASE+'apple-layout.json').then(r=>r.json());if(themeId==='fall-leaves')FALL=await fetch(BASE+'fall-layout.json').then(r=>r.json())}
function appleBasketSlots(b){
 const cols=b==='30'?6:5;
 const rows=Math.ceil(Number(b)/cols);
 const xs=cols===6?[12,27,42,58,73,88]:[18,34,50,66,82];
 const ys=rows===2?[77,43]:rows===3?[82,58,34]:rows===4?[84,64,44,24]:[85,68,51,34,17];
 const rot=[-4,3,1,-2,4,-1];
 const out=[];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   if(out.length>=Number(b))break;
   out.push({x:xs[c],y:ys[r],r:rot[(r*cols+c)%rot.length]});
 }
 return out;
}
function renderApple(){
 const b=String(bucket(students.length)),wait=APPLE.waiting.layouts[b],ws=APPLE.waiting.scales[b],hs=APPLE.here.scales[b],here=appleBasketSlots(b);
 bg.src=BASE+'apple-background.png';waitingLayer.className='waiting-zone';hereLayer.className='here-zone';
 const waitSize=b==='10'?[104,123]:b==='15'?[88,104]:b==='20'?[76,90]:b==='25'?[66,78]:[58,68];
 const hereSize=b==='10'?[96,96]:b==='15'?[82,82]:b==='20'?[72,72]:b==='25'?[64,64]:[58,58];
 students.forEach((s,i)=>{
   const isHere=present.includes(s.id);
   const pos=isHere?here[present.indexOf(s.id)]:wait[i];
   (isHere?hereLayer:waitingLayer).appendChild(makePiece(s,isHere?'here':'waiting',pos,isHere?hereSize:waitSize,isHere?hs:ws))
 })
}
function renderFall(){
 const b=String(bucket(students.length)),wait=FALL.fallTreeLayouts[b],here=FALL.fallPileLayouts[b],ws=FALL.fallTreeScales[b],hs=FALL.fallPileScales[b],wsize=FALL.fallTreeSizes[b],hsize=FALL.fallPileSizes[b];
 bg.src=BASE+'fall-background.png';waitingLayer.className='layer';hereLayer.className='layer';
 students.forEach((s,i)=>{const is=present.includes(s.id),sz=is?hsize:wsize;(is?hereLayer:waitingLayer).appendChild(makePiece(s,is?'here':'waiting',(is?here:wait)[i],[sz[0],sz[1]],is?hs:ws))})
}

function render(){waitingLayer.innerHTML='';hereLayer.innerHTML='';extra.innerHTML='';if(themeId==='apple-orchard')renderApple();else if(themeId==='fall-leaves')renderFall();else if(themeId==='pumpkin-patch')renderPumpkin();else renderHalloween();hereCount.textContent=present.length;waitCount.textContent=Math.max(0,students.length-present.length);photoToggle.textContent=showPhotos?'Photos On':'Photos Off';save()}
function toggle(id){const i=present.indexOf(id);if(i>=0)present.splice(i,1);else present.push(id);render()}
