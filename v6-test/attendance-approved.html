let APPLE=null,FALL=null;
async function loadConfigs(){if(themeId==='apple-orchard')APPLE=await fetch(BASE+'apple-layout.json').then(r=>r.json());if(themeId==='fall-leaves')FALL=await fetch(BASE+'fall-layout.json').then(r=>r.json())}
function renderApple(){const b=String(bucket(students.length)),wait=APPLE.waiting.layouts[b],here=APPLE.here.layouts[b],ws=APPLE.waiting.scales[b],hs=APPLE.here.scales[b];bg.src=BASE+'apple-background.png';waitingLayer.className='waiting-zone';hereLayer.className='here-zone';const waitSize=b==='10'?[104,123]:b==='15'?[88,104]:b==='20'?[76,90]:b==='25'?[66,78]:[58,68];const hereSize=b==='10'?[96,96]:b==='15'?[82,82]:b==='20'?[72,72]:b==='25'?[64,64]:[58,58];students.forEach((s,i)=>{const is=present.includes(s.id);(is?hereLayer:waitingLayer).appendChild(makePiece(s,is?'here':'waiting',(is?here:wait)[i],is?hereSize:waitSize,is?hs:ws))})}
function renderFall(){const b=String(bucket(students.length)),wait=FALL.fallTreeLayouts[b],here=FALL.fallPileLayouts[b],ws=FALL.fallTreeScales[b],hs=FALL.fallPileScales[b],wsize=FALL.fallTreeSizes[b],hsize=FALL.fallPileSizes[b];bg.src=BASE+'fall-background.png';waitingLayer.className='layer';hereLayer.className='layer';students.forEach((s,i)=>{const is=present.includes(s.id),sz=is?hsize:wsize;(is?hereLayer:waitingLayer).appendChild(makePiece(s,is?'here':'waiting',(is?here:wait)[i],[sz[0],sz[1]],is?hs:ws))})}
function renderPumpkin(){const b=String(bucket(students.length)),wait=PUMP_WAIT[b],here=PUMP_HERE[b],ws=PUMP_WAIT_SCALE[b],hs=PUMP_HERE_SCALE[b];bg.src=BASE+'pumpkin-background.png';waitingLayer.className='waiting-zone';hereLayer.className='here-zone';extra.innerHTML=`<img class="crate" src="${BASE}pumpkin-crate.png" alt=""><img class="crate-front" src="${BASE}pumpkin-crate-front.png" alt="">`;const wsize=b==='10'?[130,135]:b==='15'?[112,116]:b==='20'?[96,100]:b==='25'?[84,88]:[74,78];const hsize=b==='10'?[112,112]:b==='15'?[98,98]:b==='20'?[86,86]:b==='25'?[76,76]:[68,68];students.forEach((s,i)=>{const is=present.includes(s.id);(is?hereLayer:waitingLayer).appendChild(makePiece(s,is?'here':'waiting',(is?here:wait)[i],is?hsize:wsize,is?hs:ws))})}
function renderHalloween(){const b=String(bucket(students.length)),wait=HALL_WAIT[b],here=HALL_HERE[b],ws=HALL_WAIT_SCALE[b],hs=HALL_HERE_SCALE[b];bg.src=BASE+'halloween-background.png';waitingLayer.className='layer';hereLayer.className='layer';extra.innerHTML=`<img class="bucket-front" src="${BASE}halloween-bucket-front.png" alt="">`;students.forEach((s,i)=>{const is=present.includes(s.id),piece=makePiece(s,is?'here':'waiting',(is?here:wait)[i],[0,0],is?hs:ws);piece.style.height='auto';piece.style.removeProperty('width');(is?hereLayer:waitingLayer).appendChild(piece)})}
function render(){waitingLayer.innerHTML='';hereLayer.innerHTML='';extra.innerHTML='';hereCount.textContent=present.length;waitCount.textContent=Math.max(0,students.length-present.length);if(themeId==='apple-orchard')renderApple();else if(themeId==='fall-leaves')renderFall();else if(themeId==='pumpkin-patch')renderPumpkin();else renderHalloween();photoToggle.textContent=showPhotos?'Photos On':'Photos Off';save()}
function toggle(id){const i=present.indexOf(id);if(i>=0)present.splice(i,1);else present.push(id);render()}
photoToggle.onclick=()=>{showPhotos=!showPhotos;const s=loadSettings();s.showPhotos=showPhotos;localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));render()};resetBtn.onclick=()=>{present=[];render()};closeBtn.onclick=()=>{localStorage.setItem(MORNING_KEY,todayKey());save();if(window.EEAStar)window.EEAStar.resolveToday();location.href='index.html'};
