<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Building Blocks</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1150px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:28px}.tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697}.card h1,.card h2{color:#165487}.card p,.card li{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}.box{background:#e7f0ed;border-radius:18px;padding:15px;margin:12px 0}.bottom{display:flex;justify-content:center;gap:14px;margin-top:18px}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff;border-color:#668f99}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Building Blocks</h1><h2 id="title"></h2><div id="content"></div><div class="bottom"><button id="prev">← Storytelling</button><button class="done" id="done">Finish Today ✓</button></div></section></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',from=p.get('from')||'';const d={Monday:{title:'Bakers Truck + Compare Number Pizzas',html:`<p>Recite <b>Bakers Truck</b> with children and add the curriculum gestures.</p><div class="box"><b>Bakers Truck</b><br>The baker’s truck drives down the street,<br>filled with everything good to eat.<br>Two doors the baker opens wide <i>[outstretched arms]</i>.<br>Let’s look at the shelves inside <i>[cup hands around eyes to look]</i>.<br>What do you see? What do you see?<br>Five big pizzas for you and me <i>[show five fingers]</i>!</div><p><b>Compare Number Pizzas:</b> Gather ten counters and two paper plates or papers to represent pizzas. Start with zero toppings, then put three toppings on each pizza and count them together.</p><div class="box">Ask: <b>Now how many toppings do we have on each pizza?</b> Then explain that each pizza needs five toppings and ask: <b>How can we make them five?</b></div>`},Tuesday:{title:'Count and Move in Patterns + Demonstrate Counting',html:`<p><b>Count and Move in Patterns:</b> Count from 1–10 in repeating groups of two. Alternate loud/quiet or use movements such as step/stomp, pausing after each pair.</p><div class="box"><b>Demonstrate Counting:</b> Display four counters and count them together: 1, 2, 3, 4. Remove them and hold up one counter. Explain that <b>one</b> tells how many are there all together. Display the four counters again, recount, and ask: <b>How many counters are there all together?</b></div>`},Wednesday:{title:'Count and Move + Demonstrate Counting + Compare Number Pizzas',html:`<p>Repeat <b>Count and Move in Patterns</b>, counting 1–10 in repeating groups of two using volume or movement.</p><div class="box"><b>Demonstrate Counting:</b> Display four counters, count them, briefly focus on one counter as a quantity, then show all four again and ask how many there are all together.</div><p><b>Compare Number Pizzas:</b> Return to two pizza plates. Put three toppings on each and count.</p><div class="box">Ask: <b>How can we make them five?</b></div>`},Thursday:{title:'Count and Move in Patterns + Number Me (5)',html:`<p>Count 1–10 in a repeating pattern of two using loud/quiet voices or alternating movements.</p><div class="box"><b>Number Me (5):</b> “Today we are going to play a game using the number 5! Can you show me something on your body that has 5 of something?” Guide children to their fingers and ask: <b>How do you know you have 5 fingers?</b></div><p>Extend by deliberately making mistakes such as saying you see six fingers or two fingers. Encourage children to count and explain how they know.</p>`},Friday:{title:'Count and Move + Counting Book',html:`<p>Begin with <b>Count and Move in Patterns</b>, counting 1–10 in repeating groups of two.</p><p>Then choose a counting book, such as <i>The Very Hungry Caterpillar</i>, and read it fluently in its entirety.</p><div class="box">Return to a few pages and ask: <b>How many _____ are on this page? Let’s count and check.</b> Pretend to be caterpillars eating five berries, counting each pretend bite from one through five. Continue with quantities children suggest.</div>`}}[day];const $=id=>document.getElementById(id);$('tag').textContent='WEEK 6 · '+day.toUpperCase();$('title').textContent=d.title;$('content').innerHTML=d.html;$('prev').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEARetreat==='function'){parent.EEARetreat();return}location.href='week6-storytelling.html?day='+encodeURIComponent(day)};$('done').onclick=()=>{if(from==='runner'&&parent!==window&&typeof parent.EEAAdvance==='function'){parent.EEAAdvance();return}location.href='daily-lessons.html?week=6&day='+days.indexOf(day)}})();</script></body></html>
