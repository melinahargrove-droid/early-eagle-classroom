<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Community Meeting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1050px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}h1,h2,h3{color:#165487}.box{background:#e7f0ed;border-radius:18px;padding:18px;margin:16px 0}.card p,.card li{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Community Meeting</h1><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'Butterfly Pose',html:`<div class="box"><b>Curriculum-provided option</b></div><p>Sit tall, bend the legs, put the soles of the feet together, and gently flap the legs like butterfly wings. Slowly straighten the legs and relax. Children may also flap elbows with palms together or gently move open arms up and down.</p>`},Tuesday:{title:'Conversation • Stories About Our Names and Families',html:`<div class="box"><b>Curriculum-provided option</b></div><p>Connect to <i>Alma and How She Got Her Name</i>. Alma’s father tells her stories about her names.</p><div class="box"><b>Ask:</b> What kind of stories do you like to hear about?</div>`},Wednesday:{title:'Hot Hot Hands',html:`<div class="box"><b>Curriculum-provided option</b></div><p>Rub hands together, stop, and place the warmed hands on the ears. Repeat, inviting children to suggest other body parts where they can gently place their warm hands.</p>`},Thursday:{title:'Kindness in Our Families',html:`<div class="box"><b>EEA-created Week 7 extension</b></div><p>Invite children to think of one small way someone in their family cares for them. Then ask them to show with their hands one way they can care for someone else.</p><div class="box"><b>Quick share:</b> “I can show kindness by _____.”</div>`},Friday:{title:'Family Connection Circle',html:`<div class="box"><b>EEA-created Week 7 extension</b></div><p>Invite each child to think of one person who is important to them. Children may quietly picture that person, then turn to a partner and share something they enjoy doing together.</p><div class="box"><b>Close:</b> Families and important people can be different, and they are all part of the stories that make us who we are.</div>`}}[day];tag.textContent='WEEK 7 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
