<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 7 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%);overflow:hidden}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px);line-height:1}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:rgba(214,232,237,.8);color:#386d80;font-weight:900;font-size:clamp(12px,.82vw,16px)}.close{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#174f7d;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(92,136,147,.2);border-radius:34px;background:rgba(255,254,249,.94);box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:rgba(217,234,238,.8);color:#4f7c89;font-weight:900;letter-spacing:.06em;font-size:clamp(11px,.72vw,14px)}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.cue{width:min(36vw,600px);height:min(59vh,560px);border-radius:30px;background:radial-gradient(circle at 50% 38%,#fffdf8 0,#eaf3ee 62%,#dbe9e5 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw;box-shadow:inset 0 0 0 1px rgba(96,140,145,.13)}.icon{font-size:clamp(105px,10vw,180px);line-height:1;margin-bottom:2vh}.caption{color:#557876;font-size:clamp(18px,1.25vw,24px);font-weight:900;max-width:25vw;line-height:1.25}.copy{text-align:left}.eyebrow{color:#799597;font-size:clamp(12px,.8vw,15px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px);line-height:1}.copy p{margin:1.4vh 0;color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38;max-width:39vw}.quote{margin-top:1.8vh;padding:1.5vh 1.6vw;max-width:39vw;border-radius:20px;background:#e8f1ed;color:#426f65;font-size:clamp(23px,1.75vw,34px);font-weight:900;line-height:1.25}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.6vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 12px 30px rgba(44,67,68,.15);display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}.source{position:absolute;right:3%;bottom:2.15%;color:#aebbb8;font-size:clamp(8px,.52vw,10px);font-weight:700;opacity:.78}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><div class="panel" id="panel"></div><div class="source" id="source"></div></main><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],day=days.includes(p.get('day'))?p.get('day'):'Monday',runner=p.get('eeaRunner')==='1',$=id=>document.getElementById(id);const opts={butterfly:{type:'BUTTERFLY POSE',note:'Sit tall, bend legs, soles together, gently flap legs, then straighten and relax. Alternatives: palms together with elbows flapping or gentle open-arm movements.',cards:[['Sit Tall','<img src="assets/focus-3s/unit-1/week-7/community-meeting/butterfly-pose.png" alt="Child demonstrating butterfly pose" style="display:block;width:min(31vw,520px);height:min(50vh,480px);object-fit:contain">','Soles of feet together.','Sit with a tall spine, bend your legs, and place the soles of your feet together.'],['Flap Your Wings','🌈','Gentle butterfly wings.','Gently flap your legs like colorful butterfly wings, or use the adapted arm/elbow movement.'],['Straighten & Relax','🌿','Legs forward.','Slowly straighten your legs in front and relax.']]},elephant:{type:'ELEPHANT BREATH',note:'Imagine showering like an elephant. Feet apart, hands linked as trunk. Breathe in through nose while raising arms overhead; breathe out through mouth while swinging arms down. Repeat 3 times. Can be seated.',cards:[['Make Your Trunk','🐘','Feet apart · hands linked.','Dangle linked hands between your legs like an elephant trunk.'],['Breathe In & Lift','🌬️','Raise trunk overhead.','Breathe in through your nose as you raise arms above your head and lean back gently.'],['Breathe Out & Swing','💨','Swing trunk down.','Breathe out through your mouth as arms swing down. Repeat three times, then breathe normally.']]},hot:{type:'HOT HOT HANDS',note:'Rub hands together to create warmth, place warmed hands on a body part, notice the heat, then invite children to choose other body parts to warm.',cards:[['Rub, Rub, Rub','👐','Rub hands together… and stop.','Rub hands together while chanting “Rub, rub, rub, rub… and stop.”'],['Warm Your Ears','👂','Place warm hands on ears.','Put warmed hands on ears and notice the heat.'],['What Else Should We Warm?','✨','Children choose.','Invite children to suggest knees, shoulders, or another body part. Repeat together.']]},shake:{type:'BODY SHAKES',note:'Invite children to choose body parts and demonstrate a shake. Everyone follows while chanting the body-part shake, then stops gently. Repeat with other ideas.',cards:[['Wake Up Our Bodies','✨','Shake and wake our bodies!','Explain that sometimes energy feels stuck and we may want to shake it up.'],['Choose a Body Part','🙋','What do you want to shake?', 'Invite a child to name and demonstrate a body part movement.'],['Shake… and Stop','🛑','Follow the leader.','Everyone follows and chants, e.g. “Arm shakes, arm shakes…” then stops with a gentle stop gesture. Repeat with more ideas.']]},problem:{type:'PROBLEM STORIES',note:'Use Block People to act out a short scenario based on a real classroom challenge you observed. Follow the Community Meeting Intro model.',cards:[['Choose a Real Problem','💭','Something our class is working on.','Choose a short problem you have actually observed.'],['Act It Out','🧍','Use Block People.','Use the characters to show the problem.'],['Practice Solutions','🤝','What could they do?', 'Invite children to think through possible solutions.']]}};const dayChoices={Monday:'butterfly',Tuesday:'elephant',Wednesday:'hot',Thursday:'shake',Friday:'problem'};let choice=p.get('choice')||dayChoices[day],i=0;const keys=['butterfly','elephant','hot','shake','problem'];function render(){if(!choice){$('cards').innerHTML='<article class="card active"><div class="visual"><div class="cue"><div class="icon">🌟</div><div class="caption">Choose today’s Focus on 3s Community Meeting.</div></div></div><div class="copy"><div class="eyebrow">WEEK 7 · TEACHER CHOICE</div><h2>Choose Community Meeting</h2><div class="steps">'+keys.map(k=>'<button class="step pick" data-k="'+k+'" style="border:0;text-align:left;cursor:pointer">'+opts[k].type+'</button>').join('')+'</div></div></article>';$('dots').innerHTML='';$('badge').textContent='CHOOSE FROM WEEK 7 PLANS';$('weekLabel').textContent='FOCUS ON 3s · WEEK 7 · '+day.toUpperCase();$('prev').disabled=true;$('next').style.display='none';$('panel').innerHTML='<strong>Focus on 3s:</strong> Week 7 says choose from Community Meeting plans.';document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{choice=b.dataset.k;i=0;$('next').style.display='';render()});return}const d=opts[choice];$('cards').innerHTML=d.cards.map((x,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="cue"><div class="icon">${x[1]}</div><div class="caption">${x[2]}</div></div></div><div class="copy"><div class="eyebrow">${d.type}</div><h2>${x[0]}</h2><p>${x[3]}</p></div></article>`).join('');$('dots').innerHTML=d.cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');$('badge').textContent=d.type+' · '+(i+1)+' OF '+d.cards.length;$('weekLabel').textContent='FOCUS ON 3s · WEEK 7 · '+day.toUpperCase();$('prev').disabled=false;$('next').style.display='';$('next').textContent=i===d.cards.length-1?'Done ✓':'Next →';$('panel').innerHTML='<strong>Focus on 3s:</strong> '+d.note}$('prev').onclick=()=>{if(choice&&i>0){i--;render()}else{choice=null;i=0;render()}};$('next').onclick=()=>{if(!choice)return;const d=opts[choice];if(i<d.cards.length-1){i++;render()}else if(!runner)location.href='daily-lessons.html?week=7&day='+days.indexOf(day)};$('closeBtn').onclick=()=>location.href='daily-lessons.html?week=7&day='+days.indexOf(day);$('teacher').onclick=()=>$('panel').classList.toggle('open');render()})();</script><script src="community-visual-overrides.js"></script></body></html>
