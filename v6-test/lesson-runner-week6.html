<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 6 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f6f1e5}.app,.stage{width:100%;height:100%}.stage{background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:1!important;transition:opacity .08s}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Week 6 daily lesson"></iframe></section></main><script>(()=>{const params=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const day=Math.max(0,Math.min(4,Number(params.get('day'))||0));const flow=['community-meeting-week6.html','week6-read-aloud.html','week6-intro-centers.html','week6-writing.html','week6-foundational.html','week6-small-groups.html','week6-storytelling.html','week6-building-blocks.html'];const labels=['Community Meeting','Read Aloud','Centers','Writing','Foundational Literacy','Literacy Small Groups','Storytelling & Story Acting','Building Blocks'];let section=Math.max(0,Math.min(flow.length-1,Number(params.get('section'))||0));const frame=document.getElementById('frame');localStorage.setItem('eea-daily-week','6');localStorage.setItem('eea-daily-day',String(day));const pad=n=>String(n).padStart(2,'0'),todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},resumeKey='eea-lesson-resume';function saveResume(next){localStorage.setItem(resumeKey,JSON.stringify({date:todayKey(),week:6,day,section:next}))}function clearResume(){localStorage.removeItem(resumeKey);localStorage.removeItem('eea-lesson-auto-resume')}const overview=()=>location.href=`daily-lessons.html?week=6&day=${day}&v=${Date.now()}`;function advance(){if(section>=flow.length-1){clearResume();location.href='index.html';return}section++;saveResume(section);load()}function retreat(){if(section<=0){overview();return}section--;saveResume(section);load()}window.EEAAdvance=advance;window.EEARetreat=retreat;window.EEAWeek6Runner=true;function controls(doc){return{next:doc.getElementById('next'),prev:doc.getElementById('prev'),done:doc.getElementById('done')||doc.getElementById('doneBtn')||doc.querySelector('.bottom .done')||doc.querySelector('.bottom button:last-child'),exit:doc.getElementById('closeBtn')||doc.getElementById('backBtn')||doc.getElementById('exit')}}function state(){try{const fn=frame.contentWindow.EEASectionState;return typeof fn==='function'?fn():null}catch(e){return null}}function communityState(doc){const cards=[...doc.querySelectorAll('.card')],index=cards.findIndex(c=>c.classList.contains('active'));return{index:index<0?0:index,total:cards.length}}function boundary(btn,type,on){if(btn)btn.dataset.eeaBoundary=on?type:''}function sync(doc){const c=controls(doc);[c.next,c.prev,c.done].forEach(b=>{if(b)b.dataset.eeaBoundary=''});if(section===0){const s=communityState(doc);if(c.prev){c.prev.disabled=false;boundary(c.prev,'back',s.index===0);c.prev.textContent=s.index===0?'← Day Overview':'← Previous'}if(c.next){const end=s.total>0&&s.index===s.total-1;boundary(c.next,'forward',end);if(end)c.next.textContent='Next: Read Aloud →'}return}if(section===1){const s=state();if(c.prev){c.prev.disabled=false;c.prev.style.display='block';boundary(c.prev,'back',!!(s&&s.atStart));if(s&&s.atStart)c.prev.textContent='← Community Meeting'}if(s&&c.next){boundary(c.next,'forward',!!s.atEnd);if(s.atEnd)c.next.textContent='Finish Read Aloud → Centers'}return}if(c.prev){c.prev.disabled=false;boundary(c.prev,'back',true);c.prev.textContent='← '+labels[section-1]}if(c.done){boundary(c.done,section===flow.length-1?'finish':'forward',true);c.done.textContent=section===flow.length-1?'Finish Today ✓':'Next: '+labels[section+1]+' →'}}async function prepare(){let doc,win;try{win=frame.contentWindow;doc=win.document;if(!doc?.body)return}catch(e){return}sync(doc);const resync=()=>setTimeout(()=>sync(doc),0);win.addEventListener('eea-section-state',resync);doc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset.eeaBoundary;if(x){e.preventDefault();e.stopImmediatePropagation();if(x==='back')retreat();else if(x==='finish'){clearResume();location.href='index.html'}else advance();return}const c=controls(doc);if(c.exit&&b===c.exit){e.preventDefault();e.stopImmediatePropagation();overview();return}resync()},true);sync(doc);frame.style.opacity=1}function load(){frame.style.opacity=0;const sep=flow[section].includes('?')?'&':'?';frame.src=`${flow[section]}${sep}day=${encodeURIComponent(days[day])}&from=runner&week=6&section=${section}&v=${Date.now()}`}frame.addEventListener('load',()=>setTimeout(prepare,30));load()})();</script></body></html>
