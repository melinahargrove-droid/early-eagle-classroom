<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Closing Circle</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1000px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697}h1,h2{color:#165487}.card p{font-size:19px;line-height:1.5;font-weight:750;color:#55747b}.box{background:#e7f0ed;border-radius:18px;padding:18px;margin:16px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Closing Circle</h1><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'What Makes a Name Special?',html:`<div class="box"><b>EEA-created lesson connection</b></div><p>After reading <i>Alma and How She Got Her Name</i>, ask: <b>What is one thing that can make a person’s name special?</b></p><p>Children may share an idea or simply say their own name proudly.</p>`},Tuesday:{title:'Someone Important to Me',html:`<div class="box"><b>EEA-created lesson connection</b></div><p>Invite children to think about the family stories and pictures explored today. Ask: <b>Who is someone important to you, and what is one thing you like to do together?</b></p>`},Wednesday:{title:'Hair Can Be…',html:`<div class="box"><b>EEA-created lesson connection</b></div><p>After the first reading of <i>Hair Love</i>, invite children to finish the sentence: <b>“Hair can be _____.”</b></p><p>Accept descriptive words, hairstyle ideas, colors, textures, or imaginative answers.</p>`},Thursday:{title:'How Do We Show Care?',html:`<div class="box"><b>EEA-created lesson connection</b></div><p>Connect to Zuri and Daddy. Ask: <b>What is one way someone showed care today?</b></p><p>Children may name something they experienced, noticed, or did for someone else.</p>`},Friday:{title:'One Thing That Makes Me, Me',html:`<div class="box"><b>EEA-created lesson connection</b></div><p>Bring together the week’s learning about names, families, hair, and identity. Invite each child to complete: <b>“One thing that makes me special is _____.”</b></p><p>Children may pass if they prefer to listen.</p>`}}[day];tag.textContent='WEEK 7 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
