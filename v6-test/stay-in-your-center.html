<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Stay in Your Center</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#eaf2f3}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),url("assets/background.webp");background-size:cover;background-position:center}.close{position:absolute;z-index:20;top:2.1vh;right:2vw;width:clamp(48px,3.6vw,68px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(67,99,118,.38);background:rgba(255,253,247,.88);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900;cursor:pointer}.header{position:absolute;z-index:10;top:2.3vh;left:50%;transform:translateX(-50%);width:min(82vw,1500px);text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.65),0 3px 12px rgba(255,255,255,.55)}h1{margin:0;font-size:clamp(42px,4.35vw,82px);line-height:1;font-weight:900}.subtitle{margin-top:1vh;font-size:clamp(20px,1.65vw,31px);color:#5b6f5a;font-weight:800}.scene{position:absolute;z-index:5;left:50%;top:23vh;transform:translateX(-50%) translateY(55px);width:min(78vw,1320px);height:68vh}.nest-layer{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none}.nest-back{z-index:1}.nest-front{z-index:6}.egg-wrap{position:absolute;z-index:3;left:50%;bottom:8%;transform:translateX(-50%) translateY(-74px) scale(1.5);width:min(24vw,380px);height:min(45vh,520px);transform-origin:50% 94%}.egg-shell{position:relative;width:100%;height:100%;transform-origin:50% 94%}.egg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 10px rgba(73,68,52,.14));transition:opacity .12s}.crack-layer{position:absolute;inset:0;pointer-events:none;clip-path:ellipse(40% 47% at 50% 52%);transition:opacity .12s}.crack{position:absolute;overflow:visible;transform-origin:50% 50%}.crack path{fill:none;stroke:#8a5b34;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.hatch-pieces{position:absolute;inset:0;opacity:0;pointer-events:none}.shell-piece{position:absolute;opacity:0;filter:drop-shadow(0 4px 5px rgba(73,68,52,.12));transform-origin:center}.piece-cap{width:74%;left:13%;top:8%}.piece-left{width:58%;left:3%;top:34%}.piece-right{width:58%;right:3%;top:34%}.piece-lower-left{width:46%;left:9%;bottom:5%}.piece-lower-right{width:46%;right:9%;bottom:5%}.baby-eagle{position:absolute;z-index:4;left:50%;bottom:7%;transform:translate(-50%,90px) scale(.88);width:min(27vw,430px);opacity:0;pointer-events:none;filter:drop-shadow(0 8px 9px rgba(61,68,59,.12))}.teacher-panel{position:absolute;z-index:50;left:50%;bottom:2.3vh;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(7px,.7vw,13px);padding:clamp(7px,.65vw,12px);border:1.4px solid rgba(72,103,119,.32);border-radius:23px;background:rgba(255,252,244,.9);box-shadow:0 5px 16px rgba(47,62,73,.11);pointer-events:auto}.control{position:relative;z-index:2;pointer-events:auto;cursor:pointer;height:clamp(48px,5.7vh,66px);min-width:clamp(72px,6.2vw,112px);border-radius:17px;border:1.2px solid rgba(93,126,144,.38);background:rgba(255,253,248,.95);color:#173f72;font-weight:900}.control:active{transform:scale(.97)}.control:disabled{opacity:.45;cursor:default}.control.start{min-width:clamp(105px,8.5vw,155px);background:linear-gradient(180deg,rgba(211,229,211,.98),rgba(181,208,185,.96))}.duration{min-width:clamp(106px,8vw,145px);text-align:center;font-family:Arial,sans-serif;font-size:clamp(21px,1.55vw,30px);font-weight:900}.duration small{display:block;font-size:clamp(9px,.62vw,12px);color:#70838c;text-transform:uppercase}@keyframes wiggleA{0%,100%{transform:rotate(0)}20%{transform:rotate(-1.4deg)}42%{transform:rotate(1.2deg)}64%{transform:rotate(-.7deg)}82%{transform:rotate(.35deg)}}@keyframes wiggleB{0%,100%{transform:rotate(0)}24%{transform:rotate(1.7deg)}48%{transform:rotate(-1deg)}72%{transform:rotate(.55deg)}}@keyframes wiggleC{0%,100%{transform:rotate(0)}16%{transform:rotate(-1deg)}32%{transform:rotate(.9deg)}48%{transform:rotate(-.8deg)}64%{transform:rotate(.65deg)}80%{transform:rotate(-.3deg)}}@keyframes hatchWiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-2.3deg)}30%{transform:rotate(2.1deg)}46%{transform:rotate(-2.8deg)}62%{transform:rotate(2.5deg)}78%{transform:rotate(-1.3deg)}}@keyframes capOut{0%{opacity:1;transform:translate(0,0) rotate(0)}22%{opacity:1;transform:translate(8px,-26px) rotate(9deg)}55%{opacity:1;transform:translate(38px,24px) rotate(24deg)}100%{opacity:0;transform:translate(92px,150px) rotate(58deg)}}@keyframes leftOut{to{opacity:1;transform:translate(-34px,14px) rotate(-12deg)}}@keyframes rightOut{to{opacity:1;transform:translate(34px,14px) rotate(12deg)}}@keyframes lowerLeftOut{to{opacity:1;transform:translate(-18px,16px) rotate(-8deg)}}@keyframes lowerRightOut{to{opacity:1;transform:translate(18px,16px) rotate(8deg)}}@keyframes babyRise{0%{opacity:0;transform:translate(-50%,90px) scale(.88)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-6px) scale(1)}}.wiggle-a{animation:wiggleA .9s ease-in-out}.wiggle-b{animation:wiggleB .8s ease-in-out}.wiggle-c{animation:wiggleC 1.05s ease-in-out}.hatch-wiggle{animation:hatchWiggle 1.05s ease-in-out}.hatching .egg,.hatching .crack-layer{opacity:0}.hatching .hatch-pieces{opacity:1}.hatching .piece-cap{animation:capOut 1.15s cubic-bezier(.22,.65,.36,1) forwards}.hatching .piece-left{animation:leftOut .7s ease-out forwards}.hatching .piece-right{animation:rightOut .7s ease-out forwards}.hatching .piece-lower-left{animation:lowerLeftOut .7s ease-out forwards}.hatching .piece-lower-right{animation:lowerRightOut .7s ease-out forwards}.baby-eagle.hatched{animation:babyRise 1.25s cubic-bezier(.22,.75,.3,1) .15s forwards}@media(max-height:760px){.scene{top:20vh;height:71vh}}
</style>
</head>
<body>
<main class="stage">
<button class="close" type="button" aria-label="Close" onclick="window.location.href='index.html'">×</button>
<header class="header"><h1>Stay in Your Center</h1><div class="subtitle" id="subtitle">Play and explore until the baby eagle hatches!</div></header>
<section class="scene" aria-label="Baby eagle hatching timer">
<img class="nest-layer nest-back" src="assets/nest-back.png?v=20260815b" alt="">
<img class="baby-eagle" id="babyEagle" src="assets/baby-eagle.webp" alt="Baby eagle">
<div class="egg-wrap"><div class="egg-shell" id="eggShell"><img class="egg" src="assets/egg.webp" alt="Speckled eagle egg"><div class="crack-layer" id="crackLayer" aria-hidden="true"></div><div class="hatch-pieces" aria-hidden="true"><img class="shell-piece piece-cap" src="assets/shell-cap.png" alt=""><img class="shell-piece piece-left" src="assets/shell-left.png" alt=""><img class="shell-piece piece-right" src="assets/shell-right.png" alt=""><img class="shell-piece piece-lower-left" src="assets/shell-lower-left.png" alt=""><img class="shell-piece piece-lower-right" src="assets/shell-lower-right.png" alt=""></div></div></div>
<img class="nest-layer nest-front" src="assets/nest-front.png?v=20260815b" alt="Watercolor bird nest">
</section>
<section class="teacher-panel" id="teacherPanel" aria-label="Teacher timer controls"><button class="control" id="minus" type="button">− 1 min</button><div class="duration" id="duration">5 min<small>teacher setting</small></div><button class="control" id="plus" type="button">+ 1 min</button><button class="control start" id="start" type="button">▶ Start</button></section>
</main>
<script>
(()=>{
const duration=document.getElementById('duration'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),start=document.getElementById('start'),shell=document.getElementById('eggShell'),crackLayer=document.getElementById('crackLayer'),baby=document.getElementById('babyEagle'),subtitle=document.getElementById('subtitle');
const wiggleClasses=['wiggle-a','wiggle-b','wiggle-c'];
const safeSpots=[{x:46,y:23},{x:55,y:27},{x:38,y:36},{x:61,y:38},{x:32,y:49},{x:50,y:48},{x:67,y:50},{x:38,y:61},{x:58,y:62},{x:44,y:73},{x:57,y:73}];
const crackDesigns=[{w:58,h:28,d:'M3 16 L15 11 L24 14 L34 8 L46 12 L55 7 M24 14 L20 24 M34 8 L37 2'},{w:64,h:24,d:'M2 13 L15 9 L27 13 L39 7 L50 11 L62 6 M15 9 L11 3 M39 7 L42 18 M50 11 L55 20'},{w:38,h:48,d:'M18 3 L14 13 L20 20 L12 30 L18 38 L14 46 M20 20 L30 17 M12 30 L4 35'},{w:54,h:40,d:'M3 30 L14 24 L22 27 L31 18 L42 20 L51 10 M22 27 L19 37 M31 18 L27 8 M42 20 L48 30'}];
const eventFractions=[.12,.25,.38,.51,.64,.77,.87];
let minutes=5,totalMs=0,remainingMs=0,active=false,paused=false,hatched=false,lastTick=0,eventIndex=0,lastWiggle=-1,usedSpots=[],ticker=null,audioCtx=null,cleanupTimer=null;
async function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx.state==='running'}catch(e){return false}}
async function tone(freq,dur=.18,volume=.24,type='sine',delay=0){const ok=await ensureAudio();if(!ok||!audioCtx)return;const now=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+dur);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+dur+.03)}
function playWiggleSound(){tone(740,.12,.19,'sine',0);tone(880,.10,.13,'sine',.09)}
function playCrackSound(){tone(210,.07,.18,'triangle',0);tone(155,.08,.13,'triangle',.055)}
function playHatchSound(){tone(660,.38,.25,'sine',0);tone(830,.42,.24,'sine',.18);tone(1040,.55,.22,'sine',.38)}
function displayTime(ms){const sec=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
function renderControls(){if(active)duration.innerHTML=`${displayTime(remainingMs)}<small>${paused?'paused':'time left'}</small>`;else duration.innerHTML=`${minutes} min<small>teacher setting</small>`;minus.disabled=active;plus.disabled=active;start.disabled=hatched;start.textContent=hatched?'✓ Hatched':!active?'▶ Start':paused?'▶ Resume':'⏸ Pause'}
function resetVisualState(){hatched=false;shell.classList.remove(...wiggleClasses,'hatch-wiggle','hatching');baby.classList.remove('hatched');crackLayer.innerHTML='';usedSpots=[];eventIndex=0;subtitle.textContent='Play and explore until the baby eagle hatches!';if(cleanupTimer){clearTimeout(cleanupTimer);cleanupTimer=null}}
function wiggle(){if(hatched)return;let next;do{next=Math.floor(Math.random()*wiggleClasses.length)}while(next===lastWiggle&&wiggleClasses.length>1);lastWiggle=next;shell.classList.remove(...wiggleClasses,'hatch-wiggle');void shell.offsetWidth;shell.classList.add(wiggleClasses[next]);playWiggleSound()}
function addCrack(){if(hatched||usedSpots.length>=7)return;const choices=safeSpots.map((_,i)=>i).filter(i=>!usedSpots.includes(i));if(!choices.length)return;const spotIndex=choices[Math.floor(Math.random()*choices.length)];usedSpots.push(spotIndex);const spot=safeSpots[spotIndex],design=crackDesigns[Math.floor(Math.random()*crackDesigns.length)],svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${design.w} ${design.h}`);svg.setAttribute('width',design.w);svg.setAttribute('height',design.h);svg.classList.add('crack');svg.style.left=spot.x+'%';svg.style.top=spot.y+'%';svg.style.transform=`translate(-50%,-50%) rotate(${Math.round(-80+Math.random()*160)}deg) scale(${(.68+Math.random()*.5).toFixed(2)})`;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',design.d);svg.appendChild(path);crackLayer.appendChild(svg);playCrackSound()}
function goToCleanUp(){window.location.href='clean-up-song.html?autoplay=1'}
function hatch(){if(hatched)return;hatched=true;active=false;paused=false;if(ticker){clearInterval(ticker);ticker=null}shell.classList.remove(...wiggleClasses);void shell.offsetWidth;shell.classList.add('hatch-wiggle');playHatchSound();setTimeout(()=>{shell.classList.add('hatching');baby.classList.add('hatched');subtitle.textContent='The baby eagle hatched! Time to clean up!';renderControls();cleanupTimer=setTimeout(goToCleanUp,4200)},850)}
function processEvents(){const elapsed=totalMs-remainingMs,fraction=totalMs?elapsed/totalMs:1;while(eventIndex<eventFractions.length&&fraction>=eventFractions[eventIndex]){wiggle();if(eventIndex===1||eventIndex===3||eventIndex===4||eventIndex===5||eventIndex===6)setTimeout(addCrack,220);eventIndex++}}
function tick(){if(!active||paused)return;const now=performance.now(),delta=Math.max(0,now-lastTick);lastTick=now;remainingMs=Math.max(0,remainingMs-delta);processEvents();renderControls();if(remainingMs<=0)hatch()}
async function startTimer(){await ensureAudio();resetVisualState();totalMs=minutes*60000;remainingMs=totalMs;active=true;paused=false;lastTick=performance.now();wiggle();renderControls();if(ticker)clearInterval(ticker);ticker=setInterval(tick,250)}
function pauseTimer(){if(!active||paused)return;paused=true;renderControls()}
function resumeTimer(){if(!active||!paused)return;paused=false;lastTick=performance.now();renderControls()}
minus.addEventListener('click',()=>{if(!active){minutes=Math.max(1,minutes-1);renderControls()}});
plus.addEventListener('click',()=>{if(!active){minutes=Math.min(60,minutes+1);renderControls()}});
start.addEventListener('click',()=>{if(hatched)return;if(!active)startTimer();else if(paused)resumeTimer();else pauseTimer()});
shell.addEventListener('animationend',()=>shell.classList.remove(...wiggleClasses,'hatch-wiggle'));
renderControls();
})();
</script>
</body>
</html>
