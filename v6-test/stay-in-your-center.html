*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#eaf2f3}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),url("assets/background.webp");background-size:cover;background-position:center;background-repeat:no-repeat}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 35%,rgba(245,238,220,.05) 100%)}.close{position:absolute;z-index:20;top:2.1vh;right:2vw;width:clamp(48px,3.6vw,68px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(67,99,118,.38);background:rgba(255,253,247,.88);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(49,66,78,.10)}.header{position:absolute;z-index:10;top:2.3vh;left:50%;transform:translateX(-50%);width:min(82vw,1500px);text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.65),0 3px 12px rgba(255,255,255,.55)}h1{margin:0;font-size:clamp(42px,4.35vw,82px);line-height:1;color:#173f72;font-weight:900;letter-spacing:.006em}.subtitle{margin-top:1vh;font-size:clamp(20px,1.65vw,31px);line-height:1.15;color:#5b6f5a;font-weight:800}.scene{position:absolute;z-index:5;left:50%;top:23vh;transform:translateX(-50%) translateY(55px);width:min(78vw,1320px);height:68vh}.nest-layer{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none;user-select:none}.nest-back{z-index:1;filter:drop-shadow(0 9px 8px rgba(66,60,45,.12))}.egg-wrap{position:absolute;z-index:3;left:50%;bottom:8%;transform:translateX(-50%) translate(0,-74px) scale(1.5);width:min(24vw,380px);height:min(45vh,520px);display:flex;align-items:flex-end;justify-content:center;transform-orig <body><main class="stage"><button class="close" aria-label="Close" onclick="history.back()">×</button><header class="header"><h1>Stay in Your Center</h1><div class="subtitle">Play and explore until the baby eagle hatches!</div></header><div class="test-tools"><button id="wiggleTest" type="button">Test Wiggle 🥚</button><button id="crackTest" type="button">Test Crack</button><button id="clearCracks" type="button">Clear Cracks</button></div><section class="scene" id="scene" aria-label="Baby eagle hatching scene"><img class="nest-layer nest-back" src="assets/nest-back.png?v=20260815b" alt=""><img class="baby-eagle" src="assets/baby-eagle.webp" alt="" aria-hidden="true"><div class="egg-wrap"><div class="egg-shell" id="eggShell"><img class="egg" src="assets/egg.webp" alt="Speckled eagle egg"><div class="crack-layer" id="crackLayer" aria-hidden="true"></div></div></div><img class="nest-layer nest-front" src="assets/nest-front.png?v=20260815b" alt="Watercolor bird nest"></section><section class="teacher-panel" aria-label="Teacher timer controls"><button class="control" id="minus">− 1 min</button><div class="duration" id="duration">5 min<small>teacher setting</small></div><button class="control" id="plus">+ 1 min</button><button class="control start" id="start">▶ Start</button></section></main><script>(()=>{const duration=document.getElementById('duration'),minus=document.getElementById('minus'),plus=document.getElementById('plus');let minutes=5;function render(){duration.innerHTML=`${minutes} min<small>teacher setting</small>`;minus.disabled=minutes<=1}minus.addEventListener('click',()=>{minutes=Math.max(1,minutes-1);render()});plus.addEventListener('click',()=>{minutes=Math.min(60,minutes+1);render()});document.getElementById('start').addEventListener('click',()=>{});render();const shell=document.getElementById('eggShell'),wiggle=document.getElementById('wiggleTest'),classes=['wiggle-a','wiggle-b','wiggle-c','wiggle-d'];let last=-1;wiggle.addEventListener('click',()=>{let next;do{next=Math.floor(Math.random()*classes.length)}while(next===last&&classes.length>1);last=next;shell.classList.remove(...classes);void shell.offsetWidth;shell.classList.add(classes[next]);});shell.addEventListener('animationend',()=>shell.classList.remove(...classes));const crackLayer=document.getElementById('crackLayer'),crackBtn=document.getElementById('crackTest'),clearBtn=document.getElementById('clearCracks');const spots=[{x:33,y:27},{x:60,y:24},{x:45,y:39},{x:66,y:43},{x:31,y:50},{x:53,y:56},{x:40,y:66},{x:61,y:68}];const shapes=['M17 2 L13 12 L18 18 L11 28 L16 35 L10 48 M18 18 L26 22 M13 12 L7 17','M15 3 L20 11 L14 20 L19 29 L13 39 L16 48 M14 20 L6 24 M19 29 L28 34','M18 2 L12 10 L17 18 L10 27 L15 36 L8 46 M17 18 L25 14 M10 27 L3 31','M16 3 L11 13 L17 21 L12 31 L18 39 L14 48 M17 21 L27 24 M12 31 L5 37'];let used=[];crackBtn.addEventListener('click',()=>{if(used.length>=6)return;let choices=spots.map((_,i)=>i).filter(i=>!used.includes(i));let idx=choices[Math.floor(Math.random()*choices.length)];used.push(idx);let s=spots[idx],shape=shapes[Math.floor(Math.random()*shapes.length)],scale=(.75+Math.random()*.5).toFixed(2),rot=Math.round(-28+Math.random()*56);let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 34 50');svg.classList.add('crack');svg.style.left=`${s.x}%`;svg.style.top=`${s.y}%`;svg.style.transform=`translate(-50%,-50%) rotate(${rot}deg) scale(${scale})`;let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',shape);svg.appendChild(path);crackLayer.appendChild(svg);});clearBtn.addEventListener('click',()=>{crackLayer.innerHTML='';used=[];});})();</script></body></html>
