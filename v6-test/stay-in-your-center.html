<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Stay in Your Center</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#eaf2f3}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),url("assets/background.webp");background-size:cover;background-position:center}.close{position:absolute;z-index:20;top:2.1vh;right:2vw;width:clamp(48px,3.6vw,68px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(67,99,118,.38);background:rgba(255,253,247,.88);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900;cursor:pointer}.header{position:absolute;z-index:10;top:2.3vh;left:50%;transform:translateX(-50%);width:min(82vw,1500px);text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.65),0 3px 12px rgba(255,255,255,.55)}h1{margin:0;font-size:clamp(42px,4.35vw,82px);line-height:1;font-weight:900}.subtitle{margin-top:1vh;font-size:clamp(20px,1.65vw,31px);color:#5b6f5a;font-weight:800}.scene{position:absolute;z-index:5;left:50%;top:23vh;transform:translateX(-50%) translateY(55px);width:min(78vw,1320px);height:68vh}.nest-layer{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none}.nest-back{z-index:1}.nest-front{z-index:6}.egg-wrap{position:absolute;z-index:3;left:50%;bottom:8%;transform:translateX(-50%) translateY(-74px) scale(1.5);width:min(24vw,380px);height:min(45vh,520px);transform-origin:50% 94%}.egg-shell{position:relative;width:100%;height:100%;transform-origin:50% 94%}.egg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 10px rgba(73,68,52,.14));transition:opacity .12s}.crack-layer{position:absolute;inset:0;pointer-events:none;clip-path:ellipse(40% 47% at 50% 52%);transition:opacity .12s}.crack{position:absolute;overflow:visible;transform-origin:50% 50%}.crack path{fill:none;stroke:#8a5b34;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.hatch-pieces{position:absolute;inset:0;opacity:0;pointer-events:none}.shell-piece{position:absolute;opacity:0;filter:drop-shadow(0 4px 5px rgba(73,68,52,.12));transform-origin:center}.piece-cap{width:74%;left:13%;top:8%}.piece-left{width:58%;left:3%;top:34%}.piece-right{width:58%;right:3%;top:34%}.piece-lower-left{width:46%;left:9%;bottom:5%}.piece-lower-right{width:46%;right:9%;bottom:5%}.baby-eagle{position:absolute;z-index:4;left:50%;bottom:7%;transform:translate(-50%,90px) scale(.88);width:min(27vw,430px);opacity:0;pointer-events:none;filter:drop-shadow(0 8px 9px rgba(61,68,59,.12))}.teacher-panel{position:absolute;z-index:50;left:50%;bottom:2.3vh;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(7px,.7vw,13px);padding:clamp(7px,.65vw,12px);border:1.4px solid rgba(72,103,119,.32);border-radius:23px;background:rgba(255,252,244,.92);box-shadow:0 5px 16px rgba(47,62,73,.11);pointer-events:auto}.control{position:relative;z-index:2;pointer-events:auto;cursor:pointer;height:clamp(48px,5.7vh,66px);min-width:clamp(72px,6.2vw,112px);border-radius:17px;border:1.2px solid rgba(93,126,144,.38);background:rgba(255,253,248,.95);color:#173f72;font-weight:900}.control:active:not(:disabled){transform:scale(.97)}.control:disabled{opacity:.45;cursor:default}.control.start{min-width:clamp(105px,8.5vw,155px);background:linear-gradient(180deg,rgba(211,229,211,.98),rgba(181,208,185,.96))}.control.pause{background:linear-gradient(180deg,rgba(244,224,177,.98),rgba(234,203,139,.96))}.duration{min-width:clamp(88px,7.2vw,130px);text-align:center;font-family:Arial,sans-serif;font-size:clamp(21px,1.55vw,30px);font-weight:900}.duration small{display:block;font-size:clamp(9px,.62vw,12px);color:#70838c;text-transform:uppercase}@keyframes wiggleA{0%,100%{transform:rotate(0)}20%{transform:rotate(-1.4deg)}42%{transform:rotate(1.2deg)}64%{transform:rotate(-.7deg)}82%{transform:rotate(.35deg)}}@keyframes wiggleB{0%,100%{transform:rotate(0)}24%{transform:rotate(1.7deg)}48%{transform:rotate(-1deg)}72%{transform:rotate(.55deg)}}@keyframes wiggleC{0%,100%{transform:rotate(0)}16%{transform:rotate(-1deg)}32%{transform:rotate(.9deg)}48%{transform:rotate(-.8deg)}64%{transform:rotate(.65deg)}80%{transform:rotate(-.3deg)}}@keyframes hatchWiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-2.3deg)}30%{transform:rotate(2.1deg)}46%{transform:rotate(-2.8deg)}62%{transform:rotate(2.5deg)}78%{transform:rotate(-1.3deg)}}@keyframes capOut{0%{opacity:1;transform:translate(0,0) rotate(0)}22%{opacity:1;transform:translate(8px,-26px) rotate(9deg)}55%{opacity:1;transform:translate(38px,24px) rotate(24deg)}100%{opacity:0;transform:translate(92px,150px) rotate(58deg)}}@keyframes leftOut{to{opacity:1;transform:translate(-34px,14px) rotate(-12deg)}}@keyframes rightOut{to{opacity:1;transform:translate(34px,14px) rotate(12deg)}}@keyframes lowerLeftOut{to{opacity:1;transform:translate(-18px,16px) rotate(-8deg)}}@keyframes lowerRightOut{to{opacity:1;transform:translate(18px,16px) rotate(8deg)}}@keyframes babyRise{0%{opacity:0;transform:translate(-50%,90px) scale(.88)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-6px) scale(1)}}.wiggle-a{animation:wiggleA .9s ease-in-out}.wiggle-b{animation:wiggleB .8s ease-in-out}.wiggle-c{animation:wiggleC 1.05s ease-in-out}.hatch-wiggle{animation:hatchWiggle 1.05s ease-in-out}.hatching .egg,.hatching .crack-layer{opacity:0}.hatching .hatch-pieces{opacity:1}.hatching .piece-cap{animation:capOut 1.15s cubic-bezier(.22,.65,.36,1) forwards}.hatching .piece-left{animation:leftOut .7s ease-out forwards}.hatching .piece-right{animation:rightOut .7s ease-out forwards}.hatching .piece-lower-left{animation:lowerLeftOut .7s ease-out forwards}.hatching .piece-lower-right{animation:lowerRightOut .7s ease-out forwards}.baby-eagle.hatched{animation:babyRise 1.25s cubic-bezier(.22,.75,.3,1) .15s forwards}@media(max-height:760px){.scene{top:20vh;height:71vh}}
</style>
</head>
<body>
<main class="stage">
<button class="close" type="button" aria-label="Close" onclick="window.location.href='index.html'">×</button>
<header class="header"><h1>Stay in Your Center</h1><div class="subtitle" id="subtitle">Play and explore until the baby eagle hatches!</div></header>
<section class="scene" aria-label="Baby eagle hatching timer">
<img class="nest-layer nest-back" src="assets/nest-back.png?v=20260815b" alt="">
<img class="baby-eagle" id="babyEagle" src="assets/baby-eagle.webp" alt="Baby eagle">
<div class="egg-wrap"><div class="egg-shell" id="eggShell"><img class="egg" src="assets/egg.webp" alt="Speckled eagle egg"><div class="crack-layer" id="crackLayer" aria-hidden="true"></div><div class="hatch-pieces" aria-hidden="true"><img class="shell-piece piece-cap" src="assets/shell-cap.png" alt=""><img class="shell-piece piece-left" src="assets/shell-left.png" alt=""><img class="shell-piece piece-right" src="assets/shell-right.png" alt=""><img class="shell-piece piece-lower-left" src="assets/shell-lower-left.png" alt=""><img class="shell-piece piece-lower-right" src="assets/shell-lower-right.png" alt=""></div></div></div>
<img class="nest-layer nest-front" src="assets/nest-front.png?v=20260815b" alt="Watercolor bird nest">
</section>
<section class="teacher-panel" id="teacherPanel" aria-label="Teacher timer controls"><button class="control" id="minus" type="button">− 1 min</button><div class="duration" id="duration">5 min<small>teacher setting</small></div><button class="control" id="plus" type="button">+ 1 min</button><button class="control start" id="start" type="button">▶ Start</button><button class="control pause" id="pause" type="button" disabled>Ⅱ Pause</button><button class="control" id="reset" type="button">↻ Reset</button></section>
</main>
<script>
(()=>{
const STATE_KEY='eea-center-stay-state-v1';
const duration=document.getElementById('duration'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),start=document.getElementById('start'),pause=document.getElementById('pause'),reset=document.getElementById('reset'),shell=document.getElementById('eggShell'),crackLayer=document.getElementById('crackLayer'),baby=document.getElementById('babyEagle'),subtitle=document.getElementById('subtitle');
const wiggleClasses=['wiggle-a','wiggle-b','wiggle-c'];
const safeSpots=[{x:46,y:23},{x:55,y:27},{x:38,y:36},{x:61,y:38},{x:32,y:49},{x:50,y:48},{x:67,y:50},{x:38,y:61},{x:58,y:62},{x:44,y:73},{x:57,y:73}];
const crackDesigns=[{w:58,h:28,d:'M3 16 L15 11 L24 14 L34 8 L46 12 L55 7 M24 14 L20 24 M34 8 L37 2'},{w:64,h:24,d:'M2 13 L15 9 L27 13 L39 7 L50 11 L62 6 M15 9 L11 3 M39 7 L42 18 M50 11 L55 20'},{w:38,h:48,d:'M18 3 L14 13 L20 20 L12 30 L18 38 L14 46 M20 20 L30 17 M12 30 L4 35'},{w:54,h:40,d:'M3 30 L14 24 L22 27 L31 18 L42 20 L51 10 M22 27 L19 37 M31 18 L27 8 M42 20 L48 30'}];
const thresholds=[.12,.25,.38,.52,.66,.79,.9];
let minutes=5,selectedMs=300000,remainingMs=300000,running=false,hatched=false,endAt=0,ticker=null,lastWiggle=-1,audioCtx=null,triggered=new Set(),cleanupTimer=null;
function dateKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx.state==='running'}catch(e){return false}}
async function tone(freq,dur=.18,vol=.2,type='sine',delay=0){const ok=await ensureAudio();if(!ok||!audioCtx)return;const now=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.03)}
function playStartSound(){tone(523,.2,.17,'sine',0);tone(659,.24,.15,'sine',.12)}
function playWiggleSound(){tone(740,.12,.15,'sine',0);tone(880,.1,.1,'sine',.09)}
function playCrackSound(){tone(210,.07,.16,'triangle',0);tone(155,.08,.11,'triangle',.055)}
function playHatchSound(){tone(660,.38,.24,'sine',0);tone(830,.42,.22,'sine',.18);tone(1040,.55,.2,'sine',.38)}
function formatRemaining(){const sec=Math.max(0,Math.ceil(remainingMs/1000));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function renderControls(){duration.innerHTML=running||remainingMs<selectedMs?`${formatRemaining()}<small>${running?'time remaining':'paused'}</small>`:`${minutes} min<small>teacher setting</small>`;minus.disabled=running||remainingMs<selectedMs||minutes<=1;plus.disabled=running||remainingMs<selectedMs;start.disabled=running||hatched||remainingMs<=0;pause.disabled=!running;reset.disabled=false}
function saveState(){try{localStorage.setItem(STATE_KEY,JSON.stringify({version:1,date:dateKey(),minutes,selectedMs,remainingMs:Math.max(0,remainingMs),running:Boolean(running),endAt:running?Date.now()+Math.max(0,remainingMs):0,hatched:Boolean(hatched),triggered:[...triggered]}))}catch(e){}}
function clearTicker(){if(ticker){clearInterval(ticker);ticker=null}}
function clearCleanup(){if(cleanupTimer){clearTimeout(cleanupTimer);cleanupTimer=null}}
function clearVisual(){shell.classList.remove(...wiggleClasses,'hatch-wiggle','hatching');baby.classList.remove('hatched');crackLayer.innerHTML='';triggered=new Set();hatched=false;subtitle.textContent='Play and explore until the baby eagle hatches!'}
function wiggle(){if(hatched)return;let n;do{n=Math.floor(Math.random()*wiggleClasses.length)}while(n===lastWiggle&&wiggleClasses.length>1);lastWiggle=n;shell.classList.remove(...wiggleClasses,'hatch-wiggle');void shell.offsetWidth;shell.classList.add(wiggleClasses[n]);playWiggleSound()}
function addCrack(index){if(hatched)return;const spot=safeSpots[index%safeSpots.length],design=crackDesigns[index%crackDesigns.length],svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${design.w} ${design.h}`);svg.setAttribute('width',design.w);svg.setAttribute('height',design.h);svg.classList.add('crack');svg.style.left=spot.x+'%';svg.style.top=spot.y+'%';svg.style.transform=`translate(-50%,-50%) rotate(${(index*37)%140-70}deg) scale(${(.78+(index%3)*.12).toFixed(2)})`;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',design.d);svg.appendChild(path);crackLayer.appendChild(svg);playCrackSound()}
function restoreCracks(){crackLayer.innerHTML='';[...triggered].sort((a,b)=>a-b).forEach(i=>{const spot=safeSpots[i%safeSpots.length],design=crackDesigns[i%crackDesigns.length],svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${design.w} ${design.h}`);svg.setAttribute('width',design.w);svg.setAttribute('height',design.h);svg.classList.add('crack');svg.style.left=spot.x+'%';svg.style.top=spot.y+'%';svg.style.transform=`translate(-50%,-50%) rotate(${(i*37)%140-70}deg) scale(${(.78+(i%3)*.12).toFixed(2)})`;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',design.d);svg.appendChild(path);crackLayer.appendChild(svg)})}
function launchCleanup(){clearCleanup();sessionStorage.setItem('eea-cleanup-autoplay','1');cleanupTimer=setTimeout(()=>{location.href='clean-up-song.html?autoplay=1&from=center-stay'},2200)}
function hatch(immediate=false){if(hatched)return;hatched=true;running=false;remainingMs=0;endAt=0;clearTicker();subtitle.textContent='The baby eagle hatched! Clean up time!';shell.classList.remove(...wiggleClasses);shell.classList.add('hatch-wiggle');const finish=()=>{shell.classList.add('hatching');baby.classList.add('hatched');playHatchSound();saveState();renderControls();launchCleanup()};if(immediate)finish();else setTimeout(finish,700)}
function progress(){return selectedMs?Math.min(1,Math.max(0,1-remainingMs/selectedMs)):1}
function applyProgress(){const p=progress();thresholds.forEach((t,i)=>{if(p>=t&&!triggered.has(i)){triggered.add(i);wiggle();if(i>0)addCrack(i)}})}
function tick(){if(!running)return;remainingMs=Math.max(0,endAt-Date.now());applyProgress();renderControls();if(remainingMs<=0){hatch();return}}
function startTimer(){if(running||hatched||remainingMs<=0)return;ensureAudio();running=true;endAt=Date.now()+remainingMs;subtitle.textContent=remainingMs===selectedMs?'Stay in your center until the baby eagle hatches!':'Timer resumed — stay in your center!';playStartSound();clearTicker();ticker=setInterval(tick,500);saveState();renderControls()}
function pauseTimer(){if(!running)return;remainingMs=Math.max(0,endAt-Date.now());running=false;endAt=0;clearTicker();subtitle.textContent='Timer paused.';saveState();renderControls()}
function resetTimer(){clearTicker();clearCleanup();clearVisual();remainingMs=selectedMs;endAt=0;running=false;sessionStorage.removeItem('eea-cleanup-autoplay');saveState();renderControls()}
function restoreState(){try{const s=JSON.parse(localStorage.getItem(STATE_KEY)||'null');if(!s||s.date!==dateKey())return false;minutes=Math.max(1,Math.min(60,Number(s.minutes)||5));selectedMs=Math.max(60000,Number(s.selectedMs)||minutes*60000);remainingMs=Math.max(0,Number(s.remainingMs)||0);triggered=new Set(Array.isArray(s.triggered)?s.triggered.map(Number):[]);if(s.hatched){hatched=true;remainingMs=0;restoreCracks();shell.classList.add('hatching');baby.classList.add('hatched');subtitle.textContent='The baby eagle hatched! Clean up time!';renderControls();return true}if(s.running&&Number(s.endAt)>0){remainingMs=Math.max(0,Number(s.endAt)-Date.now());running=remainingMs>0;endAt=Number(s.endAt)}restoreCracks();applyProgress();if(remainingMs<=0){hatch(true);return true}if(running){subtitle.textContent='Timer resumed — stay in your center!';ticker=setInterval(tick,500)}else if(remainingMs<selectedMs)subtitle.textContent='Timer paused.';return true}catch(e){return false}}
minus.addEventListener('click',()=>{if(!running&&remainingMs===selectedMs){minutes=Math.max(1,minutes-1);selectedMs=minutes*60000;remainingMs=selectedMs;saveState();renderControls()}});
plus.addEventListener('click',()=>{if(!running&&remainingMs===selectedMs){minutes=Math.min(60,minutes+1);selectedMs=minutes*60000;remainingMs=selectedMs;saveState();renderControls()}});
start.addEventListener('click',startTimer);pause.addEventListener('click',pauseTimer);reset.addEventListener('click',resetTimer);shell.addEventListener('animationend',()=>shell.classList.remove(...wiggleClasses,'hatch-wiggle'));
restoreState();renderControls();window.addEventListener('pagehide',saveState);window.addEventListener('beforeunload',saveState);
})();
</script>
</body>
</html>
