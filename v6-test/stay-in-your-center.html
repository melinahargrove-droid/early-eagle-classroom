<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Stay in Your Center</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#eaf2f3}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),url("assets/background.webp");background-size:cover;background-position:center;background-repeat:no-repeat}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 35%,rgba(245,238,220,.05) 100%)}.close{position:absolute;z-index:20;top:2.1vh;right:2vw;width:clamp(48px,3.6vw,68px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(67,99,118,.38);background:rgba(255,253,247,.88);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(49,66,78,.10)}.header{position:absolute;z-index:10;top:2.3vh;left:50%;transform:translateX(-50%);width:min(82vw,1500px);text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.65),0 3px 12px rgba(255,255,255,.55)}h1{margin:0;font-size:clamp(42px,4.35vw,82px);line-height:1;color:#173f72;font-weight:900;letter-spacing:.006em}.subtitle{margin-top:1vh;font-size:clamp(20px,1.65vw,31px);line-height:1.15;color:#5b6f5a;font-weight:800}.scene{position:absolute;z-index:5;left:50%;top:20vh;transform:translateX(-50%);width:min(63vw,1060px);height:64vh}.nest-layer{position:absolute;left:50%;bottom:-3%;transform:translateX(-50%);width:min(60vw,980px);max-height:43%;object-fit:contain;object-position:center bottom;pointer-events:none;user-select:none}.nest-back{z-index:1;filter:drop-shadow(0 9px 8px rgba(66,60,45,.14))}.nest-front{z-index:6;clip-path:polygon(0 56%,8% 54%,16% 52%,24% 50%,32% 48%,39% 47%,44% 49%,48% 52%,50% 54%,52% 52%,56% 49%,61% 47%,68% 48%,76% 50%,84% 52%,92% 54%,100% 56%,100% 100%,0 100%)}.egg-wrap{position:absolute;z-index:3;left:50%;bottom:5%;transform:translateX(-50%);width:min(25vw,390px);height:min(45vh,520px);display:flex;align-items:flex-end;justify-content:center}.egg{display:block;width:100%;max-height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 10px rgba(73,68,52,.14));user-select:none;pointer-events:none}.baby-eagle{position:absolute;z-index:3;left:50%;bottom:5%;transform:translateX(-50%);width:min(27vw,430px);opacity:0;pointer-events:none;user-select:none}.teacher-panel{position:absolute;z-index:15;left:50%;bottom:2.3vh;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(7px,.7vw,13px);padding:clamp(7px,.65vw,12px);border:1.4px solid rgba(72,103,119,.32);border-radius:23px;background:rgba(255,252,244,.88);box-shadow:0 5px 16px rgba(47,62,73,.11),inset 0 0 0 1px rgba(255,255,255,.44);backdrop-filter:blur(2px)}.control{height:clamp(48px,5.7vh,66px);min-width:clamp(72px,6.2vw,112px);border-radius:17px;border:1.2px solid rgba(93,126,144,.38);background:rgba(255,253,248,.95);color:#173f72;font-weight:900;font-size:clamp(15px,1vw,20px);cursor:pointer;box-shadow:0 2px 7px rgba(48,67,78,.06)}.control.start{min-width:clamp(105px,8.5vw,155px);background:linear-gradient(180deg,rgba(211,229,211,.98),rgba(181,208,185,.96));border-color:rgba(82,127,92,.42)}.duration{min-width:clamp(88px,7.2vw,130px);text-align:center;color:#173f72;font-family:Arial,sans-serif;font-size:clamp(21px,1.55vw,30px);font-weight:900}.duration small{display:block;margin-top:-2px;font-family:inherit;font-size:clamp(9px,.62vw,12px);color:#70838c;text-transform:uppercase;letter-spacing:.05em}@media(max-height:760px){.header{top:1.4vh}.scene{top:17vh;height:67vh}.teacher-panel{bottom:1.5vh}}
</style></head>
<body><main class="stage"><button class="close" aria-label="Close" onclick="history.back()">×</button><header class="header"><h1>Stay in Your Center</h1><div class="subtitle">Play and explore until the baby eagle hatches!</div></header><section class="scene" aria-label="Baby eagle hatching scene"><img class="nest-layer nest-back" src="assets/nest.webp" alt=""><img class="baby-eagle" src="assets/baby-eagle.webp" alt="" aria-hidden="true"><div class="egg-wrap"><img class="egg" src="assets/egg.webp" alt="Speckled eagle egg"></div><img class="nest-layer nest-front" src="assets/nest.webp" alt="Watercolor bird nest"></section><section class="teacher-panel" aria-label="Teacher timer controls"><button class="control" id="minus">− 1 min</button><div class="duration" id="duration">5 min<small>teacher setting</small></div><button class="control" id="plus">+ 1 min</button><button class="control start" id="start">▶ Start</button></section></main><script>(()=>{const duration=document.getElementById('duration'),minus=document.getElementById('minus'),plus=document.getElementById('plus');let minutes=5;function render(){duration.innerHTML=`${minutes} min<small>teacher setting</small>`;minus.disabled=minutes<=1}minus.addEventListener('click',()=>{minutes=Math.max(1,minutes-1);render()});plus.addEventListener('click',()=>{minutes=Math.min(60,minutes+1);render()});document.getElementById('start').addEventListener('click',()=>{});render()})();</script></body></html>
