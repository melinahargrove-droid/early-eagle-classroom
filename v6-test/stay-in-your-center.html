<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Stay in Your Center</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#eaf2f3}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),url("assets/background.webp");background-size:cover;background-position:center;background-repeat:no-repeat}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 35%,rgba(245,238,220,.05) 100%)}.close{position:absolute;z-index:20;top:2.1vh;right:2vw;width:clamp(48px,3.6vw,68px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(67,99,118,.38);background:rgba(255,253,247,.88);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(49,66,78,.10)}.header{position:absolute;z-index:10;top:2.3vh;left:50%;transform:translateX(-50%);width:min(82vw,1500px);text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.65),0 3px 12px rgba(255,255,255,.55)}h1{margin:0;font-size:clamp(42px,4.35vw,82px);line-height:1;color:#173f72;font-weight:900;letter-spacing:.006em}.subtitle{margin-top:1vh;font-size:clamp(20px,1.65vw,31px);line-height:1.15;color:#5b6f5a;font-weight:800}.scene{position:absolute;z-index:5;left:50%;top:23vh;transform:translateX(-50%) translateY(55px);width:min(78vw,1320px);height:68vh}.nest-layer{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none;user-select:none}.nest-back{z-index:1;filter:drop-shadow(0 9px 8px rgba(66,60,45,.12))}.egg-wrap{position:absolute;z-index:3;left:50%;bottom:8%;transform:translateX(-50%) translate(0,-74px) scale(1.5);width:min(24vw,380px);height:min(45vh,520px);display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 94%}.egg-shell{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 94%}.egg{display:block;width:100%;max-height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 10px rgba(73,68,52,.14));user-select:none;pointer-events:none;transition:opacity .12s ease}.crack-layer{position:absolute;inset:0;pointer-events:none;clip-path:ellipse(40% 47% at 50% 52%);transition:opacity .12s ease}.crack{position:absolute;overflow:visible;transform-origin:50% 50%}.crack path{fill:none;stroke:#8a5b34;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 .6px .3px rgba(86,53,30,.22))}.hatch-pieces{position:absolute;inset:0;pointer-events:none;opacity:0}.shell-piece{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 4px 5px rgba(73,68,52,.12));opacity:0}.shell-left{clip-path:polygon(10% 42%,49% 38%,53% 49%,48% 58%,53% 67%,47% 78%,50% 100%,5% 100%)}.shell-right{clip-path:polygon(51% 38%,90% 42%,95% 100%,50% 100%,53% 78%,47% 67%,52% 58%,47% 49%)}.shell-top{clip-path:polygon(27% 0,73% 0,88% 42%,64% 44%,53% 50%,42% 44%,12% 42%)}.baby-eagle{position:absolute;z-index:4;left:50%;bottom:7%;transform:translate(-50%,90px) scale(.88);width:min(27vw,430px);opacity:0;pointer-events:none;user-select:none;filter:drop-shadow(0 8px 9px rgba(61,68,59,.12))}.nest-front{z-index:6}.teacher-panel{position:absolute;z-index:15;left:50%;bottom:2.3vh;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(7px,.7vw,13px);padding:clamp(7px,.65vw,12px);border:1.4px solid rgba(72,103,119,.32);border-radius:23px;background:rgba(255,252,244,.88);box-shadow:0 5px 16px rgba(47,62,73,.11),inset 0 0 0 1px rgba(255,255,255,.44);backdrop-filter:blur(2px)}.control{height:clamp(48px,5.7vh,66px);min-width:clamp(72px,6.2vw,112px);border-radius:17px;border:1.2px solid rgba(93,126,144,.38);background:rgba(255,253,248,.95);color:#173f72;font-weight:900;font-size:clamp(15px,1vw,20px);cursor:pointer;box-shadow:0 2px 7px rgba(48,67,78,.06)}.control.start{min-width:clamp(105px,8.5vw,155px);background:linear-gradient(180deg,rgba(211,229,211,.98),rgba(181,208,185,.96));border-color:rgba(82,127,92,.42)}.duration{min-width:clamp(88px,7.2vw,130px);text-align:center;color:#173f72;font-family:Arial,sans-serif;font-size:clamp(21px,1.55vw,30px);font-weight:900}.duration small{display:block;margin-top:-2px;font-family:inherit;font-size:clamp(9px,.62vw,12px);color:#70838c;text-transform:uppercase;letter-spacing:.05em}.test-tools{position:absolute;z-index:30;left:1.2vw;top:18vh;display:flex;flex-direction:column;gap:8px}.test-tools button{padding:11px 15px;border-radius:15px;border:1.4px solid rgba(72,103,119,.35);background:rgba(255,252,244,.94);color:#173f72;font-family:Arial,sans-serif;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(47,62,73,.10)}@keyframes wiggleA{0%,100%{transform:rotate(0)}20%{transform:rotate(-1.4deg)}42%{transform:rotate(1.2deg)}64%{transform:rotate(-.7deg)}82%{transform:rotate(.35deg)}}@keyframes wiggleB{0%,100%{transform:rotate(0)}24%{transform:rotate(1.7deg)}48%{transform:rotate(-1deg)}72%{transform:rotate(.55deg)}}@keyframes wiggleC{0%,100%{transform:rotate(0)}16%{transform:rotate(-1deg)}32%{transform:rotate(.9deg)}48%{transform:rotate(-.8deg)}64%{transform:rotate(.65deg)}80%{transform:rotate(-.3deg)}}@keyframes wiggleD{0%,100%{transform:rotate(0)}18%{transform:rotate(-2.1deg)}38%{transform:rotate(1.8deg)}58%{transform:rotate(-1.1deg)}76%{transform:rotate(.6deg)}}@keyframes hatchWiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-2.3deg)}30%{transform:rotate(2.1deg)}46%{transform:rotate(-2.8deg)}62%{transform:rotate(2.5deg)}78%{transform:rotate(-1.3deg)}90%{transform:rotate(.7deg)}}@keyframes pieceLeft{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(-32px,18px) rotate(-12deg)}}@keyframes pieceRight{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(32px,18px) rotate(12deg)}}@keyframes pieceTop{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(8px,-28px) rotate(9deg)}}@keyframes babyRise{0%{opacity:0;transform:translate(-50%,90px) scale(.88)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-6px) scale(1)}}.wiggle-a{animation:wiggleA .9s ease-in-out}.wiggle-b{animation:wiggleB .8s ease-in-out}.wiggle-c{animation:wiggleC 1.05s ease-in-out}.wiggle-d{animation:wiggleD .95s ease-in-out}.hatch-wiggle{animation:hatchWiggle 1.05s ease-in-out}.hatching .egg,.hatching .crack-layer{opacity:0}.hatching .hatch-pieces{opacity:1}.hatching .shell-left{animation:pieceLeft .75s ease-out forwards}.hatching .shell-right{animation:pieceRight .75s ease-out forwards}.hatching .shell-top{animation:pieceTop .75s ease-out forwards}.baby-eagle.hatched{animation:babyRise 1.25s cubic-bezier(.22,.75,.3,1) .18s forwards}@media(max-height:760px){.header{top:1.4vh}.scene{top:20vh;height:71vh}.teacher-panel{bottom:1.5vh}.test-tools{top:15vh}}
</style></head>
<body><main class="stage"><button class="close" aria-label="Close" onclick="history.back()">×</button><header class="header"><h1>Stay in Your Center</h1><div class="subtitle" id="subtitle">Play and explore until the baby eagle hatches!</div></header><div class="test-tools"><button id="wiggleTest" type="button">Test Wiggle 🥚</button><button id="crackTest" type="button">Test Crack</button><button id="clearCracks" type="button">Clear Cracks</button><button id="hatchTest" type="button">Test Hatch 🐣</button><button id="resetHatch" type="button">Reset Hatch</button></div><section class="scene" id="scene" aria-label="Baby eagle hatching scene"><img class="nest-layer nest-back" src="assets/nest-back.png?v=20260815b" alt=""><img class="baby-eagle" id="babyEagle" src="assets/baby-eagle.webp" alt="Baby eagle" aria-hidden="true"><div class="egg-wrap"><div class="egg-shell" id="eggShell"><img class="egg" src="assets/egg.webp" alt="Speckled eagle egg"><div class="crack-layer" id="crackLayer" aria-hidden="true"></div><div class="hatch-pieces" aria-hidden="true"><img class="shell-piece shell-left" src="assets/egg.webp" alt=""><img class="shell-piece shell-right" src="assets/egg.webp" alt=""><img class="shell-piece shell-top" src="assets/egg.webp" alt=""></div></div></div><img class="nest-layer nest-front" src="assets/nest-front.png?v=20260815b" alt="Watercolor bird nest"></section><section class="teacher-panel" aria-label="Teacher timer controls"><button class="control" id="minus">− 1 min</button><div class="duration" id="duration">5 min<small>teacher setting</small></div><button class="control" id="plus">+ 1 min</button><button class="control start" id="start">▶ Start</button></section></main><script>(()=>{const duration=document.getElementById('duration'),minus=document.getElementById('minus'),plus=document.getElementById('plus');let minutes=5;function render(){duration.innerHTML=`${minutes} min<small>teacher setting</small>`;minus.disabled=minutes<=1}minus.addEventListener('click',()=>{minutes=Math.max(1,minutes-1);render()});plus.addEventListener('click',()=>{minutes=Math.min(60,minutes+1);render()});document.getElementById('start').addEventListener('click',()=>{});render();const shell=document.getElementById('eggShell'),wiggle=document.getElementById('wiggleTest'),classes=['wiggle-a','wiggle-b','wiggle-c','wiggle-d'];let last=-1,hatched=false;wiggle.addEventListener('click',()=>{if(hatched)return;let next;do{next=Math.floor(Math.random()*classes.length)}while(next===last&&classes.length>1);last=next;shell.classList.remove(...classes,'hatch-wiggle');void shell.offsetWidth;shell.classList.add(classes[next]);});shell.addEventListener('animationend',()=>shell.classList.remove(...classes,'hatch-wiggle'));const crackLayer=document.getElementById('crackLayer'),crackBtn=document.getElementById('crackTest'),clearBtn=document.getElementById('clearCracks');const safeSpots=[{x:46,y:23},{x:55,y:27},{x:38,y:36},{x:61,y:38},{x:32,y:49},{x:50,y:48},{x:67,y:50},{x:38,y:61},{x:58,y:62},{x:44,y:73},{x:57,y:73}];const designs=[{w:58,h:28,d:'M3 16 L15 11 L24 14 L34 8 L46 12 L55 7 M24 14 L20 24 M34 8 L37 2'},{w:48,h:34,d:'M4 25 L14 18 L22 20 L28 11 L39 13 L45 5 M22 20 L25 30 M28 11 L22 5'},{w:64,h:24,d:'M2 13 L15 9 L27 13 L39 7 L50 11 L62 6 M15 9 L11 3 M39 7 L42 18 M50 11 L55 20'},{w:38,h:48,d:'M18 3 L14 13 L20 20 L12 30 L18 38 L14 46 M20 20 L30 17 M12 30 L4 35'},{w:54,h:40,d:'M3 30 L14 24 L22 27 L31 18 L42 20 L51 10 M22 27 L19 37 M31 18 L27 8 M42 20 L48 30'},{w:46,h:26,d:'M2 15 L12 12 L20 16 L28 9 L37 12 L44 6 M20 16 L23 24 M28 9 L25 2'},{w:60,h:36,d:'M3 28 L14 21 L25 23 L34 14 L45 16 L57 7 M14 21 L9 11 M34 14 L31 4 M45 16 L51 28'},{w:42,h:42,d:'M8 4 L14 13 L10 21 L18 27 L13 37 M14 13 L24 10 M10 21 L2 18 M18 27 L29 31'}];let used=[];crackBtn.addEventListener('click',()=>{if(hatched||used.length>=7)return;const choices=safeSpots.map((_,i)=>i).filter(i=>!used.includes(i));const idx=choices[Math.floor(Math.random()*choices.length)];used.push(idx);const s=safeSpots[idx],design=designs[Math.floor(Math.random()*designs.length)];const scale=(.68+Math.random()*.5).toFixed(2),rot=Math.round(-80+Math.random()*160);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${design.w} ${design.h}`);svg.setAttribute('width',design.w);svg.setAttribute('height',design.h);svg.classList.add('crack');svg.style.left=`${s.x}%`;svg.style.top=`${s.y}%`;svg.style.transform=`translate(-50%,-50%) rotate(${rot}deg) scale(${scale})`;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',design.d);svg.appendChild(path);crackLayer.appendChild(svg);});clearBtn.addEventListener('click',()=>{if(hatched)return;crackLayer.innerHTML='';used=[];});const hatchBtn=document.getElementById('hatchTest'),resetBtn=document.getElementById('resetHatch'),baby=document.getElementById('babyEagle'),subtitle=document.getElementById('subtitle');hatchBtn.addEventListener('click',()=>{if(hatched)return;hatched=true;shell.classList.remove(...classes);void shell.offsetWidth;shell.classList.add('hatch-wiggle');setTimeout(()=>{shell.classList.add('hatching');baby.classList.add('hatched');subtitle.textContent='The baby eagle hatched! You may choose a new center!';},850);});resetBtn.addEventListener('click',()=>{hatched=false;shell.classList.remove(...classes,'hatch-wiggle','hatching');baby.classList.remove('hatched');crackLayer.innerHTML='';used=[];subtitle.textContent='Play and explore until the baby eagle hatches!';});})();</script></body></html>
