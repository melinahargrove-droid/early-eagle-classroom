<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Stay in Your Center</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#eaf2f3}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),url("assets/background.webp");background-size:cover;background-position:center}.close{position:absolute;z-index:20;top:2.1vh;right:2vw;width:clamp(48px,3.6vw,68px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(67,99,118,.38);background:rgba(255,253,247,.88);color:#173f72;font-size:clamp(25px,2vw,36px);font-weight:900}.header{position:absolute;z-index:10;top:2.3vh;left:50%;transform:translateX(-50%);width:min(82vw,1500px);text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.65),0 3px 12px rgba(255,255,255,.55)}h1{margin:0;font-size:clamp(42px,4.35vw,82px);line-height:1;font-weight:900}.subtitle{margin-top:1vh;font-size:clamp(20px,1.65vw,31px);color:#5b6f5a;font-weight:800}.scene{position:absolute;z-index:5;left:50%;top:23vh;transform:translateX(-50%) translateY(55px);width:min(78vw,1320px);height:68vh}.nest-layer{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none}.nest-back{z-index:1}.nest-front{z-index:6}.egg-wrap{position:absolute;z-index:3;left:50%;bottom:8%;transform:translateX(-50%) translateY(-74px) scale(1.5);width:min(24vw,380px);height:min(45vh,520px);transform-origin:50% 94%}.egg-shell{position:relative;width:100%;height:100%;transform-origin:50% 94%}.egg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 10px rgba(73,68,52,.14));transition:opacity .12s}.crack-layer{position:absolute;inset:0;pointer-events:none;clip-path:ellipse(40% 47% at 50% 52%);transition:opacity .12s}.crack{position:absolute;overflow:visible;transform-origin:50% 50%}.crack path{fill:none;stroke:#8a5b34;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.hatch-pieces{position:absolute;inset:0;opacity:0;pointer-events:none}.shell-piece{position:absolute;opacity:0;filter:drop-shadow(0 4px 5px rgba(73,68,52,.12));transform-origin:center}.piece-cap{width:74%;left:13%;top:8%}.piece-left{width:58%;left:3%;top:34%}.piece-right{width:58%;right:3%;top:34%}.piece-lower-left{width:46%;left:9%;bottom:5%}.piece-lower-right{width:46%;right:9%;bottom:5%}.baby-eagle{position:absolute;z-index:4;left:50%;bottom:7%;transform:translate(-50%,90px) scale(.88);width:min(27vw,430px);opacity:0;pointer-events:none;filter:drop-shadow(0 8px 9px rgba(61,68,59,.12))}.teacher-panel{position:absolute;z-index:15;left:50%;bottom:2.3vh;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(7px,.7vw,13px);padding:clamp(7px,.65vw,12px);border:1.4px solid rgba(72,103,119,.32);border-radius:23px;background:rgba(255,252,244,.88);box-shadow:0 5px 16px rgba(47,62,73,.11)}.control{height:clamp(48px,5.7vh,66px);min-width:clamp(72px,6.2vw,112px);border-radius:17px;border:1.2px solid rgba(93,126,144,.38);background:rgba(255,253,248,.95);color:#173f72;font-weight:900}.control.start{min-width:clamp(105px,8.5vw,155px);background:linear-gradient(180deg,rgba(211,229,211,.98),rgba(181,208,185,.96))}.duration{min-width:clamp(88px,7.2vw,130px);text-align:center;font-family:Arial,sans-serif;font-size:clamp(21px,1.55vw,30px);font-weight:900}.duration small{display:block;font-size:clamp(9px,.62vw,12px);color:#70838c;text-transform:uppercase}.test-tools{position:absolute;z-index:30;left:1.2vw;top:18vh;display:flex;flex-direction:column;gap:8px}.test-tools button{padding:11px 15px;border-radius:15px;border:1.4px solid rgba(72,103,119,.35);background:rgba(255,252,244,.94);color:#173f72;font-family:Arial,sans-serif;font-weight:800}@keyframes wiggleA{0%,100%{transform:rotate(0)}20%{transform:rotate(-1.4deg)}42%{transform:rotate(1.2deg)}64%{transform:rotate(-.7deg)}82%{transform:rotate(.35deg)}}@keyframes wiggleB{0%,100%{transform:rotate(0)}24%{transform:rotate(1.7deg)}48%{transform:rotate(-1deg)}72%{transform:rotate(.55deg)}}@keyframes wiggleC{0%,100%{transform:rotate(0)}16%{transform:rotate(-1deg)}32%{transform:rotate(.9deg)}48%{transform:rotate(-.8deg)}64%{transform:rotate(.65deg)}80%{transform:rotate(-.3deg)}}@keyframes hatchWiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-2.3deg)}30%{transform:rotate(2.1deg)}46%{transform:rotate(-2.8deg)}62%{transform:rotate(2.5deg)}78%{transform:rotate(-1.3deg)}}@keyframes capOut{to{opacity:1;transform:translate(10px,-34px) rotate(10deg)}}@keyframes leftOut{to{opacity:1;transform:translate(-34px,14px) rotate(-12deg)}}@keyframes rightOut{to{opacity:1;transform:translate(34px,14px) rotate(12deg)}}@keyframes lowerLeftOut{to{opacity:1;transform:translate(-18px,16px) rotate(-8deg)}}@keyframes lowerRightOut{to{opacity:1;transform:translate(18px,16px) rotate(8deg)}}@keyframes babyRise{0%{opacity:0;transform:translate(-50%,90px) scale(.88)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-6px) scale(1)}}.wiggle-a{animation:wiggleA .9s ease-in-out}.wiggle-b{animation:wiggleB .8s ease-in-out}.wiggle-c{animation:wiggleC 1.05s ease-in-out}.hatch-wiggle{animation:hatchWiggle 1.05s ease-in-out}.hatching .egg,.hatching .crack-layer{opacity:0}.hatching .hatch-pieces{opacity:1}.hatching .piece-cap{animation:capOut .7s ease-out forwards}.hatching .piece-left{animation:leftOut .7s ease-out forwards}.hatching .piece-right{animation:rightOut .7s ease-out forwards}.hatching .piece-lower-left{animation:lowerLeftOut .7s ease-out forwards}.hatching .piece-lower-right{animation:lowerRightOut .7s ease-out forwards}.baby-eagle.hatched{animation:babyRise 1.25s cubic-bezier(.22,.75,.3,1) .15s forwards}@media(max-height:760px){.scene{top:20vh;height:71vh}.test-tools{top:15vh}}</style></head><body><main class="stage"><button class="close" onclick="history.back()">×</button><header class="header"><h1>Stay in Your Center</h1><div class="subtitle" id="subtitle">Play and explore until the baby eagle hatches!</div></header><div class="test-tools"><button id="wiggleTest">Test Wiggle 🥚</button><button id="crackTest">Test Crack</button><button id="clearCracks">Clear Cracks</button><button id="hatchTest">Test Hatch 🐣</button><button id="resetHatch">Reset Hatch</button></div><section class="scene"><img class="nest-layer nest-back" src="assets/nest-back.png?v=20260815b"><img class="baby-eagle" id="babyEagle" src="assets/baby-eagle.webp"><div class="egg-wrap"><div class="egg-shell" id="eggShell"><img class="egg" src="assets/egg.webp"><div class="crack-layer" id="crackLayer"></div><div class="hatch-pieces"><img class="shell-piece piece-cap" src="assets/shell-cap.png"><img class="shell-piece piece-left" src="assets/shell-left.png"><img class="shell-piece piece-right" src="assets/shell-right.png"><img class="shell-piece piece-lower-left" src="assets/shell-lower-left.png"><img class="shell-piece piece-lower-right" src="assets/shell-lower-right.png"></div></div></div><img class="nest-layer nest-front" src="assets/nest-front.png?v=20260815b"></section><section class="teacher-panel"><button class="control" id="minus">− 1 min</button><div class="duration" id="duration">5 min<small>teacher setting</small></div><button class="control" id="plus">+ 1 min</button><button class="control start" id="start">▶ Start</button></section></main><script>(()=>{const duration=document.getElementById('duration'),minus=document.getElementById('minus'),plus=document.getElementById('plus');let minutes=5;function render(){duration.innerHTML=`${minutes} min<small>teacher setting</small>`;minus.disabled=minutes<=1}minus.onclick=()=>{minutes=Math.max(1,minutes-1);render()};plus.onclick=()=>{minutes=Math.min(60,minutes+1);render()};render();const shell=document.getElementById('eggShell'),wiggle=document.getElementById('wiggleTest'),classes=['wiggle-a','wiggle-b','wiggle-c'];let last=-1,hatched=false;wiggle.onclick=()=>{if(hatched)return;let next;do{next=Math.floor(Math.random()*classes.length)}while(next===last);last=next;shell.classList.remove(...classes,'hatch-wiggle');void shell.offsetWidth;shell.classList.add(classes[next])};shell.addEventListener('animationend',()=>shell.classList.remove(...classes,'hatch-wiggle'));const crackLayer=document.getElementById('crackLayer'),safe=[{x:46,y:23},{x:55,y:27},{x:38,y:36},{x:61,y:38},{x:32,y:49},{x:50,y:48},{x:67,y:50},{x:38,y:61},{x:58,y:62},{x:44,y:73},{x:57,y:73}],designs=[{w:58,h:28,d:'M3 16 L15 11 L24 14 L34 8 L46 12 L55 7 M24 14 L20 24 M34 8 L37 2'},{w:64,h:24,d:'M2 13 L15 9 L27 13 L39 7 L50 11 L62 6 M15 9 L11 3 M39 7 L42 18 M50 11 L55 20'},{w:38,h:48,d:'M18 3 L14 13 L20 20 L12 30 L18 38 L14 46 M20 20 L30 17 M12 30 L4 35'},{w:54,h:40,d:'M3 30 L14 24 L22 27 L31 18 L42 20 L51 10 M22 27 L19 37 M31 18 L27 8 M42 20 L48 30'}];let used=[];document.getElementById('crackTest').onclick=()=>{if(hatched||used.length>=7)return;const choices=safe.map((_,i)=>i).filter(i=>!used.includes(i)),idx=choices[Math.floor(Math.random()*choices.length)],s=safe[idx],d=designs[Math.floor(Math.random()*designs.length)];used.push(idx);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${d.w} ${d.h}`);svg.setAttribute('width',d.w);svg.setAttribute('height',d.h);svg.classList.add('crack');svg.style.left=s.x+'%';svg.style.top=s.y+'%';svg.style.transform=`translate(-50%,-50%) rotate(${Math.round(-80+Math.random()*160)}deg) scale(${(.68+Math.random()*.5).toFixed(2)})`;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d.d);svg.appendChild(p);crackLayer.appendChild(svg)};document.getElementById('clearCracks').onclick=()=>{if(!hatched){crackLayer.innerHTML='';used=[]}};const baby=document.getElementById('babyEagle'),subtitle=document.getElementById('subtitle');document.getElementById('hatchTest').onclick=()=>{if(hatched)return;hatched=true;shell.classList.remove(...classes);void shell.offsetWidth;shell.classList.add('hatch-wiggle');setTimeout(()=>{shell.classList.add('hatching');baby.classList.add('hatched');subtitle.textContent='The baby eagle hatched! You may choose a new center!'},850)};document.getElementById('resetHatch').onclick=()=>{hatched=false;shell.classList.remove(...classes,'hatch-wiggle','hatching');baby.classList.remove('hatched');crackLayer.innerHTML='';used=[];subtitle.textContent='Play and explore until the baby eagle hatches!'};})();</script></body></html>
