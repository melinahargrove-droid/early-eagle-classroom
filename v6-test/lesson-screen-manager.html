<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Lesson</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 62%,#e4eee9)}.wrap{max-width:960px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.top h1{margin:0;font-size:38px}.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:900;cursor:pointer}.back{background:#fffdf8;color:#245c78;border:1px solid #cbdde0}.add{background:#668f99;color:white}.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#eef5f4;color:#557876;font-weight:800}.list{display:grid;gap:12px;margin-top:20px}.item{background:#fffdf9;border:1.5px solid #cbdde0;border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center}.visual{font-size:38px;text-align:center}.item h2{margin:0 0 4px;font-size:22px}.item p{margin:0;color:#607976}.actions{display:flex;gap:7px;align-items:center}.edit{background:#e7f2f8;color:#245c78}.move{background:#edf3e6;color:#4f704b;min-width:44px;padding:10px}.move:disabled{opacity:.32;cursor:default}.empty{padding:34px;text-align:center;background:#fffdf9;border:1.5px dashed #cbdde0;border-radius:20px;color:#6d8584;font-weight:900}</style><script src="teacher-access.js"></script><script>if(!window.EEATeacherAccess||!EEATeacherAccess.requireAccess())throw new Error('Teacher access required');</script></head><body><main class="wrap"><div class="top"><div><div id="crumb" style="font-weight:900;color:#789697;letter-spacing:.08em"></div><h1>Edit Lesson</h1></div><div><button class="btn back" id="back">Back to Lesson</button> <button class="btn add" id="add">+ Add Screen</button></div></div><div class="note">These are your teacher-added screens. Use the arrows to put them in the order you want. They appear before the locked curriculum lesson for this section.</div><div class="list" id="list"></div></main><script>(()=>{const q=new URLSearchParams(location.search),week=Number(q.get('week'))||1,day=Math.max(0,Math.min(4,Number(q.get('day'))||0)),section=Math.max(0,Math.min(20,Number(q.get('section'))||0)),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],sectionMap={1:['Community Meeting','Read Aloud','Centers','Storytelling','Closing Circle'],2:['Community Meeting','Read Aloud','Centers','Literacy Small Groups','Storytelling','Closing Circle'],3:['Community Meeting','Read Aloud','Centers','Small Groups','Storytelling','Closing Circle'],4:['Community Meeting','Read Aloud','Centers','Small Groups','Building Blocks','Storytelling','Closing Circle'],5:['Community Meeting','Read Aloud','Centers','Small Groups','Building Blocks','Storytelling','Closing Circle'],6:['Community Meeting','Read Aloud','Centers','Small Groups','Building Blocks','Storytelling','Closing Circle'],7:['Community Meeting','Read Aloud','Centers','Small Groups','Building Blocks','Storytelling','Closing Circle'],8:['Community Meeting','Read Aloud','Centers','Small Groups','Building Blocks','Storytelling','Closing Circle']},sections=sectionMap[week]||sectionMap[8],KEY='eea-added-lesson-screens',$=id=>document.getElementById(id),bucket=`w${week}-d${day}-s${section}`;function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return {}}}function write(x){localStorage.setItem(KEY,JSON.stringify(x))}function runner(){location.href=`lesson-runner-week${week}.html?week=${week}&day=${day}&section=${section}&v=${Date.now()}`}function editor(id=''){let u=`lesson-screen-editor.html?week=${week}&day=${day}&section=${section}`;if(id)u+='&id='+encodeURIComponent(id);location.href=u}$('crumb').textContent=`WEEK ${week} · ${days[day].toUpperCase()} · ${(sections[section]||('SECTION '+(section+1))).toUpperCase()}`;$('back').onclick=runner;$('add').onclick=()=>editor();function render(){const data=read(),items=Array.isArray(data[bucket])?data[bucket]:[];$('list').innerHTML=items.length?items.map((x,i)=>`<div class="item"><div class="visual">${(x.visual||'⭐').replace(/[<>]/g,'')}</div><div><h2>${(x.title||'Teacher Added Screen').replace(/[<>]/g,'')}</h2><p>${(x.body||'No main text yet.').replace(/[<>]/g,'')}</p></div><div class="actions"><button class="btn move" data-up="${i}" ${i===0?'disabled':''} aria-label="Move up">↑</button><button class="btn move" data-down="${i}" ${i===items.length-1?'disabled':''} aria-label="Move down">↓</button><button class="btn edit" data-id="${x.id}">Edit</button></div></div>`).join(''):'<div class="empty">No teacher-added screens yet.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>editor(b.dataset.id));document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(Number(b.dataset.up),-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(Number(b.dataset.down),1))}function move(i,delta){const data=read(),items=Array.isArray(data[bucket])?[...data[bucket]]:[],j=i+delta;if(i<0||j<0||i>=items.length||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];data[bucket]=items;write(data);render()}render()})();</script></body></html>
