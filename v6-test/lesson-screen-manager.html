<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Lesson</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 62%,#e4eee9)}.wrap{max-width:960px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.top h1{margin:0;font-size:38px}.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:900;cursor:pointer}.back{background:#fffdf8;color:#245c78;border:1px solid #cbdde0}.add{background:#668f99;color:white}.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#eef5f4;color:#557876;font-weight:800}.list{display:grid;gap:12px;margin-top:20px}.item{background:#fffdf9;border:1.5px solid #cbdde0;border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center}.visual{font-size:38px;text-align:center}.item h2{margin:0 0 4px;font-size:22px}.item p{margin:0;color:#607976}.edit{background:#e7f2f8;color:#245c78}.empty{padding:34px;text-align:center;background:#fffdf9;border:1.5px dashed #cbdde0;border-radius:20px;color:#6d8584;font-weight:900}</style></head><body><main class="wrap"><div class="top"><div><div id="crumb" style="font-weight:900;color:#789697;letter-spacing:.08em"></div><h1>Edit Lesson</h1></div><div><button class="btn back" id="back">Back to Lesson</button> <button class="btn add" id="add">+ Add Screen</button></div></div><div class="note">These are your teacher-added screens. They appear before the locked curriculum lesson for this section. You can edit or delete them without changing the built-in curriculum.</div><div class="list" id="list"></div></main><script>(()=>{const q=new URLSearchParams(location.search),week=Number(q.get('week'))||1,day=Math.max(0,Math.min(4,Number(q.get('day'))||0)),section=Math.max(0,Math.min(20,Number(q.get('section'))||0)),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],sections=['Community Meeting','Read Aloud','Centers','Storytelling','Closing Circle'],KEY='eea-added-lesson-screens',$=id=>document.getElementById(id),bucket=`w${week}-d${day}-s${section}`;function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return {}}}const list=Array.isArray(read()[bucket])?read()[bucket]:[];$('crumb').textContent=`WEEK ${week} · ${days[day].toUpperCase()} · ${(sections[section]||('SECTION '+(section+1))).toUpperCase()}`;function runner(){location.href=`lesson-runner-week${week}.html?week=${week}&day=${day}&section=${section}&v=${Date.now()}`}function editor(id=''){let u=`lesson-screen-editor.html?week=${week}&day=${day}&section=${section}`;if(id)u+='&id='+encodeURIComponent(id);location.href=u}$('back').onclick=runner;$('add').onclick=()=>editor();$('list').innerHTML=list.length?list.map((x,i)=>`<div class="item"><div class="visual">${(x.visual||'⭐').replace(/[<>]/g,'')}</div><div><h2>${(x.title||'Teacher Added Screen').replace(/[<>]/g,'')}</h2><p>${(x.body||'No main text yet.').replace(/[<>]/g,'')}</p></div><button class="btn edit" data-id="${x.id}">Edit</button></div>`).join(''):'<div class="empty">No teacher-added screens yet.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>editor(b.dataset.id))})();</script></body></html>
