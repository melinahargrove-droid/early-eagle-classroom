<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fo3s Lola Goes to School Read 1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f6f1e5;color:#174f7d}.page{height:100vh;padding:2.5vh 4vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:10vh;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.1em;color:#789697}.brand h1{margin:.4vh 0;color:#164f7f;font-size:clamp(32px,2.7vw,52px)}.chip{height:max-content;background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.card{height:72vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.visual{height:55vh;border-radius:28px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2vw}.spread{font-size:clamp(56px,6vw,100px);font-weight:900;color:#668f99}.visual small{color:#789697;font-weight:900}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h2{font-size:clamp(38px,3.5vw,66px);line-height:1.05;margin:1vh 0;color:#164f7f}.copy p{font-size:clamp(19px,1.35vw,26px);line-height:1.4;font-weight:850;color:#527673}.note{background:#e7f0ed;border-radius:18px;padding:1.2vh 1.2vw;color:#416d61;font-weight:850;line-height:1.4}.bottom{height:11vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900;cursor:pointer}.bottom .next{background:#668f99;color:#fff}.progress{font-weight:900;color:#789697}</style></head><body><main class="page"><header><div class="brand">EARLY EAGLE ACADEMY · READ ALOUD · FOCUS ON PRE-K 3s<h1>Lola Goes to School · Read 1</h1></div><div class="chip">U1 · W1 · MONDAY</div></header><section class="card"><div class="visual"><div class="spread" id="spread"></div><small id="adapt"></small></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><p id="say"></p><div class="note" id="note"></div></div></section><div class="bottom"><button id="prev">← Community Meeting</button><div class="progress" id="progress"></div><button class="next" id="next">Next →</button></div></main><script>(()=>{const cards=[{spread:'📚',adapt:'BEFORE READING',title:'Welcome to Read Aloud',say:'This is our first unit. It is called Family and Friends. Every day we will have a Read Aloud time, where we read a book together and talk about it.',note:'Launch the Read Aloud routine. Children sit together. Emphasize listening with ears and looking with eyes. Model raising a hand as one way to show you have an idea or question.'},{spread:'📖',adapt:'BOOK INTRODUCTION',title:'Meet the Book',say:'The title of today’s book is Lola Goes to School. The title is the name of a book. Anna McQuinn is the author; she wrote the words. Rosalind Beardshaw is the illustrator; she created the pictures.',note:'Make the connection: children have ideas about starting school. Invite them to read and find out what Lola does when she goes to school.'},{spread:'1–2',adapt:'ADAPTED TEXT SPREAD',title:'Lola Is Starting School',say:'Lola is starting school tomorrow.',note:'Read the book fluently. The adapted slideshow is the child-facing visual resource. This placeholder will be replaced by the actual curriculum spread image.'},{spread:'3–4',adapt:'CURRICULUM STOP · PAGE 3',title:'Quick Word: visit',say:'To visit is to go somewhere and see a person or a place. Lola and her family visited her new school before she started.',note:'This is the first required Fo3s Read 1 stopping point.'},{spread:'5–8',adapt:'CONTINUE READING',title:'Getting Ready',say:'Lola picks out her clothes and gets all her things ready for school.',note:'Continue reading fluently toward the next curriculum stop.'},{spread:'9–10',adapt:'CURRICULUM STOP · PAGE 10',title:'Getting Ready for School',say:'What are some things Lola does to get ready for school? Show me thumbs up if you did any of those things today!',note:'Model thinking aloud and putting a thumb up—for example, Lola packed her bag and you packed yours.'},{spread:'11–12',adapt:'CURRICULUM STOP · PAGE 11',title:'Quick Word: welcome',say:'Ms. Suzan welcomes everyone. That means she greeted them happily.',note:'Connect to this morning: explain how teachers welcomed children by smiling, waving, or saying hello.'},{spread:'13–24',adapt:'FINISH THE STORY',title:'What Does Lola Do at School?',say:'Let’s keep reading and find out what Lola does during her day at school.',note:'Read the remainder of the text fluently. The adapted text includes reading with Julia, superheroes, snack, block building, circle time, going home, and falling asleep.'},{spread:'💬',adapt:'AFTER READING',title:'Story Talk',say:'What are some things Lola does at school?',note:'Listen for recall of important events/details and connections children make to their own lives.'},{spread:'🎨',adapt:'CLOSING · CENTERS BRIDGE',title:'We Can Try Things Lola Did',say:'Today we read to find out what Lola does on her first day of school. We talked about our first day too! In Centers you can do some of the things that Lola did when she started school.',note:'Tell children you will read the book again tomorrow. Monday’s new Center introductions are Crayons & Markers and Exploring Playdough.'}];let i=0;const $=x=>document.getElementById(x);function draw(){const c=cards[i];$('spread').textContent=c.spread;$('adapt').textContent=c.adapt;$('eye').textContent=i<2?'BEFORE READING':i<8?'WHILE READING':'AFTER READING';$('title').textContent=c.title;$('say').textContent=c.say;$('note').innerHTML='<b>Teacher note:</b> '+c.note;$('progress').textContent=(i+1)+' of '+cards.length;$('prev').textContent=i===0?'← Community Meeting':'← Previous';$('next').textContent=i===cards.length-1?'Next: Centers →':'Next →'}$('prev').onclick=()=>{if(i===0)location.href='fo3s-u1w1-community.html';else{i--;draw()}};$('next').onclick=()=>{if(i<cards.length-1){i++;draw()}else location.href='fo3s-u1w1-centers-monday.html'};draw()})();</script></body></html>
