<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fo3s Lola Goes to School Read 1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f6f1e5;color:#174f7d}.page{height:100vh;padding:2vh 3vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:9vh;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.09em;color:#789697}.brand h1{margin:.3vh 0;color:#164f7f;font-size:clamp(28px,2.4vw,46px)}.chip{height:max-content;background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.card{height:75vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:30px;display:grid;grid-template-columns:58% 1fr;gap:2.5vw;align-items:center;padding:2.5vh}.visual{height:65vh;border-radius:24px;background:#eef4f0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.visual img{max-width:100%;max-height:59vh;object-fit:contain}.fallback{font-size:80px}.visual small{color:#789697;font-weight:900}.eye{font-weight:900;letter-spacing:.09em;color:#789697}.copy h2{font-size:clamp(30px,2.8vw,52px);margin:1vh 0;color:#164f7f}.copy p{font-size:clamp(17px,1.12vw,22px);line-height:1.4;font-weight:850;color:#527673}.note{background:#e7f0ed;border-radius:16px;padding:1vh;color:#416d61;font-weight:850;line-height:1.35}.bottom{height:10vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900}.bottom .next{background:#668f99;color:#fff}.progress{font-weight:900;color:#789697}</style></head><body><main class="page"><header><div class="brand">EARLY EAGLE ACADEMY · READ ALOUD · FOCUS ON PRE-K 3s<h1>Lola Goes to School · Read 1</h1></div><div class="chip">U1 · W1 · MOND ==4?'Page 10: ask what Lola does to get ready for school and invite a thumbs-up connection.':n===5?'Page 11: briefly define welcome and connect it to how children were welcomed at school.':'Read the full published text fluently through this part of the story.',note:n===1||n===4||n===5?'This is an official Fo3s teaching stop. The adapted slide is support while the teacher reads the published text.':'No added stop here; continue fluently.'})),{icon:'💬',label:'AFTER READING',title:'Story Talk',say:'What are some things Lola does at school?',note:'Listen for children recalling important events/details and making connections.'},{icon:'🎨',label:'CLOSING',title:'Connect to Centers',say:'Talk about how children can do some of the things Lola did when she started school. Tell them you will read the book again tomorrow.',note:'Monday Center introductions are Crayons & Markers and Exploring Playdough.'}];let i=0,$=x=>document.getElementById(x);function draw(){let c=cards[i],img=$('book'),fb=$('fallback');if(c.img){img.src=c.img;img.style.display='block';fb.style.display='none'}else{img.style.display='none';fb.style.display='block';fb.textContent=c.icon||'📖'}$('adapt').textContent=c.label;$('eye').textContent=i<2?'BEFORE READING':i<14?'WHILE READING':'AFTER READING';$('title').textContent=c.title;$('say').textContent=c.say;$('note').innerHTML='<b>Teacher note:</b> '+c.note;$('progress').textContent=(i+1)+' of '+cards.length;$('prev').textContent=i===0?'← Community Meeting':'← Previous';$('next').textContent=i===cards.length-1?'Next: Centers →':'Next →'}$('book').onerror=()=>{$('book').style.display='none';$('fallback').style.display='block';$('fallback').textContent='📖';$('adapt').textContent+=' · IMAGE UNAVAILABLE'};$('prev').onclick=()=>{if(i===0)location.href='fo3s-u1w1-community.html';else{i--;draw()}};$('next').onclick=()=>{if(i<cards.length-1){i++;draw()}else location.href='fo3s-u1w1-centers-monday.html'};draw()})();</script></body></html>
