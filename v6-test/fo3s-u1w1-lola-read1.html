<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fo3s Lola Goes to School Read 1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f6f1e5;color:#174f7d}.page{height:100vh;padding:2vh 3vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:9vh;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.09em;color:#789697}.brand h1{margin:.3vh 0;color:#164f7f;font-size:clamp(28px,2.4vw,46px)}.chip{height:max-content;background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.card{height:75vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:30px;display:grid;grid-template-columns:58% 1fr;gap:2.5vw;align-items:center;padding:2.5vh 2.5vw}.visual{height:65vh;border-radius:24px;background:#eef4f0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.visual img{max-width:100%;max-height:61vh;object-fit:contain;display:block}.fallback{font-size:80px;font-weight:900;color:#668f99}.visual small{color:#789697;font-weight:900;margin-top:.5vh}.eye{font-weight:900;letter-spacing:.09em;color:#789697}.copy h2{font-size:clamp(30px,2.8vw,52px);line-height:1.05;margin:1vh 0;color:#164f7f}.copy p{font-size:clamp(17px,1.12vw,22px);line-height:1.4;font-weight:850;color:#527673}.note{background:#e7f0ed;border-radius:16px;padding:1vh 1vw;color:#416d61;font-weight:850;line-height:1.35;font-size:clamp(14px,.9vw,18px)}.bottom{height:10vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900;cursor:pointer}.bottom .next{background:#668f99;color:#fff}.progress{font-weight:900;color:#789697}</style></head><body><main class="page"><header><div class="brand">EARLY EAGLE ACADEMY · READ ALOUD · FOCUS ON PRE-K 3s<h1>Lola Goes to School · Read 1</h1></div><div class="chip">U1 · W1 · MONDAY</div></header><section class="card"><div class="visual" id="visual"><div class="fallback" id="fallback">📚</div><img id="book" alt="Lola Goes to School adapted text spread"><small id="adapt"></small></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><p id="say"></p><div class="note" id="note"></div></div></section><div class="bottom"><button id="prev">← Community Meeting</button><div class="progress" id="progress"></div><button class="next" id="next">Next →</button></div></main><script>(()=>{const deck='1MPB1wroyaarSI_25DWGlh7ps36VxhQu_NvF5Hj-C9iQ',u=id=>`https://docs.google.com/presentation/d/${deck}/export/png?id=${deck}&pageid=${id}`;const spreads={p12:u('g242eccaf842_0_5'),p34:u('g242eccaf842_0_8'),p56:u('g242eccaf842_0_11'),p78:u('g242eccaf842_0_14'),p910:u('g242eccaf842_0_17'),p1112:u('g24302d3bdde_0_18'),p1314:u('g242eccaf842_0_20'),p1516:u('g242eccaf842_0_23'),p1718:u('g242eccaf842_0_26'),p1920:u('g242eccaf842_0_29'),p2122:u('g242eccaf842_0_32'),p2324:u('g24302d3bdde_0_5')};const cards=[{icon:'📚',label:'BEFORE READING',title:'Welcome to Read Aloud',say:'This is our first unit. It is called Family and Friends. Every day we will have a Read Aloud time, where we read a book together and talk about it.',note:'Launch the Read Aloud routine. Children sit together. Emphasize listening with ears and looking with eyes. Model raising a hand as one way to show you have an idea or question.'},{icon:'📖',label:'BOOK INTRODUCTION',title:'Meet the Book',say:'The title of today’s book is Lola Goes to School. The title is the name of a book. Anna McQuinn is the author; she wrote the words. Rosalind Beardshaw is the illustrator; she created the pictures.',note:'Make the connection: children have ideas about starting school. Invite them to read and find out what Lola does when she goes to school.'},{img:spreads.p12,label:'ADAPTED TEXT · PAGES 1–2',title:'Lola Is Starting School',say:'Lola is starting school tomorrow.',note:'Read fluently.'},{img:spreads.p34,label:'CURRICULUM STOP · PAGE 3',title:'Quick Word: visit',say:'To visit is to go somewhere and see a person or a place. Lola and her family visited her new school before she started.',note:'Pause briefly for the required Fo3s vocabulary support, then continue.'},{img:spreads.p56,label:'ADAPTED TEXT · PAGES 5–6',title:'Getting Ready',say:'Lola picks out her clothes for school.',note:'Continue reading fluently.'},{img:spreads.p78,label:'ADAPTED TEXT · PAGES 7–8',title:'Getting Ready',say:'Lola gets all her things ready for school.',note:'Continue reading fluently.'},{img:spreads.p910,label:'CURRICULUM STOP · PAGE 10',title:'Getting Ready for School',say:'What are some things Lola does to get ready for school? Show me thumbs up if you did any of those things today!',note:'Model thinking aloud and putting a thumb up—for example, Lola packed her bag and you packed yours.'},{img:spreads.p1112,label:'CURRICULUM STOP · PAGE 11',title:'Quick Word: welcome',say:'Ms. Suzan welcomes everyone. That means she greeted them happily.',note:'Connect to this morning: explain how teachers welcomed children by smiling, waving, or saying hello.'},{img:spreads.p1314,label:'ADAPTED TEXT · PAGES 13–14',title:'Reading with Julia',say:'Lola chooses to read with Julia.',note:'Continue reading fluently.'},{img:spreads.p1516,label:'ADAPTED TEXT · PAGES 15–16',title:'Playing Together',say:'Lola and Julia play superheroes next.',note:'Continue reading fluently.'},{img:spreads.p1718,label:'ADAPTED TEXT · PAGES 17–18',title:'Snack Time',say:'Lola and her classmates sit to have snack.',note:'Continue reading fluently.'},{img:spreads.p1920,label:'ADAPTED TEXT · PAGES 19–20',title:'Building Together',say:'Lola and her friends build a block castle.',note:'Continue reading fluently.'},{img:spreads.p2122,label:'ADAPTED TEXT · PAGES 21–22',title:'Circle Time and Home',say:'Lola sings songs at circle time. Then, it is time to go home.',note:'Continue reading fluently.'},{img:spreads.p2324,label:'ADAPTED TEXT · PAGES 23–24',title:'A Great Day',say:'Lola had a great day at school. She is very tired and quickly falls asleep.',note:'Finish the adapted text.'},{icon:'💬',label:'AFTER READING',title:'Story Talk',say:'What are some things Lola does at school?',note:'Listen for recall of important events/details and connections children make to their own lives.'},{icon:'🎨',label:'CLOSING · CENTERS BRIDGE',title:'We Can Try Things Lola Did',say:'Today we read to find out what Lola does on her first day of school. We talked about our first day too! In Centers you can do some of the things that Lola did when she started school.',note:'Tell children you will read the book again tomorrow. Monday’s new Center introductions are Crayons & Markers and Exploring Playdough.'}];let i=0;const $=x=>document.getElementById(x);function draw(){const c=cards[i],img=$('book'),fb=$('fallback');if(c.img){img.src=c.img;img.style.display='block';fb.style.display='none'}else{img.removeAttribute('src');img.style.display='none';fb.style.display='block';fb.textContent=c.icon||'📖'}$('adapt').textContent=c.label;$('eye').textContent=i<2?'BEFORE READING':i<14?'WHILE READING':'AFTER READING';$('title').textContent=c.title;$('say').textContent=c.say;$('note').innerHTML='<b>Teacher note:</b> '+c.note;$('progress').textContent=(i+1)+' of '+cards.length;$('prev').textContent=i===0?'← Community Meeting':'← Previous';$('next').textContent=i===cards.length-1?'Next: Centers →':'Next →'}$('book').onerror=()=>{$('book').style.display='none';$('fallback').style.display='block';$('fallback').textContent='📖'};$('prev').onclick=()=>{if(i===0)location.href='fo3s-u1w1-community.html';else{i--;draw()}};$('next').onclick=()=>{if(i<cards.length-1){i++;draw()}else location.href='fo3s-u1w1-centers-monday.html'};draw()})();</script></body></html>
