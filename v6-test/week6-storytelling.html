<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Storytelling</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:linear-gradient(#faf7ec,#eef4ef);color:#174f76}.page{padding:22px}.card{max-width:1050px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}.card h1{color:#165487;font-size:38px}.card h2{color:#416d61;font-size:25px}.story{font-size:20px;line-height:1.62;color:#455f66;font-weight:700}.prompt{background:#e7f0ed;border-radius:18px;padding:16px;margin:18px 0;font-weight:900;color:#416d61}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1 id="title"></h1><h2>Close your eyes if you’d like, and make the pictures in your mind.</h2><div class="story" id="story"></div><div class="prompt" id="prompt"></div><button class="back" onclick="location.href='week6-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'The Long Way to the Corner Store',story:`<p>Mina and Grandpa were going to the corner store. Mina knew the fastest way: out the door, down the sidewalk, past the blue mailbox, and straight to the store.</p><p>But Grandpa turned the other way.</p><p>“Grandpa,” Mina said, “the store is that way.” Grandpa smiled and pointed ahead.</p><p>So Mina followed. First they passed a tiny garden squeezed between two buildings. Mina imagined the bright red tomatoes hanging like little lanterns. A neighbor waved. Grandpa waved back.</p><p>Next they passed a bakery. Mina imagined warm air drifting through the open door. She could almost smell sweet bread. Grandpa said hello to the baker, and the baker smiled.</p><p>Then they reached a small park. Leaves rustled above them. A dog trotted by. Two children chalked giant yellow suns on the sidewalk. Grandpa stopped to look.</p><p>“We are taking forever,” Mina sighed.</p><p>Grandpa gently squeezed her hand. Then he pointed around them: to the garden, the baker, the park, the neighbors, the children, and the dog.</p><p>Mina looked again. The walk did feel long—but it also felt full. Full of colors. Full of sounds. Full of people who knew one another.</p><p>When they finally reached the store, Mina chose an apple. On the walk home, Grandpa asked, “Fast way or long way?”</p><p>Mina thought about the tomatoes, the warm bread smell, and the chalk suns.</p><p>“The long way,” she said. “But this time, I want to be the one who notices everything.”</p>`,prompt:'Visualization question: What did you picture on Mina’s long walk? What would you want to notice in your own neighborhood?'},Tuesday:{title:'The Yellow Button',story:`<p>On the art table sat a tray of Beautiful Stuff: smooth bottle caps, twisty string, small cardboard tubes, shiny paper, soft fabric, and one bright yellow button.</p><p>Jalen picked up the yellow button first. He rolled it between his fingers and imagined it as the sun.</p><p>He placed it in the middle of his tray. Around it he arranged blue fabric for sky and little pieces of green paper for grass.</p><p>Then Ava looked over. “That looks like a flower,” she said.</p><p>Jalen looked again. He imagined yellow petals growing around the button. For a moment, he wanted to change everything.</p><p>Then Mateo walked by. “It could be a wheel,” he said.</p><p>Now Jalen imagined a tiny red car with the yellow button rolling down a road.</p><p>Jalen laughed. “How can one button be so many things?”</p><p>He moved the pieces around. The sun became a flower. The flower became a wheel. The wheel became the round window on a pretend submarine.</p><p>At last Jalen stopped rearranging. He put the yellow button near the top of his tray, added a long strip of silver paper underneath it, and curled blue string around the bottom.</p><p>“What is it?” Ava asked.</p><p>Jalen smiled. “It’s something I imagined. The yellow part is a moon, the silver part is moonlight, and the blue string is a river at night.”</p><p>Ava looked closely. “I can see it,” she said.</p><p>Jalen realized something: the button had not told him what to make. His ideas had changed as he looked, listened, and tried again. And now his idea was something another person could see too.</p>`,prompt:'Visualization question: What did the yellow button become in your mind? If you had one small object, what could you imagine it becoming?'},Wednesday:{title:'The Wind That Changed the Walk',story:`<p>When Sofia stepped outside with her class, the morning felt quiet. The trees stood tall. The sidewalk was dry. A few leaves rested near the fence.</p><p>Then—whoooosh.</p><p>A breeze slipped around the corner of the school.</p><p>Sofia imagined it tickling the tops of the trees first. The branches began to sway. A leaf lifted from the ground and spun once, twice, three times before skittering across the sidewalk.</p><p>“Look!” Sofia said.</p><p>The class kept walking. Another gust came. This one pushed Sofia’s hair across her cheek and puffed up the hood on her jacket.</p><p>At the garden, tall flowers nodded back and forth. A paper scrap raced along the fence. High above, clouds moved slowly across the sky.</p><p>Sofia had walked this same path many times, but today the wind made everything look different.</p><p>She wondered what the squirrel in the tree felt. Maybe its fur ruffled. She wondered about the birds. Maybe they tucked themselves closer to a branch. She wondered about the tiny insects hiding under leaves.</p><p>Then the wind became quiet again.</p><p>The class stopped. Without the whoosh, Sofia could hear a bird chirping and the soft scrape of shoes on the sidewalk.</p><p>“The weather changed our walk,” Sofia said.</p><p>Her teacher nodded. “And you noticed.”</p><p>On the way inside, Sofia saw one last leaf tumble past the door. She pictured the breeze carrying it somewhere new, and she wondered what the schoolyard would look like tomorrow.</p>`,prompt:'Visualization question: What did you picture moving in the wind? How can weather make a familiar place look or feel different?'},Thursday:{title:'The Little Weather Reporter',story:`<p>Every morning, Theo wanted to know one thing: What is the weather doing today?</p><p>He used to look out the window for one second and announce, “It’s nice!” But one morning his teacher gave him a small notebook.</p><p>“A weather reporter looks carefully,” she said.</p><p>Theo pressed his face near the window. First he looked at the sky. He imagined the clouds like soft gray blankets stretched above the playground.</p><p>Then he looked at the trees. Their branches barely moved.</p><p>Then he looked at the ground. Tiny dark dots appeared on the sidewalk.</p><p>“Wait,” Theo whispered. “Rain!”</p><p>He watched longer. The dots became more dots, but there were no giant splashes. It was only a light drizzle.</p><p>Theo drew a cloud in his notebook and added little lines underneath. Then he thought about clothing.</p><p>“Would flip-flops keep my feet dry?” he wondered. He pictured his toes getting wet and laughed.</p><p>He drew boots and a raincoat instead.</p><p>At recess time, the drizzle had stopped. The sidewalk still shone, and the air felt cool. Theo noticed that some children zipped their jackets. A bird hopped near a puddle.</p><p>That afternoon, Theo looked at his morning drawing. “The weather didn’t stay exactly the same,” he said.</p><p>He added one more picture: a small patch of blue sky peeking between the clouds.</p><p>The next morning, Theo did not announce, “It’s nice.” He opened his notebook, looked carefully, and said, “I need a minute. Weather reporters notice the evidence first.”</p>`,prompt:'Visualization question: What weather clues did Theo notice? What clues could you look for outside today?'},Friday:{title:'The Story Between Two Friends',story:`<p>Nora had a story in her head, but it felt too small to tell.</p><p>Her teacher said, “Turn and talk to your partner. Tell one true thing that happened to you.”</p><p>Nora turned toward Eli. Their knees pointed toward each other, and they used quiet voices.</p><p>“You can go first,” Eli said.</p><p>Nora thought. “Yesterday I found a red leaf.”</p><p>That was all.</p><p>Eli waited. Then he asked, “Where did you find it?”</p><p>Nora pictured the moment again. “By my steps.”</p><p>“What did it look like?”</p><p>Now Nora could see it clearly in her mind: a red leaf with a tiny yellow edge, resting on the wet sidewalk.</p><p>“It looked like it had been painted,” Nora said.</p><p>“What did you do with it?”</p><p>Nora smiled. “I carried it inside. My little brother wanted it, so I gave it to him. He put it on his pillow.”</p><p>Eli grinned. “That’s a whole story!”</p><p>Then it was Eli’s turn. He told about helping his grandfather carry groceries. Nora listened and asked a question too.</p><p>When the class came back together, Nora realized her story had not been too small. She had simply needed someone to listen while she found the details.</p><p>On the way home, she looked for another leaf. Not because she needed a bigger story—but because now she knew little moments could hold stories too.</p>`,prompt:'Visualization question: What little moment from your own life could become a story? What details would help someone else picture it?'}}[day];tag.textContent='WEEK 6 · '+day.toUpperCase()+' · 3–5 MINUTE STORY';title.textContent=d.title;story.innerHTML=d.story;prompt.textContent=d.prompt;</script></body></html>
