k;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7);box-shadow:inset 0 0 0 1px rgba(90,135,145,.15)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-fallback{font-size:clamp(100px,10vw,180px)}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-gesture{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.vocab-gesture:empty{display:none}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="bookImg" alt="Adapted book page"></div><div class="side" id="side"><h2 id="sideTitle">Pause Here</h2><div class="stop" id="stop"></div></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit Visual</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-gesture" id="vocabGesture"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',runner=p.get('eeaRunner')==='1',$=id=>document.getElementById(id);const d={title:'Allie All Along',sub:'Read 1 of 3 · Picture walk and feelings',notes:'Focus on 3s Week 3 Read 1. This is a picture walk: show illustrations but do not read the story text. Important curriculum note: do not refer to Allie as a monster. The monster-like imagery is a metaphor for big feelings. Show pages 29–30 before the picture walk so children see Allie as herself.',before:'Today we have a new book, Allie All Along, written and illustrated by Sarah Lynne Reul. Today we will take a picture walk—look at the illustrations and talk about what is happening. This story is about Allie and her brother. Show pages 29–30 first. Notice the crayons; perhaps they like to draw together. Allie feels angry in this story. All feelings, including happy, sad, and angry, are okay. Invite children to show happy and sad faces/bodies.',stops:[{label:'PAGES 1–6',copy:'Show the pictures without reading the text. Allie’s crayon breaks and she feels really angry, or really mad. Notice the illustrator uses red, red eyes, slanted eyebrows, fists, and kicking feet. Invite children to show an angry face; 1–2 children may look in a mirror.'},{label:'PAGES 11–14',copy:'Allie’s brother is trying strategies to help. She is still very angry, but perhaps a little less angry. Notice that the illustrator changes Allie’s color to yellow.'},{label:'PAGES 17–22',copy:'Her brother tries another strategy to support Allie in feeling more calm, or relaxed. She is still angry, but less angry. Notice that the illustrator changes her color to green.'},{label:'PAGES 23–26',copy:'What color is Allie now? I wonder how she is feeling. Look at her color, face, and body.'},{label:'PAGES 29–30',copy:'Perhaps Allie is feeling more calm now.'},{label:'AFTER READING',copy:'Allie felt angry when her crayon broke. What makes you feel angry? What makes you feel calm? It is okay to feel angry and it is okay to feel calm. We all feel these ways sometimes. Close by reminding children that they did a picture walk and that they might create a feelings painting in Art Studio.'}]};$('bookTitle').textContent=d.title;$('subTitle').textContent=d.sub;$('chip').textContent='FOCUS ON 3s · WEEK 3 · MONDAY';$('notesTitle').textContent=d.title;$('notesCopy').textContent=d.notes;let step=-1;function render(){const before=step<0,item=before?null:d.stops[step];$('bookImg').src='assets/reading.webp';$('count').textContent=before?'Before Reading':'Teaching Stop '+(step+1)+' of '+d.stops.length;$('fill').style.width=(before?8:((step+1)/d.stops.length*100))+'%';$('side').classList.add('show');$('side').style.display='block';$('sideTitle').textContent=before?'Before We Read':item.label;$('stop').innerHTML='<b>'+(before?'PICTURE WALK':item.label)+'</b>'+(before?d.before:item.copy);$('prev').disabled=before;$('next').textContent=step===d.stops.length-1?'Finish Read Aloud ✓':'Next →'}$('prev').onclick=()=>{if(step>=0){step--;render()}};$('next').onclick=()=>{if(step<d.stops.length-1){step++;render()}else if(!runner)location.href='daily-lessons.html?week=3&day=0'};$('backBtn').onclick=()=>location.href='daily-lessons.html?week=3&day=0';$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');render()})();</script></body></html>
