<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 3 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:12px}h1{margin:.2vh 0;color:#164f7f;font-size:32px;line-height:1}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book.hidden{display:none}.book img{display:block;width:100%;height:100%;object-fit:contain}.side{display:none;position:absolute;right:2vw;bottom:2vh;width:min(520px,42vw);z-index:5;background:rgba(255,253,248,.96);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18)}.side.show{display:block}.side h2{font-size:18px;margin:0 0 .6vh;color:#9a6c13}.stop{color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stop b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7);box-shadow:inset 0 0 0 1px rgba(90,135,145,.15)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-fallback{font-size:clamp(100px,10vw,180px)}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-gesture{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.vocab-gesture:empty{display:none}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="bookImg" alt="Adapted book page"></div><div class="side" id="side"><h2 id="sideTitle">Pause Here</h2><div class="stop" id="stop"></div></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit Visual</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-gesture" id="vocabGesture"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',runner=p.get('eeaRunner')==='1',$=id=>document.getElementById(id);const reads={Monday:{sub:'Read 1 of 3 · Picture walk and feelings',notes:'Read 1 is a picture walk. Do not refer to Allie as a monster; the imagery represents big feelings.',before:'Introduce Allie All Along, written and illustrated by Sarah Lynne Reul. Explain that today is a picture walk. Show pages 29–30 first so children meet Allie and her brother. Talk about happy, sad, and angry feelings and invite children to show those feelings with face/body.',stops:[['PAGES 1–6','Show illustrations but do not read the text. Allie’s crayon breaks and she feels really angry. Notice red color, red eyes, slanted eyebrows, fists, and kicking feet. Invite an angry face; 1–2 children may use a mirror.'],['PAGES 11–14','Her brother tries strategies to help. She is still very angry, but a little less; the illustrator changes her color to yellow.'],['PAGES 17–22','Her brother tries another strategy. Allie is becoming more calm, or relaxed; the illustrator changes her color to green.'],['PAGES 23–26','What color is Allie now? How might she be feeling? Look at color, face, and body.'],['PAGES 29–30','Perhaps Allie is feeling more calm now.'],['AFTER READING','What makes you feel angry? What makes you feel calm? It is okay to feel angry and calm. Remind children they may create a feelings painting in Art Studio.']]},Tuesday:{sub:'Read 2 of 3 · Read for understanding',notes:'Read the story text. Use illustrations to understand events and make predictions. Keep the curriculum framing of Allie’s changing colors as layers of big feelings.',before:'Yesterday we met Allie and her brother and did a picture walk. Today we will read the story.',stops:[['PAGES 1–2','Allie is feeling several angry feelings at once, including frustration. Frustrated means feeling very upset when you cannot solve a problem or cannot do something.'],['PAGES 5–6','Sometimes when we feel angry, our bodies might feel like doing this. Invite children to show stomping or what a fuss may look like.'],['PAGES 9–10','What is happening in this illustration? It looks like Allie is unzipping the red, angry, ferocious layer and taking it off. Gesture unzipping a jacket. What is left is the yellow feeling.'],['PAGES 13–14','How might this blue bunny help Allie’s big feeling of anger? Pretend to squeeze a favorite toy.'],['PAGES 15–16','Who remembers what happens next? Allie takes off another layer. Pretend to unzip a jacket. What is left is the green feeling.'],['PAGES 21–22','Take a deep breath together and pretend to blow out candles.'],['PAGES 27–28','Count backwards together. Who remembers what happens next?'],['AFTER READING','How is Allie feeling at the end of the story? How do you know? We will read the story one more time tomorrow.']]}};const d=reads[day]||reads.Monday;$('bookTitle').textContent='Allie All Along';$('subTitle').textContent=d.sub;$('chip').textContent='FOCUS ON 3s · WEEK 3 · '+day.toUpperCase();$('notesTitle').textContent='Allie All Along';$('notesCopy').textContent=d.notes;let step=-1;function render(){const before=step<0,item=before?null:d.stops[step];$('bookImg').src='assets/reading.webp';$('count').textContent=before?'Before Reading':'Teaching Stop '+(step+1)+' of '+d.stops.length;$('fill').style.width=(before?8:((step+1)/d.stops.length*100))+'%';$('side').classList.add('show');$('side').style.display='block';$('sideTitle').textContent=before?'Before We Read':item[0];$('stop').innerHTML='<b>'+(before?'OPENING':item[0])+'</b>'+(before?d.before:item[1]);$('prev').disabled=before;$('next').textContent=step===d.stops.length-1?'Finish Read Aloud ✓':'Next →'}$('prev').onclick=()=>{if(step>=0){step--;render()}};$('next').onclick=()=>{if(step<d.stops.length-1){step++;render()}else if(!runner)location.href='daily-lessons.html?week=3&day='+(day==='Tuesday'?1:0)};$('backBtn').onclick=()=>location.href='daily-lessons.html?week=3&day='+(day==='Tuesday'?1:0);$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');render()})();</script></body></html>
