<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 3 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:12px}h1{margin:.2vh 0 0;color:#164f7f;font-size:32px;line-height:1}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;display:grid;grid-template-columns:minmax(0,1fr) 32%;gap:2vw;align-items:center;padding:2vh 2vw;box-shadow:0 14px 36px rgba(54,79,77,.07)}.book{height:74vh;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book img{display:block;max-width:100%;max-height:100%;object-fit:contain}.side{min-height:45vh;display:flex;flex-direction:column;justify-content:center}.side h2{font-size:31px;margin:0 0 1vh;color:#164f7f}.focus{font-size:17px;line-height:1.4;font-weight:800;color:#527673}.stop{margin-top:2vh;background:#fff0c9;border:2px solid #e4c56d;border-radius:20px;padding:2vh 1.4vw;color:#71591f;font-size:18px;font-weight:900;line-height:1.38}.stop:empty{display:none}.stop b{display:block;color:#9a6c13;font-size:12px;letter-spacing:.08em;margin-bottom:.7vh}.nostop{margin-top:2vh;background:#e7f0ed;border-radius:18px;padding:1.5vh 1.2vw;color:#53766d;font-weight:900}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book"><img id="bookImg" alt="Adapted book page"></div><div class="side"><h2>Today’s Read</h2><div class="focus" id="focus"></div><div class="stop" id="stop"></div><div class="nostop" id="clean">No curriculum stop on this spread. Keep reading.</div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday';const data={Monday:{title:'Sometimes I’m Bombaloo',sub:'Read 1 of 3 · What’s the story about?',prefix:'bombaloo-',pages:16,focus:'Read the full text fluently. Pause only when a curriculum teaching stop appears here.',notes:'After reading, discuss what happens at the end and what helps Katie feel better.',stops:{6:'BOOK PAGE 8 • What are some things Katie can do? Thumbs up if you can do something like that too!',7:'BOOK PAGE 9 • WHINE — When someone whines, they complain a lot. Give a quick example of whining.',8:'BOOK PAGE 12 • FIERCE — Fierce means strong and scary.',9:'BOOK PAGE 13 • SCRUNCH — Show me how you scrunch your face!',11:'BOOK PAGE 18 • What is one thing that happens when Katie is Bombaloo? Who might be yelling?',14:'BOOK PAGE 24 • Controlling yourself means handling your own feelings without hurting other people’s feelings or bodies.'}},Tuesday:{title:'Sometimes I’m Bombaloo',sub:'Read 2 of 3 · Reading the pictures',prefix:'bombaloo-',pages:16,focus:'Reread fluently and use only the curriculum-designated illustration stops.',notes:'After reading, revisit the illustrations and discuss what Bombaloo is like and what helps children calm down.',stops:{7:'BOOK PAGE 10 • Katie is patiently building a castle. Her baby brother is smiling, but Katie is not. How does Katie feel? Why do you think so?',10:'BOOK PAGE 16 • Turn back through pages 14–15 and notice how Katie’s temper flares. Do you think she is really turning into a fierce monster? How do you know?',12:'BOOK PAGES 19–20 • The illustration is darker than the other pages. Why do you think the illustrator made that choice? How might it feel to take time by yourself to think about a problem?',14:'BOOK PAGE 24 • What do you notice about Katie’s face here? What happened that made her smile?'}},Wednesday:{title:'Sometimes I’m Bombaloo',sub:'Read 3 of 3 · Character and connections',prefix:'bombaloo-',pages:16,focus:'Pay attention to the words and illustrations to get to know Katie more deeply.',notes:'After reading, compare Bombaloo and Katie Honors and discuss how Katie changes from very upset to calm.',stops:{3:'BOOK PAGE 2 • What do you think it means that Katie is a “really good kid”? What is the author trying to tell us about Katie?',14:'BOOK PAGE 24 • What’s happening? Reread the page. How might Katie feel now? Do you think it is okay to say you hate something? Why or why not?',16:'BOOK PAGE 27 • Why might being Bombaloo be scary for Katie?'}},Thursday:{title:'The Rabbit Listened',sub:'Read 1 of 3 · What’s the story about?',prefix:'rabbit-',pages:19,focus:'Read the full text fluently. Pause only at the curriculum-designated stops.',notes:'After reading, compare what the rabbit does with what the other animals do and discuss why listening matters to Taylor.',stops:{6:'BOOK PAGE 8 • Taylor felt proud of their creation. What happens to Taylor’s creation?',8:'BOOK PAGE 12 • What is the chicken’s suggestion for Taylor?',11:'BOOK PAGE 18 • Could the bear’s or elephant’s suggestion work for you if you had a similar experience? Which suggestion do you like better?',13:'BOOK PAGE 22 • What are some other suggestions you might give to help Taylor?'}},Friday:{title:'The Rabbit Listened',sub:'Read 2 of 3 · Reading the pictures',prefix:'rabbit-',pages:19,focus:'Reread fluently and focus on Taylor’s facial expressions and changing emotions.',notes:'After reading, slowly revisit the illustrations and invite children to choose a favorite page.',stops:{5:'BOOK PAGE 6 • Look at the illustration. How does Taylor feel? Why do you think so?',10:'BOOK PAGE 16 • Look at Taylor’s expressions when the bear is shouting. How do you think Taylor feels?',13:'BOOK PAGE 22 • Taylor doesn’t feel like doing anything with anybody. How does Taylor feel about being alone?',14:'BOOK PAGES 23–30 • Taylor’s emotions change a lot while talking to the rabbit. Look again from page 21 through page 30. What are some feelings Taylor is having?'}}};const d=data[day]||data.Monday;let page=1;const $=id=>document.getElementById(id);bookTitle.textContent=d.title;subTitle.textContent=d.sub;chip.textContent='WEEK 3 · '+day.toUpperCase();focus.textContent=d.focus;notesTitle.textContent=d.title;notesCopy.textContent=d.notes;function show(){bookImg.src='assets/'+d.prefix+String(page).padStart(2,'0')+'.jpg?v=6';count.textContent='Slide '+page+' of '+d.pages;fill.style.width=(page/d.pages*100)+'%';prev.disabled=page===1;next.textContent=page===d.pages?'Finish Read Aloud ✓':'Next →';const s=d.stops[page]||'';stop.innerHTML=s?'<b>CURRICULUM TEACHING STOP — PAUSE HERE</b>'+s:'';clean.style.display=s?'none':'block'}prev.onclick=()=>{if(page>1){page--;show()}};next.onclick=()=>{if(page<d.pages){page++;show()}else location.href='week3-plan.html'};backBtn.onclick=()=>location.href='week3-plan.html';notesBtn.onclick=()=>notesPanel.classList.toggle('open');closeNotes.onclick=()=>notesPanel.classList.remove('open');show()})();</script></body></html>
