<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 3 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.2vh;display:grid;grid-template-columns:1fr auto;align-items:center;gap:1.2vw}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(9px,.68vw,13px)}h1{margin:.2vh 0 0;color:#164f7f;font-size:clamp(23px,1.8vw,36px);line-height:1}.sub{margin:.25vh 0 0;color:#557876;font-size:clamp(12px,.84vw,17px);font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:rgba(255,253,247,.94);color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.48vh .72vw;border-radius:999px;background:rgba(215,234,239,.72);font-size:clamp(10px,.68vw,13px);color:#527985;letter-spacing:.02em}.iconbtn{width:clamp(44px,2.8vw,54px);aspect-ratio:1;border-radius:50%;font-size:clamp(20px,1.35vw,26px)}.toolbtn{padding:.7vh 1vw;border-radius:14px;font-size:clamp(12px,.82vw,16px)}.stage{position:relative;height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 14px 36px rgba(54,79,77,.07)}.reader{position:absolute;inset:1.5%;display:block}.book{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.book img{display:block;width:auto!important;height:auto!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important;object-position:center;border-radius:10px;box-shadow:none;transform:none!important}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900;font-size:clamp(12px,.8vw,15px)}.track{height:6px;border-radius:999px;background:rgba(177,214,230,.5);overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2;border-radius:999px}.panel,.promptOverlay{position:absolute;z-index:8;display:none;background:rgba(255,253,247,.985);border:1.5px solid rgba(83,120,128,.18);box-shadow:0 16px 34px rgba(44,67,68,.18)}.panel.open,.promptOverlay.open{display:block}.panel{right:2vw;top:9vh;width:min(470px,33vw);max-height:74vh;overflow:auto;border-radius:22px;padding:1.7vh 1.3vw}.panel h3{color:#315f70;margin:.7vh 0}.panel p,.panel li{color:#58716f;font-weight:750;line-height:1.43;font-size:clamp(13px,.9vw,17px)}.label{color:#789697;font-weight:900;font-size:11px;letter-spacing:.08em}.promptOverlay{left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,72vw);border-radius:28px;padding:4vh 4vw;text-align:center}.promptOverlay h2{color:#174f7d;font-size:clamp(34px,3vw,58px);margin:1vh 0}.promptOverlay p{color:#416d61;font-size:clamp(23px,1.7vw,34px);font-weight:900;line-height:1.35}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="promptBtn">Teaching Stops</button><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn" aria-label="Back to Week 3 Plan">×</button></div></header><section class="stage"><div class="reader"><div class="book" id="book"><img id="bookImg" alt="Book page"></div></div><aside class="panel" id="notesPanel"><button class="close" data-close="notesPanel">×</button><div class="label">TEACHER NOTES</div><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><aside class="panel" id="stopsPanel"><button class="close" data-close="stopsPanel">×</button><div class="label">CURRICULUM TEACHING STOPS</div><h3>Pause only at these designated moments</h3><div id="stopsList"></div></aside><div class="promptOverlay" id="promptOverlay"><button class="close" data-close="promptOverlay">×</button><div class="label" id="promptLabel"></div><h2 id="promptTitle"></h2><p id="promptCopy"></p></div></section><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const p=new URLSearchParams(location.search);const day=p.get('day')||'Monday';const data={Monday:{title:'Sometimes I’m Bombaloo',sub:'Read 1 of 3 · What’s the story about?',prefix:'bombaloo-',pages:16,notes:'Read the full text fluently, pausing briefly only at the curriculum-designated stops. After reading, discuss what happens at the end and what helps Katie feel better.',stops:[['Page 8','What Katie Can Do','What are some things Katie can do? Thumbs up if you can do something like that too!'],['Page 9','Whine','When someone whines, they complain a lot. Give a quick example of whining.'],['Page 12','Fierce','Fierce means strong and scary.'],['Page 13','Scrunch','Show me how you scrunch your face!'],['Page 18','When Katie Is Bombaloo','What is one thing that happens when Katie is Bombaloo? Who might be yelling?'],['Page 24','Controlling Yourself','Controlling yourself means handling your own feelings without hurting other people’s feelings or bodies.']]},Tuesday:{title:'Sometimes I’m Bombaloo',sub:'Read 2 of 3 · Reading the pictures',prefix:'bombaloo-',pages:16,notes:'Reread the text fluently and use the designated illustration stops to help children describe Katie and her changing feelings. After reading, revisit the illustrations and discuss what Bombaloo is like and what helps children calm down.',stops:[['Page 10','Katie Builds Patiently','Katie is patiently building a castle. Her baby brother is smiling, but Katie is not. How does Katie feel? Why do you think so?'],['Page 16','Is Katie Really a Monster?','Turn back through pages 14–15 and notice how Katie’s temper flares. Do you think she is really turning into a fierce monster? How do you know?'],['Pages 19–20','The Dark Illustration','The illustration is darker than the other pages. Why do you think the illustrator made that choice? How might it feel to take time by yourself to think about a problem?'],['Page 24','Katie’s Face','What do you notice about Katie’s face here? What happened that made her smile?']]},Wednesday:{title:'Sometimes I’m Bombaloo',sub:'Read 3 of 3 · Character and connections',prefix:'bombaloo-',pages:16,notes:'Pay attention to the words and illustrations to get to know Katie more deeply. After reading, compare Bombaloo and Katie Honors and discuss how Katie changes from very upset to calm.',stops:[['Page 2','A Really Good Kid','What do you think it means that Katie is a “really good kid”? What is the author trying to tell us about Katie?'],['Page 24','How Might Katie Feel?','What’s happening? Reread the page. How might Katie feel now? Do you think it is okay to say you hate something? Why or why not?'],['Page 27','Why Bombaloo Feels Scary','Why might being Bombaloo be scary for Katie?']]},Thursday:{title:'The Rabbit Listened',sub:'Read 1 of 3 · What’s the story about?',prefix:'rabbit-',pages:19,notes:'Read the full text fluently, pausing briefly only at the curriculum-designated stops. After reading, compare what the rabbit does with what the other animals do and discuss why listening matters to Taylor.',stops:[['Page 8','Taylor Feels Proud','Taylor felt proud of their creation. What happens to Taylor’s creation?'],['Page 12','The Chicken’s Suggestion','What is the chicken’s suggestion for Taylor?'],['Page 18','Bear or Elephant?','Could the bear’s or elephant’s suggestion work for you if you had a similar experience? Which suggestion do you like better?'],['Page 22','How Else Could We Help?','What are some other suggestions you might give to help Taylor?']]},Friday:{title:'The Rabbit Listened',sub:'Read 2 of 3 · Reading the pictures',prefix:'rabbit-',pages:19,notes:'Reread the text fluently and focus on Taylor’s facial expressions and changing emotions. After reading, slowly revisit the illustrations and invite children to choose a favorite page.',stops:[['Page 6','How Does Taylor Feel?','Look at the illustration. How does Taylor feel? Why do you think so?'],['Page 16','When Bear Shouts','Look at Taylor’s expressions when the bear is shouting. How do you think Taylor feels?'],['Page 22','Taylor Wants to Be Alone','Taylor doesn’t feel like doing anything with anybody. How does Taylor feel about being alone?'],['Pages 23–30','Taylor’s Feelings Change','Taylor’s emotions change a lot while talking to the rabbit. Look again from page 21 through page 30. What are some feelings Taylor is having?']]}};const d=data[day]||data.Monday;let step=0;const $=id=>document.getElementById(id);$('bookTitle').textContent=d.title;$('subTitle').textContent=d.sub;$('chip').textContent='WEEK 3 · '+day.toUpperCase();$('notesTitle').textContent=d.title;$('notesCopy').textContent=d.notes;$('stopsList').innerHTML=d.stops.map((s,i)=>`<button class="toolbtn" style="width:100%;margin:.45vh 0;text-align:left" data-i="${i}"><b>${s[0]}</b> · ${s[1]}</button>`).join('');[...$('stopsList').children].forEach(b=>b.onclick=()=>{const s=d.stops[Number(b.dataset.i)];$('promptLabel').textContent=s[0];$('promptTitle').textContent=s[1];$('promptCopy').textContent=s[2];$('stopsPanel').classList.remove('open');$('promptOverlay').classList.add('open')});function render(){const img=$('bookImg');img.src='assets/'+d.prefix+String(step+1).padStart(2,'0')+'.jpg?v=5';img.alt=d.title+' page '+(step+1);$('count').textContent=`Slide ${step+1} of ${d.pages}`;$('fill').style.width=((step+1)/d.pages*100)+'%';$('prev').disabled=step===0;$('next').textContent=step===d.pages-1?'Finish Read Aloud ✓':'Next →'}$('prev').onclick=()=>{if(step>0){step--;render()}};$('next').onclick=()=>{if(step<d.pages-1){step++;render()}else location.href='week3-plan.html'};$('backBtn').onclick=()=>location.href='week3-plan.html';$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('promptBtn').onclick=()=>$('stopsPanel').classList.toggle('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('open'));render()})();</script></body></html>
