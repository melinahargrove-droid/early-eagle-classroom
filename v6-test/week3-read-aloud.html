<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea);color:#174f7d}.page{height:100vh;padding:2vh 2.5vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:#789697}.top h1{margin:.3vh 0 0;font-size:clamp(28px,2.3vw,44px);color:#164f7f}.right{display:flex;gap:10px;align-items:center}.chip{padding:7px 13px;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.close{width:52px;height:52px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:26px;font-weight:900;cursor:pointer}.stage{height:79vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.08);display:grid;grid-template-columns:68% 1fr;overflow:hidden}.book{position:relative;background:#eef3ee;padding:1.2vh 1vw;display:flex;align-items:center;justify-content:center;min-width:0}.book img{width:100%;height:100%;object-fit:contain;border-radius:20px;background:white;display:block}.book iframe{width:100%;height:100%;border:0;border-radius:20px;background:white}.info{padding:3vh 2vw;display:flex;flex-direction:column}.small{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697;text-transform:uppercase}.info h2{font-size:clamp(28px,2.7vw,52px);line-height:1.02;margin:1vh 0;color:#164f7f}.read{font-size:clamp(17px,1.25vw,24px);font-weight:900;color:#527673}.stop{margin-top:2vh;padding:1.5vh 1.2vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(15px,1vw,20px);font-weight:900;line-height:1.35}.controls{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls button{border:1px solid #d4e0df;border-radius:14px;padding:1vh .8vw;background:#fffdf8;color:#245c78;font-weight:900;cursor:pointer}.controls .next{background:#668f99;color:white;border-color:#668f99}.pagecount{text-align:center;margin-top:8px;color:#789697;font-weight:900;font-size:12px}.bottom{height:8vh;display:flex;justify-content:center;align-items:center}.done{border:1px solid #668f99;border-radius:999px;padding:1vh 2vw;background:#668f99;color:white;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · READ ALOUD</div><h1>Read Aloud</h1></div><div class="right"><div class="chip" id="chip"></div><button class="close" id="exit">×</button></div></header><section class="stage"><div class="book" id="bookarea"></div><aside class="info"><div class="small" id="small"></div><h2 id="title"></h2><div class="read" id="read"></div><div class="stop" id="stop"></div><div class="controls"><button id="prev">← Previous Page</button><button class="next" id="next">Next Page →</button></div><div class="pagecount" id="pagecount"></div></aside></section><div class="bottom"><button class="done" id="done">Done ✓</button></div></main><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday';const d={Monday:{title:'Sometimes I’m Bombaloo',read:'Read 1 of 3',type:'images',pages:16,start:1,stop:'Read the book and pause to notice Katie’s feelings. Connect the pictures and words to children’s own experiences.'},Tuesday:{title:'Sometimes I’m Bombaloo',read:'Read 2 of 3',type:'images',pages:16,start:1,stop:'Reread the book pages. Pause for children to name feelings and notice what Katie does when her feelings become very big.'},Wednesday:{title:'Sometimes I’m Bombaloo',read:'Read 3 of 3',type:'images',pages:16,start:1,stop:'Use the words and illustrations to describe Katie and how her feelings change across the story.'},Thursday:{title:'The Rabbit Listened',read:'Read 1 of 2',type:'pdf',url:'https://www.camplanoche.com/wp-content/uploads/2020/09/The-Rabbit-Listened.pdf',pages:29,start:1,stop:'Notice what happens to Taylor and how each animal tries to help. Pay special attention to what the rabbit does differently.'},Friday:{title:'The Rabbit Listened',read:'Read 2 of 2',type:'pdf',url:'https://www.camplanoche.com/wp-content/uploads/2020/09/The-Rabbit-Listened.pdf',pages:29,start:1,stop:'Reread the actual book pages and focus on Taylor’s changing feelings and why listening helps.'}}[day]||null;let page=d.start;chip.textContent='WEEK 3 · '+day.toUpperCase();small.textContent=day+' · WEEK 3';title.textContent=d.title;read.textContent=d.read;stop.textContent=d.stop;function show(){if(d.type==='images'){const n=String(page).padStart(2,'0');bookarea.innerHTML='<img src="assets/bombaloo-'+n+'.jpg" alt="Sometimes I’m Bombaloo book page '+page+'">';pagecount.textContent='Book page '+page+' of '+d.pages}else{bookarea.innerHTML='<iframe id="pdfbook" title="Book pages"></iframe>';document.getElementById('pdfbook').src=d.url+'#page='+page+'&view=FitH&toolbar=0&navpanes=0';pagecount.textContent='Book page '+page+' of '+d.pages}prev.disabled=page<=1;next.disabled=page>=d.pages}prev.onclick=()=>{if(page>1){page--;show()}};next.onclick=()=>{if(page<d.pages){page++;show()}};exit.onclick=done.onclick=()=>location.href='week3-plan.html';show()})();</script></body></html>
