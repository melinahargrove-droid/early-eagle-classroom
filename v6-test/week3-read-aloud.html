<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea);color:#174f7d}.page{height:100vh;padding:1.5vh 1.6vw}.top{height:8vh;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:#789697}.top h1{margin:.2vh 0 0;font-size:clamp(25px,2vw,38px);color:#164f7f}.right{display:flex;gap:10px;align-items:center}.chip{padding:7px 13px;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.close{width:50px;height:50px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:26px;font-weight:900;cursor:pointer}.stage{height:80vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.08);display:grid;grid-template-columns:minmax(0,72%) minmax(280px,28%);overflow:hidden}.book{position:relative;background:#f7f8f4;padding:1.4vh 1vw;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.book img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08)}.book iframe{width:100%;height:100%;border:0;border-radius:14px;background:white}.info{padding:3vh 1.7vw;display:flex;flex-direction:column;min-width:0}.small{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697;text-transform:uppercase}.info h2{font-size:clamp(27px,2.35vw,46px);line-height:1.04;margin:1vh 0;color:#164f7f}.read{font-size:clamp(17px,1.15vw,22px);font-weight:900;color:#527673}.stop{margin-top:2vh;padding:1.4vh 1vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(14px,.95vw,18px);font-weight:900;line-height:1.35}.controls{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls button{border:1px solid #d4e0df;border-radius:14px;padding:1.1vh .5vw;background:#fffdf8;color:#245c78;font-weight:900;cursor:pointer;font-size:14px}.controls button:disabled{opacity:.35;cursor:default}.controls .next{background:#668f99;color:white;border-color:#668f99}.pagecount{text-align:center;margin-top:9px;color:#789697;font-weight:900;font-size:13px}.bottom{height:8vh;display:flex;justify-content:center;align-items:center}.done{border:1px solid #668f99;border-radius:999px;padding:1vh 2vw;background:#668f99;color:white;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · READ ALOUD</div><h1>Read Aloud</h1></div><div class="right"><div class="chip" id="chip"></div><button class="close" id="exit">×</button></div></header><section class="stage"><div class="book" id="bookarea"></div><aside class="info"><div class="small" id="small"></div><h2 id="title"></h2><div class="read" id="read"></div><div class="stop" id="stop"></div><div class="controls"><button id="prev">← Previous</button><button class="next" id="next">Next →</button></div><div class="pagecount" id="pagecount"></div></aside></section><div class="bottom"><button class="done" id="done">Done ✓</button></div></main><script>(()=>{const qs=new URLSearchParams(location.search),day=qs.get('day')||'Monday';const data={Monday:{title:'Sometimes I’m Bombaloo',read:'Read 1 of 3',type:'images',pages:16,stop:'Read the book and pause to notice Katie’s feelings. Connect the pictures and words to children’s own experiences.'},Tuesday:{title:'Sometimes I’m Bombaloo',read:'Read 2 of 3',type:'images',pages:16,stop:'Reread the book pages. Pause for children to name feelings and notice what Katie does when her feelings become very big.'},Wednesday:{title:'Sometimes I’m Bombaloo',read:'Read 3 of 3',type:'images',pages:16,stop:'Use the words and illustrations to describe Katie and how her feelings change across the story.'},Thursday:{title:'The Rabbit Listened',read:'Read 1 of 2',type:'pdf',url:'https://www.camplanoche.com/wp-content/uploads/2020/09/The-Rabbit-Listened.pdf',pages:29,stop:'Notice what happens to Taylor and how each animal tries to help. Pay special attention to what the rabbit does differently.'},Friday:{title:'The Rabbit Listened',read:'Read 2 of 2',type:'pdf',url:'https://www.camplanoche.com/wp-content/uploads/2020/09/The-Rabbit-Listened.pdf',pages:29,stop:'Reread the actual book pages and focus on Taylor’s changing feelings and why listening helps.'}};const d=data[day]||data.Monday;let page=1;const bookarea=document.getElementById('bookarea'),prev=document.getElementById('prev'),next=document.getElementById('next'),pagecount=document.getElementById('pagecount');document.getElementById('chip').textContent='WEEK 3 · '+day.toUpperCase();document.getElementById('small').textContent=day+' · WEEK 3';document.getElementById('title').textContent=d.title;document.getElementById('read').textContent=d.read;document.getElementById('stop').textContent=d.stop;function show(){if(d.type==='images'){const n=String(page).padStart(2,'0');bookarea.innerHTML='';const img=document.createElement('img');img.src='assets/bombaloo-'+n+'.jpg?v=2';img.alt='Sometimes I’m Bombaloo book page '+page;bookarea.appendChild(img)}else{bookarea.innerHTML='';const frame=document.createElement('iframe');frame.title='Book pages';frame.src=d.url+'#page='+page+'&view=FitH&toolbar=0&navpanes=0';bookarea.appendChild(frame)}pagecount.textContent='Page '+page+' of '+d.pages;prev.disabled=page===1;next.disabled=page===d.pages}prev.addEventListener('click',()=>{if(page>1){page--;show()}});next.addEventListener('click',()=>{if(page<d.pages){page++;show()}});document.getElementById('exit').addEventListener('click',()=>location.href='week3-plan.html');document.getElementById('done').addEventListener('click',()=>location.href='week3-plan.html');show()})();</script></body></html>
