<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Read Aloud</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:linear-gradient(#faf7ec,#eef4ef);color:#174f76}.page{padding:24px}.card{max-width:1150px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697}h1,h2,h3{color:#165487}.card p,.card li{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}.box{background:#e7f0ed;border-radius:18px;padding:15px;margin:13px 0}.stop{background:#f6eadf;border-radius:16px;padding:13px;margin:10px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900;margin-top:15px}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1 id="book"></h1><h2 id="focus"></h2><div id="content"></div><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{book:'Alma and How She Got Her Name',focus:'Read 1 of 2 · What’s the story about?',html:`<div class="box"><b>Before reading:</b> Introduce the book by Juana Martinez-Neal. Explain that a child and her father talk about her very long name.</div><h3>Pause and Engage</h3><div class="stop"><b>Page 3:</b> What is Alma’s problem with her name?</div><div class="stop"><b>Page 9:</b> What do you think happened to Esperanza’s “heart”?</div><div class="stop"><b>Page 17:</b> Explain that <i>spirits</i> means the soul of a person and <i>ancestors</i> are people one is connected to who lived long ago.</div><div class="stop"><b>Page 21:</b> Thumbs up if you have ever tried to tell other people about what you think is important.</div><div class="box"><b>After reading:</b> Alma’s father helps her realize that she likes her name by talking about relatives she was named for. Ask how children feel when they say their own name or hear someone else say it.</div>`},Tuesday:{book:'Alma and How She Got Her Name',focus:'Read 2 of 2 · Reading the pictures',html:`<div class="box"><b>Before reading:</b> Reintroduce the book and explain that today children will look closely at the illustrations.</div><h3>Pause and Engage</h3><div class="stop"><b>Page 5:</b> Notice Alma and Daddy sitting close together and looking at a photo album.</div><div class="stop"><b>Pages 7–8:</b> What do you think is really happening and what might be part of Alma’s imagination?</div><div class="stop"><b>Pages 11–12:</b> What do the illustrations show? What is Alma doing with the string?</div><div class="stop"><b>Page 18:</b> What is Alma’s great-aunt doing?</div><div class="stop"><b>Pages 21–22:</b> Notice the signs reading “Escucha,” “Piensa,” and “Denuncia.” Ask what the people may be doing and whether children have seen people doing something like this.</div><div class="box"><b>After reading:</b> Alma’s name connects her to many family members. Ask children to think of someone interesting or inspiring to them and one thing that person does.</div>`},Wednesday:{book:'Hair Love',focus:'Read 1 of 3 · Making predictions',html:`<div class="box"><b>Before reading:</b> Introduce <i>Hair Love</i>, written by Matthew A. Cherry and illustrated by Vashti Harrison. Explain that Zuri gets help from her father with a special hairstyle and that children will make predictions from the illustrations.</div><h3>Pause and Engage</h3><div class="stop"><b>Page 1:</b> Explain that something with “a mind of its own” is not easy to control.</div><div class="stop"><b>Page 10:</b> Define <i>worn-out</i> as tired from doing lots of activities. Ask what is happening and what might happen next.</div><div class="stop"><b>Page 13:</b> Explain that “a piece of cake” means very easy.</div><div class="stop"><b>Page 18:</b> How do you think Zuri will feel about Daddy’s next idea?</div><div class="stop"><b>Page 22:</b> How do Zuri and her father look? What do you predict will happen next?</div><div class="stop"><b>Page 26:</b> Mommy’s arrival is a surprise. Ask children how they predict the book will end.</div>`},Thursday:{book:'Hair Love',focus:'Read 2 of 3 · Retelling events',html:`<div class="box"><b>Before reading:</b> Reintroduce the story and explain that this time children will focus on telling what happened.</div><h3>Pause and Engage</h3><div class="stop"><b>Page 12:</b> What happens while Zuri is in the bathroom?</div><div class="stop"><b>Pages 21–22:</b> Look at the illustrations. What tools do they need?</div><div class="stop"><b>Page 27:</b> Reread the page, including the banner. What is going on? Where might Mommy be coming home from?</div><div class="box"><b>After reading:</b> Slowly look through all the illustrations and ask: What happened first, next, and last?</div>`},Friday:{book:'Hair Love',focus:'Read 3 of 3 · Character and connections',html:`<div class="box"><b>Before reading:</b> Explain that today children will use the words and illustrations to get to know Zuri even more.</div><h3>Pause and Engage</h3><div class="stop"><b>Page 6:</b> Notice how Zuri’s hair helps her be lots of things and connect this to Riley’s clothes in <i>What Riley Wore</i>.</div><div class="stop"><b>Page 15:</b> How do you think Zuri feels when she says, “No, Daddy?”</div><div class="stop"><b>Page 19:</b> Zuri looks like she may cry because she wants her hair just right. Ask whether children ever feel like crying when they want something to be just right.</div><div class="box"><b>After reading:</b> Look again from page 23 to the end. Ask: Why does Zuri say her hair is “hair love”?</div>`}}[day];tag.textContent='WEEK 7 · '+day.toUpperCase();book.textContent=d.book;focus.textContent=d.focus;content.innerHTML=d.html;</script></body></html>
