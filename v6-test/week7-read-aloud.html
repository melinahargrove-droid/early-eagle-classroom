<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 7 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:12px}h1{margin:.2vh 0 0;color:#164f7f;font-size:32px;line-height:1}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;display:grid;grid-template-columns:minmax(0,1fr) 32%;gap:2vw;align-items:center;padding:2vh 2vw;box-shadow:0 14px 36px rgba(54,79,77,.07)}.book{height:74vh;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book img{display:block;max-width:100%;max-height:100%;object-fit:contain}.side{min-height:45vh;display:flex;flex-direction:column;justify-content:center}.side h2{font-size:31px;margin:0 0 1vh;color:#164f7f}.focus{font-size:17px;line-height:1.4;font-weight:800;color:#527673}.stop{margin-top:2vh;background:#fff0c9;border:2px solid #e4c56d;border-radius:20px;padding:2vh 1.4vw;color:#71591f;font-size:18px;font-weight:900;line-height:1.38}.stop:empty{display:none}.stop b{display:block;color:#9a6c13;font-size:12px;letter-spacing:.08em;margin-bottom:.7vh}.nostop{margin-top:2vh;background:#e7f0ed;border-radius:18px;padding:1.5vh 1.2vw;color:#53766d;font-weight:900}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book"><img id="bookImg" alt="Adapted book page"></div><div class="side"><h2>Today’s Read</h2><div class="focus" id="focus"></div><div class="stop" id="stop"></div><div class="nostop" id="clean">No curriculum stop on this spread. Keep reading.</div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday';const data={Monday:{title:'Alma and How She Got Her Name',sub:'Read 1 of 2 · What’s the story about?',prefix:'alma-and-how-she-got-her-name-',start:1,end:17,focus:'Read the adapted text fluently. Pause only when a curriculum teaching stop appears here.',notes:'Before reading: Introduce the book by Juana Martinez-Neal. Explain that a child and her father talk about her very long name. After reading: Alma’s father helps her realize that she likes her name by talking about relatives she was named for. Ask how children feel when they say their own name or hear someone else say it.',stops:{4:'BOOK PAGE 3 • What is Alma’s problem with her name?',7:'BOOK PAGE 9 • What do you think happened to Esperanza’s “heart”?',11:'BOOK PAGE 17 • Explain that spirits means the soul of a person and ancestors are people one is connected to who lived long ago.',13:'BOOK PAGE 21 • Thumbs up if you have ever tried to tell other people about what you think is important.'}},Tuesday:{title:'Alma and How She Got Her Name',sub:'Read 2 of 2 · Reading the pictures',prefix:'alma-and-how-she-got-her-name-',start:1,end:17,focus:'Reread the adapted text and look closely at the illustrations. Pause only at the curriculum-designated stops.',notes:'Before reading: Reintroduce the book and explain that today children will look closely at the illustrations. After reading: Alma’s name connects her to many family members. Ask children to think of someone interesting or inspiring to them and one thing that person does.',stops:{5:'BOOK PAGE 5 • Notice Alma and Daddy sitting close together and looking at a photo album.',6:'BOOK PAGES 7–8 • What do you think is really happening and what might be part of Alma’s imagination?',8:'BOOK PAGES 11–12 • What do the illustrations show? What is Alma doing with the string?',11:'BOOK PAGE 18 • What is Alma’s great-aunt doing?',13:'BOOK PAGES 21–22 • Notice the signs reading “Escucha,” “Piensa,” and “Denuncia.” Ask what the people may be doing and whether children have seen people doing something like this.'}},Wednesday:{title:'Hair Love',sub:'Read 1 of 3 · Making predictions',prefix:'hair-love-',start:1,end:16,focus:'Read the adapted text fluently and use the illustrations to make predictions. Pause only at the curriculum-designated stops.',notes:'Before reading: Introduce Hair Love, written by Matthew A. Cherry and illustrated by Vashti Harrison. Explain that Zuri gets help from her father with a special hairstyle and that children will make predictions from the illustrations.',stops:{2:'BOOK PAGE 1 • Explain that something with “a mind of its own” is not easy to control.',6:'BOOK PAGE 10 • Define worn-out as tired from doing lots of activities. Ask what is happening and what might happen next.',8:'BOOK PAGE 13 • Explain that “a piece of cake” means very easy.',10:'BOOK PAGE 18 • How do you think Zuri will feel about Daddy’s next idea?',12:'BOOK PAGE 22 • How do Zuri and her father look? What do you predict will happen next?',14:'BOOK PAGE 26 • Mommy’s arrival is a surprise. Ask children how they predict the book will end.'}},Thursday:{title:'Hair Love',sub:'Read 2 of 3 · Retelling events',prefix:'hair-love-',start:1,end:16,focus:'Reread the story and focus on telling what happened. Pause only at the curriculum-designated stops.',notes:'Before reading: Reintroduce the story and explain that this time children will focus on telling what happened. After reading: Slowly look through all the illustrations and ask: What happened first, next, and last?',stops:{7:'BOOK PAGE 12 • What happens while Zuri is in the bathroom?',12:'BOOK PAGES 21–22 • Look at the illustrations. What tools do they need?',15:'BOOK PAGE 27 • Reread the page, including the banner. What is going on? Where might Mommy be coming home from?'}},Friday:{title:'Hair Love',sub:'Read 3 of 3 · Character and connections',prefix:'hair-love-',start:1,end:16,focus:'Use the words and illustrations to get to know Zuri even more. Pause only at the curriculum-designated stops.',notes:'Before reading: Explain that today children will use the words and illustrations to get to know Zuri even more. After reading: Look again from page 23 to the end. Ask: Why does Zuri say her hair is “hair love”?',stops:{4:'BOOK PAGE 6 • Notice how Zuri’s hair helps her be lots of things and connect this to Riley’s clothes in What Riley Wore.',9:'BOOK PAGE 15 • How do you think Zuri feels when she says, “No, Daddy?”',11:'BOOK PAGE 19 • Zuri looks like she may cry because she wants her hair just right. Ask whether children ever feel like crying when they want something to be just right.'}}};const d=data[day]||data.Monday;let page=d.start;bookTitle.textContent=d.title;subTitle.textContent=d.sub;chip.textContent='WEEK 7 · '+day.toUpperCase();focus.textContent=d.focus;notesTitle.textContent=d.title;notesCopy.textContent=d.notes;function show(){const total=d.end-d.start+1,pos=page-d.start+1;bookImg.src='assets/'+d.prefix+String(page).padStart(2,'0')+'.jpg?v=8';count.textContent='Slide '+pos+' of '+total;fill.style.width=(pos/total*100)+'%';prev.disabled=page===d.start;next.textContent=page===d.end?'Finish Read Aloud ✓':'Next →';const s=d.stops[page]||'';stop.innerHTML=s?'<b>CURRICULUM TEACHING STOP — PAUSE HERE</b>'+s:'';clean.style.display=s?'none':'block'}prev.onclick=()=>{if(page>d.start){page--;show()}};next.onclick=()=>{if(page<d.end){page++;show()}else location.href='week7-plan.html'};backBtn.onclick=()=>location.href='week7-plan.html';notesBtn.onclick=()=>notesPanel.classList.toggle('open');closeNotes.onclick=()=>notesPanel.classList.remove('open');show()})();</script></body></html>
