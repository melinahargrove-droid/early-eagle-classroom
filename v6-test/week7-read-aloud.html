<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 7 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef;position:relative}.book img{display:block;width:100%;height:100%;object-fit:contain}.image-error{display:none;position:absolute;inset:10%;align-items:center;justify-content:center;text-align:center;padding:3vw;border-radius:24px;background:#fff7e8;color:#855d28;font-weight:900;font-size:18px;line-height:1.5}.image-error.show{display:flex}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(560px,44vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title">Week 7 Read Aloud</h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"><div class="image-error" id="imageError"></div></div><div class="stopcard" id="stop"></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const data={Monday:{title:'Alma and How She Got Her Name',sub:'Read 1 of 2 · What’s the story about?',prefix:'alma-',start:1,end:17,before:'Today we will read Alma and How She Got Her Name. Listen for Alma’s problem with her name and what she learns about the people she was named for.',focus:'Read the adapted text fluently. Pause only when a curriculum teaching stop appears.',note:'After reading, talk about how Alma’s father helps her realize that her long name connects her to family stories.',stops:{4:'BOOK PAGE 3 • What is Alma’s problem with her name?',7:'BOOK PAGE 9 • What do you think happened to Esperanza’s “heart”?',11:'BOOK PAGE 17 • Explain that spirits means the soul of a person and ancestors are people one is connected to who lived long ago.',13:'BOOK PAGE 21 • Thumbs up if you have ever tried to tell other people about what you think is important.'}},Tuesday:{title:'Alma and How She Got Her Name',sub:'Read 2 of 2 · Reading the pictures',prefix:'alma-',start:1,end:17,before:'Today we will read Alma again and look closely at the illustrations. Notice what the pictures help us understand about Alma, her family, and the stories behind her name.',focus:'Reread the adapted text and look closely at the illustrations.',note:'After reading, ask children to think of someone interesting or inspiring to them and one thing that person does.',stops:{5:'BOOK PAGE 5 • Notice Alma and Daddy sitting close together and looking at a photo album.',6:'BOOK PAGES 7–8 • What do you think is really happening and what might be part of Alma’s imagination?',8:'BOOK PAGES 11–12 • What do the illustrations show? What is Alma doing with the string?',11:'BOOK PAGE 18 • What is Alma’s great-aunt doing?',13:'BOOK PAGES 21–22 • Notice the signs reading “Escucha,” “Piensa,” and “Denuncia.” Ask what the people may be doing and whether children have seen people doing something like this.'}},Wednesday:{title:'Hair Love',sub:'Read 1 of 3 · Making predictions',prefix:'hair-love-',start:1,end:16,before:'Today we will read Hair Love. Use the illustrations to make predictions about Zuri, her hair, and what might happen next.',focus:'Read the adapted text fluently and use the illustrations to make predictions.',note:'Introduce Hair Love, written by Matthew A. Cherry and illustrated by Vashti Harrison.',stops:{2:'BOOK PAGE 1 • Explain that something with “a mind of its own” is not easy to control.',6:'BOOK PAGE 10 • Define worn-out as tired from doing lots of activities. Ask what is happening and what might happen next.',8:'BOOK PAGE 13 • Explain that “a piece of cake” means very easy.',10:'BOOK PAGE 18 • How do you think Zuri will feel about Daddy’s next idea?',12:'BOOK PAGE 22 • How do Zuri and her father look? What do you predict will happen next?',14:'BOOK PAGE 26 • Mommy’s arrival is a surprise. Ask children how they predict the book will end.'}},Thursday:{title:'Hair Love',sub:'Read 2 of 3 · Retelling events',prefix:'hair-love-',start:1,end:16,before:'Today we will read Hair Love again and focus on what happens first, next, and last.',focus:'Reread the story and focus on telling what happened.',note:'After reading, slowly look through all the illustrations and ask: What happened first, next, and last?',stops:{7:'BOOK PAGE 12 • What happens while Zuri is in the bathroom?',12:'BOOK PAGES 21–22 • Look at the illustrations. What tools do they need?',15:'BOOK PAGE 27 • Reread the page, including the banner. What is going on? Where might Mommy be coming home from?'}},Friday:{title:'Hair Love',sub:'Read 3 of 3 · Character and connections',prefix:'hair-love-',start:1,end:16,before:'Today we will use the words and illustrations in Hair Love to get to know Zuri even more and make connections to her feelings and experiences.',focus:'Use the words and illustrations to get to know Zuri even more.',note:'After reading, look again from page 23 to the end and ask why Zuri says her hair is “hair love.”',stops:{4:'BOOK PAGE 6 • Notice how Zuri’s hair helps her be lots of things and connect this to Riley’s clothes in What Riley Wore.',9:'BOOK PAGE 15 • How do you think Zuri feels when she says, “No, Daddy?”',11:'BOOK PAGE 19 • Zuri looks like she may cry because she wants her hair just right. Ask whether children ever feel like crying when they want something to be just right.'}}};const p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',x=data[day],from=p.get('from')||'';let page=x.start,beforeOpen=true,pauseShown=false;const $=id=>document.getElementById(id),title=$('title'),sub=$('sub'),chip=$('chip'),pageImg=$('pageImg'),imageError=$('imageError'),stop=$('stop'),prev=$('prev'),next=$('next'),count=$('count'),fill=$('fill'),notesTitle=$('notesTitle'),focus=$('focus'),note=$('note'),notesPanel=$('notesPanel');title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 7 · '+day.toUpperCase();notesTitle.textContent=x.title;focus.textContent=x.focus;note.textContent=x.note||'';function overview(){location.href='daily-lessons.html?week=7&day='+days.indexOf(day)+'&v='+Date.now()}function state(){return{page,beforeOpen,pauseShown,atStart:beforeOpen&&page===x.start,atEnd:!beforeOpen&&page===x.end&&(!x.stops[page]||pauseShown)}}window.EEASectionState=state;function notify(){window.dispatchEvent(new CustomEvent('eea-section-state',{detail:state()}))}function showCard(label,copy){stop.innerHTML='<b>'+label+'</b>'+copy;stop.classList.add('show')}function hideCard(){stop.classList.remove('show')}function renderImage(){const src='assets/readaloud/'+x.prefix+String(page).padStart(2,'0')+'.jpg';imageError.classList.remove('show');pageImg.style.visibility='visible';pageImg.onerror=()=>{pageImg.style.visibility='hidden';imageError.textContent='Book image could not load: '+src;imageError.classList.add('show')};pageImg.src=src+'?v=7'}function updateButton(){if(beforeOpen){next.textContent='Start Reading →';return}if(pauseShown){next.textContent=page===x.end?'Finish Read Aloud ✓':'Continue →';return}next.textContent=page===x.end?'Finish Read Aloud ✓':'Next →'}function render(){const total=x.end-x.start+1,pos=page-x.start+1;renderImage();count.textContent='Slide '+pos+' of '+total;fill.style.width=(pos/total*100)+'%';prev.disabled=false;if(beforeOpen)showCard('BEFORE WE READ',x.before);else if(pauseShown&&x.stops[page])showCard('CURRICULUM TEACHING STOP — PAUSE HERE',x.stops[page]);else hideCard();updateButton();notify()}prev.onclick=()=>{if(pauseShown){pauseShown=false;render();return}if(beforeOpen)return;if(page>x.start){page--;render();return}beforeOpen=true;render()};next.onclick=()=>{if(beforeOpen){beforeOpen=false;render();return}const s=x.stops[page]||'';if(s&&!pauseShown){pauseShown=true;render();return}if(pauseShown)pauseShown=false;if(page<x.end){page++;render()}else if(from==='runner'){return}else overview()};$('backBtn').onclick=overview;$('notesBtn').onclick=()=>notesPanel.classList.toggle('open');$('closeNotes').onclick=()=>notesPanel.classList.remove('open');render()})();</script></body></html>
