<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 7 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef;position:relative}.book.hidden{display:none}.book img{display:block;width:100%;height:100%;object-fit:contain}.image-error{display:none;position:absolute;inset:10%;align-items:center;justify-content:center;text-align:center;padding:3vw;border-radius:24px;background:#fff7e8;color:#855d28;font-weight:900;font-size:18px;line-height:1.5}.image-error.show{display:flex}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(560px,44vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-fallback{font-size:clamp(100px,10vw,180px)}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(42px,3.7vw,68px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-example{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="pageImg" alt="Adapted book page"><div class="image-error" id="imageError"></div></div><div class="stopcard" id="stop"></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit Visual</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-example" id="vocabExample"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',runner=p.get('eeaRunner')==='1',$=id=>document.getElementById(id);const reads={Monday:{title:'A Letter to Amy',sub:'Read 1 of 3 · Introduce the book',before:'Introduce A Letter to Amy, written and illustrated by Ezra Jack Keats. Invite cover predictions. Today children will learn new words and make predictions.',stops:[['PAGES 1–2','Peter writes a letter to invite Amy to his party. A letter is a written/drawn message; invite means politely ask someone to come/do something.'],['PAGES 3–4','Mail means sending the letter to another person. Use the dark cloudy sky to model a prediction that it might rain.'],['PAGES 5–6','What might wild horses look and sound like?'],['PAGES 7–8','Act out lightning and thunder.'],['PAGES 9–10','Continue reading as Peter chases the letter through the wind.'],['PAGES 11–12','What will happen with the letter? Why?'],['PAGES 13–14','Spoiled means ruined.'],['PAGES 15–16','Continue reading as Peter catches the letter before Amy can see it.'],['PAGES 17–18','Continue reading as Peter mails the letter and Amy runs away crying.'],['PAGES 19–20','A reflection is an image of yourself. Pretend to look in a mirror.'],['PAGES 21–22','Continue reading as Peter returns home feeling sad.'],['PAGES 23–24','What will happen when the birthday cake comes out? Why?'],['PAGES 25–26','Continue reading as Amy arrives at Peter’s party.'],['PAGES 27–28','Peter makes his own wish and blows out the candles.'],['AFTER READING','What do you think Peter wished for? Why?']]},Tuesday:{title:'The Thank You Letter',sub:'Read 1 of 2 · Introduce the book',before:'Introduce The Thank You Letter by Jane Cabrera, who wrote the words and drew the pictures. Grace is celebrating her birthday and wants to thank everyone for celebrating with her. Thumbs up if you remember celebrating a birthday. Read to find out what happens when she thanks friends and neighbors.',stops:[['PAGES 1–2','Grace writes a list of things she wants. A list has words/items written one after another that have something in common. Trace down the illustrated list.'],['PAGES 5–6','Grace has a costume party. Costume means clothing used to dress up as something else. How is everyone feeling? Grace looks joyful and loved.'],['PAGES 7–8','Why did Grace write thank-you letters? Read the letters. She thanks Nana Ana and Granpops, Taye, and Milly and Billy for presents.'],['PAGE 19','Grace writes thank-you letters to her cat, dog, teacher, and even a tree—thanking them for how they are and how they make her feel.'],['PAGES 25–26','Look at the love notes Grace receives. People in her community wrote short messages about what they love about her.'],['PAGES 27–28','What do you notice in the notes? Messages can include drawings, words, and pictures. Some are mailed in envelopes, which keep the message inside safe.'],['AFTER READING','What did you learn about letters and notes today? Close by inviting children to begin messages for friends at Writing & Drawing.']],Wednesday:{title:'The Thank You Letter',sub:'Read 2 of 2 · Retell the story',before:'Reintroduce The Thank You Letter and point to Grace on the cover. Notice the paper and pencil: What is Grace doing? Today children will retell the story using the illustrations.',stops:[['PAGE 2','Look at Grace’s birthday list. What did she put on it? Invite children to “read” the drawings.'],['PAGES 5–6','What happened at the birthday party? Notice costumes, fun, and presents.'],['PAGES 11–12','What did Grace thank people for? She wrote letters for presents and drew pictures in some letters.'],['PAGES 19–20','Who else did Grace write thank-you letters to? Invite children to recall.'],['PAGES 23–24','What is Grace going to find in her tent?'],['PAGES 25–26','Grace finds many love notes. How would you feel if friends sent you love notes? Explain that writing/saying thank you is one way some people express gratitude, and people also show gratitude through actions and how they treat others.'],['AFTER READING','What are some ways we can share messages of thanks with friends? Close by inviting children to write a thank-you letter, love note, or another kind of message during Centers.']]},Thursday:{title:'A Letter to Amy',sub:'Read 2 of 3 · Character development and feelings',before:'Reintroduce A Letter to Amy. Peter wants to invite Amy to his party. Today read the book again and pause to think more deeply about the characters and how their feelings change.',stops:[['PAGES 1–2','Peter feels sending Amy a letter would be more special—unique and important. What things are special to you? How does Peter feel about Amy? How do you know?'],['PAGES 13–14','Peter thinks Amy must not see the letter or the surprise will be spoiled. How does Peter feel when he runs into Amy? How do you know?'],['PAGES 19–20','Amy runs off crying after Peter bumps into her. How does Peter feel? His reflection looks mixed up. Introduce mixed feelings: experiencing different feelings at the same time, such as angry/scared or happy/worried. Invite children to share if they have experienced mixed feelings.'],['PAGES 25–26','Peter’s friends say something unkind when they see Amy. How might Amy feel? How might Peter feel? Do you think the friends’ reaction is fair? Why?'],['AFTER READING','How do you think Amy felt when she received Peter’s invitation? How would you feel if you received a message or invitation? Close by connecting to writing cards/messages about feelings during Writing & Drawing.']]},Friday:{title:'A Letter to Amy',sub:'Read 3 of 3 · Act out the story',before:'Seat children around the perimeter of the rug. Today we will act out A Letter to Amy. The perimeter is the audience and the inside is the stage. Invite children to enter the stage as characters. Children may say “pass” or use the established pass gesture if they prefer to watch. Connect to children’s recent Storytelling with Props experiences.',stops:[['ACT OUT SELECTED SCENES','Select several scenes and show the corresponding pages. Invite different children to portray Peter, Amy, and friends across scenes so more children can participate. Use the letter prop and invite children to act out weather such as thunder and wind.'],['AFTER READING','What did you think about acting out the story today? Close by telling children the class will act out other stories soon.']]}}};const d=reads[day]||reads.Monday;$('title').textContent=d.title;$('sub').textContent=d.sub;$('chip').textContent='FOCUS ON 3s · WEEK 7 · '+day.toUpperCase();let step=-1;function render(){const before=step<0,z=before?null:d.stops[step];$('pageImg').src=day==='Monday'?(step<0?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-cover.png':step===0?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-1-2.png':step===1?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-3-4.png':step===2?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-5-6.png':step===3?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-7-8.png':step===4?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-9-10.png':step===5?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-11-12.png':step===6?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-13-14.png':step===7?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-15-16.png':step===8?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-17-18.png':step===9?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-19-20.png':step===10?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-21-22.png':step===11?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-23-24.png':step===12?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-25-26.png':step===13?'assets/focus-3s/unit-1/week-7/read-aloud/a-letter-to-amy-pages-27-28.png':'assets/reading.webp'):'assets/reading.webp';$('stop').classList.add('show');$('stop').innerHTML='<b>'+(before?'BEFORE WE READ':z[0])+'</b>'+(before?d.before:z[1]);$('count').textContent=before?'Before Reading':'Teaching Stop '+(step+1)+' of '+d.stops.length;$('prev').disabled=before;$('next').textContent=step===d.stops.length-1?'Finish Read Aloud ✓':'Next →'}$('prev').onclick=()=>{if(step>=0){step--;render()}};$('next').onclick=()=>{if(step<d.stops.length-1){step++;render()}else if(!runner)location.href='daily-lessons.html?week=7&day='+(day==='Friday'?4:day==='Thursday'?3:day==='Wednesday'?2:day==='Tuesday'?1:0)};$('back').onclick=()=>location.href='daily-lessons.html?week=7&day='+(day==='Tuesday'?1:0);render()})();</script></body></html>
