<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Read Aloud</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:1.5vh 3vw}.top{height:9vh;display:flex;justify-content:space-between}.meta{font-weight:900;letter-spacing:.12em;color:#789697}.top h1{margin:.35vh 0;font-size:34px;color:#164f7f}.chip{font-weight:900;background:#dcecf0;border-radius:999px;padding:9px 16px;height:max-content}.stage{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:66% 1fr;gap:2.5vw;align-items:center;padding:2.5vh 3vw}.book{height:68vh;border-radius:24px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;overflow:hidden}.book img{max-width:100%;max-height:100%;object-fit:contain;display:block}.copy h2{font-size:30px;margin:0 0 1vh;color:#164f7f}.copy p{font-size:16px;line-height:1.35;font-weight:800;color:#527673}.stop{background:#fff0c9;border:2px solid #e4c56d;border-radius:18px;padding:1.3vh 1vw;margin-top:1vh;font-size:16px;font-weight:900;color:#71591f;line-height:1.35}.stop:empty{display:none}.stop b{display:block;color:#9a6c13;letter-spacing:.06em;margin-bottom:.5vh}.note{background:#e7f0ed;border-radius:18px;padding:1.1vh 1vw;margin-top:1vh;font-size:15px;font-weight:900;color:#416d61}.note:empty{display:none}.controls{display:flex;justify-content:center;align-items:center;gap:12px;height:10vh}.controls button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 18px;font-weight:900;cursor:pointer}.controls .done{background:#668f99;color:#fff;border-color:#668f99}.count{font-weight:900;color:#66858b;min-width:90px;text-align:center}</style></head><body><main class="page"><header class="top"><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div id="sub"></div></div><div class="chip" id="chip"></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"></div><div class="copy"><h2>Today’s Read</h2><p id="focus"></p><div class="stop" id="stop"></div><div class="note" id="note"></div></div></section><div class="controls"><button id="prev">← Previous</button><div class="count" id="count"></div><button id="next">Next →</button><button class="done" onclick="location.href='week7-plan.html'">Done ✓</button></div></main><script>const d={Monday:{title:'Alma and How She Got Her Name',sub:'Read 1 of 2 · What’s the story about?',prefix:'alma-and-how-she-got-her-name-',start:3,end:18,focus:'Introduce the book by Juana Martinez-Neal. Explain that a child and her father talk about her very long name.',before:'Before reading: Introduce the book by Juana Martinez-Neal. Explain that a child and her father talk about her very long name.',after:'After reading: Alma’s father helps her realize that she likes her name by talking about relatives she was named for. Ask how children feel when they say their own name or hear someone else say it.',stops:{4:'Page 3: What is Alma’s problem with her name?',7:'Page 9: What do you think happened to Esperanza’s “heart”?',11:'Page 17: Explain that spirits means the soul of a person and ancestors are people one is connected to who lived long ago.',13:'Page 21: Thumbs up if you have ever tried to tell other people about what you think is important.'}},Tuesday:{title:'Alma and How She Got Her Name',sub:'Read 2 of 2 · Reading the pictures',prefix:'alma-and-how-she-got-her-name-',start:3,end:18,focus:'Reintroduce the book and explain that today children will look closely at the illustrations.',before:'Before reading: Reintroduce the book and explain that today children will look closely at the illustrations.',after:'After reading: Alma’s name connects her to many family members. Ask children to think of someone interesting or inspiring to them and one thing that person does.',stops:{5:'Page 5: Notice Alma and Daddy sitting close together and looking at a photo album.',6:'Pages 7–8: What do you think is really happening and what might be part of Alma’s imagination?',8:'Pages 11–12: What do the illustrations show? What is Alma doing with the string?',11:'Page 18: What is Alma’s great-aunt doing?',13:'Pages 21–22: Notice the signs reading “Escucha,” “Piensa,” and “Denuncia.” Ask what the people may be doing and whether children have seen people doing something like this.'}},Wednesday:{title:'Hair Love',sub:'Read 1 of 3 · Making predictions',prefix:'hair-love-',start:3,end:16,focus:'Introduce Hair Love, written by Matthew A. Cherry and illustrated by Vashti Harrison. Explain that Zuri gets help from her father with a special hairstyle and that children will make predictions from the illustrations.',before:'Before reading: Introduce Hair Love, written by Matthew A. Cherry and illustrated by Vashti Harrison. Explain that Zuri gets help from her father with a special hairstyle and that children will make predictions from the illustrations.',after:'',stops:{3:'Page 1: Explain that something with “a mind of its own” is not easy to control.',7:'Page 10: Define worn-out as tired from doing lots of activities. Ask what is happening and what might happen next.',9:'Page 13: Explain that “a piece of cake” means very easy.',11:'Page 18: How do you think Zuri will feel about Daddy’s next idea?',13:'Page 22: How do Zuri and her father look? What do you predict will happen next?',15:'Page 26: Mommy’s arrival is a surprise. Ask children how they predict the book will end.'}},Thursday:{title:'Hair Love',sub:'Read 2 of 3 · Retelling events',prefix:'hair-love-',start:3,end:16,focus:'Reintroduce the story and explain that this time children will focus on telling what happened.',before:'Before reading: Reintroduce the story and explain that this time children will focus on telling what happened.',after:'After reading: Slowly look through all the illustrations and ask: What happened first, next, and last?',stops:{8:'Page 12: What happens while Zuri is in the bathroom?',13:'Pages 21–22: Look at the illustrations. What tools do they need?',16:'Page 27: Reread the page, including the banner. What is going on? Where might Mommy be coming home from?'}},Friday:{title:'Hair Love',sub:'Read 3 of 3 · Character and connections',prefix:'hair-love-',start:3,end:16,focus:'Explain that today children will use the words and illustrations to get to know Zuri even more.',before:'Before reading: Explain that today children will use the words and illustrations to get to know Zuri even more.',after:'After reading: Look again from page 23 to the end. Ask: Why does Zuri say her hair is “hair love”?',stops:{5:'Page 6: Notice how Zuri’s hair helps her be lots of things and connect this to Riley’s clothes in What Riley Wore.',10:'Page 15: How do you think Zuri feels when she says, “No, Daddy?”',12:'Page 19: Zuri looks like she may cry because she wants her hair just right. Ask whether children ever feel like crying when they want something to be just right.'}}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday,page=x.start;title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 7 · '+day.toUpperCase();focus.textContent=x.focus;function show(){pageImg.src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg';count.textContent=(page-x.start+1)+' of '+(x.end-x.start+1);prev.disabled=page===x.start;next.disabled=page===x.end;let s=x.stops[page]||'';stop.innerHTML=s?'<b>CURRICULUM TEACHING STOPS — Pause only at these designated moments</b>'+s:'';let n='';if(page===x.start&&x.before)n=x.before;if(page===x.end&&x.after)n=x.after;note.textContent=n}prev.onclick=()=>{if(page>x.start){page--;show()}};next.onclick=()=>{if(page<x.end){page++;show()}};show();</script></body></html>
