<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fo3s U1W1 Tuesday Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:3vh 5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:10vh;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.11em;color:#789697}.brand h1{margin:.5vh 0;color:#164f7f;font-size:clamp(34px,3vw,58px)}.chip{height:max-content;background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.card{height:70vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:34% 1fr;gap:4vw;align-items:center;padding:4vh}.visual{height:52vh;border-radius:28px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;font-size:clamp(90px,9vw,160px)}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h2{font-size:clamp(38px,3.4vw,62px);margin:1vh 0;color:#164f7f}.copy li{font-size:clamp(16px,1.1vw,21px);font-weight:850;line-height:1.42;color:#527673;margin:.6vh 0}.note{background:#e7f0ed;border-radius:18px;padding:1.2vh;color:#416d61;font-weight:850;line-height:1.4}.bottom{height:12vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900}.bottom .next{background:#668f99;color:#fff}.progress{font-weight:900;color:#789697}</style></head><body><main class="page"><header><div class="brand">EARLY EAGLE ACADEMY · INTRO TO CENTERS · FOCUS ON PRE-K 3s<h1>Tuesday Center Introductions</h1></div><div class="chip">U1 · W1 · TUESDAY</div></header><section class="card"><div class="visual" id="icon"></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><ul id="steps"></ul><div class="note" id="note"></div></div></section><div class="bottom"><button id="prev">← Read Aloud</button><div class="progress" id="progress"></div><button class="next" id="next">Next →</button></div></main><script>(()=>{const cards=[{icon:'📚',eye:'LIBRARY & LISTENING',title:'Looking at Books',steps:['Connect to Lola reading books in a tent and introduce Library & Listening.','Model choosing one book, opening at the front, and gently turning pages one at a time.','Look closely at illustrations and model noticing, wondering, or talking about what might be happening.','Handle books gently and return each book before choosing another.'],note:'Use real classroom books and the Library routine visual when available.'},{icon:'🧱',eye:'BLOCKS',title:'Free Exploration 1',steps:['Connect to Lola and her friends building a block castle and introduce the Blocks area.','Model taking blocks from the shelf/bin and building on the floor or carpet.','Explore block sizes and shapes. Children may build a castle or something different.','Encourage sharing and collaboration while respecting other children’s structures and space.','Model returning blocks to their labeled places when finished.'],note:'Use actual classroom blocks and shelf/bin labels while modeling.'}];let i=0,$=x=>document.getElementById(x);function draw(){let c=cards[i];$('icon').textContent=c.icon;$('eye').textContent=c.eye;$('title').textContent=c.title;$('steps').innerHTML=c.steps.map(s=>'<li>'+s+'</li>').join('');$('note').innerHTML='<b>Teacher note:</b> '+c.note;$('progress').textContent=(i+1)+' of 2';$('prev').textContent=i===0?'← Read Aloud':'← Previous';$('next').textContent=i===1?'Finish Tuesday ✓':'Next: Blocks →'}$('prev').onclick=()=>{if(i===0)location.href='fo3s-u1w1-lola-read2.html';else{i--;draw()}};$('next').onclick=()=>{if(i===0){i=1;draw()}else location.href='fo3s-u1w1-tuesday.html'};draw()})();</script></body></html>
