<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fo3s U1W1 Tuesday Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:3vh 5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:10vh;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.11em;color:#789697}.brand h1{margin:.5vh 0;color:#164f7f;font-size:clamp(34px,3vw,58px)}.chip{height:max-content;background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.card{height:70vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:40% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.visual{height:52vh;border-radius:28px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;font-size:clamp(100px,10vw,180px)}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h2{font-size:clamp(38px,3.5vw,66px);margin:1vh 0;color:#164f7f}.copy p{font-size:clamp(19px,1.3vw,25px);font-weight:850;line-height:1.4;color:#527673}.note{background:#e7f0ed;border-radius:18px;padding:1.2vh 1.2vw;color:#416d61;font-weight:850;line-height:1.4}.bottom{height:12vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900;cursor:pointer}.bottom .next{background:#668f99;color:#fff}.progress{font-weight:900;color:#789697}</style></head><body><main class="page"><header><div class="brand">EARLY EAGLE ACADEMY · INTRO TO CENTERS · FOCUS ON PRE-K 3s<h1>Tuesday Center Introductions</h1></div><div class="chip">U1 · W1 · TUESDAY</div></header><section class="card"><div class="visual" id="icon"></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><p id="say"></p><div class="note" id="note"></div></div></section><div class="bottom"><button id="prev">← Read Aloud</button><div class="progress" id="progress"></div><button class="next" id="next">Next →</button></div></main><script>(()=>{const cards=[{icon:'📚',eye:'LIBRARY & LISTENING',title:'Meet the Library',say:'In Lola Goes to School, Lola reads books in a tent and thinks about ideas. We have a Library and Listening Center in our classroom, too.',note:'Point to the area or show a photograph if it is not visible.'},{icon:'📖',eye:'CHOOSE A BOOK',title:'Pick One and Look',say:'When you come to the Library, choose a book. Open the front cover and gently turn the pages one at a time.',note:'Demonstrate choosing between two books, opening from the front, and turning pages carefully.'},{icon:'👀',eye:'NOTICE & TALK',title:'Look at the Pictures',say:'What do you notice in the illustrations? What do you think is happening on this page?',note:'Model sharing an observation or question about a picture or story.'},{icon:'🧺',eye:'BOOK CARE',title:'Put It Back',say:'Books are special. We are gentle with them and put each book back before choosing another.',note:'Demonstrate returning the book to the correct bin or shelf.'},{icon:'🧱',eye:'BLOCKS',title:'Meet the Block Area',say:'In Lola Goes to School, Lola and her friends built a castle out of blocks. We have blocks in our classroom too!',note:'Show the block area or a photograph of it. Have one type of block available for the first exploration.'},{icon:'🏗️',eye:'BUILDING ROUTINE',title:'Take Out · Build · Put Away',say:'First we take blocks from the shelf or bin and put them on the floor or carpet. Then we use our imagination and build. When we are finished, we put the blocks back in their proper places.',note:'Model building a simple structure and using the shelf/bin picture labels for cleanup.'},{icon:'🤝',eye:'PLAYING TOGETHER',title:'Build With Friends',say:'You might build a castle like Lola and her friends, or create something different. We can share blocks and build together.',note:'Model language such as “May I use that block please?” and “Can we build together?” Remind children to respect one another’s buildings and space.'}];let i=0;const $=x=>document.getElementById(x);function draw(){const c=cards[i];$('icon').textContent=c.icon;$('eye').textContent=c.eye;$('title').textContent=c.title;$('say').textContent=c.say;$('note').innerHTML='<b>Teacher note:</b> '+c.note;$('progress').textContent=(i+1)+' of '+cards.length;$('prev').textContent=i===0?'← Read Aloud':'← Previous';$('next').textContent=i===cards.length-1?'Finish Tuesday ✓':'Next →'}$('prev').onclick=()=>{if(i===0)location.href='fo3s-u1w1-lola-read2.html';else{i--;draw()}};$('next').onclick=()=>{if(i<cards.length-1){i++;draw()}else location.href='fo3s-u1w1-tuesday.html'};draw()})();</script></body></html>
