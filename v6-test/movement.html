<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Movement</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#dfe9e8}button,select,input{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(180deg,rgba(248,249,243,.09),rgba(231,240,237,.14)),url("https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png") center/cover no-repeat}.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 62% 43%,rgba(255,255,255,.09),transparent 55%)}.close{position:absolute;z-index:50;top:2.2vh;right:2vw;width:clamp(50px,3.7vw,70px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(72,104,121,.26);background:rgba(255,252,245,.9);color:#173f72;font-size:clamp(27px,2.1vw,39px);font-weight:900;cursor:pointer}.manage{display:none;position:absolute;z-index:50;top:2.5vh;left:2vw;border:1.5px solid rgba(72,104,121,.24);border-radius:999px;background:rgba(255,252,245,.93);color:#245c78;padding:.9vh 1.2vw;font-weight:900;cursor:pointer;box-shadow:0 5px 13px rgba(45,71,86,.08)}.manage.show{display:block}.eddie-wrap{position:absolute;z-index:13;left:1.8vw;bottom:1.3vh;width:27vw;height:80vh;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}.eddie{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 9px 8px rgba(43,68,81,.12))}.sparkle{position:absolute;z-index:14;color:#d8b76b;pointer-events:none}.s1{left:23vw;top:26vh;font-size:3vw}.s2{left:27vw;top:42vh;font-size:2vw}.s3{left:22vw;top:58vh;font-size:2.3vw}.workspace{position:absolute;z-index:15;left:30.5vw;top:10.8vh;width:64.6vw;height:87vh}.preview{position:absolute;left:0;right:0;top:0;height:69%;overflow:hidden;border-radius:34px;background:linear-gradient(180deg,rgba(210,231,232,.96),rgba(178,210,216,.96));border:2px solid rgba(83,115,128,.18);box-shadow:0 13px 28px rgba(43,68,80,.12),inset 0 0 0 7px rgba(255,253,246,.34);display:flex;align-items:center;justify-content:center;text-align:center;padding:2vh 3vw;transition:.16s}.preview.has-pick{background-size:cover;background-position:center;cursor:pointer}.preview.has-pick::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(220,235,231,.70),rgba(190,217,218,.78));backdrop-filter:blur(1.5px)}.preview-copy{position:relative;z-index:2;width:88%}.play{margin:0 auto;width:clamp(82px,6.8vw,130px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;padding-left:.42em;background:rgba(255,252,244,.94);border:2px solid rgba(92,126,145,.20);color:#6c93aa;font-size:clamp(40px,3.7vw,70px)}.preview strong{display:block;margin-top:1.35vh;font-size:clamp(30px,2.35vw,45px);line-height:1.03;color:#173f72;font-weight:900}.preview span{display:block;margin-top:.7vh;font-size:clamp(16px,1.08vw,21px);font-weight:900;color:#496f70}.session-list{display:flex;flex-wrap:wrap;justify-content:center;gap:.65vh .6vw;margin-top:1.2vh}.session-chip{background:rgba(255,252,244,.88);border:1.3px solid rgba(84,116,128,.17);border-radius:999px;padding:.45vh .75vw;font-size:clamp(11px,.76vw,15px);font-weight:900;color:#355f75}.controls{position:absolute;left:0;right:0;bottom:0;height:27%;display:grid;grid-template-columns:1fr 1fr .92fr;gap:1.1vw;align-items:center;padding:1.2vh 1.25vw;border-radius:28px;background:linear-gradient(180deg,rgba(255,253,247,.89),rgba(248,244,233,.85));border:1.7px solid rgba(108,121,107,.15);box-shadow:0 8px 20px rgba(53,71,78,.08)}.control-box{align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-width:0}.control-box label{font-size:clamp(15px,1.05vw,21px);font-weight:900;color:#4f6f61;margin:0 0 .45vh .2vw}.select-wrap{display:flex;gap:.45vw}.select-wrap select,.custom-time{width:100%;min-width:0;height:clamp(54px,6.6vh,76px);border-radius:18px;border:1.8px solid rgba(82,116,142,.23);background:linear-gradient(180deg,#fffef9,#f8f3e9);color:#173f72;padding:0 1vw;font-size:clamp(18px,1.3vw,25px);font-weight:900}.custom-time{display:none;width:40%;padding:0 .6vw}.custom-time.show{display:block}.pick-button{height:clamp(64px,7.7vh,90px);border-radius:22px;font-size:clamp(24px,1.8vw,35px);font-weight:900;cursor:pointer;border:2px solid rgba(69,105,132,.21);background:linear-gradient(180deg,#86adc8,#668eae);color:#fff;box-shadow:0 7px 0 rgba(65,92,112,.15),0 11px 18px rgba(47,72,87,.10)}.pick-button:disabled{opacity:.45;cursor:not-allowed}.category-note{font-size:clamp(10px,.7vw,13px);font-family:"Trebuchet MS",Arial,sans-serif;color:#6e7e79;margin:.38vh 0 0 .2vw;font-weight:700}.player{display:none;position:fixed;z-index:200;inset:1.5vh 1.5vw;border-radius:28px;overflow:hidden;background:#081722;box-shadow:0 0 0 100vmax rgba(14,31,42,.58);color:#fff}.player.open{display:flex;flex-direction:column}.player-top{height:9%;display:flex;align-items:center;justify-content:space-between;padding:0 2vw;background:#102c3e}.player-top strong{font-size:clamp(19px,1.45vw,28px)}.player-close{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:30px;font-weight:900;cursor:pointer}.player-stage{position:relative;flex:1;min-height:0;background:#000}.youtube-frame{position:absolute;inset:0;width:100%;height:100%;background:#000}.youtube-frame iframe{display:block;width:100%!important;height:100%!important;border:0}.player-bottom{height:11%;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:1vw;padding:0 2vw;background:#102c3e}.progress{font-size:clamp(16px,1.05vw,22px);font-weight:800}.player-bottom button{border:0;border-radius:18px;padding:1.2vh 1.8vw;font-weight:900;cursor:pointer}.next-video{background:#f4f0e6;color:#173f72}.finish-session{background:#7ca8ca;color:white}.complete{display:none;position:fixed;z-index:210;inset:0;align-items:center;justify-content:center;background:rgba(239,245,239,.96);text-align:center;color:#173f72}.complete.open{display:flex}.complete-card{padding:5vh 6vw;border-radius:34px;background:rgba(255,252,244,.92);border:1.6px solid rgba(89,116,126,.16)}.complete-card h2{font-size:clamp(48px,4vw,78px);margin:0 0 1vh}.complete-card p{font-size:clamp(20px,1.5vw,30px);font-weight:800;color:#507069}.complete-card button{margin-top:2vh;border:0;border-radius:22px;background:#6d9abb;color:#fff;padding:1.6vh 3vw;font-size:clamp(22px,1.6vw,32px);font-weight:900;cursor:pointer}
</style></head><body><main class="stage"><button class="manage" id="manageSongs" type="button">⚙ Manage Song Lists</button><button class="close" type="button" aria-label="Close Movement" onclick="window.location.href='index.html'">×</button><div class="eddie-wrap"><img class="eddie" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/Eddie%20Poses/Eddie_07_Movement.png" alt=""></div><div class="sparkle s1">✦</div><div class="sparkle s2">★</div><div class="sparkle s3">✦</div><section class="workspace"><div class="preview" id="preview" role="button" aria-label="Play Eddie's movement session"><div class="preview-copy"><div class="play">▶</div><strong id="previewTitle">Ready for a movement break?</strong><span id="previewText">Choose a song list and a time, then let Eddie build the session.</span><div class="session-list" id="sessionList"></div></div></div><div class="controls"><div class="control-box"><label for="songCategory">Which songs can Eddie pick?</label><select id="songCategory"></select><div class="category-note" id="categoryNote"></div></div><div class="control-box"><label for="movementTime">How long do we move?</label><div class="select-wrap"><select id="movementTime"><option value="3">3 minutes</option><option value="5" selected>5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="20">20 minutes</option><option value="25">25 minutes</option><option value="30">30 minutes</option><option value="custom">Custom...</option></select><input class="custom-time" id="customTime" type="number" min="1" max="60" value="12" aria-label="Custom movement minutes"></div></div><button class="pick-button" id="pickButton">Eddie Picks!</button></div></section></main><section class="player" id="player" aria-label="Movement video player"><div class="player-top"><strong id="playerSession">Movement Session</strong><button class="player-close" id="playerClose">×</button></div><div class="player-stage"><div class="youtube-frame"><div id="youtubePlayer"></div></div></div><div class="player-bottom"><div class="progress" id="playerProgress"></div><button class="next-video" id="nextVideo">Next Video →</button><button class="finish-session" id="finishSession">Finish Session</button></div></section><section class="complete" id="complete"><div class="complete-card"><h2>Great moving!</h2><p>Eddie’s movement break is finished.</p><button id="doneButton">Back to Movement</button></div></section><script>
const LIBRARY_KEY='eea-movement-song-library-v2',ACTIVE_KEY='eea-movement-active-category-v2',MOVEMENT_HISTORY_KEY='eea-movement-history-v1';
const defaults=[{id:'Nqg5zY0MOfI',title:'Move It and Freeze',seconds:180,source:'Jack Hartmann'},{id:'HpOe8lngp_o',title:'Animal Dance and Freeze',seconds:188,source:'Jack Hartmann'},{id:'f7Q1oJ4BLs0',title:'Simon Says',seconds:189,source:'DJ Raphi'},{id:'qSkVgH-4PKw',title:'The Dinosaur Dance',seconds:195,source:'Danny Go!'},{id:'nEUTY8n2iZo',title:'The Floor Is Lava Dance',seconds:193,source:'Danny Go!'},{id:'qQB-V4r-uMY',title:'The Monkey Dance',seconds:139,source:'Danny Go!'},{id:'DsUPVERZFlI',title:'The Wiggle Dance',seconds:175,source:'Danny Go!'},{id:'T8Df3VZCKUc',title:'The Robot Dance',seconds:180,source:'Danny Go!'},{id:'nvDLe3FHcuY',title:'Stomp Clap Dance',seconds:185,source:'Danny Go!'},{id:'-y5yuLuw7KQ',title:'Exercise Dance',seconds:190,source:'Danny Go!'},{id:'DzgwbVZr_VU',title:'Quicksand, Lava, Sharks + More!',seconds:1086,source:'Danny Go!'},{id:'AuEIIRbXMHU',title:'Summer Dance Challenge',seconds:2218,source:'Danny Go!'}];
function seed(){return {version:2,categories:[{id:'everyday',name:'Everyday Songs',songs:defaults}]}}function loadLibrary(){try{const x=JSON.parse(localStorage.getItem(LIBRARY_KEY)||'null');if(x&&Array.isArray(x.categories)&&x.categories.length)return x}catch(e){}const x=seed();localStorage.setItem(LIBRARY_KEY,JSON.stringify(x));return x}let songData=loadLibrary();
const categorySelect=document.getElementById('songCategory'),categoryNote=document.getElementById('categoryNote');function renderCategories(){songData=loadLibrary();const saved=localStorage.getItem(ACTIVE_KEY)||songData.categories[0].id;categorySelect.innerHTML=`<option value="all">All Songs</option>`+songData.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');categorySelect.value=saved==='all'||songData.categories.some(c=>c.id===saved)?saved:songData.categories[0].id;updateCategoryNote()}function activeLibrary(){if(categorySelect.value==='all'){const seen=new Map();songData.categories.flatMap(c=>c.songs||[]).forEach(s=>{const k=(s.uid||s.id)+'|'+s.id;if(!seen.has(k))seen.set(k,s)});return [...seen.values()]}const c=songData.categories.find(x=>x.id===categorySelect.value);return c&&Array.isArray(c.songs)?c.songs:[]}function updateCategoryNote(){const n=activeLibrary().length,cat=categorySelect.options[categorySelect.selectedIndex]?.text||'Songs';categoryNote.textContent=`${n} song${n===1?'':'s'} available from ${cat}`;pick.disabled=n===0}
function localDateKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function loadMovementHistory(){try{const h=JSON.parse(localStorage.getItem(MOVEMENT_HISTORY_KEY)||'{}');return {days:Array.isArray(h.days)?h.days.filter(x=>x&&x.date&&Array.isArray(x.ids)):[]}}catch(e){return {days:[]}}}function avoidanceIds(){const h=loadMovementHistory(),today=localDateKey(),todayRow=h.days.find(x=>x.date===today),prior=h.days.filter(x=>x.date!==today).sort((a,b)=>b.date.localeCompare(a.date))[0],ids=new Set();if(todayRow)todayRow.ids.forEach(id=>ids.add(id));if(prior)prior.ids.forEach(id=>ids.add(id));return ids}function rememberMovement(chosen){const h=loadMovementHistory(),today=localDateKey();let row=h.days.find(x=>x.date===today);if(!row){row={date:today,ids:[]};h.days.push(row)}chosen.forEach(x=>{if(!row.ids.includes(x.id))row.ids.push(x.id)});h.days=h.days.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);localStorage.setItem(MOVEMENT_HISTORY_KEY,JSON.stringify(h))}
let session=[],currentIndex=0,lastSignature='',previousPickIds=avoidanceIds(),ytPlayer=null,ytReady=false,pendingStart=false;const timeSelect=document.getElementById('movementTime'),custom=document.getElementById('customTime'),pick=document.getElementById('pickButton'),preview=document.getElementById('preview'),previewTitle=document.getElementById('previewTitle'),previewText=document.getElementById('previewText'),sessionList=document.getElementById('sessionList');function minutesTarget(){return timeSelect.value==='custom'?Math.max(1,Math.min(60,+custom.value||1)):+timeSelect.value}function fmt(sec){const m=Math.floor(sec/60),s=Math.round(sec%60);return `${m}:${String(s).padStart(2,'0')}`}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function buildSession(targetMin){const library=activeLibrary();if(!library.length)return null;const target=targetMin*60,tolerance=Math.max(45,Math.min(120,target*.08));let freshLibrary=library.filter(x=>!previousPickIds.has(x.id));if(!freshLibrary.length)freshLibrary=library;let best=null,bestDiff=Infinity;for(let attempt=0;attempt<600;attempt++){const pool=shuffle(freshLibrary),chosen=[];let total=0;for(const clip of pool){const before=Math.abs(target-total),after=Math.abs(target-(total+(clip.seconds||180)));if(after<before||total<target*.45){chosen.push(clip);total+=clip.seconds||180}if(Math.abs(target-total)<=tolerance)break}if(!chosen.length)continue;const diff=Math.abs(target-total),sig=chosen.map(x=>x.id).sort().join('|');if(sig!==lastSignature&&diff<bestDiff){best={chosen,total,sig};bestDiff=diff;if(diff<=20)break}}if(!best){const c=freshLibrary.reduce((a,b)=>Math.abs((b.seconds||180)-target)<Math.abs((a.seconds||180)-target)?b:a);best={chosen:[c],total:c.seconds||180,sig:c.id}}lastSignature=best.sig;best.chosen.forEach(x=>previousPickIds.add(x.id));rememberMovement(best.chosen);return best}
function renderSession(){const total=session.reduce((n,x)=>n+(x.seconds||180),0),first=session[0],cat=categorySelect.options[categorySelect.selectedIndex]?.text||'selected songs';previewTitle.textContent=`Eddie picked ${session.length} video${session.length===1?'':'s'}!`;previewText.textContent=`About ${fmt(total)} from ${cat}. Tap play to start.`;sessionList.innerHTML=session.map(x=>`<span class="session-chip">${x.title} · ${fmt(x.seconds||180)}</span>`).join('');preview.classList.add('has-pick');preview.style.backgroundImage=`url(https://i.ytimg.com/vi/${first.id}/hqdefault.jpg)`;preview.tabIndex=0}function clearPick(){session=[];preview.classList.remove('has-pick');preview.style.backgroundImage='';preview.removeAttribute('tabindex');previewTitle.textContent='Ready for a movement break?';previewText.textContent='Choose a song list and a time, then let Eddie build the session.';sessionList.innerHTML=''}
timeSelect.addEventListener('change',()=>{custom.classList.toggle('show',timeSelect.value==='custom');clearPick()});custom.addEventListener('input',clearPick);categorySelect.addEventListener('change',()=>{localStorage.setItem(ACTIVE_KEY,categorySelect.value);updateCategoryNote();clearPick()});pick.addEventListener('click',()=>{const built=buildSession(minutesTarget());if(!built)return alert('This song category is empty. Add songs from Teacher Mode first.');session=built.chosen;renderSession()});
const player=document.getElementById('player'),progress=document.getElementById('playerProgress');function currentClip(){return session[currentIndex]}function updateProgress(){const clip=currentClip();if(!clip)return;progress.textContent=`Video ${currentIndex+1} of ${session.length} · ${clip.title} · Session ${fmt(session.reduce((n,x)=>n+(x.seconds||180),0))}`;document.getElementById('playerSession').textContent=clip.source||'Movement Session'}function playCurrent(){const clip=currentClip();if(!clip){finishMovement();return}updateProgress();if(ytReady&&ytPlayer){ytPlayer.loadVideoById(clip.id);setTimeout(()=>{try{ytPlayer.playVideo()}catch(e){}},120)}else pendingStart=true}function startMovement(){if(!session.length)return;currentIndex=0;player.classList.add('open');playCurrent()}preview.addEventListener('click',startMovement);preview.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&session.length){e.preventDefault();startMovement()}});document.getElementById('nextVideo').onclick=()=>{currentIndex++;playCurrent()};document.getElementById('playerClose').onclick=()=>{if(ytPlayer&&ytPlayer.stopVideo)ytPlayer.stopVideo();player.classList.remove('open')};document.getElementById('finishSession').onclick=finishMovement;function finishMovement(){if(ytPlayer&&ytPlayer.stopVideo)ytPlayer.stopVideo();player.classList.remove('open');document.getElementById('complete').classList.add('open')}document.getElementById('doneButton').onclick=()=>document.getElementById('complete').classList.remove('open');window.onYouTubeIframeAPIReady=function(){ytPlayer=new YT.Player('youtubePlayer',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,origin:window.location.origin},events:{onReady:()=>{ytReady=true;if(pendingStart){pendingStart=false;playCurrent()}},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){currentIndex++;playCurrent()}},onError:()=>{currentIndex++;playCurrent()}}})};const yt=document.createElement('script');yt.src='https://www.youtube.com/iframe_api';document.head.appendChild(yt);
const manage=document.getElementById('manageSongs');if(sessionStorage.getItem('eea-teacher-unlocked')==='1')manage.classList.add('show');manage.onclick=()=>location.href='movement-song-library.html';renderCategories();window.addEventListener('focus',()=>{renderCategories();clearPick()});
</script></body></html>
