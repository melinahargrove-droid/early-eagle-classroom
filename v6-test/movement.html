<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Movement</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:#dfe9e8}button,select,input{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(180deg,rgba(248,249,243,.09),rgba(231,240,237,.14)),url("https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png") center/cover no-repeat}.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 62% 43%,rgba(255,255,255,.09),transparent 55%)}
.close{position:absolute;z-index:50;top:2.2vh;right:2vw;width:clamp(50px,3.7vw,70px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(72,104,121,.26);background:rgba(255,252,245,.9);color:#173f72;font-size:clamp(27px,2.1vw,39px);font-weight:900;cursor:pointer;box-shadow:0 5px 13px rgba(45,71,86,.10),inset 0 0 0 3px rgba(255,255,255,.36)}
.eddie-wrap{position:absolute;z-index:13;left:1.8vw;bottom:1.3vh;width:27vw;height:80vh;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}.eddie{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 9px 8px rgba(43,68,81,.12))}.sparkle{position:absolute;z-index:14;color:#d8b76b;text-shadow:0 1px 0 rgba(255,255,255,.9);pointer-events:none}.s1{left:23vw;top:26vh;font-size:3vw}.s2{left:27vw;top:42vh;font-size:2vw}.s3{left:22vw;top:58vh;font-size:2.3vw}
.workspace{position:absolute;z-index:15;left:30.5vw;top:11.6vh;width:64.6vw;height:86.2vh}.preview{position:absolute;left:0;right:0;top:0;height:72%;overflow:hidden;border-radius:34px;background:linear-gradient(180deg,rgba(210,231,232,.96),rgba(178,210,216,.96));border:2px solid rgba(83,115,128,.18);box-shadow:0 13px 28px rgba(43,68,80,.12),inset 0 0 0 7px rgba(255,253,246,.34);display:flex;align-items:center;justify-content:center;text-align:center;padding:2vh 3vw;transition:transform .16s ease,box-shadow .16s ease}.preview::after{content:"";position:absolute;inset:10px;border-radius:26px;border:1px solid rgba(255,255,255,.30);pointer-events:none}.preview.has-pick{background-size:cover;background-position:center;cursor:pointer}.preview.has-pick::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(220,235,231,.70),rgba(190,217,218,.78));backdrop-filter:blur(1.5px)}.preview.has-pick:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(43,68,80,.15),inset 0 0 0 7px rgba(255,253,246,.38)}.preview-copy{position:relative;z-index:2;width:88%}.play{margin:0 auto;width:clamp(86px,7.3vw,138px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;padding-left:.42em;background:rgba(255,252,244,.94);border:2px solid rgba(92,126,145,.20);color:#6c93aa;font-size:clamp(42px,4vw,76px);box-shadow:0 8px 17px rgba(35,70,91,.10),inset 0 0 0 5px rgba(255,255,255,.42)}.preview.has-pick .play{background:rgba(255,252,244,.97);box-shadow:0 9px 20px rgba(35,70,91,.18),inset 0 0 0 5px rgba(255,255,255,.44)}.preview strong{display:block;margin-top:1.55vh;font-size:clamp(30px,2.45vw,47px);line-height:1.03;color:#173f72;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.7)}.preview span{display:block;margin-top:.85vh;font-size:clamp(17px,1.18vw,23px);font-weight:900;color:#496f70}.session-list{display:flex;flex-wrap:wrap;justify-content:center;gap:.75vh .7vw;margin-top:1.45vh}.session-chip{background:rgba(255,252,244,.88);border:1.3px solid rgba(84,116,128,.17);border-radius:999px;padding:.52vh .85vw;font-size:clamp(12px,.82vw,16px);font-weight:900;color:#355f75;box-shadow:0 2px 5px rgba(55,75,85,.05)}
.controls{position:absolute;left:1%;right:1%;bottom:0;height:23%;display:grid;grid-template-columns:minmax(250px,.82fr) minmax(300px,1.18fr);gap:1vh 2vw;align-items:center;padding:1.25vh 1.4vw;border-radius:28px;background:linear-gradient(180deg,rgba(255,253,247,.86),rgba(248,244,233,.82));border:1.7px solid rgba(108,121,107,.15);box-shadow:0 8px 20px rgba(53,71,78,.08),inset 0 0 0 4px rgba(255,255,255,.28)}.time-box{align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:0 .75vw}.time-box label{font-size:clamp(19px,1.34vw,26px);font-weight:900;color:#4f6f61;margin-bottom:.65vh;text-shadow:0 1px 0 rgba(255,255,255,.75)}.select-wrap{display:flex;gap:.6vw;position:relative}.select-wrap select,.custom-time{width:100%;height:clamp(60px,7.2vh,84px);border-radius:20px;border:1.8px solid rgba(82,116,142,.23);background:linear-gradient(180deg,#fffef9,#f8f3e9);color:#173f72;padding:0 1.3vw;font-size:clamp(23px,1.68vw,33px);font-weight:900;box-shadow:0 4px 9px rgba(52,76,88,.06),inset 0 0 0 3px rgba(255,255,255,.32)}.custom-time{display:none;width:42%}.custom-time.show{display:block}.pick-button{height:clamp(68px,8.2vh,96px);border-radius:24px;font-size:clamp(27px,2vw,39px);font-weight:900;cursor:pointer;border:2px solid rgba(69,105,132,.21);background:linear-gradient(180deg,#86adc8,#668eae);color:#fff;text-shadow:0 1px 1px rgba(34,67,91,.22);box-shadow:0 7px 0 rgba(65,92,112,.15),0 11px 18px rgba(47,72,87,.10);transition:transform .14s ease,box-shadow .14s ease}.pick-button:hover{transform:translateY(-2px)}.pick-button:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(65,92,112,.15),0 6px 12px rgba(47,72,87,.08)}
.player{display:none;position:fixed;z-index:200;inset:1.5vh 1.5vw;border-radius:28px;overflow:hidden;background:#081722;box-shadow:0 0 0 100vmax rgba(14,31,42,.58);color:#fff}.player.open{display:flex;flex-direction:column}.player-top{height:9%;display:flex;align-items:center;justify-content:space-between;padding:0 2vw;background:#102c3e}.player-top strong{font-size:clamp(19px,1.45vw,28px)}.player-close{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:30px;font-weight:900;cursor:pointer}.player-stage{position:relative;flex:1;min-height:0;background:#000}.youtube-frame{position:absolute;inset:0;width:100%;height:100%;background:#000}.youtube-frame iframe{display:block;width:100%!important;height:100%!important;border:0}.player-bottom{height:11%;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:1vw;padding:0 2vw;background:#102c3e}.progress{font-size:clamp(16px,1.05vw,22px);font-weight:800}.player-bottom button{border:0;border-radius:18px;padding:1.2vh 1.8vw;font-weight:900;cursor:pointer}.next-video{background:#f4f0e6;color:#173f72}.finish-session{background:#7ca8ca;color:white}.complete{display:none;position:fixed;z-index:210;inset:0;align-items:center;justify-content:center;background:rgba(239,245,239,.96);text-align:center;color:#173f72}.complete.open{display:flex}.complete-card{padding:5vh 6vw;border-radius:34px;background:rgba(255,252,244,.92);border:1.6px solid rgba(89,116,126,.16);box-shadow:0 15px 35px rgba(49,70,78,.12)}.complete-card h2{font-size:clamp(48px,4vw,78px);margin:0 0 1vh}.complete-card p{font-size:clamp(20px,1.5vw,30px);font-weight:800;color:#507069}.complete-card button{margin-top:2vh;border:0;border-radius:22px;background:#6d9abb;color:#fff;padding:1.6vh 3vw;font-size:clamp(22px,1.6vw,32px);font-weight:900;cursor:pointer}
</style></head><body><main class="stage"><button class="close" type="button" aria-label="Close Movement" onclick="window.location.href='index.html'">×</button><div class="eddie-wrap"><img class="eddie" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/Eddie%20Poses/Eddie_07_Movement.png" alt=""></div><div class="sparkle s1">✦</div><div class="sparkle s2">★</div><div class="sparkle s3">✦</div><section class="workspace"><div class="preview" id="preview" role="button" aria-label="Play Eddie's movement session"><div class="preview-copy"><div class="play">▶</div><strong id="previewTitle">Ready for a movement break?</strong><span id="previewText">Choose a time, then let Eddie build the session.</span><div class="session-list" id="sessionList"></div></div></div><div class="controls"><div class="time-box"><label for="movementTime">How long do we move?</label><div class="select-wrap"><select id="movementTime"><option value="3">3 minutes</option><option value="5" selected>5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="20">20 minutes</option><option value="25">25 minutes</option><option value="30">30 minutes</option><option value="custom">Custom...</option></select><input class="custom-time" id="customTime" type="number" min="1" max="60" value="12" aria-label="Custom movement minutes"></div></div><button class="pick-button" id="pickButton">Eddie Picks!</button></div></section></main>
<section class="player" id="player" aria-label="Movement video player"><div class="player-top"><strong id="playerSession">Movement Session</strong><button class="player-close" id="playerClose">×</button></div><div class="player-stage"><div class="youtube-frame" id="youtubeFrame"><div id="youtubePlayer"></div></div></div><div class="player-bottom"><div class="progress" id="playerProgress"></div><button class="next-video" id="nextVideo">Next Video →</button><button class="finish-session" id="finishSession">Finish Session</button></div></section>
<section class="complete" id="complete"><div class="complete-card"><h2>Great moving!</h2><p>Eddie’s movement break is finished.</p><button id="doneButton">Back to Movement</button></div></section>
<script>
const library=[
{id:'Nqg5zY0MOfI',title:'Move It and Freeze',seconds:180,source:'Jack Hartmann'},
{id:'HpOe8lngp_o',title:'Animal Dance and Freeze',seconds:188,source:'Jack Hartmann'},
{id:'f7Q1oJ4BLs0',title:'Simon Says',seconds:189,source:'DJ Raphi'},
{id:'qSkVgH-4PKw',title:'The Dinosaur Dance',seconds:195,source:'Danny Go!'},
{id:'nEUTY8n2iZo',title:'The Floor Is Lava Dance',seconds:193,source:'Danny Go!'},
{id:'qQB-V4r-uMY',title:'The Monkey Dance',seconds:139,source:'Danny Go!'},
{id:'DsUPVERZFlI',title:'The Wiggle Dance',seconds:175,source:'Danny Go!'},
{id:'T8Df3VZCKUc',title:'The Robot Dance',seconds:180,source:'Danny Go!'},
{id:'nvDLe3FHcuY',title:'Stomp Clap Dance',seconds:185,source:'Danny Go!'},
{id:'-y5yuLuw7KQ',title:'Exercise Dance',seconds:190,source:'Danny Go!'},
{id:'DzgwbVZr_VU',title:'Quicksand, Lava, Sharks + More!',seconds:1086,source:'Danny Go!'},
{id:'AuEIIRbXMHU',title:'Summer Dance Challenge',seconds:2218,source:'Danny Go!'}
];
let session=[],currentIndex=0,lastSignature='',lastFirstId='',ytPlayer=null,ytReady=false,pendingStart=false;
const timeSelect=document.getElementById('movementTime'),custom=document.getElementById('customTime'),pick=document.getElementById('pickButton'),preview=document.getElementById('preview'),previewTitle=document.getElementById('previewTitle'),previewText=document.getElementById('previewText'),sessionList=document.getElementById('sessionList');
function minutesTarget(){return timeSelect.value==='custom'?Math.max(1,Math.min(60,+custom.value||1)):+timeSelect.value}function fmt(sec){const m=Math.floor(sec/60),s=Math.round(sec%60);return `${m}:${String(s).padStart(2,'0')}`}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function buildSession(targetMin){const target=targetMin*60,tolerance=Math.max(45,Math.min(120,target*.08));let best=null,bestDiff=Infinity;for(let attempt=0;attempt<600;attempt++){const pool=shuffle(library),chosen=[];let total=0;for(const clip of pool){if(chosen.length===0&&clip.id===lastFirstId)continue;const before=Math.abs(target-total),after=Math.abs(target-(total+clip.seconds));if(after<before || total<target*.45){chosen.push(clip);total+=clip.seconds}if(Math.abs(target-total)<=tolerance)break}if(!chosen.length)continue;const diff=Math.abs(target-total),sig=chosen.map(x=>x.id).sort().join('|');if(sig!==lastSignature&&chosen[0].id!==lastFirstId&&diff<bestDiff){best={chosen,total,sig};bestDiff=diff;if(diff<=20)break}}if(!best){const candidates=library.filter(x=>x.id!==lastFirstId);const c=(candidates.length?candidates:library).reduce((a,b)=>Math.abs(b.seconds-target)<Math.abs(a.seconds-target)?b:a);best={chosen:[c],total:c.seconds,sig:c.id}}lastSignature=best.sig;lastFirstId=best.chosen[0].id;return best}
function renderSession(){const total=session.reduce((n,x)=>n+x.seconds,0),first=session[0];previewTitle.textContent=`Eddie picked ${session.length} video${session.length===1?'':'s'}!`;previewText.textContent=`About ${fmt(total)} of movement time. Tap play to start.`;sessionList.innerHTML=session.map(x=>`<span class="session-chip">${x.title} · ${fmt(x.seconds)}</span>`).join('');preview.classList.add('has-pick');preview.style.backgroundImage=`url(https://i.ytimg.com/vi/${first.id}/hqdefault.jpg)`;preview.tabIndex=0}
function clearPick(){session=[];preview.classList.remove('has-pick');preview.style.backgroundImage='';preview.removeAttribute('tabindex');previewTitle.textContent='Ready for a movement break?';previewText.textContent='Choose a time, then let Eddie build the session.';sessionList.innerHTML=''}timeSelect.addEventListener('change',()=>{custom.classList.toggle('show',timeSelect.value==='custom');clearPick()});custom.addEventListener('input',clearPick);pick.addEventListener('click',()=>{session=buildSession(minutesTarget()).chosen;renderSession()});
const player=document.getElementById('player'),progress=document.getElementById('playerProgress');function currentClip(){return session[currentIndex]}function updateProgress(){const clip=currentClip();if(!clip)return;progress.textContent=`Video ${currentIndex+1} of ${session.length} · ${clip.title} · Session ${fmt(session.reduce((n,x)=>n+x.seconds,0))}`;document.getElementById('playerSession').textContent=clip.source}
function playCurrent(){const clip=currentClip();if(!clip){finishMovement();return}updateProgress();if(ytReady&&ytPlayer){ytPlayer.loadVideoById(clip.id);setTimeout(()=>{try{ytPlayer.playVideo()}catch(e){}},120)}else pendingStart=true}
function startMovement(){if(!session.length)return;currentIndex=0;player.classList.add('open');playCurrent()}
preview.addEventListener('click',startMovement);preview.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&session.length){e.preventDefault();startMovement()}});document.getElementById('nextVideo').onclick=()=>{currentIndex++;playCurrent()};document.getElementById('playerClose').onclick=()=>{if(ytPlayer&&ytPlayer.stopVideo)ytPlayer.stopVideo();player.classList.remove('open')};document.getElementById('finishSession').onclick=finishMovement;function finishMovement(){if(ytPlayer&&ytPlayer.stopVideo)ytPlayer.stopVideo();player.classList.remove('open');document.getElementById('complete').classList.add('open')}document.getElementById('doneButton').onclick=()=>document.getElementById('complete').classList.remove('open');
window.onYouTubeIframeAPIReady=function(){ytPlayer=new YT.Player('youtubePlayer',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,origin:window.location.origin},events:{onReady:()=>{ytReady=true;if(pendingStart){pendingStart=false;playCurrent()}},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){currentIndex++;playCurrent()}},onError:e=>{console.warn('Movement video error',e.data);currentIndex++;playCurrent()},onAutoplayBlocked:()=>{console.warn('Autoplay blocked; tap the YouTube play control.')}}})};
const yt=document.createElement('script');yt.src='https://www.youtube.com/iframe_api';document.head.appendChild(yt);
</script></body></html>
