<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Movement</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#dfe9e8}button,select,input{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(180deg,rgba(248,249,243,.16),rgba(231,240,237,.22)),url("https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png") center/cover no-repeat}.close{position:absolute;z-index:50;top:2.2vh;right:2vw;width:clamp(50px,3.7vw,70px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(70,100,117,.3);background:rgba(255,253,247,.94);color:#173f72;font-size:clamp(27px,2.1vw,39px);font-weight:900;cursor:pointer}.eddie-wrap{position:absolute;z-index:13;left:1.8vw;bottom:1.3vh;width:27vw;height:80vh;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}.eddie{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 7px rgba(43,68,81,.13))}.sparkle{position:absolute;z-index:14;color:#d7b15e;pointer-events:none}.s1{left:23vw;top:26vh;font-size:3vw}.s2{left:27vw;top:42vh;font-size:2vw}.s3{left:22vw;top:58vh;font-size:2.3vw}.workspace{position:absolute;z-index:15;left:30vw;top:7vh;width:64vw;height:85vh}.preview{position:absolute;left:0;right:0;top:0;height:72%;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,rgba(198,222,225,.96),rgba(172,205,214,.96));border:1px solid rgba(72,111,128,.16);box-shadow:0 12px 28px rgba(43,68,80,.11);display:flex;align-items:center;justify-content:center;text-align:center}.preview-copy{width:78%}.play{margin:0 auto;width:clamp(82px,7vw,132px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;padding-left:.45em;background:rgba(255,252,244,.92);color:#668ca3;font-size:clamp(42px,4vw,76px)}.preview strong{display:block;margin-top:1.5vh;font-size:clamp(29px,2.35vw,45px);color:#173f72}.preview span{display:block;margin-top:.9vh;font-size:clamp(16px,1.15vw,22px);font-weight:800;color:#4d6d78}.controls{position:absolute;left:1%;right:1%;bottom:0;height:23%;display:grid;grid-template-columns:minmax(250px,.82fr) minmax(300px,1.18fr);grid-template-rows:1fr 1fr;gap:1vh 2vw;align-items:center;padding:1.1vh 1.2vw;border-radius:24px;background:rgba(255,251,241,.73);border:1.3px solid rgba(92,119,130,.13)}.time-box{grid-row:1/3;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:0 .6vw}.time-box label{font-size:clamp(18px,1.3vw,25px);font-weight:900;color:#496b67;margin-bottom:.65vh}.select-wrap select{width:100%;height:clamp(58px,7vh,82px);border-radius:20px;border:2px solid rgba(74,112,143,.25);background:#fffef9;color:#173f72;padding:0 1.3vw;font-size:clamp(24px,1.75vw,34px);font-weight:900}.pick-button,.move-button{height:clamp(58px,7vh,82px);border-radius:22px;font-size:clamp(24px,1.8vw,35px);font-weight:900}.pick-button{border:2px solid rgba(75,108,126,.18);background:#faf8ef;color:#173f72}.move-button{border:2px solid rgba(55,94,135,.22);background:linear-gradient(180deg,#7ca8ca,#638fb5);color:#fff}
.edit-toggle{position:absolute;z-index:80;right:2vw;bottom:2vh;border:0;border-radius:18px;background:#173f72;color:white;padding:12px 18px;font-weight:900;cursor:pointer}.editor{display:none;position:absolute;z-index:79;right:2vw;bottom:8vh;width:300px;padding:16px;border-radius:20px;background:rgba(255,253,247,.97);box-shadow:0 10px 30px rgba(30,50,65,.2);color:#173f72}.editor.open{display:block}.editor h3{margin:0 0 10px;font-size:20px}.editor label{display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center;margin:8px 0;font-size:14px;font-weight:800}.editor input[type=range]{width:100%}.editor output{font-size:13px;text-align:right}.editor .actions{display:flex;gap:8px;margin-top:12px}.editor button{flex:1;border:0;border-radius:12px;padding:9px;font-weight:900;cursor:pointer}.copy{background:#6d9abb;color:#fff}.reset{background:#ece8df;color:#173f72}.editor small{display:block;margin-top:10px;line-height:1.3;color:#64757d}
</style></head><body><main class="stage"><button class="close" type="button" onclick="window.location.href='index.html'">×</button><div class="eddie-wrap"><img class="eddie" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/Eddie%20Poses/Eddie_07_Movement.png" alt=""></div><div class="sparkle s1">✦</div><div class="sparkle s2">★</div><div class="sparkle s3">✦</div><section class="workspace" id="workspace"><div class="preview"><div class="preview-copy"><div class="play">▶</div><strong>Ready for a movement break?</strong><span>Eddie will build a movement session that fits our time.</span></div></div><div class="controls"><div class="time-box"><label>How long do we move?</label><div class="select-wrap"><select><option>3 minutes</option><option selected>5 minutes</option><option>10 minutes</option><option>15 minutes</option><option>20 minutes</option><option>25 minutes</option><option>30 minutes</option><option>Custom...</option></select></div></div><button class="pick-button">Eddie Picks!</button><button class="move-button">Let’s Move!</button></div></section><button class="edit-toggle" id="editToggle">Edit Movement Screen</button><aside class="editor" id="editor"><h3>Movement Screen</h3><label>Left <input id="left" type="range" min="20" max="50" step=".1"><output id="leftOut"></output></label><label>Top <input id="top" type="range" min="0" max="25" step=".1"><output id="topOut"></output></label><label>Width <input id="width" type="range" min="35" max="78" step=".1"><output id="widthOut"></output></label><label>Height <input id="height" type="range" min="50" max="98" step=".1"><output id="heightOut"></output></label><div class="actions"><button class="copy" id="copy">Copy Values</button><button class="reset" id="reset">Reset</button></div><small>Resize and position the whole Movement screen. Copy Values when it looks right and send them to me.</small></aside></main><script>
const defaults={left:30,top:7,width:64,height:85};const w=document.getElementById('workspace');const ids=['left','top','width','height'];function load(){let v=defaults;try{v={...defaults,...JSON.parse(localStorage.getItem('movementLayout')||'{}')}}catch(e){}ids.forEach(k=>document.getElementById(k).value=v[k]);apply()}function apply(){const v={};ids.forEach(k=>{v[k]=+document.getElementById(k).value;document.getElementById(k+'Out').value=v[k]+'%'});w.style.left=v.left+'vw';w.style.top=v.top+'vh';w.style.width=v.width+'vw';w.style.height=v.height+'vh';localStorage.setItem('movementLayout',JSON.stringify(v))}ids.forEach(k=>document.getElementById(k).addEventListener('input',apply));document.getElementById('editToggle').onclick=()=>document.getElementById('editor').classList.toggle('open');document.getElementById('reset').onclick=()=>{localStorage.removeItem('movementLayout');load()};document.getElementById('copy').onclick=async()=>{const v={};ids.forEach(k=>v[k]=+document.getElementById(k).value);const text=JSON.stringify({movement:v},null,2);try{await navigator.clipboard.writeText(text);document.getElementById('copy').textContent='Copied!';setTimeout(()=>document.getElementById('copy').textContent='Copy Values',1200)}catch(e){prompt('Copy these values:',text)}};load();
</script></body></html>
