<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Movement</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#dfe9e8}button,select,input{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(180deg,rgba(248,249,243,.16),rgba(231,240,237,.22)),url("https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png") center/cover no-repeat}.close{position:absolute;z-index:50;top:2.2vh;right:2vw;width:clamp(50px,3.7vw,70px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(70,100,117,.3);background:rgba(255,253,247,.94);color:#173f72;font-size:clamp(27px,2.1vw,39px);font-weight:900;cursor:pointer}.eddie-wrap{position:absolute;z-index:13;left:1.8vw;bottom:1.3vh;width:27vw;height:80vh;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}.eddie{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 7px rgba(43,68,81,.13))}.sparkle{position:absolute;z-index:14;color:#d7b15e;pointer-events:none}.s1{left:23vw;top:26vh;font-size:3vw}.s2{left:27vw;top:42vh;font-size:2vw}.s3{left:22vw;top:58vh;font-size:2.3vw}.workspace{position:absolute;z-index:15;left:30.5vw;top:11.6vh;width:64.6vw;height:86.2vh}.preview{position:absolute;left:0;right:0;top:0;height:72%;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,rgba(198,222,225,.96),rgba(172,205,214,.96));border:1px solid rgba(72,111,128,.16);box-shadow:0 12px 28px rgba(43,68,80,.11);display:flex;align-items:center;justify-content:center;text-align:center;padding:2vh 3vw}.preview-copy{width:88%}.play{margin:0 auto;width:clamp(82px,7vw,132px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;padding-left:.45em;background:rgba(255,252,244,.92);color:#668ca3;font-size:clamp(42px,4vw,76px)}.preview strong{display:block;margin-top:1.5vh;font-size:clamp(29px,2.35vw,45px);color:#173f72}.preview span{display:block;margin-top:.9vh;font-size:clamp(16px,1.15vw,22px);font-weight:800;color:#4d6d78}.session-list{display:flex;flex-wrap:wrap;justify-content:center;gap:.7vh .7vw;margin-top:1.5vh}.session-chip{background:rgba(255,253,247,.75);border:1px solid rgba(75,111,128,.18);border-radius:999px;padding:.55vh .85vw;font-size:clamp(12px,.8vw,16px);font-weight:800;color:#355f75}.controls{position:absolute;left:1%;right:1%;bottom:0;height:23%;display:grid;grid-template-columns:minmax(250px,.82fr) minmax(300px,1.18fr);grid-template-rows:1fr 1fr;gap:1vh 2vw;align-items:center;padding:1.1vh 1.2vw;border-radius:24px;background:rgba(255,251,241,.73);border:1.3px solid rgba(92,119,130,.13)}.time-box{grid-row:1/3;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:0 .6vw}.time-box label{font-size:clamp(18px,1.3vw,25px);font-weight:900;color:#496b67;margin-bottom:.65vh}.select-wrap{display:flex;gap:.6vw}.select-wrap select,.custom-time{width:100%;height:clamp(58px,7vh,82px);border-radius:20px;border:2px solid rgba(74,112,143,.25);background:#fffef9;color:#173f72;padding:0 1.3vw;font-size:clamp(22px,1.65vw,32px);font-weight:900}.custom-time{display:none;width:42%}.custom-time.show{display:block}.pick-button,.move-button{height:clamp(58px,7vh,82px);border-radius:22px;font-size:clamp(24px,1.8vw,35px);font-weight:900;cursor:pointer}.pick-button{border:2px solid rgba(75,108,126,.18);background:#faf8ef;color:#173f72}.move-button{border:2px solid rgba(55,94,135,.22);background:linear-gradient(180deg,#7ca8ca,#638fb5);color:#fff}.move-button:disabled{opacity:.45;cursor:not-allowed}
.player{display:none;position:fixed;z-index:200;inset:1.5vh 1.5vw;border-radius:28px;overflow:hidden;background:#17384e;box-shadow:0 0 0 100vmax rgba(14,31,42,.58);color:#fff}.player.open{display:flex;flex-direction:column}.player-top{height:11%;display:flex;align-items:center;justify-content:space-between;padding:0 2vw;background:rgba(12,35,51,.7)}.player-top strong{font-size:clamp(22px,1.7vw,34px)}.player-close{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:32px;font-weight:900;cursor:pointer}.player-stage{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 38%,#6b9db1,#244c63 72%)}.player-placeholder{max-width:70%}.player-placeholder .big-play{font-size:clamp(78px,8vw,150px);line-height:1}.player-placeholder h2{margin:1vh 0 .5vh;font-size:clamp(34px,3.2vw,62px)}.player-placeholder p{margin:0;font-size:clamp(18px,1.35vw,27px);font-weight:800}.player-bottom{height:14%;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:1vw;padding:0 2vw;background:rgba(12,35,51,.75)}.progress{font-size:clamp(18px,1.2vw,24px);font-weight:800}.player-bottom button{border:0;border-radius:18px;padding:1.4vh 2vw;font-weight:900;cursor:pointer}.next-test{background:#f4f0e6;color:#173f72}.finish-test{background:#7ca8ca;color:white}.complete{display:none;position:fixed;z-index:210;inset:0;align-items:center;justify-content:center;background:rgba(235,243,239,.96);text-align:center;color:#173f72}.complete.open{display:flex}.complete-card h2{font-size:clamp(48px,4vw,78px);margin:0 0 1vh}.complete-card p{font-size:clamp(20px,1.5vw,30px);font-weight:800}.complete-card button{margin-top:2vh;border:0;border-radius:22px;background:#6d9abb;color:#fff;padding:1.6vh 3vw;font-size:clamp(22px,1.6vw,32px);font-weight:900;cursor:pointer}
</style></head><body><main class="stage"><button class="close" type="button" onclick="window.location.href='index.html'">×</button><div class="eddie-wrap"><img class="eddie" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/Eddie%20Poses/Eddie_07_Movement.png" alt=""></div><div class="sparkle s1">✦</div><div class="sparkle s2">★</div><div class="sparkle s3">✦</div><section class="workspace"><div class="preview" id="preview"><div class="preview-copy"><div class="play">▶</div><strong id="previewTitle">Ready for a movement break?</strong><span id="previewText">Choose a time, then let Eddie build the session.</span><div class="session-list" id="sessionList"></div></div></div><div class="controls"><div class="time-box"><label>How long do we move?</label><div class="select-wrap"><select id="movementTime"><option value="3">3 minutes</option><option value="5" selected>5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="20">20 minutes</option><option value="25">25 minutes</option><option value="30">30 minutes</option><option value="custom">Custom...</option></select><input class="custom-time" id="customTime" type="number" min="1" max="60" value="12" aria-label="Custom movement minutes"></div></div><button class="pick-button" id="pickButton">Eddie Picks!</button><button class="move-button" id="moveButton" disabled>Let’s Move!</button></div></section></main>
<section class="player" id="player" aria-label="Movement video player"><div class="player-top"><strong id="playerSession">Movement Session</strong><button class="player-close" id="playerClose">×</button></div><div class="player-stage"><div class="player-placeholder"><div class="big-play">▶</div><h2 id="nowPlaying">Movement Video</h2><p id="nowDuration"></p></div></div><div class="player-bottom"><div class="progress" id="playerProgress"></div><button class="next-test" id="nextTest">Next Video →</button><button class="finish-test" id="finishTest">Finish Session</button></div></section>
<section class="complete" id="complete"><div class="complete-card"><h2>Great moving!</h2><p>Eddie’s movement break is finished.</p><button id="doneButton">Back to Movement</button></div></section>
<script>
const library=[
{id:'stretch',title:'Stretch & Reach',seconds:185},{id:'freeze',title:'Freeze Dance',seconds:232},{id:'animals',title:'Animal Moves',seconds:278},{id:'jump',title:'Jump & Move',seconds:205},{id:'follow',title:'Follow the Leader',seconds:329},{id:'wiggle',title:'Wiggle Break',seconds:156},{id:'dance',title:'Dance Party',seconds:361},{id:'yoga',title:'Quick Kids Yoga',seconds:418},{id:'march',title:'March & Move',seconds:247},{id:'workout',title:'Mini Movement Workout',seconds:492},{id:'adventure',title:'Movement Adventure',seconds:536},{id:'calm',title:'Move & Cool Down',seconds:214}
];
let session=[],currentIndex=0,lastSignature='';
const timeSelect=document.getElementById('movementTime'),custom=document.getElementById('customTime'),pick=document.getElementById('pickButton'),move=document.getElementById('moveButton'),previewTitle=document.getElementById('previewTitle'),previewText=document.getElementById('previewText'),sessionList=document.getElementById('sessionList');
function minutesTarget(){return timeSelect.value==='custom'?Math.max(1,Math.min(60,+custom.value||1)):+timeSelect.value}
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function buildSession(targetMin){const target=targetMin*60,tolerance=75;let best=null,bestDiff=Infinity;for(let attempt=0;attempt<350;attempt++){const pool=shuffle(library),chosen=[];let total=0;for(const clip of pool){const before=Math.abs(target-total),after=Math.abs(target-(total+clip.seconds));if(after<before || total<target*.55){chosen.push(clip);total+=clip.seconds}if(Math.abs(target-total)<=tolerance)break}const diff=Math.abs(target-total);const sig=chosen.map(x=>x.id).sort().join('|');if(sig!==lastSignature&&diff<bestDiff){best={chosen,total,sig};bestDiff=diff;if(diff<=25)break}}if(!best){const c=library.reduce((a,b)=>Math.abs(b.seconds-target)<Math.abs(a.seconds-target)?b:a);best={chosen:[c],total:c.seconds,sig:c.id}}lastSignature=best.sig;return best}
function renderSession(){const total=session.reduce((n,x)=>n+x.seconds,0);previewTitle.textContent=`Eddie picked ${session.length} video${session.length===1?'':'s'}!`;previewText.textContent=`About ${fmt(total)} of movement time.`;sessionList.innerHTML=session.map(x=>`<span class="session-chip">${x.title} · ${fmt(x.seconds)}</span>`).join('');move.disabled=false}
timeSelect.addEventListener('change',()=>{custom.classList.toggle('show',timeSelect.value==='custom');session=[];move.disabled=true;previewTitle.textContent='Ready for a movement break?';previewText.textContent='Choose a time, then let Eddie build the session.';sessionList.innerHTML=''});custom.addEventListener('input',()=>{session=[];move.disabled=true});pick.addEventListener('click',()=>{session=buildSession(minutesTarget()).chosen;renderSession()});
const player=document.getElementById('player'),nowPlaying=document.getElementById('nowPlaying'),nowDuration=document.getElementById('nowDuration'),progress=document.getElementById('playerProgress');function showCurrent(){const clip=session[currentIndex];if(!clip){finishSession();return}nowPlaying.textContent=clip.title;nowDuration.textContent=`Video length: ${fmt(clip.seconds)}`;progress.textContent=`Video ${currentIndex+1} of ${session.length} · Session total ${fmt(session.reduce((n,x)=>n+x.seconds,0))}`}
move.addEventListener('click',()=>{if(!session.length)return;currentIndex=0;player.classList.add('open');showCurrent()});document.getElementById('nextTest').onclick=()=>{currentIndex++;showCurrent()};document.getElementById('playerClose').onclick=()=>player.classList.remove('open');document.getElementById('finishTest').onclick=finishSession;function finishSession(){player.classList.remove('open');document.getElementById('complete').classList.add('open')}document.getElementById('doneButton').onclick=()=>document.getElementById('complete').classList.remove('open');
</script></body></html>
