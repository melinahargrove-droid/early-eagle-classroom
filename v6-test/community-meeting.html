<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7,#f7f1e5 58%,#e5eee9);overflow:hidden}.top{position:absolute;left:2.5%;right:2.5%;top:2%;height:7%;display:flex;align-items:center;justify-content:space-between}.brand{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.7vw,14px)}.right{display:flex;align-items:center;gap:.7vw}.day{padding:.55vh 1vw;border-radius:999px;background:#dcecf0;color:#386d80;font-weight:900;font-size:clamp(10px,.72vw,14px)}.close{width:clamp(42px,2.8vw,54px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#174f7d;font-size:24px;font-weight:900;cursor:pointer}.stage{position:absolute;left:3.5%;right:3.5%;top:10%;bottom:9%;border:1.5px solid rgba(92,136,147,.18);border-radius:34px;background:#fffef9;box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.card{position:absolute;inset:4% 4% 10%;display:none;align-items:center;justify-items:center;text-align:center}.card.active{display:grid}.visualCard{inset:0 4%;place-items:center}.visualCard .visual{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform:translateY(-6.5%)}.visualCard .visual img{display:block;max-width:92%;max-height:82%;width:auto;height:auto;object-fit:contain;object-position:center;margin:auto}.promptBox{width:min(74vw,1200px);padding:5vh 5vw;border-radius:30px;background:#f7fbfa;border:2px solid #d6e6e7;box-shadow:0 12px 30px rgba(58,79,77,.06)}.promptBox .kicker{color:#6f9298;font-size:clamp(16px,1.2vw,24px);font-weight:900;letter-spacing:.08em}.promptBox h1{margin:2vh 0 0;color:#174f7d;font-size:clamp(46px,4.6vw,88px);line-height:1.05}.promptBox .sub{margin-top:2vh;color:#557876;font-size:clamp(22px,1.8vw,34px);font-weight:900}.gameIcon{font-size:clamp(92px,10vw,190px);line-height:1}.gameTitle{font-size:clamp(54px,5.5vw,104px);margin:.5vh 0;color:#174f7d}.gameCue{color:#4f765e;font-size:clamp(25px,2vw,40px);font-weight:900}.nav{position:absolute;left:3%;right:3%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:1.8%;transform:translateX(-50%);border:1px solid #d4e0df;border-radius:999px;background:#fffdf8;color:#315f70;padding:.55vh 1.1vw;font-weight:900;font-size:clamp(10px,.7vw,13px);cursor:pointer;z-index:12}.panel{position:absolute;z-index:10;left:20%;right:20%;bottom:6.5%;padding:1.4vh 1.4vw;border-radius:20px;background:#fffdf9;border:1.5px solid #c9dce0;box-shadow:0 12px 30px #0002;display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}</style></head><body><main class="page"><header class="top"><div class="brand">EARLY EAGLE ACADEMY · COMMUNITY MEETING</div><div class="right"><div class="day">WEEK 1 · MONDAY</div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="card visualCard active" data-note="Sit comfortably. Invite children to close their eyes if they are comfortable. Put a hand on the belly. Breathe in and fill the belly like a balloon, then slowly let the air out. Count in 1, 2, 3 and out 1, 2, 3 for about 30 seconds. Notice how children respond to quiet breathing."><div class="visual"><img src="assets/lesson-visuals/ChatGPT%20Image%20Sep%2013,%202026,%2005_41_03%20PM.png" alt="Belly Breaths visual"></div></div><div class="card" data-note="Ask: How do you feel about starting school this year? Allow a few children to share. Let children know others will have a turn on other days this week, and keep track so each child's voice is heard. Use Feelings Communications visuals as needed."><div class="promptBox"><div class="kicker">CONVERSATION PROMPT</div><h1>How do you feel about starting school this year?</h1><div class="sub">Everyone’s voice matters.</div></div></div><div class="card" data-note="Sit in a circle and introduce a soft ball as the Name Ball. Toss it gently from child to child. When a child has the ball, they communicate their name in any way that works for them and according to their mood. The group echoes the name in the same manner. Children may point to or hold up a name card instead of saying their name aloud."><div><div class="gameIcon">🔴</div><h1 class="gameTitle">Name Ball</h1><div class="gameCue">Say your name. We echo it back.</div></div></div><div class="nav"><button class="prev" id="prev">← Day Overview</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ Teacher Note</button><div class="panel" id="panel"></div></main><script>(()=>{const p=new URLSearchParams(location.search),runner=p.get('eeaRunner')==='1',cards=[...document.querySelectorAll('.card')],dots=document.getElementById('dots'),prev=document.getElementById('prev'),next=document.getElementById('next'),panel=document.getElementById('panel');let i=0;const overviewUrl=()=>`daily-lessons.html?week=1&day=0&v=${Date.now()}`;cards.forEach(()=>{const d=document.createElement('span');d.className='dot';dots.appendChild(d)});function render(){cards.forEach((c,n)=>c.classList.toggle('active',n===i));[...dots.children].forEach((d,n)=>d.classList.toggle('active',n===i));prev.textContent=i===0?'← Day Overview':'← Previous';next.textContent=i===cards.length-1?'Done ✓':'Next →';panel.classList.remove('open');panel.textContent=cards[i].dataset.note||''}prev.onclick=()=>{if(i>0){i--;render()}else location.href=overviewUrl()};next.onclick=()=>{if(i<cards.length-1){i++;render()}else if(!runner)location.href=overviewUrl()};document.getElementById('closeBtn').onclick=()=>location.href=overviewUrl();document.getElementById('teacher').onclick=()=>panel.classList.toggle('open');render()})();</script></body></html>
