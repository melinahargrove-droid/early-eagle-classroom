<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Install Early Eagle Academy Classroom Companion</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#174e88"><link rel="apple-touch-icon" href="assets/pwa-icon-192.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#d9e4e7;font-family:"Trebuchet MS",Arial,sans-serif;color:#123d78}.card{width:min(680px,92vw);background:#fffaf0;border:3px solid #7ea3c2;border-radius:30px;padding:42px;text-align:center;box-shadow:0 16px 45px #3456}.icon{width:150px;height:150px;border-radius:30px;object-fit:cover}h1{font-size:clamp(28px,5vw,48px);margin:18px 0 8px}.sub{font-size:20px;line-height:1.5;margin:0 0 26px}.btn{border:0;border-radius:18px;padding:17px 30px;background:#174e88;color:white;font-size:22px;font-weight:800;cursor:pointer}.btn[hidden]{display:none}.open{display:inline-block;margin-top:18px;color:#174e88;font-weight:800;font-size:18px}.help{margin-top:24px;font-size:15px;line-height:1.45;color:#486987}</style></head><body><main class="card"><img class="icon" src="assets/pwa-icon-512.png" alt="Eddie the Eagle"><h1>Early Eagle Academy</h1><p class="sub">Classroom Companion</p><button class="btn" id="install" hidden>Install Classroom Companion</button><br><a class="open" href="index.html">Open Companion</a><p class="help" id="help">On Chrome or Edge, the Install button will appear when the browser is ready. You can also use the browser menu and choose Install Early Eagle Academy Classroom Companion.</p></main><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(console.error)}let promptEvent=null;const btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;btn.hidden=false});btn.addEventListener('click',async()=>{if(!promptEvent)return;promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;btn.hidden=true});window.addEventListener('appinstalled',()=>{btn.hidden=true;document.getElementById('help').textContent='Installed! You can now open the Classroom Companion from your Start menu or desktop app list.'});</script></body></html>
