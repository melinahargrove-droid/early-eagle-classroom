<style>
:root{--sign-top:-12px;--sign-bg-y:-34px;--title-y:14px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background-color:#eef5f6;background-image:url("assets/page-background.webp");background-size:cover;background-position:center;background-repeat:no-repeat}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:radial-gradient(circle at 15% 8%,rgba(255,255,255,.82),transparent 24%),radial-gradient(circle at 84% 14%,rgba(215,230,234,.62),transparent 25%),linear-gradient(180deg,#eef4f2,#f7f1e6)}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;padding:1.5vh 2.4vw 1.7vh}.header{position:relative;height:17vh}.title-board{position:absolute;left:10.1%;top:-12px;width:40.5%;height:14.8vh;display:flex;align-items:flex-start;justify-content:center;border:0;box-shadow:none;overflow:visible}.title-board:before,.title-board:after{content:none}.title-sign-img{position:absolute;left:50%;top:-34px;width:100%;height:auto;transform:translateX(-50%);display:block;pointer-events:none;user-select:none;z-index:0}.title-board h1{position:relative;z-index:1;margin:0;padding-top:calc(4.25vh + 14px);font-size:clamp(32px,2.75vw,53px);line-height:1;color:#173f72;font-weight:900;letter-spacing:.002em;text-shadow:none}.controls{position:absolute;right:5.1vw;top:1.35vh;height:10.4vh;display:flex;align-items:center;gap:.48vw}.chooser{height:92%;width:19.8vw;min-width:282px;display:grid;grid-template-columns:1fr auto;gap:.65vw;align-items:center;padding:.7vh .7vw .7vh 1vw;border:1.2px solid rgba(106,149,181,.48);border-radius:20px;background:radial-gradient(circle at 22% 20%,rgba(255,255,255,.72),transparent 34%),linear-gradient(180deg,rgba(255,253,248,.97),rgba(249,246,239,.95));box-shadow:0 2px 6px rgba(45,75,100,.04),inset 0 0 0 1px rgba(255,255,255,.38)}.person{min-width:0;height:100%;display:flex;align-items:center;justify-content:flex-start;gap:.55vw}.friend-photo{width:clamp(52px,4vw,76px);aspect-ratio:1;border-radius:50%;border:2px solid #789fbe;background:radial-gradient(circle at 45% 35%,#fff 0 18%,transparent 19%),linear-gradient(180deg,#dbeaf0,#f8f2e8);display:none;align-items:center;justify-content:center;color:#7890a2;font-size:clamp(10px,.7vw,14px);font-weight:800;overflow:hidden;flex:0 0 auto}.friend-photo img{width:100%;height:100%;object-fit:cover}.person.show-photo .friend-photo{display:flex}.namebox{flex:1;min-width:0;text-align:center;line-height:1}.namebox .label{display:block;font-size:clamp(9px,.6vw,12px);color:#6d8395;font-weight:900;margin-bottom:.18vh;text-transform:uppercase;letter-spacing:.035em}.friend-name{display:block;margin-top:.35vh;padding-bottom:.16em;line-height:1.16;font-size:clamp(27px,2.05vw,40px);font-weight:900;color:#173f72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick-btn,.timer-btn,.ctrl-btn,.close-btn{color:#173f72;font-weight:900;cursor:pointer;border:1.15px solid rgba(106,149,181,.48);background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.82),transparent 34%),linear-gradient(180deg,rgba(255,253,248,.98),rgba(247,243,235,.95));box-shadow:0 1px 4px rgba(45,75,100,.035),inset 0 0 5px rgba(255,255,255,.28)}.pick-btn{min-width:clamp(62px,4.6vw,88px);height:clamp(44px,3.25vw,60px);padding:0 .9vw;border-radius:15px;background:linear-gradient(180deg,rgba(236,216,181,.98),rgba(221,190,145,.96));border-color:rgba(151,112,68,.42);font-size:clamp(13px,.95vw,18px);box-shadow:0 1px 4px rgba(84,63,39,.04)}.timer-btn{width:clamp(43px,3.05vw,58px);height:clamp(43px,3.05vw,58px);border-radius:50%;font-size:clamp(19px,1.4vw,26px)}.ctrl-btn{height:5.8vh;min-height:43px;padding:0 .85vw;border-radius:15px;font-size:clamp(12px,.86vw,17px)}.close-btn{position:absolute;right:.2vw;top:.35vh;width:clamp(44px,3.3vw,62px);aspect-ratio:1;border-radius:50%;font-size:clamp(25px,1.9vw,36px);z-index:20}button:hover{transform:translateY(-2px)}button:active{transform:scale(.96)}.grid{height:80vh;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.8vh 1.2vw}.card{position:relative;border-radius:26px;border:1.6px solid rgba(110,151,184,.56);background-color:#fbf6ea;background-image:url("assets/card-paper.webp");background-size:cover;background-position:center;background-repeat:no-repeat;box-shadow:0 3px 8px rgba(57,77,92,.055),inset 0 0 0 1px rgba(255,255,255,.48);overflow:hidden;cursor:pointer;transition:transform .16s ease,filter .16s ease}.card:hover{transform:translateY(-3px) scale(1.015);filter:drop-shadow(0 7px 7px rgba(35,76,119,.13))}.card:active{transform:scale(.985)}.art{position:absolute;left:4.2%;right:4.2%;top:3%;height:64.8%;border-radius:20px;background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;overflow:hidden}.scene{width:86%;height:82%;display:flex;align-items:center;justify-content:center}.center-asset{width:80%;height:80%;display:block;object-fit:contain;object-position:center;filter:drop-shadow(0 3px 3px rgba(57,68,72,.08))}.wood{position:absolute;left:5.2%;right:5.2%;top:54.8%;height:18.2%;display:flex;align-items:center;justify-content:center;background-image:url("assets/name-board.webp");background-size:100% auto;background-position:center;background-repeat:no-repeat;border:0;border-radius:0;box-shadow:none;color:#173f72;font-size:clamp(22px,1.62vw,32px);font-weight:900;text-shadow:none;z-index:5;padding:0 6%;box-sizing:border-box;text-align:center}.remaining{position:absolute;right:4.4%;top:4%;width:clamp(31px,2.15vw,42px);height:clamp(31px,2.15vw,42px);padding:0;border-radius:50%;border:1.2px solid rgba(106,149,181,.46);background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.88),transparent 34%),linear-gradient(180deg,rgba(255,253,247,.98),rgba(247,241,230,.95));box-shadow:0 1px 3px rgba(52,72,88,.035),inset 0 0 5px rgba(158,187,202,.045);display:flex;align-items:center;justify-content:center;color:#173f72;font-weight:900;font-size:clamp(12px,.86vw,17px);z-index:7}.capacity{position:absolute;left:5%;right:5%;bottom:7.1%;height:17%;display:flex;align-items:center;justify-content:center;gap:.28vw}.eagle{width:clamp(36px,2.62vw,52px);aspect-ratio:1;border:1.25px solid rgba(106,149,181,.55);border-radius:50%;background:rgba(255,252,244,.68);box-shadow:inset 0 0 5px rgba(132,167,191,.05);display:flex;align-items:center;justify-content:center;transition:transform .22s ease,background .22s ease}.eagle-token-img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;opacity:0;transform:scale(.35);transition:opacity .22s ease,transform .28s cubic-bezier(.2,.8,.25,1.25)}.eagle.used .eagle-token-img{opacity:1;transform:scale(1)}.eagle.used{border-color:transparent;background:transparent;animation:spotFill .38s ease-out}@keyframes spotFill{0%{transform:scale(.78)}55%{transform:scale(1.13)}100%{transform:scale(1)}}.full-layer{position:absolute;left:0;right:0;top:0;height:58%;display:none;z-index:12;pointer-events:none;background:transparent;overflow:visible}.card.full .full-layer{display:block;opacity:1;transform:translateY(0) rotate(0);animation:none}.card.full .art{filter:saturate(.78) opacity(.72)}.full-sign{position:absolute;left:3%;top:-1.5%;width:94%;height:74%;background-image:url("assets/center-full-sign.webp");background-size:contain;background-position:center top;background-repeat:no-repeat;border:0;border-radius:0;box-shadow:none;color:transparent;font-size:0;transform:none}.toast{position:absolute;left:50%;bottom:1.8vh;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;z-index:30;background:#173f72;color:#fff;border-radius:999px;padding:.75vh 1.35vw;font-weight:900;font-size:clamp(11px,.75vw,15px);transition:.18s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.card.center-confirm{animation:centerPressPop .48s cubic-bezier(.2,.75,.25,1)}.card.center-confirm .wood{animation:centerNameConfirm .55s ease-out}@keyframes centerPressPop{0%{transform:scale(1)}24%{transform:scale(.965)}62%{transform:scale(1.018)}100%{transform:scale(1)}}@keyframes centerNameConfirm{0%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.07);filter:brightness(1.08)}70%{transform:scale(1.035);filter:brightness(1.04)}100%{transform:scale(1);filter:brightness(1)}}.card.full .remaining{display:none}.card.full .capacity{visibility:visible}.card.full-nudge{animation:fullNudge .36s ease-out}@keyframes fullNudge{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}.card.closed .art{filter:grayscale(1) saturate(.08) opacity(.28)}.card.closed .wood{filter:grayscale(.9) saturate(.08) opacity(.52)}.card.closed .remaining,.card.closed .capacity{display:none}.closed-lock{position:absolute;left:50%;top:42%;width:clamp(112px,8.4vw,164px);aspect-ratio:1;transform:translate(-50%,-50%);background-image:url("assets/closed-lock.webp");background-size:contain;background-position:center;background-repeat:no-repeat;z-index:16;display:none;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(45,65,85,.11))}.card.closed .closed-lock{display:block;animation:closedLockIn .34s ease-out both}@keyframes closedLockIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.78)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}button,select,input,.wood,.friend-name,.remaining,.toast{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive}.eddie-mascot{position:absolute;left:2.9vw;top:-.35vh;width:144px;height:216px;z-index:2;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}.eddie-mascot img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;transition:opacity .12s ease}.eddie-mascot.react{animation:eddieReact .42s ease-out}@keyframes eddieReact{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-5px) scale(1.035)}100%{transform:translateY(0) scale(1)}}.grid{position:relative;z-index:5}
</style>

<body>
<div class="stage"><div class="eddie-mascot" id="eddieMascot" aria-hidden="true"><img id="eddieMascotImg" src="assets/eddie-idle.webp" alt=""></div><div class="header"><div class="title-board"><img class="title-sign-img" src="assets/title-sign.webp" alt=""><h1>Choose a Center</h1></div><div class="controls"><div class="chooser"><div class="person" id="person"><div class="friend-photo" id="friendPhoto"></div><div class="namebox"><span class="label">Who's Choosing?</span><span class="friend-name" id="friendName"></span></div></div><button class="pick-btn" id="pickBtn" aria-label="Pick a friend">Pick</button></div><button class="timer-btn" id="timerBtn" aria-label="10 second chooser">⏱</button><button class="ctrl-btn" id="undoBtn">Undo</button><button class="ctrl-btn" id="resetBtn">Reset</button></div><button class="close-btn" id="closeBtn" aria-label="Close">×</button></div><div class="grid" id="grid"></div><div class="toast" id="toast"></div></div>
<script>
const STUDENT_KEY='eea-students-v1',ATTENDANCE_KEY='eea-attendance-present',STAR_KEY='eea-current-star',SETTINGS_KEY='eea-app-settings',CENTER_KEY='eea-centers-config';
const FALLBACK=['Avery','Bentley','Blakely','Brantley','Dylan','Easton','Emersyn','Everleigh','Grayson','Harper','Hudson','Jaxson','Kinsley','Liam','Maverick','Oakley','Sawyer','Warren','Wyatt','Zoey'];
const DEFAULT_CENTERS=[{name:'Dramatic Play',capacity:4,open:true,picture:'assets/dramatic-play.webp'},{name:'Writing',capacity:4,open:true,picture:'assets/writing.webp'},{name:'Music',capacity:3,open:true,picture:'assets/music.webp'},{name:'Blocks',capacity:4,open:true,picture:'assets/blocks.webp'},{name:'Science',capacity:4,open:true,picture:'assets/science.webp'},{name:'Art',capacity:4,open:true,picture:'assets/art.webp'},{name:'Manipulatives',capacity:4,open:true,picture:'assets/manipulatives.webp'},{name:'Reading',capacity:4,open:true,picture:'assets/reading.webp'}];
function loadStudents(){try{const x=JSON.parse(localStorage.getItem(STUDENT_KEY)||'null');if(Array.isArray(x)&&x.length)return x.filter(s=>s&&s.active!==false&&String(s.name||'').trim()).map((s,i)=>({id:String(s.id||('s'+i)),name:String(s.name).trim(),photo:s.photo||'',audio:s.audio||''}))}catch(e){}return FALLBACK.map((name,i)=>({id:'s'+(i+1),name,photo:'',audio:''}))}
function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')||{}}catch(e){return {}}}
function loadCenters(){try{const x=JSON.parse(localStorage.getItem(CENTER_KEY)||'null');if(Array.isArray(x)&&x.length)return x.map((c,i)=>({name:String(c.name||DEFAULT_CENTERS[i]?.name||'Center'),cap:Math.max(1,Math.min(12,Number(c.capacity)||1)),open:c.open!==false,picture:c.picture||DEFAULT_CENTERS[i]?.picture||''}))}catch(e){}return DEFAULT_CENTERS.map(c=>({name:c.name,cap:c.capacity,open:c.open,picture:c.picture}))}
const students=loadStudents(),settings=loadSettings(),centers=loadCenters();function studentById(id){return students.find(s=>s.id===id)}function getCurrentStar(){return localStorage.getItem(STAR_KEY)||''}
function presentIds(){try{const a=JSON.parse(localStorage.getItem(ATTENDANCE_KEY)||'[]');if(!Array.isArray(a))return [];return a.map(v=>{let id=String(v);if(/^\d+$/.test(id)&&students[Number(id)])id=students[Number(id)].id;return id}).filter(id=>studentById(id))}catch(e){return []}}
function eligibleStudents(){const present=presentIds(),star=getCurrentStar();return students.filter(s=>present.includes(s.id)&&s.name!==star)}
const counts=centers.map(()=>0),closed=centers.map(c=>!c.open),centerHistory=[];let friendQueue=[],selectedFriendId='',selectionLocked=false,timerId=null,timerSeconds=10,selectionAudioCtx=null,eddieReturnTimer=null,chooserStarted=false,transitionPending=false,transitionTimer=null;const grid=document.getElementById('grid'),toast=document.getElementById('toast'),person=document.getElementById('person'),friendName=document.getElementById('friendName'),friendPhoto=document.getElementById('friendPhoto');function selectedStudent(){return studentById(selectedFriendId)}function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timeout);showToast.timeout=setTimeout(()=>toast.classList.remove('show'),1100)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderCenters(){grid.innerHTML=centers.map((center,index)=>{const remaining=center.cap-counts[index];const markers=Array.from({length:center.cap},(_,markerIndex)=>{const used=markerIndex<counts[index]?' used':'';return `<div class="eagle${used}"><img class="eagle-token-img" src="assets/eagle-token.webp" alt=""></div>`}).join('');const art=center.picture?`<img class="center-asset" src="${esc(center.picture)}" alt="${esc(center.name)} center">`:'';return `<div class="card ${remaining===0?'full':''} ${closed[index]?'closed':''}" data-index="${index}"><div class="closed-lock" aria-hidden="true"></div><div class="art"><div class="scene">${art}</div></div><div class="remaining">${remaining}</div><div class="wood">${esc(center.name)}</div><div class="capacity">${markers}</div><div class="full-layer"><div class="full-sign">CENTER FULL</div></div></div>`}).join('');document.querySelectorAll('.card').forEach(card=>{card.onclick=()=>chooseCenter(Number(card.dataset.index))})}
function playSelectionChime(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;if(!selectionAudioCtx)selectionAudioCtx=new AudioCtx();const ctx=selectionAudioCtx;if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime,gain=ctx.createGain(),osc=ctx.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(660,now);osc.frequency.exponentialRampToValueAtTime(820,now+.16);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.075,now+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+.24);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+.25)}catch(e){}}function playFullCenterSound(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;if(!selectionAudioCtx)selectionAudioCtx=new AudioCtx();const ctx=selectionAudioCtx;if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime,gain=ctx.createGain(),osc=ctx.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(520,now);osc.frequency.setValueAtTime(390,now+.16);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.065,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+.34);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+.36)}catch(e){}}function fullCenterNudge(index){const card=document.querySelector(`.card[data-index="${index}"]`);if(!card)return;card.classList.remove('full-nudge');void card.offsetWidth;card.classList.add('full-nudge')}function confirmCenterSelection(index){const card=document.querySelector(`.card[data-index="${index}"]`);if(card){card.classList.remove('center-confirm');void card.offsetWidth;card.classList.add('center-confirm')}playSelectionChime()}function setCenterClosed(index,isClosed){if(index<0||index>=centers.length)return;closed[index]=Boolean(isClosed);if(closed[index]){counts[index]=0;for(let i=centerHistory.length-1;i>=0;i--){if(centerHistory[i].index===index)centerHistory.splice(i,1)}}renderCenters()}function toggleCenterClosed(index){setCenterClosed(index,!closed[index])}const EDDIE_IDLE="assets/eddie-idle.webp",EDDIE_HAPPY="assets/eddie-happy.webp",EDDIE_UNAVAILABLE="assets/eddie-unavailable.webp";function setEddiePose(src,duration=900){const wrap=document.getElementById('eddieMascot'),img=document.getElementById('eddieMascotImg');if(!wrap||!img)return;clearTimeout(eddieReturnTimer);img.src=src;wrap.classList.remove('react');void wrap.offsetWidth;wrap.classList.add('react');eddieReturnTimer=setTimeout(()=>{img.src=EDDIE_IDLE;wrap.classList.remove('react')},duration)}function eddieHappy(){setEddiePose(EDDIE_HAPPY,900)}function eddieUnavailable(){setEddiePose(EDDIE_UNAVAILABLE,1000)}function finishCenterRoundIfNeeded(){if(!chooserStarted||friendQueue.length!==0||transitionPending)return;transitionPending=true;showToast('Everyone has chosen!');if(settings.autoStay===false)return;transitionTimer=setTimeout(()=>{window.location.href='stay-in-your-center.html'},900)}function chooseCenter(index){const s=selectedStudent();if(!s){showToast('Pick a friend first');return}if(selectionLocked){showToast('Pick the next friend first');return}if(closed[index]){eddieUnavailable();playFullCenterSound();showToast(`${centers[index].name} is closed`);return}const center=centers[index];if(counts[index]>=center.cap){eddieUnavailable();playFullCenterSound();fullCenterNudge(index);showToast(`${center.name} is full`);return}confirmCenterSelection(index);eddieHappy();centerHistory.push({index,friendId:s.id});selectionLocked=true;stopTimer();setTimeout(()=>{counts[index]++;renderCenters();showToast(`${s.name} chose ${center.name}`);finishCenterRoundIfNeeded()},260)}function refillFriendQueue(){const a=eligibleStudents().map(s=>s.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}friendQueue=a}function showFriend(id){const s=studentById(id);selectedFriendId=s?s.id:'';friendName.textContent=s?s.name:'';const showPhoto=!!settings.showPhotos&&s&&s.photo;person.classList.toggle('show-photo',!!showPhoto);friendPhoto.innerHTML=showPhoto?`<img src="${s.photo}" alt="">`:'';if(settings.nameAudio&&s&&s.audio){new Audio(s.audio).play().catch(()=>{})}}function pickFriend(){if(friendQueue.length===0){if(chooserStarted){showToast('Everyone has chosen');return}refillFriendQueue();chooserStarted=true;if(friendQueue.length===0){showToast('No eligible friends are present');return}}showFriend(friendQueue.shift());selectionLocked=false}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}timerSeconds=10;document.getElementById('timerBtn').textContent='⏱'}function startTimer(){const button=document.getElementById('timerBtn');if(selectionLocked){showToast('Pick the next friend first');return}if(!selectedStudent()){showToast('Pick a friend first');return}if(timerId){stopTimer();return}timerSeconds=10;button.textContent=timerSeconds;timerId=setInterval(()=>{timerSeconds--;button.textContent=timerSeconds;if(timerSeconds<=0){clearInterval(timerId);timerId=null;const openCenterIndexes=centers.map((center,index)=>!closed[index]&&counts[index]<center.cap?index:null).filter(index=>index!==null);if(openCenterIndexes.length){const chosen=openCenterIndexes[Math.floor(Math.random()*openCenterIndexes.length)];chooseCenter(chosen)}else{showToast('All centers are full');stopTimer()}}},1000)}document.getElementById('pickBtn').onclick=pickFriend;document.getElementById('timerBtn').onclick=startTimer;document.getElementById('undoBtn').onclick=()=>{if(transitionTimer){clearTimeout(transitionTimer);transitionTimer=null}transitionPending=false;const last=centerHistory.pop();if(!last){showToast('Nothing to undo');return}counts[last.index]=Math.max(0,counts[last.index]-1);if(selectedStudent()&&selectedFriendId!==last.friendId&&!selectionLocked)friendQueue.unshift(selectedFriendId);showFriend(last.friendId);selectionLocked=false;stopTimer();renderCenters();const s=studentById(last.friendId);showToast(`${s?s.name:'Friend'} can choose again`)};document.getElementById('resetBtn').onclick=()=>{if(transitionTimer){clearTimeout(transitionTimer);transitionTimer=null}transitionPending=false;chooserStarted=false;counts.fill(0);centerHistory.length=0;friendQueue.length=0;selectedFriendId='';selectionLocked=false;friendName.textContent='';person.classList.remove('show-photo');friendPhoto.innerHTML='';stopTimer();renderCenters();showToast('Centers reset')};document.getElementById('closeBtn').onclick=()=>{window.location.href='index.html'};renderCenters();
</script>
