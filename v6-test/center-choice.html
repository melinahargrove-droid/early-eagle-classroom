<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Center Choice</title><style>:root{--sign-top:-12px;--sign-bg-y:-34px;--title-y:14px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f6}body{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt",cursive;color:#173f72;background:radial-gradient(circle at 15% 8%,rgba(255,255,255,.82),transparent 24%),radial-gradient(circle at 84% 14%,rgba(215,230,234,.62),transparent 25%),linear-gradient(180deg,#eef4f2,#f7f1e6)}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;padding:1.5vh 2.4vw 1.7vh}.header{position:relative;height:17vh}.title-board{position:absolute;left:10.1%;top:-12px;width:40.5%;height:14.8vh;display:flex;align-items:flex-start;justify-content:center}.title-sign-img{position:absolute;left:50%;top:-34px;width:100%;transform:translateX(-50%);pointer-events:none}.title-board h1{position:relative;z-index:1;margin:0;padding-top:calc(4.25vh + 14px);font-size:clamp(32px,2.75vw,53px);line-height:1;font-weight:900}.controls{position:absolute;right:5.1vw;top:1.35vh;height:10.4vh;display:flex;align-items:center;gap:.48vw}.chooser{height:92%;width:19.8vw;min-width:282px;display:grid;grid-template-columns:1fr auto;gap:.65vw;align-items:center;padding:.7vh .7vw .7vh 1vw;border:1.2px solid rgba(106,149,181,.48);border-radius:20px;background:#fffdf8}.person{min-width:0;height:100%;display:flex;align-items:center;gap:.55vw}.friend-photo{width:clamp(52px,4vw,76px);aspect-ratio:1;border-radius:50%;border:2px solid #789fbe;display:none;overflow:hidden}.friend-photo img{width:100%;height:100%;object-fit:cover}.person.show-photo .friend-photo{display:flex}.namebox{flex:1;min-width:0;text-align:center}.label{display:block;font-size:11px;color:#6d8395;font-weight:900;text-transform:uppercase}.friend-name{display:block;font-size:clamp(27px,2.05vw,40px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick-btn,.timer-btn,.ctrl-btn,.close-btn{color:#173f72;font-weight:900;cursor:pointer;border:1.15px solid rgba(106,149,181,.48);background:#fffdf8}.pick-btn{min-width:76px;height:54px;border-radius:15px;background:#ead3ad}.timer-btn{width:54px;height:54px;border-radius:50%}.ctrl-btn{height:5.8vh;min-height:43px;padding:0 .85vw;border-radius:15px}.close-btn{position:absolute;right:.2vw;top:.35vh;width:58px;aspect-ratio:1;border-radius:50%;font-size:30px}.grid{height:80vh;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.8vh 1.2vw}.card{position:relative;border-radius:26px;border:1.6px solid rgba(110,151,184,.56);background:#fbf6ea;overflow:hidden;cursor:pointer}.art{position:absolute;left:4%;right:4%;top:3%;height:65%;display:flex;align-items:center;justify-content:center}.center-asset{width:80%;height:80%;object-fit:contain}.wood{position:absolute;left:5%;right:5%;top:55%;height:18%;display:flex;align-items:center;justify-content:center;background:url("assets/name-board.webp") center/100% auto no-repeat;font-size:clamp(22px,1.62vw,32px);font-weight:900;text-align:center;z-index:5}.remaining{position:absolute;right:4%;top:4%;width:40px;height:40px;border-radius:50%;border:1px solid #789fbe;background:#fffdf8;display:flex;align-items:center;justify-content:center;font-weight:900;z-index:7}.capacity{position:absolute;left:5%;right:5%;bottom:7%;height:17%;display:flex;align-items:center;justify-content:center;gap:.28vw}.eagle{width:48px;aspect-ratio:1;border:1px solid #789fbe;border-radius:50%;display:flex}.eagle-token-img{width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.35);transition:.2s}.eagle.used{border-color:transparent}.eagle.used .eagle-token-img{opacity:1;transform:scale(1)}.full-layer{position:absolute;inset:0 0 auto;height:58%;display:none;z-index:12;pointer-events:none}.card.full .full-layer{display:block}.full-sign{position:absolute;left:3%;top:-1%;width:94%;height:74%;background:url("assets/center-full-sign.webp") center top/contain no-repeat}.card.full .remaining{display:none}.card.closed .art,.card.closed .wood{filter:grayscale(1);opacity:.35}.card.closed .remaining,.card.closed .capacity{display:none}.closed-lock{position:absolute;left:50%;top:42%;width:150px;aspect-ratio:1;transform:translate(-50%,-50%);background:url("assets/closed-lock.webp") center/contain no-repeat;z-index:16;display:none}.card.closed .closed-lock{display:block}.toast{position:absolute;left:50%;bottom:1.8vh;transform:translateX(-50%) translateY(12px);opacity:0;z-index:30;background:#173f72;color:#fff;border-radius:999px;padding:.75vh 1.35vw;font-weight:900;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%)}.eddie-mascot{position:absolute;left:2.9vw;top:-.35vh;width:144px;height:216px;z-index:2;pointer-events:none}.eddie-mascot img{width:100%;height:100%;object-fit:contain}.grid{position:relative;z-index:5}</style></head><body><div class="stage"><div class="eddie-mascot" id="eddieMascot"><img id="eddieMascotImg" src="assets/eddie-idle.webp" alt=""></div><div class="header"><div class="title-board"><img class="title-sign-img" src="assets/title-sign.webp" alt=""><h1>Choose a Center</h1></div><div class="controls"><div class="chooser"><div class="person" id="person"><div class="friend-photo" id="friendPhoto"></div><div class="namebox"><span class="label">Who's Choosing?</span><span class="friend-name" id="friendName"></span></div></div><button class="pick-btn" id="pickBtn">Pick</button></div><button class="timer-btn" id="timerBtn">⏱</button><button class="ctrl-btn" id="undoBtn">Undo</button><button class="ctrl-btn" id="resetBtn">Reset</button></div><button class="close-btn" id="closeBtn">×</button></div><div class="grid" id="grid"></div><div class="toast" id="toast"></div></div><script src="classroom-state.js"></script><script>
const STUDENT_KEY='eea-students-v1',SETTINGS_KEY='eea-app-settings',CENTER_KEY='eea-centers-config',PROGRESS_KEY='eea-center-choice-state-v1';const FALLBACK=['Brahm','Dylan','Easton','Eila','Hayes','Heidi','Jamie','Kayson','Lily','Mason','Maesyn','Neely','River','Roman','Warren','Wyatt','Zach','Zelda'];const DEFAULT_CENTERS=[{name:'Dramatic Play',capacity:4,open:true,picture:'assets/dramatic-play.webp'},{name:'Writing',capacity:4,open:true,picture:'assets/writing.webp'},{name:'Music',capacity:3,open:true,picture:'assets/music.webp'},{name:'Blocks',capacity:4,open:true,picture:'assets/blocks.webp'},{name:'Science',capacity:4,open:true,picture:'assets/science.webp'},{name:'Art',capacity:4,open:true,picture:'assets/art.webp'},{name:'Manipulatives',capacity:4,open:true,picture:'assets/manipulatives.webp'},{name:'Reading',capacity:4,open:true,picture:'assets/reading.webp'}];function loadStudents(){try{const x=JSON.parse(localStorage.getItem(STUDENT_KEY)||'null');if(Array.isArray(x)&&x.length)return x.filter(s=>s&&s.active!==false&&String(s.name||'').trim()).map((s,i)=>({id:String(s.id||('s'+i)),name:String(s.name).trim(),photo:s.photo||'',audio:s.audio||''}))}catch(e){}return FALLBACK.map((name,i)=>({id:'s'+(i+1),name,photo:'',audio:''}))}function loadSettings(){const d={nameAudio:true,showPhotos:true,autoStay:true};try{return {...d,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(e){return d}}function loadCenters(){try{const x=JSON.parse(localStorage.getItem(CENTER_KEY)||'null');if(Array.isArray(x)&&x.length)return x.map((c,i)=>({name:String(c.name||DEFAULT_CENTERS[i]?.name||'Center'),cap:Math.max(1,Math.min(12,Number(c.capacity)||1)),open:c.open!==false,picture:c.picture||DEFAULT_CENTERS[i]?.picture||''}))}catch(e){}return DEFAULT_CENTERS.map(c=>({name:c.name,cap:c.capacity,open:c.open,picture:c.picture}))}const students=loadStudents(),settings=loadSettings(),centers=loadCenters();function studentById(id){return students.find(s=>s.id===id)}function presentIds(){return window.EEAClassroomState?window.EEAClassroomState.presentIds():[]}function shuffleIds(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function signature(){const a=window.EEAClassroomState.attendanceStatus(),star=window.EEAClassroomState.presentStar();return `${a.date}|${a.presentIds.slice().sort().join(',')}|${star?star.id:''}|${centers.map(c=>`${c.name}:${c.cap}:${c.open}`).join('|')}`}const counts=centers.map(()=>0),closed=centers.map(c=>!c.open),history=[];let queue=[],selected='',locked=false,started=false,timer=null,seconds=10,transition=null,transitionPending=false;const grid=document.getElementById('grid'),toast=document.getElementById('toast'),person=document.getElementById('person'),friendName=document.getElementById('friendName'),friendPhoto=document.getElementById('friendPhoto');function student(){return studentById(selected)}function flash(m){toast.textContent=m;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),1200)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){if(!window.EEAClassroomState?.hasAttendanceToday())return;localStorage.setItem(PROGRESS_KEY,JSON.stringify({date:window.EEAClassroomState.dateKey(),signature:signature(),counts:[...counts],history:[...history],queue:[...queue],selected,locked,started}))}function clear(){localStorage.removeItem(PROGRESS_KEY)}function restore(){const valid=new Set(presentIds());try{const s=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');if(!s||s.date!==window.EEAClassroomState.dateKey()||s.signature!==signature())return false;if(Array.isArray(s.counts)&&s.counts.length===counts.length)s.counts.forEach((n,i)=>counts[i]=Math.max(0,Math.min(centers[i].cap,+n||0)));if(Array.isArray(s.history))s.history.forEach(h=>{if(h&&valid.has(String(h.friendId))&&centers[+h.index])history.push({index:+h.index,friendId:String(h.friendId)})});queue=Array.isArray(s.queue)?s.queue.filter(id=>valid.has(id)&&studentById(id)):[];selected=valid.has(s.selected)?s.selected:'';locked=!!s.locked;started=!!s.started;return true}catch(e){return false}}function render(){grid.innerHTML=centers.map((c,i)=>{const left=c.cap-counts[i],markers=Array.from({length:c.cap},(_,j)=>`<div class="eagle${j<counts[i]?' used':''}"><img class="eagle-token-img" src="assets/eagle-token.webp"></div>`).join('');return `<div class="card ${left===0?'full':''} ${closed[i]?'closed':''}" data-i="${i}"><div class="closed-lock"></div><div class="art">${c.picture?`<img class="center-asset" src="${esc(c.picture)}">`:''}</div><div class="remaining">${left}</div><div class="wood">${esc(c.name)}</div><div class="capacity">${markers}</div><div class="full-layer"><div class="full-sign"></div></div></div>`}).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>choose(+c.dataset.i))}function show(id,audio=true){const s=studentById(id);selected=s?s.id:'';friendName.textContent=s?s.name:'';const photo=!!settings.showPhotos&&s&&s.photo;person.classList.toggle('show-photo',photo);friendPhoto.innerHTML=photo?`<img src="${s.photo}">`:'';if(audio&&window.EEANameAudio&&s)window.EEANameAudio.play(s)}function refill(){const r=window.EEAClassroomState.starFirstQueue(shuffleIds);queue=r.ready?r.ids:[]}function stopTimer(){if(timer)clearInterval(timer);timer=null;seconds=10;document.getElementById('timerBtn').textContent='⏱'}function maybeFinish(){if(!started||queue.length||!locked||transitionPending)return;transitionPending=true;flash('Everyone has chosen!');if(settings.autoStay===false)return;transition=setTimeout(()=>location.href='stay-in-your-center.html?from=centers',1000)}function choose(i){const s=student();if(!s)return flash('Pick a friend first');if(locked)return flash('Pick the next friend first');if(closed[i])return flash(`${centers[i].name} is closed`);if(counts[i]>=centers[i].cap)return flash(`${centers[i].name} is full`);history.push({index:i,friendId:s.id});counts[i]++;locked=true;stopTimer();render();save();flash(`${s.name} chose ${centers[i].name}`);maybeFinish()}function pick(){if(queue.length===0){if(started)return flash('Everyone has chosen');refill();started=true;if(!queue.length)return flash('No eligible friends are present')}show(queue.shift());locked=false;save()}function startTimer(){if(locked)return flash('Pick the next friend first');if(!student())return flash('Pick a friend first');if(timer){stopTimer();return}seconds=10;document.getElementById('timerBtn').textContent=seconds;timer=setInterval(()=>{seconds--;document.getElementById('timerBtn').textContent=seconds;if(seconds<=0){stopTimer();const options=centers.map((c,i)=>!closed[i]&&counts[i]<c.cap?i:null).filter(i=>i!==null);if(options.length)choose(options[Math.floor(Math.random()*options.length)]);else flash('All centers are full')}},1000)}document.getElementById('pickBtn').onclick=pick;document.getElementById('timerBtn').onclick=startTimer;document.getElementById('undoBtn').onclick=()=>{if(transition){clearTimeout(transition);transition=null}transitionPending=false;const last=history.pop();if(!last)return flash('Nothing to undo');counts[last.index]=Math.max(0,counts[last.index]-1);if(selected&&selected!==last.friendId&&!locked)queue.unshift(selected);show(last.friendId,false);locked=false;stopTimer();render();save();flash(`${studentById(last.friendId)?.name||'Friend'} can choose again`)};document.getElementById('resetBtn').onclick=()=>{if(transition)clear
