<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 8 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%)}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px)}.week{padding:.65vh 1.2vw;border-radius:999px;background:#d9eaee;color:#4f7c89;font-weight:900}.close{width:54px;height:54px;border-radius:50%;border:1px solid #ccd9d6;background:#fffdf8;color:#174f7d;font-size:27px}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid #d4e1de;border-radius:34px;background:#fffef9;overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:#d9eaee;color:#4f7c89;font-weight:900}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.cue{width:min(36vw,600px);height:min(59vh,560px);border-radius:30px;background:radial-gradient(circle,#fffdf8,#eaf3ee);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw}.icon{font-size:clamp(105px,10vw,180px);line-height:1;margin-bottom:2vh}.caption{color:#557876;font-size:clamp(18px,1.25vw,24px);font-weight:900}.eyebrow{color:#799597;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px)}.copy p{color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38}.step,.quote{margin-top:1.5vh;padding:1.2vh 1.4vw;border-radius:18px;background:#e7f0ed;color:#4f765e;font-weight:900;font-size:clamp(17px,1.2vw,24px)}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button,.teacher{border:1px solid #ccd9d6;border-radius:18px;padding:1vh 1.4vw;font-weight:900}.next{background:#668f99;color:white}.dots{display:flex;gap:.55vw}.dot{width:13px;height:13px;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);background:#fffdf8;color:#315f70}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;display:none}.panel.open{display:block}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div style="display:flex;gap:1vw;align-items:center"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ Teacher Note</button><div class="panel" id="panel"></div></main><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],day=days.includes(p.get('day'))?p.get('day'):'Monday',runner=p.get('eeaRunner')==='1',$=id=>document.getElementById(id);const opts={egg:{type:'EGG POSE',note:'Hug knees to chest, rock gently while balancing/breathing, then lie flat and rest. Seated adaptation: bend upper body, rest head on hands, and slowly rock side to side.',cards:[['Make an Egg','🥚','Hug knees to chest.','Curl your body into an egg shape while continuing to breathe.'],['Rock Gently','🌿','Back/forth · side/side.','Roll gently back and forth and side to side while balancing and breathing.'],['Rest','☁️','Lie flat and relax.','When finished, lie flat on your back and rest—or use the seated version.']]},flower:{type:'SMELL THE FLOWER, BLOW THE BUBBLES',note:'Pretend to hold a flower in one hand and bubble wand in the other. Smell in, blow out for several rounds. Alternative: blow out a candle.',cards:[['Hold the Flower','🌸','Bring it to your nose.','Pretend one hand holds a flower. Breathe in as you smell it.'],['Blow the Bubbles','🫧','Slow breath out.','Bring the other hand up like a bubble wand and slowly blow bubbles.'],['Repeat','🌿','Smell… blow…','Continue for a few rounds. You may substitute blowing out a candle.']]},see:{type:'I SEE',note:'Call/response: “I see…” / “What do you see?” Describe an imagined scene and children act it out. Move from slow to active and back to slow. For children with low/no vision, use I Hear from Week 5 or another appropriate game.',cards:[['I See…','👀','Teacher cue.','Say: “I see…”'],['What Do You See?','💬','Class responds.','Children respond: “What do you see?”'],['Act It Out','🌊','Move the idea.','Describe something imagined such as sun rays, waves, a bike, or wind in branches. Children act it out. Continue with adult/child ideas.']]},dance:{type:'DO WHAT I DO DANCE PARTY',note:'Play joyful music. Model a movement; children may join. Change moves, then pass leadership to a child. Let a few children share and keep track so others get turns later in the week.',cards:[['Start the Music','🎵','Choose joyful music.','Explain that you will begin a dance move and anyone who wants may join.'],['Do What I Do','💃','Copy the movement if you want.','Model a few movements such as waving arms or shaking a foot.'],['Pass the Dance','✨','A child becomes the leader.','Pass leadership to a child. Allow a few turns and remember who has shared so others can lead later.']]},problem:{type:'PROBLEM STORIES',note:'Use Block People to act out a short scenario based on a real classroom challenge you observed. Follow the Community Meeting Intro model.',cards:[['Choose a Real Problem','💭','Something our class is working on.','Choose a short problem you have actually observed.'],['Act It Out','🧍','Use Block People.','Use the characters to show the problem.'],['Practice Solutions','🤝','What could they do?', 'Invite children to think through possible solutions.']]}};let choice=p.get('choice'),i=0;const keys=['egg','flower','see','dance','problem'];function render(){if(!choice){$('cards').innerHTML='<article class="card active"><div class="visual"><div class="cue"><div class="icon">🌟</div><div class="caption">Choose today’s Focus on 3s Community Meeting.</div></div></div><div class="copy"><div class="eyebrow">WEEK 8 · TEACHER CHOICE</div><h2>Choose Community Meeting</h2><div class="steps">'+keys.map(k=>'<button class="step pick" data-k="'+k+'" style="border:0;text-align:left;cursor:pointer">'+opts[k].type+'</button>').join('')+'</div></div></article>';$('dots').innerHTML='';$('badge').textContent='CHOOSE FROM WEEK 8 PLANS';$('weekLabel').textContent='FOCUS ON 3s · WEEK 8 · '+day.toUpperCase();$('prev').disabled=true;$('next').style.display='none';$('panel').innerHTML='<strong>Focus on 3s:</strong> Week 8 says choose from Community Meeting plans.';document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{choice=b.dataset.k;i=0;$('next').style.display='';render()});return}const d=opts[choice];$('cards').innerHTML=d.cards.map((x,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="cue"><div class="icon">${x[1]}</div><div class="caption">${x[2]}</div></div></div><div class="copy"><div class="eyebrow">${d.type}</div><h2>${x[0]}</h2><p>${x[3]}</p></div></article>`).join('');$('dots').innerHTML=d.cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');$('badge').textContent=d.type+' · '+(i+1)+' OF '+d.cards.length;$('weekLabel').textContent='FOCUS ON 3s · WEEK 8 · '+day.toUpperCase();$('prev').disabled=false;$('next').style.display='';$('next').textContent=i===d.cards.length-1?'Done ✓':'Next →';$('panel').innerHTML='<strong>Focus on 3s:</strong> '+d.note}$('prev').onclick=()=>{if(choice&&i>0){i--;render()}else{choice=null;i=0;render()}};$('next').onclick=()=>{if(!choice)return;const d=opts[choice];if(i<d.cards.length-1){i++;render()}else if(!runner)location.href='daily-lessons.html?week=8&day='+days.indexOf(day)};$('closeBtn').onclick=()=>location.href='daily-lessons.html?week=8&day='+days.indexOf(day);$('teacher').onclick=()=>$('panel').classList.toggle('open');render()})();</script><script src="community-visual-overrides-week8.js"></script></body></html>
