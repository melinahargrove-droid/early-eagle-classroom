<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 8 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%)}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px)}.week{padding:.65vh 1.2vw;border-radius:999px;background:#d9eaee;color:#4f7c89;font-weight:900}.close{width:54px;height:54px;border-radius:50%;border:1px solid #ccd9d6;background:#fffdf8;color:#174f7d;font-size:27px}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid #d4e1de;border-radius:34px;background:#fffef9;overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:#d9eaee;color:#4f7c89;font-weight:900}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.cue{width:min(36vw,600px);height:min(59vh,560px);border-radius:30px;background:radial-gradient(circle,#fffdf8,#eaf3ee);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw}.icon{font-size:clamp(105px,10vw,180px);line-height:1;margin-bottom:2vh}.caption{color:#557876;font-size:clamp(18px,1.25vw,24px);font-weight:900}.eyebrow{color:#799597;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px)}.copy p{color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38}.step,.quote{margin-top:1.5vh;padding:1.2vh 1.4vw;border-radius:18px;background:#e7f0ed;color:#4f765e;font-weight:900;font-size:clamp(17px,1.2vw,24px)}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button,.teacher{border:1px solid #ccd9d6;border-radius:18px;padding:1vh 1.4vw;font-weight:900}.next{background:#668f99;color:white}.dots{display:flex;gap:.55vw}.dot{width:13px;height:13px;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);background:#fffdf8;color:#315f70}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;display:none}.panel.open{display:block}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div style="display:flex;gap:1vw;align-items:center"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ Teacher Note</button><div class="panel" id="panel"></div></main><script>(()=>{const data={Monday:{type:'MINDFUL PRACTICE',note:'Egg Pose: hug knees to chest, roll gently back and forth and side to side while balancing and breathing, then lie flat and rest. A seated adaptation may be used.',cards:[['Make an Egg','🥚','Hug your knees close.','Hug your knees to your chest and get ready to balance.'],['Rock & Breathe','🌿','Rock gently and keep breathing.','Roll onto your back. Rock gently back and forth and side to side while you balance and breathe.'],['Rest Flat','😌','Let your body rest.','When you are done, lie flat on your back and rest.']]},Tuesday:{type:'MINDFUL PRACTICE',note:'Smell the Flower, Blow the Bubbles: pretend to hold a flower and bubble wand, inhale while smelling the flower, exhale while blowing bubbles, and repeat for a few rounds.',cards:[['Hold the Flower','🌸','Pretend a flower is in one hand.','Bring the flower to your nose and breathe in.'],['Blow the Bubbles','🫧','Pretend a bubble wand is in the other hand.','Breathe out slowly as you blow pretend bubbles.'],['Keep Going','🌿','Smell. Blow. Smell. Blow.','Repeat for a few calm rounds.']]},Wednesday:{type:'CONVERSATION',note:'Conversation prompts: “We have been learning together for a few weeks. How are you feeling about school?” and “In Frederick, all the mice helped their family community. How are you all helping our classroom community?”',cards:[['Think About School','🏫','How are you feeling about school?','Think about how school feels to you now after learning together for several weeks.'],['Think About Helping','🤝','How do you help our classroom?','In Frederick, all the mice help their family community. How are you helping our classroom community?'],['Share & Listen','💬','A few friends share.','Listen to one another’s ideas and notice the many ways people contribute.']]},Thursday:{type:'GAME',note:'I See: call and response. Teacher says “I see…”; children answer “What do you see?” Describe an imagined movement idea. Invite children to act it out. Move from slow to active and back to slow.',cards:[['I See…','👀','Teacher says: “I see…”','Get ready for our call-and-response game.'],['What Do You See?','🙋','Class answers together.','Respond together: “What do you see?”'],['Move the Idea','🌊','Act out what is imagined.','Act out the idea. Try movements that build from slow to active and back to slow.']]},Friday:{type:'STORY & MOVEMENT',note:'Use Add On Story or Do What I Do Dance Party. In Add On Story, each child may add a word, phrase, idea, or pass. In Dance Party, copy a movement and pass the leadership role to children.',cards:[['Add On Story','📖','Build one story together.','Someone starts the story. Go around the circle so each person may add an idea or pass.'],['Do What I Do','💃','Copy a joyful movement.','Play joyful music. Copy the leader’s move, then pass the leadership role to a friend.'],['Celebrate Our Community','⭐','We have grown together.','Notice how our classroom community has grown, connected, and learned together.']]}};const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search);let day=days.includes(p.get('day'))?p.get('day'):'Monday',i=0;const $=id=>document.getElementById(id);function render(){const d=data[day];$('cards').innerHTML=d.cards.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="cue"><div class="icon">${c[1]}</div><div class="caption">${c[2]}</div></div></div><div class="copy"><div class="eyebrow">${day} · ${d.type}</div><h2>${c[0]}</h2><p>${c[3]}</p></div></article>`).join('');$('dots').innerHTML=d.cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');$('badge').textContent=d.type+' · '+(i+1)+' OF '+d.cards.length;$('weekLabel').textContent='WEEK 8 · '+day.toUpperCase();$('prev').disabled=i===0;$('next').textContent=i===d.cards.length-1?'Done ✓':'Next →';$('panel').innerHTML='<strong>Teacher guidance:</strong> '+d.note}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<data[day].cards.length-1){i++;render()}else location.href='week8-plan.html'};$('closeBtn').onclick=()=>location.href='week8-plan.html';$('teacher').onclick=()=>$('panel').classList.toggle('open');render()})();</script><script src="community-visual-overrides.js"></script></body></html>
