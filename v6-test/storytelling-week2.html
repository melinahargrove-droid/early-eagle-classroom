<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 2 Storytelling</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2.2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}button{font-family:inherit}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.2vh 4.8vw;display:grid;grid-template-columns:48% 1fr;gap:4.5vw;align-items:center}.art-wrap{height:60vh;display:flex;align-items:center;justify-content:center}.story-art{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;object-fit:contain;border-radius:30px;filter:drop-shadow(0 8px 18px rgba(54,82,82,.12))}.day{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px);text-transform:uppercase}.copy h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.lead{font-size:clamp(21px,1.55vw,30px);line-height:1.4;color:#527673;font-weight:900;max-width:650px}.cue{margin-top:2.2vh;padding:1.5vh 1.3vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(17px,1.15vw,23px);font-weight:900;max-width:650px}.prompts{display:grid;gap:1vh;margin-top:1.7vh}.prompt{padding:1.15vh 1vw;border-radius:15px;background:#e7f0ed;color:#416d61;font-size:clamp(16px,1.05vw,21px);font-weight:900}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.print,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer;background:#fffdf8;color:#245c78}.done{position:absolute;right:3.2vw;background:#668f99;color:white;border-color:#668f99;padding:1vh 1.8vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(560px,38vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1.2vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.48;color:#4e706c;font-weight:750;white-space:pre-line}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · STORYTELLING</div><h1>Stories in Our Minds</h1></div><div class="actions"><div class="chip" id="weekChip">WEEK 2</div><button class="icon" id="exit" aria-label="Back to Today's Plan">×</button></div></div><section class="card"><div class="art-wrap"><img id="art" class="story-art" alt="Story illustration"></div><div class="copy"><div class="day" id="day"></div><h2 id="title"></h2><div class="lead" id="lead"></div><div class="cue" id="cue"></div><div class="prompts" id="prompts"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Story</button><button class="print" id="printBtn">🖨 Print Story</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label" id="panelLabel">TEACHER STORY</div><h3 id="panelTitle"></h3><p id="storyText"></p></aside></main><script>const stories=[{day:'Monday',title:'The Block Tower That Wouldn’t Stay Up',img:'assets/week2_storytelling_monday.png',lead:'Listen carefully and make the pictures in your mind while your teacher tells the story.',cue:'After the story, invite children to act out building, crashing, and trying again.',text:`Maya and Leo were building a tower in the block center.\n\n“Let’s make it taller than the table!” said Maya.\n\nThey stacked one block, then another, then another.\n\nThe tower grew taller and taller.\n\nCRASH!\n\nBlocks tumbled everywhere.\n\nThey tried again.\n\nThis time Leo stacked the blocks very quickly.\n\nUp, up, up...\n\nCRASH!\n\nDown they came again.\n\nMaya looked at the blocks. “Maybe it needs a bigger bottom.”\n\nLeo found the biggest blocks. Maya lined them up side by side.\n\nTogether, they built a wide, strong bottom.\n\nThen Maya added a block.\n\nLeo added a block.\n\nMaya added another.\n\nSlowly, carefully, the tower grew.\n\nIt reached Maya’s knees.\n\nThen Leo’s belly.\n\nThen his shoulders!\n\nThey placed one last little block on top.\n\nThe tower wobbled.\n\nMaya and Leo froze.\n\nIt leaned one way...\n\nThen the other...\n\nAnd then—\n\nIt stayed!\n\n“We did it!” Leo cheered.\n\nMaya smiled. “It worked better when we built it together.”\n\nAnd right in the middle of their giant tower, they made a little doorway—\n\nbig enough for a toy dinosaur to walk through.`},{day:'Tuesday',title:'The Mystery Under the Art Table',img:'assets/week2_storytelling_tuesday.png',lead:'Listen for the clues. What can you picture happening next?',cue:'After the story, let children act out following the glitter trail and solving the mystery.',text:`Sofia was putting the crayons away when something under the art table sparkled.\n\nShe bent down.\n\nThere it was again.\n\nTwinkle!\n\n“Did you see that?” she whispered to Amir.\n\nThey crawled under the table and found a tiny silver star.\n\nBeside it was a little trail of blue glitter.\n\nThe glitter went out of the art center...\n\npast the bookshelf...\n\naround the rug...\n\nand all the way to the dramatic play center.\n\nSofia and Amir followed it carefully.\n\nBehind the play kitchen, they found another silver star.\n\nThen another!\n\nThe trail led to a basket of dress-up clothes.\n\nAmir lifted a big purple cape.\n\nUnderneath was a shiny silver crown covered in stars.\n\n“My crown!” called Nora. “I’ve been looking everywhere for it!”\n\nNora put the crown on her head.\n\nSofia wrapped the purple cape around her shoulders.\n\nAmir grabbed a pretend sword.\n\nAnd just like that, the mystery was solved—\n\nand a brand-new game began.`},{day:'Wednesday',title:'The Playground Rescue',img:'assets/week2_storytelling_wednesday.png',lead:'Make the playground scene in your mind as the children solve a tricky problem.',cue:'Then act it out: roll, reach, try an idea, work together, and rescue the ball!',text:`At recess, Jayden kicked the big red ball.\n\nIt rolled across the playground.\n\nPast the slide.\n\nPast the sandbox.\n\nPast the tricycles.\n\nAnd then...\n\nWHOOSH!\n\nThe ball rolled right under the fence.\n\n“Oh no!” cried Jayden.\n\nThe children hurried over.\n\nThe ball was sitting on the other side—just far enough away that nobody could reach it.\n\n“I can get it!” said Mia.\n\nShe stretched her arm through the fence.\n\nToo short.\n\n“I have an idea!” said Caleb.\n\nHe found a long stick.\n\nStill too short.\n\nThen Ava noticed something beside the sandbox.\n\n“The shovel!”\n\nThe children carried over a long plastic shovel.\n\nJayden carefully pushed it through the fence.\n\nA little farther...\n\na little farther...\n\nBUMP!\n\nThe shovel touched the ball.\n\nEveryone watched as Jayden slowly rolled it toward them.\n\nCloser...\n\ncloser...\n\nuntil Mia could finally reach through and grab it.\n\n“WE GOT IT!”\n\nThe children cheered.\n\nJayden hugged the ball.\n\nThen he looked at the fence.\n\n“Maybe we should play this way now.”\n\nEveryone laughed.\n\nAnd the big red ball stayed very, very far away from that fence.`},{day:'Thursday',title:'The New Seat at the Table',img:'assets/week2_storytelling_thursday.png',lead:'Listen and imagine the people, the table, and what happens when someone makes room.',cue:'Afterward, act out noticing someone who needs a place and scooting over to welcome them.',text:`When it was time to sit down, Elena stood beside the table.\n\nEvery seat looked taken.\n\nShe held her picture in both hands and looked around the room.\n\nThen Marcus noticed her.\n\nHe scooted his chair over.\n\n“You can sit by me.”\n\nElena smiled a little and sat down.\n\nMarcus looked at her picture.\n\n“You drew a dog!”\n\nElena nodded. “His name is Pickles.”\n\n“My grandma has a dog!” Marcus said.\n\nSoon Layla leaned over.\n\n“I have a cat named Pancake.”\n\nElena giggled. “Pickles and Pancake!”\n\nAt the next table, someone heard them laughing.\n\n“What are you talking about?”\n\n“Pets!” Marcus called.\n\nSuddenly everyone had something to say.\n\nDogs.\n\nCats.\n\nFish.\n\nA turtle.\n\nEven a lizard that liked to sleep on a rock.\n\nA few minutes ago, Elena hadn't known where to sit.\n\nNow she was laughing so hard about Pickles and Pancake that she almost forgot she had ever felt unsure.\n\nAnd the next time someone came looking for a seat—\n\nElena knew exactly what to do.\n\nShe scooted over.`},{day:'Friday',title:'The Secret Door at School',img:'assets/week2_storytelling_friday.png',lead:'Today YOU tell the story. Use the picture and your imagination!',prompts:['Where did you find the tiny door?','What was on the other side?','Who or what did you meet?','What happened next?'],cue:'Act out children’s stories as they tell them. There is no one correct story.',text:`One morning, you find a tiny secret door somewhere in our school.\n\nYou open it...\n\nWhat is on the other side?\n\nHelp children build their stories with simple questions:\n\nWhere did you find the door?\n\nWhat did it look like?\n\nWhat was on the other side?\n\nWho—or what—did you meet?\n\nWhat happened next?\n\nHow did your story end?\n\nIf a child says “I don’t know,” point to one of the possibilities in the illustration and help them choose a starting idea. The goal is to help children imagine and tell their own story, not to create one correct answer.`}];const params=new URLSearchParams(location.search);const names=['monday','tuesday','wednesday','thursday','friday'];let i=names.indexOf((params.get('day')||'wednesday').toLowerCase());if(i<0)i=2;const s=stories[i];day.textContent=s.day+(i===4?' · YOU TELL THE STORY':'');title.textContent=s.title;lead.textContent=s.lead;art.src=s.img;art.alt=s.title+' illustration';cue.textContent=s.cue;weekChip.textContent='WEEK 2 · '+s.day.toUpperCase();if(s.prompts){prompts.innerHTML=s.prompts.map(x=>'<div class="prompt">'+x+'</div>').join('');cue.style.marginTop='1.3vh'}panelTitle.textContent=s.title;storyText.textContent=s.text;if(i===4){teacher.innerHTML='⌃ &nbsp; Teacher Prompt';printBtn.textContent='🖨 Print Prompt';panelLabel.textContent='TEACHER PROMPT'}const target=params.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html';teacher.onclick=()=>panel.classList.toggle('open');close.onclick=()=>panel.classList.remove('open');exit.onclick=done.onclick=()=>location.href=target;printBtn.onclick=()=>{const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>${s.title}</title><style>@page{size:letter;margin:.65in}body{font-family:Georgia,serif;color:#243d4d;max-width:7.2in;margin:auto}small{font-family:Arial,sans-serif;font-weight:bold;letter-spacing:.12em;color:#66858b}h1{font-size:30pt;color:#174f7d;margin:10px 0 6px}.day{font:700 12pt Arial,sans-serif;color:#66858b;margin-bottom:22px}.story{white-space:pre-line;font-size:14.5pt;line-height:1.48}footer{margin-top:24px;border-top:1px solid #ccd8d6;padding-top:10px;font:10pt Arial,sans-serif;color:#789}</style></head><body><small>EARLY EAGLE ACADEMY · UNIT 1 · WEEK 2 · STORYTELLING</small><h1>${s.title}</h1><div class="day">${s.day}</div><div class="story">${s.text}</div><footer>${i===4?'Child Storytelling Prompt':'Teacher Story · Tell naturally and allow children to make the pictures in their minds.'}</footer><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};</script></body></html>
