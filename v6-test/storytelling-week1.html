<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Storytelling</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2.2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}button{font-family:inherit}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.2vh 4.8vw;display:grid;grid-template-columns:48% 1fr;gap:4.5vw;align-items:center}.art-wrap{height:60vh;display:flex;align-items:center;justify-content:center}.story-art{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;object-fit:contain;border-radius:30px;filter:drop-shadow(0 8px 18px rgba(54,82,82,.12))}.day{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px);text-transform:uppercase}.copy h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.lead{font-size:clamp(21px,1.55vw,30px);line-height:1.4;color:#527673;font-weight:900;max-width:650px}.cue{margin-top:2.2vh;padding:1.5vh 1.3vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(17px,1.15vw,23px);font-weight:900;max-width:650px}.prompts{display:grid;gap:1vh;margin-top:1.7vh}.prompt{padding:1.15vh 1vw;border-radius:15px;background:#e7f0ed;color:#416d61;font-size:clamp(16px,1.05vw,21px);font-weight:900}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.print,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer;background:#fffdf8;color:#245c78}.done{position:absolute;right:3.2vw;background:#668f99;color:white;border-color:#668f99;padding:1vh 1.8vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(560px,38vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1.2vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.48;color:#4e706c;font-weight:750;white-space:pre-line}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · STORYTELLING</div><h1>Stories in Our Minds</h1></div><div class="actions"><div class="chip" id="weekChip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="art-wrap"><img id="art" class="story-art" alt="Story illustration"></div><div class="copy"><div class="day" id="day"></div><h2 id="title"></h2><div class="lead" id="lead"></div><div class="cue" id="cue"></div><div class="prompts" id="prompts"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Story</button><button class="print" id="printBtn">🖨 Print Story</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label" id="panelLabel">TEACHER STORY</div><h3 id="panelTitle"></h3><p id="storyText"></p></aside></main><script>const stories=[{day:'Monday',title:'The Red Ball',img:'assets/Monday - The Red Ball.png',lead:'Listen carefully and make the pictures in your mind while your teacher tells the story.',cue:'After the story, act out bouncing, rolling, chasing, and rolling the ball back to a friend.',text:`One morning, Eli found a bright red ball on the playground.\n\nHe picked it up with both hands. The ball was smooth and round.\n\nEli bounced it once. BOOM! It bounced almost as high as his head.\n\nHe bounced it again. BOOM!\n\nThis time, the ball bounced away. It rolled past the slide. It rolled under the bench. And then it rolled all the way to the fence.\n\n“Come back!” Eli shouted.\n\nEli ran after it. His friend Nora ran too.\n\nThe red ball stopped beside a little yellow flower. Nora picked it up.\n\n“I found it!”\n\nEli smiled. “Let’s roll it back together.”\n\nEli sat on one side of the playground. Nora sat on the other. Eli pushed the red ball. Rooooooll.\n\nNora caught it. Then Nora rolled it back.\n\nBack and forth went the bright red ball. And this time, it didn’t get away.`},{day:'Tuesday',title:'The Windy Day',img:'assets/Tuesday - The Windy Day.png',lead:'Close your eyes if you want to. What pictures can you make in your mind?',cue:'Afterward, act out the wind blowing the picture and chasing it across the playground.',text:`Lena carried a bright yellow picture outside. She had drawn a blue house, a green tree, and a giant orange sun.\n\nShe held the picture in front of her and smiled.\n\nThen—WHOOSH!\n\nA gust of wind lifted the paper right out of her hands.\n\n“My picture!” Lena cried.\n\nThe yellow paper danced across the playground. It flipped over once. It sailed past the big tree. It swooped over a bench.\n\nLena ran after it.\n\nWHOOSH! The wind blew again.\n\nThe picture flew higher, then lower, then landed right in the middle of a leafy green bush.\n\nLena reached between the leaves and carefully pulled it out.\n\nShe looked at her picture. The blue house was still there. The green tree was still there. The giant orange sun was still there.\n\nThis time Lena held the paper tightly against her chest.\n\n“Not again, wind,” she said.\n\nThe leaves above her rustled and shook.`},{day:'Wednesday',title:'The Biggest Puddle',img:'assets/Wednesday - The Biggest Puddle.png',lead:'Listen for the little details. See if your mind can turn the words into pictures.',cue:'Then act it out: notice the puddle, step in slowly, and make one giant pretend SPLASH!',text:`When Mateo went outside, the rain had stopped. Everything smelled wet and fresh.\n\nThen he saw it.\n\nThe biggest puddle he had ever seen.\n\nMateo walked to the edge in his rain boots and looked down. He could see the gray clouds reflected in the water. He could even see his own face.\n\nA brown leaf floated slowly across the puddle like a tiny boat.\n\nMateo touched the water with the toe of his boot. Little circles spread across the puddle.\n\nHe stepped in with one foot. Squish.\n\nThen the other. Squish.\n\nMateo looked down at his boots. He bent his knees.\n\nAnd then—SPLASH!\n\nWater jumped up around him. The leaf boat bobbed up and down. The reflection of the clouds disappeared into a hundred wiggly ripples.\n\nMateo laughed.\n\nWhen the water became still again, he looked down.\n\nThere was his face, right back in the puddle.`},{day:'Thursday',title:'The Tiny Visitor',img:'assets/Thursday - The Tiny Visitor.png',lead:'Your teacher will tell the story. You get to imagine everything that happens.',cue:'After the story, act out being very still, watching the ladybug climb, and seeing it fly away.',text:`Ava and Ben were sitting in the grass when Ben noticed something red.\n\n“Look,” he whispered.\n\nA tiny ladybug was climbing up a tall blade of grass.\n\nAva leaned closer. The ladybug had a shiny red back covered with little black spots. Its tiny legs moved one after another as it climbed.\n\nUp, up, up it went.\n\nAva and Ben stayed very still.\n\nThe ladybug reached the very tip of the grass. For a moment, it stopped.\n\nThen its red back opened.\n\nTwo delicate wings unfolded underneath.\n\nThe ladybug lifted into the air. It flew past Ben’s knee, circled once above Ava’s head, and floated toward the garden.\n\n“Where do you think it’s going?” Ava whispered.\n\nBen watched until the tiny red dot disappeared among the flowers.`},{day:'Friday',title:'What Happens Next?',img:'assets/Friday - You Tell the Story.png',lead:'Today YOU tell the story. Use the picture and your imagination!',prompts:['Who is in your story?','What is happening?','What happens next?'],cue:'Act out children’s stories as they tell them. There is no one correct story.',text:`Use the picture as a story starter. There is no one right story. Help children add ideas one at a time.\n\nWHO is in your story?\n\nWHAT is happening?\n\nWHAT HAPPENS NEXT?\n\nIf children need more support, point to something in the illustration and offer a choice or an open prompt. Accept short stories. The goal is for children to use the picture to imagine and tell what happens.`}];const p=new URLSearchParams(location.search),names=['monday','tuesday','wednesday','thursday','friday'];let i=names.indexOf((p.get('day')||'monday').toLowerCase());if(i<0)i=0;const s=stories[i],$=id=>document.getElementById(id),target=p.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html';$('day').textContent=s.day+(i===4?' · YOU TELL THE STORY':'');$('title').textContent=s.title;$('lead').textContent=s.lead;$('art').src=s.img;$('cue').textContent=s.cue;$('weekChip').textContent='WEEK 1 · '+s.day.toUpperCase();if(s.prompts)$('prompts').innerHTML=s.prompts.map(x=>'<div class="prompt">'+x+'</div>').join('');$('panelTitle').textContent=s.title;$('storyText').textContent=s.text;if(i===4){$('teacher').innerHTML='⌃ &nbsp; Teacher Prompt';$('printBtn').textContent='🖨 Print Prompt';$('panelLabel').textContent='TEACHER PROMPT'}$('teacher').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('exit').onclick=$('done').onclick=()=>location.href=target;$('printBtn').onclick=()=>{const w=window.open('','_blank');w.document.write(`<html><head><title>${s.title}</title><style>@page{size:letter;margin:.65in}body{font-family:Georgia,serif;max-width:7.2in;margin:auto;color:#243d4d}h1{color:#174f7d}.story{white-space:pre-line;font-size:14.5pt;line-height:1.48}</style></head><body><small>EARLY EAGLE ACADEMY · WEEK 1 · STORYTELLING</small><h1>${s.title}</h1><div>${s.day}</div><div class="story">${s.text}</div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};</script></body></html>
