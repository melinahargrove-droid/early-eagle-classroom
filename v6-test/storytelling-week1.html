<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Storytelling</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2.2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}button{font-family:inherit}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.2vh 4.8vw;display:grid;grid-template-columns:48% 1fr;gap:4.5vw;align-items:center}.art-wrap{position:relative;height:60vh;display:flex;align-items:center;justify-content:center}.story-art{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;object-fit:contain;border-radius:30px;filter:drop-shadow(0 8px 18px rgba(54,82,82,.12))}.editVisual{position:absolute;left:1vw;bottom:1.1vh;border:1px solid #d4e0df;border-radius:999px;background:#fffdf8;color:#315f70;padding:.55vh 1.1vw;font-weight:900;font-size:clamp(10px,.7vw,13px);cursor:pointer;box-shadow:0 4px 10px rgba(50,80,90,.08);z-index:4}.day{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px);text-transform:uppercase}.copy h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.lead{font-size:clamp(21px,1.55vw,30px);line-height:1.4;color:#527673;font-weight:900;max-width:650px}.cue{margin-top:2.2vh;padding:1.5vh 1.3vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(17px,1.15vw,23px);font-weight:900;max-width:650px}.prompts{display:grid;gap:1vh;margin-top:1.7vh}.prompt{padding:1.15vh 1vw;border-radius:15px;background:#e7f0ed;color:#416d61;font-size:clamp(16px,1.05vw,21px);font-weight:900}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.print,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer;background:#fffdf8;color:#245c78}.done{position:absolute;right:3.2vw;background:#668f99;color:white;border-color:#668f99;padding:1vh 1.8vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(560px,38vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1.2vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.48;color:#4e706c;font-weight:750;white-space:pre-line}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · STORYTELLING</div><h1>Stories in Our Minds</h1></div><div class="actions"><div class="chip" id="weekChip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="art-wrap"><img id="art" class="story-art" alt="Story illustration"><button class="editVisual" id="editVisual">✎ Edit Visual</button></div><div class="copy"><div class="day" id="day"></div><h2 id="title"></h2><div class="lead" id="lead"></div><div class="cue" id="cue"></div><div class="prompts" id="prompts"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Story</button><button class="print" id="printBtn">🖨 Print Story</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label" id="panelLabel">TEACHER STORY</div><h3 id="panelTitle"></h3><p id="storyText"></p></aside></main><script src="visual-store.js"></script><script>const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const p=new URLSearchParams(location.search),names=days.map(x=>x.toLowerCase());let i=names.indexOf((p.get('day')||'monday').toLowerCase());if(i<0)i=0;const day=days[i],$=id=>document.getElementById(id),target=p.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html',slot='week1-storytelling-'+day.toLowerCase();$('day').textContent=day;$('title').textContent='Adult Storytelling Model';$('lead').textContent='Listen while an adult tells a story aloud. This week, adults model what storytelling sounds like.';$('cue').textContent='Focus on 3s Week 1: adults tell stories to model storytelling.';$('weekChip').textContent='FOCUS ON 3s · WEEK 1 · '+day.toUpperCase();$('panelLabel').textContent='TEACHER GUIDANCE';$('panelTitle').textContent='Model Storytelling';$('storyText').textContent='The Focus on 3s Week 1 Weekly Plan specifies that adults tell stories to model storytelling. It does not prescribe a specific story, script, illustration, or child storytelling prompt for this week. Tell a brief, developmentally appropriate story from your own experience or imagination so children can listen to how a story is told.';$('art').src='assets/reading.webp';$('printBtn').style.display='none';async function applyVisual(){try{await EEAVisualStore.migrate();const src=await EEAVisualStore.get(slot);if(src)$('art').src=src}catch(e){}}$('editVisual').onclick=()=>{const back='storytelling-week1.html'+location.search;location.href='visual-editor.html?slot='+encodeURIComponent(slot)+'&return='+encodeURIComponent(back)};$('teacher').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('exit').onclick=$('done').onclick=()=>location.href=target;applyVisual();</script></body></html>
