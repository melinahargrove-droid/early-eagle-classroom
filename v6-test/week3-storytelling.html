<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Storytelling</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.icon{width:54px;height:54px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:3.5vh 4vw;display:grid;grid-template-columns:38% 1fr;gap:4vw;align-items:center}.visual{height:60vh;border-radius:30px;background:linear-gradient(145deg,#e8f1ed,#fbf3e3);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw}.scene{font-size:clamp(88px,9vw,155px);line-height:1}.sceneText{margin-top:2vh;color:#66858b;font-size:clamp(16px,1.15vw,22px);font-weight:900}.small{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px)}.content h2{font-size:clamp(38px,3.4vw,65px);line-height:1.02;margin:.8vh 0 1.4vh;color:#164f7f}.story{font-family:Georgia,"Times New Roman",serif;color:#3e5f5c;font-size:clamp(17px,1.15vw,22px);line-height:1.48;font-weight:600;max-height:47vh;overflow:auto;padding-right:1vw}.story p{margin:0 0 1.1vh}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.done{border-radius:999px;padding:.85vh 1.35vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.teacher{border:1px solid #d4e0df;background:#fffdf8;color:#245c78}.done{position:absolute;right:3.2vw;border:1px solid #668f99;background:#668f99;color:#fff}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(570px,39vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:25px;margin:1vh 0}.panel p,.panel li{font-size:16px;line-height:1.48;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.closepanel{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · STORYTELLING</div><h1>Stories in Our Minds</h1></div><div class="actions"><div class="chip" id="chip"></div><button class="icon" id="exit">×</button></div></header><section class="card"><div class="visual"><div><div class="scene" id="scene"></div><div class="sceneText" id="sceneText"></div></div></div><div class="content"><div class="small" id="small"></div><h2 id="title"></h2><div class="story" id="story"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Notes</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="closepanel" id="closepanel">×</button><div class="label">TEACHER NOTES</div><h3 id="panelTitle"></h3><div id="panelText"></div></aside></main><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday';const stories={Monday:{title:'The Crumpled Picture',scene:'🖍️😟🤝',sceneText:'A picture, a big feeling, and a helpful friend',story:[`Maya was drawing a picture of her family. She drew herself in the middle, her little brother beside her, and a giant yellow sun over everyone’s heads. “I’m going to put this in my cubby so I can take it home,” she said.`,`Just then, Eli reached across the table for a blue crayon. His elbow bumped Maya’s paper. The picture slid to the floor, right under his shoe. Crunch.`,`Maya picked it up. There was a big wrinkle across the sun and a crumpled corner by her brother’s face. Her eyes got wide. Her hands squeezed the paper. “My picture!” she cried.`,`Eli’s stomach felt funny. He wanted to fix it right away. “I can draw you another one!” he said. But Maya shook her head. She didn’t want another picture. She wanted this one.`,`So Eli stopped talking. He sat beside Maya for a moment. Then he asked, “Do you want me to help, or do you want to do it yourself?”`,`Maya looked at the wrinkled paper. “You can help me flatten it,” she said. Together they put the picture on the table and smoothed it gently with their hands. The wrinkle did not disappear completely.`,`Maya looked at it for a long moment. Then she picked up the yellow crayon and drew little rays right over the wrinkle. “Now the sun has extra sunshine,” she said.`,`Eli smiled. “I’m glad you told me how to help.” Maya smiled too. Her picture wasn’t exactly the way it had been before—but it was still hers, and she was ready to put it safely in her cubby.`],notes:`<p><b>Tell it, don’t read it.</b> Use the screen as your reminder and tell the story naturally in your own voice.</p><p>Afterward, pause for one short conversation: <b>How did Maya feel when her picture got crumpled? What did Eli do that was helpful?</b></p><p>The important idea is that helping does not always mean immediately fixing someone’s problem. Eli notices, waits, and asks Maya what kind of help she wants.</p>`},Tuesday:{title:'The Quiet Scientist',scene:'🔎🌿👂',sceneText:'Looking closely can reveal tiny surprises',story:[`Nia and Sam were exploring a tray of leaves, sticks, and pinecones. Sam picked up the biggest pinecone. “I found the best thing!” he said.`,`Nia held a magnifying lens over a small brown leaf. “Wait,” she whispered. “Look at this.”`,`Sam leaned closer. Tiny lines ran all across the leaf like little roads. They looked with their eyes. They touched the bumpy veins with one finger. Then they became very quiet.`,`Scratch...scratch...scratch.`,`“Did you hear that?” Sam whispered. Under the edge of the tray, a tiny beetle was moving its legs against a dry leaf.`,`They watched without touching it. “We almost missed it,” Nia said.`,`Sam nodded. “We had to slow down.”`,`The two scientists kept looking. The quieter and more careful they became, the more tiny things they noticed.`],notes:`<p>Invite children to imagine being very quiet scientists while you tell the story.</p><p>Afterward ask: <b>What helped Nia and Sam discover something they almost missed?</b></p>`},Wednesday:{title:'The Mask With Two Feelings',scene:'🎭🙂😟',sceneText:'Sometimes more than one feeling can fit',story:[`Leo wanted to make a happy mask. He drew a huge smile and two bright eyes. “This is how I feel because Grandma is picking me up today,” he said.`,`Then Leo remembered something. Grandma was taking him to a new swimming class. His smile got smaller. “I’m excited...but I’m worried too.”`,`He turned his mask over. On the back he drew a little wiggly mouth and wide eyes.`,`“Which mask is the real one?” Ava asked.`,`Leo thought. Then he held the mask sideways so both faces could peek out. “Both,” he said. “I can be happy Grandma is coming and worried about swimming at the same time.”`,`Ava nodded. “That happens to me too.”`,`Leo added one last decoration: a blue ribbon that wrapped all the way around both sides.`],notes:`<p>After telling the story, ask: <b>Can a person have two feelings at the same time?</b></p><p>This story pairs naturally with the Week 3 Feeling Masks center experience.</p>`},Thursday:{title:'The Wobbly Building',scene:'🧱🏢🤝',sceneText:'Try, notice, change, and try again',story:[`Zoe and Amir wanted to build the tallest building in the block area. They stacked one block, then another, then another.`,`“Higher!” Amir said.`,`They added one more block. Wobble...wobble...CRASH!`,`They tried again. Wobble...CRASH!`,`Zoe sat back and looked carefully. “The bottom is skinny,” she noticed.`,`This time they put two blocks beside each other at the bottom. Then they added the next blocks slowly. Amir held his breath as Zoe placed the last one.`,`The building stayed standing.`,`“We did it!” Amir whispered.`,`Zoe smiled. “Not the first time.”`,`“Nope,” Amir said. “We had to figure out what the building needed.”`,`Then they began another building—because now they had a new idea they wanted to try.`],notes:`<p>Use your hands to show the wobble as you tell the story.</p><p>Afterward ask: <b>What did Zoe notice that helped them change their plan?</b></p>`},Friday:{title:'You Tell the Feeling Story',scene:'💭🙂😠😢',sceneText:'Today the storyteller is one of us',story:[`Today, there is no teacher story. Invite a child storyteller to choose a feeling and tell a short story about a character who feels that way.`,`Support the story with three prompts only if needed: <b>What happened first? What made the character feel that way? What happened next?</b>`,`When the storyteller is finished, invite classmates to listen, respond, and—when appropriate—act out the story together.`],notes:`<p>Friday shifts from the Monday–Thursday teacher-story routine to a child storytelling experience.</p><p>Let the child’s ideas lead. The prompts are scaffolds, not questions that all have to be answered.</p>`}};const d=stories[day]||stories.Monday;chip.textContent='WEEK 3 · '+day.toUpperCase();small.textContent=day==='Friday'?'CHILD STORYTELLER':'TEACHER STORY';title.textContent=d.title;scene.textContent=d.scene;sceneText.textContent=d.sceneText;story.innerHTML=d.story.map(x=>`<p>${x}</p>`).join('');panelTitle.textContent=d.title;panelText.innerHTML=d.notes;exit.onclick=done.onclick=()=>location.href='week3-plan.html';teacher.onclick=()=>panel.classList.toggle('open');closepanel.onclick=()=>panel.classList.remove('open')})();</script></body></html>
