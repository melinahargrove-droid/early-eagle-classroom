<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Unit 2 Week 1 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f6f1e5}.app,.stage{width:100%;height:100%}.stage{background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .08s}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Unit 2 Week 1 daily lesson"></iframe></section></main><script>(()=>{const params=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const rawDay=params.has('day')?Number(params.get('day')):NaN;const todayIndex=Math.max(0,Math.min(4,new Date().getDay()-1));const day=Number.isInteger(rawDay)&&rawDay>=0&&rawDay<5?rawDay:todayIndex;let section=Math.max(0,Math.min(8,Number(params.get('section'))||0));const flow=['week9-sections.html?view=community','week9-read-aloud.html','week9-sections.html?view=foundational','week9-sections.html?view=writing','week9-sections.html?view=centers','week9-sections.html?view=smallgroups','week9-sections.html?view=building','week9-sections.html?view=storytelling','week9-sections.html?view=closing'];const labels=['Community Meeting','Read Aloud','Foundational Literacy','Writing','Centers','Literacy Small Groups','Building Blocks','Storytelling','Closing Circle'];const frame=document.getElementById('frame');localStorage.setItem('eea-daily-week','9');localStorage.setItem('eea-daily-day',String(day));const pad=n=>String(n).padStart(2,'0'),todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},resumeKey='eea-lesson-resume',autoKey='eea-lesson-auto-resume';function saveResume(next){localStorage.setItem(resumeKey,JSON.stringify({date:todayKey(),week:9,day,section:next}))}function clearResume(){localStorage.removeItem(resumeKey);localStorage.removeItem(autoKey)}const overview=()=>location.href=`daily-lessons.html?week=9&day=${day}&v=${Date.now()}`;function advance(){if(section>=flow.length-1){clearResume();location.href='index.html';return}const next=section+1;saveResume(next);if(section===1){localStorage.setItem(autoKey,todayKey());location.href='choose-a-friend.html';return}section=next;load()}function retreat(){if(section<=0){overview();return}section--;load()}function controls(doc){return{next:doc.getElementById('next'),prev:doc.getElementById('prev'),done:doc.getElementById('done')||doc.getElementById('doneBtn')||doc.querySelector('.done'),exit:doc.getElementById('closeBtn')||doc.getElementById('backBtn')||doc.getElementById('exit')}}function state(){try{const fn=frame.contentWindow.EEASectionState;return typeof fn==='function'?fn():null}catch(e){return null}}function boundary(btn,type,on){if(btn)btn.dataset.eeaBoundary=on?type:''}function sync(doc){const c=controls(doc),s=state();[c.next,c.prev,c.done].forEach(b=>{if(b)b.dataset.eeaBoundary=''});if(c.prev){c.prev.disabled=false;const atStart=!s||!!s.atStart;boundary(c.prev,'back',atStart);c.prev.textContent=atStart?(section===0?'← Day Overview':'← '+labels[section-1]):'← Previous'}const forward=c.next||c.done;if(forward){const atEnd=!s||!!s.atEnd;boundary(forward,section===flow.length-1?'finish':'forward',atEnd);if(atEnd)forward.textContent=section===flow.length-1?'Finish Today ✓':'Next: '+labels[section+1]+' →'}if(section===1&&s&&s.atEnd&&c.next)c.next.textContent='Finish Read Aloud → Choose a Friend'}async function prepare(){let doc,win;try{win=frame.contentWindow;doc=win.document;if(!doc||!doc.body)return}catch(e){frame.style.opacity=1;return}sync(doc);const resync=()=>setTimeout(()=>sync(doc),0);win.addEventListener('eea-section-state',resync);doc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset.eeaBoundary;if(x){e.preventDefault();e.stopImmediatePropagation();if(x==='back')retreat();else if(x==='finish'){clearResume();location.href='index.html'}else advance();return}const c=controls(doc);if(c.exit&&b===c.exit){e.preventDefault();e.stopImmediatePropagation();overview();return}resync()},true);frame.style.opacity=1}function load(){frame.style.opacity=0;const base=flow[section],sep=base.includes('?')?'&':'?';frame.onload=()=>setTimeout(prepare,30);frame.src=`${base}${sep}day=${encodeURIComponent(days[day])}&from=runner&week=9&section=${section}&v=${Date.now()}`}load()})();</script></body></html>
