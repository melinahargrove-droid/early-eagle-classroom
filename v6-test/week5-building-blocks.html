<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 5 Building Blocks</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:4vh 6vw}.card{height:80vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;padding:4vh 5vw}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.card h1{font-size:52px;margin:1vh 0;color:#164f7f}.lead{font-size:23px;font-weight:900;color:#527673}.grid{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:3vh}.choice{background:#e7f0ed;border-radius:25px;padding:2.5vh 2vw}.choice h2{font-size:28px;margin:0 0 1vh;color:#416d61}.choice p,.choice li{font-size:17px;line-height:1.4;font-weight:800;color:#527673}.bottom{text-align:center;margin-top:2vh}.bottom button{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 24px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><section class="card"><div class="eye" id="eye"></div><h1>Building Blocks</h1><div class="lead" id="lead"></div><div class="grid"><div class="choice"><h2>Whole Group</h2><div id="whole"></div></div><div class="choice"><h2>Small Group</h2><p><b>Find and Make Groups</b></p><p>Help children notice and create small groups of objects. Ask how they know how many are in a group and invite them to show the quantity with fingers or objects.</p></div></div></section><div class="bottom"><button onclick="location.href='week5-plan.html'">Done ✓</button></div></main><script>const d={Monday:['When I Was One • Number Me • Count and Move','Recite “When I Was One” with gestures. Use body parts for Number Me, then clap while counting 1–10.'],Tuesday:['Count and Move • Find Groups','Count and clap from 1–10. Then search the classroom for groups of two and show how many with fingers.'],Wednesday:['Count and Move in Patterns • Two Little Black Birds • Make Groups','Count 1–10 in repeating patterns of voice or action. Recite “Two Little Black Birds,” then make groups of two, three, or four.'],Thursday:['Count and Move in Patterns • Snapshots','Count in patterns. Briefly show an array of 3–5 dots or counters; children take a mental “snapshot,” show how many with fingers, and explain how they knew.'],Friday:['Count and Move in Patterns • Make Groups • Snapshots','Return to patterned counting, making small groups, and quick quantity snapshots.']};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday;eye.textContent='WEEK 5 · '+day.toUpperCase();lead.textContent=x[0];whole.innerHTML='<p>'+x[1]+'</p>';</script></body></html>
