<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Small Group</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2.2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.icon{width:54px;height:54px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.5vh 5vw;display:grid;grid-template-columns:40% 1fr;gap:5vw;align-items:center}.visual{height:56vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw}.symbol{font-size:clamp(90px,9vw,155px)}.caption{font-size:clamp(16px,1.1vw,22px);color:#66858b;font-weight:900;margin-top:2vh}.small{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px)}.content h2{font-size:clamp(40px,3.7vw,70px);line-height:1.02;margin:1vh 0;color:#164f7f}.lead{font-size:clamp(20px,1.4vw,28px);line-height:1.35;color:#527673;font-weight:900;margin:1.3vh 0}.steps{display:grid;gap:.85vh;margin-top:1.5vh}.step{padding:1vh 1.1vw;border-radius:16px;background:#e7f0ed;color:#416d61;font-size:clamp(15px,1.02vw,20px);font-weight:900}.note{margin-top:1.3vh;font-size:clamp(13px,.9vw,17px);line-height:1.4;color:#6c8280;font-weight:800}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.back,.done{border-radius:999px;padding:.85vh 1.3vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.teacher,.back{border:1px solid #d4e0df;background:#fffdf8;color:#245c78}.done{position:absolute;right:3.2vw;border:1px solid #668f99;background:#668f99;color:#fff}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(570px,39vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:25px;margin:1vh 0}.panel p,.panel li{font-size:16px;line-height:1.48;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.closepanel{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · LITERACY SMALL GROUPS</div><h1 id="heading"></h1></div><div class="actions"><div class="chip" id="chip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="visual"><div><div class="symbol" id="symbol"></div><div class="caption" id="caption"></div></div></div><div class="content"><div class="small" id="small"></div><h2 id="title"></h2><div class="lead" id="lead"></div><div class="steps" id="steps"></div><div class="note" id="note"></div></div></section><div class="bottom"><button class="back" id="back">← Small Group Choices</button><button class="teacher" id="teacher">⌃ &nbsp; Teacher Notes</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="closepanel" id="closepanel">×</button><div class="label">TEACHER NOTES</div><h3 id="panelTitle"></h3><div id="panelText"></div></aside></main><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',activity=p.get('activity')||'feelings';const data={writing:{heading:'Writing Small Group',small:'ADULT-LED INSTRUCTION',title:'Writing Basics',lead:'Draw something that is important to you.',symbol:'✏️',caption:'Pencils + paper',steps:['Review the Pencils chart and ways to use pencils.','Use Lola Goes to School to notice that Lola draws things important to her. Ask: “What is something important to you? Would you like to draw that?”','If children need an idea, look around the classroom or choose from a box of interesting objects.','Draw slowly and carefully. Add details.','Share drawings around the table, then gently put papers in writing folders and pencils away.'],note:'Objective: communicate about myself through drawing.',teacher:`<p><b>Vocabulary:</b> decide — to make a choice; different — not the same; same — identical to something else.</p><p><b>Materials:</b> pencils, blank paper, Pencils chart, writing folders, bin, <i>Lola Goes to School</i>, and a box of interesting and varied objects to draw.</p><p>Conversation prompts include: “Why did you decide to draw ___?”, “What do you notice about your classmate’s drawing?”, and “Would you like to add anything to your drawing?”</p>`},feelings:{heading:'Knowledge Building',small:'ADULT CHECK-IN / GUIDANCE',title:'Feelings Memory',lead:'Can you find two faces that show the same feeling?',symbol:'🙂',caption:'Feelings Memory',steps:['Look at the cards together first and name the feelings you see.','Place both sets of cards face down in rows.','Take turns flipping one card and then another. Do the feelings match?','Put matching pairs in a community pile. Keep playing as time permits.','At the end ask: “How do you feel today?” Make a face that expresses how you feel.'],note:'Easier version: leave the cards face up and match the pairs.',teacher:`<p><b>Materials:</b> two sets of Feelings visuals cards. Feelings Communication visuals may be used as needed.</p><p>Model how to set up the cards and take a turn. Answer questions and join for a few turns if children need support with organization or collaboration.</p><p>Other classroom games and puzzles that support the unit’s Big Ideas may also be offered with relevant vocabulary cards.</p>`},fine:{heading:'Fine Motor Development',small:'MINIMAL SUPPORT',title:'Fine Motor Development',lead:'Choose an activity that builds the fine-motor skill and stamina this child needs.',symbol:'🤏',caption:'Individualized practice',steps:['Observe the child’s current fine-motor skills and stamina.','Consider any fine-motor goals identified for the child.','Choose an appropriate activity from the Literacy Small Groups fine-motor activity options in Introduction, Part 2.','Provide minimal support while the child practices.'],note:'Week 3 does not prescribe one specific fine-motor activity.',teacher:`<p>The Week 3 curriculum does not name a single required fine-motor task. It directs teachers to choose activities based on observation and children’s IEP goals, using the possible activities listed in <b>Introduction, Part 2: Literacy Small Groups</b>.</p><p>This screen therefore stays intentionally flexible rather than inventing a Week 3 activity that the curriculum does not specify.</p>`}};const d=data[activity]||data.feelings;heading.textContent=d.heading;chip.textContent='WEEK 3 · '+day.toUpperCase();small.textContent=d.small;title.textContent=d.title;lead.textContent=d.lead;symbol.textContent=d.symbol;caption.textContent=d.caption;steps.innerHTML=d.steps.map(x=>`<div class="step">${x}</div>`).join('');note.textContent=d.note;panelTitle.textContent=d.title;panelText.innerHTML=d.teacher;const menu=()=>location.href=`week3-small-groups.html?day=${encodeURIComponent(day)}`;back.onclick=menu;exit.onclick=done.onclick=()=>location.href='week3-plan.html';teacher.onclick=()=>panel.classList.toggle('open');closepanel.onclick=()=>panel.classList.remove('open')})();</script></body></html>
