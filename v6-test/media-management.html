<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media & Links</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;color:#173f72;background:#dce8e6}.page{width:100vw;height:100vh;padding:1.5vh 2vw;background:linear-gradient(180deg,#eef5f1,#f7f1e5)}.top{height:10%;display:flex;align-items:center;justify-content:space-between}.top h1{margin:0;font-size:clamp(34px,3vw,58px)}.sub{color:#61746f;font-size:clamp(13px,.95vw,18px);font-weight:700}.back{border:1.7px solid rgba(73,104,122,.2);border-radius:15px;background:#fffaf0;color:#173f72;padding:1vh 1.1vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.tabs{height:7%;display:flex;gap:.45vw;align-items:center}.tab{border:1.4px solid #b6c7c4;border-radius:999px;background:#fffaf0;color:#48616a;padding:.7vh .9vw;font-weight:900;cursor:pointer}.tab.on{background:#648fae;color:white;border-color:#648fae}.panel{height:72%;border:1.5px solid rgba(80,110,124,.14);border-radius:22px;background:rgba(255,253,247,.92);padding:1.2vh 1vw;overflow:auto}.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1vh}.section-title h2{margin:0;color:#2d4652;font-size:clamp(21px,1.5vw,29px)}.section-title span{color:#6a7873;font-size:clamp(10px,.72vw,14px);font-weight:700}.row{display:grid;grid-template-columns:minmax(150px,1.15fr) minmax(250px,2.5fr) 120px 105px 75px;gap:.65vw;align-items:center;min-height:7.3vh;padding:.55vh .7vw;margin-bottom:.65vh;border:1.3px solid rgba(83,112,125,.13);border-radius:15px;background:#fffdf8}.field label{display:block;font-size:10px;font-weight:900;color:#687a74;margin-bottom:2px}.input,.select{width:100%;height:4vh;border:1.2px solid #b4c3c0;border-radius:9px;background:white;padding:0 .5vw;color:#173f72;font-weight:800}.type{font-size:11px;font-weight:900;color:#60726c;text-align:center}.toggle{margin:auto;position:relative;width:50px;height:27px;border-radius:999px;background:#bbc5c2;cursor:pointer}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff}.toggle.on{background:#6ea578}.toggle.on:after{left:26px}.test,.remove{border:1.2px solid #b4c3c0;border-radius:9px;background:#eef4f1;color:#173f72;font-weight:900;height:4vh;cursor:pointer}.remove{background:#f4ece7;color:#765143}.footer{height:9%;display:flex;align-items:center;justify-content:space-between}.note{font-size:clamp(10px,.72vw,14px);color:#66756f;font-weight:700}.actions{display:flex;gap:.6vw}.actions button{border:0;border-radius:13px;padding:1vh 1.2vw;font-size:clamp(13px,.88vw,17px);font-weight:900;cursor:pointer}.add{background:#e3eee9;color:#264f5c}.reset{background:#ece9df;color:#42535a}.save{background:#648fae;color:white}.toast{position:fixed;left:50%;bottom:2.5vh;transform:translateX(-50%) translateY(20px);opacity:0;background:#173f72;color:#fff;padding:.9vh 1.2vw;border-radius:999px;font-weight:900;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><main class="page"><header class="top"><div><h1>Media & Links</h1><div class="sub">One place to manage the lessons, videos, music, books, and links your classroom uses.</div></div><button class="back" onclick="location.href='teachers-desk.html'">← Teacher’s Desk</button></header><nav class="tabs" id="tabs"></nav><section class="panel"><div class="section-title"><h2 id="heading"></h2><span id="count"></span></div><div id="rows"></div></section><footer class="footer"><div class="note">Built-in items already point to their classroom page. Replace the path with a URL when you want that button to open outside media instead.</div><div class="actions"><button class="add" id="addBtn">+ Add Item</button><button class="reset" id="resetBtn">Restore Defaults</button><button class="save" id="saveBtn">Save Changes</button></div></footer></main><div class="toast" id="toast"></div><script>const KEY='eea-media-config',CATS=['Daily Lessons','Read Alouds','Clean Up','Movement','Calm Down','Other'];const DEFAULTS=[{cat:'Daily Lessons',name:'Daily Lesson Slides',source:'',type:'Link',active:true},{cat:'Read Alouds',name:'Read Aloud Library',source:'read-aloud.html',type:'Built into App',active:true},{cat:'Clean Up',name:'Clean Up Song',source:'clean-up-song.html',type:'Built into App',active:true},{cat:'Movement',name:'Movement Videos',source:'movement.html',type:'Built into App',active:true},{cat:'Calm Down',name:'Calm Down Music',source:'calm-down.html',type:'Built into App',active:true}];let items=load(),cat=CATS[0];const tabs=document.getElementById('tabs'),rows=document.getElementById('rows'),toast=document.getElementById('toast');function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(x)){const merged=DEFAULTS.map(d=>{const old=x.find(v=>v.cat===d.cat);return old?{...d,...old,source:old.source||d.source}:d});return merged.concat(x.filter(v=>!DEFAULTS.some(d=>d.cat===v.cat)))}}catch(e){}return DEFAULTS.map(x=>({...x}))}function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){tabs.innerHTML=CATS.map(c=>`<button class="tab ${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});let shown=items.map((x,i)=>({...x,_i:i})).filter(x=>x.cat===cat);heading.textContent=cat;count.textContent=shown.length+' item'+(shown.length===1?'':'s');rows.innerHTML=shown.length?shown.map(x=>`<div class="row"><div class="field"><label>Name</label><input class="input" data-name="${x._i}" value="${esc(x.name)}"></div><div class="field"><label>URL / App Path</label><input class="input" data-source="${x._i}" value="${esc(x.source)}" placeholder="Paste a link or app path"></div><div class="field"><label>Type</label><select class="select" data-type="${x._i}"><option ${x.type==='Link'?'selected':''}>Link</option><option ${x.type==='Built into App'?'selected':''}>Built into App</option><option ${x.type==='File'?'selected':''}>File</option></select></div><div><div class="type">${x.active?'ON':'OFF'}</div><div class="toggle ${x.active?'on':''}" data-toggle="${x._i}"></div></div><div><button class="test" data-test="${x._i}">Test</button><button class="remove" data-remove="${x._i}" title="Remove">×</button></div></div>`).join(''):'<div style="padding:4vh;text-align:center;color:#71807b;font-weight:800">No items in this section yet.</div>';bind()}function bind(){document.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>items[+e.dataset.name].name=e.value);document.querySelectorAll('[data-source]').forEach(e=>e.oninput=()=>items[+e.dataset.source].source=e.value);document.querySelectorAll('[data-type]').forEach(e=>e.onchange=()=>items[+e.dataset.type].type=e.value);document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{items[+e.dataset.toggle].active=!items[+e.dataset.toggle].active;render()});document.querySelectorAll('[data-test]').forEach(e=>e.onclick=()=>{let x=items[+e.dataset.test];if(!x.source)return flash('Add a URL or app path first');if(/^https?:\/\//i.test(x.source))window.open(x.source,'_blank');else location.href=x.source});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{items.splice(+e.dataset.remove,1);render()})}function flash(m){toast.textContent=m;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),1400)}addBtn.onclick=()=>{items.push({cat,name:'New '+cat+' Item',source:'',type:'Link',active:true});render()};resetBtn.onclick=()=>{items=DEFAULTS.map(x=>({...x}));render();flash('Defaults restored')};saveBtn.onclick=()=>{items.forEach(x=>x.name=x.name.trim()||'Media Item');localStorage.setItem(KEY,JSON.stringify(items));flash('Media & links saved!');render()};render();</script></body></html>
