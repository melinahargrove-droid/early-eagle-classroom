<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Community Meeting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:linear-gradient(#faf7ec,#eef4ef);color:#174f76}.page{min-height:100vh;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto}.top h1{color:#165487;margin:0}.chip{background:#dcecf0;padding:9px 15px;border-radius:999px;font-weight:900}.card{max-width:1200px;margin:18px auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:26px;padding:28px;box-shadow:0 12px 28px #4562}.kicker{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}.card h2{font-size:36px;color:#165487;margin:6px 0 14px}.card p,.card li{font-size:19px;line-height:1.5;color:#527673;font-weight:800}.box{background:#e7f0ed;border-radius:18px;padding:16px;margin:14px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;font-weight:900;padding:11px 20px;cursor:pointer}</style></head><body><main class="page"><header class="top"><div><div class="kicker">EARLY EAGLE ACADEMY · COMMUNITY MEETING</div><h1>Week 6</h1></div><div class="chip" id="chip"></div></header><section class="card"><div class="kicker" id="type"></div><h2 id="title"></h2><div id="body"></div><button class="back" onclick="location.href='week6-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{type:'CURRICULUM MINDFUL PRACTICE',title:'Tree Pose',body:`<p>Stand in Mountain Pose. Press your palms together. Tuck one foot inside the opposite leg—at the thigh, knee, or ankle. Raise your arms above your head with palms together. Take a couple of breaths, then lower your arms and foot. Try the other side.</p><div class="box">Support balance with a wall, chair, or a friend when needed.</div>`},Tuesday:{type:'CURRICULUM CONVERSATION',title:'What Can You Do When You Feel Bored?',body:`<p>In <i>My Day with Gong Gong</i>, May feels bored.</p><div class="box">Ask: <b>What can you do when you feel bored?</b></div><p>Invite children to share ideas and listen to one another.</p>`},Wednesday:{type:'CURRICULUM GAME',title:'We Are Walking…',body:`<p>Pretend to walk around the school neighborhood, standing or sitting.</p><div class="box"><b>We are walking, we are walking, we are walking to _____.</b></div><p>Take a child’s suggestion for a neighborhood place. Ask what you will do there, act it out, then say “And… freeze.” Repeat for a few turns. End by sitting and breathing.</p>`},Thursday:{type:'EARLY EAGLE EXTENSION · CONNECTED TO THIS WEEK',title:'Weather Noticing Breath',body:`<p>Look toward a window or briefly picture the weather outside. Take one slow breath while noticing one thing the weather is doing.</p><div class="box">Turn and tell a partner: <b>I notice _____.</b></div><p>Invite a few children to share how the weather might affect what people wear or do today.</p>`},Friday:{type:'EARLY EAGLE EXTENSION · CONNECTED TO THIS WEEK',title:'Community Change Circle',body:`<p>Think about all the changes we noticed this week—in the weather, the season, our stories, and the things we made together.</p><div class="box"><b>Choose one:</b> Tell a partner one change you noticed, or silently act out something that changes when the weather changes and let friends guess.</div><p>Finish together: <b>Our community notices, learns, and changes together.</b></p>`}}[day];chip.textContent='WEEK 6 · '+day.toUpperCase();type.textContent=d.type;title.textContent=d.title;body.innerHTML=d.body;</script></body></html>
