<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 6 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%);overflow:hidden}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px);line-height:1}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:rgba(214,232,237,.8);color:#386d80;font-weight:900;font-size:clamp(12px,.82vw,16px)}.close{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#174f7d;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(92,136,147,.2);border-radius:34px;background:rgba(255,254,249,.94);box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:rgba(217,234,238,.8);color:#4f7c89;font-weight:900;letter-spacing:.06em;font-size:clamp(11px,.72vw,14px)}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.cue{width:min(36vw,600px);height:min(59vh,560px);border-radius:30px;background:radial-gradient(circle at 50% 38%,#fffdf8 0,#eaf3ee 62%,#dbe9e5 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw;box-shadow:inset 0 0 0 1px rgba(96,140,145,.13)}.icon{font-size:clamp(105px,10vw,180px);line-height:1;margin-bottom:2vh}.caption{color:#557876;font-size:clamp(18px,1.25vw,24px);font-weight:900;max-width:25vw;line-height:1.25}.copy{text-align:left}.eyebrow{color:#799597;font-size:clamp(12px,.8vw,15px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px);line-height:1}.copy p{margin:1.4vh 0;color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38;max-width:39vw}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.6vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 12px 30px rgba(44,67,68,.15);display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}.source{position:absolute;right:3%;bottom:2.15%;color:#aebbb8;font-size:clamp(8px,.52vw,10px);font-weight:700;opacity:.78}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><div class="panel" id="panel"></div><div class="source" id="source"></div></main><script>(()=>{const data={Monday:{type:'MINDFUL PRACTICE · CURRICULUM',source:'Focus on Pre-K · Unit 1 · Week 6',note:'Tree Pose: Begin in Mountain Pose. Press palms together, tuck one foot inside the opposite leg at the thigh, knee, or ankle, raise arms overhead, breathe, then switch sides. Support balance with a wall, chair, or friend when needed.',cards:[['Start in Mountain Pose','🧍','Stand tall and steady.','Stand in Mountain Pose. Press your palms together.'],['Make Your Tree','🌳','One foot rests on the other leg.','Tuck one foot inside the opposite leg—at the thigh, knee, or ankle. Raise your arms above your head with palms together.'],['Breathe & Switch','🌿','A couple of breaths, then change sides.','Take a couple of breaths, then lower your arms and foot. Try the other side.']]},Tuesday:{type:'CONVERSATION · CURRICULUM',source:'Focus on Pre-K · Unit 1 · Week 6',note:'Connect to My Day with Gong Gong: May feels bored. Ask children what they can do when they feel bored, then invite ideas and attentive listening.',cards:[['Remember May','😐','May feels bored.','In My Day with Gong Gong, May feels bored.'],['Think of an Idea','💭','What can you do when you feel bored?','What can you do when you feel bored?'],['Let’s Share','💬','Listen to one another’s ideas.','Invite children to share ideas and listen to one another.']]},Wednesday:{type:'GAME · CURRICULUM',source:'Focus on Pre-K · Unit 1 · Week 6',note:'We Are Walking…: Pretend to walk around the school neighborhood while standing or sitting. Use children’s suggestions for neighborhood places, act out what happens there, then freeze. Repeat a few turns and end sitting and breathing.',cards:[['We Are Walking…','🚶','Pretend to travel through our neighborhood.','Pretend to walk around the school neighborhood, standing or sitting.'],['Where Are We Going?','🏘️','We are walking to _____.','Take a child’s suggestion for a neighborhood place. Ask what you will do there and act it out.'],['And… Freeze!','🧊','Freeze, then try another place.','Say “And… freeze.” Repeat for a few turns. End by sitting and breathing.']]},Thursday:{type:'EEA EXTENSION',source:'Early Eagle Academy · Week 6 Extension',note:'Weather Noticing Breath: Look toward a window or picture the weather outside, take one slow breath while noticing what the weather is doing, then share “I notice _____.” Connect observations to what people wear or do.',cards:[['Notice the Weather','🌤️','Look outside or picture the weather.','Look toward a window or briefly picture the weather outside.'],['Take One Slow Breath','🌬️','Notice one thing the weather is doing.','Take one slow breath while noticing one thing the weather is doing.'],['Turn & Tell','💬','I notice _____.','Turn and tell a partner: “I notice _____.” Then think about how the weather might affect what people wear or do today.']]},Friday:{type:'EEA EXTENSION',source:'Early Eagle Academy · Week 6 Extension',note:'Community Change Circle: Think about changes noticed this week. Children may tell a partner one change or silently act out something that changes with the weather for friends to guess. Finish with the class statement.',cards:[['Think About Change','🔄','What changed this week?','Think about changes in the weather, the season, our stories, and the things we made together.'],['Choose How to Share','🎭','Tell it or act it out.','Tell a partner one change you noticed, or silently act out something that changes when the weather changes and let friends guess.'],['Finish Together','🫶','Our community notices, learns, and changes together.','Say together: “Our community notices, learns, and changes together.”']]}};const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search);let day=days.includes(p.get('day'))?p.get('day'):'Monday',i=0,d=data[day];const $=id=>document.getElementById(id);function render(){d=data[day];$('cards').innerHTML=d.cards.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><div class="cue"><div class="icon">${c[1]}</div><div class="caption">${c[2]}</div></div></div><div class="copy"><div class="eyebrow">${day} · ${d.type}</div><h2>${c[0]}</h2><p>${c[3]}</p></div></article>`).join('');$('dots').innerHTML=d.cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');$('badge').textContent=d.type.split(' · ')[0]+' · '+(i+1)+' OF '+d.cards.length;$('weekLabel').textContent='WEEK 6 · '+day.toUpperCase();$('prev').disabled=i===0;$('next').textContent=i===d.cards.length-1?'Done ✓':'Next →';$('panel').innerHTML='<strong>Teacher guidance:</strong> '+d.note;$('source').textContent=d.source}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<d.cards.length-1){i++;render()}else location.href='week6-plan.html'};$('closeBtn').onclick=()=>location.href='week6-plan.html';$('teacher').onclick=()=>$('panel').classList.toggle('open');render()})();</script></body></html>
