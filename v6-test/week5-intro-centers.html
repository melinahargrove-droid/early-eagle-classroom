t-transform:uppercase;font-size:clamp(12px,.82vw,16px)}.copy h2{margin:1vh 0 .5vh;color:#174f7d;font-size:clamp(44px,4vw,76px);line-height:1}.centername{color:#527678;font-size:clamp(21px,1.4vw,28px);font-weight:900;margin-bottom:2vh}.prompt{font-size:clamp(25px,1.75vw,34px);line-height:1.3;color:#496d70;font-weight:900;max-width:38vw}.cue{margin-top:2vh;padding:1.4vh 1.5vw;border-radius:20px;background:#e7f1ed;color:#426f65;font-size:clamp(23px,1.65vw,32px);font-weight:900;line-height:1.25;max-width:38vw}.cue strong{color:#174f7d}.teacher{position:absolute;left:50%;bottom:2.1%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.62vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.done{position:absolute;right:8.5%;bottom:2.1%;border:0;border-radius:18px;background:#668f99;color:#fff;padding:1vh 1.5vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.panel{position:absolute;z-index:10;right:7%;top:14%;width:min(500px,33vw);max-height:72vh;overflow:auto;padding:2vh 1.5vw;border-radius:24px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 18px 38px rgba(44,67,68,.18);display:none}.panel.open{display:block}.panel .label{color:#789697;font-weight:900;font-size:11px;letter-spacing:.08em}.panel h3{margin:.6vh 0 1vh;color:#315f70;font-size:clamp(21px,1.45vw,29px)}.panel p{color:#58716f;font-weight:700;line-height:1.45;font-size:clamp(13px,.9vw,17px)}.panel .vocab{padding:1vh .8vw;border-radius:14px;background:rgba(226,238,236,.65);font-weight:800}.x{float:right;border:0;background:transparent;color:#315f70;font-size:22px;font-weight:900;cursor:pointer}@media(max-width:900px){.stage{grid-template-columns:1fr;top:11%;bottom:12%;padding:3%}.visual{height:42%}.piccard{width:80vw;height:34vh}.copy{text-align:center}.prompt,.cue{max-width:none}.done{right:4%}.teacher{left:28%}}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 5 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Making Groups',sub:'Math',kicker:'NEW LESSON',img:'assets/math.webp',materials:'The Little Red Hen (Makes a Pizza) · individual child photos · Find and Make Groups Template · Building Blocks Teacher Guide p.24',vocab:'collection · group · same',steps:[{title:'What Is a Group?',prompt:'A group is a collection of things that have something in common.',cue:'Look for collections in The Little Red Hen.',script:'At our Math Center, we will create groups. Groups are a collection of related things, or things that have something in common. Show collections of food/cooking pans from The Little Red Hen.'},{title:'Groups of Friends',prompt:'We can make groups using our friends’ photos.',cue:'Friends may play together, help one another, and solve problems together.',script:'Show the template and children’s photos. Explain that the class will make groups of friends using the photos.'},{title:'Make a Group of 2',prompt:'Let’s add two friends.',cue:'Count the photos: 1, 2.',script:'Use the template and add two friend photos. Model making and counting a group of two friends.'}]},{title:'Joyful Drawing or Painting',sub:'Art Studio',kicker:'NEW LESSON',img:'assets/art.webp',materials:'Mommy’s Khimar · Meeting Mimi · paint/brushes · paint sticks · chalk · markers/crayons · white paper · Joyful Wall display area · smocks if painting',vocab:'different · joyful · proud · strong',steps:[{title:'What Makes You Joyful?',prompt:'What makes you feel really, really happy?',cue:'Think about Mommy’s Khimar and Meeting Mimi.',script:'Connect to the joyful child in Mommy’s Khimar and to Mimi feeling happy telling jokes and building a rocketship with friends. Ask what makes children feel joyful.'},{title:'Make Joyful Art',prompt:'Draw or paint something that makes you feel joyful.',cue:'Your idea may be different from your friends’ ideas—and that is okay.',script:'Explain that children can make a painting or drawing of something that makes them joyful. Different things make different people happy.'},{title:'Think of an Idea',prompt:'What are you proud of? What makes your body or heart feel happy?',cue:'Painting · building · swinging · your own idea',script:'Offer the curriculum examples: feeling proud of a painting, a tall block structure, or using strong legs to swing high. Emphasize that these are examples, not required topics.'},{title:'Our Joyful Wall',prompt:'We will display our art together.',cue:'Our pictures help us learn more about one another.',script:'Point to the Joyful Wall location. Explain that the class will display the artwork and learn about things that make other people in the classroom feel happy.'}]}]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday,runner=params.get('eeaRunner')==='1';let i=Math.max(0,Math.min(items.length-1,Number(params.get('item'))||0)),step=Math.max(0,Number(params.get('step'))||0),visualToken=0;const slot=()=>`week5-centers-${dayName.toLowerCase()}-${i}`+(items[i]?.steps?`-step-${step}`:'');async function applyVisual(d){const token=++visualToken;let src='';try{await EEAVisualStore.migrate();src=await EEAVisualStore.get(slot())}catch(e){}if(token!==visualToken)return;$('pic').src=src||d.steps?.[step]?.img||d.img;$('restoreVisual').style.display=src?'inline-block':'none'}function render(){const d=items[i],s=d.steps?.[step];$('pic').src=d.steps?.[step]?.img||d.img;applyVisual(d);$('title').textContent=s?.title||d.title;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker+(d.steps?` · STEP ${step+1}/${d.steps.length}`:'');$('prompt').textContent=s?.prompt||d.prompt;$('cue').textContent=s?.cue||d.cue;$('noteTitle').textContent=s?.title||d.title;$('notes').textContent=(s?.script||'')+(d.teacherNote?'\n\n'+d.teacherNote:'')||(d.revisit?'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Review Original Introduction if the group needs the full teaching sequence.':'');$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='FOCUS ON 3s · WEEK 5 · '+dayName.toUpperCase();$('review').style.display=d.revisit?'inline-block':'none';$('doneBtn').textContent=d.steps&&step<d.steps.length-1?'Next Step →':i<items.length-1?'Next Center →':'Done ✓';$('panel').classList.remove('open')}function back(){location.href='daily-lessons.html?week=5&day='+Math.max(0,['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(dayName))}$('back').onclick=back;$('doneBtn').onclick=()=>{const d=items[i];if(d.steps&&step<d.steps.length-1){step++;render()}else if(i<items.length-1){i++;step=0;render()}else if(!runner)back()};$('teacherBtn').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('review').onclick=()=>{const d=items[i];if(d.revisit)location.href='week5-intro-centers.html?day='+d.revisit.day+'&item='+d.revisit.item+'&review=1'};$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);q.set('item',String(i));q.set('step',String(step));const backUrl='week5-intro-centers.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(backUrl)};$('restoreVisual').onclick=async()=>{try{await EEAVisualStore.remove(slot())}catch(e){}applyVisual(items[i])};render()})();</script></body></html>
