<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 5 Intro to Centers</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea)}.page{height:100vh;padding:3vh 5vw}.top{height:10vh;font-weight:900;letter-spacing:.12em;color:#789697}.card{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw}.visual{height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-size:27px;font-weight:900}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:clamp(44px,4vw,76px);margin:1vh 0;color:#164f7f;line-height:1}.lead{font-size:clamp(21px,1.5vw,29px);font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh}.step{padding:1.1vh 1.2vw;background:#e7f0ed;border-radius:17px;color:#416d61;font-size:19px;font-weight:900}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff}</style></head><body><main class="page"><div class="top">EARLY EAGLE ACADEMY · INTRO TO CENTERS · WEEK 5</div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="prev">← Previous</button><button id="next">Next Center →</button><button class="done" id="done">Done ✓</button></div></main><script>const data={Monday:[{title:'Art Studio: Sorting Beautiful Stuff',lead:'Natural and recycled materials can be sorted and organized for future creating.',visual:'Visual placeholder: trays of buttons, corks, shells, lids, and other Beautiful Stuff.',steps:['Introduce the collected natural and recycled materials as “Beautiful Stuff.”','Look closely together and talk about what children notice.','Model choosing a way to sort materials into clear containers; children may create their own sorting ideas.']},{title:'Writing & Drawing: Drawing Feelings',lead:'Illustrators use pictures to show how characters feel. We can show feelings in our drawings too.',visual:'Visual placeholder: simple faces showing several emotions beside drawing tools.',steps:['Look at illustrations from familiar books that clearly show characters’ feelings.','Name clues in faces and bodies that help communicate the feeling.','Invite children to draw themselves showing a feeling.']}],Tuesday:[{title:'Art Easel: Mixing and Painting',lead:'Today the easel adds red so children can mix and paint with blue and red.',visual:'Visual placeholder: red and blue paint with a mixing tray and easel.',steps:['Recall painting with blue last week and look at a few previous paintings.','Introduce red paint and a mixing tray.','Model trying the colors separately and mixing them to notice what happens.']},{title:'Blocks: Where We Live',lead:'Use blocks to make a structure like a place where you live—or another important place.',visual:'Visual placeholder: different kinds of homes and community buildings beside blocks.',steps:['Connect to the apartment building in Everybody in the Red Brick Building.','Look at images of different buildings where people live.','Invite children to build a home or another important structure such as a library, shop, workplace, or church.']}],Wednesday:[{title:'Dramatic Play: Caring for Babies',lead:'Baby Izzie wakes the whole red brick building. Today we add babies and care materials to Dramatic Play.',visual:'Visual placeholder: baby doll, blanket, bottle, and care basket.',steps:['Recall baby Izzie crying in Everybody in the Red Brick Building.','Talk about ways people care for babies and model gentle care with the doll.','Invite children to pretend to comfort, feed, dress, or put babies to sleep.']},{title:'Science & Engineering: Observing Weather',lead:'Meteorologists observe and communicate information about weather.',visual:'Visual placeholder: weather symbols, observation notebook, and child meteorologist.',steps:['Review weather conditions children already know.','Introduce the meteorologist as a scientist who observes weather.','Show the Weather Observation Notebook and model looking outside, noticing conditions, and recording an observation.']}],Thursday:[{title:'Discovery: Adding to Playdough',lead:'Change playdough by adding safe colors or scents.',visual:'Visual placeholder: playdough ingredients with food coloring, herbs, and scent containers.',steps:['Introduce the new ingredients and review safe smelling—close to, but not touching, the nose.','Recall that a recipe tells how ingredients are combined.','Invite children to experiment with adding color or scent and notice how the playdough changes.']}],Friday:[]};let day=new URLSearchParams(location.search).get('day')||'Monday',arr=data[day]||[],i=0;if(!arr.length)arr=[{title:'Continue Centers',lead:'No new center is introduced today.',visual:'Visual placeholder: children engaged in familiar Week 5 centers.',steps:['Remind children of this week’s new materials and possibilities.','Review expectations or demonstrate a material only if children need it.']}];function render(){let x=arr[i];eye.textContent=day.toUpperCase()+' · '+(i+1)+' OF '+arr.length;title.textContent=x.title;lead.textContent=x.lead;visual.textContent=x.visual;steps.innerHTML=x.steps.map(s=>'<div class="step">'+s+'</div>').join('');prev.disabled=false;next.style.display=i<arr.length-1?'inline-block':'none';done.style.display=i===arr.length-1?'inline-block':'none'}prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<arr.length-1){i++;render()}};done.onclick=()=>location.href='week5-plan.html';render();</script></body></html>
