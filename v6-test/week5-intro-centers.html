="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 5 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Making Groups',sub:'Math',kicker:'NEW LESSON',img:'assets/math.webp',materials:'The Little Red Hen (Makes a Pizza) · individual child photos · Find and Make Groups Template · Building Blocks Teacher Guide p.24',vocab:'collection · group · same',steps:[{title:'What Is a Group?',prompt:'A group is a collection of things that have something in common.',cue:'Look for collections in The Little Red Hen.',script:'At our Math Center, we will create groups. Groups are a collection of related things, or things that have something in common. Show collections of food/cooking pans from The Little Red Hen.'},{title:'Groups of Friends',prompt:'We can make groups using our friends’ photos.',cue:'Friends may play together, help one another, and solve problems together.',script:'Show the template and children’s photos. Explain that the class will make groups of friends using the photos.'},{title:'Make a Group of 2',prompt:'Let’s add two friends.',cue:'Count the photos: 1, 2.',script:'Use the template and add two friend photos. Model making and counting a group of two friends.'}]},{title:'Joyful Drawing or Painting',sub:'Art Studio',kicker:'NEW LESSON',img:'assets/art.webp',materials:'Mommy’s Khimar · Meeting Mimi · paint/brushes · paint sticks · chalk · markers/crayons · white paper · Joyful Wall display area · smocks if painting',vocab:'different · joyful · proud · strong',steps:[{title:'What Makes You Joyful?',prompt:'What makes you feel really, really happy?',cue:'Think about Mommy’s Khimar and Meeting Mimi.',script:'Connect to the joyful child in Mommy’s Khimar and to Mimi feeling happy telling jokes and building a rocketship with friends. Ask what makes children feel joyful.'},{title:'Make Joyful Art',prompt:'Draw or paint something that makes you feel joyful.',cue:'Your idea may be different from your friends’ ideas—and that is okay.',script:'Explain that children can make a painting or drawing of something that makes them joyful. Different things make different people happy.'},{title:'Think of an Idea',prompt:'What are you proud of? What makes your body or heart feel happy?',cue:'Painting · building · swinging · your own idea',script:'Offer the curriculum examples: feeling proud of a painting, a tall block structure, or using strong legs to swing high. Emphasize that these are examples, not required topics.'},{title:'Our Joyful Wall',prompt:'We will display our art together.',cue:'Our pictures help us learn more about one another.',script:'Point to the Joyful Wall location. Explain that the class will display the artwork and learn about things that make other people in the classroom feel happy.'}]},Tuesday:[{title:'Supermarket',sub:'Dramatic Play',kicker:'NEW LESSON',img:'assets/dramatic-play.webp',materials:'The Little Red Hen (Makes a Pizza) pp.9–10 · supermarket images · paper/clipboards/writing tools · empty food containers · pretend produce or food photos · organizing containers · carts/baskets · grocery bags · cash register/play money · advertisements · role name tags · shelf labels',vocab:'bagger · cashier · customer · groceries · shop',steps:[{title:'Remember the Supermarket',prompt:'Hen went to the supermarket for pizza ingredients.',cue:'Have you visited a grocery store?',script:'Show The Little Red Hen pages 9–10. Thumbs up if you have visited a grocery store. Invite 1–2 children to share.'},{title:'Notice Grocery Stores',prompt:'What do you notice?',cue:'Look at supermarket images.',script:'Show supermarket/grocery store images and invite 1–2 children to notice what they see.'},{title:'Groceries & Customers',prompt:'Groceries are food items people can buy.',cue:'Stores sort and label items so customers can find them.',script:'Explain groceries and customer using the curriculum definitions. Point out that food is sorted/labeled and may show prices.'},{title:'Jobs at the Store',prompt:'Cashier · bagger · customer',cue:'People have different roles in a supermarket.',script:'Explain that a cashier collects money and a bagger puts groceries into bags. A customer shops or buys things.'},{title:'Open Our Supermarket',prompt:'First we create it—then we pretend!',cue:'Sort · label · make signs/money · choose roles',script:'Explain that Dramatic Play will become a supermarket. Show/name the materials. Model shopping and bringing items to a cashier. Children may help create the store and later pretend to shop or work there.'}]},{title:'Partner Building 1',sub:'Blocks',kicker:'NEW LESSON',img:'assets/blocks.webp',materials:'unit blocks or varied building materials · Meeting Mimi p.13 · optional Turn Taking visual/topic board',vocab:'ability · cooperate · steady',steps:[{title:'Mimi & Friends Build Together',prompt:'What do you notice about how they build together?',cue:'Look at Meeting Mimi page 13.',script:'In Meeting Mimi, the children each use their abilities, or what they can do, to help build. Show Mimi and friends building the rocket and ask what children notice.'},{title:'Working Together',prompt:'They hold things steady and share materials.',cue:'Steady means supported so it does not fall down.',script:'Point out how Mimi and friends work together by holding the rocket steady for one another and sharing materials.'},{title:'Cooperate With a Partner',prompt:'Cooperate means work together.',cue:'Today two friends will build one structure together.',script:'Explain that children will cooperate, or work together, to build structures in the Block Center like Mimi and her friends.'},{title:'Make a Partner Plan',prompt:'What could you build? How could you work together?',cue:'Share ideas before building.',script:'Ask what children and partners might build and how they could work together. Invite responses.'}]}],Wednesday:[{title:'Friends at School Book 1',sub:'Writing & Drawing',kicker:'NEW LESSON',img:'assets/writing.webp',materials:'Friends at School · crayons/markers/pencils · white paper · children’s name cards · Pictures and Names template · binder/folder · photos of every child interacting positively with classmates',vocab:'cleanup · together · enjoy · cooperate',steps:[{title:'Friends Do Things Together',prompt:'What do you see the children doing together?',cue:'Play · clean up · cooperate · enjoy school together',script:'Show a few pages from Friends at School. Explain that the children play together, clean up together, cooperate/work together, and enjoy spending time together. Ask what children see them doing.'},{title:'What Do We Do Together?',prompt:'What do you do at school with your friends?',cue:'Think about real experiences in our classroom.',script:'Connect the book to your classroom and invite children to share things they do with friends at school.'},{title:'Become an Author & Illustrator',prompt:'Write and draw about something you like to do with friends.',cue:'Use our photographs for ideas.',script:'Explain that children can be authors and illustrators. They may look at photographs and draw ways they play/work together; an adult will help write their words.'},{title:'Share Our Experiences',prompt:'Our pages will become a class book.',cue:'Books help us share our ideas with other people.',script:'Explain that writing books about experiences helps share ideas. Pages will be collected into a class book that can grow over time.'}]},{title:'Five Senses Exploration — Sound',sub:'Science & Engineering',kicker:'YEAR-LONG STUDY · PART 1',img:'assets/science.webp',materials:'audio/video recording device · T-chart “What do we think we will hear?” / “What did we hear?” · Five Senses Journals · drawing tools · headphones',vocab:'hear · observe · sound',steps:[{title:'Begin Our Five Senses Study',prompt:'We will study our school and schoolyard all year.',cue:'Today we begin by observing sounds with our ears.',script:'Explain that Science & Engineering is beginning a scientific study that continues all year. Children will use their five senses to explore and share observations. Start with sound.'},{title:'Listen Quietly',prompt:'What can we hear right now?',cue:'Quiet bodies for about 15–20 seconds.',script:'Guide children to listen quietly for 15–20 seconds, optionally closing eyes. Invite children who are Deaf or hard of hearing to notice what they can feel or see instead. Ask what they noticed.'},{title:'Predict Outdoor Sounds',prompt:'What might we hear outside?',cue:'Record our predictions on the T-chart.',script:'Explain that the class will walk around the schoolyard making sound observations. Ask what children predict they will hear and record ideas on the first side of the T-chart.'},{title:'Become Sound Scientists',prompt:'Calm bodies · walking feet · quiet voices.',cue:'Listen while the teacher records the sounds.',script:'Prepare for the walk. Explain that calm bodies, walking feet, and quiet voices help everyone notice sounds. Record audio during the walk and periodically stop to listen closely.'},{title:'What Did We Hear?',prompt:'Add our observations to the chart.',cue:'Compare what we predicted with what we noticed.',script:'After returning, record children’s observations on the second side of the T-chart.'},{title:'Use the Five Senses Journal',prompt:'Listen again and draw what you observed.',cue:'This week ONLY use the listening/ear page.',script:'Explain that during Centers children can listen to the recorded walk and draw observations in the Five Senses Journal. The journals will be used all year, so handle them carefully; this week only draw on the listening-with-the-ear page.'}]}],Thursday:[{title:'Revisit Making Groups',sub:'Math',kicker:'REVISIT',img:'assets/math.webp',prompt:'Return to making groups of friends.',cue:'Make and count groups of 2 or 3.',materials:'Original Making Groups materials and guidance are available through Review Original Introduction.',vocab:'collection · group · same',revisit:{day:'Monday',item:0}},{title:'Storytelling with Props 1',sub:'Library & Listening',kicker:'SOURCE LINK NEEDS REVIEW',img:'assets/reading.webp',prompt:'Storytelling with Props is scheduled today.',cue:'The Digital Arc link currently opens the Five Senses Sound folder.',materials:'No Storytelling with Props lesson content has been inserted because the linked source does not match the lesson title.',vocab:'',teacherNote: e;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker+(d.steps?` · STEP ${step+1}/${d.steps.length}`:'');$('prompt').textContent=s?.prompt||d.prompt;$('cue').textContent=s?.cue||d.cue;$('noteTitle').textContent=s?.title||d.title;$('notes').textContent=(s?.script||'')+(d.teacherNote?'\n\n'+d.teacherNote:'')||(d.revisit?'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Review Original Introduction if the group needs the full teaching sequence.':'');$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='FOCUS ON 3s · WEEK 5 · '+dayName.toUpperCase();$('review').style.display=d.revisit?'inline-block':'none';$('doneBtn').textContent=d.steps&&step<d.steps.length-1?'Next Step →':i<items.length-1?'Next Center →':'Done ✓';$('panel').classList.remove('open')}function back(){location.href='daily-lessons.html?week=5&day='+Math.max(0,['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(dayName))}$('back').onclick=back;$('doneBtn').onclick=()=>{const d=items[i];if(d.steps&&step<d.steps.length-1){step++;render()}else if(i<items.length-1){i++;step=0;render()}else if(!runner)back()};$('teacherBtn').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('review').onclick=()=>{const d=items[i];if(d.revisit)location.href='week5-intro-centers.html?day='+d.revisit.day+'&item='+d.revisit.item+'&review=1'};$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);q.set('item',String(i));q.set('step',String(step));const backUrl='week5-intro-centers.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(backUrl)};$('restoreVisual').onclick=async()=>{try{await EEAVisualStore.remove(slot())}catch(e){}applyVisual(items[i])};render()})();</script></body></html>
