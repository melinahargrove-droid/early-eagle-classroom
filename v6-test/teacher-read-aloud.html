<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle — My Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:8vh;display:flex;justify-content:space-between;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.1em}h1{margin:3px 0;font-size:32px}.x{width:46px;height:46px;border-radius:50%;border:1px solid #cbdde0;background:#fffdf8;color:#245c82;font-size:22px;font-weight:900}.stage{height:81vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain}.empty{font-size:28px;color:#789697;font-weight:900}.side{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);max-height:72%;overflow:auto;background:#fffdf8;border:2px solid #e4c56d;border-radius:20px;padding:18px;box-shadow:0 12px 28px #0002}.side.show{display:block}.side b{display:block;color:#9a6c13;font-size:12px;letter-spacing:.08em;margin-bottom:8px}.side div{color:#71591f;font-size:18px;font-weight:900;line-height:1.4}.footer{height:9vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1px solid #cbdde0;border-radius:17px;padding:10px;font-weight:900;font-size:16px}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:white}.progress{text-align:center;color:#607976;font-weight:900}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · MY READ ALOUD</div><h1 id="title"></h1></div><button class="x" id="exit">×</button></header><section class="stage" id="stage"><img id="img" hidden><div class="empty" id="empty">Add pages in Edit Day to build this Read Aloud.</div><aside class="side" id="side"><b id="label"></b><div id="prompt"></div></aside></section><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress" id="count"></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const p=new URLSearchParams(location.search),id=p.get('id'),KEY='eea-teacher-lessons-v1';let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const d=all.find(x=>x.id===id),$=x=>document.getElementById(x);if(!d){$('title').textContent='Read Aloud not found';return}let i=0;const pages=d.pages||[];$('title').textContent=d.title;function back(){location.href='daily-lessons.html?week='+d.week+'&day='+d.day}function show(){const x=pages[i];$('img').hidden=!x?.image;$('empty').style.display=x?.image?'none':'block';if(x?.image)$('img').src=x.image;$('label').textContent=x?.label||'TEACHER POP-OUT';$('prompt').textContent=x?.prompt||'';$('side').classList.remove('show');$('count').textContent=pages.length?'Page '+(i+1)+' of '+pages.length:'No pages yet';$('prev').disabled=i===0;$('next').textContent=i===pages.length-1?'Finish Read Aloud ✓':'Next →'}$('stage').onclick=e=>{if(e.target.closest('.side'))return;if(pages[i]?.prompt)$('side').classList.toggle('show')};$('prev').onclick=()=>{if(i>0){i--;show()}};$('next').onclick=()=>{if(i<pages.length-1){i++;show()}else back()};$('exit').onclick=back;show()})();</script></body></html>
