<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 8 Read Aloud</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:linear-gradient(#faf7ec,#eef4ef);color:#174f76}.page{padding:24px;max-width:1180px;margin:auto}.card{background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:28px}.tag{font-size:12px;font-weight:900;letter-spacing:.11em;color:#789697}h1{font-size:42px;margin:5px 0;color:#165487}h2{color:#315f66}.box{background:#e7f0ed;border-radius:18px;padding:15px;margin:12px 0;font-size:18px;font-weight:800;color:#55747b;line-height:1.45}.stop{background:#f6eadf}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900;margin-top:12px}.note{font-size:13px;color:#7e8d89;font-weight:800}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1 id="title"></h1><h2 id="subtitle"></h2><div id="content"></div><p class="note" id="assetNote"></p><button class="back" onclick="location.href='week8-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const data={Monday:{title:'“Play” from Things We Do',sub:'Poem · Read 1 of 1',html:`<div class="box">Before: Introduce a poem as writing that may have rhyme or a special beat. Ask: <b>When you play, what do you like to do?</b></div><div class="box stop"><b>Stanza 1:</b> What does the child like to do alone?</div><div class="box stop"><b>Stanza 2:</b> What’s different when the children play together?</div><div class="box">Read twice fluently. On the third reading, invite children to chime in. Then reread while clapping the beat together.</div>`},Tuesday:{title:'Frederick',sub:'Read 1 of 4 · What’s the story about?',html:`<div class="box">Introduce Frederick by Leo Lionni. Some field mice get ready for winter; Frederick is one of the mice.</div><div class="box stop"><b>Book page 7:</b> What are the field mice doing so far? What does Frederick do? What might he mean?</div><div class="box stop"><b>Book page 11:</b> The mice seem disappointed. Frederick looks sleepy. What does he say he is doing?</div><div class="box stop"><b>Book page 15:</b> What are some reasons the mice feel happy? What do you predict will happen next?</div><div class="box stop"><b>Book page 23:</b> How does Frederick help his family?</div><div class="box">After: What happens at the end of the book?</div>`},Wednesday:{title:'Frederick',sub:'Read 2 of 4 · Retelling the first half',html:`<div class="box">Read only the first half, stopping after book page 14.</div><div class="box stop"><b>Book page 5:</b> Why are the mice working?</div><div class="box stop"><b>Book page 12:</b> What does Frederick mean by “gathering words”? Why is he gathering words?</div><div class="box">Page slowly through the first-half illustrations. Ask: <b>What happened first, next, and after that?</b> Notice colors and shapes in the collage illustrations.</div>`},Thursday:{title:'Frederick',sub:'Read 3 of 4 · Retelling the second half',html:`<div class="box">Read from book page 15 through the end.</div><div class="box stop"><b>Book page 18:</b> The mice look sad. What happened?</div><div class="box stop"><b>Book page 28:</b> What are Frederick’s supplies?</div><div class="box">After: What happened first, next, and after that? What is Frederick’s poem about?</div>`},Friday:{title:'Frederick',sub:'Read 4 of 4 · Acting out the story',html:`<div class="box">Invite children to act out Frederick. Children may pass and can represent any character or object in the story.</div><div class="box stop">Possible scenes: mice gathering food; mice chatting and eating in the hideout; Frederick sharing words and poetry to cheer the mice.</div><div class="box">After: How does each mouse contribute to the family community? How do we each contribute to our classroom community?</div>`}}[day];tag.textContent='WEEK 8 · '+day.toUpperCase()+' · READ ALOUD';title.textContent=data.title;subtitle.textContent=data.sub;content.innerHTML=data.html;assetNote.textContent=day==='Monday'?'Poem text is teacher-provided/charted per curriculum.':'Frederick book-page imagery is not packaged in the repo yet; this page preserves the verified curriculum stops until the image-based reader assets are added.';</script></body></html>
