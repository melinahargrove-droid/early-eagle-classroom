<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 8 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef;position:relative}.book img{display:block;width:100%;height:100%;object-fit:contain}.poem{display:none;width:min(900px,78vw);padding:6vh 5vw;border-radius:30px;background:#fffdf8;border:1.5px solid #cbdde0;text-align:center;box-shadow:0 14px 34px #0000000d}.poem.show{display:block}.poem .kicker{font-weight:900;letter-spacing:.1em;color:#789697}.poem h2{font-size:54px;margin:1.5vh 0;color:#164f7f}.poem p{font-size:23px;line-height:1.45;font-weight:900;color:#527673}.image-error{display:none;position:absolute;inset:10%;align-items:center;justify-content:center;text-align:center;padding:3vw;border-radius:24px;background:#fff7e8;color:#855d28;font-weight:900;font-size:18px;line-height:1.5}.image-error.show{display:flex}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(560px,44vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title">Week 8 Read Aloud</h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"><div class="poem" id="poem"><div class="kicker">POEM · THINGS WE DO</div><h2>“Play”</h2><p>Use the teacher-provided/charted poem from the curriculum. Read it fluently, invite children to chime in, and revisit it while clapping the beat together.</p></div><div class="image-error" id="imageError"></div></div><div class="stopcard" id="stop"></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const data={Monday:{mode:'poem',title:'“Play” from Things We Do',sub:'Poem · Read 1 of 1',before:'Today we will read a poem called “Play.” Listen for what the child likes to do alone and what changes when children play together.',focus:'Introduce a poem as writing that may have rhyme or a special beat. Ask: When you play, what do you like to do?',note:'Read twice fluently. On the third reading, invite children to chime in. Then reread while clapping the beat together.',stops:['STANZA 1 • What does the child like to do alone?','STANZA 2 • What’s different when the children play together?']},Tuesday:{mode:'book',title:'Frederick',sub:'Read 1 of 4 · What’s the story about?',prefix:'frederick-',cover:1,start:1,end:16,before:'Today we will read Frederick by Leo Lionni. Listen for what the field mice do to prepare for winter and what Frederick contributes to his family.',focus:'Read the adapted text fluently. Pause when a curriculum teaching stop appears.',note:'Initial adapted-slide placements are ready for visual review. Printed book page numbers are preserved on every pause card.',stops:{5:'BOOK PAGE 7 • What are the field mice doing so far? What does Frederick do? What might he mean?',7:'BOOK PAGE 11 • The mice seem disappointed. Frederick looks sleepy. What does he say he is doing?',9:'BOOK PAGE 15 • What are some reasons the mice feel happy? What do you predict will happen next?',13:'BOOK PAGE 23 • How does Frederick help his family?'}},Wednesday:{mode:'book',title:'Frederick',sub:'Read 2 of 4 · Retelling the first half',prefix:'frederick-',cover:1,start:1,end:8,before:'Today we will reread the first half of Frederick and practice telling what happened first, next, and after that.',focus:'Read only the first half of the adapted book, then page slowly back through the illustrations to retell events.',note:'Notice colors and shapes in Leo Lionni’s collage illustrations.',stops:{4:'BOOK PAGE 5 • Why are the mice working?',7:'BOOK PAGE 12 • What does Frederick mean by “gathering words”? Why is he gathering words?'}},Thursday:{mode:'book',title:'Frederick',sub:'Read 3 of 4 · Retelling the second half',prefix:'frederick-',cover:1,start:9,end:16,before:'Today we will read the second half of Frederick and retell what happens as winter continues.',focus:'Read from the middle of the adapted book through the end. Focus on first, next, and after that.',note:'After reading, ask what Frederick’s poem is about.',stops:{10:'BOOK PAGE 18 • The mice look sad. What happened?',16:'BOOK PAGE 28 • What are Frederick’s supplies?'}},Friday:{mode:'book',title:'Frederick',sub:'Read 4 of 4 · Acting out the story',prefix:'frederick-',cover:1,start:1,end:16,before:'Today we will revisit Frederick and act out important parts of the story. Children may pass and can represent characters or objects.',focus:'Use the adapted illustrations to help children choose and sequence scenes for story acting.',note:'Possible scenes: mice gathering food; mice chatting and eating in the hideout; Frederick sharing words and poetry. Afterward, connect each mouse’s contribution to the classroom community.',stops:{}}};const p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',x=data[day],from=p.get('from')||'';let page=x.start||1,beforeOpen=true,pauseShown=false,poemStop=-1;const $=id=>document.getElementById(id),title=$('title'),sub=$('sub'),chip=$('chip'),pageImg=$('pageImg'),poem=$('poem'),imageError=$('imageError'),stop=$('stop'),prev=$('prev'),next=$('next'),count=$('count'),fill=$('fill'),notesTitle=$('notesTitle'),focus=$('focus'),note=$('note'),notesPanel=$('notesPanel');title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 8 · '+day.toUpperCase();notesTitle.textContent=x.title;focus.textContent=x.focus;note.textContent=x.note||'';function overview(){location.href='daily-lessons.html?week=8&day='+days.indexOf(day)+'&v='+Date.now()}function state(){if(x.mode==='poem')return{page:1,beforeOpen,pauseShown:poemStop>=0,atStart:beforeOpen,atEnd:!beforeOpen&&poemStop===x.stops.length-1};return{page,beforeOpen,pauseShown,atStart:beforeOpen,atEnd:!beforeOpen&&page===x.end&&(!x.stops[page]||pauseShown)}}window.EEASectionState=state;function notify(){window.dispatchEvent(new CustomEvent('eea-section-state',{detail:state()}))}function showCard(label,copy){stop.innerHTML='<b>'+label+'</b>'+copy;stop.classList.add('show')}function hideCard(){stop.classList.remove('show')}function renderVisual(){if(x.mode==='poem'){pageImg.style.display='none';imageError.classList.remove('show');poem.classList.add('show');return}poem.classList.remove('show');pageImg.style.display='block';const shown=beforeOpen?(x.cover||x.start):page,src='assets/'+x.prefix+String(shown).padStart(2,'0')+'.jpg';imageError.classList.remove('show');pageImg.style.visibility='visible';pageImg.onerror=()=>{pageImg.style.visibility='hidden';imageError.textContent='Book image could not load: '+src;imageError.classList.add('show')};pageImg.src=src+'?v=8'}function updateButton(){if(beforeOpen){next.textContent='Start Reading →';return}if(x.mode==='poem'){next.textContent=poemStop===x.stops.length-1?'Finish Read Aloud ✓':'Next →';return}if(pauseShown){next.textContent=page===x.end?'Finish Read Aloud ✓':'Continue →';return}next.textContent=page===x.end?'Finish Read Aloud ✓':'Next →'}function render(){renderVisual();if(x.mode==='poem'){count.textContent='Poem';fill.style.width=((Math.max(0,poemStop)+1)/(x.stops.length+1)*100)+'%';if(beforeOpen)showCard('BEFORE WE READ',x.before);else if(poemStop>=0)showCard('CURRICULUM TEACHING STOP — PAUSE HERE',x.stops[poemStop]);else hideCard()}else{const total=x.end-x.start+1,pos=page-x.start+1;if(beforeOpen&&x.cover!==x.start){count.textContent='Cover';fill.style.width='0%'}else{count.textContent='Slide '+pos+' of '+total;fill.style.width=(pos/total*100)+'%'}if(beforeOpen)showCard('BEFORE WE READ',x.before);else if(pauseShown&&x.stops[page])showCard('CURRICULUM TEACHING STOP — PAUSE HERE',x.stops[page]);else hideCard()}prev.disabled=false;updateButton();notify()}prev.onclick=()=>{if(x.mode==='poem'){if(beforeOpen)return;if(poemStop>=0){poemStop--;render();return}beforeOpen=true;render();return}if(pauseShown){pauseShown=false;render();return}if(beforeOpen)return;if(page>x.start){page--;render();return}beforeOpen=true;render()};next.onclick=()=>{if(beforeOpen){beforeOpen=false;page=x.start||1;render();return}if(x.mode==='poem'){if(poemStop<x.stops.length-1){poemStop++;render()}else if(from!=='runner')overview();return}const s=x.stops[page]||'';if(s&&!pauseShown){pauseShown=true;render();return}if(pauseShown)pauseShown=false;if(page<x.end){page++;render()}else if(from!=='runner')overview()};$('backBtn').onclick=overview;$('notesBtn').onclick=()=>notesPanel.classList.toggle('open');$('closeNotes').onclick=()=>notesPanel.classList.remove('open');render()})();</script></body></html>
