<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuesday Community Meeting Image Editor</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#dce6e8;color:#244f69}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.toggle{position:fixed;right:12px;bottom:12px;z-index:20;border:1px solid #9cb5bd;border-radius:999px;background:#fffdf8;color:#244f69;padding:10px 16px;font-weight:900;cursor:pointer;box-shadow:0 5px 18px rgba(30,50,55,.15)}.panel{position:fixed;right:12px;bottom:62px;z-index:20;width:min(360px,34vw);padding:14px;border-radius:18px;background:rgba(255,253,248,.98);border:1px solid #a9bdc3;box-shadow:0 10px 28px rgba(30,50,55,.18);display:none}.panel.open{display:block}.panel h3{margin:0 0 5px}.step{font-size:13px;font-weight:900;margin-bottom:10px}.row{display:grid;grid-template-columns:55px 1fr 58px;gap:8px;align-items:center;margin:9px 0;font-size:12px;font-weight:900}.row input{width:100%}.row output{text-align:right;font-variant-numeric:tabular-nums}.nudges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.nudges button,.actions button{border:1px solid #bfd0d4;border-radius:10px;background:#f5f9f7;color:#315f70;padding:8px;font-weight:900;cursor:pointer}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1}.tip{margin-top:8px;font-size:10px;line-height:1.35;color:#71888d}</style></head><body><iframe id="lesson" src="community-meeting-tuesday.html"></iframe><button class="toggle" id="toggle">Adjust Image</button><div class="panel" id="panel"><h3>Image Position</h3><div class="step" id="step">Loading…</div><div class="row"><span>Left</span><input id="x" type="range" min="-420" max="40" step="0.5"><output id="xo"></output></div><div class="row"><span>Top</span><input id="y" type="range" min="-280" max="60" step="0.5"><output id="yo"></output></div><div class="row"><span>Zoom</span><input id="z" type="range" min="150" max="520" step="1"><output id="zo"></output></div><div class="nudges"><button data-n="up">↑ Up</button><button data-n="zin">＋ Zoom</button><button data-n="left">← Left</button><button data-n="right">Right →</button><button data-n="zout">− Zoom</button><button data-n="down">↓ Down</button></div><div class="actions"><button id="reset">Reset Step</button><button id="copy">Copy Values</button></div><div class="tip">Use the lesson’s Previous/Next buttons normally. Controls switch to the image on screen. All five cards can be adjusted, including the new Something Else and Share artwork.</div></div><script>(()=>{const KEY='eea-community-meeting-tuesday-image-layout';const defaults={feel1:{x:-8,y:-205,z:430},feel2:{x:-112,y:-205,z:430},feel3:{x:-218,y:-205,z:430},feel4:{x:-2,y:-2,z:205},feel5:{x:-103,y:-2,z:205}};let values={};try{values={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){values={...defaults}}const f=document.getElementById('lesson'),panel=document.getElementById('panel'),toggle=document.getElementById('toggle'),x=document.getElementById('x'),y=document.getElementById('y'),z=document.getElementById('z'),xo=document.getElementById('xo'),yo=document.getElementById('yo'),zo=document.getElementById('zo'),step=document.getElementById('step');let obs=null;function doc(){return f.contentDocument}function active(){return doc()?.querySelector('.card.active .sprite')}function keyFor(s){return s?[...s.classList].find(c=>c!=='sprite'):null}function applyOne(s){const k=keyFor(s),v=values[k]||defaults[k],img=s?.querySelector('img');if(!img||!v)return;img.style.left=v.x+'%';img.style.top=v.y+'%';img.style.width=v.z+'%'}function applyAll(){doc()?.querySelectorAll('.sprite').forEach(applyOne)}function syncOut(){xo.textContent=Number(x.value).toFixed(1);yo.textContent=Number(y.value).toFixed(1);zo.textContent=Math.round(Number(z.value))+'%'}function load(){const s=active();if(!s)return;const k=keyFor(s),v=values[k]||defaults[k];const names={feel1:'Starting School',feel2:'Excited',feel3:'Nervous',feel4:'Something Else',feel5:'Share'};step.textContent=names[k]||k;x.value=v.x;y.value=v.y;z.value=v.z;syncOut()}function save(){const s=active();if(!s)return;const k=keyFor(s);values[k]={x:Number(x.value),y:Number(y.value),z:Number(z.value)};localStorage.setItem(KEY,JSON.stringify(values));applyOne(s);syncOut()}[x,y,z].forEach(el=>el.addEventListener('input',save));document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='up')y.value=Number(y.value)-1;if(n==='down')y.value=Number(y.value)+1;if(n==='left')x.value=Number(x.value)-1;if(n==='right')x.value=Number(x.value)+1;if(n==='zin')z.value=Number(z.value)+4;if(n==='zout')z.value=Number(z.value)-4;save()});document.getElementById('reset').onclick=()=>{const s=active();if(!s)return;const k=keyFor(s);values[k]={...defaults[k]};localStorage.setItem(KEY,JSON.stringify(values));applyOne(s);load()};document.getElementById('copy').onclick=async()=>{const text=JSON.stringify(values,null,2);try{await navigator.clipboard.writeText(text);const b=document.getElementById('copy');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy Values',1200)}catch(e){prompt('Copy these values:',text)}};toggle.onclick=()=>{panel.classList.toggle('open');load()};f.onload=()=>{applyAll();if(obs)obs.disconnect();obs=new MutationObserver(()=>{applyAll();load()});doc().querySelectorAll('.card').forEach(c=>obs.observe(c,{attributes:true,attributeFilter:['class']}));load()}})();</script></body></html>
