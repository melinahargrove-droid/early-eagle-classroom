<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 4 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f6f1e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 57%,#e4eee9 100%)}.top{position:absolute;left:3%;right:3%;top:2%;height:10%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.11em;font-size:clamp(11px,.72vw,15px)}.brand h1{margin:.3vh 0 0;color:#164f7f;font-size:clamp(30px,2.55vw,49px)}.homewrap{display:flex;justify-content:flex-end}.home{width:clamp(50px,3.4vw,65px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#164f7f;font-size:clamp(22px,1.6vw,31px);font-weight:900;cursor:pointer}.weeknav,.days{display:flex;gap:.42vw}.weeknav{padding:.5vh .55vw;border-radius:999px;background:rgba(255,253,247,.72);border:1px solid rgba(91,136,147,.15)}.weeknav button,.days button{border:0;border-radius:999px;font-weight:900;cursor:pointer}.weeknav button{padding:.72vh .82vw;background:transparent;color:#648086;font-size:clamp(10px,.68vw,14px)}.weeknav button.active{background:#668f99;color:#fff}.days{position:absolute;top:14%;left:50%;transform:translateX(-50%)}.days button{border:1.2px solid rgba(89,130,146,.18);background:#fffdf8;color:#557b83;padding:.8vh 1.2vw}.days button.active{background:#dbe9ec;color:#245c78}.card{position:absolute;left:6%;right:6%;top:22%;bottom:10%;border:1.6px solid rgba(89,139,151,.24);border-radius:31px;background:rgba(255,254,249,.93);box-shadow:0 18px 48px rgba(53,76,74,.07);padding:5vh 5vw}.eyebrow{color:#789697;font-weight:900;letter-spacing:.1em}.card h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(42px,3.7vw,70px)}.path{display:grid;gap:.7vw;margin-top:3.4vh;grid-template-columns:repeat(7,1fr)}.step{padding:1.7vh .65vw;border-radius:20px;background:#f3f5ef;border:1px solid rgba(89,130,146,.15);text-align:center;cursor:pointer;transition:transform .08s ease,box-shadow .08s ease,background .08s ease}.step:hover{background:#e8f1f3;box-shadow:0 7px 18px rgba(53,76,74,.08);transform:translateY(-1px)}.step:focus{outline:3px solid rgba(102,143,153,.35);outline-offset:3px}.step b{display:block;color:#245c78;font-size:clamp(12px,.82vw,17px)}.step span{display:block;margin-top:.55vh;color:#728783;font-weight:800;font-size:clamp(10px,.65vw,13px)}.start{position:absolute;right:5vw;bottom:4vh;border:0;border-radius:18px;background:#668f99;color:white;padding:1.3vh 1.8vw;font-weight:900;font-size:clamp(17px,1.1vw,21px);cursor:pointer}.note{margin-top:2.5vh;color:#557876;font-weight:800;font-size:clamp(17px,1.1vw,22px)}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Adventure</h1></div><div class="weeknav" id="weeknav"></div><div class="homewrap"><button class="home" onclick="location.href='index.html'">⌂</button></div></header><div class="days" id="days"></div><section class="card"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><div class="note">Press Start to begin at Community Meeting, or tap any lesson card to jump straight to that section.</div><div class="path" id="path"></div><button class="start" id="start">Start Today’s Lessons →</button></section></main><script>(()=>{const names=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search);let day=0;const raw=p.get('day');if(raw!==null){const n=Number(raw);if(Number.isInteger(n)&&n>=0&&n<5)day=n;else{const i=names.findIndex(x=>x.toLowerCase()===String(raw).toLowerCase());if(i>=0)day=i}}else{const saved=Number(localStorage.getItem('eea-daily-day'));if(Number.isInteger(saved)&&saved>=0&&saved<5)day=saved}const steps=[['Community Meeting','Start together','community-meeting-week4.html'],['Read Aloud','Today’s book','week4-read-aloud.html'],['Centers','Today’s center lesson','week4-intro-centers.html'],['Small Groups','Literacy & writing','week4-small-groups.html'],['Building Blocks','Math','week4-building-blocks.html'],['Storytelling','Story in our minds','week4-storytelling.html'],['Closing Circle','End the day','closing-circle-week4.html']];const $=id=>document.getElementById(id);function open(i){localStorage.setItem('eea-daily-week','4');localStorage.setItem('eea-daily-day',String(day));location.href=`${steps[i][2]}?day=${encodeURIComponent(names[day])}&from=plan&v=${Date.now()}`}function render(){localStorage.setItem('eea-daily-week','4');localStorage.setItem('eea-daily-day',String(day));$('weeknav').innerHTML=Array.from({length:8},(_,i)=>`<button class="${i===3?'active':''}" data-week="${i+1}">Week ${i+1}</button>`).join('');$('weeknav').querySelectorAll('button').forEach(b=>b.onclick=()=>{const w=Number(b.dataset.week);location.href=`daily-lessons.html?week=${w}&day=${day}&v=${Date.now()}`});$('days').innerHTML=names.map((n,i)=>`<button class="${i===day?'active':''}" data-i="${i}">${n}</button>`).join('');$('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{day=Number(b.dataset.i);history.replaceState(null,'',`week4-plan.html?day=${day}&v=${Date.now()}`);render()});$('eyebrow').textContent=`UNIT 1 · WEEK 4 · ${names[day].toUpperCase()}`;$('title').textContent=`${names[day]}’s Lessons`;$('path').innerHTML=steps.map((x,i)=>`<div class="step" role="button" tabindex="0" data-i="${i}" aria-label="Open ${x[0]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('path').querySelectorAll('.step').forEach(el=>{const go=()=>open(Number(el.dataset.i));el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});$('start').onclick=()=>open(0)}render()})();</script></body></html>
