<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 4 Today’s Plan</title><style>:root{--navy:#165487;--line:#c9dadd;--green:#e8f3df;--blue:#e6f1fb;--gold:#fff1c9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf7ec,#eef4ef);font-family:"Trebuchet MS",Arial,sans-serif;color:#174f76}.page{min-height:100vh;padding:14px 24px}.top{text-align:center}.top h1{margin:0;color:var(--navy);font-size:38px}.top p{margin:4px 0 12px;font-weight:900;color:#52717a}.days{display:flex;justify-content:center;gap:6px;margin-bottom:10px}.days button{border:1px solid var(--line);border-radius:999px;background:#fffdf8;padding:8px 18px;font-weight:900;color:#52717a;cursor:pointer}.days button.active{background:#6f9ead;color:white}.card{max-width:1370px;margin:auto;background:#fffdf8;border:1.5px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 28px rgba(65,92,96,.1)}.head{padding:12px 24px;border-bottom:1px solid #e1e8e5}.head h2{margin:0;color:var(--navy);font-size:28px}.row{display:grid;grid-template-columns:90px 48px 1fr 160px;align-items:center;min-height:54px;padding:4px 22px;border-top:1px solid #e5eae6}.time{font-size:17px;font-weight:900;color:var(--navy)}.ico{font-size:27px;text-align:center}.what b{display:block;font-size:18px;color:var(--navy)}.what span{font-size:13px;color:#55747b}.open{border:1px solid #bad6b0;background:var(--green);color:#426f49;border-radius:11px;padding:8px;font-weight:900;cursor:pointer}.read{background:var(--blue);border-color:#bad7ed;color:#275d87}.directions{background:var(--gold);border-color:#e8cc84;color:#856323}.routine .open{visibility:hidden}.footer{padding:10px;text-align:center;color:#829491;font-size:12px}</style></head><body><main class="page"><div class="top"><h1>Today’s Plan</h1><p id="sub"></p></div><div class="days" id="days"></div><section class="card"><div class="head"><h2 id="heading"></h2></div><div id="rows"></div><div class="footer">Week 4 production build • custom illustrations deferred to visual production pass.</div></section></main><script>(()=>{const names=['Monday','Tuesday','Wednesday','Thursday','Friday'];let day='Monday';const community={Monday:'Snake Breath',Tuesday:'Conversation • What can you do when you feel…?',Wednesday:'Story Rounds',Thursday:'Saturday Calm-Down Practice',Friday:'Our Community Story'},reads={Monday:'The Rabbit Listened • Read 3',Tuesday:'Saturday • Read 1',Wednesday:'Saturday • Read 2',Thursday:'Saturday • Read 3',Friday:'Saturday • Read 4'},centers={Monday:'Art Easel • Painting',Tuesday:'Blocks • Building a Neighborhood + Writing & Drawing • Making Lines and Shapes',Wednesday:'Discovery • Making Playdough',Thursday:'Continue Centers',Friday:'Continue Centers'},foundational={Monday:'Letter ID • Mm, Aa',Tuesday:'Poem • M is for Melanin',Wednesday:'Letter ID • Mm, Aa',Thursday:'Concepts of Print • Words',Friday:'Letter ID • Mm, Aa'},stories={Monday:'The Blue Paint Drop',Tuesday:'The Long Way Home',Wednesday:'The Playdough Problem',Thursday:'The Closed Library Door',Friday:'You Tell a Saturday Story'},closing={Monday:'Slow Like a Snake',Tuesday:'What Might Happen Next?',Wednesday:'One Neighborhood Place',Thursday:'Show Me Relief',Friday:'What Made Today Special?'};const base=[['8:10','🌞','Community Meeting','', 'community'],['8:20','📖','Read Aloud','', 'read'],['8:45','🥣','Breakfast','',null],['9:00','🖍️','Intro to Centers','', 'introcenters'],['9:10','🧺','Centers','Choose where friends will play and learn','centers'],['during','🔤','Foundational Literacy','', 'foundational'],['during','🙂','Literacy Small Group','Writing Basics • Skills Reinforcement • Neighborhood Charades • Fine Motor Development','smallgroup'],['during','🔢','Building Blocks','Counting experiences • Exploring Manipulatives','building'],['10:15','🛝','Recess','',null],['11:00','🍽️','Lunch','',null],['After lunch','🌙','Nap','',null],['2:00','🍎','Snack','',null],['2:30+','💭','Storytelling','', 'story'],['2:30+','❤️','Closing Circle','', 'closing']];function render(){sub.textContent=day+' • Week 4';heading.textContent=day+'’s Plan';days.innerHTML=names.map(n=>`<button data-day="${n}" class="${n===day?'active':''}">${n}</button>`).join('');rows.innerHTML=base.map(r=>{let detail=r[3];if(r[2]==='Community Meeting')detail=community[day];if(r[2]==='Read Aloud')detail=reads[day];if(r[2]==='Intro to Centers')detail=centers[day];if(r[2]==='Foundational Literacy')detail=foundational[day];if(r[2]==='Storytelling')detail=stories[day];if(r[2]==='Closing Circle')detail=closing[day];const routine=!r[4];const cls=r[4]==='read'?'open read':['smallgroup','foundational','building'].includes(r[4])?'open directions':'open';return `<div class="row ${routine?'routine':''}"><div class="time">${r[0]}</div><div class="ico">${r[1]}</div><div class="what"><b>${r[2]}</b><span>${detail}</span></div><button class="${cls}" ${r[4]?`data-lesson="${r[4]}"`:''}>${r[4]==='read'?'Read Aloud':r[4]==='smallgroup'?'Choose Activity':r[4]==='centers'?'Choose Centers':r[4]?'Open Lesson':''}</button></div>`}).join('')}document.addEventListener('click',e=>{const d=e.target.closest('[data-day]');if(d){day=d.dataset.day;render();return}const b=e.target.closest('[data-lesson]');if(!b)return;const l=b.dataset.lesson,paths={community:'community-meeting-week4.html',read:'week4-read-aloud.html',introcenters:'week4-intro-centers.html',centers:'week4-centers.html',foundational:'week4-foundational.html',smallgroup:'week4-small-groups.html',building:'week4-building-blocks.html',story:'week4-storytelling.html',closing:'closing-circle-week4.html'};location.href=`${paths[l]}?day=${encodeURIComponent(day)}&from=plan`});render()})();</script></body></html>
