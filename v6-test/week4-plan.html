<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 4 Today’s Plan</title></head><body><script>(()=>{const p=new URLSearchParams(location.search);const names=['Monday','Tuesday','Wednesday','Thursday','Friday'];const raw=p.get('day');let day=null;if(raw!==null){const n=Number(raw);if(Number.isInteger(n)&&n>=0&&n<5)day=n;else{const i=names.findIndex(x=>x.toLowerCase()===String(raw).toLowerCase());if(i>=0)day=i}}const saved=Number(localStorage.getItem('eea-daily-day'));if(day===null&&Number.isInteger(saved)&&saved>=0&&saved<5)day=saved;const target='daily-lessons.html?week=4'+(day===null?'':'&day='+day)+'&v='+Date.now();location.replace(target)})();</script></body></html>
