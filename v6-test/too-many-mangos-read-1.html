<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Too Many Mangos Read 1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:2vh 1.4vw 1.5vh;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:8.5vh;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(85,135,150,.18)}.meta{color:#648b91;font-weight:900;letter-spacing:.1em;font-size:clamp(10px,.72vw,14px)}h1{margin:.4vh 0 0;color:#164f7f;font-size:clamp(22px,1.7vw,34px)}.actions{display:flex;gap:.7vw;align-items:center}.chip,.iconbtn,.notesbtn{border:1px solid rgba(82,128,142,.16);background:rgba(255,253,247,.92);color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.75vh 1.1vw;border-radius:15px;background:rgba(215,234,239,.8)}.iconbtn{width:clamp(42px,2.8vw,54px);aspect-ratio:1;border-radius:50%;font-size:clamp(18px,1.3vw,25px)}.stage{position:relative;height:78vh;margin-top:1.2vh;border:1.5px solid rgba(89,139,151,.24);border-radius:27px;background:rgba(255,254,249,.9);display:flex;align-items:center;justify-content:center;overflow:hidden}.notesbtn{position:absolute;right:1.2vw;top:1.2vh;padding:.8vh 1vw;border-radius:14px;background:rgba(211,233,240,.9);z-index:3}.card{width:86%;height:78%;border-radius:30px;border:1.5px solid rgba(96,140,145,.18);background:radial-gradient(circle at 50% 18%,rgba(255,255,251,.96),rgba(224,236,233,.7) 65%,rgba(249,244,232,.84));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 5vw;box-shadow:0 10px 28px rgba(62,88,86,.06)}.visual{width:clamp(125px,9vw,175px);aspect-ratio:1;border-radius:50%;background:rgba(255,253,247,.82);display:flex;align-items:center;justify-content:center;font-size:clamp(66px,5vw,96px)}.card h2{margin:2vh 0 .6vh;color:#315f70;font-size:clamp(32px,2.6vw,50px);line-height:1.08}.copy{color:#587875;font-weight:800;font-size:clamp(19px,1.35vw,26px);line-height:1.42;max-width:65vw}.step{margin-top:1.8vh;padding:.5vh .9vw;border-radius:999px;background:rgba(118,155,159,.12);color:#78908e;font-weight:900;font-size:clamp(10px,.72vw,14px);letter-spacing:.05em}.cover-card{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:5vw;align-items:center;text-align:left;padding:4vh 7vw}.cover-wrap{height:58vh;display:flex;align-items:center;justify-content:center}.cover-wrap img{max-height:100%;max-width:100%;object-fit:contain;border-radius:8px;box-shadow:0 16px 32px rgba(51,64,67,.18)}.cover-info{display:flex;flex-direction:column;align-items:flex-start}.cover-kicker{color:#719298;font-weight:900;letter-spacing:.12em}.cover-info h2{font-size:clamp(34px,2.7vw,54px);color:#164f7f}.cover-byline{color:#527678;font-size:clamp(16px,1.05vw,21px);font-weight:800;line-height:1.5}.cover-question{margin-top:3vh;padding:1.4vh 1.4vw;border-radius:18px;background:rgba(216,234,237,.62);color:#4f765e;font-size:clamp(21px,1.5vw,29px);font-weight:900}.spread-card{position:relative;width:94%;height:88%;padding:0;background:rgba(255,254,249,.98);overflow:hidden}.spread-image{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.spread-image img{width:auto;height:97%;max-width:97%;object-fit:contain;border-radius:12px;box-shadow:0 14px 32px rgba(51,64,67,.16)}.spread-card .step{position:absolute;right:1.2vw;bottom:1.2vh;margin:0;background:rgba(255,253,247,.9)}.prompt-card{width:82%;height:70%;padding:5vh 6vw}.prompt-kicker{color:#719298;font-size:clamp(11px,.78vw,15px);font-weight:900;letter-spacing:.11em;margin-bottom:1.1vh}.vocab-card{width:88%;height:76%;display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:4vw;align-items:center;text-align:left;padding:4vh 6vw}.spritevisual{width:100%;max-width:430px;aspect-ratio:1.23;border-radius:24px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15)}.spritevisual svg{display:block;width:100%;height:100%}.vocab-copy{display:flex;flex-direction:column;align-items:flex-start}.vocab-copy h2{margin:.3vh 0 1.2vh;font-size:clamp(38px,3vw,58px);color:#164f7f}.vocab-def{color:#587875;font-weight:900;font-size:clamp(20px,1.5vw,29px);line-height:1.38}.gesture{margin-top:2vh;padding:1vh 1.2vw;border-radius:16px;background:rgba(216,234,237,.62);color:#4f765e;font-weight:900;font-size:clamp(16px,1.05vw,21px)}.duo{display:grid;grid-template-columns:1fr 1fr;gap:2vw;width:100%;max-width:1000px}.duoitem{text-align:center}.duoitem .spritevisual{max-width:340px;margin:auto}.duoitem h2{font-size:clamp(30px,2.3vw,44px);margin:1vh 0 .4vh}.duoitem p{margin:0;color:#587875;font-weight:900;font-size:clamp(17px,1.15vw,22px)}.footer{height:8vh;display:grid;grid-template-columns:15% 1fr 15%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:16px;padding:1.1vh 1.2vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.nav:disabled{opacity:.35}.prev{background:rgba(255,253,247,.94);color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:rgba(177,214,230,.5);overflow:hidden;margin-top:.65vh}.fill{height:100%;background:#6ea6c2;border-radius:999px}.panel{position:absolute;right:1.2vw;top:7vh;width:min(430px,32vw);padding:1.5vh 1.2vw;border-radius:20px;background:rgba(255,253,247,.98);border:1.4px solid rgba(83,120,128,.18);box-shadow:0 12px 28px rgba(44,67,68,.14);z-index:5;display:none}.panel.open{display:block}.label{color:#7b9899;font-weight:900;font-size:12px;letter-spacing:.06em}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:700;line-height:1.42}</style></head><body><main class="page"><header><div><div class="meta">READ ALOUD · UNIT 1 · WEEK 1</div><h1>Too Many Mangos · Read 1 of 4</h1></div><div class="actions"><div class="chip">Thursday</div><button class="iconbtn" id="backBtn">←</button><button class="iconbtn" onclick="location.href='index.html'">⌂</button></div></header><section class="stage"><button class="notesbtn" id="notesBtn">Teacher Notes</button><div class="card" id="card"></div><aside class="panel" id="panel"><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS / PAGE</div><p id="materials"></p></aside></section><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const cards=[{"type":"cover","src":"assets/mangos/mango-01.jpg","title":"Too Many Mangos: A Story About Sharing","notes":"Introduce the title, author Tammy Paikai, and illustrator Don Robinson. Make the mango connection before reading.","materials":"Too Many Mangos"},{"type":"prompt","title":"Have You Tasted Mango?","icon":"🥭","kicker":"BEFORE WE READ","copy":"Thumbs up if you have ever tasted mango. It’s a tropical fruit that grows in warm places. Let’s see what the characters do with too many mangos!","notes":"Invite a quick show of thumbs, then begin reading.","materials":"Before reading · 1 minute"},{"type":"spread","title":"Pages 2–3","src":"assets/mangos/mango-02.jpg","notes":"Continue reading.","materials":"Adapted text · pages 2–3"},{"type":"spread","title":"Pages 4–5","src":"assets/mangos/mango-03.jpg","notes":"Continue reading.","materials":"Adapted text · pages 4–5"},{"type":"vocab","title":"Tug","word":"tug","kicker":"QUICK WORD","definition":"To pull hard.","gesture":"Show me with your body how you would tug a mango off a tree branch.","notes":"Briefly define tug and invite the movement.","materials":"Curriculum stop · page 4"},{"type":"spread","title":"Pages 6–7","src":"assets/mangos/mango-04.jpg","notes":"Continue reading.","materials":"Adapted text · pages 6–7"},{"type":"prompt","title":"What Is the Problem?","icon":"?","kicker":"STOP & THINK","copy":"What is the problem in the book? Make a face like Grandpa. Maybe Grandpa is thinking hard about what to do!","notes":"Invite a few responses and a quick thinking face.","materials":"Curriculum stop · page 7"},{"type":"spread","title":"Pages 8–9","src":"assets/mangos/mango-05.jpg","notes":"Continue reading.","materials":"Adapted text · pages 8–9"},{"type":"spread","title":"Pages 10–11","src":"assets/mangos/mango-06.jpg","notes":"Continue reading.","materials":"Adapted text · pages 10–11"},{"type":"duovocab","title":"Aloha & Mahalo","kicker":"QUICK WORDS","notes":"Explain the two Hawaiian words briefly, then continue.","materials":"Curriculum stop · page 10"},{"type":"spread","title":"Pages 12–13","src":"assets/mangos/mango-07.jpg","notes":"Continue reading.","materials":"Adapted text · pages 12–13"},{"type":"spread","title":"Pages 14–15","src":"assets/mangos/mango-08.jpg","notes":"Continue reading.","materials":"Adapted text · pages 14–15"},{"type":"spread","title":"Pages 16–17","src":"assets/mangos/mango-09.jpg","notes":"Continue reading.","materials":"Adapted text · pages 16–17"},{"type":"spread","title":"Pages 18–19","src":"assets/mangos/mango-10.jpg","notes":"Continue reading.","materials":"Adapted text · pages 18–19"},{"type":"prompt","title":"What Are the Neighbors Sharing?","icon":"↔","kicker":"STOP & THINK","copy":"We have read over half of the book! What are some things the neighbors share with Kama and Nani?","notes":"Invite a couple of responses, then continue reading.","materials":"Curriculum stop · page 19"},{"type":"spread","title":"Pages 20–21","src":"assets/mangos/mango-11.jpg","notes":"Continue reading.","materials":"Adapted text · pages 20–21"},{"type":"spread","title":"Pages 22–23","src":"assets/mangos/mango-12.jpg","notes":"Continue reading.","materials":"Adapted text · pages 22–23"},{"type":"spread","title":"Pages 24–25","src":"assets/mangos/mango-13.jpg","notes":"Continue reading.","materials":"Adapted text · pages 24–25"},{"type":"spread","title":"Pages 26–27","src":"assets/mangos/mango-14.jpg","notes":"Continue reading.","materials":"Adapted text · pages 26–27"},{"type":"prompt","title":"What Do They Do With the Gifts?","icon":"🎁","kicker":"STOP & THINK","copy":"What do Kama, Nani, and Grandpa do with the gifts they have received from their neighbors?","notes":"Invite children to recall what the family does with the gifts.","materials":"Curriculum stop · page 27"},{"type":"spread","title":"The End","src":"assets/mangos/mango-15.jpg","notes":"Pause on the final illustration before the closing discussion.","materials":"Final illustration"},{"type":"prompt","title":"How Does Sharing Feel?","icon":"♥","kicker":"AFTER READING","copy":"How does sharing mangoes make Kama, Nani, Grandpa, and the neighbors feel? How do you feel when you share with someone?","notes":"Connect the characters’ feelings to children’s own experiences.","materials":"After reading · 3 minutes"},{"type":"prompt","title":"Sharing in Our Community","icon":"🥭","kicker":"CLOSING","copy":"Maybe in Discovery Center you can make some of the foods in the story out of playdough. We’ll read this book again tomorrow.","notes":"Close the read and transition to the next activity.","materials":"Closing"}];const vocabPos={aloha:{x:346,y:473,w:234,h:190},mahalo:{x:1246,y:473,w:234,h:190},tug:{x:346,y:752,w:234,h:190}};function sprite(word){const p=vocabPos[word];return `<svg viewBox="${p.x} ${p.y} ${p.w} ${p.h}" preserveAspectRatio="xMidYMid meet"><image href="assets/u1-vocab-sprite-1.png" x="0" y="0" width="1536" height="1024"/></svg>`}const key='eea-daily-lessons-u1-w1-3',version='mango-read1-v1';let step=0;try{const s=JSON.parse(localStorage.getItem(key));if(s?.raVersion===version&&Number.isInteger(s?.raStep))step=Math.max(0,Math.min(cards.length-1,s.raStep))}catch(e){}const $=id=>document.getElementById(id);function save(done=false){let s={current:1,done:[],raStep:step,raVersion:version};try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}s.current=1;s.raStep=step;s.raVersion=version;if(done&&!s.done.includes(1))s.done.push(1);localStorage.setItem(key,JSON.stringify(s))}function render(){const c=cards[step],card=$('card');card.className='card';$('panel').classList.remove('open');if(c.type==='cover'){card.classList.add('cover-card');card.innerHTML=`<div class="cover-wrap"><img src="${c.src}" alt="Too Many Mangos cover"></div><div class="cover-info"><div class="cover-kicker">TODAY’S BOOK · READ 1</div><h2>${c.title}</h2><div class="cover-byline">Written by Tammy Paikai<br>Illustrated by Don Robinson</div><div class="cover-question">What do you notice on the cover?</div><div class="step">READ 1 · ${step+1} OF ${cards.length}</div></div>`}else if(c.type==='spread'){card.classList.add('spread-card');card.innerHTML=`<div class="spread-image"><img src="${c.src}" alt="${c.title}"></div><div class="step">READ 1 · ${step+1} OF ${cards.length}</div>`}else if(c.type==='vocab'){card.classList.add('vocab-card');card.innerHTML=`<div class="spritevisual">${sprite(c.word)}</div><div class="vocab-copy"><div class="prompt-kicker">${c.kicker}</div><h2>${c.title}</h2><div class="vocab-def">${c.definition}</div><div class="gesture">${c.gesture}</div><div class="step">READ 1 · ${step+1} OF ${cards.length}</div></div>`}else if(c.type==='duovocab'){card.classList.add('prompt-card');card.innerHTML=`<div class="prompt-kicker">${c.kicker}</div><div class="duo"><div class="duoitem"><div class="spritevisual">${sprite('aloha')}</div><h2>Aloha</h2><p>Hello in Hawaiian.</p></div><div class="duoitem"><div class="spritevisual">${sprite('mahalo')}</div><h2>Mahalo</h2><p>Thank you in Hawaiian.</p></div></div><div class="step">READ 1 · ${step+1} OF ${cards.length}</div>`}else{card.classList.add('prompt-card');card.innerHTML=`<div class="prompt-kicker">${c.kicker}</div><div class="visual">${c.icon}</div><h2>${c.title}</h2><div class="copy">${c.copy}</div><div class="step">READ 1 · ${step+1} OF ${cards.length}</div>`}$('count').textContent=`${step+1} of ${cards.length}`;$('fill').style.width=((step+1)/cards.length*100)+'%';$('noteTitle').textContent=c.title;$('notes').textContent=c.notes||'Continue reading.';$('materials').textContent=c.materials||'Too Many Mangos';$('prev').disabled=step===0;$('next').textContent=step===cards.length-1?'Finish Read Aloud ✓':'Next →';save()}$('prev').onclick=()=>{if(step>0){step--;render()}};$('next').onclick=()=>{if(step<cards.length-1){step++;render()}else{save(true);location.href='daily-lessons.html'}};$('backBtn').onclick=()=>{save();location.href='daily-lessons.html'};$('notesBtn').onclick=()=>$('panel').classList.toggle('open');render()})();</script></body></html>
