<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movement Song Library</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:#173f72;background:#e4efec}button,input,select{font:inherit}.page{min-height:100vh;padding:2.5vh 3vw;background:radial-gradient(circle at 50% 0,#fffdf7,#edf4ed 55%,#dbe9e7)}.top{display:flex;align-items:center;justify-content:space-between;gap:1vw;margin-bottom:2vh}.top h1{margin:0;font-size:clamp(34px,3vw,58px)}.top p{margin:.4vh 0 0;color:#58736d;font-weight:700}.back{border:1px solid #c9d9d8;background:#fffdf8;color:#245c78;border-radius:16px;padding:1vh 1.2vw;font-weight:900;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(260px,28%) 1fr;gap:1.5vw;max-width:1500px;margin:auto}.panel{background:#fffdf8;border:1.5px solid #cbdde0;border-radius:26px;padding:2vh 1.5vw;box-shadow:0 8px 20px rgba(53,72,80,.08)}.panel h2{margin:.2vh 0 1.5vh;color:#264b62}.category-list{display:grid;gap:.7vh;max-height:62vh;overflow:auto;padding-right:.2vw}.cat{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.6vw;border:1.5px solid #d4e1df;border-radius:15px;background:#f9f5eb;color:#315f70;padding:.95vh .9vw;font-weight:900;cursor:pointer;text-align:left}.cat.active{background:#dfeeed;border-color:#83aab1;color:#174f7d}.count{font-size:12px;background:#fff;border-radius:999px;padding:.25vh .55vw;color:#6a7e7b}.add-row{display:flex;gap:.6vw;margin-top:1.3vh}.add-row input{min-width:0;flex:1}.field,input,select{border:1.5px solid #cbdad9;border-radius:13px;background:#fff;color:#254b61;padding:.8vh .8vw}.primary,.secondary,.danger,.mini{border:0;border-radius:13px;padding:.85vh 1vw;font-weight:900;cursor:pointer}.primary{background:#668f99;color:white}.secondary{background:#e5efec;color:#315f70}.danger{background:#f4dfda;color:#8b4339}.mini{padding:.55vh .7vw;background:#edf3f0;color:#41665f}.category-actions{display:flex;gap:.6vw;margin-top:1.2vh}.category-actions button{flex:1}.library-head{display:flex;justify-content:space-between;gap:1vw;align-items:flex-start}.library-head h2{margin:0}.muted{color:#6b7d78;font-weight:700;font-size:14px}.song-form{display:grid;grid-template-columns:1.2fr 1fr 1.3fr .7fr auto;gap:.7vw;margin:1.5vh 0;align-items:end}.group{display:grid;gap:.35vh}.group label{font-size:12px;font-weight:900;color:#66807a}.song-list{display:grid;gap:.8vh;max-height:60vh;overflow:auto;padding-right:.2vw}.song{display:grid;grid-template-columns:1fr auto;gap:1vw;align-items:center;border:1.4px solid #d9e4e1;background:#fbf8f0;border-radius:16px;padding:1vh 1vw}.song strong{font-size:17px;color:#264d64}.song small{display:block;color:#71817d;margin-top:.25vh}.song-actions{display:flex;gap:.45vw}.empty{padding:5vh 2vw;text-align:center;color:#758480;font-weight:800;border:2px dashed #d6e0dd;border-radius:18px}.note{margin-top:1.5vh;padding:1.2vh 1vw;border-radius:14px;background:#eaf2ef;color:#506f68;font-weight:800;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}.song-form{grid-template-columns:1fr 1fr}.song-form .wide{grid-column:1/-1}.song-list{max-height:none}.category-list{max-height:none}}
</style></head><body><main class="page"><header class="top"><div><h1>🎵 Movement Song Library</h1><p>Create as many song categories as you want. Eddie can randomize from one category or from all songs.</p></div><button class="back" onclick="location.href='movement.html'">← Back to Movement</button></header><div class="layout"><aside class="panel"><h2>Song Categories</h2><div class="category-list" id="categoryList"></div><div class="add-row"><input id="newCategory" placeholder="New category name" maxlength="40"><button class="primary" id="addCategory">+ Add</button></div><div class="category-actions"><button class="secondary" id="renameCategory">Rename</button><button class="danger" id="deleteCategory">Delete</button></div><div class="note">Examples: Everyday Songs, Halloween, Christmas, Fall, Valentine’s Day, Calm Movement — or anything else you want.</div></aside><section class="panel"><div class="library-head"><div><h2 id="categoryTitle">Everyday Songs</h2><div class="muted" id="categorySubtitle"></div></div></div><div class="song-form"><div class="group"><label>Song title</label><input id="songTitle" placeholder="e.g. Monster Freeze Dance"></div><div class="group"><label>Creator / source</label><input id="songSource" placeholder="e.g. Danny Go!"></div><div class="group wide"><label>YouTube URL or video ID</label><input id="songUrl" placeholder="https://youtube.com/watch?v=..."></div><div class="group"><label>Duration</label><input id="songDuration" placeholder="3:15"></div><button class="primary" id="saveSong">+ Add Song</button></div><div class="song-list" id="songList"></div></section></div></main><script>
const LIBRARY_KEY='eea-movement-song-library-v2',ACTIVE_KEY='eea-movement-active-category-v2';
const defaults=[{id:'Nqg5zY0MOfI',title:'Move It and Freeze',seconds:180,source:'Jack Hartmann'},{id:'HpOe8lngp_o',title:'Animal Dance and Freeze',seconds:188,source:'Jack Hartmann'},{id:'f7Q1oJ4BLs0',title:'Simon Says',seconds:189,source:'DJ Raphi'},{id:'qSkVgH-4PKw',title:'The Dinosaur Dance',seconds:195,source:'Danny Go!'},{id:'nEUTY8n2iZo',title:'The Floor Is Lava Dance',seconds:193,source:'Danny Go!'},{id:'qQB-V4r-uMY',title:'The Monkey Dance',seconds:139,source:'Danny Go!'},{id:'DsUPVERZFlI',title:'The Wiggle Dance',seconds:175,source:'Danny Go!'},{id:'T8Df3VZCKUc',title:'The Robot Dance',seconds:180,source:'Danny Go!'},{id:'nvDLe3FHcuY',title:'Stomp Clap Dance',seconds:185,source:'Danny Go!'},{id:'-y5yuLuw7KQ',title:'Exercise Dance',seconds:190,source:'Danny Go!'},{id:'DzgwbVZr_VU',title:'Quicksand, Lava, Sharks + More!',seconds:1086,source:'Danny Go!'},{id:'AuEIIRbXMHU',title:'Summer Dance Challenge',seconds:2218,source:'Danny Go!'}];
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function seed(){return {version:2,categories:[{id:'everyday',name:'Everyday Songs',songs:defaults}]}}
function load(){try{const x=JSON.parse(localStorage.getItem(LIBRARY_KEY)||'null');if(x&&Array.isArray(x.categories)&&x.categories.length)return x}catch(e){}const x=seed();localStorage.setItem(LIBRARY_KEY,JSON.stringify(x));return x}
let data=load(),selected=localStorage.getItem(ACTIVE_KEY);if(!data.categories.some(c=>c.id===selected))selected=data.categories[0].id;let editSongId=null;
const $=id=>document.getElementById(id),categoryList=$('categoryList'),songList=$('songList');
function save(){localStorage.setItem(LIBRARY_KEY,JSON.stringify(data));localStorage.setItem(ACTIVE_KEY,selected)}
function current(){return data.categories.find(c=>c.id===selected)||data.categories[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(sec){const m=Math.floor(sec/60),s=Math.round(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
function parseDuration(v){v=String(v||'').trim();if(/^\d+:\d{1,2}$/.test(v)){const [m,s]=v.split(':').map(Number);return Math.max(1,m*60+s)}const n=Number(v);return Number.isFinite(n)&&n>0?Math.round(n):0}
function videoId(v){v=String(v||'').trim();if(/^[A-Za-z0-9_-]{11}$/.test(v))return v;try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(u.searchParams.get('v'))return u.searchParams.get('v');const parts=u.pathname.split('/').filter(Boolean);const i=parts.findIndex(x=>['embed','shorts','live'].includes(x));if(i>=0&&parts[i+1])return parts[i+1]}catch(e){}return ''}
function render(){categoryList.innerHTML=data.categories.map(c=>`<button class="cat ${c.id===selected?'active':''}" data-id="${esc(c.id)}"><span>${esc(c.name)}</span><span class="count">${c.songs.length}</span></button>`).join('');categoryList.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{selected=b.dataset.id;editSongId=null;clearForm();save();render()});const c=current();$('categoryTitle').textContent=c.name;$('categorySubtitle').textContent=`${c.songs.length} song${c.songs.length===1?'':'s'} in this list`;songList.innerHTML=c.songs.length?c.songs.map(s=>`<div class="song"><div><strong>${esc(s.title)}</strong><small>${esc(s.source||'')} · ${fmt(s.seconds||180)} · YouTube ID: ${esc(s.id)}</small></div><div class="song-actions"><button class="mini" data-edit="${esc(s.uid||s.id)}">Edit</button><button class="danger mini" data-del="${esc(s.uid||s.id)}">Delete</button></div></div>`).join(''):`<div class="empty">No songs in this category yet.<br>Add one above and Eddie will be able to pick it.</div>`;songList.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSong(b.dataset.edit));songList.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteSong(b.dataset.del))}
function clearForm(){$('songTitle').value='';$('songSource').value='';$('songUrl').value='';$('songDuration').value='';$('saveSong').textContent='+ Add Song';editSongId=null}
$('addCategory').onclick=()=>{const name=$('newCategory').value.trim();if(!name)return;if(data.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return alert('That category already exists.');const c={id:uid('cat'),name,songs:[]};data.categories.push(c);selected=c.id;$('newCategory').value='';save();render()};
$('newCategory').addEventListener('keydown',e=>{if(e.key==='Enter')$('addCategory').click()});
$('renameCategory').onclick=()=>{const c=current(),name=prompt('Rename this category:',c.name);if(name&&name.trim()){c.name=name.trim();save();render()}};
$('deleteCategory').onclick=()=>{if(data.categories.length===1)return alert('Keep at least one song category.');const c=current();if(!confirm(`Delete “${c.name}” and its ${c.songs.length} song${c.songs.length===1?'':'s'}?`))return;data.categories=data.categories.filter(x=>x.id!==c.id);selected=data.categories[0].id;clearForm();save();render()};
$('saveSong').onclick=()=>{const title=$('songTitle').value.trim(),source=$('songSource').value.trim(),id=videoId($('songUrl').value),seconds=parseDuration($('songDuration').value);if(!title)return alert('Add a song title.');if(!id)return alert('Paste a valid YouTube URL or 11-character video ID.');if(!seconds)return alert('Add the duration as minutes:seconds, such as 3:15.');const c=current();if(editSongId){const s=c.songs.find(x=>(x.uid||x.id)===editSongId);if(s){s.title=title;s.source=source;s.id=id;s.seconds=seconds}}else c.songs.push({uid:uid('song'),id,title,source,seconds});clearForm();save();render()};
function editSong(k){const s=current().songs.find(x=>(x.uid||x.id)===k);if(!s)return;editSongId=k;$('songTitle').value=s.title;$('songSource').value=s.source||'';$('songUrl').value='https://www.youtube.com/watch?v='+s.id;$('songDuration').value=fmt(s.seconds||180);$('saveSong').textContent='Save Changes';window.scrollTo({top:0,behavior:'smooth'})}
function deleteSong(k){const c=current(),s=c.songs.find(x=>(x.uid||x.id)===k);if(!s||!confirm(`Remove “${s.title}” from ${c.name}?`))return;c.songs=c.songs.filter(x=>(x.uid||x.id)!==k);save();render()}
render();
</script></body></html>
