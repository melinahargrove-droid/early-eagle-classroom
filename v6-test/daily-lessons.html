<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Daily Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f6f1e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 57%,#e4eee9 100%)}.top{position:absolute;left:3%;right:3%;top:2%;height:10%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.11em;font-size:clamp(11px,.72vw,15px)}.brand h1{margin:.3vh 0 0;color:#164f7f;font-size:clamp(30px,2.55vw,49px)}.homewrap{display:flex;justify-content:flex-end;gap:.5vw}.home,.pace{border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#164f7f;font-weight:900;cursor:pointer}.home{width:clamp(50px,3.4vw,65px);aspect-ratio:1;border-radius:50%;font-size:clamp(22px,1.6vw,31px)}.pace{border-radius:999px;padding:.8vh 1vw}.weeknav,.days{display:flex;gap:.42vw}.weeknav{padding:.5vh .55vw;border-radius:999px;background:rgba(255,253,247,.72);border:1px solid rgba(91,136,147,.15)}.weeknav button,.days button{border:0;border-radius:999px;font-weight:900;cursor:pointer}.weeknav button{padding:.72vh .82vw;background:transparent;color:#648086;font-size:clamp(10px,.68vw,14px)}.weeknav button.active{background:#668f99;color:#fff}.days{position:absolute;top:14%;left:50%;transform:translateX(-50%)}.days button{border:1.2px solid rgba(89,130,146,.18);background:#fffdf8;color:#557b83;padding:.8vh 1.2vw}.days button.active{background:#dbe9ec;color:#245c78}.card{position:absolute;left:6%;right:6%;top:22%;bottom:10%;border:1.6px solid rgba(89,139,151,.24);border-radius:31px;background:rgba(255,254,249,.93);box-shadow:0 18px 48px rgba(53,76,74,.07);padding:5vh 5vw}.eyebrow{color:#789697;font-weight:900;letter-spacing:.1em}.card h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(42px,3.7vw,70px)}.path{display:grid;gap:.8vw;margin-top:3.4vh}.path.five{grid-template-columns:repeat(5,1fr)}.path.six{grid-template-columns:repeat(6,1fr)}.path.seven{grid-template-columns:repeat(7,1fr);gap:.65vw}.path.seven .step{padding-left:.55vw;padding-right:.55vw}.path.seven .step b{font-size:clamp(12px,.8vw,16px)}.path.seven .step span{font-size:clamp(10px,.64vw,13px)}.step{padding:1.7vh .8vw;border-radius:20px;background:#f3f5ef;border:1px solid rgba(89,130,146,.15);text-align:center}.step.jump{cursor:pointer;transition:transform .08s ease,box-shadow .08s ease,background .08s ease}.step.jump:hover{background:#e8f1f3;box-shadow:0 7px 18px rgba(53,76,74,.08);transform:translateY(-1px)}.step.jump:focus{outline:3px solid rgba(102,143,153,.35);outline-offset:3px}.step b{display:block;color:#245c78;font-size:clamp(14px,.9vw,18px)}.step span{display:block;margin-top:.55vh;color:#728783;font-weight:800;font-size:clamp(11px,.72vw,14px)}.start{position:absolute;right:5vw;bottom:4vh;border:0;border-radius:18px;background:#668f99;color:white;padding:1.3vh 1.8vw;font-weight:900;font-size:clamp(17px,1.1vw,21px);cursor:pointer}.note{margin-top:2.5vh;color:#557876;font-weight:800;font-size:clamp(17px,1.1vw,22px)}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Adventure</h1></div><div class="weeknav" id="weeknav"></div><div class="homewrap"><button class="pace" onclick="location.href='curriculum-pacing.html'">Curriculum Pace</button><button class="home" onclick="location.href='index.html'">⌂</button></div></header><div class="days" id="days"></div><section class="card"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><div class="note" id="note"></div><div class="path" id="path"></div><button class="start" id="start">Start Today’s Lessons →</button></section></main><script>(()=>{const names=['Monday','Tuesday','Wednesday','Thursday','Friday'],DAY_KEY='eea-daily-day',DATE_KEY='eea-daily-date',PACE_KEY='eea-curriculum-pace',CAL_KEY='eea-school-calendar',RESUME_KEY='eea-lesson-resume',AUTO_KEY='eea-lesson-auto-resume',params=new URLSearchParams(location.search);const baseSteps=[['Community Meeting','Start together'],['Read Aloud','Today’s book'],['Centers','Today’s center lesson']],endSteps=[['Storytelling','Story in our minds'],['Closing Circle','End the day']];const pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,todayKey=()=>dateKey(new Date());function safe(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')||fallback}catch(e){return fallback}}function handling(k,e,p){if(!e||e.type==='school')return'advance';return(p.overrides&&p.overrides[k])||(p.defaults&&p.defaults[e.type])||'advance'}function autoPosition(){const p=safe(PACE_KEY,null);if(!p||!p.startDate)return null;const start=new Date(p.startDate+'T12:00:00'),today=new Date(todayKey()+'T12:00:00');if(today<start)return{week:1,day:0,note:'Curriculum has not started yet.'};const cal=safe(CAL_KEY,{});let count=0,unresolved=false;for(let d=new Date(start);d<=today;d.setDate(d.getDate()+1)){const dow=d.getDay(),k=dateKey(d),e=cal[k];if(p.mode==='calendar'){if(dow===0||dow===6)continue;const h=handling(k,e,p);if(h==='ask'){unresolved=true;continue}if(h!=='pause')count++}else{if(dow===0||dow===6)continue;const h=handling(k,e,p);if(h==='ask'){unresolved=true;continue}if((!e||e.type==='school'||h==='advance')&&h!=='pause')count++}}if(unresolved)return{manual:true,note:'Curriculum pace needs a decision for an “Ask / Manual” date.'};count=Math.max(1,count);return{week:Math.min(8,Math.floor((count-1)/5)+1),day:(count-1)%5,note:p.mode==='calendar'?'Following Monday–Friday calendar pace.':'Following instructional-day pace.'}}function schoolDayForToday(){const n=new Date().getDay();if(n===0||n===6)return 4;return Math.max(0,Math.min(4,n-1))}function getResume(){const r=safe(RESUME_KEY,null);return r&&r.date===todayKey()?r:null}const requestedWeek=Number(params.get('week')),requestedDay=Number(params.get('day')),auto=autoPosition();let week,day,autoNote='';if(Number.isInteger(requestedWeek)&&requestedWeek>=1&&requestedWeek<=8)week=requestedWeek;else if(auto&&!auto.manual)week=auto.week;else{week=Number(localStorage.getItem('eea-daily-week'));if(!Number.isInteger(week)||week<1||week>8)week=1}if(Number.isInteger(requestedDay)&&requestedDay>=0&&requestedDay<5)day=requestedDay;else day=schoolDayForToday();if(auto)autoNote=auto.note||'';const $=id=>document.getElementById(id);function steps(){if(week===2)return[...baseSteps,['Literacy Small Groups','Clothing Memory'],...endSteps];if(week===3)return[...baseSteps,['Small Groups','Writing · Feelings · Fine Motor'],...endSteps];if(week>=4&&week<=8)return[['Community Meeting','Start together'],['Read Aloud','Today’s book'],['Centers','Today’s center lesson'],['Small Groups','Literacy & writing'],['Building Blocks','Math'],['Storytelling','Story in our minds'],['Closing Circle','End the day']];return[...baseSteps,...endSteps]}function openSection(section){location.assign(`lesson-runner-week${week}.html?week=${week}&day=${day}&section=${section}&v=${Date.now()}`)}function matchingResume(){const r=getResume();return r&&Number(r.week)===week&&Number(r.day)===day&&Number.isInteger(Number(r.section))?Math.max(0,Math.min(steps().length-1,Number(r.section))):null}function render(){localStorage.setItem('eea-daily-week',String(week));localStorage.setItem(DAY_KEY,String(day));localStorage.setItem(DATE_KEY,todayKey());$('weeknav').innerHTML=Array.from({length:8},(_,i)=>`<button class="${week===i+1?'active':''}" data-week="${i+1}">Week ${i+1}</button>`).join('');$('weeknav').querySelectorAll('button').forEach(b=>b.onclick=()=>{week=Number(b.dataset.week);autoNote='Manual teacher override.';history.replaceState(null,'',`daily-lessons.html?week=${week}&day=${day}&v=${Date.now()}`);render()});$('days').innerHTML=names.map((n,i)=>`<button class="${i===day?'active':''}" data-i="${i}">${n}</button>`).join('');[...$('days').children].forEach(b=>b.onclick=()=>{day=Number(b.dataset.i);autoNote='Manual teacher override.';history.replaceState(null,'',`daily-lessons.html?week=${week}&day=${day}&v=${Date.now()}`);render()});$('eyebrow').textContent=`UNIT 1 · WEEK ${week} · ${names[day].toUpperCase()}`;$('title').textContent=`${names[day]}’s Lessons`;const s=steps(),resume=matchingResume();$('path').className='path '+(s.length===7?'seven':s.length===6?'six':'five');$('path').innerHTML=s.map((x,i)=>`<div class="step jump" role="button" tabindex="0" data-section="${i}" aria-label="Open ${x[0]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('path').querySelectorAll('.step').forEach(el=>{const go=()=>openSection(Number(el.dataset.section));el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});$('note').textContent=resume!==null?`Ready to continue with ${s[resume][0]}.`:(autoNote?autoNote+' ':'')+'Press Start to begin at Community Meeting, or tap any lesson card to jump straight to that section.';$('start').textContent=resume!==null?'Continue Today’s Lessons →':'Start Today’s Lessons →';$('start').onclick=()=>openSection(resume!==null?resume:0)}render();const resume=matchingResume(),autoResume=localStorage.getItem(AUTO_KEY);if(resume!==null&&autoResume===todayKey()){localStorage.removeItem(AUTO_KEY);openSection(resume)}})();</script></body></html>
