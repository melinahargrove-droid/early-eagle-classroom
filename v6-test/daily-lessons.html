let dayIndex=Math.min(4,Math.max(0,new Date().getDay()-1)),state={current:0,done:[],raStep:0};const $=id=>document.getElementById(id),key=()=>`eea-daily-lessons-u1-w1-${dayIndex}`;function lessons(){const cm=communityByDay[dayIndex];return[{...baseLessons[0],subtitle:`${cm.title} · ${cm.source}`,sub:cm.sub,previewIcon:cm.icon,previewTitle:cm.title,previewCopy:cm.copy,materials:cm.materials,notes:cm.notes},...baseLessons.slice(1)]}function loadState(){try{const s=JSON.parse(localStorage.getItem(key()));state=s&&Array.isArray(s.done)?{current:s.current||0,done:s.done,raStep:Number.isInteger(s.raStep)?s.raStep:0}:{current:0,done:[],raStep:0}}catch(e){state={current:0,done:[],raStep:0}}const l=lessons(),n=l.findIndex((_,i)=>!state.done.includes(i));state.current=n===-1?l.length-1:n;if(state.current!==1)state.raStep=0}function save(){localStorage.setItem(key(),JSON.stringify(state))}function path(){const e=$('pathList'),l=lessons();e.innerHTML='';l.forEach((x,i)=>{const d=document.createElement('div');d.className='path-item'+(i===state.current?' current':'')+(state.done.includes(i)?' done':'');d.innerHTML=`<div class="picon">${x.icon}</div><div><div class="pname">${x.name}</div><div class="psub">${x.sub||x.subtitle||''}</div></div><span class="status"></span>`;d.onclick=()=>{state.current=i;if(i!==1)state.raStep=0;save();render()};e.appendChild(d)});$('progressMini').innerHTML=`${state.done.length} of ${l.length}<br>complete`}function mats(a){$('materialsList').innerHTML=(a||[]).map((m,i)=>`<div class="pill"><span class="miniicon">${i?'⌂':'○'}</span>${m}</div>`).join('')}function readAloud(){const c=lolaRead1[Math.max(0,Math.min(state.raStep,5))];$('centerStage').classList.add('read-aloud-mode');$('lessonTag').textContent='READ ALOUD · UNIT 1 · WEEK 1';$('lessonTitle').textContent='Read Aloud';$('lessonSubtitle').textContent='Lola Goes to School · Read 1 of 3';$('lessonQuestion').textContent='What’s the story about?';$('previewIcon').textContent=c.icon;$('previewTitle').textContent=c.title;$('previewCopy').textContent=c.copy;$('cardStep').textContent=`READ 1 · ${state.raStep+1} OF 6`;mats(c.materials);$('drawerNotes').textContent=c.notes;$('drawerVocab').textContent=c.vocab||'No vocabulary card on this step.';$('drawerExtras').textContent=c.extra||'';$('prevLesson').disabled=false;$('nextLesson').textContent=state.raStep===5?'Finish Read Aloud ✓':'Next →'}function lesson(){const l=lessons(),x=l[state.current];$('dayLabel').textContent=days[dayIndex];$('eyebrow').textContent=`${days[dayIndex].toUpperCase()} · UNIT 1 · WEEK 1`;if(state.current===1&&dayIndex===0){readAloud();return}$('centerStage').classList.remove('read-aloud-mode');$('lessonTag').textContent=`${x.name.toUpperCase()} · UNIT 1 · WEEK 1`;$('lessonTitle').textContent=x.name;$('lessonSubtitle').textContent=x.subtitle||'';$('lessonQuestion').textContent=x.question||'';$('previewIcon').textContent=x.previewIcon||'';$('previewTitle').textContent=x.previewTitle||x.name;$('previewCopy').textContent=x.previewCopy||'';$('cardStep').textContent=state.current===0?'TODAY’S COMMUNITY MEETING':'';mats(x.materials);$('drawerNotes').textContent=x.notes||'Use this area for lesson-specific notes.';$('drawerVocab').textContent=state.current===0?'No vocabulary card for this activity.':'Vocabulary will load with the real lesson.';$('drawerExtras').textContent=state.current===0&&dayIndex===1?'Use the curriculum Feelings Communications visuals if available.':'Additional links and printable supports will live here.';$('prevLesson').disabled=state.current===0;$('nextLesson').textContent=state.current===l.length-1?'Finish Day ✓':'Next →'}function render(){path();lesson()}function setDay(n){dayIndex=(dayIndex+n+5)%5;loadState();render()}function animate(fn){const p=$('preview');p.classList.add('switching');setTimeout(()=>{fn();p.classList.remove('switching')},130)}function next(){const l=lessons();if(state.current===1&&dayIndex===0&&state.raStep<5){animate(()=>{state.raStep++;save();render()});return}if(!state.done.includes(state.current))state.done.push(state.current);state.done.sort((a,b)=>a-b);if(state.current<l.length-1)state.current++;state.raStep=0;save();render()}function prev(){if(state.current===1&&dayIndex===0&&state.raStep>0){animate(()=>{state.raStep--;save();render()});return}if(state.current>0){state.current--;state.raStep=0;save();render()}}$('prevDay').onclick=()=>setDay(-1);$('nextDay').onclick=()=>setDay(1);$('nextLesson').onclick=next;$('prevLesson').onclick=prev;$('drawerBtn').onclick=()=>{const o=$('drawerPanel').classList.toggle('open');$('drawerBtn').textContent=o?'⌄   Close Teacher Drawer':'⌃   Teacher Drawer'};$('timerQuick').onclick=()=>location.href='timer.html';$('calmQuick').onclick=()=>location.href='calm-down.html';$('friendQuick').onclick=()=>location.href='choose-a-friend.html';loadState();render()})();</script></body></html>
