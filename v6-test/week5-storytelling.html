<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 5 Storytelling</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea);color:#174f7d}.page{height:100vh;padding:3vh 5vw}.top{height:9vh;font-weight:900;letter-spacing:.12em;color:#789697}.card{height:75vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:45% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.visual{height:56vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;font-size:26px;font-weight:900;color:#527673}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:54px;line-height:1;margin:1vh 0;color:#164f7f}.lead{font-size:23px;line-height:1.4;font-weight:900;color:#527673}.cue{margin-top:2vh;background:#e7f0ed;border-radius:18px;padding:1.4vh 1.2vw;font-size:18px;font-weight:900;color:#416d61}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.panel{display:none;position:fixed;right:4vw;top:10vh;width:42vw;max-height:78vh;overflow:auto;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:25px;padding:3vh 2vw;box-shadow:0 15px 35px #0002}.panel.open{display:block}.panel h2{color:#164f7f}.panel p{white-space:pre-line;font:17px/1.5 Georgia,serif;color:#3e5f5c}</style></head><body><main class="page"><div class="top">EARLY EAGLE ACADEMY · STORYTELLING · WEEK 5</div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="cue" id="cue"></div></div></section><div class="bottom"><button id="storyBtn">⌃ Teacher Story</button><button id="printBtn">🖨 Print Story</button><button onclick="location.href='week5-plan.html'">Done ✓</button></div><aside class="panel" id="panel"><h2 id="pt"></h2><p id="text"></p></aside></main><script>const d={Monday:{title:'The Sound in Apartment 3B',visual:'Visual placeholder: quiet apartment hallway at night with tiny sound marks near one door.',lead:'Imagine a building that is almost asleep when one small sound makes everyone wonder what is happening.',cue:'Visualize: dark windows, soft hallway light, a tap-tap sound, neighbors listening, and a calm ending.',text:`The yellow building on Maple Street was getting quiet for the night. In Apartment 1A, Mr. Lee washed one last cup. In 2C, Tasha tucked her stuffed rabbit under a blanket. In 4A, a baby gave one sleepy yawn.\n\nThen everyone heard it.\n\nTap. Tap-tap.\n\nTasha sat up. “What was that?”\n\nTap. Tap-tap.\n\nMr. Lee stopped drying his cup. The baby opened one eye. Down the hall, someone’s little dog lifted both ears.\n\nThe sound came from Apartment 3B.\n\nTasha imagined a tiny drummer. Mr. Lee wondered if a window was bumping in the wind. The dog seemed sure it was something very important.\n\nTasha and her grown-up stepped into the hallway. Other neighbors peeked out too. Nobody shouted. Everybody listened.\n\nTap. Tap-tap.\n\n“It’s coming from low down,” Tasha whispered.\n\nThey followed the sound to the door of 3B. Mrs. Ortiz opened it with a puzzled face. “A tapping sound? I hear it too.”\n\nEveryone became very still.\n\nTap. Tap-tap.\n\nThen a little orange ball rolled from beneath a chair. Behind it came Mrs. Ortiz’s kitten, Poppy. Poppy pounced on the ball. The ball bumped the wooden leg of the chair.\n\nTap. Tap-tap.\n\nEveryone smiled.\n\n“The mystery drummer!” Tasha said.\n\nMrs. Ortiz picked up the ball and placed it in Poppy’s basket for the night. The neighbors whispered goodnight and returned to their homes.\n\nSoon the yellow building grew quiet again. Tasha lay under her blanket and listened. She heard the hum of the heater, a faraway car, and one tiny kitten purr through the wall.\n\nSome sounds were loud. Some were soft. And some sounds told a whole little story if you listened long enough.`},Tuesday:{title:'The Box of Beautiful Things',visual:'Visual placeholder: a small box filled with corks, ribbons, smooth stones, lids, and buttons.',lead:'Picture a box of ordinary things that becomes much more interesting when two friends look closely.',cue:'Visualize: textures, shapes, colors, two different sorting ideas, and a creation that uses both.',text:`On the Art Studio shelf sat a box labeled BEAUTIFUL STUFF. Mia opened the lid. Inside were shiny bottle caps, soft pieces of ribbon, smooth stones, tiny cardboard tubes, corks, buttons, and wooden circles.\n\n“They don’t match,” Mia said.\n\nEli leaned closer. “Maybe they do. We just have to decide how.”\n\nMia picked out every round thing she could find. A lid. A button. A wooden circle. “These belong together because they are round.”\n\nEli made a different group. He put a silver lid beside a gray stone and a piece of shiny foil. “These belong together because they look silver.”\n\nMia frowned. “But the lid is in MY group.”\n\nEli frowned too. “And it is in MY group.”\n\nFor a moment they both held one side of the lid.\n\nThen Mia looked at it carefully. It really was round. It really was silver.\n\n“It can fit two ideas,” she said.\n\nEli let go of the lid. “Maybe we can make more than one kind of sort.”\n\nThey spread everything across the tray. First they made groups by shape. Then by color. Then by how things felt: smooth, bumpy, soft, rough. Every time, the same objects found new neighbors.\n\nWhen they were finished sorting, Eli lined up three corks. Mia placed the silver lid on top. They added ribbon around the bottom and two buttons on the front.\n\n“What is it?” Eli asked.\n\nMia tilted her head. “I see a tiny building.”\n\n“I see a robot,” Eli said.\n\nThey looked again.\n\n“It can be both,” Mia said.\n\nThey laughed. The Beautiful Stuff had taught them something: one object could fit more than one group, and one creation could hold more than one idea.`},Wednesday:{title:'The Windy Window',visual:'Visual placeholder: preschool child at a classroom window watching leaves bend and clouds move.',lead:'Imagine looking outside and noticing clues that tell you what the weather is doing.',cue:'Visualize: moving leaves, gray clouds, a fluttering flag, raindrops, and a weather notebook.',text:`Nico wanted to be the classroom weather watcher. He carried the little notebook to the window and pressed his nose close to the glass.\n\n“The weather is… windy,” he announced.\n\n“How do you know?” asked Ms. June.\n\nNico paused. He could not feel the wind through the closed window. He looked again.\n\nA tree branch bent and bounced. Leaves skittered across the sidewalk. The flag near the playground stretched straight out.\n\n“I can SEE the wind moving things,” Nico said.\n\nHe drew a tree with wiggly branches in the notebook.\n\nA few minutes later, Laila looked outside. “Now it’s raining.”\n\nNico looked. Tiny dots appeared on the glass. One drop slid slowly down and joined another. Outside, people pulled up hoods and hurried toward the door.\n\nNico added raindrops to the page.\n\nThen the room grew darker. A wide gray cloud covered the bright patch of sky.\n\n“Cloudy too,” Laila said.\n\nNico drew one big cloud.\n\nAt recess time, the rain stopped. The branches still moved, but more slowly. A tiny patch of blue appeared between the clouds.\n\n“The weather keeps changing,” Nico said.\n\nMs. June nodded. “Scientists keep observing because there is always something new to notice.”\n\nNico looked at his notebook. He had not touched the wind or held a cloud. He had used his eyes, listened to the rain, and watched what people and trees were doing.\n\nOn the last line he asked Ms. June to write his words: “Today the weather told us its story with clues.”`},Thursday:{title:'The Words We Didn’t Need',visual:'Visual placeholder: child and grandparent at a neighborhood market smiling and pointing at food.',lead:'Imagine spending time with someone when you do not know all the same words—but you still find many ways to understand one another.',cue:'Visualize: a busy market, pointing hands, warm smiles, shared food, gestures, and one new word.',text:`Sana loved visiting Grandpa Jo, but today his friend Mr. Kim was visiting too. Mr. Kim spoke some English, and Sana knew none of the Korean words he used with Grandpa Jo.\n\nAt first Sana stayed very quiet.\n\nThe three of them walked to the neighborhood market. Mr. Kim pointed to a basket of red apples and raised his eyebrows. Sana smiled and nodded. She understood: Do you like these?\n\nAt another stand he held up two dumplings and then pointed to Sana. Sana held up one finger. Mr. Kim smiled and handed her one.\n\nNo long sentence was needed.\n\nThey sat on a bench to eat. Sana took one bite and widened her eyes. “Mmm!”\n\nMr. Kim laughed. He pointed to the dumpling and said a word Sana did not know. Sana repeated it as carefully as she could. She said it wrong the first time. Mr. Kim gently said it again.\n\nSana tried again.\n\nThis time Mr. Kim clapped softly. Grandpa Jo gave Sana a high five.\n\nLater, a gust of wind blew Grandpa Jo’s napkin onto the sidewalk. Sana dashed after it and caught it with her shoe. Mr. Kim gave two thumbs up. Sana bowed dramatically and everyone laughed.\n\nOn the walk home, Sana realized they had communicated all afternoon. They had pointed, smiled, nodded, made faces, used fingers, shared food, laughed, and learned one another’s words.\n\nAt the door Mr. Kim waved goodbye and said the new word again. Sana repeated it.\n\nShe did not understand every word Mr. Kim said that day. But she understood that he was kind, funny, and happy to be with them.\n\nSometimes words helped. Sometimes hands and faces helped. Sometimes a shared laugh said plenty.`},Friday:{title:'You Tell a Community Story',visual:'Visual placeholder: apartment building, neighborhood market, weather symbols, and speech/sound bubbles.',lead:'Today the child storyteller chooses a place, people, and sounds for an original community story.',cue:'Prompts: Where are you? Who is there? What do you hear? What happens first? Is there a problem or surprise? How do people communicate or help? What happens at the end?',text:`Invite one child to tell an original story connected to a home, neighborhood, school, or other community place.\n\nSupport only as needed: Where does your story happen? Who is there? What can they see or hear? What happens first? What happens next? Does anything surprising happen? How do the characters communicate or help one another? What happens at the end?\n\nLet the child’s ideas lead. Record the story if that is part of your established routine, and invite classmates to act it out when appropriate.`}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday;eye.textContent=day.toUpperCase()+(day==='Friday'?' · CHILD STORYTELLER':' · TEACHER STORY');title.textContent=x.title;visual.textContent=x.visual;lead.textContent=x.lead;cue.textContent=x.cue;pt.textContent=x.title;text.textContent=x.text;if(day==='Friday'){storyBtn.textContent='⌃ Teacher Prompt';printBtn.textContent='🖨 Print Prompt'}storyBtn.onclick=()=>panel.classList.toggle('open');printBtn.onclick=()=>{const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>${x.title}</title><style>@page{size:letter;margin:.65in}body{font-family:Georgia,serif;color:#243d4d;max-width:7.2in;margin:auto}small{font-family:Arial,sans-serif;font-weight:bold;letter-spacing:.12em;color:#66858b}h1{font-size:30pt;color:#174f7d;margin:10px 0 6px}.day{font:700 12pt Arial,sans-serif;color:#66858b;margin-bottom:22px}.story{white-space:pre-line;font-size:14.5pt;line-height:1.48}footer{margin-top:24px;border-top:1px solid #ccd8d6;padding-top:10px;font:10pt Arial,sans-serif;color:#789}</style></head><body><small>EARLY EAGLE ACADEMY · UNIT 1 · WEEK 5 · STORYTELLING</small><h1>${x.title}</h1><div class="day">${day}</div><div class="story">${x.text}</div><footer>${day==='Friday'?'Child Storytelling Prompt':'Teacher Story · Tell naturally and allow children to make the pictures in their minds.'}</footer><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};</script></body></html>
