<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 4 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book.hidden{display:none}.book img{display:block;width:100%;height:100%;object-fit:contain}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-fallback{font-size:clamp(100px,10vw,180px)}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-example{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="pageImg" alt="Adapted book page"></div><div class="stopcard" id="stop"></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit Visual</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-example" id="vocabExample"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),runner=p.get('eeaRunner')==='1',$=id=>document.getElementById(id);const day=p.get('day')||'Monday';const d0={title:'My Friend and I',sub:'Read 1 of 3 · Introduce the book',before:'Today we will read a new book, My Friend and I. Lisa Jahn-Clough is both the author and illustrator. This story is about two friends. In our classroom, we have been making friends and learning that a friend is someone we care for and want to spend time with. Let’s read and find out what happens.',focus:'Read the story and make connections to friendship and problem solving.',note:'Vocabulary: fix · grab · pull · tight · watch',stops:[['PAGES 6–7','Point to the child with braids. Where is the child? What are they doing? They are looking at the moving truck and the new family moving next door. The child sees another child; it looks like they will be neighbors.'],['PAGES 8–9','Where is the child? What are they doing? The child is watching—looking closely and carefully.'],['PAGES 12–13','The two children do many things together. What do you like to do with your friends? Invite responses.'],['PAGES 14–15','The friend is holding the bunny tight, or squishing the bunny really hard. Gesture holding a toy tight.'],['PAGES 16–17','Gesture grab and pull and invite children to act out these words.'],['PAGES 26–27','The friends fixed the bunny—they put the broken bunny back together. How did they fix it?'],['AFTER READING · PAGES 18–19','The friends had a problem. They both wanted the new bunny and fought over it. Can you tell about a time you argued with a friend or family member? Invite 2–3 children. Close by noting that the friends had an argument and fixed the problem together; we will read the book again tomorrow.']]};const reads={Monday:d0,Tuesday:{title:'My Friend and I',sub:'Read 2 of 3 · Describe character feelings',focus:'Recognize how the characters’ feelings change and describe how their problem is solved.',note:'Use the Class Feelings Chart and the curriculum-approved “How can we solve our problem?” visual or your school/class problem-solving approach.',before:'Yesterday we read My Friend and I and learned that the two friends have an argument. Arguments happen. Today, think more deeply about the characters’ feelings. Use the Class Feelings Chart to name how their feelings change.',stops:[['PAGES 8–9','How is the child feeling while watching behind the bush? They may feel more than one feeling at once. Support words such as shy, unsure, excited; point to the chart and act them out if possible. How does the boy ask the other child to play?'],['PAGES 12–13','How are the friends feeling here? Why are they happy? Invite a child to point to happy on the Feelings Chart.'],['PAGES 18–19','How are the friends feeling here? Why? Support words such as mad, sad, disappointed, scared; use the chart and act them out if possible.'],['PAGES 20–21','How is this child feeling now? How do you know? Support sad and lonely; use the Feelings Chart.'],['PAGES 26–27','How did the friends solve their problem? Invite one response. How are they feeling now and why? Support happy, loved, excited.'],['AFTER READING','When friends play together, sometimes there are problems. That is okay. It is important to learn to solve problems together. Show “How can we solve our problem?” and talk through the steps using either the story problem or a real classroom problem. Close by noting that feelings changed and the class practiced a problem-solving strategy.']]}};const d=reads[day]||reads.Monday;$('title').textContent=d.title;$('sub').textContent=d.sub;$('chip').textContent='FOCUS ON 3s · WEEK 4 · '+day.toUpperCase()+'';$('notesTitle').textContent=d.title;$('focus').textContent=d.focus;$('note').textContent=d.note;let step=-1;function render(){const before=step<0,z=before?null:d.stops[step];$('pageImg').src='assets/reading.webp';$('stop').classList.add('show');$('stop').innerHTML='<b>'+(before?'BEFORE WE READ':z[0])+'</b>'+(before?d.before:z[1]);$('count').textContent=before?'Before Reading':'Teaching Stop '+(step+1)+' of '+d.stops.length;$('prev').disabled=before;$('next').textContent=step===d.stops.length-1?'Finish Read Aloud ✓':'Next →'}$('prev').onclick=()=>{if(step>=0){step--;render()}};$('next').onclick=()=>{if(step<d.stops.length-1){step++;render()}else if(!runner)location.href='daily-lessons.html?week=4&day='+(day==='Tuesday'?1:0)+''};$('back').onclick=()=>location.href='daily-lessons.html?week=4&day='+(day==='Tuesday'?1:0);$('notesBtn').onclick=()=>$('panel').classList.toggle('open');$('closeNotes').onclick=()=>$('panel').classList.remove('open');render()})();</script></body></html>
