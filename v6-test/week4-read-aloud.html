<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 4 Read Aloud</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{height:100vh;padding:1.5vh 3vw}.top{height:9vh;display:flex;justify-content:space-between}.meta{font-weight:900;letter-spacing:.12em;color:#789697}.top h1{margin:.35vh 0;font-size:34px;color:#164f7f}.chip{font-weight:900;background:#dcecf0;border-radius:999px;padding:9px 16px;height:max-content}.stage{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:66% 1fr;gap:2.5vw;align-items:center;padding:2.5vh 3vw}.book{height:68vh;border-radius:24px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.book img{max-width:100%;max-height:100%;object-fit:contain;display:block}.copy h2{font-size:30px;margin:0 0 1vh;color:#164f7f}.copy p{font-size:16px;line-height:1.35;font-weight:800;color:#527673}.stop{background:#fff0c9;border:2px solid #e4c56d;border-radius:18px;padding:1.3vh 1vw;margin-top:1vh;font-size:16px;font-weight:900;color:#71591f;line-height:1.35}.stop:empty{display:none}.stop b{display:block;color:#9a6c13;letter-spacing:.08em;margin-bottom:.4vh}.note{background:#e7f0ed;border-radius:18px;padding:1.1vh 1vw;margin-top:1vh;font-size:15px;font-weight:900;color:#416d61}.controls{display:flex;justify-content:center;align-items:center;gap:12px;height:10vh}.controls button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 18px;font-weight:900;cursor:pointer}.controls .done{background:#668f99;color:#fff;border-color:#668f99}.count{font-weight:900;color:#66858b;min-width:90px;text-align:center}</style></head><body><main class="page"><header class="top"><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div id="sub"></div></div><div class="chip" id="chip"></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"></div><div class="copy"><h2>Today’s Read</h2><p id="focus"></p><div class="stop" id="stop"></div><div class="note" id="note"></div></div></section><div class="controls"><button id="prev">← Previous</button><div class="count" id="count"></div><button id="next">Next →</button><button class="done" onclick="location.href='week4-plan.html'">Done ✓</button></div></main><script>const d={Monday:{title:'The Rabbit Listened',sub:'Read 3 of 3 · Acting out the story',prefix:'rabbit-',pages:19,focus:'Read the story aloud while children act out selected scenes or the whole story.',note:'Invite children into the stage as characters. Children may say “pass” or use the established pass gesture. Children may be any character.',stops:{}},Tuesday:{title:'Saturday',sub:'Read 1 of 4 · Making predictions',prefix:'saturday-',pages:19,focus:'Read the full text fluently, pausing at the curriculum-designated places.',note:'Today children make predictions by looking carefully at the illustrations.',stops:{3:'CHERISH • Cherish means to care about very deeply. You might cherish a friend or a stuffed animal. These characters cherish each Saturday because it is special for them.',7:'LOOK & PREDICT • Look at the illustration. Make a face like Ava. How does she feel? Make a face like Ava’s mother. How does she feel? Make a face like the librarian. How does the librarian feel? What do you predict will happen next? REASSURE • Reassure means to cheer up.',9:'RUINED • Ruined means wrecked.',11:'PREDICT • Look at the illustration. What’s going on in the park? What do you predict Ava and her mother will do next?',14:'PREDICT • Look at the illustration. How do Ava and her mom look going into the theater? What do you predict will happen next?',18:'ENDING PREDICTION • Look at the illustrations. What are Ava and her mother doing? How do you think they feel? How do you predict the story will end? Then finish reading and ask: Was your prediction correct?'}},Wednesday:{title:'Saturday',sub:'Read 2 of 4 · Reading the pictures and retelling events',prefix:'saturday-',pages:19,focus:'Read only the first half today, then retell what happened using the illustrations.',note:'Stop after the adapted spread containing pages 15–16. Then look back through the first half and ask what happened first, next, and after that.',stops:{4:'LOOK BACK • What do Ava and her mother usually do on Saturdays?',9:'READ WORDS + PICTURES • What happens after they go to the salon, where Ava and her mother get their hair done? How do Ava and her mother react?',10:'STOP READING HERE • Look back through the illustrations in the first half. What happened first, next, and after that?'}},Thursday:{title:'Saturday',sub:'Read 3 of 4 · Reading the pictures',prefix:'saturday-',pages:19,focus:'Read the second half of the story, beginning with the adapted spread containing pages 15–16.',note:'Use the words and illustrations together to describe what is happening.',start:10,stops:{13:'RELIEF • When you feel relief, you relax after something stressful or difficult happens. Sometimes a deep breath, like Snake Breath, helps you feel relief. How can you show relief on your face and body? Let’s try it!',14:'READ THE PICTURE • Look at this illustration and listen while I read the words. What’s happening?'}},Friday:{title:'Saturday',sub:'Read 4 of 4 · Acting out the story',prefix:'saturday-',pages:19,focus:'Read the story aloud while children act out selected scenes or the whole story.',note:'Invite children into the stage as characters. Children may pass. Take turns being Ava and her mother because they have many parts to act out.',stops:{}}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday,page=x.start||1;title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 4 · '+day.toUpperCase();focus.textContent=x.focus;note.textContent=x.note||'';function show(){pageImg.src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg';count.textContent=page+' of '+x.pages;prev.disabled=page===(x.start||1);next.disabled=page===x.pages;let s=x.stops[page]||'';stop.innerHTML=s?'<b>CURRICULUM STOP</b>'+s:''}prev.onclick=()=>{if(page>(x.start||1)){page--;show()}};next.onclick=()=>{if(page<x.pages){page++;show()}};show();</script></body></html>
