<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 4 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book.hidden{display:none}.book img{display:block;width:100%;height:100%;object-fit:contain}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7);box-shadow:inset 0 0 0 1px rgba(90,135,145,.15)}.vocab-slide.show{display:grid}.vocab-visual{width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center;font-size:clamp(100px,10vw,180px)}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-example{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="pageImg" alt="Adapted book page"></div><div class="stopcard" id="stop"></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual" id="vocabVisual"></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-example" id="vocabExample"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const d={Monday:{title:'The Rabbit Listened',sub:'Read 3 of 3 · Acting out the story',prefix:'rabbit-',pages:19,before:'Invite children into the stage as characters. Children may say “pass” or use the established pass gesture. Children may be any character.',focus:'Read the story aloud while children act out selected scenes or the whole story.',note:'Invite children into the stage as characters. Children may say “pass” or use the established pass gesture. Children may be any character.',stops:{}},Tuesday:{title:'Saturday',sub:'Read 1 of 4 · Making predictions',prefix:'saturday-',pages:19,before:'Today we will make predictions by looking carefully at the illustrations. A prediction is an idea about what might happen next.',focus:'Read the full text fluently, pausing at the curriculum-designated places.',note:'Today children make predictions by looking carefully at the illustrations.',stops:{7:'LOOK & PREDICT • Look at the illustration. Make a face like Ava. How does she feel? Make a face like Ava’s mother. How does she feel? Make a face like the librarian. How does the librarian feel? What do you predict will happen next?',11:'PREDICT • Look at the illustration. What’s going on in the park? What do you predict Ava and her mother will do next?',14:'PREDICT • Look at the illustration. How do Ava and her mom look going into the theater? What do you predict will happen next?',18:'ENDING PREDICTION • Look at the illustrations. What are Ava and her mother doing? How do you think they feel? How do you predict the story will end? Then finish reading and ask: Was your prediction correct?'}},Wednesday:{title:'Saturday',sub:'Read 2 of 4 · Reading the pictures and retelling events',prefix:'saturday-',pages:19,end:10,before:'Today we will read only the first half of Saturday. Then we will look back at the illustrations and tell what happened first, next, and after that.',focus:'Read only the first half today, then retell what happened using the illustrations.',note:'Stop after the adapted spread containing pages 15–16. Then look back through the first half and ask what happened first, next, and after that.',stops:{4:'LOOK BACK • What do Ava and her mother usually do on Saturdays?',9:'READ WORDS + PICTURES • What happens after they go to the salon, where Ava and her mother get their hair done? How do Ava and her mother react?',10:'STOP READING HERE • Look back through the illustrations in the first half. What happened first, next, and after that?'}},Thursday:{title:'Saturday',sub:'Read 3 of 4 · Reading the pictures',prefix:'saturday-',pages:19,start:10,before:'Today we will read the second half of Saturday. We will use the words and illustrations together to describe what is happening.',focus:'Read the second half of the story, beginning with the adapted spread containing pages 15–16.',note:'Use the words and illustrations together to describe what is happening.',stops:{13:'RELIEF • When you feel relief, you relax after something stressful or difficult happens. Sometimes a deep breath, like Snake Breath, helps you feel relief. How can you show relief on your face and body? Let’s try it!',14:'READ THE PICTURE • Look at this illustration and listen while I read the words. What’s happening?'}},Friday:{title:'Saturday',sub:'Read 4 of 4 · Acting out the story',prefix:'saturday-',pages:19,before:'The edge of the rug is our audience and the middle is our stage. Children may act or pass. Take turns being Ava and her mother because they have many parts to act out.',focus:'Read the story aloud while children act out selected scenes or the whole story.',note:'Invite children into the stage as characters. Children may pass. Take turns being Ava and her mother because they have many parts to act out.',stops:{}}};const vocab={cherish:{after:3,kicker:'QUICK WORD',word:'Cherish',definition:'Cherish means to care about very deeply.',example:'You might cherish a friend or a stuffed animal. Ava and her mother cherish Saturdays because their time together is special.',visual:'💗'},reassure:{after:7,kicker:'QUICK WORD',word:'Reassure',definition:'Reassure means to help someone feel less worried or upset.',example:'You can reassure someone by using calm words and letting them know things will be okay.',visual:'🤝'},ruined:{after:9,kicker:'QUICK WORD',word:'Ruined',definition:'Ruined means wrecked or spoiled so something does not go the way you hoped.',example:'Ava worries that part of their Saturday has been ruined when their plans go wrong.',visual:'💥'}};const p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',x=d[day],from=p.get('from')||'';let page=x.start||1,beforeOpen=true,pauseShown=false,vocabMode='';const end=x.end||x.pages,$=id=>document.getElementById(id);$('title').textContent=x.title;$('sub').textContent=x.sub;$('chip').textContent='WEEK 4 · '+day.toUpperCase();$('notesTitle').textContent=x.title;$('focus').textContent=x.focus;$('note').textContent=x.note||'';function overview(){const i=days.indexOf(day);location.href='daily-lessons.html?week=4&day='+i}function finish(){const i=days.indexOf(day);if(from==='daily'||from==='runner')location.href='lesson-runner-week4.html?week=4&day='+i+'&section=2&v='+Date.now();else overview()}function showCard(label,copy){$('stop').innerHTML='<b>'+label+'</b>'+copy;$('stop').classList.add('show')}function hideCard(){$('stop').classList.remove('show')}function totalSlides(){return (end-(x.start||1)+1)+(day==='Tuesday'?3:0)}function displayIndex(){const start=x.start||1;if(day!=='Tuesday')return page-start+1;const ordered=Object.values(vocab).sort((a,b)=>a.after-b.after);if(vocabMode){const v=vocab[vocabMode];return v.after+ordered.filter(x=>x.after<=v.after).length}return page+ordered.filter(v=>v.after<page).length}function previousVocabForPage(){if(day!=='Tuesday')return'';const hit=Object.entries(vocab).find(([,v])=>v.after===page-1);return hit?hit[0]:''}function setProgress(){$('count').textContent=vocabMode?'Vocabulary · '+vocab[vocabMode].word:'Slide '+page+' of '+end;$('fill').style.width=(displayIndex()/totalSlides()*100)+'%'}function updateButton(){if(vocabMode){$('next').textContent='Continue →';return}if(beforeOpen){$('next').textContent='Start Reading →';return}if(pauseShown){$('next').textContent=page===end?'Finish Read Aloud ✓':'Continue →';return}$('next').textContent=page===end?'Finish Read Aloud ✓':'Next →'}function showBook(){vocabMode='';$('book').classList.remove('hidden');$('vocabSlide').classList.remove('show');$('pageImg').src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg?v=4';$('prev').disabled=page===(x.start||1);pauseShown=false;if(beforeOpen)showCard('BEFORE WE READ',x.before);else hideCard();setProgress();updateButton()}function showVocab(kind){const v=vocab[kind];vocabMode=kind;pauseShown=false;hideCard();$('book').classList.add('hidden');$('vocabSlide').classList.add('show');$('vocabVisual').textContent=v.visual;$('vocabKicker').textContent=v.kicker;$('vocabWord').textContent=v.word;$('vocabDefinition').textContent=v.definition;$('vocabExample').textContent=v.example;$('prev').disabled=false;setProgress();updateButton()}$('prev').onclick=()=>{if(vocabMode){page=vocab[vocabMode].after;showBook();return}if(beforeOpen){beforeOpen=false;hideCard();updateButton();return}const priorVocab=previousVocabForPage();if(priorVocab){showVocab(priorVocab);return}if(page>(x.start||1)){page--;showBook()}};$('next').onclick=()=>{if(vocabMode){page=vocab[vocabMode].after+1;showBook();return}if(beforeOpen){beforeOpen=false;hideCard();updateButton();return}const s=x.stops[page]||'';if(s&&!pauseShown){pauseShown=true;showCard('CURRICULUM TEACHING STOP — PAUSE HERE',s);updateButton();return}if(pauseShown){pauseShown=false;hideCard()}const nextVocab=day==='Tuesday'?Object.entries(vocab).find(([,v])=>v.after===page):null;if(nextVocab){showVocab(nextVocab[0]);return}if(page<end){page++;showBook()}else finish()};$('backBtn').onclick=overview;$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');showBook()})();</script></body></html>
