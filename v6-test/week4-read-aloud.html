<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 4 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book.hidden{display:none}.book img{display:block;width:100%;height:100%;object-fit:contain}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-fallback{font-size:clamp(100px,10vw,180px)}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-example{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="pageImg" alt="Adapted book page"></div><div class="stopcard" id="stop"></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit Visual</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-example" id="vocabExample"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const d={Monday:{title:'The Rabbit Listened',sub:'Read 3 of 3 · Acting out the story',prefix:'rabbit-',pages:19,before:'Invite children into the stage as characters. Children may say “pass” or use the established pass gesture. Children may be any character.',focus:'Read the story aloud while children act out selected scenes or the whole story.',note:'Invite children into the stage as characters. Children may say “pass” or use the established pass gesture.',stops:{}},Tuesday:{title:'Saturday',sub:'Read 1 of 4 · Making predictions',prefix:'saturday-',pages:19,before:'Today we will make predictions by looking carefully at the illustrations. A prediction is an idea about what might happen next.',focus:'Read the full text fluently, pausing at the curriculum-designated places.',note:'Today children make predictions by looking carefully at the illustrations.',stops:{7:'LOOK & PREDICT • Look at the illustration. Make a face like Ava. How does she feel? Make a face like Ava’s mother. How does she feel? Make a face like the librarian. How does the librarian feel? What do you predict will happen next?',11:'PREDICT • Look at the illustration. What’s going on in the park? What do you predict Ava and her mother will do next?',14:'PREDICT • Look at the illustration. How do Ava and her mom look going into the theater? What do you predict will happen next?',18:'ENDING PREDICTION • Look at the illustrations. What are Ava and her mother doing? How do you think they feel? How do you predict the story will end? Then finish reading and ask: Was your prediction correct?'},vocabs:[{after:3,kicker:'QUICK WORD',word:'Cherish',definition:'Cherish means to care about very deeply.',example:'You might cherish a friend or a stuffed animal. Ava and her mother cherish Saturdays because their time together is special.',icon:'💗',slot:'week4-saturday-cherish'},{after:7,kicker:'QUICK WORD',word:'Reassure',definition:'Reassure means to help someone feel less worried or upset.',example:'You can reassure someone by using calm words and letting them know things will be okay.',icon:'🤝',slot:'week4-saturday-reassure'},{after:9,kicker:'QUICK WORD',word:'Ruined',definition:'Ruined means wrecked or spoiled so something does not go the way you hoped.',example:'Ava worries that part of their Saturday has been ruined when their plans go wrong.',icon:'💥',slot:'week4-saturday-ruined'}]},Wednesday:{title:'Saturday',sub:'Read 2 of 4 · Reading the pictures and retelling events',prefix:'saturday-',pages:19,end:10,before:'Today we will read only the first half of Saturday. Then we will look back at the illustrations and tell what happened first, next, and after that.',focus:'Read only the first half today, then retell what happened using the illustrations.',note:'Stop after the adapted spread containing pages 15–16.',stops:{4:'LOOK BACK • What do Ava and her mother usually do on Saturdays?',9:'READ WORDS + PICTURES • What happens after they go to the salon, where Ava and her mother get their hair done? How do Ava and her mother react?',10:'STOP READING HERE • Look back through the illustrations in the first half. What happened first, next, and after that?'}},Thursday:{title:'Saturday',sub:'Read 3 of 4 · Reading the pictures',prefix:'saturday-',pages:19,start:10,before:'Today we will read the second half of Saturday. We will use the words and illustrations together to describe what is happening.',focus:'Read the second half of the story, beginning with the adapted spread containing pages 15–16.',note:'Use the words and illustrations together to describe what is happening.',stops:{14:'READ THE PICTURE • Look at this illustration and listen while I read the words. What’s happening?'},vocabs:[{after:13,kicker:'QUICK WORD',word:'Relief',definition:'When you feel relief, you relax after something stressful or difficult happens.',example:'Sometimes a deep breath, like Snake Breath, helps you feel relief. Show relief on your face and body.',icon:'😌',slot:'week4-saturday-relief'}]},Friday:{title:'Saturday',sub:'Read 4 of 4 · Acting out the story',prefix:'saturday-',pages:19,before:'The edge of the rug is our audience and the middle is our stage. Children may act or pass. Take turns being Ava and her mother because they have many parts to act out.',focus:'Read the story aloud while children act out selected scenes or the whole story.',note:'Invite children into the stage as characters. Children may pass.',stops:{}}};const p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',x=d[day],from=p.get('from')||'',start=x.start||1,end=x.end||x.pages;let sequence=[];for(let i=start;i<=end;i++){sequence.push({type:'book',page:i});(x.vocabs||[]).filter(v=>v.after===i).forEach(v=>sequence.push({type:'vocab',...v}))}let step=0,beforeOpen=true,pauseShown=false,token=0;const $=id=>document.getElementById(id);$('title').textContent=x.title;$('sub').textContent=x.sub;$('chip').textContent='WEEK 4 · '+day.toUpperCase();$('notesTitle').textContent=x.title;$('focus').textContent=x.focus;$('note').textContent=x.note||'';function overview(){location.href='daily-lessons.html?week=4&day='+days.indexOf(day)}function finish(){if(from==='daily'||from==='runner')location.href='lesson-runner-week4.html?week=4&day='+days.indexOf(day)+'&section=2&v='+Date.now();else overview()}function item(){return sequence[step]}function state(){const z=item();return{step,atStart:beforeOpen&&step===0,atEnd:!beforeOpen&&step===sequence.length-1&&z.type==='book'&&(!x.stops[z.page]||pauseShown)}}window.EEASectionState=state;function notify(){try{window.dispatchEvent(new CustomEvent('eea-section-state',{detail:state()}))}catch(e){}}function showCard(label,copy){$('stop').innerHTML='<b>'+label+'</b>'+copy;$('stop').classList.add('show')}function hideCard(){$('stop').classList.remove('show')}async function renderVocab(v){const t=++token,src=window.EEAVisualStore?await EEAVisualStore.get(v.slot):null;if(t!==token)return;$('vocabCustom').hidden=!src;$('vocabFallback').style.display=src?'none':'block';$('vocabFallback').textContent=v.icon||'🖼️';if(src)$('vocabCustom').src=src;$('vocabKicker').textContent=v.kicker||'QUICK WORD';$('vocabWord').textContent=v.word;$('vocabDefinition').textContent=v.definition;$('vocabExample').textContent=v.example||'';$('vocabEdit').onclick=()=>location.href='visual-editor.html?slot='+encodeURIComponent(v.slot)+'&return='+encodeURIComponent('week4-read-aloud.html?day='+day+(from?'&from='+from:''))}function render(){const z=item(),isV=z.type==='vocab';$('book').classList.toggle('hidden',isV);$('vocabSlide').classList.toggle('show',isV);hideCard();pauseShown=false;if(isV){beforeOpen=false;renderVocab(z)}else{token++;$('pageImg').src='assets/'+x.prefix+String(z.page).padStart(2,'0')+'.jpg?v=5';if(beforeOpen&&step===0)showCard('BEFORE WE READ',x.before)}$('count').textContent=isV?'Vocabulary · '+z.word:'Slide '+(z.page-start+1)+' of '+(end-start+1);$('fill').style.width=((step+1)/sequence.length*100)+'%';$('prev').disabled=false;$('next').textContent=beforeOpen?'Start Reading →':step===sequence.length-1?'Finish Read Aloud ✓':'Next →';notify()}$('prev').onclick=()=>{if(pauseShown){pauseShown=false;hideCard();notify();return}if(beforeOpen)return;if(step>0){step--;render();return}beforeOpen=true;render()};$('next').onclick=()=>{const z=item();if(beforeOpen){beforeOpen=false;hideCard();notify();return}if(z.type==='book'&&x.stops[z.page]&&!pauseShown){pauseShown=true;showCard('CURRICULUM TEACHING STOP — PAUSE HERE',x.stops[z.page]);$('next').textContent='Continue →';notify();return}if(pauseShown){pauseShown=false;hideCard()}if(step<sequence.length-1){step++;render()}else finish()};$('backBtn').onclick=overview;$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');render()})();</script></body></html>
