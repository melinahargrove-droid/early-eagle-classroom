"><button id="prev">← Previous</button><div class="count" id="count"></div><button id="next">Next →</button><button class="done" onclick="location.href='week4-plan.html'">Done ✓</button></div></main><script>const d={Monday:{title:'The Rabbit Listened',sub:'Read 3',prefix:'rabbit-',pages:19,focus:'Return to the story and focus on Taylor’s feelings, the animals’ attempts to help, and the way Rabbit listens.',stop:'Pause for the curriculum discussion points while moving through the familiar adapted pages.'},Tuesday:{title:'Saturday',sub:'Read 1 of 4 · Making predictions',prefix:'saturday-',pages:19,focus:'Make predictions about what happens next by looking carefully at the illustrations and discussing them.',stop:'Connect to days off. Notice feelings in the illustrations and introduce words such as cherish and reassure.'},Wednesday:{title:'Saturday',sub:'Read 2 of 4',prefix:'saturday-',pages:19,focus:'Reread and recall important events and details, using the illustrations to describe what happens.',stop:'Notice how Ava and her mother respond as their plans change.'},Thursday:{title:'Saturday',sub:'Read 3 of 4 · Reading the pictures',prefix:'saturday-',pages:19,focus:'Read the second half and use words and illustrations together to describe events.',stop:'Notice relief. Show relief with face and body and connect it to taking a calming breath.'},Friday:{title:'Saturday',sub:'Read 4 of 4',prefix:'saturday-',pages:19,focus:'Return to the story to deepen understanding, connections, and discussion about the characters and their special day.',stop:'Think about what made the day special even when plans changed.'}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday,page=1;title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 4 · '+day.toUpperCase();focus.textContent=x.focus;stop.textContent=x.stop;function show(){pageImg.src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg';count.textContent=page+' of '+x.pages;prev.disabled=page===1;next.disabled=page===x.pages}prev.onclick=()=>{if(page>1){page--;show()}};next.onclick=()=>{if(page<x.pages){page++;show()}};show();</script></body></html>
