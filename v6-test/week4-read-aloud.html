<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 4 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef}.book img{display:block;width:100%;height:100%;object-fit:contain}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);z-index:5;background:rgba(255,253,248,.96);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.nav:disabled{opacity:.3}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book"><img id="pageImg" alt="Adapted book page"></div><div class="stopcard" id="stop"></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script>const d={Monday:{title:'The Rabbit Listened',sub:'Read 3 of 3 · Acting out the story',prefix:'rabbit-',pages:19,focus:'Read the story aloud while children act out selected scenes or the whole story.',note:'Invite children into the stage as characters. Children may say “pass” or use the established pass gesture. Children may be any character.',stops:{}},Tuesday:{title:'Saturday',sub:'Read 1 of 4 · Making predictions',prefix:'saturday-',pages:19,focus:'Read the full text fluently, pausing at the curriculum-designated places.',note:'Today children make predictions by looking carefully at the illustrations.',stops:{3:'CHERISH • Cherish means to care about very deeply. You might cherish a friend or a stuffed animal. These characters cherish each Saturday because it is special for them.',7:'LOOK & PREDICT • Look at the illustration. Make a face like Ava. How does she feel? Make a face like Ava’s mother. How does she feel? Make a face like the librarian. How does the librarian feel? What do you predict will happen next? REASSURE • Reassure means to cheer up.',9:'RUINED • Ruined means wrecked.',11:'PREDICT • Look at the illustration. What’s going on in the park? What do you predict Ava and her mother will do next?',14:'PREDICT • Look at the illustration. How do Ava and her mom look going into the theater? What do you predict will happen next?',18:'ENDING PREDICTION • Look at the illustrations. What are Ava and her mother doing? How do you think they feel? How do you predict the story will end? Then finish reading and ask: Was your prediction correct?'}},Wednesday:{title:'Saturday',sub:'Read 2 of 4 · Reading the pictures and retelling events',prefix:'saturday-',pages:19,focus:'Read only the first half today, then retell what happened using the illustrations.',note:'Stop after the adapted spread containing pages 15–16. Then look back through the first half and ask what happened first, next, and after that.',stops:{4:'LOOK BACK • What do Ava and her mother usually do on Saturdays?',9:'READ WORDS + PICTURES • What happens after they go to the salon, where Ava and her mother get their hair done? How do Ava and her mother react?',10:'STOP READING HERE • Look back through the illustrations in the first half. What happened first, next, and after that?'}},Thursday:{title:'Saturday',sub:'Read 3 of 4 · Reading the pictures',prefix:'saturday-',pages:19,focus:'Read the second half of the story, beginning with the adapted spread containing pages 15–16.',note:'Use the words and illustrations together to describe what is happening.',start:10,stops:{13:'RELIEF • When you feel relief, you relax after something stressful or difficult happens. Sometimes a deep breath, like Snake Breath, helps you feel relief. How can you show relief on your face and body? Let’s try it!',14:'READ THE PICTURE • Look at this illustration and listen while I read the words. What’s happening?'}},Friday:{title:'Saturday',sub:'Read 4 of 4 · Acting out the story',prefix:'saturday-',pages:19,focus:'Read the story aloud while children act out selected scenes or the whole story.',note:'Invite children into the stage as characters. Children may pass. Take turns being Ava and her mother because they have many parts to act out.',stops:{}}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday,page=x.start||1;title.textContent=x.title;sub.textContent=x.sub;chip.textContent='WEEK 4 · '+day.toUpperCase();notesTitle.textContent=x.title;focus.textContent=x.focus;note.textContent=x.note||'';function show(){const start=x.start||1,total=x.pages-start+1,pos=page-start+1;pageImg.src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg?v=2';count.textContent='Slide '+pos+' of '+total;fill.style.width=(pos/total*100)+'%';prev.disabled=page===start;next.textContent=page===x.pages?'Finish Read Aloud ✓':'Next →';const s=x.stops[page]||'';stop.innerHTML=s?'<b>CURRICULUM TEACHING STOP — PAUSE HERE</b>'+s:'';stop.classList.toggle('show',!!s)}prev.onclick=()=>{if(page>(x.start||1)){page--;show()}};next.onclick=()=>{if(page<x.pages){page++;show()}else location.href='week4-plan.html'};backBtn.onclick=()=>location.href='week4-plan.html';notesBtn.onclick=()=>notesPanel.classList.toggle('open');closeNotes.onclick=()=>notesPanel.classList.remove('open');show();</script></body></html>
