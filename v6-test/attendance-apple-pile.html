<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Orchard Attendance</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dbe6e6}iframe{display:block;width:100vw;height:100vh;border:0}</style></head><body><iframe id="board" src="attendance-approved.html" title="Apple Orchard Attendance"></iframe><script>
const frame=document.getElementById('board');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow;
  if(!w||w.localStorage.getItem('eea-attendance-theme')!=='apple-orchard')return;
  w.appleBasketSlots=function(b){
    const pile=[
      {x:50,y:84,r:-4},{x:39,y:82,r:3},{x:61,y:82,r:-2},{x:29,y:80,r:4},{x:71,y:79,r:-3},{x:18,y:77,r:2},{x:82,y:77,r:-4},
      {x:45,y:72,r:2},{x:56,y:71,r:-3},{x:34,y:70,r:4},{x:67,y:69,r:-2},{x:23,y:67,r:3},{x:77,y:67,r:-4},
      {x:50,y:61,r:3},{x:39,y:60,r:-3},{x:61,y:59,r:4},{x:29,y:57,r:-2},{x:71,y:56,r:3},{x:18,y:54,r:-4},{x:82,y:54,r:2},
      {x:45,y:49,r:-3},{x:56,y:48,r:4},{x:34,y:46,r:-2},{x:67,y:45,r:3},{x:24,y:43,r:-4},{x:76,y:42,r:2},
      {x:50,y:36,r:4},{x:40,y:34,r:-3},{x:60,y:33,r:2},{x:50,y:25,r:-2}
    ];
    return pile.slice(0,Number(b));
  };
  if(typeof w.render==='function')w.render();
});
</script></body></html>
