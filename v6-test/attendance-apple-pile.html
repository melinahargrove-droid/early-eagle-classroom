<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Orchard Attendance</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dbe6e6}iframe{display:block;width:100vw;height:100vh;border:0}.tune{position:fixed;left:12px;bottom:12px;z-index:99999;width:300px;padding:12px;border:2px solid #789fc0;border-radius:16px;background:rgba(255,250,240,.97);font:700 12px/1.2 "Trebuchet MS",Arial;color:#173f72;box-shadow:0 6px 20px #0003}.tune h3{margin:0 0 8px;font-size:16px}.row{display:grid;grid-template-columns:92px 1fr 42px;gap:7px;align-items:center;margin:5px 0}.row input{width:100%}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.buttons button{border:1px solid #789fc0;border-radius:9px;background:white;color:#173f72;padding:6px 8px;font-weight:900;cursor:pointer}.buttons button.active{background:#173f72;color:white}.hint{font-size:10px;margin-top:7px;color:#667}.draw-note{margin-top:8px;padding:7px;border-radius:9px;background:#edf5f5;display:none}.draw-note.on{display:block}</style></head><body><iframe id="board" src="attendance-approved.html" title="Apple Orchard Attendance"></iframe><aside class="tune" id="tune"><h3>🍎 Apple Basket Tuning</h3><div id="rows"></div><div class="buttons"><button id="demo">Show 20</button><button id="draw">✏ Draw Mask</button><button id="undo">Undo Point</button><button id="clear">Clear Mask</button><button id="save">Save</button><button id="reset">Reset</button><button id="hide">Hide Panel</button></div><div class="draw-note" id="drawNote">Click points from LEFT to RIGHT along the basket's curved front rim. A blue line will connect them. Click Draw Mask again when finished.</div><div class="hint">The blue dots/line are editing guides only. Save keeps your pile and mask on this device.</div></aside><script>
const DEFAULTS={x:0,y:0,size:100,spreadX:100,spreadY:100,maskPoints:[]};let cfg={...DEFAULTS};try{cfg={...cfg,...JSON.parse(localStorage.getItem('eea-apple-basket-tuning')||'{}')}}catch(e){};if(!Array.isArray(cfg.maskPoints))cfg.maskPoints=[];
const controls=[['x','Pile Left/Right',-120,120,1],['y','Pile Up/Down',-180,180,1],['size','Apple Size',55,145,1],['spreadX','Horizontal Spread',55,145,1],['spreadY','Vertical Spread',55,145,1]];const rows=document.getElementById('rows');controls.forEach(([key,label,min,max,step])=>{const r=document.createElement('label');r.className='row';r.innerHTML=`<span>${label}</span><input data-key="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${cfg[key]}"><b id="v-${key}">${cfg[key]}</b>`;rows.appendChild(r)});
let w=null,demo=false,drawing=false,svg=null;function basePile(){return [{x:50,y:84,r:-4},{x:39,y:82,r:3},{x:61,y:82,r:-2},{x:29,y:80,r:4},{x:71,y:79,r:-3},{x:18,y:77,r:2},{x:82,y:77,r:-4},{x:45,y:72,r:2},{x:56,y:71,r:-3},{x:34,y:70,r:4},{x:67,y:69,r:-2},{x:23,y:67,r:3},{x:77,y:67,r:-4},{x:50,y:61,r:3},{x:39,y:60,r:-3},{x:61,y:59,r:4},{x:29,y:57,r:-2},{x:71,y:56,r:3},{x:18,y:54,r:-4},{x:82,y:54,r:2},{x:45,y:49,r:-3},{x:56,y:48,r:4},{x:34,y:46,r:-2},{x:67,y:45,r:3},{x:24,y:43,r:-4},{x:76,y:42,r:2},{x:50,y:36,r:4},{x:40,y:34,r:-3},{x:60,y:33,r:2},{x:50,y:25,r:-2}]}
function maskPolygon(){if(cfg.maskPoints.length<2)return 'polygon(56.5% 58%,94.5% 58%,92% 87%,60% 87%)';const pts=cfg.maskPoints.map(p=>`${p.x}% ${p.y}%`);pts.push('100% 100%','0% 100%');return `polygon(${pts.join(',')})`}
function apply(){if(!w)return;w.appleBasketSlots=function(b){return basePile().slice(0,Number(b)).map(p=>({x:50+(p.x-50)*cfg.spreadX/100,y:88+(p.y-88)*cfg.spreadY/100,r:p.r}))};const style=w.document.getElementById('appleTuneStyle')||w.document.head.appendChild(Object.assign(w.document.createElement('style'),{id:'appleTuneStyle'}));style.textContent=`.apple .here-zone{transform:translate(${20+cfg.x}px,${-50+cfg.y}px) scale(${1.38*cfg.size/100})!important}.apple .basket-front-mask{clip-path:${maskPolygon()}!important}`;if(typeof w.render==='function')w.render();if(demo)showDemo();drawGuides()}
function showDemo(){if(!w)return;const layer=w.document.getElementById('hereLayer');if(!layer)return;layer.querySelectorAll('.demo-apple').forEach(e=>e.remove());w.appleBasketSlots(20).forEach((p,i)=>{const b=w.document.createElement('div');b.className='piece here demo-apple';b.style.left=p.x+'%';b.style.top=p.y+'%';b.style.width='112px';b.style.height='112px';b.style.transform=`translate(-50%,-50%) rotate(${p.r}deg) scale(.86)`;b.innerHTML='<span class="photo"><span class="initial">'+(i+1)+'</span></span><span class="name"></span>';layer.appendChild(b)})}
function ensureSvg(){if(!w)return null;if(svg&&svg.isConnected)return svg;svg=w.document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 1000 1000');Object.assign(svg.style,{position:'absolute',inset:'0',width:'100%',height:'100%',zIndex:'5000',pointerEvents:drawing?'auto':'none'});svg.id='maskDrawGuide';w.document.getElementById('stage').appendChild(svg);svg.addEventListener('click',e=>{if(!drawing)return;const r=svg.getBoundingClientRect();cfg.maskPoints.push({x:+(((e.clientX-r.left)/r.width)*100).toFixed(2),y:+(((e.clientY-r.top)/r.height)*100).toFixed(2)});apply()});return svg}
function drawGuides(){const s=ensureSvg();if(!s)return;s.style.pointerEvents=drawing?'auto':'none';s.innerHTML='';if(!cfg.maskPoints.length)return;const ns='http://www.w3.org/2000/svg',line=w.document.createElementNS(ns,'polyline');line.setAttribute('points',cfg.maskPoints.map(p=>`${p.x*10},${p.y*10}`).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#1677ff');line.setAttribute('stroke-width','5');line.setAttribute('stroke-linecap','round');line.setAttribute('stroke-linejoin','round');s.appendChild(line);cfg.maskPoints.forEach((p,i)=>{const c=w.document.createElementNS(ns,'circle');c.setAttribute('cx',p.x*10);c.setAttribute('cy',p.y*10);c.setAttribute('r','9');c.setAttribute('fill','#fff');c.setAttribute('stroke','#1677ff');c.setAttribute('stroke-width','5');s.appendChild(c)})}
function setDrawing(v){drawing=v;document.getElementById('draw').classList.toggle('active',v);document.getElementById('draw').textContent=v?'✓ Finish Mask':'✏ Draw Mask';document.getElementById('drawNote').classList.toggle('on',v);drawGuides()}
document.getElementById('board').addEventListener('load',()=>{w=document.getElementById('board').contentWindow;if(!w||w.localStorage.getItem('eea-attendance-theme')!=='apple-orchard')return;apply()});rows.addEventListener('input',e=>{const k=e.target.dataset.key;if(!k)return;cfg[k]=Number(e.target.value);document.getElementById('v-'+k).textContent=cfg[k];apply()});document.getElementById('demo').onclick=()=>{demo=!demo;document.getElementById('demo').textContent=demo?'Hide 20':'Show 20';apply()};document.getElementById('draw').onclick=()=>setDrawing(!drawing);document.getElementById('undo').onclick=()=>{cfg.maskPoints.pop();apply()};document.getElementById('clear').onclick=()=>{cfg.maskPoints=[];apply()};document.getElementById('reset').onclick=()=>{cfg={...DEFAULTS,maskPoints:[]};controls.forEach(([k])=>{const i=document.querySelector(`[data-key="${k}"]`);i.value=cfg[k];document.getElementById('v-'+k).textContent=cfg[k]});apply()};document.getElementById('save').onclick=()=>{localStorage.setItem('eea-apple-basket-tuning',JSON.stringify(cfg));setDrawing(false);document.getElementById('save').textContent='✓ Saved';setTimeout(()=>document.getElementById('save').textContent='Save',1000)};document.getElementById('hide').onclick=()=>{setDrawing(false);document.getElementById('tune').style.display='none'};
</script></body></html>
