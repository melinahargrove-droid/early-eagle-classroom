<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Orchard Attendance</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dbe6e6}iframe{display:block;width:100vw;height:100vh;border:0}.tune{position:fixed;left:12px;bottom:12px;z-index:99999;width:300px;padding:12px;border:2px solid #789fc0;border-radius:16px;background:rgba(255,250,240,.97);font:700 12px/1.2 "Trebuchet MS",Arial;color:#173f72;box-shadow:0 6px 20px #0003}.tune h3{margin:0 0 8px;font-size:16px}.row{display:grid;grid-template-columns:105px 1fr 42px;gap:7px;align-items:center;margin:6px 0}.row input{width:100%}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.buttons button{border:1px solid #789fc0;border-radius:9px;background:white;color:#173f72;padding:6px 8px;font-weight:900;cursor:pointer}.hint{font-size:10px;margin-top:7px;color:#667}</style></head><body><iframe id="board" src="attendance-approved.html" title="Apple Orchard Attendance"></iframe><aside class="tune" id="tune"><h3>🔢 Number Position</h3><div id="rows"></div><div class="buttons"><button id="save">Save</button><button id="copy">Copy Values</button><button id="reset">Reset</button><button id="hide">Hide Panel</button></div><div class="hint">Move the Here and Not Here Yet numbers into place, then Save and Copy Values.</div></aside><script>
const APPLE_MASK='polygon(50.63% 61.47%,55.31% 66.28%,59.38% 69.29%,64.22% 70.94%,69.38% 71.09%,75.31% 71.39%,80.23% 71.09%,84.69% 70.04%,89.22% 67.48%,91.41% 65.83%,94.38% 63.58%,96.09% 60.72%,100% 100%,0% 100%)';
function applePile(){return [{x:50,y:84,r:-4},{x:39,y:82,r:3},{x:61,y:82,r:-2},{x:32,y:80,r:4},{x:68,y:79,r:-3},{x:25,y:77,r:2},{x:75,y:77,r:-4},{x:45,y:72,r:2},{x:56,y:71,r:-3},{x:34,y:70,r:4},{x:67,y:69,r:-2},{x:27,y:67,r:3},{x:73,y:67,r:-4},{x:50,y:61,r:3},{x:39,y:60,r:-3},{x:61,y:59,r:4},{x:32,y:57,r:-2},{x:68,y:56,r:3},{x:25,y:54,r:-4},{x:75,y:54,r:2},{x:45,y:49,r:-3},{x:56,y:48,r:4},{x:34,y:46,r:-2},{x:67,y:45,r:3},{x:28,y:43,r:-4},{x:72,y:42,r:2},{x:50,y:36,r:4},{x:40,y:34,r:-3},{x:60,y:33,r:2},{x:50,y:25,r:-2}]}
const DEFAULTS={hereX:-20,hereY:30,waitX:-30,waitY:30};let cfg={...DEFAULTS};try{cfg={...cfg,...JSON.parse(localStorage.getItem('eea-apple-number-tuning')||'{}')}}catch(e){}
const controls=[['hereX','Here Left/Right',-120,120],['hereY','Here Up/Down',-100,100],['waitX','Waiting Left/Right',-120,120],['waitY','Waiting Up/Down',-100,100]];const rows=document.getElementById('rows');controls.forEach(([key,label,min,max])=>{const r=document.createElement('label');r.className='row';r.innerHTML=`<span>${label}</span><input data-key="${key}" type="range" min="${min}" max="${max}" step="1" value="${cfg[key]}"><b id="v-${key}">${cfg[key]}</b>`;rows.appendChild(r)});
let w=null;function apply(){if(!w)return;w.appleBasketSlots=b=>applePile().slice(0,Number(b));const style=w.document.getElementById('appleApprovedStyle')||w.document.head.appendChild(Object.assign(w.document.createElement('style'),{id:'appleApprovedStyle'}));style.textContent=`.apple .here-zone{transform:translate(20px,-50px) scale(1.38)!important;overflow:visible!important;border-radius:0!important}.apple .basket-front-mask{clip-path:${APPLE_MASK}!important}.apple .here-count{transform:translate(calc(-50% + ${cfg.hereX}px),calc(-50% + ${cfg.hereY}px))!important}.apple .wait-count{transform:translate(calc(-50% + ${cfg.waitX}px),calc(-50% + ${cfg.waitY}px))!important}`;if(typeof w.render==='function')w.render()}
document.getElementById('board').addEventListener('load',()=>{w=document.getElementById('board').contentWindow;if(!w||w.localStorage.getItem('eea-attendance-theme')!=='apple-orchard')return;apply()});rows.addEventListener('input',e=>{const k=e.target.dataset.key;if(!k)return;cfg[k]=Number(e.target.value);document.getElementById('v-'+k).textContent=cfg[k];apply()});document.getElementById('save').onclick=()=>{localStorage.setItem('eea-apple-number-tuning',JSON.stringify(cfg));document.getElementById('save').textContent='✓ Saved';setTimeout(()=>document.getElementById('save').textContent='Save',1000)};document.getElementById('copy').onclick=()=>{const payload=JSON.stringify(cfg,null,2);const done=()=>{document.getElementById('copy').textContent='✓ Copied';setTimeout(()=>document.getElementById('copy').textContent='Copy Values',1200)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(payload).then(done).catch(()=>prompt('Copy these values:',payload));else prompt('Copy these values:',payload)};document.getElementById('reset').onclick=()=>{cfg={...DEFAULTS};controls.forEach(([k])=>{const i=document.querySelector(`[data-key="${k}"]`);i.value=cfg[k];document.getElementById('v-'+k).textContent=cfg[k]});apply()};document.getElementById('hide').onclick=()=>document.getElementById('tune').style.display='none';
</script></body></html>
