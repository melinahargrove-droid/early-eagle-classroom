<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Schedule</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;color:#173f72;background:#dce8e6}.page{width:100vw;height:100vh;padding:1.5vh 2vw;background:linear-gradient(180deg,#eef5f1,#f7f1e5)}.top{height:10%;display:flex;align-items:center;justify-content:space-between}.top h1{margin:0;font-size:clamp(34px,3vw,58px)}.sub{color:#61746f;font-size:clamp(13px,.95vw,18px);font-weight:700}.back{border:1.7px solid rgba(73,104,122,.2);border-radius:15px;background:#fffaf0;color:#173f72;padding:1vh 1.1vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.summary{height:8%;display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;margin-bottom:1vh}.summary-card{border:1.5px solid rgba(80,110,124,.14);border-radius:16px;background:rgba(255,253,247,.9);display:flex;align-items:center;justify-content:center;gap:.7vw;font-weight:900}.summary-card strong{font-size:clamp(22px,1.7vw,34px)}.list{height:70%;overflow:auto;padding-right:.3vw}.row{min-height:8vh;margin-bottom:.65vh;display:grid;grid-template-columns:42px 72px minmax(180px,1.4fr) 120px 135px 88px;gap:.75vw;align-items:center;padding:.55vh .8vw;border-radius:16px;background:rgba(255,253,247,.94);border:1.4px solid rgba(78,108,122,.14);box-shadow:0 3px 9px rgba(48,70,80,.05)}.drag{font-size:23px;text-align:center;color:#899792}.preview{width:64px;height:54px;border:1.2px solid #b5c5c2;border-radius:10px;background:#f7f5ec;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;text-align:center;color:#71827c;font-weight:800}.preview img{width:100%;height:100%;object-fit:contain}.pic-controls{display:flex;gap:3px;margin-top:2px}.pic-btn{border:1px solid #b5c3c0;border-radius:6px;background:#eef4f1;color:#173f72;font-size:9px;font-weight:900;padding:2px 4px;cursor:pointer}.file{display:none}.field label{display:block;font-size:10px;font-weight:900;color:#687a74;margin-bottom:2px}.name,.time{width:100%;height:4vh;border:1.3px solid #b4c3c0;border-radius:9px;background:white;padding:0 .55vw;color:#173f72;font-size:clamp(13px,.9vw,17px);font-weight:900}.toggle-wrap{display:flex;align-items:center;justify-content:center;gap:.4vw}.toggle{position:relative;width:52px;height:28px;border-radius:999px;background:#b9c4c1;cursor:pointer}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:white;transition:.15s}.toggle.on{background:#6ea578}.toggle.on:after{left:27px}.state{font-weight:900;font-size:13px;min-width:40px}.order{display:flex;gap:.25vw;justify-content:flex-end}.order button{width:35px;height:33px;border:1.2px solid #b5c3c0;border-radius:8px;background:#f6f7f1;color:#173f72;font-size:15px;font-weight:900;cursor:pointer}.footer{height:9%;display:flex;align-items:center;justify-content:space-between}.note{font-size:clamp(10px,.72vw,14px);color:#66756f;font-weight:700}.actions{display:flex;gap:.6vw}.actions button{border:0;border-radius:13px;padding:1vh 1.2vw;font-size:clamp(13px,.88vw,17px);font-weight:900;cursor:pointer}.add{background:#e3eee9;color:#264f5c}.reset{background:#ece9df;color:#42535a}.save{background:#648fae;color:white}.toast{position:fixed;left:50%;bottom:2.5vh;transform:translateX(-50%) translateY(20px);opacity:0;background:#173f72;color:white;padding:.9vh 1.2vw;border-radius:999px;font-weight:900;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><main class="page"><header class="top"><div><h1>Class Schedule</h1><div class="sub">Set the order of your day and what children see on the Home schedule.</div></div><button class="back" onclick="location.href='teachers-desk.html'">← Teacher’s Desk</button></header><section class="summary"><div class="summary-card"><span>Activities</span><strong id="total">0</strong></div><div class="summary-card"><span>Showing Today</span><strong id="active">0</strong></div><div class="summary-card"><span>First Activity</span><strong id="first" style="font-size:clamp(15px,1.1vw,22px)">—</strong></div></section><section class="list" id="list"></section><footer class="footer"><div class="note">The original Home schedule artwork is used wherever it already exists. You can replace any picture from here.</div><div class="actions"><button class="add" id="addBtn">+ Add Activity</button><button class="reset" id="resetBtn">Restore Default Schedule</button><button class="save" id="saveBtn">Save Changes</button></div></footer></main><div class="toast" id="toast"></div><script>const KEY='eea-schedule-config',ICON_BASE='https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Schedule%20Icons/';const DEFAULTS=[{name:'Centers',picture:ICON_BASE+'EEA_v6_4D-2A_Schedule_Centers.png'},{name:'Breakfast',picture:ICON_BASE+'EEA_v6_4D-2C_Schedule_Breakfast.png'},{name:'Circle Time',picture:ICON_BASE+'EEA_v6_4D-2B_Schedule_Circle_Time.png'},{name:'Recess',picture:ICON_BASE+'EEA_v6_4D-2D_Schedule_Recess.png'},{name:'Lunch',picture:ICON_BASE+'EEA_v6_4D-2E_Schedule_Lunch.png'},{name:'Nap',picture:ICON_BASE+'EEA_v6_4D-2F_Schedule_Nap.png'},{name:'Snack',picture:ICON_BASE+'EEA_v6_4D-2G_Schedule_Snack.png'},{name:'Small Groups',picture:''},{name:'Read Aloud',picture:''},{name:'Dancing',picture:''},{name:'Clean Up',picture:''},{name:'Dismissal',picture:''}].map((x,i)=>({id:'activity-'+i,name:x.name,picture:x.picture,time:'',active:true,defaultPicture:x.picture}));let items=load();const list=document.getElementById('list'),toast=document.getElementById('toast');function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(x)&&x.length)return x.map((v,i)=>({...v,defaultPicture:v.defaultPicture!==undefined?v.defaultPicture:(DEFAULTS.find(d=>d.name===v.name)?.picture||'')}))}catch(e){}return DEFAULTS.map(x=>({...x}))}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){list.innerHTML='';items.forEach((x,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<div class="drag">☰</div><div><div class="preview">${x.picture?`<img src="${esc(x.picture)}" alt="${esc(x.name)}">`:'No default art'}</div><div class="pic-controls"><button class="pic-btn" data-pic="${i}">Change</button><button class="pic-btn" data-clear="${i}">Default</button></div><input class="file" id="file-${i}" type="file" accept="image/*"></div><div class="field"><label>Activity Name</label><input class="name" data-name="${i}" value="${esc(x.name)}"></div><div class="field"><label>Time (optional)</label><input class="time" data-time="${i}" type="time" value="${esc(x.time||'')}"></div><div class="toggle-wrap"><div class="toggle ${x.active?'on':''}" data-toggle="${i}"></div><span class="state">${x.active?'Show':'Hide'}</span></div><div class="order"><button data-up="${i}">↑</button><button data-down="${i}">↓</button></div>`;list.appendChild(r)});bind();summary()}function bind(){document.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>items[+e.dataset.name].name=e.value);document.querySelectorAll('[data-time]').forEach(e=>e.oninput=()=>items[+e.dataset.time].time=e.value);document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{items[+e.dataset.toggle].active=!items[+e.dataset.toggle].active;render()});document.querySelectorAll('[data-up]').forEach(e=>e.onclick=()=>move(+e.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(e=>e.onclick=()=>move(+e.dataset.down,1));document.querySelectorAll('[data-pic]').forEach(e=>e.onclick=()=>document.getElementById('file-'+e.dataset.pic).click());document.querySelectorAll('.file').forEach(inp=>inp.onchange=()=>{let f=inp.files&&inp.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{items[+inp.id.split('-')[1]].picture=rd.result;render();flash('Picture ready — save changes')};rd.readAsDataURL(f)});document.querySelectorAll('[data-clear]').forEach(e=>e.onclick=()=>{let x=items[+e.dataset.clear];x.picture=x.defaultPicture||'';render();flash(x.picture?'Original picture restored':'No original picture for this activity')})}function move(i,d){let j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render()}function summary(){total.textContent=items.length;let a=items.filter(x=>x.active);active.textContent=a.length;first.textContent=a[0]?.name||'—'}function flash(m){toast.textContent=m;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),1300)}addBtn.onclick=()=>{items.push({id:'custom-'+Date.now(),name:'New Activity',picture:'',defaultPicture:'',time:'',active:true});render();list.scrollTop=list.scrollHeight};resetBtn.onclick=()=>{items=DEFAULTS.map(x=>({...x}));render();flash('Default schedule restored')};saveBtn.onclick=()=>{items.forEach(x=>x.name=x.name.trim()||'Activity');try{localStorage.setItem(KEY,JSON.stringify(items));flash('Schedule saved!')}catch(e){flash('A picture may be too large to save')}render()};render();</script></body></html>
