<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Are We Going Outside? — Early Eagle Academy</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#e8efe9;color:#123d78}.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.artboard{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;max-height:100vh}.master{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.close{position:absolute;z-index:20;right:2.2%;top:2.2%;width:clamp(48px,4.4vw,74px);height:clamp(48px,4.4vw,74px);border:2px solid rgba(183,149,89,.55);border-radius:50%;background:rgba(255,250,236,.96);box-shadow:0 4px 12px rgba(45,72,94,.16);color:#174e88;font-size:clamp(28px,2.5vw,44px);font-weight:900;cursor:pointer}.weather-panel{position:absolute;z-index:5;left:30.4%;top:57%;width:57.1%;height:15.7%;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}.fact{height:62%;display:flex;align-items:center;justify-content:center;gap:5%;padding:0 7%;text-align:center;font-size:clamp(17px,1.55vw,30px);font-weight:900;color:#315f50;line-height:1.08}.fact+.fact{border-left:2px solid rgba(55,93,84,.16)}.fact-icon{font-size:clamp(28px,2.7vw,52px);line-height:1}.eddie-says{position:absolute;z-index:5;left:37%;top:76.8%;width:51.8%;height:14.5%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 5%;font-size:clamp(24px,2.1vw,40px);font-weight:900;line-height:1.12;color:#174e88}.loading{opacity:.72}.error{font-size:clamp(20px,1.8vw,34px)}
</style>
</head>
<body>
<main class="stage">
  <section class="artboard">
    <img id="master" class="master" src="assets/recess-yes.png" alt="Are we going outside?">
    <button class="close" type="button" aria-label="Close" onclick="location.href='index.html'">×</button>
    <div class="weather-panel" id="weather-panel">
      <div class="fact"><span class="fact-icon">🌡️</span><span id="feels">Checking…</span></div>
      <div class="fact"><span class="fact-icon" id="condition-icon">🌤️</span><span id="condition">Weather</span></div>
      <div class="fact"><span class="fact-icon">☂️</span><span id="rain">Checking…</span></div>
    </div>
    <div class="eddie-says loading" id="eddie-says">Eddie is checking what we should wear outside…</div>
  </section>
</main>
<script>
const master=document.getElementById('master');
const feelsEl=document.getElementById('feels');
const conditionEl=document.getElementById('condition');
const conditionIcon=document.getElementById('condition-icon');
const rainEl=document.getElementById('rain');
const saysEl=document.getElementById('eddie-says');
const preview=new URLSearchParams(location.search).get('preview');

function weatherInfo(code){if(code===0)return['Clear','☀️'];if([1,2].includes(code))return['Partly Cloudy','🌤️'];if(code===3)return['Cloudy','☁️'];if([45,48].includes(code))return['Foggy','🌫️'];if([51,53,55].includes(code))return['Drizzle','🌦️'];if([61,63,65,80,81,82].includes(code))return['Rainy','🌧️'];if([71,73,75,77,85,86].includes(code))return['Snowy','❄️'];if([95,96,99].includes(code))return['Stormy','⛈️'];return['Today','🌤️']}
function shouldGoOutside(code,feels,wind){const wet=[51,53,55,61,63,65,71,73,75,77,80,81,82,85,86,95,96,99].includes(code);return !(wet||feels>=95||feels<=32||wind>=30)}
function eddieTip(code,feels,wind,yes){if(!yes){if([95,96,99].includes(code))return 'Storms are nearby. We’ll play safely inside today.';if([51,53,55,61,63,65,80,81,82].includes(code))return 'It’s wet outside. Indoor play sounds good today!';if([71,73,75,77,85,86].includes(code))return 'Brrr! Snowy weather means we’ll stay cozy inside.';if(wind>=30)return 'It’s very windy today. We’ll play inside.';if(feels>=95)return 'It feels very hot today. Let’s stay cool inside.';if(feels<=32)return 'It feels very cold today. Let’s stay warm inside.';return 'We’ll play inside today!'}if(feels<45)return 'Bundle up! Wear a warm coat for outside play.';if(feels<58)return 'Grab your jackets before we head outside!';if(feels<68)return 'A light jacket might feel good outside.';if(feels>=90)return 'It’s hot! Bring water, find shade, and take cool-down breaks.';if(feels>=82)return 'It’s warm outside. Bring water and use the shade.';if(wind>=18)return 'It’s breezy today. Hold onto your hats!';return 'It feels great outside. Let’s go play!'}
function setMaster(yes){master.src=yes?'assets/recess-yes.png':'assets/recess-no.png';master.alt=yes?'Yes, we can go outside':'No, we should stay inside'}
async function loadWeather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=36.7417&longitude=-88.6367&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FChicago';const response=await fetch(url);if(!response.ok)throw new Error('weather');const data=await response.json();const w=data.current;const [label,icon]=weatherInfo(w.weather_code);let yes=shouldGoOutside(w.weather_code,w.apparent_temperature,w.wind_speed_10m);if(preview==='no')yes=false;if(preview==='yes')yes=true;setMaster(yes);feelsEl.innerHTML=`Feels Like<br>${Math.round(w.apparent_temperature)}°F`;conditionEl.textContent=label;conditionIcon.textContent=icon;rainEl.innerHTML=(w.precipitation||0)>0?'Rain<br>Now':'No Rain<br>Right Now';saysEl.textContent=eddieTip(w.weather_code,w.apparent_temperature,w.wind_speed_10m,yes);saysEl.classList.remove('loading')}catch(error){feelsEl.textContent='—';conditionEl.textContent='Weather unavailable';conditionIcon.textContent='🌤️';rainEl.textContent='—';saysEl.textContent='I couldn’t check the weather right now. Try again in a moment.';saysEl.classList.remove('loading');saysEl.classList.add('error')}}
loadWeather();
</script>
</body>
</html>
