<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eddie's Weather — Early Eagle Academy</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174e88;background:#f6eedb}.stage{position:relative;width:100vw;height:100vh;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.86) brightness(1.04)}.wash{position:absolute;inset:0;background:rgba(250,245,229,.22)}.title{position:absolute;z-index:3;top:5.5%;left:0;right:0;text-align:center;font-weight:900;font-size:clamp(38px,4vw,72px);text-shadow:0 2px rgba(255,255,255,.8)}.close{position:absolute;z-index:10;right:3%;top:3.5%;width:64px;height:64px;border-radius:50%;border:2px solid #d4b67e;background:#fff9e9;color:#174e88;font-size:38px;font-weight:900;cursor:pointer}.card{position:absolute;z-index:2;left:8%;right:8%;top:16%;bottom:6%;border-radius:42px;background:rgba(255,250,236,.9);border:3px solid rgba(94,139,179,.35);box-shadow:0 12px 30px rgba(45,72,94,.15);display:grid;grid-template-columns:47% 53%;overflow:hidden}.eddie-wrap{position:relative;display:flex;align-items:center;justify-content:center;padding:4%}.eddie{max-width:95%;max-height:95%;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(45,74,95,.12))}.weather{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5% 8% 5% 2%}.today{font-size:clamp(24px,2vw,38px);font-weight:900;opacity:.8}.condition{font-size:clamp(38px,4vw,72px);font-weight:900;line-height:1.05;margin-top:1%}.temps{display:flex;gap:30px;align-items:baseline;justify-content:center;margin-top:2%}.temp{font-size:clamp(58px,6vw,108px);font-weight:900}.feels{font-size:clamp(18px,1.5vw,28px);font-weight:900}.decision{margin-top:4%;width:92%;padding:3.5% 4%;border-radius:28px;background:#eaf4e6;border:3px solid #9cbe91}.thumb{font-size:clamp(64px,6vw,110px);line-height:.9}.decision-title{font-size:clamp(30px,3vw,54px);font-weight:900;margin-top:2%;color:#315f38}.advice{font-size:clamp(20px,1.7vw,32px);font-weight:900;margin-top:2%;color:#174e88}.loading{font-size:clamp(26px,2.4vw,44px);font-weight:900}.error{font-size:clamp(20px,1.7vw,30px);font-weight:900;line-height:1.35}.inside{background:#f4e8e4;border-color:#c79a8d}.inside .decision-title{color:#7c4037}@keyframes happy{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-10px) rotate(-2deg)}40%{transform:translateY(0) rotate(2deg)}60%{transform:translateY(-7px) rotate(-1deg)}80%{transform:translateY(0) rotate(1deg)}}@keyframes no{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}.happy{animation:happy 1.6s ease-in-out 1}.no{animation:no 1.2s ease-in-out 1}@media(max-aspect-ratio:1.3/1){.card{grid-template-columns:43% 57%;left:4%;right:4%}}</style></head><body><main class="stage"><img class="bg" src="https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/03%20Home/Home%20Screen%20background.png" alt=""><div class="wash"></div><button class="close" onclick="location.href='index.html'" aria-label="Close">×</button><div class="title">What’s the Weather Like Today?</div><section class="card"><div class="eddie-wrap"><img id="eddie" class="eddie" src="assets/weather-eddie.png" alt="Eddie showing different kinds of weather"></div><div class="weather" id="weather"><div class="loading">Checking Mayfield’s weather…</div></div></section></main><script>const box=document.getElementById('weather'),eddie=document.getElementById('eddie');const codeName=c=>({0:'Sunny',1:'Mostly Sunny',2:'Partly Cloudy',3:'Cloudy',45:'Foggy',48:'Foggy',51:'Drizzly',53:'Drizzly',55:'Drizzly',61:'Rainy',63:'Rainy',65:'Rainy',71:'Snowy',73:'Snowy',75:'Snowy',77:'Snowy',80:'Showery',81:'Showery',82:'Showery',85:'Snow Showers',86:'Snow Showers',95:'Stormy',96:'Stormy',99:'Stormy'}[c]||'Today’s Weather');function decide(c,t,wind){const wet=[51,53,55,61,63,65,71,73,75,77,80,81,82,85,86,95,96,99].includes(c);const unsafe=wet||t>=95||t<=32||wind>=30;if(unsafe)return{out:false,msg:'We’ll play inside today!',tip:c>=95?'It’s too hot for our usual outdoor play.':t<=32?'Brrr! It’s too cold for our usual outdoor play.':wind>=30?'The wind is too strong for our usual outdoor play.':'The weather says indoor play is the better choice.'};let tip='It looks like a good day to play outside!';if(t<55)tip='Grab your jackets!';else if(t>=85)tip='It’s warm — water and shade are important!';return{out:true,msg:'Let’s go outside!',tip}}async function load(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=36.7417&longitude=-88.6367&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago';const r=await fetch(u);if(!r.ok)throw Error();const d=await r.json(),w=d.current,c=codeName(w.weather_code),x=decide(w.weather_code,w.apparent_temperature,w.wind_speed_10m);box.innerHTML=`<div class="today">Today in Mayfield</div><div class="condition">${c}</div><div class="temps"><div class="temp">${Math.round(w.temperature_2m)}°</div><div class="feels">Feels like ${Math.round(w.apparent_temperature)}°</div></div><div class="decision ${x.out?'':'inside'}"><div class="thumb">${x.out?'👍':'👎'}</div><div class="decision-title">${x.msg}</div><div class="advice">${x.tip}</div></div>`;eddie.classList.add(x.out?'happy':'no')}catch(e){box.innerHTML='<div class="error">I couldn’t check the weather right now.<br><br>Try again in a moment.</div>'}}load();</script></body></html>
