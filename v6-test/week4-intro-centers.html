="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 4 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Cleaning',sub:'Dramatic Play',kicker:'NEW LESSON',img:'assets/dramatic-play.webp',materials:'I Love Us! · sponge · towel · dish soap · dishes · spray bottle · broom · additional safe housekeeping dramatic-play items · cleaning visuals',vocab:'fold · scrub · sweep · tidy · wipe · wash',steps:[{title:'Messes Happen',prompt:'Spills and messes are normal.',cue:'We clean up afterward.',script:'In I Love Us! A Book About Family, the baby makes a mess during breakfast. Show the book. Thumbs up if you have ever made a mess during mealtime. Spills and messes are normal; we just need to clean up afterward.'},{title:'New Cleaning Tools',prompt:'What do you notice in Dramatic Play?',cue:'Sponge · towel · dish soap · spray bottle · broom',script:'Show the new cleaning items. This week, you can care for our home by tidying up, or cleaning. There are many ways to tidy up. What is one way you have seen someone clean? Invite one child.'},{title:'Wash & Scrub Dishes',prompt:'How can we clean a dish?',cue:'Soap → wash → scrub when needed',script:'Model putting soap on a sponge and washing dishes in the sink. Explain that when food does not come off easily, we scrub it, or rub it hard, with the sponge.'},{title:'Wipe the Table',prompt:'Spray a little water and wipe.',cue:'Two or three sprays → towel',script:'Model spraying the dining table two or three times with water and wiping it with a towel.'},{title:'Sweep the Floor',prompt:'Food on the floor can be swept up.',cue:'Use the broom carefully.',script:'Model using a broom to sweep the floor.'},{title:'Put Cleaning Tools Away',prompt:'Where does each cleaning item belong?',cue:'Return materials to their labeled places.',script:'Model and talk through where the cleaning items are stored in Dramatic Play.'}],teacherNote:'Focus on 3s notes that household tasks can be performed by people of all genders. Use children’s family knowledge without assigning cleaning roles by gender.'},{title:'Cubes With Friends',sub:'Math',kicker:'NEW CENTER · NEW LESSON',img:'assets/math.webp',materials:'inch cubes · inch cube building cards · Building Blocks Teacher Guide p.10 · optional Math Center photograph · table and floor workspace',vocab:'cube · build · stack',steps:[{title:'Meet the Math Center',prompt:'We have a new center!',cue:'Math is where we explore counting, shapes, patterns, and data.',script:'We have a new center; it’s the Math Center. The Math Center is where we will explore counting, shapes, patterns, and data. Show a picture or bring children to the Center.'},{title:'Meet the Cubes',prompt:'A cube has six sides.',cue:'Let’s count them: 1, 2, 3, 4, 5, 6.',script:'Today we will build with inch cubes. Show a cube. A cube has six sides. Point to each side while counting all six.'},{title:'Stack & Count',prompt:'How many cubes are in the stack?',cue:'One on top of another makes a stack.',script:'Model stacking cubes. Count the example stack: 1, 2, 3. “I stacked 3 cubes! How many do you think you can stack at the Math Center?”'},{title:'Build With a Friend',prompt:'Can you make a stack together?',cue:'Share cubes and build with a friend.',script:'You can also build with a friend and make a stack together. I can’t wait to see!'}]},Tuesday:[{title:'Favorite Places Part 2',sub:'Blocks',kicker:'CONTINUED LESSON',img:'assets/blocks.webp',materials:'photos of children’s Week 3 block building · photos of favorite places/nearby structures · additions based on play such as people figurines, city vehicles, street signs, or miniature furniture',vocab:'build · structure · neighborhood · inspiration',steps:[{title:'Remember Our Special Places',prompt:'What special-place structures did we build?',cue:'Look at photos and share our Block Center experiences.',script:'In the Block Center we have been building structures inspired by special places. Invite a few children to share their experiences and show photos of children’s structures.'},{title:'Build a Neighborhood',prompt:'Let’s connect our special places into a neighborhood.',cue:'A neighborhood is the space around where people live.',script:'We will continue building structures inspired by special places. We will create a neighborhood, the space around where people live, in the block area.'},{title:'Meet the New Materials',prompt:'What could these new materials add to our neighborhood?',cue:'People · signs · vehicles · furniture, based on children’s play',script:'Show the materials you actually added based on children’s previous building. “We have added ____ to our Block Center to use in our neighborhood.”'},{title:'Favorite Neighborhood Places',prompt:'What are some favorite places in a neighborhood?',cue:'Use children’s own experiences without requiring a home-based example.',script:'Ask what favorite places children know in a neighborhood. Continue to be responsive to children’s family/housing circumstances and familiar community spaces.'}]},{title:'Playdough',sub:'Science & Engineering',kicker:'CONTINUED EXPERIENCE',img:'assets/science.webp',prompt:'Return to the playdough we made.',cue:'Notice how it looks, feels, and smells as you create.',materials:'Established Week 3 Making Playdough materials and tools.',vocab:'senses · smell · touch · roll · sticky · calm · mix',teacherNote:'The Week 4 Weekly Plan schedules Playdough. No separate Week 4 Playdough link has been identified in the Unit 1 Digital Arc; Early Eagle treats this as continued use of the Week 3 Making Playdough experience rather than inventing a new lesson.'}]]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday,runner=params.get('eeaRunner')==='1';let i=Math.max(0,Math.min(items.length-1,Number(params.get('item'))||0)),step=Math.max(0,Number(params.get('step'))||0),visualToken=0;const slot=()=>`week4-centers-${dayName.toLowerCase()}-${i}`+(items[i]?.steps?`-step-${step}`:'');async function applyVisual(d){const token=++visualToken;let src='';try{await EEAVisualStore.migrate();src=await EEAVisualStore.get(slot())}catch(e){}if(token!==visualToken)return;$('pic').src=src||d.steps?.[step]?.img||d.img;$('restoreVisual').style.display=src?'inline-block':'none'}function render(){const d=items[i],s=d.steps?.[step];$('pic').src=d.steps?.[step]?.img||d.img;applyVisual(d);$('title').textContent=s?.title||d.title;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker+(d.steps?` · STEP ${step+1}/${d.steps.length}`:'');$('prompt').textContent=s?.prompt||d.prompt;$('cue').textContent=s?.cue||d.cue;$('noteTitle').textContent=s?.title||d.title;$('notes').textContent=(s?.script||'')+(d.teacherNote?'\n\n'+d.teacherNote:'')||(d.revisit?'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Review Original Introduction if the group needs the full teaching sequence.':'');$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='FOCUS ON 3s · WEEK 4 · '+dayName.toUpperCase();$('review').style.display=d.revisit?'inline-block':'none';$('doneBtn').textContent=d.steps&&step<d.steps.length-1?'Next Step →':i<items.length-1?'Next Center →':'Done ✓';$('panel').classList.remove('open')}function back(){location.href='daily-lessons.html?week=4&day='+Math.max(0,['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(dayName))}$('back').onclick=back;$('doneBtn').onclick=()=>{const d=items[i];if(d.steps&&step<d.steps.length-1){step++;render()}else if(i<items.length-1){i++;step=0;render()}else if(!runner)back()};$('teacherBtn').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('review').onclick=()=>{const d=items[i];if(d.revisit)location.href='week4-intro-centers.html?day='+d.revisit.day+'&item='+d.revisit.item+'&review=1'};$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);q.set('item',String(i));q.set('step',String(step));const backUrl='week4-intro-centers.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(backUrl)};$('restoreVisual').onclick=async()=>{try{await EEAVisualStore.remove(slot())}catch(e){}applyVisual(items[i])};render()})();</script></body></html>
