<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 4 Intro to Centers</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea)}.page{height:100vh;padding:3vh 5vw}.top{height:10vh;font-weight:900;letter-spacing:.12em;color:#789697}.card{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw}.visual{height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-size:27px;font-weight:900}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:clamp(44px,4vw,76px);margin:1vh 0;color:#164f7f;line-height:1}.lead{font-size:clamp(21px,1.5vw,29px);font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh}.step{padding:1.1vh 1.2vw;background:#e7f0ed;border-radius:17px;color:#416d61;font-size:19px;font-weight:900}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff}</style></head><body><main class="page"><div class="top">EARLY EAGLE ACADEMY · INTRO TO CENTERS · WEEK 4</div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="next" style="display:none">Next Center →</button><button class="done" onclick="location.href='week4-plan.html'">Done ✓</button></div></main><script>const data={Monday:[{title:'Art Easel: Painting',lead:'Today we begin painting at the easel using one color.',visual:'Visual placeholder: easel, paper, paint cup, and brush.',steps:['Introduce the easel and painting materials.','Model how to use the brush and paint on the paper.','Begin with one color so children can focus on the painting process and communicating ideas.']}],Tuesday:[{title:'Blocks: Building a Neighborhood',lead:'Blocks can become the places in a neighborhood.',visual:'Visual placeholder: preschool block neighborhood with roads and buildings.',steps:['Talk about places children know in a neighborhood.','Use blocks to represent buildings and spaces.','Invite children to build together and share ideas.']},{title:'Writing & Drawing: Making Lines and Shapes',lead:'Lines and shapes can help us communicate our ideas.',visual:'Visual placeholder: paper covered with varied lines and simple shapes.',steps:['Review different kinds of lines.','Add and describe different kinds of shapes.','Invite children to experiment and tell about what they made.']}],Wednesday:[{title:'Discovery: Making Playdough',lead:'Today we make the playdough we use in our classroom.',visual:'Visual placeholder: bowl, spoon, ingredients, and finished playdough.',steps:['Look at the ingredients and tools together.','Follow the classroom playdough-making process with children participating.','Notice how the materials change as they are combined.']}],Thursday:[],Friday:[]};let day=new URLSearchParams(location.search).get('day')||'Monday',arr=data[day]||[],i=0;if(!arr.length){arr=[{title:'Continue Centers',lead:'No new center is introduced today.',visual:'Visual placeholder: children engaged in familiar Week 4 centers.',steps:['Remind children of the centers already introduced this week.','Review expectations only as needed.']}]}function render(){let x=arr[i];eye.textContent=day.toUpperCase()+' · '+(i+1)+' OF '+arr.length;title.textContent=x.title;lead.textContent=x.lead;visual.textContent=x.visual;steps.innerHTML=x.steps.map(s=>'<div class="step">'+s+'</div>').join('');next.style.display=arr.length>1&&i<arr.length-1?'inline-block':'none'}next.onclick=()=>{i++;render()};render();</script></body></html>
