<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Week 1 Lessons</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f6f1e5}
.app{width:100%;height:100%;padding:1.2vh 1.5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}
.top{height:8.5vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid rgba(89,139,151,.22)}
.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.1em;font-size:11px}.brand h1{margin:.2vh 0 0;font-size:clamp(28px,2.2vw,43px)}
.daytitle{font-weight:900;font-size:clamp(15px,1.1vw,21px)}.topright{display:flex;justify-content:flex-end;gap:.6vw}
.pill,.home{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.pill{border-radius:16px;padding:.8vh 1vw}.home{width:48px;height:48px;border-radius:50%;font-size:21px}
.dash{height:88vh;display:grid;grid-template-columns:16.5vw 1fr 12.5vw;gap:.8vw;padding-top:1vh}.side,.tools{border:1.4px solid rgba(89,139,151,.23);border-radius:22px;background:rgba(255,254,249,.9);padding:1.2vh .8vw}.side{display:flex;flex-direction:column}.side h3,.tools h3{margin:.3vh .2vw 1vh;font-size:16px}.count{font-size:11px;color:#789697;font-weight:900;margin:0 .2vw 1vh}.path{display:flex;flex-direction:column;gap:.55vh}
.path button{width:100%;text-align:left;border:1px solid rgba(89,130,146,.17);border-radius:15px;background:#fffdf8;color:#245c78;padding:.82vh .7vw;cursor:pointer}.path button b{display:block;font-size:13px}.path button span{display:block;color:#718985;font-size:10.5px;margin-top:.2vh}.path button.active{background:#dcecf5;border-color:#8fbfd8;box-shadow:inset 4px 0 0 #5c9ac5}.path button.doneStep{background:#edf5e8;border-color:#b6d29f}.path button.doneStep.active{background:#e4f1e6}
.continue{margin-top:auto;border:0;border-radius:15px;padding:1.1vh .5vw;background:#5c9ac5;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.stage{position:relative;border:1.5px solid rgba(89,139,151,.25);border-radius:24px;background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block}.tools section{border:1px solid rgba(89,130,146,.16);border-radius:16px;padding:1vh .7vw;margin-bottom:1vh;background:#fffdf8}.tools button{display:block;width:100%;border:0;border-radius:12px;padding:1vh .4vw;margin:.6vh 0;background:#e7f2f8;color:#245c78;font-weight:900;cursor:pointer}
.resumeNote{margin:.5vh .2vw 1.1vh;padding:.7vh .6vw;border-radius:12px;background:#eef5f4;color:#557876;font-size:11px;font-weight:800;line-height:1.35}
</style>
</head>
<body>
<main class="app">
<header class="top">
<div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Lessons</h1></div>
<div class="daytitle"><span id="dayName"></span> · Week 1</div>
<div class="topright"><button class="pill" id="overviewBtn">Day Overview</button><button class="home" id="homeBtn">⌂</button></div>
</header>
<div class="dash">
<aside class="side"><h3>Today’s Lesson Path</h3><div class="count" id="count"></div><div class="resumeNote" id="resumeNote">Your place is saved automatically.</div><div class="path" id="path"></div><button class="continue" id="continue">Continue Teaching</button></aside>
<section class="stage" id="stage"><iframe id="frame" title="Daily lesson"></iframe></section>
<aside class="tools"><section><h3>Teacher Materials</h3><div>Week 1 lesson materials</div></section><section><h3>Quick Tools</h3><button onclick="location.href='timer.html'">Timer</button><button onclick="location.href='clean-up.html'">Clean Up Song</button><button onclick="location.href='choose-a-friend.html'">Choose a Friend</button></section></aside>
</div>
</main>
<script>
(()=>{
const params=new URLSearchParams(location.search);
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const parsedDay=Number(params.get('day'));
const parsedSection=Number(params.get('section'));
const day=Number.isInteger(parsedDay)?clamp(parsedDay,0,4):0;
let section=Number.isInteger(parsedSection)?clamp(parsedSection,0,4):0;
const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const daySlugs=['monday','tuesday','wednesday','thursday','friday'];
const names=['Community Meeting','Read Aloud','Centers','Storytelling','Closing Circle'];
const subtitles=['Start together','Today’s book','Today’s center lesson','Tell our story','Reflect & say goodbye'];
const icons=['🌞','📖','🧩','✨','🏁'];
const community=['community-meeting.html','community-meeting-tuesday.html','community-meeting-wednesday.html','community-meeting-thursday.html','community-meeting-friday.html'];
const flows=[
 community,
 days.map(d=>'week1-read-aloud.html?day='+encodeURIComponent(d)),
 days.map(d=>'centers-week1.html?day='+encodeURIComponent(d)),
 days.map(d=>'storytelling-week1.html?day='+encodeURIComponent(d)),
 days.map(d=>'closing-circle-week1.html?day='+encodeURIComponent(d))
];
const stage=document.getElementById('stage'),path=document.getElementById('path');
const pad=n=>String(n).padStart(2,'0');
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const resumeKey='eea-lesson-resume';
const legacyAutoKey='eea-lesson-auto-resume';
const completeKey=()=>`eea-lesson-complete-${todayKey()}-w1-d${day}`;
document.getElementById('dayName').textContent=days[day];
localStorage.setItem('eea-daily-week','1');
localStorage.setItem('eea-daily-day',String(day));
localStorage.setItem('eea-daily-date',todayKey());
localStorage.removeItem(legacyAutoKey);
function saveResume(current=section){localStorage.setItem(resumeKey,JSON.stringify({date:todayKey(),week:1,day,section:current}))}
function clearResume(){localStorage.removeItem(resumeKey);localStorage.removeItem(legacyAutoKey)}
function completed(){try{const a=JSON.parse(localStorage.getItem(completeKey())||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveComplete(i){const a=completed();if(!a.includes(i)){a.push(i);a.sort((x,y)=>x-y);localStorage.setItem(completeKey(),JSON.stringify(a))}}
function renderPath(){
 const c=completed();
 path.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===section?'active':''} ${c.includes(i)?'doneStep':''}"><b>${icons[i]} ${n}${c.includes(i)?' ✓':''}</b><span>${subtitles[i]}</span></button>`).join('');
 [...path.children].forEach(b=>b.onclick=()=>{section=Number(b.dataset.i);load()});
 document.getElementById('count').textContent=`${c.length} of ${names.length} complete`;
 document.getElementById('continue').textContent=`Continue: ${names[section]} →`;
}
function src(){return flows[section][day]}
function overview(){saveResume();location.href=`daily-lessons.html?week=1&day=${day}&v=${Date.now()}`}
function goHome(){saveResume();location.href='index.html'}
function advance(){
 saveComplete(section);
 if(section===names.length-1){clearResume();location.href='index.html';return}
 section++;
 saveResume();
 load();
}
function backSection(){if(section===0){overview();return}section--;saveResume();load()}
function buttonLooksFinal(btn){return !!btn&&/Done|Finish|Complete|Finish Read Aloud/i.test((btn.textContent||'').trim())}
function buttonLooksBoundaryPrev(btn){return !!btn&&(/Day Overview|Previous Activity/i.test((btn.textContent||'').trim())||btn.disabled)}
async function normalizeCommunity(doc,frame,prev){
 if(section!==0)return;
 const close=doc.querySelector('.close,#closeBtn');
 if(close)close.onclick=e=>{e.preventDefault();overview()};
 if(day!==0)return;
 const cards=[...doc.querySelectorAll('.card')];
 if(!cards.length)return;
 let storeReady=null;
 function ensureStore(){if(frame.contentWindow.EEAVisualStore)return Promise.resolve();if(storeReady)return storeReady;storeReady=new Promise(resolve=>{const s=doc.createElement('script');s.src='visual-store.js';s.onload=resolve;s.onerror=resolve;doc.head.appendChild(s)});return storeReady}
 function activeIndex(){const n=cards.findIndex(c=>c.classList.contains('active'));return n<0?0:n}
 async function applyVisual(){const idx=activeIndex(),card=cards[idx],visual=card&&card.querySelector('.visual');if(!visual)return;visual.style.visibility='hidden';await ensureStore();let custom=visual.querySelector('.eeaCommunityCustomVisual');if(!custom){custom=doc.createElement('img');custom.className='eeaCommunityCustomVisual';custom.alt='Custom Community Meeting visual';Object.assign(custom.style,{display:'none',maxWidth:'100%',maxHeight:'52vh',width:'auto',height:'auto',objectFit:'contain',borderRadius:'24px'});visual.appendChild(custom)}const originals=[...visual.children].filter(x=>x!==custom);let image='';try{const store=frame.contentWindow.EEAVisualStore;if(store){await store.migrate();image=await store.get(`week1-community-${daySlugs[day]}-${idx+1}`)}}catch(e){}if(image){custom.src=image;custom.style.display='block';originals.forEach(x=>x.style.display='none')}else{custom.removeAttribute('src');custom.style.display='none';originals.forEach(x=>x.style.display='')}visual.style.visibility='visible'}
 if(prev){doc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='prev'&&activeIndex()===0){e.preventDefault();e.stopImmediatePropagation();overview();return}if(b.id==='prev'||b.id==='next')setTimeout(applyVisual,0)},true)}
 await applyVisual();
}
function wireFrame(frame){
 frame.onload=async()=>{
  try{
   const doc=frame.contentWindow.document;
   const next=doc.getElementById('next');
   const prev=doc.getElementById('prev');
   const done=doc.getElementById('done');
   await normalizeCommunity(doc,frame,prev);
   const close=doc.querySelector('.close,#closeBtn');
   if(close)close.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();overview()},true);
   doc.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if((b.id==='next'||b.id==='done')&&buttonLooksFinal(b)){
      e.preventDefault();e.stopImmediatePropagation();advance();return;
    }
    if(b.id==='prev'&&section>0&&buttonLooksBoundaryPrev(b)){
      e.preventDefault();e.stopImmediatePropagation();backSection();
    }
   },true);
   if(next){new MutationObserver(()=>{}).observe(next,{childList:true,subtree:true,attributes:true});}
   if(done&&buttonLooksFinal(done)){}
  }catch(e){console.warn('Lesson runner could not inspect section page',e)}
 }
}
function load(){
 saveResume(section);
 renderPath();
 stage.innerHTML='<iframe id="frame" title="Daily lesson"></iframe>';
 const frame=document.getElementById('frame');
 wireFrame(frame);
 const s=src(),join=s.includes('?')?'&':'?';
 frame.src=s+join+`eeaRunner=1&week=1&day=${day}&section=${section}&v=${Date.now()}`;
}
document.getElementById('overviewBtn').onclick=overview;
document.getElementById('homeBtn').onclick=goHome;
document.getElementById('continue').onclick=load;
window.addEventListener('pagehide',()=>saveResume(section));
load();
})();
</script>
</body>
</html>
