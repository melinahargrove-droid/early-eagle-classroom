<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 1 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f6f1e5}.app{width:100%;height:100%;padding:1.2vh 1.5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.top{height:8.5vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid rgba(89,139,151,.22)}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.1em;font-size:11px}.brand h1{margin:.2vh 0 0;font-size:clamp(28px,2.2vw,43px)}.daytitle{font-weight:900;font-size:clamp(15px,1.1vw,21px)}.topright{display:flex;justify-content:flex-end;gap:.6vw}.pill,.home{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.pill{border-radius:16px;padding:.8vh 1vw}.home{width:48px;height:48px;border-radius:50%;font-size:21px}.dash{height:88vh;display:grid;grid-template-columns:16.5vw 1fr 12.5vw;gap:.8vw;padding-top:1vh}.side,.tools{border:1.4px solid rgba(89,139,151,.23);border-radius:22px;background:rgba(255,254,249,.9);padding:1.2vh .8vw}.side{display:flex;flex-direction:column}.side h3,.tools h3{margin:.3vh .2vw 1vh;font-size:16px}.count{font-size:11px;color:#789697;font-weight:900;margin:0 .2vw 1vh}.path{display:flex;flex-direction:column;gap:.55vh}.path button{width:100%;text-align:left;border:1px solid rgba(89,130,146,.17);border-radius:15px;background:#fffdf8;color:#245c78;padding:.82vh .7vw;cursor:pointer}.path button b{display:block;font-size:13px}.path button span{display:block;color:#718985;font-size:10.5px;margin-top:.2vh}.path button.active{background:#dcecf5;border-color:#8fbfd8;box-shadow:inset 4px 0 0 #5c9ac5}.path button.doneStep{background:#edf5e8;border-color:#b6d29f}.path button.doneStep.active{background:#e4f1e6}.continue{margin-top:auto;border:0;border-radius:15px;padding:1.1vh .5vw;background:#5c9ac5;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.stage{position:relative;border:1.5px solid rgba(89,139,151,.25);border-radius:24px;background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block}.tools section{border:1px solid rgba(89,130,146,.16);border-radius:16px;padding:1vh .7vw;margin-bottom:1vh;background:#fffdf8}.tools button{display:block;width:100%;border:0;border-radius:12px;padding:1vh .4vw;margin:.6vh 0;background:#e7f2f8;color:#245c78;font-weight:900;cursor:pointer}.tools .editBtn{background:#edf3e6;color:#4f704b}.resumeNote{margin:.5vh .2vw 1.1vh;padding:.7vh .6vw;border-radius:12px;background:#eef5f4;color:#557876;font-size:11px;font-weight:800;line-height:1.35}.custom{position:absolute;inset:0;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 62%,#e4eee9);padding:3vh 3vw}.custom.show{display:flex}.customTop{display:flex;justify-content:space-between;align-items:center}.customKicker{color:#789697;font-weight:900;letter-spacing:.1em}.customBody{flex:1;display:grid;grid-template-columns:35% 1fr;gap:4vw;align-items:center;background:#fffdf9;border:1.5px solid #cbdde0;border-radius:30px;padding:4vh 4vw;margin:2vh 0}.customVisual{font-size:clamp(90px,10vw,175px);text-align:center}.customCopy h2{font-size:clamp(42px,4vw,76px);margin:0 0 2vh;color:#164f7f}.customText{font-size:clamp(21px,1.5vw,30px);font-weight:850;line-height:1.4;color:#557876;white-space:pre-wrap}.customPrompt{margin-top:2vh;padding:1.5vh 1.3vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(18px,1.2vw,24px);font-weight:900;white-space:pre-wrap}.customNav{display:flex;align-items:center;justify-content:space-between}.customNav button,.noteBtn{border:1px solid #d4e0df;border-radius:16px;padding:1vh 1.2vw;font-weight:900;cursor:pointer}.customPrev,.noteBtn{background:#fffdf8;color:#245c78}.customNext{background:#668f99;color:white}.teacherPanel{display:none;position:absolute;right:3vw;bottom:10vh;width:min(500px,38vw);z-index:20;background:#fffdf9;border:1.5px solid #c9dce0;border-radius:20px;padding:18px;box-shadow:0 12px 30px #0002;color:#557876;font-weight:800}.teacherPanel.show{display:block}</style></head><body><main class="app"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Lessons</h1></div><div class="daytitle"><span id="dayName"></span> · Week 1</div><div class="topright"><button class="pill" id="overviewBtn">Day Overview</button><button class="home" id="homeBtn">⌂</button></div></header><div class="dash"><aside class="side"><h3>Today’s Lesson Path</h3><div class="count" id="count"></div><div class="resumeNote">Your place is saved automatically.</div><div class="path" id="path"></div><button class="continue" id="continue">Continue Teaching</button></aside><section class="stage" id="stage"><iframe id="frame" title="Daily lesson"></iframe><section class="custom" id="custom"><div class="customTop"><div class="customKicker" id="customKicker"></div><button class="noteBtn" id="customNote">Teacher Note</button></div><div class="customBody"><div class="customVisual" id="customVisual">⭐</div><div class="customCopy"><h2 id="customTitle"></h2><div class="customText" id="customText"></div><div class="customPrompt" id="customPrompt"></div></div></div><div class="customNav"><button class="customPrev" id="customPrev">← Previous</button><span id="customCount" style="font-weight:900;color:#6e8785"></span><button class="customNext" id="customNext">Next →</button></div><aside class="teacherPanel" id="teacherPanel"></aside></section></section><aside class="tools"><section><h3>Teacher Materials</h3><div>Week 1 lesson materials</div></section><section><h3>Edit This Lesson</h3><button class="editBtn" id="manageScreens">✎ Edit Lesson</button><button class="editBtn" id="addScreen">＋ Add Screen</button></section><section><h3>Quick Tools</h3><button onclick="location.href='timer.html'">Timer</button><button onclick="location.href='clean-up.html'">Clean Up Song</button><button onclick="location.href='choose-a-friend.html'">Choose a Friend</button></section></aside></div></main><script>(()=>{const params=new URLSearchParams(location.search),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),parsedDay=Number(params.get('day')),parsedSection=Number(params.get('section')),day=Number.isInteger(parsedDay)?clamp(parsedDay,0,4):0;let section=Number.isInteger(parsedSection)?clamp(parsedSection,0,4):0;const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],daySlugs=['monday','tuesday','wednesday','thursday','friday'],names=['Community Meeting','Read Aloud','Centers','Storytelling','Closing Circle'],subtitles=['Start together','Today’s book','Today’s center lesson','Tell our story','Reflect & say goodbye'],icons=['🌞','📖','🧩','✨','🏁'],community=['community-meeting.html','community-meeting-tuesday.html','community-meeting-wednesday.html','community-meeting-thursday.html','community-meeting-friday.html'],flows=[community,days.map(d=>'week1-read-aloud.html?day='+encodeURIComponent(d)),days.map(d=>'centers-week1.html?day='+encodeURIComponent(d)),days.map(d=>'storytelling-week1.html?day='+encodeURIComponent(d)),days.map(d=>'closing-circle-week1.html?day='+encodeURIComponent(d))];const stage=document.getElementById('stage'),path=document.getElementById('path'),custom=document.getElementById('custom'),frame=document.getElementById('frame'),pad=n=>String(n).padStart(2,'0'),todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},resumeKey='eea-lesson-resume',addedKey='eea-added-lesson-screens',legacyAutoKey='eea-lesson-auto-resume',completeKey=()=>`eea-lesson-complete-${todayKey()}-w1-d${day}`;let customIndex=0,customMode=false;document.getElementById('dayName').textContent=days[day];localStorage.setItem('eea-daily-week','1');localStorage.setItem('eea-daily-day',String(day));localStorage.setItem('eea-daily-date',todayKey());localStorage.removeItem(legacyAutoKey);function addedData(){try{const x=JSON.parse(localStorage.getItem(addedKey)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return {}}}function added(){const x=addedData()[`w1-d${day}-s${section}`];return Array.isArray(x)?x:[]}function resume(){try{const r=JSON.parse(localStorage.getItem(resumeKey)||'null');return r&&r.date===todayKey()&&Number(r.week)===1&&Number(r.day)===day&&Number(r.section)===section?r:null}catch(e){return null}}function saveResume(){localStorage.setItem(resumeKey,JSON.stringify({date:todayKey(),week:1,day,section,mode:customMode?'custom':'builtin',customIndex:customMode?customIndex:null}))}function clearResume(){localStorage.removeItem(resumeKey);localStorage.removeItem(legacyAutoKey)}function completed(){try{const a=JSON.parse(localStorage.getItem(completeKey())||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function saveComplete(i){const a=completed();if(!a.includes(i)){a.push(i);a.sort((x,y)=>x-y);localStorage.setItem(completeKey(),JSON.stringify(a))}}function renderPath(){const c=completed();path.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===section?'active':''} ${c.includes(i)?'doneStep':''}"><b>${icons[i]} ${n}${c.includes(i)?' ✓':''}</b><span>${subtitles[i]}</span></button>`).join('');[...path.children].forEach(b=>b.onclick=()=>enterSection(Number(b.dataset.i),true));document.getElementById('count').textContent=`${c.length} of ${names.length} complete`;document.getElementById('continue').textContent=`Continue: ${names[section]} →`}function src(){return flows[section][day]}function overview(){saveResume();location.href=`daily-lessons.html?week=1&day=${day}&v=${Date.now()}`}function goHome(){saveResume();location.href='index.html'}function enterSection(nextSection,startAtBeginning){section=clamp(nextSection,0,names.length-1);customIndex=0;customMode=startAtBeginning&&added().length>0;load()}function advance(){saveComplete(section);if(section===names.length-1){clearResume();location.href='index.html';return}enterSection(section+1,true)}function previousActivity(){if(section===0){overview();return}enterSection(section-1,false)}function buttonLooksFinal(btn){return !!btn&&/Done|Finish|Complete|Finish Read Aloud/i.test((btn.textContent||'').trim())}function buttonLooksBoundaryPrev(btn){return !!btn&&(/Day Overview|Previous Activity/i.test((btn.textContent||'').trim())||btn.disabled)}function renderCustom(){const list=added();if(!list.length){customMode=false;loadBuiltIn();return}customIndex=clamp(customIndex,0,list.length-1);const s=list[customIndex];custom.classList.add('show');frame.style.display='none';document.getElementById('customKicker').textContent=`TEACHER ADDED · ${names[section].toUpperCase()}`;document.getElementById('customVisual').textContent=s.visual||'⭐';document.getElementById('customTitle').textContent=s.title||'Teacher Added Screen';document.getElementById('customText').textContent=s.body||'';const prompt=document.getElementById('customPrompt');prompt.textContent=s.prompt||'';prompt.style.display=s.prompt?'block':'none';document.getElementById('customCount').textContent=`Added screen ${customIndex+1} of ${list.length}`;document.getElementById('customNext').textContent=customIndex===list.length-1?'Continue to Lesson →':'Next →';const panel=document.getElementById('teacherPanel');panel.textContent=s.note||'No teacher note for this screen.';panel.classList.remove('show');saveResume()}document.getElementById('customPrev').onclick=()=>{if(customIndex>0){customIndex--;renderCustom()}else previousActivity()};document.getElementById('customNext').onclick=()=>{const list=added();if(customIndex<list.length-1){customIndex++;renderCustom()}else{customMode=false;saveResume();loadBuiltIn()}};document.getElementById('customNote').onclick=()=>document.getElementById('teacherPanel').classList.toggle('show');async function normalizeCommunity(doc,frm,prev){if(section!==0)return;const close=doc.querySelector('.close,#closeBtn');if(close)close.onclick=e=>{e.preventDefault();overview()};if(day!==0)return;const cards=[...doc.querySelectorAll('.card')];if(!cards.length)return;let storeReady=null;function ensureStore(){if(frm.contentWindow.EEAVisualStore)return Promise.resolve();if(storeReady)return storeReady;storeReady=new Promise(resolve=>{const s=doc.createElement('script');s.src='visual-store.js';s.onload=resolve;s.onerror=resolve;doc.head.appendChild(s)});return storeReady}function activeIndex(){const n=cards.findIndex(c=>c.classList.contains('active'));return n<0?0:n}async function applyVisual(){const idx=activeIndex(),card=cards[idx],visual=card&&card.querySelector('.visual');if(!visual)return;visual.style.visibility='hidden';await ensureStore();let cv=visual.querySelector('.eeaCommunityCustomVisual');if(!cv){cv=doc.createElement('img');cv.className='eeaCommunityCustomVisual';cv.alt='Custom Community Meeting visual';Object.assign(cv.style,{display:'none',maxWidth:'100%',maxHeight:'52vh',width:'auto',height:'auto',objectFit:'contain',borderRadius:'24px'});visual.appendChild(cv)}const originals=[...visual.children].filter(x=>x!==cv);let image='';try{const store=frm.contentWindow.EEAVisualStore;if(store){await store.migrate();image=await store.get(`week1-community-${daySlugs[day]}-${idx+1}`)}}catch(e){}if(image){cv.src=image;cv.style.display='block';originals.forEach(x=>x.style.display='none')}else{cv.removeAttribute('src');cv.style.display='none';originals.forEach(x=>x.style.display='')}visual.style.visibility='visible'}if(prev)doc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='prev'&&activeIndex()===0&&added().length){e.preventDefault();e.stopImmediatePropagation();customMode=true;customIndex=added().length-1;renderCustom();return}if(b.id==='prev'||b.id==='next')setTimeout(applyVisual,0)},true);await applyVisual()}function wireFrame(frm){frm.onload=async()=>{try{const doc=frm.contentWindow.document,next=doc.getElementById('next'),prev=doc.getElementById('prev');await normalizeCommunity(doc,frm,prev);const close=doc.querySelector('.close,#closeBtn');if(close)close.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();overview()},true);doc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if((b.id==='next'||b.id==='done')&&buttonLooksFinal(b)){e.preventDefault();e.stopImmediatePropagation();advance();return}if(b.id==='prev'&&buttonLooksBoundaryPrev(b)){e.preventDefault();e.stopImmediatePropagation();if(added().length){customMode=true;customIndex=added().length-1;renderCustom()}else previousActivity()}},true)}catch(e){console.warn('Lesson runner could not inspect section page',e)}}}function loadBuiltIn(){custom.classList.remove('show');frame.style.display='block';customMode=false;saveResume();const s=src(),join=s.includes('?')?'&':'?';frame.src=s+join+`eeaRunner=1&week=1&day=${day}&section=${section}&v=${Date.now()}`;wireFrame(frame)}function load(){renderPath();if(customMode&&added().length)renderCustom();else loadBuiltIn()}document.getElementById('overviewBtn').onclick=overview;document.getElementById('homeBtn').onclick=goHome;document.getElementById('continue').onclick=load;document.getElementById('addScreen').onclick=()=>{saveResume();location.href=`lesson-screen-editor.html?week=1&day=${day}&section=${section}`};document.getElementById('manageScreens').onclick=()=>{saveResume();location.href=`lesson-screen-manager.html?week=1&day=${day}&section=${section}`};window.addEventListener('pagehide',saveResume);const r=resume();if(r&&r.mode==='custom'&&added().length){customMode=true;customIndex=Number(r.customIndex)||0}else if(r&&r.mode==='builtin')customMode=false;else customMode=added().length>0;load()})();</script></body></html>
