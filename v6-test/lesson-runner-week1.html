ction><h3>Edit This Lesson</h3><button class="editBtn" id="manageScreens">✎ Edit Lesson</button><button class="editBtn" id="addScreen">＋ Add Screen</button></section><section><h3>Quick Tools</h3><button onclick="location.href='timer.html'">Timer</button><button onclick="location.href='clean-up.html'">Clean Up Song</button><button onclick="location.href='choose-a-friend.html'">Choose a Friend</button></section></aside></div></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),pd=Number(p.get('day')),ps=Number(p.get('section')),day=Number.isInteger(pd)?clamp(pd,0,4):0;let section=Number.isInteger(ps)?clamp(ps,0,4):0;const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],names=['Community Meeting','Read Aloud','Centers','Storytelling','Closing Circle'],subs=['Start together','Today’s book','Today’s center lesson','Tell our story','Reflect & say goodbye'],icons=['🌞','📖','🧩','✨','🏁'],community=['community-meeting.html','community-meeting-tuesday.html','community-meeting-wednesday.html','community-meeting-thursday.html','community-meeting-friday.html'],flows=[community,days.map(d=>'week1-read-aloud.html?day='+encodeURIComponent(d)),days.map(d=>'centers-week1.html?day='+encodeURIComponent(d)),days.map(d=>'storytelling-week1.html?day='+encodeURIComponent(d)),days.map(d=>'closing-circle-week1.html?day='+encodeURIComponent(d))],RESUME='eea-lesson-resume',ADDED='eea-added-lesson-screens';const $=id=>document.getElementById(id),frame=$('frame'),custom=$('custom'),pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},completeKey=()=>`eea-lesson-complete-${today()}-w1-d${day}`;let customMode=false,customIndex=0,customToken=0;$('dayName').textContent=days[day];localStorage.setItem('eea-daily-week','1');localStorage.setItem('eea-daily-day',String(day));localStorage.setItem('eea-daily-date',today());function data(){try{return JSON.parse(localStorage.getItem(ADDED)||'{}')||{}}catch(e){return{}}}function added(){const a=data()[`w1-d${day}-s${section}`];return Array.isArray(a)?a:[]}function resume(){try{const r=JSON.parse(localStorage.getItem(RESUME)||'null');return r&&r.date===today()&&+r.week===1&&+r.day===day&&+r.section===section?r:null}catch(e){return null}}function saveResume(){localStorage.setItem(RESUME,JSON.stringify({date:today(),week:1,day,section,mode:customMode?'custom':'builtin',customIndex:customMode?customIndex:null}))}function completed(){try{const a=JSON.parse(localStorage.getItem(completeKey())||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function complete(i){const a=completed();if(!a.includes(i)){a.push(i);a.sort((x,y)=>x-y);localStorage.setItem(completeKey(),JSON.stringify(a))}}function renderPath(){const c=completed();$('path').innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===section?'active':''} ${c.includes(i)?'doneStep':''}"><b>${icons[i]} ${n}${c.includes(i)?' ✓':''}</b><span>${subs[i]}</span></button>`).join('');[...$('path').children].forEach(b=>b.onclick=()=>enter(+b.dataset.i,true));$('count').textContent=`${c.length} of ${names.length} complete`;$('continue').textContent=`Continue: ${names[section]} →`}function overview(){saveResume();location.href=`daily-lessons.html?week=1&day=${day}&v=${Date.now()}`}function home(){saveResume();location.href='index.html'}function enter(s,fromStart){section=clamp(s,0,4);customIndex=0;customMode=fromStart&&added().length>0;load()}function advance(){complete(section);if(section===4){localStorage.removeItem(RESUME);location.href='index.html';return}enter(section+1,true)}function previousActivity(){if(section===0){overview();return}enter(section-1,false)}async function renderCustom(){const list=added();if(!list.length){customMode=false;loadBuiltIn();return}customIndex=clamp(customIndex,0,list.length-1);const s=list[customIndex],token=++customToken,box=$('customVisual');custom.classList.add('show');frame.style.display='none';box.style.visibility='hidden';box.innerHTML='';let image='';if(s.imageKey){try{image=await EEAVisualStore.get(s.imageKey)}catch(e){}}if(token!==customToken)return;if(image){const img=document.createElement('img');img.src=image;img.alt=s.title||'Lesson visual';box.appendChild(img)}else box.textContent=s.visual||'⭐';box.style.visibility='visible';$('customKicker').textContent=`TEACHER ADDED · ${names[section].toUpperCase()}`;$('customTitle').textContent=s.title||'Teacher Added Screen';$('customText').textContent=s.body||'';$('customPrompt').textContent=s.prompt||'';$('customPrompt').style.display=s.prompt?'block':'none';$('customCount').textContent=`Added screen ${customIndex+1} of ${list.length}`;$('customNext').textContent=customIndex===list.length-1?'Continue to Lesson →':'Next →';$('teacherPanel').textContent=s.note||'No teacher note for this screen.';$('teacherPanel').classList.remove('show');saveResume()}function loadBuiltIn(){custom.classList.remove('show');frame.style.display='block';customMode=false;saveResume();const src=flows[section][day],join=src.includes('?')?'&':'?';frame.onload=()=>wireFrame();frame.src=src+join+`eeaRunner=1&week=1&day=${day}&section=${section}&v=${Date.now()}`}function looksFinal(b){return /Done|Finish|Complete|Finish Read Aloud/i.test((b&&b.textContent||'').trim())}function boundaryPrev(b){return !!b&&(/Day Overview|Previous Activity/i.test((b.textContent||'').trim())||b.disabled)}function wireFrame(){try{const doc=frame.contentWindow.document;const close=doc.querySelector('.close,#closeBtn,#exit,#backBtn');if(close)close.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();overview()},true);doc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if((b.id==='next'||b.id==='done')&&looksFinal(b)){e.preventDefault();e.stopImmediatePropagation();advance();return}if(b.id==='prev'&&boundaryPrev(b)){e.preventDefault();e.stopImmediatePropagation();if(added().length){customMode=true;customIndex=added().length-1;renderCustom()}else previousActivity()}},true)}catch(e){console.warn('Lesson runner could not inspect section page',e)}}function load(){renderPath();if(customMode&&added().length)renderCustom();else loadBuiltIn()}$('customPrev').onclick=()=>{if(customIndex>0){customIndex--;renderCustom()}else previousActivity()};$('customNext').onclick=()=>{const a=added();if(customIndex<a.length-1){customIndex++;renderCustom()}else{customMode=false;saveResume();loadBuiltIn()}};$('customNote').onclick=()=>$('teacherPanel').classList.toggle('show');$('overviewBtn').onclick=overview;$('homeBtn').onclick=home;$('continue').onclick=load;$('addScreen').onclick=()=>{saveResume();location.href=`lesson-screen-editor.html?week=1&day=${day}&section=${section}`};$('manageScreens').onclick=()=>{saveResume();location.href=`lesson-screen-manager.html?week=1&day=${day}&section=${section}`};window.addEventListener('pagehide',saveResume);const r=resume();if(r&&r.mode==='custom'&&added().length){customMode=true;customIndex=Number(r.customIndex)||0}else if(r&&r.mode==='builtin')customMode=false;else customMode=added().length>0;load()})();</script></body></html>
