<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 1 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f6f1e5}.app{width:100%;height:100%;padding:1.2vh 1.5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.top{height:8.5vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid rgba(89,139,151,.22)}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.1em;font-size:11px}.brand h1{margin:.2vh 0 0;font-size:clamp(28px,2.2vw,43px)}.daytitle{font-weight:900;font-size:clamp(15px,1.1vw,21px)}.topright{display:flex;justify-content:flex-end;gap:.6vw}.pill,.home{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.pill{border-radius:16px;padding:.8vh 1vw}.home{width:48px;height:48px;border-radius:50%;font-size:21px}.dash{height:88vh;display:grid;grid-template-columns:15vw 1fr 12.5vw;gap:.8vw;padding-top:1vh}.side,.tools{border:1.4px solid rgba(89,139,151,.23);border-radius:22px;background:rgba(255,254,249,.9);padding:1.2vh .8vw}.side{display:flex;flex-direction:column}.side h3,.tools h3{margin:.3vh .2vw 1vh;font-size:16px}.count{font-size:11px;color:#789697;font-weight:900;margin:0 .2vw 1vh}.path{display:flex;flex-direction:column;gap:.55vh}.path button{width:100%;text-align:left;border:1px solid rgba(89,130,146,.17);border-radius:15px;background:#fffdf8;color:#245c78;padding:.82vh .7vw;cursor:pointer}.path button b{display:block;font-size:13px}.path button span{display:block;color:#718985;font-size:10.5px;margin-top:.2vh}.path button.active{background:#dcecf5;border-color:#8fbfd8}.path button.doneStep{background:#edf5e8;border-color:#b6d29f}.path button.missing{background:#fff4df;border-color:#e7c78d}.continue{margin-top:auto;border:0;border-radius:15px;padding:1.1vh .5vw;background:#5c9ac5;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.stage{position:relative;border:1.5px solid rgba(89,139,151,.25);border-radius:24px;background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block}.tools section{border:1px solid rgba(89,130,146,.16);border-radius:16px;padding:1vh .7vw;margin-bottom:1vh;background:#fffdf8}.tools button{display:block;width:100%;border:0;border-radius:12px;padding:1vh .4vw;margin:.6vh 0;background:#e7f2f8;color:#245c78;font-weight:900;cursor:pointer}.focus .top,.focus .dash>.side,.focus .dash>.tools{display:none}.focus .app{padding:0}.focus .dash{height:100vh;display:block;padding:0}.focus .stage{width:100%;height:100%;border:0;border-radius:0}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:5vw}.placeholder h2{font-size:clamp(36px,4vw,68px);margin:0 0 2vh}.placeholder p{font-size:clamp(20px,1.5vw,28px);color:#587875;font-weight:800;max-width:700px}.placeholder button{border:0;border-radius:18px;padding:1.1vh 1.6vw;background:#668f99;color:#fff;font-weight:900;font-size:18px;cursor:pointer}.done{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.done.show{display:flex}.done h1{font-size:clamp(42px,4vw,76px);margin:0 0 18px}.done p{font-size:22px;font-weight:800;color:#557876}.done button{border:0;border-radius:18px;padding:14px 22px;background:#668f99;color:#fff;font-weight:900;font-size:18px;cursor:pointer}</style></head><body><main class="app"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Lessons</h1></div><div class="daytitle"><span id="dayName"></span> · Week 1</div><div class="topright"><button class="pill" id="overviewBtn">Day Overview</button><button class="home" onclick="location.href='index.html'">⌂</button></div></header><div class="dash"><aside class="side"><h3>Today’s Lesson Path</h3><div class="count" id="count"></div><div class="path" id="path"></div><button class="continue" id="continue">Continue Teaching</button></aside><section class="stage" id="stage"><iframe id="frame" title="Daily lesson"></iframe></section><aside class="tools"><section><h3>Teacher Materials</h3><div>Week 1 lesson materials</div></section><section><h3>Quick Tools</h3><button onclick="location.href='timer.html'">5-Minute Timer</button><button onclick="location.href='clean-up.html'">Clean Up Song</button><button onclick="location.href='choose-friend.html'">Choose a Friend</button></section></aside></div></main><section class="done" id="done"><div><h1>Today’s Lessons Are Complete!</h1><p>You made it through Week 1.</p><button onclick="location.href='daily-lessons.html'">Back to Daily Lessons</button></div></section><script>(()=>{const p=new URLSearchParams(location.search),day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(4,Number(p.get('section'))||0));const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],names=['Community Meeting','Read Aloud','Centers','Storytelling','Closing Circle'];const community=['community-meeting.html','community-meeting-tuesday.html','community-meeting-wednesday.html','community-meeting-thursday.html','community-meeting-friday.html'];const flows=[community,days.map(d=>'week1-read-aloud.html?day='+encodeURIComponent(d)),Array(5).fill(null),days.map(d=>'storytelling-week1.html?day='+encodeURIComponent(d)),days.map(d=>'closing-circle-week1.html?day='+encodeURIComponent(d))];const frame=document.getElementById('frame'),stage=document.getElementById('stage'),done=document.getElementById('done'),path=document.getElementById('path');document.getElementById('dayName').textContent=days[day];localStorage.setItem('eea-daily-week','1');localStorage.setItem('eea-daily-day',String(day));const key=`eea-complete-w1-d${day}`;function completed(){try{const a=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function saveComplete(i){const a=completed();if(!a.includes(i)){a.push(i);localStorage.setItem(key,JSON.stringify(a))}}function render(){document.body.classList.toggle('focus',section===0||section===1);const c=completed();path.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===section?'active':''} ${c.includes(i)?'doneStep':''} ${i===2?'missing':''}"><b>${['🌞','📖','🧩','✨','🏁'][i]} ${n}${c.includes(i)?' ✓':''}</b><span>${i===2?'Not connected yet':['Start together','Today’s book','','Tell our story','Reflect & say goodbye'][i]}</span></button>`).join('');[...path.children].forEach(b=>b.onclick=()=>{section=Number(b.dataset.i);load()});document.getElementById('count').textContent=`${c.length} of 5 complete`}function src(){return flows[section][day]}function advance(){saveComplete(section);if(section===4){frame.style.display='none';done.classList.add('show');return}section++;load()}function load(){render();done.classList.remove('show');frame.style.display='block';const s=src();if(!s){stage.innerHTML=`<div class="placeholder"><div><h2>Centers</h2><p>Week 1 Centers is not connected yet. I’m leaving this visible on purpose so we can build the correct child-facing center lesson instead of silently skipping it.</p><button id="skipCenter">Continue to Storytelling →</button></div></div>`;document.getElementById('skipCenter').onclick=advance;return}stage.innerHTML='<iframe id="frame" title="Daily lesson"></iframe>';const f=document.getElementById('frame');const join=s.includes('?')?'&':'?';const cacheBust=Date.now();f.src=s+join+'eeaRunner=1&week=1&day='+day+'&section='+section+'&v='+cacheBust;f.onload=()=>{try{const d=f.contentWindow.document,next=d.getElementById('next'),prev=d.getElementById('prev'),doneBtn=d.getElementById('done');if(section===1&&next){d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.id!=='next')return;const side=d.getElementById('side'),stop=d.getElementById('stop');if(!side||!stop||!stop.textContent.trim())return;const visible=side.style.display==='block'||side.classList.contains('show');if(!visible){e.preventDefault();e.stopImmediatePropagation();side.classList.add('show');side.style.display='block';next.textContent='Continue →';return}side.classList.remove('show');side.style.display='none'},true)}if(next){const watcher=()=>{if(/Done|Finish Read Aloud/i.test(next.textContent||'')){next.onclick=e=>{e.preventDefault();advance()}}};watcher();new MutationObserver(watcher).observe(next,{childList:true,subtree:true})}if(doneBtn)doneBtn.onclick=e=>{e.preventDefault();advance()};if(prev&&section>0&&prev.disabled){prev.disabled=false;prev.onclick=e=>{e.preventDefault();section--;load()}}}catch(e){}}}document.getElementById('overviewBtn').onclick=()=>location.href='daily-lessons.html?week=1&day='+day;document.getElementById('continue').onclick=()=>load();load()})();</script></body></html>
