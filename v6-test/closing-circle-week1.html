<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Closing Circle</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2.2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:5vh 5vw;display:grid;grid-template-columns:42% 1fr;gap:5vw;align-items:center}.visual{height:56vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;padding:3vw}.visual-symbol{width:72%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fffdf8;border:1.5px solid #d7e3df;font-size:clamp(90px,9vw,165px);box-shadow:0 8px 22px rgba(54,79,77,.07)}.small{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px)}.content h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.body{font-size:clamp(21px,1.55vw,30px);line-height:1.4;color:#527673;font-weight:900}.prompt{margin-top:2vh;padding:1.5vh 1.4vw;border-radius:19px;background:#e7f0ed;color:#416d61;font-size:clamp(22px,1.6vw,31px);font-weight:900;line-height:1.3}.bottom{height:9vh;display:flex;justify-content:center;align-items:center}.teacher,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.teacher{background:#fffdf8;color:#245c78}.done{position:absolute;right:3.2vw;background:#668f99;color:white;border-color:#668f99;padding:1vh 1.8vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(500px,36vw);background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.45;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · CLOSING CIRCLE</div><h1>Ending Our Day Together</h1></div><div class="actions"><div class="chip" id="chip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="visual"><div class="visual-symbol" id="symbol"></div></div><div class="content"><div class="small" id="small"></div><h2 id="title"></h2><div class="body" id="body"></div><div class="prompt" id="prompt"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label">TEACHER NOTE</div><p id="note"></p></aside></main><script>(()=>{const data={Monday:{symbol:'💬',small:'MONDAY · REFLECT',title:'Tell Lola',body:'Think about one thing you did at school today.',prompt:'What would you tell Lola about your day?',note:'Invite just a few children to share so Closing Circle stays brief.'},Tuesday:{symbol:'🧱',small:'TUESDAY · REMEMBER',title:'What Did You Build?',body:'Think about your time in Blocks today.',prompt:'What did you build?',note:'Connect back to Lola and her friends building a block castle.'},Wednesday:{symbol:'🍳',small:'WEDNESDAY · REMEMBER',title:'Pretend Cooking',body:'Think about Dramatic Play today.',prompt:'What did you pretend to cook or do in the kitchen?',note:'Accept any play experience children want to share.'},Thursday:{symbol:'🤝',small:'THURSDAY · SHARE',title:'Sharing With Friends',body:'Think about a time you shared something today.',prompt:'What did you share with a friend?',note:'Connect to Too Many Mangos and the idea of sharing.'},Friday:{symbol:'❤️',small:'FRIDAY · COMMUNITY',title:'A Caring Classroom',body:'Think about what sharing can do for our classroom.',prompt:'How can sharing help us care for each other?',note:'Keep responses concrete. Help children connect sharing with helping friends feel included and cared for.'}};const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',d=data[day]||data.Monday,target=p.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html',$=id=>document.getElementById(id);$('chip').textContent='WEEK 1 · '+day.toUpperCase();$('symbol').textContent=d.symbol;$('small').textContent=d.small;$('title').textContent=d.title;$('body').textContent=d.body;$('prompt').textContent=d.prompt;$('note').textContent=d.note;$('teacher').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('exit').onclick=$('done').onclick=()=>location.href=target})();</script></body></html>
