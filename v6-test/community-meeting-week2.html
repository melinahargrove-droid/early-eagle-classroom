<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Week 2 Community Meeting</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%);overflow:hidden}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px);line-height:1}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:rgba(214,232,237,.8);color:#386d80;font-weight:900;font-size:clamp(12px,.82vw,16px)}.close{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#174f7d;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(92,136,147,.2);border-radius:34px;background:rgba(255,254,249,.94);box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:rgba(217,234,238,.8);color:#4f7c89;font-weight:900;letter-spacing:.06em;font-size:clamp(11px,.72vw,14px)}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.picture{width:min(36vw,600px);height:min(59vh,560px);object-fit:contain;display:block}.copy{text-align:left}.eyebrow{color:#799597;font-size:clamp(12px,.8vw,15px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px);line-height:1}.copy p{margin:1.4vh 0;color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38;max-width:39vw}.steps{display:grid;gap:1vh;margin-top:1.8vh;max-width:39vw}.step{padding:1vh 1.3vw;border-radius:17px;background:rgba(226,238,236,.72);color:#4f765e;font-size:clamp(17px,1.16vw,23px);font-weight:900}.quote{margin-top:2vh;padding:1.5vh 1.6vw;border-radius:20px;background:#e8f1ed;color:#426f65;font-size:clamp(24px,1.9vw,36px);font-weight:900;line-height:1.25;max-width:39vw}.hello{font-size:clamp(22px,1.55vw,30px);color:#426f65;font-weight:900;margin-top:1.8vh}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:1.4%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.6vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:6%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 12px 30px rgba(44,67,68,.15);display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}.panel strong{color:#315f70}.source{position:absolute;right:3%;bottom:2%;color:#94a39f;font-size:clamp(9px,.62vw,12px);font-weight:800}
</style></head>
<body><main class="page">
<header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel">WEEK 2 · WEDNESDAY</div><button class="close" id="closeBtn">×</button></div></header>
<section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section>
<button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><div class="panel" id="panel"></div><div class="source" id="source"></div>
</main>
<script>(()=>{
const monday=[{label:'MINDFUL PRACTICE',pic:'week 2 child pose.png',eye:'Monday · Mindful Practice',title:'Get Ready',body:'Start on your knees. Sit back gently on your heels.',extra:'<div class="step">Make your body comfortable.</div>'},{label:'CHILD POSE',pic:'week 2 child pose.png',eye:'Monday · Child Pose',title:'Fold Forward',body:'Slowly bring your forehead down toward the floor.',extra:'<div class="steps"><div class="step">Rest your arms alongside your body.</div><div class="step">Take a few slow, deep breaths.</div></div>'},{label:'CHILD POSE',pic:'week 2 child pose.png',eye:'Monday · Child Pose',title:'Breathe & Rest',body:'Stay still for a few breaths, then slowly sit back up.',extra:'<div class="step">Notice how your body feels.</div>'}];
const tuesday=[{label:'CONVERSATION',pic:'week 2 share.png',eye:'Tuesday · Conversation',title:'What Do You Like?',body:'Think about your day at school.',extra:'<div class="quote">What is something you like about being at school?</div>'},{label:'THINK',pic:'week 2 share.png',eye:'Tuesday · Conversation',title:'Think of One Thing',body:'Maybe you like a center, a friend, a book, a song, or something we do together.',extra:'<div class="step">There are lots of good answers.</div>'},{label:'SHARE',pic:'week 2 share.png',eye:'Tuesday · Conversation',title:'Let’s Share',body:'A few friends can tell us what they like about school.',extra:'<div class="step">Listen while each friend shares.</div>'}];
const wednesday=[{label:'NAME MOVEMENTS',pic:'week 2 dance.png',eye:'Wednesday · Name Movements',title:'Stand in Our Circle',body:'Make a big circle with your friends and get ready to move.',extra:'<div class="step">Give everyone space to move safely.</div>'},{label:'YOUR TURN',pic:'week 2 dance.png',eye:'Wednesday · Name Movements',title:'Make a Move!',body:'When it is your turn, greet the group and show us one body movement.',extra:'<div class="hello">“Hello, friends!”</div><div class="steps"><div class="step">Wave · wiggle · jump · turn · shake a foot</div></div>'},{label:'WE COPY',pic:'week 2 dance.png',eye:'Wednesday · Name Movements',title:'We Copy You!',body:'Everyone copies the movement and greets our friend by name.',extra:'<div class="quote">“Hello, _____!”</div>'}];
const thursday=[{label:'EEA EXTENSION',pic:'week 2 circle.png',eye:'Thursday · Find Something in Common',title:'Me Too!',body:'Listen to a school favorite. If you like it too, give a quiet thumbs-up!',extra:'<div class="steps"><div class="step">Blocks? Art? Books? Music? Playground?</div></div>'},{label:'FIND A FRIEND',pic:'week 2 circle.png',eye:'Thursday · Find Something in Common',title:'Find a Friend',body:'Find one friend who likes one of the same things you do at school.',extra:'<div class="quote">“We both like _____!”</div>'},{label:'SHARE',pic:'week 2 circle.png',eye:'Thursday · Find Something in Common',title:'Tell Us!',body:'A few pairs can tell the class what they discovered.',extra:'<div class="step">It is okay if friends like different things, too!</div>'}];
const friday=[{label:'EEA EXTENSION',pic:'week 2 group.png',eye:'Friday · Our Classroom Team',title:'We Belong Here',body:'Look around our circle. Every person here is part of our classroom team.',extra:'<div class="step">We learn · play · help · laugh together.</div>'},{label:'KIND WORDS',pic:'week 2 group.png',eye:'Friday · Our Classroom Team',title:'Pass a Kind Word',body:'Choose a friend and tell them one kind thing.',extra:'<div class="steps"><div class="step">“I like playing with you.”</div><div class="step">“You are a good helper.”</div><div class="step">“You make me smile.”</div></div>'},{label:'CELEBRATE OUR CLASS',pic:'week 2 group.png',eye:'Friday · Our Classroom Team',title:'Eagle Team Cheer!',body:'Finish our week with one big classroom cheer together.',extra:'<div class="quote">“We are a team!”</div>'}];
const allDays=[monday,tuesday,wednesday,thursday,friday];const dayNames=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const params=new URLSearchParams(location.search);const requested=params.get('day');const fromPlan=params.get('from')==='plan';const returnTarget=fromPlan?'daily-lessons-v2.html':'daily-lessons.html';
const cardsBox=document.getElementById('cards'),dots=document.getElementById('dots'),badge=document.getElementById('badge'),prev=document.getElementById('prev'),next=document.getElementById('next'),weekLabel=document.getElementById('weekLabel'),panel=document.getElementById('panel'),source=document.getElementById('source');let day=Math.max(0,dayNames.findIndex(x=>x.toLowerCase()===(requested||'Wednesday').toLowerCase()));let i=0;
function currentCards(){return allDays[day]}function teacherText(){if(day===0)return '<strong>Teacher guidance:</strong> Child Pose is the Week 2 mindful practice. Adapt it for children’s bodies as needed, including seated or belly-down options. <strong>Source:</strong> Focus on Pre-K Unit 1, Week 2 Community Meeting.';if(day===1)return '<strong>Teacher guidance:</strong> Ask, “What is something you like about being at school?” Invite a few children to respond and support different communication methods as needed. <strong>Source:</strong> Focus on Pre-K Unit 1, Week 2 Community Meeting.';if(day===2)return '<strong>Teacher guidance:</strong> In Name Movements, each child greets the group with “Hello, friends!” and a body movement. The class copies the movement and greets that child by name. <strong>Source:</strong> Focus on Pre-K Unit 1, Week 2 Community Meeting.';if(day===3)return '<strong>EEA Thursday extension:</strong> This no-prep activity extends the school-preference conversation into noticing shared interests with classmates. Keep pair-finding relaxed; children do not need a perfect match.';return '<strong>EEA Friday extension:</strong> This short closing activity extends the community focus through belonging and kind peer language. Model a simple kind statement first and help children with words as needed.'}
function render(){const cards=currentCards();cardsBox.innerHTML=cards.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual"><img class="picture" src="${encodeURI(c.pic)}" alt=""></div><div class="copy"><div class="eyebrow">${c.eye}</div><h2>${c.title}</h2>${c.body?`<p>${c.body}</p>`:''}${c.extra||''}</div></article>`).join('');dots.innerHTML=cards.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');badge.textContent=cards[i].label+' · '+(i+1)+' OF '+cards.length;weekLabel.textContent='WEEK 2 · '+dayNames[day].toUpperCase();prev.disabled=i===0;next.textContent=i===cards.length-1?'Done ✓':'Next →';panel.innerHTML=teacherText();source.textContent=day<3?'Focus on Pre-K · Unit 1 · Week 2':'Early Eagle Academy · Week 2 Extension'}
prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{const cards=currentCards();if(i<cards.length-1){i++;render()}else location.href=returnTarget};document.getElementById('closeBtn').onclick=()=>location.href=returnTarget;document.getElementById('teacher').onclick=()=>panel.classList.toggle('open');render();
})();</script></body></html>
