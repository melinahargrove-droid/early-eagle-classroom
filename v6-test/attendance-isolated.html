<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dbe6e6}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72}.stage{position:relative;width:100vw;height:100vh;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.roster{position:absolute;left:3%;top:22.2%;width:30.2%;height:55.2%;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);column-gap:6%;row-gap:.8%}.roster-slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.student{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .16s}.student:hover{transform:scale(1.035)}.student:active{transform:scale(.97)}.photo{width:73%;aspect-ratio:1;border-radius:50%;border:2.5px solid #789fc0;background:#fbfcfb;display:flex;align-items:center;justify-content:center;color:#7b92a4;font-weight:800}.name{width:97%;height:18%;margin-top:4%;border:1.5px solid #7da1bf;border-radius:999px;background:#fffaf0;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,.72vw,15px);font-weight:900;white-space:nowrap}.busgrid{position:absolute;left:37.5%;top:38.7%;width:50%;height:25.2%;z-index:6;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(2,1fr);column-gap:.7%;row-gap:5%}.bus-slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.bus-child{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:1%;text-align:center;cursor:pointer}.bus-photo{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #789fc0;background:#fffaf0;display:flex;align-items:center;justify-content:center;color:#7b92a4;font-weight:800;font-size:clamp(9px,.66vw,13px)}.bus-name{margin-top:2.5%;width:100%;padding:.16em .12em .19em;border:1px solid #7da1bf;border-radius:999px;background:#fffaf0;font-size:clamp(9px,.62vw,12px);font-weight:900;white-space:nowrap;text-align:center}.counter{position:absolute;left:77.2%;top:5.3%;width:17.6%;height:10.8%;z-index:7;display:flex;align-items:center;justify-content:center;font-weight:900}.counter .num{min-width:1.2em;text-align:right;font-size:clamp(28px,2.35vw,48px)}.counter .words{margin-left:.58em;transform:translateX(7%);font-size:clamp(12px,.92vw,19px);line-height:1.02}.reset-hit{position:absolute;right:4.2%;bottom:4%;width:15.3%;height:8.6%;z-index:8;border:0;background:transparent;cursor:pointer}.close-btn{position:absolute;top:2.1%;right:1.8%;width:3.4%;aspect-ratio:1;z-index:20;border:2px solid #789fc0;border-radius:50%;background:#fffaf0;color:#173f72;font-size:clamp(22px,1.8vw,36px);font-weight:700;cursor:pointer}.fly{position:fixed;z-index:9999;pointer-events:none;border-radius:50%;border:3px solid #789fc0;background:#fffaf0;display:flex;align-items:center;justify-content:center;color:#7b92a4;font-weight:900;transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),width .55s,height .55s}
</style></head><body><div class="stage"><button class="close-btn" id="closeBtn" aria-label="Close">×</button><img class="bg" src="assets/attendance-background.png" alt=""><div class="roster" id="roster"></div><div class="busgrid" id="busgrid"></div><div class="counter"><span class="num" id="count">0</span><span class="words">friends<br>here</span></div><button class="reset-hit" id="resetBtn" aria-label="Reset attendance"></button></div><script>
const names=['Addison','Avery','Blake','Carter','Charlie','Cooper','Ellie','Emery','Grayson','Harper','Hudson','Jace','Liam','Mason','Mia','Nora','Olivia','Parker','Riley','Sawyer'];const present=[];const roster=document.getElementById('roster'),busgrid=document.getElementById('busgrid'),count=document.getElementById('count');
function makeRosterCard(id){const e=document.createElement('div');e.className='student';e.dataset.id=id;e.innerHTML=`<div class="photo">Photo</div><div class="name">${names[id]}</div>`;e.onclick=()=>checkIn(id,e);return e}
function makeBusCard(id){const e=document.createElement('div');e.className='bus-child';e.dataset.id=id;e.innerHTML=`<div class="bus-photo">Photo</div><div class="bus-name">${names[id]}</div>`;e.onclick=()=>checkOut(id,e);return e}
function render(hiddenId=null){roster.innerHTML='';for(let id=0;id<20;id++){const slot=document.createElement('div');slot.className='roster-slot';if(!present.includes(id)){const e=makeRosterCard(id);if(id===hiddenId)e.style.visibility='hidden';slot.appendChild(e)}roster.appendChild(slot)}busgrid.innerHTML='';for(let i=0;i<20;i++){const slot=document.createElement('div');slot.className='bus-slot';if(i<present.length){const id=present[i],child=makeBusCard(id);if(id===hiddenId)child.style.visibility='hidden';slot.appendChild(child)}busgrid.appendChild(slot)}count.textContent=present.length;localStorage.setItem('eea-attendance-present',JSON.stringify(present));localStorage.setItem('eea-attendance-count',String(present.length))}
function animate(a,b,done){const f=document.createElement('div');f.className='fly';f.textContent='Photo';Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(f.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'})));setTimeout(()=>{f.remove();done()},575)}
function checkIn(id,src){if(present.includes(id))return;const a=src.getBoundingClientRect();present.push(id);render(id);const t=busgrid.children[present.length-1].querySelector('.bus-child'),b=t.getBoundingClientRect();animate(a,b,()=>t.style.visibility='')}
function checkOut(id,src){const i=present.indexOf(id);if(i<0)return;const a=src.getBoundingClientRect();present.splice(i,1);render(id);const t=roster.children[id].querySelector('.student'),b=t.getBoundingClientRect();animate(a,b,()=>t.style.visibility='')}
document.getElementById('resetBtn').onclick=()=>{present.length=0;render()};document.getElementById('closeBtn').onclick=()=>history.back();try{const saved=JSON.parse(localStorage.getItem('eea-attendance-present')||'[]');saved.forEach(id=>{if(Number.isInteger(id)&&id>=0&&id<20&&!present.includes(id))present.push(id)})}catch(e){}render();
</script></body></html>
