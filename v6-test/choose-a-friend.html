<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EEA Choose a Friend — Basket Layout</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;background:#c9d6d8;color:#123d78}.page{position:relative;width:100vw;height:100vh;overflow:hidden;background:url('./assets/caf-watercolor.webp') center/cover no-repeat}.modal-shell{position:absolute;left:4.2%;right:4.2%;top:4.5%;bottom:4.5%;border:4px solid #527da8;border-radius:38px;box-shadow:0 24px 60px rgba(20,35,50,.28)}.header{position:absolute;left:6%;right:6%;top:7%;height:9%;display:flex;align-items:center;justify-content:center}.header h1{margin:0;font-size:clamp(34px,3vw,58px)}.scene{position:absolute;left:6%;right:6%;top:16%;bottom:7%}.left-scene{position:absolute;left:1%;top:2%;bottom:2%;width:36%}.eddie-wrap{position:absolute;left:-12%;bottom:3%;width:88%;height:112%;z-index:4;pointer-events:none}.eddie-wrap img{width:100%;height:100%;object-fit:contain;object-position:center bottom}.layer{position:absolute;cursor:move;user-select:none;touch-action:none}.layer.selected{outline:3px dashed #ff3b30;outline-offset:3px}.basket-back{left:57.08%;top:30.82%;width:72.07%;height:68.03%;z-index:1}.basket-back img,.basket-front img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.sticks{left:67.35%;top:22.62%;width:58.93%;height:57.05%;z-index:2;overflow:visible}.basket-front{left:59.55%;top:45.41%;width:66.94%;height:64.1%;z-index:3}.mini-stick{position:absolute;left:var(--x);bottom:var(--y);width:var(--w);height:var(--h);border:2.5px solid rgba(118,82,45,.55);border-radius:999px;background:linear-gradient(180deg,#f8deb4,#e5bd84);transform-origin:center bottom;transform:rotate(var(--tilt));pointer-events:none}.panel{position:absolute;right:5.5%;top:18%;z-index:60;width:285px;background:rgba(255,250,242,.97);border:3px solid #527da8;border-radius:20px;padding:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}.panel h2{margin:0 0 8px;font-size:20px}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button{flex:1}.panel button{border:2px solid #527da8;border-radius:9px;background:#fff;color:#123d78;font-weight:800;padding:6px;cursor:pointer}.panel button.active{background:#dcebf7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}.size{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:7px 0}.readout{font:700 11px monospace;background:#eef5fa;border-radius:9px;padding:7px;white-space:pre-wrap;margin:7px 0;max-height:155px;overflow:auto}.copy{width:100%;background:#d9f0d1!important}.hint{font-size:11px;opacity:.7}.close-x{position:absolute;top:22px;right:24px;z-index:70;width:50px;height:50px;border:0;background:transparent;color:#123d78;font-size:38px;font-weight:700;cursor:pointer}</style></head><body><div class="page"><div class="modal-shell"></div><button class="close-x" onclick="location.href='./index.html'">×</button><div class="header"><h1>Choose a Friend</h1></div><div class="scene"><div class="left-scene"><div class="eddie-wrap"><img src="./assets/caf-eddie-ready.webp" alt="Eddie"></div><div class="layer basket-back selected" id="back"><img src="./assets/back%20basket.png" alt="Back basket"></div><div class="layer sticks" id="sticks"></div><div class="layer basket-front" id="front"><img src="./assets/caf-basket.webp" alt="Front basket"></div></div></div><div class="panel"><h2>Basket Controls</h2><div class="tabs"><button data-layer="back" class="active">Back</button><button data-layer="sticks">Sticks</button><button data-layer="front">Front</button></div><div class="grid"><span></span><button data-move="up">↑</button><span></span><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><div class="size"><button data-size="smaller">− Size</button><button data-size="bigger">+ Size</button></div><div class="size"><button data-width="narrower">− Width</button><button data-width="wider">+ Width</button></div><div class="size"><button data-height="shorter">− Height</button><button data-height="taller">+ Height</button></div><div class="readout" id="readout"></div><button class="copy" id="copy">Copy positions</button><div class="hint">Drag any layer, or use the buttons for precise adjustments.</div></div></div><script>const slots=[{x:3,y:15,w:19,h:106,t:-8},{x:12,y:11,w:19,h:115.4,t:4},{x:21,y:16,w:19,h:103.3,t:-4},{x:30,y:10,w:19,h:119.4,t:6},{x:39,y:14,w:19,h:110,t:-6},{x:48,y:11,w:19,h:116.7,t:3},{x:57,y:16,w:19,h:104.6,t:-4},{x:66,y:10,w:19,h:118,t:5},{x:75,y:14,w:19,h:108.7,t:-3},{x:84,y:11,w:19,h:114,t:7},{x:6,y:0,w:20,h:91.2,t:6},{x:15,y:2,w:20,h:99.3,t:-6},{x:24,y:0,w:20,h:89.9,t:4},{x:33,y:3,w:20,h:96.6,t:-4},{x:42,y:0,w:20,h:93.9,t:6},{x:51,y:2,w:20,h:100.6,t:-5},{x:60,y:0,w:20,h:91.2,t:4},{x:69,y:3,w:20,h:97.9,t:-6},{x:78,y:0,w:20,h:92.6,t:5},{x:87,y:2,w:20,h:99.3,t:-4}];const sticks=document.getElementById('sticks');sticks.innerHTML=slots.map(s=>`<div class="mini-stick" style="--x:${s.x}%;--y:${s.y}%;--w:${s.w}%;--h:${s.h}%;--tilt:${s.t}deg"></div>`).join('');const layers={back:document.getElementById('back'),sticks,front:document.getElementById('front')};let current='back';const tabs=[...document.querySelectorAll('[data-layer]')],readout=document.getElementById('readout');function vals(el){const p=el.parentElement,r=el.getBoundingClientRect(),pr=p.getBoundingClientRect();return{left:(r.left-pr.left)/pr.width*100,top:(r.top-pr.top)/pr.height*100,width:r.width/pr.width*100,height:r.height/pr.height*100}}function apply(el,p){el.style.left=p.left+'%';el.style.top=p.top+'%';el.style.width=p.width+'%';el.style.height=p.height+'%'}function snapshot(){const out={};for(const[k,el]of Object.entries(layers)){const p=vals(el);out[k]={left:+p.left.toFixed(2),top:+p.top.toFixed(2),width:+p.width.toFixed(2),height:+p.height.toFixed(2)}}readout.textContent=JSON.stringify(out,null,2);return out}function select(n){current=n;Object.values(layers).forEach(x=>x.classList.remove('selected'));layers[n].classList.add('selected');tabs.forEach(b=>b.classList.toggle('active',b.dataset.layer===n));snapshot()}tabs.forEach(b=>b.onclick=()=>select(b.dataset.layer));document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const p=vals(layers[current]),s=.5;if(b.dataset.move==='up')p.top-=s;if(b.dataset.move==='down')p.top+=s;if(b.dataset.move==='left')p.left-=s;if(b.dataset.move==='right')p.left+=s;apply(layers[current],p);snapshot()});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const p=vals(layers[current]),d=b.dataset.size==='bigger'?1:-1;p.width+=d;p.height+=d;apply(layers[current],p);snapshot()});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{const p=vals(layers[current]),d=b.dataset.width==='wider'?1:-1;p.width+=d;apply(layers[current],p);snapshot()});document.querySelectorAll('[data-height]').forEach(b=>b.onclick=()=>{const p=vals(layers[current]),d=b.dataset.height==='taller'?1:-1;p.height+=d;apply(layers[current],p);snapshot()});for(const el of Object.values(layers)){el.addEventListener('pointerdown',e=>{select(el.id);e.preventDefault();el.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,p=vals(el),pr=el.parentElement.getBoundingClientRect();function move(ev){el.style.left=(p.left+(ev.clientX-sx)/pr.width*100)+'%';el.style.top=(p.top+(ev.clientY-sy)/pr.height*100)+'%';snapshot()}function up(ev){el.releasePointerCapture(ev.pointerId);el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up)}el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})}document.getElementById('copy').onclick=async function(){const text=JSON.stringify(snapshot(),null,2);try{await navigator.clipboard.writeText(text);this.textContent='Copied!';setTimeout(()=>this.textContent='Copy positions',1200)}catch(e){prompt('Copy these values:',text)}};snapshot();</script></body></html>
