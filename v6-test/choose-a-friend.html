<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EEA Choose a Friend — Interaction Preview</title><style> *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden} body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#c9d6d8;color:#123d78} button{font:inherit}.page{ position:relative;width:100vw;height:100vh;overflow:hidden; background-image:url("./assets/caf-watercolor.webp"); background-size:cover; background-position:center; background-repeat:no-repeat } .modal-shell{position:absolute;left:4.2%;right:4.2%;top:4.5%;bottom:4.5%;border:4px solid #527da8;border-radius:38px;background:transparent;box-shadow:0 24px 60px rgba(20,35,50,.28)} .header{position:absolute;left:6%;right:6%;top:7%;height:9%;display:flex;align-items:center;justify-content:center;z-index:2} .home{display:none} h1{margin:0;font-size:clamp(34px,3vw,58px);line-height:1}.remaining{ position:absolute;right:5.5%;top:6.4%; font-weight:900;font-size:clamp(14px,1vw,21px);opacity:.72 } .scene{position:absolute;left:6%;right:6%;top:16%;bottom:7%;z-index:2}.left-scene{position:absolute;left:1%;top:2%;bottom:2%;width:36%} .reveal{position:absolute;left:49%;right:1%;top:8%;bottom:18%;display:flex;align-items:center;justify-content:center} .controls{position:absolute;left:1%;right:2%;bottom:0;height:18%} .reset{position:absolute;right:9.5%;left:auto;bottom:1%;width:9%;height:25%;border:2px solid #527da8;border-radius:18px;background:#fffaf2;color:#123d78;font-weight:900;font-size:clamp(17px,1.2vw,24px);cursor:pointer} .choose{position:absolute;right:4%;bottom:36%;width:20%;height:56%;border:3px solid #315f91;border-radius:24px;background:#fffaf2;color:#123d78;font-weight:900;font-size:clamp(25px,2vw,39px);cursor:pointer;box-shadow:0 7px 16px rgba(35,76,119,.12);transition:transform .15s ease,box-shadow .15s ease} .choose:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 10px 22px rgba(35,76,119,.18)}.choose:active{transform:scale(.97)}.choose:disabled{opacity:.45;cursor:default;transform:none} .eddie-wrap{ position:absolute;left:-12%;bottom:3%;width:88%;height:112%; transform-origin:68% 78%;z-index:3;pointer-events:none;overflow:visible } .eddie-pose{ position:absolute;inset:0;width:100%;height:100%; object-fit:contain;object-position:center bottom; opacity:0;transition:opacity .08s ease; filter:drop-shadow(0 4px 4px rgba(45,65,85,.10)) } .eddie-wrap.ready .pose-ready{opacity:1} .eddie-wrap.reach .pose-reach{ opacity:1; width:132%; height:132%; left:-5%; top:auto; bottom:0; object-fit:contain; object-position:left bottom; max-width:none; max-height:none } .eddie-wrap.celebrate .pose-celebrate{opacity:1} .eddie-wrap.reach{ transform:none; z-index:4 } .eddie-wrap.celebrate{ animation:eddieCelebrate .62s cubic-bezier(.2,.85,.25,1) } @keyframes eddieCelebrate{ 0%{transform:translateY(0) scale(1)} 35%{transform:translateY(-8%) scale(1.045)} 62%{transform:translateY(1%) scale(.99)} 100%{transform:translateY(0) scale(1)} } .basket-area{ position:absolute;left:65.5%;bottom:8.5%; width:44%;height:75%;overflow:visible } .sticks{ position:absolute; left:-1.5%; right:1.5%; top:30%; bottom:5%; z-index:1; overflow:visible; transform:scale(1.1,1.0); transform-origin:50% 100% } .mini-stick{ position:absolute; left:var(--x);bottom:var(--y); width:var(--w);height:var(--h); border:2.5px solid rgba(118,82,45,.55); border-radius:999px; background: linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,0) 20%,rgba(126,86,47,.08) 55%,rgba(255,255,255,.18) 82%,rgba(255,255,255,0)), repeating-linear-gradient(90deg,rgba(130,88,48,.055) 0 1px,transparent 1px 5px), linear-gradient(180deg,#f8deb4 0%,#eecb95 48%,#e5bd84 100%); transform-origin:center bottom; transform:rotate(var(--tilt)); box-shadow:0 2px 5px rgba(90,60,30,.12),inset 0 0 0 1px rgba(255,255,255,.22); overflow:hidden } .mini-stick:before{ content:"";position:absolute;left:16%;right:16%;top:8%;height:15%; border-radius:50%;background:rgba(255,255,255,.22);filter:blur(.4px) } .mini-stick:after{ content:"";position:absolute;left:19%;right:19%;bottom:10%;height:3%; border-radius:50%;background:rgba(116,76,38,.10) } .mini-stick.wiggle{animation:wiggle .48s ease-in-out 2} @keyframes wiggle{0%,100%{transform:rotate(var(--tilt)) translateY(0)}25%{transform:rotate(calc(var(--tilt) - 6deg)) translateY(-5%)}75%{transform:rotate(calc(var(--tilt) + 6deg)) translateY(-5%)}} .big-stick{ position:absolute; width:88%; height:31%; display:flex; align-items:center; justify-content:center; text-align:center; font-size:clamp(37px,3.4vw,66px); font-weight:900; color:#123d78; opacity:0; transform:scale(.9); background-image:url("./assets/caf-large-stick.webp"); background-size:100% 100%; background-repeat:no-repeat; background-position:center; border:0; box-shadow:none; } .big-stick.show{opacity:1;animation:land .55s cubic-bezier(.2,.8,.2,1)}.big-stick.done{opacity:1;width:74%;height:28%;background:#fffaf2;border-color:#527da8;font-size:clamp(31px,2.8vw,54px)} @keyframes land{0%{transform:scale(.84) translateY(-12%)}55%{transform:scale(1.07) translateY(3%)}75%{transform:scale(.97)}100%{transform:scale(1)}} .flying-stick{position:fixed;z-index:9999;border:3px solid rgba(118,82,45,.55);border-radius:999px; background: linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,0) 20%,rgba(126,86,47,.08) 55%,rgba(255,255,255,.18) 82%,rgba(255,255,255,0)), repeating-linear-gradient(90deg,rgba(130,88,48,.045) 0 1px,transparent 1px 5px), linear-gradient(180deg,#f8deb4 0%,#eecb95 48%,#e5bd84 100%);pointer-events:none;transform-origin:center center;box-shadow:0 13px 28px rgba(75,52,32,.18);transition:left .7s cubic-bezier(.22,.75,.2,1),top .7s cubic-bezier(.22,.75,.2,1),width .7s cubic-bezier(.22,.75,.2,1),height .7s cubic-bezier(.22,.75,.2,1),transform .7s cubic-bezier(.22,.75,.2,1)} .sparkles{position:absolute;inset:0;pointer-events:none}.spark{position:absolute;font-size:clamp(20px,1.8vw,34px);opacity:0;animation:spark .75s ease forwards} @keyframes spark{0%{opacity:0;transform:scale(.4) translateY(10px)}35%{opacity:1}100%{opacity:0;transform:scale(1.3) translateY(-36px)}} .note{position:absolute;left:50%;bottom:.4%;transform:translateX(-50%);font-size:12px;font-weight:700;opacity:.45;white-space:nowrap} .skip{ position:absolute;right:2.5%;top:2%;width:13%;height:8%; border:2px solid #527da8;border-radius:17px;background:#fffaf2;color:#123d78; font-size:clamp(15px,1.05vw,21px);font-weight:900;cursor:pointer; opacity:0;pointer-events:none;transform:translateY(-5px); transition:opacity .18s ease,transform .18s ease } .skip.show{opacity:1;pointer-events:auto;transform:translateY(0)} .skip:hover{transform:translateY(-2px) scale(1.015)} .skip:active{transform:scale(.97)} .skip:disabled{opacity:.4;pointer-events:none} .production-basket{ position:absolute; left:-32.5%; bottom:-9%; width:165%; height:auto; z-index:5; pointer-events:none } .production-basket img{ display:block; width:100%; height:auto; } .close-x{ position:absolute;top:22px;right:24px;z-index:50; width:50px;height:50px;border:0;background:transparent; color:#123d78;font-size:38px;font-weight:700;line-height:1; cursor:pointer;display:flex;align-items:center;justify-content:center; } .close-x:hover{transform:scale(1.06)} </style></head><body><div class="page"><div class="modal-shell"><button class="close-x" aria-label="Close" onclick="location.href='./index.html'">×</button></div><div class="header"><button class="home" onclick="location.href='./index.html'">Home</button><h1>Choose a Friend</h1><div class="remaining"><span id="remaining">20</span> sticks left</div></div><div class="scene"><button class="skip" id="skipBtn">Skip</button><div class="left-scene"><div class="eddie-wrap ready" id="eddie"><img class="eddie-pose pose-ready" src="./assets/caf-eddie-ready.webp" alt="Eddie ready"><img class="eddie-pose pose-reach" src="./assets/caf-eddie-reach.webp" alt="Eddie reaching"><img class="eddie-pose pose-celebrate" src="./assets/caf-eddie-celebrate.webp" alt="Eddie celebrating"></div><div class="basket-area"><div class="sticks" id="sticks"></div><div class="production-basket"><img src="./assets/caf-basket.webp" alt="Blue watercolor basket"></div></div></div><div class="reveal"><div class="big-stick" id="bigStick"></div><div class="sparkles" id="sparkles"></div></div><div class="controls"><button class="reset" id="resetBtn">Reset</button><button class="choose" id="chooseBtn">Choose</button></div></div></div><script> const names=['Addison','Avery','Blake','Carter','Charlie','Cooper','Ellie','Emery','Grayson','Harper','Hudson','Jace','Liam','Mason','Mia','Nora','Olivia','Parker','Riley','Sawyer']; function shuffledIds(){const a=names.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a} let queue=shuffledIds(),currentId=null,busy=false; const slots=[ {x:3,y:15,w:19,h:106.0,t:-8},{x:12,y:11,w:19,h:115.4,t:4},{x:21,y:16,w:19,h:103.3,t:-4},{x:30,y:10,w:19,h:119.4,t:6},{x:39,y:14,w:19,h:110.0,t:-6}, {x:48,y:11,w:19,h:116.7,t:3},{x:57,y:16,w:19,h:104.6,t:-4},{x:66,y:10,w:19,h:118.0,t:5},{x:75,y:14,w:19,h:108.7,t:-3},{x:84,y:11,w:19,h:114.0,t:7}, {x:6,y:0,w:20,h:91.2,t:6},{x:15,y:2,w:20,h:99.3,t:-6},{x:24,y:0,w:20,h:89.9,t:4},{x:33,y:3,w:20,h:96.6,t:-4},{x:42,y:0,w:20,h:93.9,t:6}, {x:51,y:2,w:20,h:100.6,t:-5},{x:60,y:0,w:20,h:91.2,t:4},{x:69,y:3,w:20,h:97.9,t:-6},{x:78,y:0,w:20,h:92.6,t:5},{x:87,y:2,w:20,h:99.3,t:-4} ]; const sticks=document.getElementById('sticks'),remaining=document.getElementById('remaining'),big=document.getElementById('bigStick'),eddie=document.getElementById('eddie'),choose=document.getElementById('chooseBtn'),reset=document.getElementById('resetBtn'),skip=document.getElementById('skipBtn'),sparkles=document.getElementById('sparkles'); function renderSticks(){ const available=new Set(queue); sticks.innerHTML=names.map((_,id)=>{ const s=slots[id]; const style=`--x:${s.x}%;--y:${s.y}%;--w:${s.w}%;--h:${s.h}%;--tilt:${s.t}deg`; return available.has(id) ? `<div class="mini-stick" data-id="${id}" style="${style}"></div>` : `<div class="mini-stick empty" data-id="${id}" style="${style};visibility:hidden"></div>`; }).join(''); remaining.textContent=queue.length+(currentId!==null?1:0); choose.disabled=busy||(queue.length===0&&currentId===null); skip.classList.toggle('show',currentId!==null&&!busy); skip.disabled=busy||currentId===null } function stars(){sparkles.innerHTML='';['✦','✧','✦','✧','✦'].forEach((s,i)=>{const e=document.createElement('span');e.className='spark';e.textContent=s;e.style.left=(27+i*12)+'%';e.style.top=(38+(i%2)*13)+'%';e.style.animationDelay=(i*.07)+'s';sparkles.appendChild(e)})} function chooseFriend(){ if(busy||!queue.length||currentId!==null)return; busy=true;choose.disabled=true;skip.classList.remove('show'); const id=queue.shift();currentId=id; const source=sticks.querySelector(`.mini-stick[data-id="${id}"]`); source.classList.add('wiggle');eddie.classList.remove('ready','celebrate');eddie.classList.add('reach'); setTimeout(()=>{ eddie.classList.remove('reach');eddie.classList.add('ready'); const r=source.getBoundingClientRect(),fly=document.createElement('div'); fly.className='flying-stick'; Object.assign(fly.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',transform:'rotate(-2deg)'}); document.body.appendChild(fly);source.style.visibility='hidden'; const target=big.getBoundingClientRect(); requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(fly.style,{ left:(target.left+target.width*.06)+'px',top:(target.top+target.height*.19)+'px', width:(target.width*.88)+'px',height:(target.height*.62)+'px',transform:'rotate(90deg)' }))); setTimeout(()=>{ fly.remove();renderSticks(); big.textContent=names[id];big.style.opacity='';big.classList.add('show'); eddie.classList.remove('reach','ready');eddie.classList.add('celebrate');stars(); setTimeout(()=>{eddie.classList.remove('celebrate');eddie.classList.add('ready')},650); busy=false;skip.classList.add('show');skip.disabled=false; choose.disabled=false; },720) },380) } function skipFriend(){ if(busy||currentId===null)return; busy=true;skip.disabled=true;choose.disabled=true; const id=currentId; const start=big.getBoundingClientRect(); queue.push(id);currentId=null;renderSticks(); const target=sticks.querySelector(`.mini-stick[data-id="${id}"]`); target.style.visibility='hidden'; const end=target.getBoundingClientRect(); const fly=document.createElement('div');fly.className='flying-stick'; fly.textContent=names[id]; Object.assign(fly.style,{ left:(start.left+start.width*.06)+'px',top:(start.top+start.height*.19)+'px', width:(start.width*.88)+'px',height:(start.height*.62)+'px', transform:'rotate(90deg)',display:'flex',alignItems:'center',justifyContent:'center', fontWeight:'900',fontSize:'clamp(20px,2vw,38px)',color:'#123d78' }); document.body.appendChild(fly); big.classList.remove('show','done');big.style.opacity='0';big.textContent=''; eddie.classList.remove('ready','celebrate');eddie.classList.add('reach'); requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(fly.style,{ left:end.left+'px',top:end.top+'px',width:end.width+'px',height:end.height+'px',transform:'rotate(-2deg)' }))); setTimeout(()=>{ fly.remove();target.style.visibility='';eddie.classList.remove('reach');eddie.classList.add('ready'); busy=false;renderSticks() },740) } function finishTurnAndChooseAgain(){ if(currentId===null)return; currentId=null; big.classList.remove('show','done');big.style.opacity='0';big.textContent=''; renderSticks(); if(queue.length===0){ big.textContent='Everyone had a turn!';big.style.opacity='';big.classList.add('done'); eddie.classList.add('celebrate');stars();setTimeout(()=>eddie.classList.remove('celebrate'),700) } } function resetAll(){ if(busy)return; queue=shuffledIds();currentId=null; big.classList.remove('show','done');big.style.opacity='0';big.textContent=''; eddie.classList.remove('reach','celebrate');eddie.classList.add('ready');skip.classList.remove('show');renderSticks() } choose.addEventListener('click',()=>{ if(currentId!==null)finishTurnAndChooseAgain(); chooseFriend() }); skip.addEventListener('click',skipFriend); reset.addEventListener('click',resetAll); renderSticks(); </script></body></html>
