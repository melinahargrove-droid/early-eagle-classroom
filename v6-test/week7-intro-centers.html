t-transform:uppercase;font-size:clamp(12px,.82vw,16px)}.copy h2{margin:1vh 0 .5vh;color:#174f7d;font-size:clamp(44px,4vw,76px);line-height:1}.centername{color:#527678;font-size:clamp(21px,1.4vw,28px);font-weight:900;margin-bottom:2vh}.prompt{font-size:clamp(25px,1.75vw,34px);line-height:1.3;color:#496d70;font-weight:900;max-width:38vw}.cue{margin-top:2vh;padding:1.4vh 1.5vw;border-radius:20px;background:#e7f1ed;color:#426f65;font-size:clamp(23px,1.65vw,32px);font-weight:900;line-height:1.25;max-width:38vw}.cue strong{color:#174f7d}.teacher{position:absolute;left:50%;bottom:2.1%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.62vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.done{position:absolute;right:8.5%;bottom:2.1%;border:0;border-radius:18px;background:#668f99;color:#fff;padding:1vh 1.5vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.panel{position:absolute;z-index:10;right:7%;top:14%;width:min(500px,33vw);max-height:72vh;overflow:auto;padding:2vh 1.5vw;border-radius:24px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 18px 38px rgba(44,67,68,.18);display:none}.panel.open{display:block}.panel .label{color:#789697;font-weight:900;font-size:11px;letter-spacing:.08em}.panel h3{margin:.6vh 0 1vh;color:#315f70;font-size:clamp(21px,1.45vw,29px)}.panel p{color:#58716f;font-weight:700;line-height:1.45;font-size:clamp(13px,.9vw,17px)}.panel .vocab{padding:1vh .8vw;border-radius:14px;background:rgba(226,238,236,.65);font-weight:800}.x{float:right;border:0;background:transparent;color:#315f70;font-size:22px;font-weight:900;cursor:pointer}@media(max-width:900px){.stage{grid-template-columns:1fr;top:11%;bottom:12%;padding:3%}.visual{height:42%}.piccard{width:80vw;height:34vh}.copy{text-align:center}.prompt,.cue{max-width:none}.done{right:4%}.teacher{left:28%}}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 7 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script>(()=>{const all={Monday:[{title:'Post Office 1',sub:'Dramatic Play',kicker:'NEW LESSON',img:'assets/dramatic-play.webp',materials:'A Letter to Amy · The Thank You Letter · children’s letters/messages · post office images · sign paper · writing tools · envelopes · rubber stamps/stamp sheet · glue · cash register/play money · letter-organizing containers',vocab:'communicate · envelope · letter · mail · stamp',steps:[{title:'Letters Help Us Communicate',img:'assets/focus-3s/unit-1/week-7/centers/post-office-letters-communicate.png',prompt:'Peter and Grace write letters to friends.',cue:'Letters are written or drawn messages.',script:'Show pages from A Letter to Amy and The Thank You Letter. Explain that letters help us communicate, or share ideas with others.'},{title:'What Happens to a Letter?',img:'assets/focus-3s/unit-1/week-7/centers/post-office-mail-a-letter.png',prompt:'Sometimes we mail a letter at a post office.',cue:'Mail means sending a letter/card/package to another person.',script:'Connect to children’s messages from Writing & Drawing. Explain that one way to send them is to mail them at a post office. Ask children to put a hand on their head if they have visited one; invite a few experiences.'},{title:'Notice Post Offices',img:'assets/focus-3s/unit-1/week-7/centers/post-office-notice-buildings.png',prompt:'What do you notice?',cue:'Look at real post office images.',script:'Show images of different post offices and invite 1–2 observations.'},{title:'Open Our Post Office',img:'assets/focus-3s/unit-1/week-7/centers/post-office-open-our-center.png',prompt:'Dramatic Play is becoming a post office.',cue:'Children can help sort, organize, make mailboxes, and create the sign.',script:'Show and name some materials and explain that children can help create the Post Office.'},{title:'Prepare & Mail a Letter',img:'assets/focus-3s/unit-1/week-7/centers/post-office-prepare-mail-letter.png',prompt:'Fold → envelope → name/address → stamp → mail',cue:'Model the process.',script:'Model folding a letter/card, putting it in an envelope, addressing it with a name, purchasing/adding a stamp, and dropping it at the post office.'},{title:'Deliver the Mail',prompt:'A mail carrier takes it to the correct person.',cue:'How will the carrier know where it goes?',script:'Explain/model the mail carrier role and delivering mail to the intended person or cubby.',img:'assets/focus-3s/unit-1/week-7/centers/post-office-deliver-mail.png'}],teacherNote:'Focus explicitly says the Post Office may be delayed or skipped if children are still deeply engaged in or need more time with the Supermarket/Pizza Shop. Base the transition on children’s interests.'},{title:'Making Musical Instruments 1',sub:'Science & Engineering',kicker:'NEW LESSON',img:'assets/science.webp',materials:'Drum City · cups · small boxes · beads · rubber bands · paper clips · pom-poms · craft sticks · string · tape · cardboard tubes · optional shaker/guitar visual',vocab:'sound · volume',steps:[{title:'Sounds From Everyday Materials',img:'assets/focus-3s/unit-1/week-7/centers/musical-instruments-everyday-materials.png',prompt:'What did children use to make music in Drum City?',cue:'Buckets · cans · bins · other objects',script:'Show Drum City pages where children drum on different objects. Remind children that sound is something people or animals can hear with their ears.'},{title:'We Will Make Instruments',prompt:'What could you create with these materials?',cue:'Cup · box · rubber bands and more',script:'Explain that children will make their own musical instruments. Show a box, cup, and rubber bands and collect ideas.'},{title:'Make a Rubber-Band Instrument',prompt:'Pluck the band like a guitar.',cue:'What sound do you hear?',script:'Place a rubber band around a cup and pluck it. Ask children what sound they hear.'},{title:'Explore Volume',prompt:'Is the sound loud or quiet?',cue:'Volume is the amount of sound.',script:'Introduce volume and ask how the rubber-band instrument could be made louder.'},{title:'Make a Shaker',prompt:'Beads + box = shaker.',cue:'How could its volume change?',script:'Put beads inside a box, close it, and shake. Ask what sound it makes and how children could make it louder or quieter.'},{title:'Plan Your Instrument',prompt:'What kind of instrument will you create?',cue:'Choose materials and think about the sound you want.',script:'Invite children to share ideas for instruments they may create during Science & Engineering.'}]}],Tuesday:[{title:'Messages to Friends 1',sub:'Writing & Drawing',kicker:'NEW LESSON',img:'assets/writing.webp',materials:'The Thank You Letter pp.11–12, 27–28 · varied writing/drawing tools · white paper/folded cards/note cards/lined paper · envelopes · stamp sheet · home-language greetings · photo/name cards · preprinted name stickers',vocab:'envelope · letter · message · note · stamp',steps:[{title:'Grace Sends Messages',prompt:'How might Grace’s friends feel receiving her letters?',cue:'Look at thank-you letters and love notes.',script:'Show Grace’s thank-you letters and love notes. Ask how her friends might feel receiving a thank-you letter and how Grace might feel seeing the love notes. Invite 1–2 responses to each.'},{title:'What Do Messages Look Like?',prompt:'What do you notice?',cue:'Words · pictures · drawings',script:'Look closely at the different notes and letters. Draw attention to the words and drawings. Explain that messages can use words, pictures, and drawings to share ideas.'},{title:'Write Your Own Message',prompt:'What kind of message feels right to you?',cue:'Thank-you note · love note · another message',script:'Invite children to write messages like Grace. Offer thank-you/love notes as possibilities, not requirements. Children may choose another kind of message that feels good to them.'},{title:'Who Is It For?',prompt:'Use our name cards if you want help with a friend’s name.',cue:'An adult can help write your words too.',script:'Show name cards and explain that children can use them to write a recipient’s name. Offer adult support with words as needed.'},{title:'Mail It',prompt:'Envelope → stamp → Post Office',cue:'Send the message through Dramatic Play.',script:'Show envelopes and stamps. Explain that messages can be put into envelopes, stamped, and mailed at the Post Office.'}],teacherNote:'Focus explicitly notes that not all cultures express gratitude by saying “thank you,” and children should not be required to write thank-you or love notes. Welcome other forms of gratitude and other personally meaningful messages. Audio/video messages and simple marks on paper are also valid communication.'},{title:'Building with Boxes 1',sub:'Blocks',kicker:'NEW LESSON',img:'assets/blocks.webp',materials:'Meeting Mimi · cardboard boxes of varied sizes · tape · decorating/labeling materials · adult-only sharp cutting tools · chart paper/marker · Simple Box Building resource',vocab:'ability · assemble · decorate · reach',steps:[{title:'Remember Mimi’s Rocket',prompt:'How did the children use their abilities to build?',cue:'Mimi reached high to add the top.',script:'Show/connect to Meeting Mimi. Explain ability as something a person can do and model reaching up high like Mimi.'},{title:'Build With Cardboard Boxes',prompt:'What should we build?',cue:'Rocketship · tower · building · your idea',script:'Explain that children can cooperate and build with strong, thick cardboard boxes. Invite ideas and record them on chart paper.'},{title:'Decorate the Boxes',prompt:'How could we make our creation look the way we imagine?',cue:'Markers · paint · tape · stickers/labels',script:'Explain decorate as adding things to make something look nicer. Show available decorating/labeling materials.'},{title:'Assemble the Structure',prompt:'How can we put the boxes together?',cue:'Assemble means put together.',script:'Introduce assemble and explain/model using tape to put boxes together. Adults handle any sharp cutting tools.'},{title:'Build Together',prompt:'How can friends cooperate on one creation?',cue:'Hold · tape · decorate · label · add parts',script:'Invite children to think about different ways friends can contribute to a shared box structure.'}]}],Wednesday:[{title:'Storytelling with Props 3',sub:'Library & Listening',kicker:'CONTINUED LESSON',img:'assets/reading.webp',materials:'new books including The Thank You Letter and A Letter to Amy · character puppets/props for added books',vocab:'character · retell',steps:[{title:'Remember Our Retellings',prompt:'What stories have we retold with props?',cue:'Share examples from last week.',script:'Share a few examples of children retelling stories or invite 1–2 children to describe their Storytelling with Props experiences.'},{title:'Retell Again',prompt:'Use books and puppets to tell a story again.',cue:'Retell means tell a story again.',script:'Explain that children will continue using books and puppets to retell stories.'},{title:'Change the Story',prompt:'What could you change?',cue:'Characters · events · ending',script:'Introduce the new idea that children can retell a slightly different version from the author by changing characters, events, or the ending.'},{title:'Teacher Models a New Version',prompt:'What if Little Red Hen made cookies instead of pizza?',cue:'Keep parts of the story—but change something.',script:'Use the curriculum model: retell The Little Red Hen Makes a Pizza as The Little Red Hen Makes Cookies. Hen needs a baking pan, flour, sugar, and help mixing ingredients and rolling dough.'}]},{title:'Whole Body Self-Portraits 1',sub:'Art Studio',kicker:'NEW MULTI-DAY PROJECT',img:'assets/art.webp',materials:'multicultural tempera paints · brushes · mixing trays · child-height butcher paper · pencils · black permanent marker for adult tracing · mirrors · smocks · self-portrait steps visual · artist self-portrait inspiration',vocab:'choose · self-portrait · showcase · trace',steps:[{title:'A BIG Art Project',prompt:'We are making whole-body self-portraits!',cue:'A self-portrait is a picture you make of yourself.',script:'Introduce the new multi-day project. Explain portrait and self-portrait and show the large paper.'},{title:'Trace the Body',prompt:'A teacher can draw around your body.',cue:'Trace means draw around something.',script:'Explain/model tracing around an arm or hand. Tell children a teacher will carefully trace their body outline on the large paper.'},{title:'Choose How to Create Yourself',prompt:'How do YOU want your portrait to look?',cue:'Realistic colors or another style that feels right.',script:'Explain that children may look in a mirror and mix colors like their skin, hair, and eyes—or decorate their portrait another way that feels good to them.'},{title:'Look Closely in a Mirror',prompt:'What do you notice about yourself?',cue:'Hair · eyes · skin · clothing · details',script:'Model looking in a mirror. Support children in noticing their own features without prescribing how they must represent them.'},{title:'This Takes Many Days',prompt:'Work today, store it safely, and add more later.',cue:'Only a few children may work at one time.',script:'Explain that these large portraits take many days. When a child finishes for the day, the portrait goes somewhere safe until their next turn.'},{title:'Our Showcase',prompt:'When we finish, we will show our work!',cue:'A showcase is a special event to share what we learned and created.',script:'Explain that completed portraits will be part of a showcase and families will be invited to see them.'}],teacherNote:'Body tracing is optional. Focus says children can choose not to be traced if they are uncomfortable. Trace respectfully with pencil first, then adult may go over the outline in permanent marker. Support all self-expression choices—including non-realistic colors. If a child wants realistic skin color, help mix/match shades without implying that realism is required.'}],Thursday:[{title:'Revisit Post Office',sub:'Dramatic Play',kicker:'REVISIT',img:'assets/dramatic-play.webp',prompt:'Return to our Post Office.',cue:'Prepare, stamp, mail, sort, and deliver messages.',materials:'Original Post Office 1 materials and guidance are available through Review Original Introduction.',vocab:'communicate · envelope · letter · mail · stamp',revisit:{day:'Monday',item:0}},{title:'Revisit Messages to Friends',sub:'Writing & Drawing',kicker:'REVISIT',img:'assets/writing.webp',prompt:'Return to creating messages for people who matter to you.',cue:'Words, pictures, drawings, marks, audio/video, or another meaningful form of communication.',materials:'Original Messages to Friends 1 materials and guidance are available through Review Original Introduction.',vocab:'envelope · letter · message · note · stamp',revisit:{day:'Tuesday',item:0}}],Friday:[{title:'Revisit Building with Boxes',sub:'Blocks',kicker:'REVISIT',img:'assets/blocks.webp',prompt:'Return to our collaborative box structures.',cue:'Plan, assemble, decorate, label, and build together.',materials:'Original Building with Boxes 1 materials and guidance are available through Review Original Introduction.',vocab:'ability · assemble · decorate · reach',revisit:{day:'Tuesday',item:1}},{title:'Revisit Whole Body Self-Portraits',sub:'Art Studio',kicker:'REVISIT · MULTI-DAY PROJECT',img:'assets/art.webp',prompt:'Continue your whole-body self-portrait.',cue:'Add details in the way that feels right to you.',materials:'Original Whole Body Self-Portraits 1 materials and guidance are available through Review Original Introduction.',vocab:'choose · self-portrait · showcase · trace',revisit:{day:'Wednesday',item:1}}]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday,runner=params.get('eeaRunner')==='1';let i=Math.max(0,Math.min(items.length-1,Number(params.get('item'))||0)),step=Math.max(0,Number(params.get('step'))||0),visualToken=0;const slot=()=>`week7-centers-${dayName.toLowerCase()}-${i}`+(items[i]?.steps?`-step-${step}`:'');async function applyVisual(d){const token=++visualToken;let src='';try{await EEAVisualStore.migrate();src=await EEAVisualStore.get(slot())}catch(e){}if(token!==visualToken)return;$('pic').src=src||d.steps?.[step]?.img||d.img;$('restoreVisual').style.display=src?'inline-block':'none'}function render(){const d=items[i],s=d.steps?.[step];$('pic').src=d.steps?.[step]?.img||d.img;applyVisual(d);$('title').textContent=s?.title||d.title;$('sub').textContent=d.sub;$('kicker').textContent=d.kicker+(d.steps?` · STEP ${step+1}/${d.steps.length}`:'');$('prompt').textContent=s?.prompt||d.prompt;$('cue').textContent=s?.cue||d.cue;$('noteTitle').textContent=s?.title||d.title;$('notes').textContent=(s?.script||'')+(d.teacherNote?'\n\n'+d.teacherNote:'')||(d.revisit?'This is a Weekly Plan revisit, not a separate Focus on 3s lesson. Use Review Original Introduction if the group needs the full teaching sequence.':'');$('materials').textContent=d.materials;$('vocab').textContent=d.vocab;$('week').textContent='FOCUS ON 3s · WEEK 7 · '+dayName.toUpperCase();$('review').style.display=d.revisit?'inline-block':'none';$('doneBtn').textContent=d.steps&&step<d.steps.length-1?'Next Step →':i<items.length-1?'Next Center →':'Done ✓';$('panel').classList.remove('open')}function back(){location.href='daily-lessons.html?week=7&day='+Math.max(0,['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(dayName))}$('back').onclick=back;$('doneBtn').onclick=()=>{const d=items[i];if(d.steps&&step<d.steps.length-1){step++;render()}else if(i<items.length-1){i++;step=0;render()}else if(!runner)back()};$('teacherBtn').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('review').onclick=()=>{const d=items[i];if(d.revisit)location.href='week7-intro-centers.html?day='+d.revisit.day+'&item='+d.revisit.item+'&review=1'};$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);q.set('item',String(i));q.set('step',String(step));const backUrl='week7-intro-centers.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(backUrl)};$('restoreVisual').onclick=async()=>{try{await EEAVisualStore.remove(slot())}catch(e){}applyVisual(items[i])};render()})();</script></body></html>
