<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Intro to Centers</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{min-height:100vh;padding:22px}.head,.card{max-width:1200px;margin:auto}.head h1{margin:0;color:#165487}.card{margin-top:18px;background:#fffdf8;border:1px solid #c9dadd;border-radius:26px;padding:26px}.tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697}.card h2{font-size:34px;margin:5px 0;color:#165487}.card h3{color:#416d61}.card p{font-size:18px;line-height:1.5;font-weight:750;color:#55747b}.box{background:#e7f0ed;border-radius:16px;padding:14px;margin:12px 0}.back{background:#668f99;color:white;border:0;border-radius:999px;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><div class="head"><div class="tag">EARLY EAGLE ACADEMY · WEEK 7</div><h1>Intro to Centers</h1></div><section class="card"><div class="tag" id="day"></div><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></section></main><script>const n=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'Writing & Drawing · Family Pictures',html:`<p>Use illustrations from familiar books to notice the different families represented. Explain that children can draw their own families.</p><div class="box"><b>Invite:</b> Who is someone in your family?</div><p>Affirm the relationships children identify, including people they do or do not live with, friends, pets, and other people or companions they consider family.</p>`},Tuesday:{title:'Art Easel + Blocks',html:`<h3>Art Easel · Painting Inspired by Goodbye Summer, Hello Autumn</h3><p>Revisit selected illustrations and notice their colors. Explain that artists can be inspired by the world and by other artists. Invite children to mix colors and paint something inspired by the book or by another idea.</p><h3>Blocks · Building Furniture</h3><p>Look at images of furniture from read alouds, name the furniture, and discuss its function. Invite children to use unit blocks and Beautiful Stuff to build furniture.</p>`},Wednesday:{title:'Art Studio + Science & Engineering',html:`<h3>Art Studio · Representing Hair</h3><p>Connect to <i>Hair Love</i>. Introduce Beautiful Stuff selected for representing different kinds of hair. Model choosing and arranging materials for a hair self-portrait.</p><h3>Science & Engineering · Observing Ourselves</h3><p>Introduce the biological anthropologist image, five senses visual, mirrors, magnifiers, eye droppers, and drawing tools. Children observe their own hair, skin, and other features closely.</p>`},Thursday:{title:'Dramatic Play · Caring for Hair',html:`<p>Connect to <i>Hair Love</i> and introduce the mirror, sink, hair-care tools, dolls, and Beautiful Stuff for making props.</p><div class="box">Children may pretend to wash, comb, brush, braid, curl, or otherwise care for dolls’ hair. If children care for a classmate’s hair, they must ask permission before touching it.</div>`},Friday:{title:'Continue and Deepen Center Work',html:`<p>No new center introduction is listed for Day 5 in the Week 7 At a Glance. Support children in revisiting and extending the Week 7 center experiences already introduced.</p><div class="box">Discovery: Mixing Salt Dough and Library & Listening: Retelling Stories also continue this week.</div>`}}[n];day.textContent='WEEK 7 · '+n.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
