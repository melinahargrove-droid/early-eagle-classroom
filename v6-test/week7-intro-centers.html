<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 7 Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea)}.page{height:100vh;padding:3vh 5vw}.top{height:10vh;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;letter-spacing:.12em;color:#789697}.chip{padding:.6vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.card{height:76vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw}.visual{height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-size:clamp(70px,7vw,120px);font-weight:900}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:clamp(40px,3.5vw,68px);margin:1vh 0;color:#164f7f;line-height:1.04}.lead{font-size:clamp(20px,1.35vw,27px);font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh}.step{padding:1.1vh 1.2vw;background:#e7f0ed;border-radius:17px;color:#416d61;font-size:clamp(16px,1vw,20px);font-weight:900;line-height:1.35}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff}</style></head><body><main class="page"><div class="top"><div class="brand">EARLY EAGLE ACADEMY · INTRO TO CENTERS · WEEK 7</div><div class="chip" id="chip"></div></div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="prev">← Previous</button><button class="done" id="done">Done ✓</button></div></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday';const d={Monday:{icon:'👨‍👩‍👧',title:'Writing & Drawing · Family Pictures',lead:'Children notice families in familiar books and represent people who are important to them.',steps:['Use illustrations from familiar books to notice different families represented.','Invite: Who is someone in your family?','Affirm the relationships children identify, including people they do or do not live with, friends, pets, and other companions they consider family.']},Tuesday:{icon:'🎨',title:'Art Easel + Blocks',lead:'Children use book illustrations as inspiration for painting and building.',steps:['Art Easel: Revisit colors in Goodbye Summer, Hello Autumn. Invite children to mix colors and paint something inspired by the book or another idea.','Blocks: Look at furniture in read alouds, name its function, and build furniture with unit blocks and Beautiful Stuff.']},Wednesday:{icon:'🪞',title:'Art Studio + Science & Engineering',lead:'Hair Love inspires close observation and representation of children’s own features.',steps:['Art Studio: Offer Beautiful Stuff for representing different kinds of hair in a self-portrait.','Science & Engineering: Use mirrors, magnifiers, eye droppers, and drawing tools to observe hair, skin, and other features closely.']},Thursday:{icon:'💇',title:'Dramatic Play · Caring for Hair',lead:'Children explore hair care through pretend play connected to Hair Love.',steps:['Introduce the mirror, sink, hair-care tools, dolls, and Beautiful Stuff for making props.','Children may pretend to wash, comb, brush, braid, curl, or otherwise care for dolls’ hair.','If children care for a classmate’s hair, they must ask permission before touching it.']},Friday:{icon:'✨',title:'Continue and Deepen Center Work',lead:'No new center is introduced today. Children revisit and extend Week 7 experiences.',steps:['Support children in revisiting and extending the Week 7 center experiences already introduced.','Discovery: Mixing Salt Dough and Library & Listening: Retelling Stories also continue this week.']}}[day];const $=id=>document.getElementById(id);$('chip').textContent='WEEK 7 · '+day.toUpperCase();$('eye').textContent=day.toUpperCase()+' · CENTER INTRODUCTION';$('visual').textContent=d.icon;$('title').textContent=d.title;$('lead').textContent=d.lead;$('steps').innerHTML=d.steps.map(s=>'<div class="step">'+s+'</div>').join('');$('prev').onclick=()=>location.href='week7-read-aloud.html?day='+encodeURIComponent(day);$('done').onclick=()=>location.href='week7-small-groups.html?day='+encodeURIComponent(day)})();</script></body></html>
