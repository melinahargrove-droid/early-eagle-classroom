="brand"><small>EARLY EAGLE ACADEMY · INTRO TO CENTERS</small><h1>Today in Centers</h1></div><div class="right"><div class="week" id="week">WEEK 7 · WEDNESDAY</div><button class="closebtn" id="back" aria-label="Back to Today's Plan">×</button></div></header><section class="stage"><div class="visual"><div class="piccard" style="position:relative"><img id="pic" alt="Center illustration"><button class="editVisual" id="editVisual" style="position:absolute;left:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">✎ Edit Visual</button><button class="editVisual" id="restoreVisual" style="display:none;position:absolute;right:12px;bottom:12px;border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c82;padding:8px 11px;font-weight:900;cursor:pointer">↺ Restore Default</button></div></div><div class="copy"><div class="eyebrow" id="kicker"></div><h2 id="title"></h2><div class="centername" id="sub"></div><div class="prompt" id="prompt"></div><div class="cue" id="cue"></div></div></section><button class="teacher" id="review" style="display:none;left:25%">↺ Review Original Introduction</button><button class="teacher" id="teacherBtn">⌃ &nbsp; Teacher Notes</button><button class="done" id="doneBtn">Done ✓</button><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS</div><p id="materials"></p><div class="label">VOCABULARY</div><p class="vocab" id="vocab"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Post Office 1',sub:'Dramatic Play',kicker:'NEW LESSON',img:'assets/dramatic-play.webp',materials:'A Letter to Amy · The Thank You Letter · children’s letters/messages · post office images · sign paper · writing tools · envelopes · rubber stamps/stamp sheet · glue · cash register/play money · letter-organizing containers',vocab:'communicate · envelope · letter · mail · stamp',steps:[{title:'Letters Help Us Communicate',prompt:'Peter and Grace write letters to friends.',cue:'Letters are written or drawn messages.',script:'Show pages from A Letter to Amy and The Thank You Letter. Explain that letters help us communicate, or share ideas with others.'},{title:'What Happens to a Letter?',prompt:'Sometimes we mail a letter at a post office.',cue:'Mail means sending a letter/card/package to another person.',script:'Connect to children’s messages from Writing & Drawing. Explain that one way to send them is to mail them at a post office. Ask children to put a hand on their head if they have visited one; invite a few experiences.'},{title:'Notice Post Offices',prompt:'What do you notice?',cue:'Look at real post office images.',script:'Show images of different post offices and invite 1–2 observations.'},{title:'Open Our Post Office',prompt:'Dramatic Play is becoming a post office.',cue:'Children can help sort, organize, make mailboxes, and create the sign.',script:'Show and name some materials and explain that children can help create the Post Office.'},{title:'Prepare & Mail a Letter',prompt:'Fold → envelope → name/address → stamp → mail',cue:'Model the process.',script:'Model folding a letter/card, putting it in an envelope, addressing it with a name, purchasing/adding a stamp, and dropping it at the post office.'},{title:'Deliver the Mail',prompt:'A mail carrier takes it to the correct person.',cue:'How will the carrier know where it goes?',script:'Explain/model the mail carrier role and delivering mail to the intended person or cubby.'}],teacherNote:'Focus explicitly says the Post Office may be delayed or skipped if children are still deeply engaged in or need more time with the Supermarket/Pizza Shop. Base the transition on children’s interests.'},{title:'Making Musical Instruments 1',sub:'Science & Engineering',kicker:'NEW LESSON',img:'assets/science.webp',materials:'Drum City · cups · small boxes · beads · rubber bands · paper clips · pom-poms · craft sticks · string · tape · cardboard tubes · optional shaker/guitar visual',vocab:'sound · volume',steps:[{title:'Sounds From Everyday Materials',prompt:'What did children use to make music in Drum City?',cue:'Buckets · cans · bins · other objects',script:'Show Drum City pages where children drum on different objects. Remind children that sound is something people or animals can hear with their ears.'},{title:'We Will Make Instruments',prompt:'What could you create with these materials?',cue:'Cup · box · rubber bands and more',script:'Explain that children will make their own musical instruments. Show a box, cup, and rubber bands and collect ideas.'},{title:'Make a Rubber-Band Instrument',prompt:'Pluck the band like a guitar.',cue:'What sound do you hear?',script:'Place a rubber band around a cup and pluck it. Ask children what sound they hear.'},{title:'Explore Volume',prompt:'Is the sound loud or quiet?',cue:'Volume is the amount of sound.',script:'Introduce volume and ask how the rubber-band instrument could be made louder.'},{title:'Make a Shaker',prompt:'Beads + box = shaker.',cue:'How could its volume change?',script:'Put beads inside a box, close it, and shake. Ask what sound it makes and how children could make it louder or quieter.'},{title:'Plan Your Instrument',prompt:'What kind of instrument will you create?',cue:'Choose materials and think about the sound you want.',script:'Invite children to share ideas for instruments they may create during Science & Engineering.'}]}]};const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),dayName=params.get('day')||'Monday',items=all[dayName]||all.Monday,runner=params.get('eeaRunner')==='1';let i=Math.max(0,Math.min(items.length-1,Number(params.get('item'))||0)),step=Math.max(0,Number(params.get('step'))||0),visualToken=0;const slot rchParams(location.search);q.set('item',String(i));q.set('step',String(step));const backUrl='week7-intro-centers.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(backUrl)};$('restoreVisual').onclick=async()=>{try{await EEAVisualStore.remove(slot())}catch(e){}applyVisual(items[i])};render()})();</script></body></html>
