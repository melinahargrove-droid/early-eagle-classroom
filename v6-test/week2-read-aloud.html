<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 2 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:12px}h1{margin:.2vh 0;color:#164f7f;font-size:32px}.sub{color:#557876;font-weight:800}.actions{display:flex;gap:9px;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid #cbdde0;background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:8px 13px;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#eef4ef;cursor:pointer}.book.hidden{display:none}.book img{width:100%;height:100%;object-fit:contain}.side{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.45vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18)}.side.show{display:block}.side h2{font-size:18px;margin:0 0 .65vh;color:#9a6c13}.stop{color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stop b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin:.3vh 0 .45vh}.part{padding:.2vh 0 .75vh;border-bottom:1px solid rgba(228,197,109,.35)}.part:last-child{border-bottom:0}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-fallback{font-size:120px}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-gesture{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1px solid #cbdde0;border-radius:17px;padding:10px;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.nav:disabled{opacity:.3}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;background:#d8e8ed;border-radius:999px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book" title="Click the page after reading to show or hide the teaching stop"><img id="bookImg" alt="Adapted book page"></div><div class="side" id="side"><h2 id="sideTitle">Pause Here</h2><div class="stop" id="stop"></div></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-gesture" id="vocabGesture"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],day=days.includes(p.get('day'))?p.get('day'):'Monday',runner=p.get('eeaRunner')==='1';const P=(label,text)=>`<div class="part"><b>${label}</b>${text}</div>`;const data={Monday:{title:"Shhh! The Baby’s Asleep",sub:'Read 1 of 3 · Introduce the book',notes:'Focus on Pre-K 3s · Unit 1 Week 2. Read the full text fluently and pause at printed pages 1–2, 3–4, 13–14, 17–18, 23–24, and 27–28.',before:P('BEFORE READING',"Today we will read a new book titled Shhh! The Baby’s Asleep! Take a close look at the front cover. What do you think the story will be about? Invite 1–2 responses. Janay Brown-Wood is the author; she wrote the words. Elissambura is the illustrator; she made the pictures. In this story, a family takes care of a baby. Let’s read and find out what happens with this sleeping baby."),body:P('PAGES 1–2','The mom is telling her son not to make a peep, or any small sound. It’s important that babies sleep to rest their bodies!')+P('PAGES 3–4','Mom is creeping out the door. She’s walking slowly and quietly out of the room so she doesn’t wake the baby. Look, she even takes her shoes off! Point to the shoe.')+P('PAGES 13–14','Model thinking about a prediction: “Hm, I wonder what this family member might be doing? I notice a car on its side and a hammer in the boy’s hand.” Read the page and resolve the prediction. This is Dante and it looks like he’s fixing a toy car! Unstuck means to make something loose. Perhaps the wheels on the car are not moving.')+P('PAGES 17–18','Oh my, so many different sounds! What might happen with all of this noise? Invite 1–2 children to make a prediction.')+P('PAGES 23–24','Uproar describes all of the loud noises. How’s the family feeling?')+P('PAGES 27–28','How is the family feeling now?'),after:P('AFTER READING','Who ends up sleeping at the end of the story? Why?')+P('CLOSING',"Today we read Shhh! The Baby’s Asleep! and we’ll read this book again tomorrow. During Centers, you might visit Dramatic Play and show how you might take care of a baby.")},Tuesday:{title:'I Love Us! A Book About Family',sub:'Read 2 of 2 · Make connections',notes:'Focus on Pre-K 3s · Unit 1 Week 2. Read the full text fluently. Curriculum stopping points: printed pages 9–10 and 11–12.',before:P('OPENING','We will read I Love Us! A Book About Family one more time. Remember that we met many different families and learned about what they do together. This time, we will stop on a few pages to talk about what is happening and make connections to our own experiences.'),body:P('PAGES 9–10','Take a look at this child. How is he feeling? How do you know? What do you think makes him feel better? Why? Think about a time when you were not feeling well. What made you feel better?')+P('PAGES 11–12','Do you remember the celebration from Naming Ceremony? This family is also celebrating—doing special things for a special occasion. What special things do you notice? Celebrations are important to us and our families. What kinds of celebrations does your family love?'),after:P('CLOSING','I love when we share about our families. It seems we all enjoy doing things with our families.')},Wednesday:{title:"Shhh! The Baby’s Asleep",sub:'Read 1 of 3 · Introduce the book',notes:'Focus on Pre-K 3s · Unit 1 Week 2. Read the full text fluently and pause at printed pages 1–2, 3–4, 13–14, 17–18, 23–24, and 27–28.',before:P('BEFORE READING',"Today we will read a new book titled Shhh! The Baby’s Asleep! Look closely at the cover and invite 1–2 predictions about what the story will be about. Janay Brown-Wood is the author and Elissambura is the illustrator. In this story, a family takes care of a baby. Let’s read and find out what happens with this sleeping baby."),body:P('PAGES 1–2','Mom tells her son not to make a peep, or any small sound. Babies need sleep to rest their bodies.')+P('PAGES 3–4','Mom is creeping out the door—walking slowly and quietly so she does not wake the baby. Notice that she even takes off her shoes.')+P('PAGES 13–14','Model a prediction from the illustration, then read to resolve it. Dante is fixing a toy car. Unstuck means to make something loose.')+P('PAGES 17–18','Notice the many sounds. What might happen with all of this noise? Invite 1–2 predictions.')+P('PAGES 23–24','Uproar describes all of the loud noises. How is the family feeling?')+P('PAGES 27–28','How is the family feeling now?'),after:P('AFTER READING','Who ends up sleeping at the end of the story? Why?')+P('CLOSING',"Today we read Shhh! The Baby’s Asleep! and we’ll read this book again tomorrow. During Centers, you might visit Dramatic Play and show how you might take care of a baby.")},Thursday:{title:"Shhh! The Baby’s Asleep",sub:'Read 2 of 3 · Retell the story',notes:'Focus on Pre-K 3s · Unit 1 Week 2. Read the book again and invite children to help retell events from the illustrations. Encourage choral participation in sound words and the repeated line.',before:P('OPENING',"Let’s read Shhh! The Baby’s Asleep! again. This time, we will work together to retell the story."),body:P('WHILE READING','Read the book. At times, instead of reading the exact text, invite children to tell what happens on the pages. Invite children to chime in during the sound words; add gestures and sound effects when possible. Invite children to chime in during the repeated line, “Shh! The baby’s asleep!” Track the print while reading that line and draw attention to the words.')+P('PAGES 7–8','Granny’s shirt is covered in dirt—dirt is all over.')+P('PAGES 15–16','Jowls are Rover’s mouth.'),after:P('DISCUSSION','Why do you think the baby wakes up? Show a few of the ending pages.')+P('CLOSING','Today we reconstructed the story together! Tomorrow we will read this book one more time.')},Friday:{title:"Shhh! The Baby’s Asleep",sub:'Read 3 of 3 · Act out the story',notes:'Focus on Pre-K 3s · Unit 1 Week 2. Introduce the recurring story-acting routine: audience around the perimeter, stage inside the circle, children invited to act characters, and an explicit option to pass.',before:P('OPENING','Seat children around the perimeter of the rug. Explain that today you will read Shhh! The Baby’s Asleep again and act out the story. When we act out stories, we pretend to be characters. The perimeter, or edge, is where the audience watches; inside is the stage. As the story is read, invite children to enter the stage and play characters. Children who do not want to act may say “pass” or use an agreed gesture.'),body:P('WHILE READING','Select several scenes from the beginning, middle, and end to act out. Invite children from around the circle to enter the stage and play characters as you read.'),after:P('AFTER READING','Have a discussion about the experience: What did you think about acting out the story today?')+P('CLOSING','We will act out other stories soon!')}};const d=data[day]||data.Monday,$=id=>document.getElementById(id);$('bookTitle').textContent=d.title;$('subTitle').textContent=d.sub;$('chip').textContent='FOCUS ON 3s · WEEK 2 · '+day.toUpperCase();$('notesTitle').textContent=d.title;$('notesCopy').textContent=d.notes;const guideParts=[...((d.before||'')+(d.body||'')+(d.after||'')).matchAll(/<div class="part">[\s\S]*?<\/div>/g)].map(m=>m[0]);let sequence=(day==='Tuesday'?guideParts:[(d.before||'')+(d.body||'')+(d.after||'')]).map(stop=>({type:'book',src:'assets/reading.webp',stop}));if(['Monday','Wednesday','Thursday','Friday'].includes(day)){const deck='1ysX9sbEW4YiZqVa29m86IddnnYKNqQVIp53QVkr7QpU',ids=["p2","p3","p4","p5","p6","p7","p8","p9","p10","p11","p12","p13","p14","p15","p16"];if(day==='Monday'){const stops={0:guideParts[0],1:guideParts[1],2:guideParts[2],7:guideParts[3],9:guideParts[4],12:guideParts[5],14:guideParts.slice(6).join('')};sequence=ids.map((id,i)=>({type:'book',src:'https://docs.google.com/presentation/d/'+deck+'/export/png?pageid='+id,stop:stops[i]||''}));}else{sequence=ids.map((id,i)=>({type:'book',src:'https://docs.google.com/presentation/d/'+deck+'/export/png?pageid='+id,stop:(i===0?d.before:'')+(i===0?d.body:'')+(i===ids.length-1?d.after:'')}));}}let step=0,currentStop='';function show(){const item=sequence[step];$('book').classList.remove('hidden');$('vocabSlide').classList.remove('show');$('bookImg').src=item.src;currentStop=item.stop;$('stop').innerHTML=currentStop;$('sideTitle').textContent='Teacher Guide';$('side').classList.toggle('show',!!currentStop);$('side').style.display=currentStop?'block':'none';$('count').textContent=(day==='Tuesday'?'Teaching stop '+(step+1)+' of '+sequence.length:'Support slide '+(step+1)+' of '+sequence.length);$('fill').style.width=((step+1)/sequence.length*100)+'%';$('prev').disabled=step===0;$('next').textContent=step===sequence.length-1?'Finish Read Aloud ✓':'Next →'}$('book').onclick=()=>{if(!currentStop)return;const open=$('side').classList.toggle('show');$('side').style.display=open?'block':'none'};$('prev').onclick=()=>{if(step>0){step--;show()}};$('next').onclick=()=>{if(step<sequence.length-1){step++;show()}else if(!runner)location.href='daily-lessons.html?week=2&day=0'};$('backBtn').onclick=()=>location.href='daily-lessons.html?week=2&day=0';$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');show()})();</script></script></body></html>
