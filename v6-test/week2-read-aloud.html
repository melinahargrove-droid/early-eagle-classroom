<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 2 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:12px}h1{margin:.2vh 0;color:#164f7f;font-size:32px}.sub{color:#557876;font-weight:800}.actions{display:flex;gap:9px;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid #cbdde0;background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:8px 13px;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#eef4ef}.book.hidden{display:none}.book img{width:100%;height:100%;object-fit:contain}.side{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.45vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18)}.side.show{display:block}.side h2{font-size:18px;margin:0 0 .65vh;color:#9a6c13}.stop{color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stop b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin:.3vh 0 .45vh}.part{padding:.2vh 0 .75vh;border-bottom:1px solid rgba(228,197,109,.35)}.part:last-child{border-bottom:0}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-fallback{font-size:120px}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-gesture{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1px solid #cbdde0;border-radius:17px;padding:10px;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.nav:disabled{opacity:.3}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;background:#d8e8ed;border-radius:999px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="bookImg" alt="Adapted book page"></div><div class="side" id="side"><h2>Pause Here</h2><div class="stop" id="stop"></div></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-gesture" id="vocabGesture"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],day=days.includes(p.get('day'))?p.get('day'):'Monday';const mango=['../too-many-mangos/tm-01.png',...Array.from({length:14},(_,i)=>'assets/mangos/mango-'+String(i+2).padStart(2,'0')+'.jpg')];const riley=Array.from({length:18},(_,i)=>'../what-riley-wore-slides/ri%6cey-'+String(i+1).padStart(2,'0')+'.jpg');const P=(label,text)=>`<div class="part"><b>${label}</b>${text}</div>`;const data={Monday:{title:'Too Many Mangos',sub:'Read 3 of 4 · Second half and retell',pages:mango.slice(8),offset:8,notes:'Read the second half of Too Many Mangos. Use the printed book-page numbers for every curriculum stop.',stops:{10:P('BOOK PAGE 19 · STOP & THINK','Look at the illustration and listen to the words. What’s happening?'),12:P('BOOK PAGE 23 · STOP & THINK','Why is the wagon full?'),14:P('BOOK PAGE 27 · STOP & THINK','How does the story end?')},vocabs:[{after:10,word:'In Return',definition:'Giving something back.',gesture:'What could you give someone in return?',icon:'↔',slot:'week2-mangos-in-return'}]},Tuesday:{title:'Too Many Mangos',sub:'Read 4 of 4 · Act out the story',pages:mango,offset:0,notes:'Read the story and pause on the printed book pages to act out the selected events.',stops:{5:P('BOOK PAGES 8–9 · ACT IT OUT','Let’s act out loading mangos in a wagon. Now pull the heavy wagon down the road!'),8:P('BOOK PAGES 14–15 · ACT IT OUT','Turn to a nearby partner and pretend to share mangos. What will you say? How will you thank them?'),14:P('BOOK PAGES 26–27 · ACT IT OUT','Let’s pretend to cut up fruit for a fresh fruit salad! What might you say when you make fruit salad for someone?'),15:P('AFTER READING','What did you think about acting out the story? What was your favorite part?')}},Wednesday:{title:'What Riley Wore',sub:'Read 1 of 3 · What’s the story about?',pages:riley,offset:0,notes:'Read fluently. Teaching stops are attached to the slide containing the printed book page—not to a same-numbered slide.',stops:{4:P('BOOK PAGE 4 · STOP & THINK','Do you think Riley’s bunny ears help the crying child feel better? Show thumbs up if you think so.'),6:P('BOOK PAGE 8 · STOP & THINK','Look at the picture. How does Riley feel in the ball gown?'),9:P('BOOK PAGE 14 · STOP & THINK','Why does Riley wear this outfit? How do you think Riley feels when the big kid says, “I like your tutu?”'),15:P('BOOK PAGE 25 · STOP & THINK','Riley is a lot of things!')},vocabs:[{after:4,word:'Velvet',definition:'A fabric that is very soft.',gesture:'Pretend to gently feel something very soft.',icon:'🧵',slot:'week2-riley-velvet'},{after:6,word:'Ball Gown',definition:'A fancy dress you might wear to a party.',gesture:'Show how you might move in a fancy ball gown.',icon:'👗',slot:'week2-riley-ball-gown'},{after:0,word:'Tuck Away',definition:'To put something somewhere special to save for later.',gesture:'Pretend to carefully tuck away a special sticker.',icon:'⭐',slot:'week2-riley-tuck-away'}]},Thursday:{title:'What Riley Wore',sub:'Read 2 of 3 · Reading the pictures',pages:riley,offset:0,notes:'Read fluently and look closely at the illustrations. Stops are mapped to the slide containing each printed book page.',stops:{7:P('BOOK PAGE 10 · STOP & THINK','Look at the illustration. How does Riley feel? Why do you think so?'),12:P('BOOK PAGE 20 · STOP & THINK','What else does Riley like to do on a lazy home day? What do you like to wear or do on a day like that?'),14:P('BOOK PAGE 24 · STOP & THINK','What do you notice about Riley’s closet?'),18:P('AFTER READING','Slowly revisit the illustrations. What is your favorite thing that Riley wears?')},vocabs:[{after:12,word:'Lazy',definition:'Feeling relaxed and not wanting to use up your energy.',gesture:'Show me a relaxed, lazy-day body.',icon:'🛋️',slot:'week2-riley-lazy'}]},Friday:{title:'What Riley Wore',sub:'Read 3 of 3 · Act out the story',pages:riley,offset:0,notes:'Use the full-page book images. Acting guidance appears as small teaching-stop popups instead of separate question pages.',stops:{1:P('BEFORE READING','The edge of the rug is our audience. The middle is our stage. When invited, you may act—or pass.'),4:P('ACT IT OUT','Choose a character and show the character’s actions and feelings with your body.'),9:P('ACT IT OUT','A different friend can be Riley in this scene. Listen, then act what happens.'),15:P('ACT IT OUT','Use your body and face to show how the character might be feeling.'),18:P('AFTER READING','What did you think about acting out the story? What was your favorite part?')}}};const d=data[day];let sequence=d.pages.map((src,i)=>({type:'book',src,page:i+1+(d.offset||0)}));(d.vocabs||[]).forEach(v=>{let idx=sequence.findIndex(x=>x.type==='book'&&x.page===v.after);if(idx<0)idx=0;sequence.splice(idx+1,0,{type:'vocab',...v})});let step=0,token=0;const $=id=>document.getElementById(id);$('bookTitle').textContent=d.title;$('subTitle').textContent=d.sub;$('chip').textContent='WEEK 2 · '+day.toUpperCase();$('notesTitle').textContent=d.title;$('notesCopy').textContent=d.notes;async function vocab(item){const t=++token,src=await EEAVisualStore.get(item.slot);if(t!==token)return;$('vocabCustom').hidden=!src;$('vocabFallback').style.display=src?'none':'block';$('vocabFallback').textContent=item.icon||'🖼️';if(src)$('vocabCustom').src=src;$('vocabKicker').textContent='QUICK WORD';$('vocabWord').textContent=item.word;$('vocabDefinition').textContent=item.definition;$('vocabGesture').textContent=item.gesture||'';$('vocabEdit').onclick=()=>location.href='visual-editor.html?slot='+encodeURIComponent(item.slot)+'&return='+encodeURIComponent('week2-read-aloud.html?day='+day)}function show(){const item=sequence[step],isV=item.type==='vocab';$('book').classList.toggle('hidden',isV);$('vocabSlide').classList.toggle('show',isV);$('side').style.display='none';$('side').classList.remove('show');if(isV)vocab(item);else{token++;$('bookImg').src=item.src;const s=d.stops[item.page]||'';$('stop').innerHTML=s;if(s){$('side').style.display='block';$('side').classList.add('show')}}$('count').textContent='Slide '+(step+1)+' of '+sequence.length;$('fill').style.width=((step+1)/sequence.length*100)+'%';$('prev').disabled=step===0;$('next').textContent=step===sequence.length-1?'Finish Read Aloud ✓':'Next →'}$('prev').onclick=()=>{if(step>0){step--;show()}};$('next').onclick=()=>{if(step<sequence.length-1){step++;show()}else location.href='daily-lessons.html'};$('backBtn').onclick=()=>location.href='daily-lessons.html';$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');show()})();</script></body></html>
