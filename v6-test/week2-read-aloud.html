<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 2 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f7f2e7}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{color:#76949a;font-weight:900;letter-spacing:.12em;font-size:12px}h1{margin:.2vh 0;color:#164f7f;font-size:32px}.sub{color:#557876;font-weight:800}.actions{display:flex;gap:9px;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid #cbdde0;background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:8px 13px;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#eef4ef;cursor:pointer}.book.hidden{display:none}.book img{width:100%;height:100%;object-fit:contain}.side{display:none;position:absolute;right:2vw;bottom:2vh;width:min(540px,43vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.45vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18)}.side.show{display:block}.side h2{font-size:18px;margin:0 0 .65vh;color:#9a6c13}.stop{color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stop b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin:.3vh 0 .45vh}.part{padding:.2vh 0 .75vh;border-bottom:1px solid rgba(228,197,109,.35)}.part:last-child{border-bottom:0}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-fallback{font-size:120px}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-gesture{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1px solid #cbdde0;border-radius:17px;padding:10px;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.nav:disabled{opacity:.3}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;background:#d8e8ed;border-radius:999px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book" title="Click the page after reading to show or hide the teaching stop"><img id="bookImg" alt="Adapted book page"></div><div class="side" id="side"><h2 id="sideTitle">Pause Here</h2><div class="stop" id="stop"></div></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-gesture" id="vocabGesture"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],day=days.includes(p.get('day'))?p.get('day'):'Monday',runner=p.get('eeaRunner')==='1';const P=(label,text)=>`<div class="part"><b>${label}</b>${text}</div>`;const data={Monday:{title:'I Love Us! A Book About Family',sub:'Read 1 of 2 · Introduce the book',notes:'Focus on Pre-K 3s · Unit 1 Week 2. Read the full text fluently. Curriculum stopping points: printed pages 3–4, 13–14, and 15–16.',before:P('BEFORE READING','Today we will read a new book, I Love Us! A Book About Family. Theodore Henry is the author and Luisa Uribe is the illustrator. In this book, we will see many different families. A family is a group of people who care for each other. Invite 2–3 children to share who is in their family, naming that there are many different family structures. Let’s read and find out what the families in this book love to do.'),body:P('WHILE READING · PAGES 3–4','What’s this family doing? They are playing their favorite songs and making music. Favorite means something you like best. Invite children to make music with their bodies.')+P('PAGES 13–14','Before reading, ask what the family is doing and what children think they are building. Connect to the Block Center and demonstrate reaching to the top.')+P('PAGES 15–16','Revisit the word visit from Lola Goes to School. Ask: How are these families visiting new places?'),after:P('AFTER READING','These families love doing many different things together. What do you love to do when you are not at school? When relevant, show pages that connect to children’s responses.')+P('CLOSING','Today we read about what different families love to do together. When you visit Dramatic Play, you might consider your family and act out what you like to do together. We’ll read this book again tomorrow!')}};const d=data[day]||data.Monday,$=id=>document.getElementById(id);$('bookTitle').textContent=d.title;$('subTitle').textContent=d.sub;$('chip').textContent='FOCUS ON 3s · WEEK 2 · '+day.toUpperCase();$('notesTitle').textContent=d.title;$('notesCopy').textContent=d.notes;const sequence=[{type:'book',src:'assets/reading.webp',stop:d.before+d.body+d.after}];let step=0,currentStop='';function show(){const item=sequence[step];$('book').classList.remove('hidden');$('vocabSlide').classList.remove('show');$('bookImg').src=item.src;currentStop=item.stop;$('stop').innerHTML=currentStop;$('sideTitle').textContent='Teacher Guide';$('side').classList.add('show');$('side').style.display='block';$('count').textContent='Read 1 of 2';$('fill').style.width='100%';$('prev').disabled=true;$('next').textContent='Finish Read Aloud ✓'}$('book').onclick=()=>{const open=$('side').classList.toggle('show');$('side').style.display=open?'block':'none'};$('next').onclick=()=>{if(!runner)location.href='daily-lessons.html?week=2&day=0'};$('backBtn').onclick=()=>location.href='daily-lessons.html?week=2&day=0';$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');show()})();</script></script></body></html>
