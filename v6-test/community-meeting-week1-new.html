<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 1 Community Meeting</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72;background:#f5f0e5}.page{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 5%,#fffdf7 0,#f7f1e5 58%,#e5eee9 100%);overflow:hidden}.top{position:absolute;left:3%;right:3%;top:2%;height:8%;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#76949a;font-weight:900;letter-spacing:.12em;font-size:clamp(11px,.75vw,15px)}.brand h1{margin:.3vh 0 0;color:#174f7d;font-size:clamp(30px,2.4vw,46px);line-height:1}.righttop{display:flex;align-items:center;gap:1vw}.week{padding:.65vh 1.2vw;border-radius:999px;background:rgba(214,232,237,.8);color:#386d80;font-weight:900;font-size:clamp(12px,.82vw,16px)}.close{width:clamp(46px,3vw,58px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(75,111,125,.18);background:#fffdf8;color:#174f7d;font-size:clamp(21px,1.5vw,28px);font-weight:900;cursor:pointer}.stage{position:absolute;left:7%;right:7%;top:12%;bottom:10%;border:1.5px solid rgba(92,136,147,.2);border-radius:34px;background:rgba(255,254,249,.94);box-shadow:0 18px 50px rgba(58,79,77,.08);overflow:hidden}.badge{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);padding:.55vh 1.2vw;border-radius:999px;background:rgba(217,234,238,.8);color:#4f7c89;font-weight:900;letter-spacing:.06em;font-size:clamp(11px,.72vw,14px)}.card{position:absolute;inset:9% 4.5% 11%;display:none;grid-template-columns:47% 1fr;gap:3.5vw;align-items:center}.card.active{display:grid}.visual{height:100%;display:flex;align-items:center;justify-content:center}.picture{width:min(36vw,600px);height:min(59vh,560px);object-fit:contain;display:block}.breath-scene{position:relative;width:min(36vw,600px);height:min(52vh,500px);display:flex;align-items:center;justify-content:center}.breath-rug{position:absolute;left:8%;right:8%;bottom:12%;height:24%;border-radius:50%;background:radial-gradient(ellipse,#8fc6e8 0,#69aada 62%,#4e8fc3 100%);box-shadow:inset 0 0 0 9px rgba(255,255,255,.24),0 11px 18px rgba(64,104,124,.12)}.breath-crop{position:absolute;left:6%;right:6%;top:7%;height:72%;overflow:hidden;border-radius:28px}.breath-crop img{position:absolute;width:150%;max-width:none;left:-12%;top:-7%;transform-origin:top left}.breath-cue{position:absolute;right:5%;top:8%;width:94px;height:94px;border-radius:50%;background:#e7f2f4;display:grid;place-items:center;text-align:center;color:#5a8390;font-weight:900;line-height:1.05;font-size:13px;box-shadow:0 5px 15px rgba(78,111,118,.08)}.breath-cue:before{content:'IN';display:block;font-size:22px;color:#3f7891}.copy{text-align:left}.eyebrow{color:#799597;font-size:clamp(12px,.8vw,15px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{margin:1.1vh 0;color:#174f7d;font-size:clamp(44px,4.2vw,80px);line-height:1}.copy p{margin:1.4vh 0;color:#557876;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.38;max-width:39vw}.step{padding:1vh 1.3vw;border-radius:17px;background:rgba(226,238,236,.72);color:#4f765e;font-size:clamp(17px,1.16vw,23px);font-weight:900;margin-top:1vh}.quote{margin-top:2vh;padding:1.5vh 1.6vw;border-radius:20px;background:#e8f1ed;color:#426f65;font-size:clamp(24px,1.9vw,36px);font-weight:900;line-height:1.25;max-width:39vw}.nav{position:absolute;left:4%;right:4%;bottom:2.5%;display:flex;justify-content:space-between;align-items:center}.nav button{border:1.3px solid rgba(80,120,130,.14);border-radius:18px;padding:1vh 1.4vw;font-weight:900;font-size:clamp(14px,1vw,19px);cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff;min-width:9vw}.dots{display:flex;gap:.55vw}.dot{width:clamp(10px,.7vw,14px);aspect-ratio:1;border-radius:50%;background:#d3dfdc}.dot.active{background:#6f9da8}.teacher{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);border:1.3px solid rgba(80,120,130,.15);border-radius:999px;background:#fffdf8;color:#315f70;padding:.6vh 1.35vw;font-weight:900;font-size:clamp(11px,.8vw,15px);cursor:pointer}.panel{position:absolute;z-index:10;left:22%;right:22%;bottom:7.2%;padding:1.5vh 1.5vw;border-radius:22px;background:#fffdf9;border:1.5px solid rgba(83,120,128,.18);box-shadow:0 12px 30px rgba(44,67,68,.15);display:none;color:#567274;font-size:clamp(12px,.8vw,15px);font-weight:800;line-height:1.45}.panel.open{display:block}.panel strong{color:#315f70}.source{position:absolute;right:3%;bottom:2.15%;color:#aebbb8;font-size:clamp(8px,.52vw,10px);font-weight:700;opacity:.78}</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · COMMUNITY MEETING</small><h1>Community Meeting</h1></div><div class="righttop"><div class="week" id="weekLabel"></div><button class="close" id="closeBtn">×</button></div></header><section class="stage"><div class="badge" id="badge"></div><div id="cards"></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div></section><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><div class="panel" id="panel"></div><div class="source">Focus on Pre-K · Unit 1 · Week 1</div></main><script>(()=>{const img='assets/Community Meeting pics 1.png';const days={Monday:[{label:'MINDFUL PRACTICE',eye:'Monday · Belly Breaths',title:'Hands on Your Belly',body:'Sit comfortably. Put your hands gently on your belly.',extra:'<div class="step">Get your body still and ready to breathe.</div>',breath:true},{label:'BELLY BREATHS',eye:'Monday · Belly Breaths',title:'Breathe In',body:'Breathe in slowly through your nose.',extra:'<div class="step">Feel your belly get bigger.</div>',breath:true},{label:'BELLY BREATHS',eye:'Monday · Belly Breaths',title:'Breathe Out',body:'Breathe out slowly.',extra:'<div class="step">Feel your belly get smaller. Try it again.</div>',breath:true},{label:'CONVERSATION',eye:'Monday · School Feelings',title:'How Does School Feel?',body:'Think about how you feel when you come to school.',extra:'<div class="quote">How do you feel at school today?</div>'},{label:'MOVEMENT / GAME',eye:'Monday · Name Ball',title:'Name Ball',body:'Roll the ball to a friend and say their name.',extra:'<div class="step">Listen for your name. Roll gently across the circle.</div>'}],Tuesday:[{label:'MINDFUL PRACTICE',eye:'Tuesday · Belly Breaths',title:'Belly Breaths',body:'Put your hands on your belly and take slow breaths.',extra:'<div class="step">Breathe in. Breathe out.</div>',breath:true},{label:'CONVERSATION',eye:'Tuesday · Our Classroom',title:'What Do We Do Here?',body:'Think about things we do together at school.',extra:'<div class="quote">What is something we do in our classroom?</div>'},{label:'MOVEMENT / GAME',eye:'Tuesday · Name Ball',title:'Roll to a Friend',body:'Say a friend’s name, then roll the ball to them.',extra:'<div class="step">Keep the ball low and gentle.</div>'}],Wednesday:[{label:'MINDFUL PRACTICE',eye:'Wednesday · Belly Breaths',title:'Slow Belly Breaths',body:'Make your belly move slowly in and out as you breathe.',extra:'<div class="step">Quiet body. Slow breath.</div>',breath:true},{label:'CONVERSATION',eye:'Wednesday · School Feelings',title:'What Helps?',body:'Sometimes school can feel exciting, busy, or new.',extra:'<div class="quote">What helps you feel comfortable at school?</div>'},{label:'MOVEMENT / GAME',eye:'Wednesday · Name Ball',title:'Remember Our Names',body:'Roll the ball and practice saying our friends’ names.',extra:'<div class="step">Look at your friend before you roll.</div>'}],Thursday:[{label:'MINDFUL PRACTICE',eye:'Thursday · Belly Breaths',title:'Breathe Together',body:'Let’s take a few slow belly breaths together.',extra:'<div class="step">In slowly. Out slowly.</div>',breath:true},{label:'CONVERSATION',eye:'Thursday · Classroom Community',title:'We Learn Together',body:'Our classroom is a place where we learn and play together.',extra:'<div class="quote">How can we help each other at school?</div>'},{label:'MOVEMENT / GAME',eye:'Thursday · Name Ball',title:'Name Ball',body:'Choose a friend, say their name, and roll the ball.',extra:'<div class="step">Make sure everyone gets a turn.</div>'}],Friday:[{label:'MINDFUL PRACTICE',eye:'Friday · Belly Breaths',title:'Ready to Breathe',body:'Finish our week with calm belly breaths.',extra:'<div class="step">Notice how your body feels.</div>',breath:true},{label:'CONVERSATION',eye:'Friday · Our First Week',title:'Our Week Together',body:'Think about something you remember from our week.',extra:'<div class="quote">What is something you remember about school this week?</div>'},{label:'MOVEMENT / GAME',eye:'Friday · Name Ball',title:'We Know Our Friends!',body:'Roll the ball to a friend and say their name.',extra:'<div class="step">Celebrate how many names we are learning!</div>'}]};const params=new URLSearchParams(location.search),names=['Monday','Tuesday','Wednesday','Thursday','Friday'];let day=names.find(x=>x.toLowerCase()===(params.get('day')||'Monday').toLowerCase())||'Monday',i=0;const returnTarget=params.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html';function teacherText(){return '<strong>Week 1:</strong> Keep Community Meeting brief and predictable while children are learning the routine. Model Belly Breaths and Name Ball clearly; accept pointing, gestures, or passing when children are not ready to speak.'}function visual(c){if(c.breath)return `<div class="breath-scene"><div class="breath-rug"></div><div class="breath-crop"><img src="${img}" alt="Children practicing belly breathing"></div><div class="breath-cue">SLOW<br>BREATH</div></div>`;return `<img class="picture" src="${img}" alt="Community Meeting visual">`}function render(){const d=days[day];cards.innerHTML=d.map((c,n)=>`<article class="card ${n===i?'active':''}"><div class="visual">${visual(c)}</div><div class="copy"><div class="eyebrow">${c.eye}</div><h2>${c.title}</h2><p>${c.body}</p>${c.extra}</div></article>`).join('');dots.innerHTML=d.map((_,n)=>`<span class="dot ${n===i?'active':''}"></span>`).join('');badge.textContent=d[i].label+' · '+(i+1)+' OF '+d.length;weekLabel.textContent='WEEK 1 · '+day.toUpperCase();prev.disabled=i===0;next.textContent=i===d.length-1?'Done ✓':'Next →';panel.innerHTML=teacherText()}prev.onclick=()=>{if(i){i--;render()}};next.onclick=()=>{if(i<days[day].length-1){i++;render()}else location.href=returnTarget};closeBtn.onclick=()=>location.href=returnTarget;teacher.onclick=()=>panel.classList.toggle('open');render()})();</script></body></html>
