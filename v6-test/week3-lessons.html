<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2.2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.5vh 5vw;display:grid;grid-template-columns:42% 1fr;gap:5vw;align-items:center}.visual{height:56vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#66858b;font-weight:900}.visual .symbol{font-size:clamp(84px,9vw,150px);line-height:1}.visual .caption{font-size:clamp(16px,1.1vw,22px);margin-top:2vh}.small{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px);text-transform:uppercase}.content h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.lead{font-size:clamp(21px,1.55vw,30px);line-height:1.35;color:#527673;font-weight:900;margin:1.4vh 0}.steps{display:grid;gap:1vh;margin-top:1.8vh}.step{padding:1.2vh 1.2vw;border-radius:17px;background:#e7f0ed;color:#416d61;font-size:clamp(17px,1.15vw,23px);font-weight:900}.note{margin-top:1.7vh;font-size:clamp(14px,.95vw,18px);line-height:1.45;color:#6c8280;font-weight:800}.bottom{height:9vh;display:flex;justify-content:center;align-items:center}.done{position:absolute;right:3.2vw;border:1px solid #668f99;border-radius:999px;padding:1vh 1.8vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer;background:#668f99;color:#fff}.teacher{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer;background:#fffdf8;color:#245c78}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(560px,38vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1.2vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.48;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.closepanel{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow" id="eyebrow"></div><h1 id="heading"></h1></div><div class="actions"><div class="chip" id="chip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="visual"><div><div class="symbol" id="symbol"></div><div class="caption" id="caption"></div></div></div><div class="content"><div class="small" id="small"></div><h2 id="title"></h2><div class="lead" id="lead"></div><div class="steps" id="steps"></div><div class="note" id="note"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="closepanel" id="closepanel">×</button><div class="label">TEACHER NOTE</div><h3 id="panelTitle"></h3><p id="panelText"></p></aside></main><script>(()=>{const p=new URLSearchParams(location.search),day=(p.get('day')||'Monday'),lesson=(p.get('lesson')||'community');const reads={Monday:['Sometimes I’m Bombaloo','Read 1 of 3 · What’s the story about?'],Tuesday:['Sometimes I’m Bombaloo','Read 2 of 3'],Wednesday:['Sometimes I’m Bombaloo','Read 3 of 3 · Character and connections'],Thursday:['The Rabbit Listened','Read 1 of 3 · What’s the story about?'],Friday:['The Rabbit Listened','Read 2 of 3']};const centers={Monday:['Dressing Up + Retelling Stories','Use fabric and clothespins to create pretend outfits. Practice retelling familiar stories in Library & Listening.','👗','Dramatic Play + Library'],Tuesday:['Being Scientists + Making Lines','Open Science & Engineering with the five senses and tools. In Writing & Drawing, experiment with straight, curved, thick, thin, and squiggly lines.','🔎','Science + Writing'],Wednesday:['Feeling Masks','Create masks that show an emotion, inspired by Sometimes I’m Bombaloo.','🎭','Art Studio'],Thursday:['Amazing Buildings','Build sturdy, amazing structures and notice what helps blocks stay balanced.','🏗️','Blocks'],Friday:['Center Review','Revisit this week’s new center choices and remind children where materials belong.','🧺','Centers']};const stories={Monday:['The Crumpled Picture','A child’s drawing gets crumpled by accident. Friends notice the big feeling and help without taking over.'],Tuesday:['The Quiet Scientist','Two children discover that careful looking and listening can reveal tiny things others miss.'],Wednesday:['The Mask With Two Feelings','A child makes a mask that looks happy on one side and worried on the other.'],Thursday:['The Wobbly Building','Friends keep trying different ideas until a tall block building can stand.'],Friday:['You Tell the Feeling Story','Children choose a feeling and invent what happened before, during, and after it.']};const closing={Monday:['Show Me a Feeling','Make one face that shows how you feel right now.'],Tuesday:['One Helpful Thing','Name or show one way a friend can help someone.'],Wednesday:['Bunny Goodbye','Take three tiny bunny sniffs and one slow breath out together.'],Thursday:['Listening Ears','Tell a partner one thing; the partner’s job is simply to listen.'],Friday:['We Can Help','Finish the week by naming one way our classroom takes care of each other.']};let data;if(lesson==='community'){data={head:'Community Meeting',small:'Week 3 Community Meeting',title:'Bunny Breath',lead:'Three little sniffs in through your nose, then one slow breath out through your mouth.',symbol:'🐰',caption:'Calm and energized',steps:['Sit with a straight back.','Take 3 quick bunny sniffs through your nose.','Breathe out slowly through your mouth.','Then choose: “What do you like to do with your family?” or “How can you help a friend?”','Finish with a name song.'],note:'Repeat the breathing 3–5 times. Choose the conversation prompt that is most accessible for your class.',teacher:'Focus on Pre-K Week 3 uses Bunny Breath, a family/helping conversation prompt, and name songs throughout Community Meeting.'}}else if(lesson==='read'){const r=reads[day]||reads.Monday;data={head:'Read Aloud',small:day+' · Week 3',title:r[0],lead:r[1],symbol:'📖',caption:'Book pages will be added later',steps:[day==='Monday'?'Notice Katie’s feelings and connect them to children’s experiences.':day==='Wednesday'?'Use words and illustrations to describe Katie and how her feelings change.':day==='Thursday'?'Notice how the animals try to help Taylor and how the rabbit is different.':'Follow today’s curriculum read and discussion stops.'],note:'Population mode: the correct title/read is wired now; scanned book-page visuals can be added during the final visual pass.',teacher:'The Week 3 sequence is Sometimes I’m Bombaloo Reads 1–3 Monday–Wednesday, then The Rabbit Listened Reads 1–2 Thursday–Friday.'}}else if(lesson==='centers'){const c=centers[day]||centers.Monday;data={head:'Today in Centers',small:day+' · Intro to Centers',title:c[0],lead:c[1],symbol:c[2],caption:c[3],steps:[],note:'This page is intentionally content-first. Final child-facing art can be swapped in later.',teacher:'Week 3 introductions: Day 1 Dressing Up and Retelling Stories; Day 2 Being Scientists and Making Lines; Day 3 Feeling Masks; Day 4 Amazing Buildings.'}}else if(lesson==='smallgroup'){data={head:'Small Group Time',small:'Knowledge Building',title:'Feelings Memory',lead:'Can you find two faces that show the same feeling?',symbol:'🙂',caption:'Feelings Memory',steps:['Turn over two cards.','Look at the faces. Do the feelings match?','Put matches in a community pile.','At the end, make a face that shows how you feel today.'],note:'If needed, keep cards face up and match the pairs.',teacher:'Focus on Pre-K Week 3 Knowledge Building uses a memory game with faces expressing different emotions.'}}else if(lesson==='story'){const s=stories[day]||stories.Monday;data={head:'Stories in Our Minds',small:day+' · Storytelling',title:s[0],lead:s[1],symbol:'💭',caption:'Teacher story + story acting',steps:['Tell the story naturally.','Invite children to picture it in their minds.','Act out one short part afterward.'],note:'EEA storytelling extension; visuals can be added in the final art pass.',teacher:'Focus on Pre-K calls for adults to tell a story each day in Week 3. This EEA story keeps that routine while connecting to the week’s themes.'}}else{const c=closing[day]||closing.Monday;data={head:'Ending Our Day Together',small:day+' · Closing Circle',title:c[0],lead:c[1],symbol:'❤️',caption:'Short end-of-day connection',steps:[],note:'EEA closing-circle extension.',teacher:'Keep this short, positive, and low-prep.'}}eyebrow.textContent='EARLY EAGLE ACADEMY · '+data.head.toUpperCase();heading.textContent=data.head;chip.textContent='WEEK 3 · '+day.toUpperCase();small.textContent=data.small;title.textContent=data.title;lead.textContent=data.lead;symbol.textContent=data.symbol;caption.textContent=data.caption;steps.innerHTML=(data.steps||[]).map(x=>'<div class="step">'+x+'</div>').join('');note.textContent=data.note||'';panelTitle.textContent=data.title;panelText.textContent=data.teacher||'';const back=()=>location.href='daily-lessons-v2.html';exit.onclick=done.onclick=back;teacher.onclick=()=>panel.classList.toggle('open');closepanel.onclick=()=>panel.classList.remove('open')})();</script></body></html>
