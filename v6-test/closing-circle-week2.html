<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 2 Closing Circle</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2.2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}button{font-family:inherit}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.5vh 5vw;display:grid;grid-template-columns:44% 1fr;gap:5vw;align-items:center}.visual{height:58vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;overflow:hidden}.scene{width:82%;height:78%;border-radius:28px;background:#fffdf8;border:1.5px solid #d7e4e1;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 8px 20px rgba(54,79,77,.07)}.scene .big{font-size:clamp(86px,8vw,150px);line-height:1}.spark{position:absolute;font-size:clamp(26px,2.2vw,42px)}.s1{left:12%;top:12%}.s2{right:12%;top:18%}.s3{left:18%;bottom:14%}.s4{right:16%;bottom:12%}.copy .eye{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px);text-transform:uppercase}.copy h2{font-size:clamp(44px,4.1vw,78px);line-height:1.02;margin:1vh 0;color:#164f7f}.body{font-size:clamp(22px,1.65vw,33px);line-height:1.35;color:#527673;font-weight:850;max-width:650px}.prompt{margin-top:2vh;padding:1.55vh 1.5vw;border-radius:20px;background:#e7f0ed;color:#416d61;font-size:clamp(24px,1.85vw,36px);font-weight:900;line-height:1.25;max-width:650px}.bottom{height:9vh;display:flex;justify-content:center;align-items:center}.teacher,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.teacher{background:#fffdf8;color:#245c78}.done{position:absolute;right:3.2vw;background:#668f99;color:#fff;border-color:#668f99;padding:1vh 1.8vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(520px,36vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1.2vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.45;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}#days{display:none!important}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · CLOSING CIRCLE</div><h1>Ending Our Day Together</h1></div><div class="actions"><div class="chip" id="weekChip">WEEK 2</div><button class="icon" id="exit" aria-label="Back to Today's Plan">×</button></div></div><div id="days" aria-hidden="true"><button data-i="0">Monday</button><button data-i="1">Tuesday</button><button data-i="2">Wednesday</button><button data-i="3">Thursday</button><button data-i="4">Friday</button></div><section class="card"><div class="visual"><div class="scene"><span class="spark s1" id="s1"></span><span class="spark s2" id="s2"></span><span class="big" id="big"></span><span class="spark s3" id="s3"></span><span class="spark s4" id="s4"></span></div></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><div class="body" id="body"></div><div class="prompt" id="prompt"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Note</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label">QUICK TEACHER NOTE</div><h3 id="noteTitle"></h3><p id="note"></p></aside></main><script>(()=>{const data=[{day:'Monday',eye:'Reflect',title:'One Good Thing',body:'Think of one good thing from our day.',prompt:'“One good thing today was…”',note:'Invite just a few friends to share so Closing Circle stays quick and happy.',big:'😊',sparks:['⭐','💛','⭐','💭']},{day:'Tuesday',eye:'Encourage',title:'Eagle High Five',body:'Turn toward a nearby friend and give them an air high-five.',prompt:'“Good job today!”',note:'No touching needed — make the high-five through the air.',big:'🙌',sparks:['⭐','💙','✨','⭐']},{day:'Wednesday',eye:'Be Silly',title:'Make Eddie Laugh!',body:'Eddie needs one last laugh before we go home.',prompt:'Show your silliest SILENT face!',note:'Everybody gets to be silly together for a few seconds.',big:'😆',sparks:['😂','✨','😜','⭐']},{day:'Thursday',eye:'Appreciate',title:'Thank You, Friend',body:'Think of someone who helped, played, shared, or was kind today.',prompt:'“Thank you, ___, for ___.”',note:'A few friends can share. Help with the words when they need them.',big:'💛',sparks:['🤝','⭐','😊','✨']},{day:'Friday',eye:'Celebrate',title:'Eagle Celebration!',body:'Hands in! Let’s celebrate finishing our week together.',prompt:'1… 2… 3… “WE HAD A GREAT WEEK!”',note:'Finish with a quick cheer and a little celebration.',big:'🎉',sparks:['⭐','👏','✨','💙']}];const params=new URLSearchParams(location.search),names=['monday','tuesday','wednesday','thursday','friday'];let day=names.indexOf((params.get('day')||'wednesday').toLowerCase());if(day<0)day=2;const target=params.get('from')==='plan'?'daily-lessons-v2.html':'daily-lessons.html';const $=id=>document.getElementById(id);function render(){const d=data[day];$('eye').textContent=d.day+' · '+d.eye;$('title').textContent=d.title;$('body').textContent=d.body;$('prompt').textContent=d.prompt;$('noteTitle').textContent=d.title;$('note').textContent=d.note;$('weekChip').textContent='WEEK 2 · '+d.day.toUpperCase();$('big').textContent=d.big;['s1','s2','s3','s4'].forEach((id,i)=>$(id).textContent=d.sparks[i]);$('panel').classList.remove('open')}document.querySelectorAll('#days button').forEach(b=>b.onclick=()=>{day=Number(b.dataset.i)||0;render()});$('teacher').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('exit').onclick=$('done').onclick=()=>location.href=target;render()})();</script></body></html>
