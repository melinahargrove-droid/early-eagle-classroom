<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 2 Closing Circle</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f1e6;color:#174f7d}.page{width:100vw;height:100vh;position:relative;background:radial-gradient(circle at 50% 5%,#fffdf8,#f6f0e4 60%,#e5efea)}.top{position:absolute;left:4%;right:4%;top:3%;display:flex;justify-content:space-between;align-items:center}.brand small{display:block;color:#78989a;font-weight:900;letter-spacing:.12em}.brand h1{margin:.4vh 0;font-size:clamp(32px,2.7vw,52px)}.week{background:#dcecef;color:#47798a;padding:.8vh 1.4vw;border-radius:999px;font-weight:900}.days{position:absolute;top:13%;left:50%;transform:translateX(-50%);display:flex;gap:.6vw}.days button{border:1px solid #bed0d3;background:#fffdf8;color:#587a78;border-radius:999px;padding:.75vh 1.1vw;font-weight:900;cursor:pointer}.days button.active{background:#668f99;color:#fff}.stage{position:absolute;left:8%;right:8%;top:20%;bottom:10%;background:rgba(255,254,249,.95);border:1.5px solid rgba(92,136,147,.2);border-radius:34px;box-shadow:0 18px 50px rgba(58,79,77,.08);display:grid;grid-template-columns:46% 1fr;gap:4vw;align-items:center;padding:5%}.visual{height:100%;display:flex;align-items:center;justify-content:center}.placeholder{width:min(31vw,500px);height:min(48vh,450px);border:2px dashed #bdd0cc;border-radius:34px;background:linear-gradient(145deg,#edf4ef,#f8f1e5);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#779395;font-size:clamp(18px,1.35vw,27px);font-weight:900}.copy .eye{color:#799597;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.copy h2{font-size:clamp(44px,4vw,76px);margin:1.2vh 0;line-height:1}.copy p{font-size:clamp(21px,1.55vw,30px);color:#557876;font-weight:800;line-height:1.4;max-width:38vw}.prompt{margin-top:2vh;background:#e7f0ec;color:#426f65;padding:1.5vh 1.6vw;border-radius:20px;font-size:clamp(23px,1.8vw,35px);font-weight:900;line-height:1.25}.note{margin-top:1.5vh;color:#678481;font-size:clamp(16px,1.05vw,21px);font-weight:800}.footer{position:absolute;left:4%;right:4%;bottom:3%;display:flex;justify-content:space-between;align-items:center}.footer button{border:0;border-radius:18px;padding:1.1vh 1.5vw;background:#668f99;color:white;font-size:clamp(14px,1vw,19px);font-weight:900;cursor:pointer}.dots{display:flex;gap:.6vw}.dot{width:13px;height:13px;border-radius:50%;background:#d2dfdc}.dot.active{background:#6f9da8}
</style></head><body><main class="page"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · CLOSING CIRCLE</small><h1>Ending Our Day Together</h1></div><div class="week" id="week">UNIT 1 · WEEK 2 · MONDAY</div></header><div class="days" id="days"><button>Monday</button><button>Tuesday</button><button>Wednesday</button><button>Thursday</button><button>Friday</button></div><section class="stage"><div class="visual"><div class="placeholder" id="pic"></div></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><p id="body"></p><div class="prompt" id="prompt"></div><div class="note" id="note"></div></div></section><div class="footer"><button id="prev">← Previous Day</button><div class="dots" id="dots"></div><button id="next">Next Day →</button></div></main><script>
const data=[
{eye:'Monday · Reflect',title:'One Good Thing',body:'Think of one good thing from our day.',prompt:'“One good thing today was…”',note:'Invite just a few friends to share so Closing Circle stays quick and happy.',pic:'Illustration: children remembering happy moments from their school day'},
{eye:'Tuesday · Encourage',title:'Eagle High Five',body:'Turn toward a nearby friend and give them an air high-five.',prompt:'“Good job today!”',note:'No touching needed — make the high-five through the air!',pic:'Illustration: two preschool friends giving a cheerful air high-five'},
{eye:'Wednesday · Be Silly',title:'Make Eddie Laugh!',body:'Eddie needs one last laugh before we go home.',prompt:'Show your silliest SILENT face!',note:'Everybody gets to be silly together for a few seconds.',pic:'Illustration: Eddie Eagle laughing at children making silly silent faces'},
{eye:'Thursday · Appreciate',title:'Thank You, Friend',body:'Think of someone who helped, played, shared, or was kind today.',prompt:'“Thank you, ___, for ___.”',note:'A few friends can share. Help with the words when they need them.',pic:'Illustration: one preschool child warmly thanking another friend'},
{eye:'Friday · Celebrate',title:'Eagle Celebration!',body:'Hands in! Let’s celebrate finishing our week together.',prompt:'1… 2… 3… “WE HAD A GREAT WEEK!”',note:'Finish with a quick cheer and a little celebration.',pic:'Illustration: Eddie and preschool friends stacking hands for a joyful team cheer'}];
let day=0;const btns=[...document.querySelectorAll('#days button')];function render(){const d=data[day];pic.textContent=d.pic;eye.textContent=d.eye;title.textContent=d.title;body.textContent=d.body;prompt.textContent=d.prompt;note.textContent=d.note;week.textContent='UNIT 1 · WEEK 2 · '+btns[day].textContent.toUpperCase();btns.forEach((b,i)=>b.classList.toggle('active',i===day));dots.innerHTML=data.map((_,i)=>`<span class="dot ${i===day?'active':''}"></span>`).join('');prev.style.visibility=day===0?'hidden':'visible';next.textContent=day===4?'Done ✓':'Next Day →'}btns.forEach((b,i)=>b.onclick=()=>{day=i;render()});prev.onclick=()=>{if(day>0){day--;render()}};next.onclick=()=>{if(day<4){day++;render()}else history.back()};render();
</script></body></html>
