<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Storytelling</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea);color:#174f7d}.page{height:100vh;padding:3vh 5vw}.top{height:9vh;font-weight:900;letter-spacing:.12em;color:#789697}.card{height:75vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:45% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.visual{height:56vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;font-size:26px;font-weight:900;color:#527673}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:54px;line-height:1;margin:1vh 0;color:#164f7f}.lead{font-size:23px;line-height:1.4;font-weight:900;color:#527673}.cue{margin-top:2vh;background:#e7f0ed;border-radius:18px;padding:1.4vh 1.2vw;font-size:18px;font-weight:900;color:#416d61}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.panel{display:none;position:fixed;right:4vw;top:10vh;width:42vw;max-height:78vh;overflow:auto;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:25px;padding:3vh 2vw;box-shadow:0 15px 35px #0002}.panel.open{display:block}.panel h2{color:#164f7f}.panel p{white-space:pre-line;font:17px/1.5 Georgia,serif;color:#3e5f5c}</style></head><body><main class="page"><div class="top">EARLY EAGLE ACADEMY · STORYTELLING · WEEK 7</div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="cue" id="cue"></div></div></section><div class="bottom"><button id="storyBtn">⌃ Teacher Story</button><button id="printBtn">🖨 Print Story</button><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></div><aside class="panel" id="panel"><h2 id="pt"></h2><p id="text"></p></aside></main><script>const d={Monday:{title:'The Name on the Little Blue Backpack',visual:'Visual placeholder: a little blue backpack with a child’s name written across the front.',lead:'Imagine finding something with another child’s name on it and discovering the family story connected to that name.',cue:'Visualize: the blue backpack, classroom cubbies, family pictures, coats, and the moment the owner recognizes their name.',text:`A child named Lena finds a little blue backpack on the classroom floor. A name is written carefully across the front, but it is not Lena’s name. Lena wonders who the backpack belongs to. She looks around the classroom, noticing the cubbies, family pictures, coats, and friends. Finally, she hears a friend say, “That’s my name!” Lena carries the backpack over and learns that the friend was named for someone special in their family.\n\nStory Acting: Lena, backpack owner, and several classroom friends.`},Tuesday:{title:'The Picture in Mateo’s Pocket',visual:'Visual placeholder: a folded family photograph peeking from beneath a classroom chair.',lead:'Picture a treasured family photo getting lost in the classroom and two friends searching together to find it.',cue:'Visualize: the blocks, art shelf, dramatic play kitchen, the hidden picture, and the people Mateo describes.',text:`Mateo comes to school with a folded family picture tucked safely in his pocket. During Centers, the picture slips out and lands beneath a table. Mateo searches near the blocks, the art shelf, and the dramatic play kitchen. His friend Nia notices something colorful peeking from under a chair. Together they find the picture. Mateo unfolds it and tells Nia about the people in his family and a funny afternoon they spent together.\n\nStory Acting: Mateo, Nia, family members from the photograph, and classroom friends.`},Wednesday:{title:'Amara’s Very Special Hair Day',visual:'Visual placeholder: Amara looking in a mirror while trying several special hairstyles.',lead:'Imagine choosing a hairstyle that feels special and trying again until the reflection feels just right.',cue:'Visualize: soft curls, two puffs, colorful clips, a bright headband, Dad helping, and Amara’s final smile.',text:`Amara wakes up excited because her aunt is coming to visit. She wants to choose a hairstyle that feels special. She looks in the mirror and gently touches her soft curls. First she imagines two puffs. Then she imagines colorful clips. Then she wonders how a bright headband might look. Her dad helps her try one idea, but Amara looks in the mirror and decides it does not feel quite right. They try again together. At last Amara smiles at her reflection because the hairstyle feels exactly like her.\n\nStory Acting: Amara, Dad, and Aunt.`},Thursday:{title:'The Morning the Brush Went Missing',visual:'Visual placeholder: a child and sibling searching a bedroom and bathroom for a missing hairbrush.',lead:'Imagine getting ready in the morning when an important hair-care tool suddenly disappears.',cue:'Visualize: the sink, towel, shoes, bed, basket of books, and the family retracing their steps together.',text:`Jordan is getting ready in the morning when the hairbrush is nowhere to be found. Jordan checks beside the sink, under a towel, near the shoes, and beside the bed. A younger sibling joins the search. They remember that the brush was used the night before while everyone was getting ready for bed. Together they retrace their steps until they find it beside a basket of books. Jordan laughs, brushes their hair, and thanks the sibling for helping.\n\nStory Acting: Jordan, sibling, and a family member.`},Friday:{title:'Child Storyteller Day',visual:'Visual placeholder: a child storyteller sharing while classmates prepare to act out the story.',lead:'Today the child is the storyteller. The adult helps develop the story without taking it over.',cue:'Prompts: Who is in your story? Where are they? What happens first? What happens next? How does the character feel? How does it end?',text:`Invite one child to tell a short story connected to something meaningful in their own life. It may be true or imaginary.\n\nUse gentle prompts only as needed. Repeat the child’s words when needed so the group can follow the story. Then choose classmates to act out the child’s story while the child storyteller watches and helps guide the action.`}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday;eye.textContent=day.toUpperCase()+(day==='Friday'?' · CHILD STORYTELLER':' · TEACHER STORY');title.textContent=x.title;visual.textContent=x.visual;lead.textContent=x.lead;cue.textContent=x.cue;pt.textContent=x.title;text.textContent=x.text;if(day==='Friday'){storyBtn.textContent='⌃ Teacher Prompt';printBtn.textContent='🖨 Print Prompt'}storyBtn.onclick=()=>panel.classList.toggle('open');printBtn.onclick=()=>{const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>${x.title}</title><style>@page{size:letter;margin:.65in}body{font-family:Georgia,serif;color:#243d4d;max-width:7.2in;margin:auto}small{font-family:Arial,sans-serif;font-weight:bold;letter-spacing:.12em;color:#66858b}h1{font-size:30pt;color:#174f7d;margin:10px 0 6px}.day{font:700 12pt Arial,sans-serif;color:#66858b;margin-bottom:22px}.story{white-space:pre-line;font-size:14.5pt;line-height:1.48}footer{margin-top:24px;border-top:1px solid #ccd8d6;padding-top:10px;font:10pt Arial,sans-serif;color:#789}</style></head><body><small>EARLY EAGLE ACADEMY · UNIT 1 · WEEK 7 · STORYTELLING</small><h1>${x.title}</h1><div class="day">${day}</div><div class="story">${x.text}</div><footer>${day==='Friday'?'Child Storytelling Prompt':'Teacher Story · Tell naturally and allow children to make the pictures in their minds.'}</footer><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};</script></body></html>
