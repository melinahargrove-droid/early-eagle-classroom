<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Storytelling and Story Acting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1050px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697}h1,h2{color:#165487}.card p,.card li{font-size:19px;line-height:1.5;font-weight:750;color:#55747b}.box{background:#e7f0ed;border-radius:18px;padding:18px;margin:16px 0}.prompt{background:#fff4d6;border-radius:18px;padding:18px;margin:16px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Storytelling & Story Acting</h1><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'The Name on the Little Blue Backpack',html:`<div class="box"><b>EEA-created teacher story • 3–5 minutes</b><br>Tell slowly and descriptively so children can make pictures in their minds.</div><p>A child named Lena finds a little blue backpack on the classroom floor. A name is written carefully across the front, but it is not Lena’s name. Lena wonders who the backpack belongs to. She looks around the classroom, noticing the cubbies, family pictures, coats, and friends. Finally, she hears a friend say, “That’s my name!” Lena carries the backpack over and learns that the friend was named for someone special in their family.</p><div class="prompt"><b>Visualization invitations:</b> What did the little blue backpack look like in your mind? What did you imagine Lena saw while she looked around the classroom?</div><p><b>Story Acting:</b> Lena, backpack owner, and several classroom friends.</p>`},Tuesday:{title:'The Picture in Mateo’s Pocket',html:`<div class="box"><b>EEA-created teacher story • 3–5 minutes</b><br>Encourage children to picture the people, places, and small details as they listen.</div><p>Mateo comes to school with a folded family picture tucked safely in his pocket. During Centers, the picture slips out and lands beneath a table. Mateo searches near the blocks, the art shelf, and the dramatic play kitchen. His friend Nia notices something colorful peeking from under a chair. Together they find the picture. Mateo unfolds it and tells Nia about the people in his family and a funny afternoon they spent together.</p><div class="prompt"><b>Visualization invitations:</b> What did you picture on Mateo’s family photo? Where did you imagine the picture hiding?</div><p><b>Story Acting:</b> Mateo, Nia, family members from the photograph, and classroom friends.</p>`},Wednesday:{title:'Amara’s Very Special Hair Day',html:`<div class="box"><b>EEA-created teacher story • 3–5 minutes</b><br>Use sensory words and pauses that invite children to visualize.</div><p>Amara wakes up excited because her aunt is coming to visit. She wants to choose a hairstyle that feels special. She looks in the mirror and gently touches her soft curls. First she imagines two puffs. Then she imagines colorful clips. Then she wonders how a bright headband might look. Her dad helps her try one idea, but Amara looks in the mirror and decides it does not feel quite right. They try again together. At last Amara smiles at her reflection because the hairstyle feels exactly like her.</p><div class="prompt"><b>Visualization invitations:</b> What hairstyles did you picture Amara trying? What did her face look like when she finally loved her hair?</div><p><b>Story Acting:</b> Amara, Dad, and Aunt.</p>`},Thursday:{title:'The Morning the Brush Went Missing',html:`<div class="box"><b>EEA-created teacher story • 3–5 minutes</b><br>Invite children to imagine the search and predict where the brush might be.</div><p>Jordan is getting ready in the morning when the hairbrush is nowhere to be found. Jordan checks beside the sink, under a towel, near the shoes, and beside the bed. A younger sibling joins the search. They remember that the brush was used the night before while everyone was getting ready for bed. Together they retrace their steps until they find it beside a basket of books. Jordan laughs, brushes their hair, and thanks the sibling for helping.</p><div class="prompt"><b>Visualization invitations:</b> Where did you picture Jordan searching? What did the room look like in your mind?</div><p><b>Story Acting:</b> Jordan, sibling, and a family member.</p>`},Friday:{title:'Child Storyteller Day',html:`<div class="box"><b>EEA-created child storytelling support</b><br>Today the child is the storyteller. The adult helps the child develop the story without taking it over.</div><p>Invite one child to tell a short story connected to something meaningful in their own life. It may be true or imaginary.</p><div class="prompt"><b>Gentle prompts:</b><ul><li>Who is in your story?</li><li>Where are they?</li><li>What happens first?</li><li>What happens next?</li><li>How does the character feel?</li><li>How does your story end?</li></ul></div><p>Repeat the child’s words when needed so the group can follow the story. Then choose classmates to act out the child’s story while the child storyteller watches and helps guide the action.</p>`}}[day];tag.textContent='WEEK 7 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
