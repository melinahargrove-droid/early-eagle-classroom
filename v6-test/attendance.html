<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dbe6e6}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#173f72}.stage{position:relative;width:100vw;height:100vh;overflow:hidden}.school-board,.theme-board{position:absolute;inset:0}.school-board[hidden],.theme-board[hidden]{display:none!important}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.roster{position:absolute;left:3%;top:22.2%;width:30.2%;height:55.2%;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);column-gap:6%;row-gap:.8%}.roster-slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.student{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .16s}.student:hover{transform:scale(1.035)}.student:active{transform:scale(.97)}.photo{width:73%;aspect-ratio:1;border-radius:50%;border:2.5px solid #789fc0;background:#fbfcfb;display:flex;align-items:center;justify-content:center;color:#7b92a4;font-weight:800;overflow:hidden}.photo img,.bus-photo img,.theme-photo img{width:100%;height:100%;object-fit:cover}.photo.no-photo,.bus-photo.no-photo{opacity:.18}.name{width:97%;height:18%;margin-top:4%;border:1.5px solid #7da1bf;border-radius:999px;background:#fffaf0;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,.72vw,15px);font-weight:900;white-space:nowrap}.busgrid{position:absolute;left:37.5%;top:38.7%;width:50%;height:25.2%;z-index:6;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(2,1fr);column-gap:.7%;row-gap:5%}.bus-slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.bus-child{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:1%;text-align:center;cursor:pointer}.bus-photo{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #789fc0;background:#fffaf0;display:flex;align-items:center;justify-content:center;color:#7b92a4;font-weight:800;font-size:clamp(9px,.66vw,13px);overflow:hidden}.bus-name{margin-top:2.5%;width:100%;padding:.16em .12em .19em;border:1px solid #7da1bf;border-radius:999px;background:#fffaf0;font-size:clamp(9px,.62vw,12px);font-weight:900;white-space:nowrap;text-align:center}.counter{position:absolute;left:77.2%;top:5.3%;width:17.6%;height:10.8%;z-index:7;display:flex;align-items:center;justify-content:center;font-weight:900}.counter .num{min-width:1.2em;text-align:right;font-size:clamp(28px,2.35vw,48px)}.counter .words{margin-left:.58em;transform:translateX(7%);font-size:clamp(12px,.92vw,19px);line-height:1.02}.reset-hit{position:absolute;right:4.2%;bottom:4%;width:15.3%;height:8.6%;z-index:8;border:0;background:transparent;cursor:pointer}.photo-toggle{position:absolute;top:3%;right:6.2%;z-index:40;border:1.7px solid #789fc0;border-radius:999px;background:#fffaf0;color:#173f72;padding:.65vh .95vw;font-size:clamp(11px,.75vw,15px);font-weight:900;cursor:pointer;box-shadow:0 4px 10px #173f7215}.photo-toggle.off{opacity:.72}.close-btn{position:absolute;top:2.1%;right:1.8%;width:3.4%;aspect-ratio:1;z-index:40;border:2px solid #789fc0;border-radius:50%;background:#fffaf0;color:#173f72;font-size:clamp(22px,1.8vw,36px);font-weight:700;cursor:pointer}.fly{position:fixed;z-index:9999;pointer-events:none;border-radius:50%;border:3px solid #789fc0;background:#fffaf0;display:flex;align-items:center;justify-content:center;color:#7b92a4;font-weight:900;overflow:hidden;transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),width .55s,height .55s}.fly img{width:100%;height:100%;object-fit:cover}.empty-roster{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:50;width:min(560px,70vw);padding:28px 34px;border:2px solid #789fc0;border-radius:24px;background:#fffaf0ef;text-align:center;box-shadow:0 12px 30px #173f7224;font-size:clamp(17px,1.3vw,24px);font-weight:800;line-height:1.35}.empty-roster strong{display:block;font-size:1.35em;margin-bottom:8px}.empty-roster button{margin-top:18px;border:2px solid #789fc0;border-radius:14px;background:#edf5f5;color:#173f72;padding:10px 18px;font-weight:900;cursor:pointer}
/* Shared themed attendance board. This preserves EEA attendance state while themes control presentation. */
.theme-board{background:linear-gradient(180deg,var(--sky,#d9eef7) 0 57%,var(--ground,#d8e7c4) 57% 100%);color:var(--ink,#173f72)}.theme-board:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 14% 18%,rgba(255,255,255,.7),transparent 18%),radial-gradient(circle at 82% 10%,rgba(255,255,255,.55),transparent 18%);pointer-events:none}.theme-head{position:absolute;left:5%;right:8%;top:4.8%;z-index:5;display:flex;align-items:flex-start;justify-content:space-between}.theme-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(40px,3.7vw,70px);font-weight:800;line-height:1;color:#173f72}.theme-subtitle{margin-top:.7vh;font-size:clamp(16px,1.15vw,23px);font-weight:800;color:#5d746c}.theme-count{background:rgba(255,253,247,.91);border:2px solid rgba(77,113,126,.2);border-radius:24px;padding:1.1vh 1.25vw;text-align:center;min-width:150px;box-shadow:0 7px 18px rgba(44,72,82,.08)}.theme-count b{display:block;font-size:clamp(28px,2.2vw,46px)}.theme-count span{font-size:clamp(10px,.72vw,14px);font-weight:900;color:#6b7a73;text-transform:uppercase;letter-spacing:.08em}.theme-waiting{position:absolute;left:4.2%;top:22%;width:57%;height:68%;z-index:4;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:1.5% 1.2%}.theme-slot{display:flex;align-items:center;justify-content:center}.theme-token{position:relative;width:94%;height:92%;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}.theme-token:hover{transform:scale(1.035)}.theme-token:active{transform:scale(.97)}.theme-shape{position:relative;width:74%;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(38px,3.3vw,64px);filter:drop-shadow(0 5px 5px rgba(75,66,48,.12))}.theme-photo{position:absolute;width:58%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.9);background:#fff8ef;box-shadow:0 3px 7px rgba(50,65,60,.15)}.theme-initial{position:absolute;width:58%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:3px solid rgba(255,255,255,.9);background:#fff8ef;color:#173f72;font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:clamp(18px,1.45vw,30px)}.theme-name{margin-top:-.3vh;padding:.35vh .65vw;border-radius:999px;background:rgba(255,253,247,.94);border:1.5px solid rgba(86,113,121,.25);font-size:clamp(10px,.72vw,15px);font-weight:900;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.theme-destination{position:absolute;right:4.2%;top:28%;width:31%;height:54%;z-index:3;border-radius:32px;background:rgba(255,250,238,.78);border:2px solid rgba(83,111,112,.16);box-shadow:0 9px 24px rgba(63,79,69,.08);display:flex;flex-direction:column;align-items:center;padding:2vh 1.4vw}.dest-art{font-size:clamp(70px,7vw,130px);line-height:1}.dest-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,1.8vw,36px);font-weight:800;margin-top:.3vh}.dest-sub{font-size:clamp(12px,.82vw,16px);font-weight:800;color:#6d7b73;margin:.4vh 0 1vh}.theme-present{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(44px,1fr);gap:.5vh .45vw;overflow:auto}.present-chip{border-radius:14px;background:rgba(255,255,255,.78);border:1.4px solid rgba(87,114,118,.2);display:flex;align-items:center;justify-content:center;padding:.25vh .35vw;font-size:clamp(9px,.63vw,13px);font-weight:900;text-align:center;cursor:pointer}.theme-reset{position:absolute;right:5%;bottom:4.5%;z-index:6;border:1.7px solid rgba(84,111,120,.25);border-radius:14px;background:rgba(255,253,247,.92);color:#173f72;padding:.9vh 1vw;font-weight:900;cursor:pointer}
/* Theme palettes */
.theme-apple-orchard{--sky:#dceff7;--ground:#d8e8bb}.theme-fall-leaves{--sky:#d9ebf4;--ground:#e5c58b}.theme-pumpkin-patch{--sky:#dceef5;--ground:#dec28d}.theme-turkey-friends{--sky:#ddeff6;--ground:#d8bd8f}.theme-christmas-tree{--sky:#e4f0f1;--ground:#d7e3db}.theme-snowglobe{--sky:#deedf7;--ground:#eef4f8}.theme-valentine-mailbox{--sky:#fde9ee;--ground:#f4d9df}.theme-spring-garden{--sky:#dceff7;--ground:#d8e9bf}.theme-caterpillar-butterfly{--sky:#dceff7;--ground:#dce9bc}.theme-camping{--sky:#cbdff2;--ground:#bed2ad}.theme-frog-pond{--sky:#d9eef4;--ground:#bed9be}
</style></head><body><div class="stage"><button class="photo-toggle" id="photoToggle" type="button">Photos On</button><button class="close-btn" id="closeBtn" aria-label="Close">×</button>
<div class="school-board" id="schoolBoard"><img class="bg" src="assets/attendance-background.png" alt=""><div class="roster" id="roster"></div><div class="busgrid" id="busgrid"></div><div class="counter"><span class="num" id="count">0</span><span class="words">friends<br>here</span></div><button class="reset-hit" id="resetBtn" aria-label="Reset attendance"></button></div>
<div class="theme-board" id="themeBoard" hidden><div class="theme-head"><div><div class="theme-title" id="themeTitle">Good Morning!</div><div class="theme-subtitle" id="themeSubtitle">Tap your name when you arrive.</div></div><div class="theme-count"><b id="themeCount">0</b><span>Friends Here</span></div></div><div class="theme-waiting" id="themeWaiting"></div><aside class="theme-destination"><div class="dest-art" id="destArt">🍎</div><div class="dest-title" id="destTitle">Our Class</div><div class="dest-sub" id="destSub">We’re glad you’re here!</div><div class="theme-present" id="themePresent"></div></aside><button class="theme-reset" id="themeReset">↻ Reset Attendance</button></div>
</div><script src="star-engine.js"></script><script>
const STUDENT_KEY='eea-students-v1',ATTENDANCE_KEY='eea-attendance-present',ATTENDANCE_DATE_KEY='eea-attendance-date',SETTINGS_KEY='eea-app-settings',MORNING_KEY='eea-last-morning-attendance-date',THEME_KEY='eea-attendance-theme';
const THEMES={
'apple-orchard':{name:'Apple Orchard',icon:'🍎',dest:'🧺',title:'Good Morning!',sub:'Tap your apple to check in!',destTitle:'Our Class',destSub:'We’re glad you’re here!'},
'fall-leaves':{name:'Fall Leaves',icon:'🍂',dest:'🍁',title:'Who’s Here Today?',sub:'Tap your leaf when you arrive.',destTitle:'Friends Here',destSub:'Colorful mornings together.'},
'pumpkin-patch':{name:'Pumpkin Patch',icon:'🎃',dest:'🛒',title:'Who’s Here Today?',sub:'Tap your pumpkin to check in!',destTitle:'Our Patch',destSub:'Fall friends. Bright beginnings.'},
'turkey-friends':{name:'Turkey Friends',icon:'🦃',dest:'🪶',title:'Who’s Here Today?',sub:'Tap your turkey when you arrive.',destTitle:'Turkey Friends',destSub:'Gobble up a great day.'},
'christmas-tree':{name:'Christmas Tree',icon:'🎄',dest:'⭐',title:'Good Morning!',sub:'Tap your tree to check in!',destTitle:'Our Class',destSub:'A merry little morning.'},
'snowglobe':{name:'Snowglobe',icon:'❄️',dest:'☃️',title:'Who’s Here Today?',sub:'Tap your snowflake when you arrive.',destTitle:'Friends Here',destSub:'Snowy starts and warm welcomes.'},
'valentine-mailbox':{name:'Valentine Mailbox',icon:'💌',dest:'📫',title:'Good Morning!',sub:'Tap your valentine to check in!',destTitle:'Our Mailbox',destSub:'Little friends. Big hearts.'},
'spring-garden':{name:'Spring Garden',icon:'🌷',dest:'🌼',title:'Who’s Here Today?',sub:'Tap your flower when you arrive.',destTitle:'Our Garden',destSub:'Grow into a beautiful day.'},
'caterpillar-butterfly':{name:'Caterpillar → Butterfly',icon:'🐛',dest:'🦋',title:'Who’s Here Today?',sub:'Tap your caterpillar to check in.',destTitle:'Our Butterflies',destSub:'Watch our classroom grow.'},
'camping':{name:'Camping',icon:'🏕️',dest:'🔥',title:'Good Morning, Campers!',sub:'Tap your tent when you arrive.',destTitle:'Camp Friends',destSub:'Adventure starts here.'},
'frog-pond':{name:'Frog Pond',icon:'🐸',dest:'🪷',title:'Who’s Here Today?',sub:'Tap your frog when you arrive.',destTitle:'Our Pond',destSub:'Hop into a happy morning.'}
};
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
localStorage.removeItem(MORNING_KEY);
function loadStudents(){try{const x=JSON.parse(localStorage.getItem(STUDENT_KEY)||'[]');if(Array.isArray(x))return x.filter(s=>s&&s.active!==false&&String(s.name||'').trim()).map((s,i)=>({id:String(s.id||('s'+i)),name:String(s.name).trim(),photo:s.photo||'',audio:s.audio||''}))}catch(e){}return []}
function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')||{}}catch(e){return {}}}
function savePhotoSetting(value){const s=loadSettings();s.showPhotos=value;localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
const students=loadStudents(),settings=loadSettings(),present=[];let showPhotos=settings.showPhotos!==false;const selectedTheme=localStorage.getItem(THEME_KEY)||'school-bus',isSchoolBus=selectedTheme==='school-bus'||!THEMES[selectedTheme],theme=THEMES[selectedTheme];const roster=document.getElementById('roster'),busgrid=document.getElementById('busgrid'),count=document.getElementById('count'),photoToggle=document.getElementById('photoToggle');
function studentById(id){return students.find(s=>s.id===id)}function initials(name){const p=String(name||'').trim().split(/\s+/);return p.length>1?(p[0][0]+p[p.length-1][0]).toUpperCase():(p[0]?.[0]||'?').toUpperCase()}
function photoHTML(s,cls){if(showPhotos&&s.photo)return `<div class="${cls}"><img src="${s.photo}" alt="${s.name}"></div>`;return `<div class="${cls} no-photo"></div>`}
function makeRosterCard(id){const s=studentById(id),e=document.createElement('div');e.className='student';e.dataset.id=id;e.innerHTML=`${photoHTML(s,'photo')}<div class="name">${s.name}</div>`;e.onclick=()=>checkIn(id,e);return e}
function makeBusCard(id){const s=studentById(id),e=document.createElement('div');e.className='bus-child';e.dataset.id=id;e.innerHTML=`${photoHTML(s,'bus-photo')}<div class="bus-name">${s.name}</div>`;e.onclick=()=>checkOut(id,e);return e}
function updatePhotoToggle(){photoToggle.textContent=showPhotos?'Photos On':'Photos Off';photoToggle.classList.toggle('off',!showPhotos);photoToggle.setAttribute('aria-pressed',String(showPhotos))}
function saveAttendance(){localStorage.setItem(ATTENDANCE_KEY,JSON.stringify(present));localStorage.setItem(ATTENDANCE_DATE_KEY,todayKey());localStorage.setItem('eea-attendance-count',String(present.length))}
function renderSchool(hiddenId=null){roster.innerHTML='';students.forEach(s=>{const slot=document.createElement('div');slot.className='roster-slot';if(!present.includes(s.id)){const e=makeRosterCard(s.id);if(s.id===hiddenId)e.style.visibility='hidden';slot.appendChild(e)}roster.appendChild(slot)});busgrid.innerHTML='';students.forEach((_,i)=>{const slot=document.createElement('div');slot.className='bus-slot';if(i<present.length){const id=present[i],child=makeBusCard(id);if(id===hiddenId)child.style.visibility='hidden';slot.appendChild(child)}busgrid.appendChild(slot)});count.textContent=present.length}
function themeVisual(s){const inner=showPhotos&&s.photo?`<div class="theme-photo"><img src="${s.photo}" alt="${s.name}"></div>`:`<div class="theme-initial">${initials(s.name)}</div>`;return `<div class="theme-shape">${theme.icon}${inner}</div><div class="theme-name">${s.name}</div>`}
function renderTheme(){document.getElementById('themeCount').textContent=present.length;const waiting=document.getElementById('themeWaiting'),arrived=document.getElementById('themePresent');waiting.innerHTML='';arrived.innerHTML='';students.forEach(s=>{const slot=document.createElement('div');slot.className='theme-slot';if(!present.includes(s.id)){const b=document.createElement('button');b.className='theme-token';b.dataset.id=s.id;b.innerHTML=themeVisual(s);b.onclick=()=>checkInTheme(s.id);slot.appendChild(b)}waiting.appendChild(slot)});present.forEach(id=>{const s=studentById(id);if(!s)return;const chip=document.createElement('button');chip.className='present-chip';chip.textContent=s.name;chip.onclick=()=>checkOutTheme(id);arrived.appendChild(chip)})}
function render(hiddenId=null){if(isSchoolBus)renderSchool(hiddenId);else renderTheme();updatePhotoToggle();saveAttendance()}
function animate(a,b,s,done){const f=document.createElement('div');f.className='fly';if(showPhotos&&s.photo)f.innerHTML=`<img src="${s.photo}" alt="${s.name}">`;Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(f.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'})));setTimeout(()=>{f.remove();done()},575)}
function checkIn(id,src){if(present.includes(id))return;const a=src.getBoundingClientRect();present.push(id);render(id);const t=busgrid.children[present.length-1].querySelector('.bus-child'),b=t.getBoundingClientRect();animate(a,b,studentById(id),()=>t.style.visibility='')}
function checkOut(id,src){const i=present.indexOf(id);if(i<0)return;const a=src.getBoundingClientRect();present.splice(i,1);render(id);const idx=students.findIndex(s=>s.id===id),t=roster.children[idx].querySelector('.student'),b=t.getBoundingClientRect();animate(a,b,studentById(id),()=>t.style.visibility='')}
function checkInTheme(id){if(present.includes(id))return;present.push(id);render()}
function checkOutTheme(id){const i=present.indexOf(id);if(i<0)return;present.splice(i,1);render()}
photoToggle.onclick=()=>{showPhotos=!showPhotos;savePhotoSetting(showPhotos);render()};document.getElementById('resetBtn').onclick=()=>{present.length=0;render()};document.getElementById('themeReset').onclick=()=>{present.length=0;render()};document.getElementById('closeBtn').onclick=()=>{localStorage.setItem(MORNING_KEY,todayKey());if(window.EEAStar)window.EEAStar.resolveToday();window.location.href='index.html'};
if(localStorage.getItem(ATTENDANCE_DATE_KEY)===todayKey()){try{const saved=JSON.parse(localStorage.getItem(ATTENDANCE_KEY)||'[]');saved.forEach(v=>{let id=String(v);if(/^\d+$/.test(id)){const oldIndex=Number(id);if(students[oldIndex])id=students[oldIndex].id}if(studentById(id)&&!present.includes(id))present.push(id)})}catch(e){}}
if(!isSchoolBus){document.getElementById('schoolBoard').hidden=true;const board=document.getElementById('themeBoard');board.hidden=false;board.classList.add('theme-'+selectedTheme);document.getElementById('themeTitle').textContent=theme.title;document.getElementById('themeSubtitle').textContent=theme.sub;document.getElementById('destArt').textContent=theme.dest;document.getElementById('destTitle').textContent=theme.destTitle;document.getElementById('destSub').textContent=theme.destSub}
if(!students.length){const note=document.createElement('div');note.className='empty-roster';note.innerHTML='<strong>No students in this class yet</strong>Add your class roster in Teacher’s Desk before taking attendance.<br><button type="button">Open Students</button>';note.querySelector('button').onclick=()=>location.href='students.html';document.querySelector('.stage').appendChild(note);photoToggle.disabled=true}
render();
</script></body></html>
