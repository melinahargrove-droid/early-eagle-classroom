mentById('count');function makeRosterCard(id){const e=document.createElement('div');e.className='student';e.dataset.id=id;e.innerHTML=`<div class="photo">Photo</div><div class="name">${names[id]}</div>`;e.onclick=()=>checkIn(id,e);return e}function makeBusCard(id){const e=document.createElement('div');e.className='bus-child';e.dataset.id=id;e.innerHTML=`<div class="bus-photo">Photo</div><div class="bus-name">${names[id]}</div>`;e.onclick=()=>checkOut(id,e);return e}function render(hiddenId=null){roster.innerHTML='';for(let id=0;id<names.length;id++){const slot=document.createElement('div');slot.className='roster-slot';if(!present.includes(id)){const e=makeRosterCard(id);if(id===hiddenId)e.style.visibility='hidden';slot.appendChild(e)}roster.appendChild(slot)}busgrid.innerHTML='';for(let i=0;i<20;i++){const slot=document.createElement('div');slot.className='bus-slot';if(i<present.length){const id=present[i],child=makeBusCard(id);if(id===hiddenId)child.style.visibility='hidden';slot.appendChild(child)}busgrid.appendChild(slot)}count.textContent=present.length;localStorage.setItem('eea-attendance-present',JSON.stringify(present));localStorage.setItem('eea-attendance-count',String(present.length))}function animate(a,b,done){const f=document.createElement('div');f.className='fly';f.textContent='Photo';Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(f.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'})));setTimeout(()=>{f.remove();done()},575)}function checkIn(id,src){if(present.includes(id))return;const a=src.getBoundingClientRect();present.push(id);render(id);const t=busgrid.children[present.length-1].querySelector('.bus-child'),b=t.getBoundingClientRect();animate(a,b,()=>t.style.visibility='')}function checkOut(id,src){const i=present.indexOf(id);if(i<0)return;const a=src.getBoundingClientRect();present.splice(i,1);render(id);const t=roster.children[id].querySelector('.student'),b=t.getBoundingClientRect();animate(a,b,()=>t.style.visibility='')}document.getElementById('resetBtn').onclick=()=>{present.length=0;render()};document.getElementById('closeBtn').onclick=()=>window.location.href='index.html';try{const saved=JSON.parse(localStorage.getItem('eea-attendance-present')||'[]');saved.forEach(id=>{if(Number.isInteger(id)&&id>=0&&id<20&&!present.includes(id))present.push(id)})}catch(e){}render();</script></body></html>
