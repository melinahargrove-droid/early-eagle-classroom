<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Calm Down</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#cbd7d1;color:#173f72}button{font:inherit}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#cbd7d1 url('assets/calm down waterfall.png') center/cover no-repeat}.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,248,242,.04),rgba(80,104,94,.06));pointer-events:none}.close{position:absolute;z-index:50;right:2vw;top:2.3vh;width:clamp(52px,3.8vw,72px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(73,97,102,.28);background:rgba(255,253,247,.9);color:#173f72;font-size:clamp(27px,2.1vw,39px);font-weight:900;cursor:pointer;box-shadow:0 6px 16px rgba(42,61,63,.11)}
.welcome,.activity-card,.finish-card{position:absolute;z-index:20;left:50%;transform:translate(-50%,-50%);text-align:center;border-radius:36px;background:linear-gradient(180deg,rgba(255,253,247,.80),rgba(247,244,234,.70));border:1.6px solid rgba(103,119,109,.16);box-shadow:0 16px 34px rgba(45,63,60,.10),inset 0 0 0 5px rgba(255,255,255,.16);backdrop-filter:blur(2px)}
.welcome{top:58%;width:min(64vw,980px);padding:4vh 5vw 4.3vh;opacity:0;animation:softIn 1.6s ease .45s forwards}.welcome h1,.finish-card h1{margin:0;color:#41675f;font-size:clamp(38px,3.2vw,62px);line-height:1.08;font-weight:900}.welcome p,.finish-card p{margin:1.25vh 0 0;color:#657f77;font-size:clamp(18px,1.35vw,27px);font-weight:800}.begin,.return-btn{margin-top:2.7vh;min-width:min(30vw,480px);height:clamp(66px,8vh,92px);padding:0 3vw;border-radius:28px;border:2px solid rgba(80,111,103,.18);background:linear-gradient(180deg,#8faea2,#738f86);color:#fff;font-size:clamp(28px,2vw,39px);font-weight:900;cursor:pointer;box-shadow:0 7px 0 rgba(69,91,84,.15),0 12px 19px rgba(45,66,59,.09)}
.hidden{display:none!important}.activity-card{top:52%;width:min(58vw,900px);min-height:46vh;padding:3.5vh 4vw 3vh;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .55s ease,transform .55s ease}.activity-card.show{opacity:1;transform:translate(-50%,-50%)}.step-label{position:absolute;top:2.2vh;left:2vw;padding:.7vh 1vw;border-radius:999px;background:rgba(118,145,135,.15);color:#55736a;font-weight:900;font-size:clamp(14px,1vw,19px);letter-spacing:.04em;text-transform:uppercase}.step-count{position:absolute;top:2.2vh;right:2vw;color:#6d807a;font-size:clamp(13px,.9vw,17px);font-weight:900}.visual{height:16vh;min-height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:1.2vh}.visual-main{font-size:clamp(74px,7vw,132px);line-height:1;filter:drop-shadow(0 5px 8px rgba(45,66,59,.12));transform-origin:center}.pulse{animation:breathePulse 8s ease-in-out infinite}.float{animation:floatSlow 5s ease-in-out infinite}.activity-title{margin:0;color:#315f57;font-size:clamp(32px,2.7vw,52px);font-weight:900;line-height:1.08}.activity-copy{margin:1.4vh auto 0;max-width:760px;color:#526f68;font-size:clamp(20px,1.55vw,30px);font-weight:800;line-height:1.35}.cue{margin-top:2.2vh;min-height:1.4em;color:#315f57;font-size:clamp(28px,2.2vw,42px);font-weight:900}.progress{position:absolute;z-index:25;left:50%;bottom:2.1vh;transform:translateX(-50%);display:flex;gap:.65vw;align-items:center}.dot{width:clamp(11px,.8vw,16px);aspect-ratio:1;border-radius:50%;background:rgba(255,253,247,.7);border:2px solid rgba(79,111,101,.38)}.dot.active{background:#75988d}.teacher-controls{position:absolute;z-index:30;left:50%;bottom:6vh;transform:translateX(-50%);display:flex;gap:.7vw;padding:.55vh .7vw;border-radius:999px;background:rgba(255,253,247,.56);backdrop-filter:blur(2px)}.teacher-controls button{border:1px solid rgba(84,112,104,.18);background:rgba(255,253,247,.88);color:#496b62;border-radius:999px;padding:.65vh 1.15vw;font-size:clamp(13px,.9vw,17px);font-weight:900;cursor:pointer}.finish-card{top:56%;width:min(60vw,920px);padding:4vh 5vw}.sound-note{position:absolute;z-index:5;left:2vw;bottom:2vh;padding:.7vh 1vw;border-radius:999px;background:rgba(255,253,247,.46);color:#587068;font-size:clamp(12px,.85vw,16px);font-weight:800;backdrop-filter:blur(1px)}
@keyframes softIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}@keyframes breathePulse{0%,100%{transform:scale(.78)}50%{transform:scale(1.12)}}@keyframes floatSlow{0%,100%{transform:translateY(8px)}50%{transform:translateY(-8px)}}
@media(max-aspect-ratio:4/3){.welcome{width:72vw;top:60%}.activity-card{width:70vw}.finish-card{width:70vw}}
</style>
</head>
<body>
<main class="stage">
<button class="close" type="button" aria-label="Close Calm Down" onclick="window.location.href='index.html'">×</button>
<section class="welcome" id="welcome" aria-label="Calm Down welcome">
<h1>Let’s visit our quiet place.</h1>
<p>Listen to the water. Let your body get still.</p>
<button class="begin" id="begin" type="button">Begin</button>
</section>
<section class="activity-card hidden" id="activity-card" aria-live="polite">
<div class="step-label" id="step-label"></div><div class="step-count" id="step-count"></div>
<div class="visual"><div class="visual-main" id="visual-main"></div></div>
<h2 class="activity-title" id="activity-title"></h2>
<div class="activity-copy" id="activity-copy"></div>
<div class="cue" id="cue"></div>
</section>
<div class="teacher-controls hidden" id="teacher-controls"><button id="pause-btn" type="button">Pause</button><button id="repeat-btn" type="button">Repeat</button><button id="skip-btn" type="button">Skip</button></div>
<div class="progress hidden" id="progress"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<section class="finish-card hidden" id="finish-card"><h1>Our bodies are calm.</h1><p>Our brains are ready. Let’s return to our day.</p><button class="return-btn" type="button" onclick="window.location.href='index.html'">Return to Our Day</button></section>
<div class="sound-note">Waterfall sound will play here.</div>
</main>
<script>
const banks=[
 {label:'Breathe',duration:40,items:[
  {title:'Flower & Bubbles',visual:'🌸',copy:'Pretend to smell a flower slowly through your nose. Then gently blow the bubbles away.',cues:['Smell the flower…','Blow the bubbles…'],cycle:8000,anim:'pulse'},
  {title:'Belly Breaths',visual:'◯',copy:'Put a hand on your belly. Feel it grow as you breathe in and soften as you breathe out.',cues:['Breathe in…','Breathe out…'],cycle:8000,anim:'pulse'},
  {title:'Bunny Breath',visual:'🐰',copy:'Take three tiny sniffs through your nose. Then let one long, slow breath out.',cues:['Sniff, sniff, sniff…','Slow breath out…'],cycle:7000,anim:'float'},
  {title:'Snake Breath',visual:'🐍',copy:'Breathe in quietly through your nose. Let the air out slowly with a soft sssss sound.',cues:['Breathe in…','Sssssssss…'],cycle:8000,anim:'float'}]},
 {label:'Slow the Body',duration:42,items:[
  {title:'Reach & Melt',visual:'🌿',copy:'Reach your arms slowly toward the treetops. Then let your arms float all the way down.',cues:['Reach up slowly…','Melt all the way down…'],cycle:9000,anim:'float'},
  {title:'Squeeze & Let Go',visual:'🤲',copy:'Squeeze your hands tight like little rocks. Hold… then let every finger get soft.',cues:['Squeeze…','Let go…'],cycle:8000,anim:'pulse'},
  {title:'Slow Shoulder Rolls',visual:'🍃',copy:'Roll your shoulders slowly up, back, and down. Make your circles smaller each time.',cues:['Up… back… down…','Slow and easy…'],cycle:9000,anim:'float'},
  {title:'Stand Like a Tree',visual:'🌳',copy:'Plant your feet on the ground. Grow tall like a tree and let your branches stay very still.',cues:['Roots down…','Grow tall…'],cycle:9000,anim:'float'}]},
 {label:'Ground',duration:38,items:[
  {title:'Find Three Pink Flowers',visual:'🌺',copy:'Keep your body still and use only your eyes. Can you find three pink flowers in our quiet place?',cues:['Look slowly…','One… two… three…'],cycle:8000,anim:'float'},
  {title:'Listen for Three Sounds',visual:'👂',copy:'Stay very quiet. Listen for the water, a sound in our room, and one more tiny sound.',cues:['Listen…','What else can you hear?'],cycle:9000,anim:'float'},
  {title:'Feel Your Feet',visual:'🪨',copy:'Press your feet gently into the floor. Notice how the ground holds your body up.',cues:['Feel the floor…','You are steady…'],cycle:9000,anim:'pulse'},
  {title:'Watch the Water',visual:'💧',copy:'Choose one spot in the waterfall. Let your eyes rest there and watch the water move.',cues:['Watch one spot…','Stay with the water…'],cycle:9000,anim:'float'}]},
 {label:'Get Ready',duration:24,items:[
  {title:'Ready Bodies',visual:'✨',copy:'Hands can rest. Feet can be still. Take one last slow breath.',cues:['One slow breath…','We are ready.'],cycle:9000,anim:'pulse'},
  {title:'Quiet & Ready',visual:'🌤️',copy:'Let your shoulders soften. Let your face relax. Notice how quiet your body feels.',cues:['Soft shoulders…','Ready to learn…'],cycle:9000,anim:'float'}]}
];
let step=0,currentItem=null,timer=null,cueTimer=null,endAt=0,remaining=0,paused=false;
const $=id=>document.getElementById(id),card=$('activity-card'),dots=[...document.querySelectorAll('.dot')];
function pick(bank){return bank.items[Math.floor(Math.random()*bank.items.length)]}
function showStep(index,newPick=true){clearTimeout(timer);clearInterval(cueTimer);step=index;if(step>=banks.length){finish();return}const bank=banks[step];if(newPick||!currentItem)currentItem=pick(bank);$('step-label').textContent=bank.label;$('step-count').textContent=`${step+1} of 4`;$('activity-title').textContent=currentItem.title;$('activity-copy').textContent=currentItem.copy;$('visual-main').textContent=currentItem.visual;$('visual-main').className='visual-main '+(currentItem.anim||'');dots.forEach((d,i)=>d.classList.toggle('active',i===step));card.classList.remove('hidden');requestAnimationFrame(()=>card.classList.add('show'));$('teacher-controls').classList.remove('hidden');$('progress').classList.remove('hidden');paused=false;$('pause-btn').textContent='Pause';remaining=bank.duration*1000;startTimers()}
function startTimers(){endAt=Date.now()+remaining;let cueIndex=0;$('cue').textContent=currentItem.cues[0];cueTimer=setInterval(()=>{cueIndex=(cueIndex+1)%currentItem.cues.length;$('cue').textContent=currentItem.cues[cueIndex]},currentItem.cycle/2);timer=setTimeout(()=>transitionNext(),remaining)}
function transitionNext(){clearTimeout(timer);clearInterval(cueTimer);card.classList.remove('show');setTimeout(()=>showStep(step+1,true),500)}
function pause(){if(!paused){remaining=Math.max(0,endAt-Date.now());clearTimeout(timer);clearInterval(cueTimer);paused=true;$('pause-btn').textContent='Resume'}else{paused=false;$('pause-btn').textContent='Pause';startTimers()}}
function finish(){clearTimeout(timer);clearInterval(cueTimer);card.classList.add('hidden');$('teacher-controls').classList.add('hidden');$('progress').classList.add('hidden');$('finish-card').classList.remove('hidden')}
$('begin').onclick=()=>{$('welcome').classList.add('hidden');showStep(0,true)};$('pause-btn').onclick=pause;$('repeat-btn').onclick=()=>showStep(step,false);$('skip-btn').onclick=transitionNext;
</script>
</body>
</html>
