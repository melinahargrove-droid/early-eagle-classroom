<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Eagle Academy — Calm Down</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#cbd7d1;color:#173f72}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#cbd7d1 url('assets/calm-down-waterfall.webp') center/cover no-repeat}.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,248,242,.06),rgba(80,104,94,.08));pointer-events:none}.close{position:absolute;z-index:20;right:2vw;top:2.3vh;width:clamp(52px,3.8vw,72px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(73,97,102,.28);background:rgba(255,253,247,.9);color:#173f72;font-size:clamp(27px,2.1vw,39px);font-weight:900;cursor:pointer;box-shadow:0 6px 16px rgba(42,61,63,.11)}.welcome{position:absolute;z-index:10;left:50%;top:58%;transform:translate(-50%,-50%);width:min(64vw,980px);padding:4vh 5vw 4.3vh;text-align:center;border-radius:36px;background:linear-gradient(180deg,rgba(255,253,247,.78),rgba(247,244,234,.68));border:1.6px solid rgba(103,119,109,.16);box-shadow:0 16px 34px rgba(45,63,60,.10),inset 0 0 0 5px rgba(255,255,255,.18);backdrop-filter:blur(2px);opacity:0;animation:softIn 1.6s ease .45s forwards}.welcome h1{margin:0;color:#41675f;font-size:clamp(38px,3.2vw,62px);line-height:1.08;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.8)}.welcome p{margin:1.25vh 0 0;color:#657f77;font-size:clamp(18px,1.35vw,27px);font-weight:800}.begin{margin-top:2.7vh;min-width:min(30vw,480px);height:clamp(66px,8vh,92px);padding:0 3vw;border-radius:28px;border:2px solid rgba(80,111,103,.18);background:linear-gradient(180deg,#8faea2,#738f86);color:#fff;font-size:clamp(28px,2vw,39px);font-weight:900;cursor:pointer;text-shadow:0 1px 1px rgba(46,68,63,.18);box-shadow:0 7px 0 rgba(69,91,84,.15),0 12px 19px rgba(45,66,59,.09);transition:transform .15s ease,box-shadow .15s ease}.begin:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(69,91,84,.15),0 7px 12px rgba(45,66,59,.08)}.sound-note{position:absolute;z-index:5;left:2vw;bottom:2vh;padding:.7vh 1vw;border-radius:999px;background:rgba(255,253,247,.46);color:#587068;font-size:clamp(12px,.85vw,16px);font-weight:800;backdrop-filter:blur(1px)}@keyframes softIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}@media(max-aspect-ratio:4/3){.welcome{width:72vw;top:60%}}
</style>
</head>
<body>
<main class="stage">
<button class="close" type="button" aria-label="Close Calm Down" onclick="window.location.href='index.html'">×</button>
<section class="welcome" aria-label="Calm Down welcome">
<h1>Let’s visit our quiet place.</h1>
<p>Listen to the water. Let your body get still.</p>
<button class="begin" type="button">Begin</button>
</section>
<div class="sound-note">Waterfall sound will play here.</div>
</main>
</body>
</html>
