<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fo3s Lola Goes to School Read 2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#f6f1e5;color:#174f7d}.page{height:100vh;padding:2vh 3vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;letter-spacing:.09em;color:#789697}.brand h1{margin:.3vh 0;color:#164f7f;font-size:clamp(28px,2.4vw,46px)}.tools{display:flex;gap:10px;align-items:center}.chip{background:#dcecf0;color:#527985;padding:.7vh 1vw;border-radius:999px;font-weight:900}.mode{border:1px solid #b9cfd1;border-radius:999px;background:#fffdf8;padding:7px 12px;font-weight:900;color:#527985}.mode.on{background:#668f99;color:white}.card{height:75vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:30px;display:grid;grid-template-columns:58% 1fr;gap:2.5vw;align-items:center;padding:2.5vh}.visual{height:65vh;border-radius:24px;background:#eef4f0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.visual img{max-width:100%;max-height:59vh;object-fit:contain}.fallback{font-size:80px}.visual small{color:#789697;font-weight:900}.eye{font-weight:900;letter-spacing:.09em;color:#789697}.copy h2{font-size:clamp(30px,2.8vw,52px);margin:1vh 0;color:#164f7f}.copy p{font-size:clamp(17px,1.12vw,22px);line-height:1.4;font-weight:850;color:#527673}.note{background:#e7f0ed;border-radius:16px;padding:1vh;color:#416d61;font-weight:850;line-height:1.35}.bottom{height:10vh;display:flex;justify-content:space-between;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:11px 20px;font-weight:900}.bottom .next{background:#668f99;color:#fff}.progress{font-weight:900;color:#789697}</style></head><body><main class="page"><header><div class="brand">EARLY EAGLE ACADEMY · READ ALOUD · FOCUS ON PRE-K 3s<h1>Lola Goes to School · Read 2</h1></div><div class="tools"><button class="mode on" id="adaptMode">Adapted Text</button><button class="mode" id="fullMode">Full Text</button><div class="chip">U1 · W1 · TUESDAY</div></div></header><section class="card"><div class="visual"><div class="fallback" id="fallback">📚</div><img id="book" alt="Lola Goes to School child-facing visual"><small id="label"></small></div><div class="copy"><div class="eye" id="eye"></div><h2 id="title"></h2><p id="say"></p><div class="note" id="note"></div></div></section><div class="bottom"><button id="prev">← Community Meeting</button><div class="progress" id="progress"></div><button class="next" id="next">Next →</button></div></main><script>(()=>{const spreads=[['assets/01-pages-1-2.png','1–2','Lola is starting school tomorrow.'],['assets/02-pages-3-4.png','3–4','Lola has been getting ready for school.'],['assets/03-pages-5-6.png','5–6','Lola picks out her clothes for school.'],['assets/04-pages-7-8.png','7–8','Lola gets all her things ready for school.'],['assets/05-pages-9-10.png','9–10','Lola’s mommy helps her get ready and takes her picture.'],['assets/06-pages-11-12.png','11–12','Miss Suzan helps Lola settle into class.'],['assets/07-pages-13-14.png','13–14','Lola chooses to read with Julia.'],['assets/08-pages-15-16.png','15–16','Lola and Julia play superheroes.'],['assets/09-pages-17-18.png','17–18','Lola has snack.'],['assets/10-pages-19-20.png','19–20','Lola and her friends build a block castle.'],['assets/11-pages-21-22.png','21–22','Lola has circle time and gets ready to go home.'],['assets/12-pages-23-24.png','23–24','Lola had a great day and falls asleep.']].map(x=>({img:x[0],pages:x[1],adapted:x[2]}));let mode='adapted';const cards=[{icon:'📚',label:'BEFORE READING',title:'Read It Again',adapted:'We will read Lola Goes to School again and pay attention to Lola, her feelings, and what happens.',full:'Reintroduce Lola Goes to School. Explain that this reading focuses on characters, feelings, and connections.',note:'Adapted Text remains the default child-facing mode.'},...spreads.map((s,n)=>({img:s.img,label:'PAGES '+s.pages,title:n===4?'How Is Lola Feeling?':n===6?'Quick Word: decides':n===7?'What’s Happening?':'Keep Reading',adapted:n===4?'How might Lola be feeling the night before school and when she wakes up? How do you know?':n===6?'Lola decides to read. Decides means to make a choice.':n===7?'What’s happening? How might Lola feel now?':s.adapted,full:n===4?'Page 9: ask how Lola might be feeling the night before school and when she wakes up, and how children know.':n===6?'Page 14: “Lola decides to read.” Define decides as make a choice.':n===7?'Page 15: ask what is happening and how Lola might feel now.':'Read the published text for pages '+s.pages+'.',note:n===4?'Official Fo3s stop at page 9.':n===6?'Official Fo3s stop at page 14.':n===7?'Official Fo3s stop at page 15.':'Continue the selected text without adding a curriculum stop.'})),{icon:'💬',label:'AFTER READING',title:'How Does Lola Feel at the End?',adapted:'How does Lola feel at the end of the book? Why? Thumbs up if you have felt that way too.',full:'Ask how Lola feels at the end of the book and why. Invite a thumbs-up connection and 1–2 children to share.',note:'Focus on characters, feelings, and connections.'},{icon:'🫶',label:'CLOSING',title:'Characters and Connections',adapted:'We thought about Lola’s feelings and our own feelings too.',full:'Close by noting that children used the words and illustrations to get to know Lola and connect her experiences to their own.',note:'Notice how children describe feelings and make connections.'}];let i=0,$=x=>document.getElementById(x);function draw(){let c=cards[i],img=$('book'),fb=$('fallback');if(c.img){img.src=c.img;img.style.display='block';fb.style.display='none'}else{img.style.display='none';fb.style.display='block';fb.textContent=c.icon||'📖'}$('label').textContent=(mode==='adapted'?'ADAPTED TEXT · ':'FULL TEXT · ')+c.label;$('eye').textContent=i===0?'BEFORE READING':i<=12?'WHILE READING':'AFTER READING';$('title').textContent=c.title;$('say').textContent=mode==='adapted'?c.adapted:c.full;$('note').innerHTML='<b>Teacher note:</b> '+c.note;$('progress').textContent=(i+1)+' of '+cards.length;$('prev').textContent=i===0?'← Community Meeting':'← Previous';$('next').textContent=i===cards.length-1?'Next: Centers →':'Next →';$('adaptMode').classList.toggle('on',mode==='adapted');$('fullMode').classList.toggle('on',mode==='full')}$('adaptMode').onclick=()=>{mode='adapted';draw()};$('fullMode').onclick=()=>{mode='full';draw()};$('book').onerror=()=>{$('book').style.display='none';$('fallback').style.display='block';$('fallback').textContent='📖';$('label').textContent+=' · IMAGE UNAVAILABLE'};$('prev').onclick=()=>{if(i===0)location.href='fo3s-u1w1-community-tuesday.html';else{i--;draw()}};$('next').onclick=()=>{if(i<cards.length-1){i++;draw()}else location.href='fo3s-u1w1-centers-tuesday.html'};draw()})();</script></body></html>
