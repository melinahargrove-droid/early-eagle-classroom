<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Lesson Runner</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f1e5}iframe{border:0;width:100%;height:100%;display:block}.done{display:none;width:100%;height:100%;align-items:center;justify-content:center;text-align:center;font-family:"Trebuchet MS",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.done.show{display:flex}.done h1{font-size:clamp(42px,4vw,76px);margin:0 0 18px}.done p{font-size:clamp(20px,1.5vw,30px);font-weight:800;color:#557876}.done button{border:0;border-radius:18px;padding:14px 22px;background:#668f99;color:white;font:900 18px "Trebuchet MS",Arial,sans-serif;cursor:pointer}</style></head><body><iframe id="frame" title="Daily lesson"></iframe><section class="done" id="done"><div><h1>Today’s Lessons Are Complete!</h1><p>You made it through the whole day.</p><button onclick="location.href='daily-lessons.html'">Back to Daily Lessons</button></div></section><script>(()=>{const p=new URLSearchParams(location.search);const week=Math.max(1,Number(p.get('week'))||2);const day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(4,Number(p.get('section'))||0));const readW2=['too-many-mangos-read-3.html','too-many-mangos-read-4.html','what-riley-wore-read-1.html','what-riley-wore-read-2.html','what-riley-wore-read-3.html'];const readW1=['read-aloud.html','read-aloud-2.html','read-aloud-3.html','too-many-mangos-read-1.html','too-many-mangos-read-2.html'];const flows={1:[['community-meeting.html','community-meeting-tuesday.html','community-meeting-wednesday.html','community-meeting-thursday.html','community-meeting-friday.html'],readW1,[null,null,null,null,null],['storytelling-week1.html','storytelling-week1.html','storytelling-week1.html','storytelling-week1.html','storytelling-week1.html'],['closing-circle-week1.html','closing-circle-week1.html','closing-circle-week1.html','closing-circle-week1.html','closing-circle-week1.html']],2:[['community-meeting-week2.html','community-meeting-week2.html','community-meeting-week2.html','community-meeting-week2.html','community-meeting-week2.html'],readW2,['centers-week2.html','centers-week2.html','centers-week2.html','centers-week2.html','centers-week2.html'],['storytelling-week2.html','storytelling-week2.html','storytelling-week2.html','storytelling-week2.html','storytelling-week2.html'],['closing-circle-week2.html','closing-circle-week2.html','closing-circle-week2.html','closing-circle-week2.html','closing-circle-week2.html']]};const frame=document.getElementById('frame'),done=document.getElementById('done');localStorage.setItem('eea-daily-week',String(week));localStorage.setItem('eea-daily-day',String(day));function src(){return (flows[week]||flows[2])[section][day]}function advance(){section++;localStorage.setItem('eea-daily-section',String(section));if(section>4){frame.style.display='none';done.classList.add('show');return}load()}function load(){let s=src();if(!s){advance();return}frame.src=s}function prepare(){let w;try{w=frame.contentWindow;const d=w.document;if(!d||!d.body)return}catch(e){return}const path=(w.location.pathname||'').split('/').pop();const dayBtns=[...w.document.querySelectorAll('#days button')];if(dayBtns[day]){try{dayBtns[day].click()}catch(e){}}if(path==='storytelling-week2.html'){const next=w.document.getElementById('next');for(let n=0;n<day;n++){try{next.click()}catch(e){break}}}const next=w.document.getElementById('next');if(!next)return;w.document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#next');if(!b)return;const txt=(b.textContent||'').trim();let handoff=false;if(section===0){handoff=/Next Day|Done/i.test(txt)}else if(section===1){handoff=/Finish Read Aloud|Done/i.test(txt)}else if(section>=2){handoff=true}if(handoff){e.preventDefault();e.stopImmediatePropagation();advance()}},true)}frame.addEventListener('load',()=>setTimeout(prepare,50));load()})();</script></body></html>
