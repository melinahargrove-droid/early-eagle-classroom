<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Today's Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f6f1e5}.app{width:100%;height:100%;padding:1.2vh 1.5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.top{height:8.5vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid rgba(89,139,151,.22)}.brand small{display:block;color:#719298;font-weight:900;letter-spacing:.1em;font-size:11px}.brand h1{margin:.2vh 0 0;font-size:clamp(28px,2.2vw,43px)}.daytitle{font-weight:900;font-size:clamp(15px,1.1vw,21px)}.topright{display:flex;justify-content:flex-end;gap:.6vw}.pill,.home{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.pill{border-radius:16px;padding:.8vh 1vw}.home{width:48px;height:48px;border-radius:50%;font-size:21px}.dash{height:88vh;display:grid;grid-template-columns:13.5vw 1fr 12.5vw;gap:.8vw;padding-top:1vh}.side,.tools{border:1.4px solid rgba(89,139,151,.23);border-radius:22px;background:rgba(255,254,249,.9);padding:1.2vh .8vw}.side{display:flex;flex-direction:column}.side h3,.tools h3{margin:.3vh .2vw 1vh;font-size:16px}.count{font-size:11px;color:#789697;font-weight:900;margin:0 .2vw 1vh}.path{display:flex;flex-direction:column;gap:.7vh}.path button{width:100%;text-align:left;border:1px solid rgba(89,130,146,.17);border-radius:16px;background:#fffdf8;color:#245c78;padding:1vh .7vw;cursor:pointer}.path button b{display:block;font-size:14px}.path button span{display:block;color:#718985;font-size:11px;margin-top:.25vh}.path button.active{background:#dcecf5;border-color:#8fbfd8}.path button.doneStep{background:#edf5e8;border-color:#b6d29f}.continue{margin-top:auto;border:0;border-radius:15px;padding:1.2vh .5vw;background:#5c9ac5;color:white;font-weight:900;font-size:15px;cursor:pointer}.stage{position:relative;border:1.5px solid rgba(89,139,151,.25);border-radius:24px;background:#fffdf9;overflow:hidden}.stage iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .08s}.tools section{border:1px solid rgba(89,130,146,.16);border-radius:16px;padding:1vh .7vw;margin-bottom:1vh;background:#fffdf8}.tools button{display:block;width:100%;border:0;border-radius:12px;padding:1vh .4vw;margin:.6vh 0;background:#e7f2f8;color:#245c78;font-weight:900;cursor:pointer}.focus .top,.focus .dash>.side,.focus .dash>.tools{display:none}.focus .app{padding:0}.focus .dash{height:100vh;display:block;padding:0}.focus .stage{width:100%;height:100%;border:0;border-radius:0}.done{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}.done.show{display:flex}.done h1{font-size:clamp(42px,4vw,76px);margin:0 0 18px}.done p{font-size:22px;font-weight:800;color:#557876}.done button{border:0;border-radius:18px;padding:14px 22px;background:#668f99;color:#fff;font-weight:900;font-size:18px;cursor:pointer}</style></head><body><main class="app"><header class="top"><div class="brand"><small>EARLY EAGLE ACADEMY · DAILY LESSONS</small><h1>Today’s Lessons</h1></div><div class="daytitle" id="daytitle"></div><div class="topright"><button class="pill" id="overviewBtn">Day Overview</button><button class="home" onclick="location.href='index.html'">⌂</button></div></header><div class="dash"><aside class="side"><h3>Today’s Lesson Path</h3><div class="count" id="count"></div><div class="path" id="path"></div><button class="continue" id="continue">Continue Teaching</button></aside><section class="stage"><iframe id="frame" title="Daily lesson"></iframe></section><aside class="tools"><section><h3>Teacher Materials</h3><div id="materials">Today’s lesson materials</div></section><section><h3>Quick Tools</h3><button onclick="location.href='timer.html'">5-Minute Timer</button><button onclick="location.href='clean-up.html'">Clean Up Song</button><button onclick="location.href='choose-friend.html'">Choose a Friend</button></section></aside></div></main><section class="done" id="done"><div><h1>Today’s Lessons Are Complete!</h1><p>You made it through the whole day.</p><button onclick="location.href='daily-lessons.html'">Back to Daily Lessons</button></div></section><script>(()=>{const p=new URLSearchParams(location.search),week=Math.max(1,Number(p.get('week'))||2),day=Math.max(0,Math.min(4,Number(p.get('day'))||0));let section=Math.max(0,Math.min(4,Number(p.get('section'))||0)),landing=p.get('landing')==='end'?'end':'start';const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],names=['Community Meeting','Read Aloud','Centers','Storytelling','Closing Circle'];const readW2=['too-many-mangos-read-3.html','too-many-mangos-read-4.html','what-riley-wore-read-1.html','what-riley-wore-read-2.html','what-riley-wore-read-3.html'],readW1=['read-aloud.html','read-aloud-2.html','read-aloud-3.html','too-many-mangos-read-1.html','too-many-mangos-read-2.html'];const flows={1:[['community-meeting.html','community-meeting-tuesday.html','community-meeting-wednesday.html','community-meeting-thursday.html','community-meeting-friday.html'],readW1,[null,null,null,null,null],Array(5).fill('storytelling-week1.html'),Array(5).fill('closing-circle-week1.html')],2:[Array(5).fill('community-meeting-week2.html'),readW2,Array(5).fill('centers-week2.html'),Array(5).fill('storytelling-week2.html'),Array(5).fill('closing-circle-week2.html')]};const frame=document.getElementById('frame'),done=document.getElementById('done'),pathBox=document.getElementById('path');localStorage.setItem('eea-daily-week',week);localStorage.setItem('eea-daily-day',day);document.getElementById('daytitle').textContent=`${days[day]} · Week ${week}`;function src(){return(flows[week]||flows[2])[section][day]}function renderShell(){document.body.classList.toggle('focus',section===1);const completed=JSON.parse(localStorage.getItem(`eea-complete-w${week}-d${day}`)||'[]');pathBox.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${i===section?'active':''} ${completed.includes(i)?'doneStep':''}"><b>${['🌞','📖','🧩','✨','🏁'][i]} ${n}${completed.includes(i)?' ✓':''}</b><span>${['Start together','Today’s book','Center lesson','Tell our story','Reflect & say goodbye'][i]}</span></button>`).join('');[...pathBox.children].forEach(b=>b.onclick=()=>jump(Number(b.dataset.i)));document.getElementById('count').textContent=`${completed.length} of 5 complete`;}function mark(i){let a=JSON.parse(localStorage.getItem(`eea-complete-w${week}-d${day}`)||'[]');if(!a.includes(i)){a.push(i);localStorage.setItem(`eea-complete-w${week}-d${day}`,JSON.stringify(a))}}function jump(i,end=false){section=i;landing=end?'end':'start';localStorage.setItem('eea-daily-section',section);load()}function advance(){mark(section);if(section>=4){frame.style.display='none';done.classList.add('show');return}jump(section+1)}function retreat(){if(section<=0){location.href='daily-lessons.html';return}jump(section-1,true)}function load(){renderShell();const s=src();if(!s){advance();return}done.classList.remove('show');frame.style.display='block';frame.style.opacity=0;frame.src=s+`?eeaRunner=1&week=${week}&day=${day}&section=${section}&landing=${landing}&v=6`}document.getElementById('overviewBtn').onclick=()=>location.href='daily-lessons.html';document.getElementById('continue').onclick=()=>jump(section);function activeDotIndex(d){const dots=[...d.querySelectorAll('.dot')];return dots.findIndex(x=>x.classList.contains('active'))}function selectDay(d,path){const bs=[...d.querySelectorAll('#days button')];if(bs.length){if(bs[day])try{bs[day].click()}catch(e){}bs.forEach((b,i)=>{b.disabled=true;b.style.pointerEvents='none';if(i!==day)b.style.opacity=.45});return}if(/storytelling-week[12]|closing-circle-week1/.test(path)){const next=d.getElementById('next');let idx=activeDotIndex(d),g=0;while(next&&idx<day&&g++<10){next.click();idx=activeDotIndex(d)}}}function moveToEnd(d){const next=d.getElementById('next');if(!next)return;let g=0;if(section===0)while(g++<80&&!/Next Day|Done/i.test(next.textContent||''))next.click();else if(section===1)while(g++<200&&!/Finish Read Aloud|Done/i.test(next.textContent||''))next.click()}function installRiley(w,d,path){if(!/^what-riley-wore-read-[123]\.html$/.test(path))return;const st=d.createElement('style');st.textContent=`.reader{width:97%!important;height:94%!important;display:block!important}.guide{display:none!important}.book{width:100%!important;height:100%!important;overflow:hidden!important}.book img{max-width:100%!important;max-height:100%!important;width:auto!important;height:auto!important;object-fit:contain!important;transform-origin:center!important}.stage{background:#fff!important}#eeaRileyEdit{position:absolute;left:1.2vw;top:1.2vh;z-index:30}#eeaRileyEdit>button,#eeaRileyPanel button{border:1px solid #bdd0d5;background:#fffdf8;color:#245c82;border-radius:12px;padding:8px;font-weight:900;cursor:pointer}#eeaRileyPanel{display:none;margin-top:6px;width:280px;padding:12px;border-radius:16px;background:#fffdf8;box-shadow:0 10px 25px #0002}#eeaRileyPanel.open{display:block}.eeaRow{display:flex;justify-content:center;gap:7px;margin:6px}.eeaReadout{text-align:center;font-size:12px;font-weight:900}`;d.head.appendChild(st);if(d.getElementById('eeaRileyEdit'))return;const box=d.createElement('div');box.id='eeaRileyEdit';box.innerHTML=`<button id="eeaEditToggle">✥ Fix Page</button><div id="eeaRileyPanel"><b>Book Page Position</b><div class="eeaReadout" id="eeaReadout"></div><div class="eeaRow"><button id="eeaZoomOut">− Zoom</button><button id="eeaZoomIn">+ Zoom</button></div><div class="eeaRow"><button id="eeaUp">↑</button></div><div class="eeaRow"><button id="eeaLeft">←</button><button id="eeaDown">↓</button><button id="eeaRight">→</button></div><div class="eeaRow"><button id="eeaReset">Reset</button><button id="eeaDone">Done</button></div></div>`;(d.querySelector('.stage')||d.body).appendChild(box);const key='eea-riley-page-layout-v1';function all(){try{return JSON.parse(w.localStorage.getItem(key)||'{}')}catch(e){return{}}}function k(){const m=(d.getElementById('bookImg')?.getAttribute('src')||'').match(/riley-(\d{2})/);return m&&m[1]}function cur(){return{scale:1,x:0,y:0,...(all()[k()]||{})}}function apply(){const img=d.getElementById('bookImg'),v=cur();if(!img)return;img.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.scale})`;const r=d.getElementById('eeaReadout');if(r)r.textContent=`Page ${k()} · ${Math.round(v.scale*100)}% · X ${v.x} · Y ${v.y}`}function save(v){const a=all();a[k()]=v;w.localStorage.setItem(key,JSON.stringify(a));apply()}function adj(s,x,y){const v=cur();v.scale=Math.max(.5,Math.min(2.5,Math.round((v.scale+s)*100)/100));v.x+=x;v.y+=y;save(v)}d.getElementById('eeaEditToggle').onclick=()=>{d.getElementById('eeaRileyPanel').classList.toggle('open');apply()};d.getElementById('eeaZoomOut').onclick=()=>adj(-.05,0,0);d.getElementById('eeaZoomIn').onclick=()=>adj(.05,0,0);d.getElementById('eeaUp').onclick=()=>adj(0,0,-10);d.getElementById('eeaDown').onclick=()=>adj(0,0,10);d.getElementById('eeaLeft').onclick=()=>adj(0,-10,0);d.getElementById('eeaRight').onclick=()=>adj(0,10,0);d.getElementById('eeaReset').onclick=()=>save({scale:1,x:0,y:0});d.getElementById('eeaDone').onclick=()=>d.getElementById('eeaRileyPanel').classList.remove('open');d.getElementById('bookImg')?.addEventListener('load',apply);apply()}function prepare(){let w,d;try{w=frame.contentWindow;d=w.document;if(!d?.body)return}catch(e){return}const path=(w.location.pathname||'').split('/').pop();selectDay(d,path);if(landing==='end')moveToEnd(d);landing='start';installRiley(w,d,path);const prev=d.getElementById('prev'),next=d.getElementById('next'),back=d.getElementById('backBtn');function sync(){if(prev){const boundary=section>=2||!!prev.disabled;prev.dataset.boundary=boundary?'1':'0';if(boundary){prev.disabled=false;prev.textContent=section===0?'← Day Overview':'← '+names[section-1]}}if(next){const boundary=section>=2||(section===0?/Next Day|Done/i.test(next.textContent||''):/Finish Read Aloud|Done/i.test(next.textContent||''));next.dataset.boundary=boundary?'1':'0';if(boundary)next.textContent=section===4?'Finish Day ✓':'Next: '+names[section+1]+' →'}}sync();d.addEventListener('click',e=>{const b=e.target.closest?.('button');if(!b)return;if(b===prev&&prev.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();retreat()}else if(b===next&&next.dataset.boundary==='1'){e.preventDefault();e.stopImmediatePropagation();advance()}else if(b===back){e.preventDefault();e.stopImmediatePropagation();location.href=`daily-lessons.html?week=${week}&day=${day}`}else if(b===prev||b===next)setTimeout(sync,0)},true);frame.style.opacity=1}frame.addEventListener('load',()=>setTimeout(prepare,70));renderShell();load()})();</script></body></html>
