<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Early Eagle Academy — Today's Lessons</title>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  let week=Number(params.get('week'));
  if(!Number.isInteger(week)||week<1||week>9){
    week=Number(localStorage.getItem('eea-daily-week'));
  }
  if(!Number.isInteger(week)||week<1||week>9)week=1;
  params.set('week',String(week));
  location.replace(`lesson-runner-week${week}.html?${params.toString()}${location.hash}`);
})();
</script>
</head>
<body>
<p>Opening today’s lesson…</p>
</body>
</html>
