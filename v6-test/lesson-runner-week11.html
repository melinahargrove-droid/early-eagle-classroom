<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Unit 2 Week 3 Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f6f1e5}.app,.stage{width:100%;height:100%}.stage iframe{border:0;width:100%;height:100%;display:block}</style></head><body><main class="app"><section class="stage"><iframe id="frame" title="Unit 2 Week 3 daily lesson"></iframe></section></main><script>
(()=>{
  const params=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];
  const requested=params.get('day'),numeric=requested!==null&&requested.trim()!==''?Number(requested):NaN;
  const rawDay=days.includes(requested)?days.indexOf(requested):numeric;
  const validDay=Number.isInteger(rawDay)&&rawDay>=0&&rawDay<days.length;
  const weekday=new Date().getDay(),today=weekday===0||weekday===6?4:weekday-1;
  const day=validDay?rawDay:today,section=params.get('section')==='2'?2:params.get('section')==='1'?1:0;
  let leaving=false;
  const overview=()=>{if(leaving)return;leaving=true;localStorage.removeItem('eea-lesson-auto-resume');location.href='daily-lessons.html?week=11&day='+day;};
  // Community Meeting is section 2 to preserve existing reader/Center deep links.
  // Monday/Tuesday have verified readers; Wednesday–Friday skip unavailable readers.
  if(!validDay||day>4||(day>=2&&section===0)||(params.has('section')&&!['0','1','2'].includes(params.get('section')))){overview();return;}
  const frame=document.getElementById('frame'),pad=n=>String(n).padStart(2,'0');
  function saveResume(){const date=new Date();localStorage.setItem('eea-daily-week','11');localStorage.setItem('eea-daily-day',String(day));localStorage.setItem('eea-lesson-resume',JSON.stringify({date:date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate()),week:11,day,section}));}
  const route=new URL(location.href);route.searchParams.set('week','11');route.searchParams.set('day',String(day));route.searchParams.set('section',String(section));route.searchParams.delete('book');route.searchParams.delete('center');if(day!==4||section!==1)route.searchParams.delete('review');if(section!==0)route.searchParams.delete('stop');if(section===2)route.searchParams.delete('step');if(section!==2)route.searchParams.delete('visual');history.replaceState(history.state,'',route.href);
  function activeSection(){
    const win=frame.contentWindow,doc=frame.contentDocument;if(!doc?.body)return null;
    const child=new URL(doc.location.href),expected=section===2?'week11-community.html':section===1?'week11-centers.html':'week11-read-aloud.html';
    return child.origin===location.origin&&child.pathname===new URL(expected,location.href).pathname&&child.searchParams.get('day')===days[day]&&typeof win[section===2?'EEACommunityRestore':section===1?'EEACentersRestore':'EEAReadAloudRestore']==='function'&&typeof win.EEASectionState==='function'?win:null;
  }
  function sync(step,stop,replace,review){
    const win=activeSection();if(!win)return;
    if(section===2)win.EEACommunityRestore(step);else if(section===1)win.EEACentersRestore(step,review);else win.EEAReadAloudRestore(step,stop);
    const state=win.EEASectionState(),url=new URL(location.href);
    if(state.review)url.searchParams.set('review','1');else url.searchParams.delete('review');
    if(section===2){url.searchParams.delete('step');url.searchParams.set('visual',state.visual);}else url.searchParams.set('step',String(state.step));if(section===0)url.searchParams.set('stop',String(state.stop));else url.searchParams.delete('stop');
    if(url.href!==location.href)history[replace?'replaceState':'pushState'](null,'',url.href);
    const child=new URL(win.location.href);if(state.review)child.searchParams.set('review','1');else child.searchParams.delete('review');if(section===2){child.searchParams.delete('step');child.searchParams.set('visual',state.visual);}else child.searchParams.set('step',String(state.step));if(section===0)child.searchParams.set('stop',String(state.stop));else child.searchParams.delete('stop');
    // Only the parent pushes internal history; the iframe replaces its route.
    win.history.replaceState(null,'',child.href);saveResume();
  }
  function restore(){const p=new URLSearchParams(location.search);sync(section===2?p.get('visual'):p.get('step')||0,p.get('stop')||0,true,p.get('review'));}
  window.EEAReadAloudNavigate=(step,stop,replace=false)=>{if(section===0)sync(step,stop,replace);};
  window.EEACentersNavigate=(step,replace=false,review=false)=>{if(section===1)sync(step,0,replace,review);};
  window.EEACommunityNavigate=(visual,replace=false)=>{if(section===2)sync(visual,0,replace);};
  window.EEAWeek11Overview=overview;
  function enterSection(next){if(leaving)return;leaving=true;location.href='lesson-runner-week11.html?week=11&day='+day+'&section='+next;}
  window.EEAWeek11CompleteCommunity=()=>{if(section===2&&activeSection()?.EEASectionState().atEnd)enterSection(day<2?0:1);};
  window.EEAWeek11CompleteReadAloud=()=>{const state=activeSection()?.EEASectionState();if(section===0&&state?.atEnd&&!state.stopPending){enterSection(1);}};
  window.EEAWeek11PreviousCenters=()=>{if(section===1&&activeSection()?.EEASectionState().atStart){if(day>=2)overview();else enterSection(0);}};
  window.EEAWeek11CompleteCenters=()=>{if(section===1&&activeSection()?.EEASectionState().atEnd)overview();};
  // Each section binds boundary controls before images finish loading. No late
  // click interception can steal an ordinary internal Previous or final stop.
  saveResume();frame.onload=restore;window.addEventListener('pageshow',()=>{leaving=false;restore();});window.addEventListener('popstate',restore);
  frame.src=(section===2?'week11-community.html':section===1?'week11-centers.html':'week11-read-aloud.html')+'?day='+days[day]+'&from=runner&week=11&section='+section+(section===2?'&visual='+encodeURIComponent(params.get('visual')||'illustration'):'&step='+encodeURIComponent(params.get('step')||'0'))+(section===1&&day===4&&params.get('review')==='1'?'&review=1':'')+(section===0?'&stop='+encodeURIComponent(params.get('stop')||'0'):'');
})();
</script></body></html>
