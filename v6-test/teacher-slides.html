<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle — My Slides</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;background:#f6f1e5;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 58%,#e5efea)}header{height:8vh;display:flex;align-items:center;justify-content:space-between}.meta{color:#76949a;font-weight:900;letter-spacing:.1em}h1{margin:3px 0;font-size:30px}.x{width:46px;height:46px;border-radius:50%;border:1px solid #cbdde0;background:#fffdf8;color:#245c82;font-size:22px;font-weight:900}.stage{height:82vh;border:1.5px solid #cbdde0;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain}.empty{font-size:28px;color:#789697;font-weight:900}.footer{height:8vh;display:grid;grid-template-columns:16% 1fr 16%;gap:1vw;align-items:center}.nav{border:1px solid #cbdde0;border-radius:16px;padding:10px;font-weight:900;font-size:16px}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:white}.count{text-align:center;color:#607976;font-weight:900}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · MY SLIDES</div><h1 id="title"></h1></div><button class="x" id="exit">×</button></header><section class="stage"><img id="img" hidden><div class="empty" id="empty">No slides added yet.</div></section><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="count" id="count"></div><button class="nav next" id="next">Next →</button></footer></main><script>(()=>{const p=new URLSearchParams(location.search),id=p.get('id'),KEY='eea-teacher-lessons-v1',$=x=>document.getElementById(x);let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const d=all.find(x=>x.id===id);if(!d){$('title').textContent='Slides not found';return}const pages=d.pages||[];let i=0;$('title').textContent=d.title;function back(){location.href='daily-lessons.html?week='+d.week+'&day='+d.day}function show(){const x=pages[i];$('img').hidden=!x?.image;$('empty').style.display=x?.image?'none':'block';if(x?.image)$('img').src=x.image;$('count').textContent=pages.length?'Slide '+(i+1)+' of '+pages.length:'No slides';$('prev').disabled=i===0;$('next').textContent=i===pages.length-1?'Finish Slides ✓':'Next →'}$('prev').onclick=()=>{if(i>0){i--;show()}};$('next').onclick=()=>{if(i<pages.length-1){i++;show()}else back()};$('exit').onclick=back;show()})();</script></body></html>
