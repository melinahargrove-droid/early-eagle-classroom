<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle — My Lesson</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;color:#174f7d;background:#f6f1e5}.page{width:100vw;height:100vh;padding:3vh 5vw;background:radial-gradient(circle at 50% 0,#fffdf7,#f7f1e4 60%,#e4eee9)}header{display:flex;justify-content:space-between;align-items:center;height:11vh}.meta{color:#76949a;font-weight:900;letter-spacing:.1em}.x{width:50px;height:50px;border-radius:50%;border:1px solid #cbdde0;background:#fffdf8;color:#174f7d;font-size:24px;font-weight:900}.stage{height:73vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdf9;display:grid;grid-template-columns:1fr 38%;gap:4vw;align-items:center;padding:5vh 6vw}.main h1{font-size:clamp(48px,5vw,88px);margin:0 0 20px}.prompt{font-size:clamp(25px,2vw,38px);font-weight:850;color:#557876;line-height:1.4}.notes{background:#eaf2ef;border-radius:24px;padding:24px;color:#4f6f6c;font-weight:800;line-height:1.5}.notes b{display:block;color:#315f70;margin-bottom:8px}.footer{height:10vh;display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:17px;padding:12px 18px;font-weight:900;font-size:17px;cursor:pointer}.edit{background:#fffdf8;color:#315f70;border:1px solid #cbdde0}.done{background:#668f99;color:#fff}</style></head><body><main class="page"><header><div class="meta">EARLY EAGLE ACADEMY · MY ADDITION</div><button class="x" id="exit">×</button></header><section class="stage"><div class="main"><h1 id="title"></h1><div class="prompt" id="student"></div></div><aside class="notes"><b>TEACHER NOTES</b><div id="teacher"></div></aside></section><footer class="footer"><button class="btn edit" id="edit">✎ Edit Lesson</button><button class="btn done" id="done">Done ✓</button></footer></main><script>(()=>{const p=new URLSearchParams(location.search),id=p.get('id'),KEY='eea-teacher-lessons-v1';let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const d=all.find(x=>x.id===id);if(!d){document.getElementById('title').textContent='Lesson not found';return}title.textContent=d.title;student.textContent=d.student||'Teacher-created lesson';teacher.textContent=d.teacher||'No teacher notes added.';const back=()=>location.href='daily-lessons.html?week='+d.week+'&day='+d.day;exit.onclick=done.onclick=back;edit.onclick=()=>location.href='teacher-lesson-editor.html?week='+d.week+'&day='+d.day+'&id='+encodeURIComponent(d.id)})();</script></body></html>
