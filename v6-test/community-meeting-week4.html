tom"><button class="done" onclick="location.href='week4-plan.html'">Done ✓</button></div></main><script>const d={Monday:{eye:'MINDFUL PRACTICE · CURRICULUM',title:'Snake Breath',lead:'Slow your whole body with one long, smooth breath.',visual:'Visual placeholder: child sitting tall and breathing out like a gentle snake.',steps:['Sit up tall and take a deep breath in, filling your whole body.','Breathe out slowly and smoothly with a long hissing sound.','Repeat 3–5 times. Notice your whole body slowing down.']},Tuesday:{eye:'CONVERSATION · CURRICULUM',title:'What Can You Do?',lead:'Characters in our books have lots of feelings. What can we do with our feelings?',visual:'Visual placeholder: preschool faces showing sad, shy, and angry feelings.',steps:['Choose one feeling: sad, shy, or angry.','Ask: “What can you do when you feel ___?”','Invite a few children to share. Use feeling visuals if helpful.']},Wednesday:{eye:'GAME · CURRICULUM',title:'Story Rounds',lead:'Our whole community can make one story together.',visual:'Visual placeholder: preschool circle creating an imaginary story together.',steps:['Begin: “Once upon a time, there was a…”','Go around the circle. Each child may add a word, phrase, action—or pass.','Continue once or twice around as time allows, then read/tell the whole story back.']},Thursday:{eye:'EEA EXTENSION',title:'Saturday Calm-Down Practice',lead:'Sometimes plans change. What can our bodies do when we feel upset?',visual:'Visual placeholder: child pausing after a disappointing change of plans.',steps:['Pretend something you were excited about did not go as planned.','Show a tense or disappointed body.','Try one Snake Breath together. Then show what your calmer body looks like.']},Friday:{eye:'EEA EXTENSION',title:'Our Community Story',lead:'Let’s remember places and people that make a neighborhood community.',visual:'Visual placeholder: simple neighborhood with library, homes, park, and people.',steps:['Name one place or person you might find
