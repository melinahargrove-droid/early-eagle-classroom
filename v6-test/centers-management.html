<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centers & Capacity</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;color:#173f72;background:#dce8e6}.page{width:100vw;height:100vh;padding:1.5vh 1.7vw;background:linear-gradient(180deg,#eef5f1,#f7f1e5);position:relative}.top{height:9%;display:flex;align-items:center;justify-content:space-between}.top h1{margin:0;font-size:clamp(32px,2.7vw,52px)}.top .sub{color:#61746f;font-size:clamp(12px,.9vw,17px);font-weight:700;margin-top:.2vh}.back{border:1.7px solid rgba(73,104,122,.2);border-radius:15px;background:#fffaf0;color:#173f72;padding:1vh 1.1vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.summary{height:8%;display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;margin-bottom:1vh}.summary-card{border:1.5px solid rgba(80,110,124,.14);border-radius:16px;background:rgba(255,253,247,.9);display:flex;align-items:center;justify-content:center;gap:.7vw;font-weight:900}.summary-card strong{font-size:clamp(22px,1.7vw,34px)}.grid{height:71%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:.8vh .8vw}.center-card{display:grid;grid-template-columns:38px 82px minmax(145px,1.25fr) minmax(145px,.9fr) minmax(135px,.8fr) 86px;align-items:center;gap:.6vw;padding:.65vh .75vw;border-radius:17px;background:rgba(255,253,247,.94);border:1.5px solid rgba(78,108,122,.14);box-shadow:0 4px 10px rgba(48,70,80,.05)}.drag{font-size:22px;color:#8a9892;text-align:center}.picture-wrap{text-align:center}.preview{width:72px;height:62px;border:1.3px solid #b5c5c2;border-radius:11px;background:#f7f5ec;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:auto}.preview img{width:100%;height:100%;object-fit:contain}.picture-buttons{display:flex;justify-content:center;gap:3px;margin-top:3px}.pic-btn{border:1px solid #b4c3c0;border-radius:7px;background:#eef4f1;color:#173f72;font-size:10px;font-weight:900;padding:3px 5px;cursor:pointer}.file{display:none}.name-wrap label,.cap-wrap label{display:block;font-size:clamp(9px,.62vw,12px);font-weight:900;color:#687a74;margin-bottom:.2vh}.name-input{width:100%;height:4vh;border:1.3px solid #b4c3c0;border-radius:9px;background:#fff;padding:0 .55vw;color:#173f72;font-size:clamp(14px,.9vw,17px);font-weight:900}.cap-control{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:.25vw}.cap-control button{height:4vh;border:1.2px solid #adc0c0;border-radius:9px;background:#edf4f2;color:#173f72;font-size:20px;font-weight:900;cursor:pointer}.cap-value{height:4vh;border:1.2px solid #adc0c0;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,1.05vw,21px);font-weight:900}.toggle-wrap{display:flex;align-items:center;justify-content:center;gap:.4vw}.toggle{position:relative;width:52px;height:28px;border-radius:999px;background:#b9c4c1;cursor:pointer}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:white;transition:.15s}.toggle.on{background:#6ea578}.toggle.on:after{left:27px}.state{font-weight:900;font-size:clamp(11px,.72vw,14px);min-width:42px}.order{display:flex;justify-content:flex-end;gap:.25vw}.order button{width:35px;height:33px;border:1.2px solid #b5c3c0;border-radius:8px;background:#f6f7f1;color:#173f72;font-size:15px;font-weight:900;cursor:pointer}.footer{height:8%;display:flex;align-items:center;justify-content:space-between;margin-top:1vh}.note{font-size:clamp(10px,.72vw,14px);color:#66756f;font-weight:700}.actions{display:flex;gap:.6vw}.actions button{border:0;border-radius:13px;padding:1vh 1.2vw;font-size:clamp(13px,.88vw,17px);font-weight:900;cursor:pointer}.reset{background:#ece9df;color:#42535a}.save{background:#648fae;color:white}.toast{position:fixed;left:50%;bottom:2.5vh;transform:translateX(-50%) translateY(20px);opacity:0;background:#173f72;color:white;padding:.9vh 1.2vw;border-radius:999px;font-weight:900;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><main class="page"><header class="top"><div><h1>Centers & Capacity</h1><div class="sub">Manage each center’s name, picture, capacity, availability, and order.</div></div><button class="back" onclick="location.href='teachers-desk.html'">← Teacher’s Desk</button></header><section class="summary"><div class="summary-card"><span>Centers</span><strong id="centerCount">8</strong></div><div class="summary-card"><span>Open Today</span><strong id="openCount">8</strong></div><div class="summary-card"><span>Total Spots</span><strong id="spotCount">31</strong></div></section><section class="grid" id="grid"></section><footer class="footer"><div class="note">Custom pictures are saved on this device. Restore Default returns the original Center Choice picture.</div><div class="actions"><button class="reset" id="resetBtn">Reset Defaults</button><button class="save" id="saveBtn">Save Changes</button></div></footer></main><div class="toast" id="toast">Saved!</div><script>const DEFAULTS=[{name:'Dramatic Play',capacity:4,open:true,picture:'assets/dramatic-play.webp'},{name:'Writing',capacity:4,open:true,picture:'assets/writing.webp'},{name:'Music',capacity:3,open:true,picture:'assets/music.webp'},{name:'Blocks',capacity:4,open:true,picture:'assets/blocks.webp'},{name:'Science',capacity:4,open:true,picture:'assets/science.webp'},{name:'Art',capacity:4,open:true,picture:'assets/art.webp'},{name:'Manipulatives',capacity:4,open:true,picture:'assets/manipulatives.webp'},{name:'Reading',capacity:4,open:true,picture:'assets/reading.webp'}],KEY='eea-centers-config';let centers=load();const grid=document.getElementById('grid'),toast=document.getElementById('toast');function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(saved)&&saved.length)return saved.map((x,i)=>({name:String(x.name||DEFAULTS[i]?.name||'Center'),capacity:Math.max(1,Math.min(12,Number(x.capacity)||1)),open:x.open!==false,picture:x.picture||DEFAULTS[i]?.picture||''}))}catch(e){}return DEFAULTS.map(x=>({...x}))}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){grid.innerHTML='';centers.forEach((c,i)=>{const card=document.createElement('div');card.className='center-card';card.innerHTML=`<div class="drag">☰</div><div class="picture-wrap"><div class="preview">${c.picture?`<img src="${esc(c.picture)}" alt="">`:''}</div><div class="picture-buttons"><button class="pic-btn" data-change="${i}">Change</button><button class="pic-btn" data-restore="${i}">Default</button></div><input class="file" id="file-${i}" type="file" accept="image/*"></div><div class="name-wrap"><label>Center Name</label><input class="name-input" value="${esc(c.name)}" data-name="${i}"></div><div class="cap-wrap"><label>Capacity</label><div class="cap-control"><button data-minus="${i}">−</button><div class="cap-value">${c.capacity}</div><button data-plus="${i}">+</button></div></div><div class="toggle-wrap"><div class="toggle ${c.open?'on':''}" data-toggle="${i}"></div><div class="state">${c.open?'Open':'Closed'}</div></div><div class="order"><button data-up="${i}">↑</button><button data-down="${i}">↓</button></div>`;grid.appendChild(card)});bind();updateSummary()}function persistCenters(){try{localStorage.setItem(KEY,JSON.stringify(centers));return true}catch(e){flash('Could not save center status');return false}}function bind(){document.querySelectorAll('[data-name]').forEach(el=>el.oninput=()=>centers[+el.dataset.name].name=el.value);document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let i=+b.dataset.minus;centers[i].capacity=Math.max(1,centers[i].capacity-1);render()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{let i=+b.dataset.plus;centers[i].capacity=Math.min(12,centers[i].capacity+1);render()});document.querySelectorAll('[data-toggle]').forEach(t=>t.onclick=()=>{let i=+t.dataset.toggle;centers[i].open=!centers[i].open;const saved=persistCenters();render();if(saved)flash(centers[i].open?'Center opened — saved':'Center closed — saved')});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>document.getElementById('file-'+b.dataset.change).click());document.querySelectorAll('.file').forEach(inp=>inp.onchange=()=>{const file=inp.files&&inp.files[0];if(!file)return;if(!file.type.startsWith('image/'))return flash('Please choose an image');const reader=new FileReader();reader.onload=()=>{centers[+inp.id.split('-')[1]].picture=reader.result;render();flash('Picture ready — save changes')};reader.readAsDataURL(file)});document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const i=+b.dataset.restore;const original=DEFAULTS.find(d=>d.name===centers[i].name)||DEFAULTS[i];centers[i].picture=original?original.picture:'';render();flash('Default picture restored')})}function move(i,d){const j=i+d;if(j<0||j>=centers.length)return;[centers[i],centers[j]]=[centers[j],centers[i]];render()}function updateSummary(){centerCount.textContent=centers.length;openCount.textContent=centers.filter(c=>c.open).length;spotCount.textContent=centers.filter(c=>c.open).reduce((n,c)=>n+c.capacity,0)}function flash(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),1400)}saveBtn.onclick=()=>{centers.forEach(c=>c.name=c.name.trim()||'Center');if(persistCenters())flash('Centers saved!');render()};resetBtn.onclick=()=>{centers=DEFAULTS.map(x=>({...x}));render();flash('Defaults restored')};render();</script></body></html>
