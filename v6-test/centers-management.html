<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centers & Capacity</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;color:#173f72;background:#dce8e6}.page{width:100vw;height:100vh;padding:2vh 2vw;background:linear-gradient(180deg,#eef5f1,#f7f1e5);position:relative}.top{height:10%;display:flex;align-items:center;justify-content:space-between}.top h1{margin:0;font-size:clamp(34px,3vw,58px)}.top .sub{color:#61746f;font-size:clamp(14px,1vw,19px);font-weight:700;margin-top:.35vh}.back{border:1.7px solid rgba(73,104,122,.2);border-radius:15px;background:#fffaf0;color:#173f72;padding:1.1vh 1.2vw;font-weight:900;font-size:clamp(14px,.95vw,18px);cursor:pointer;box-shadow:0 4px 10px rgba(45,66,75,.08)}.summary{height:10%;display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;margin-bottom:1.4vh}.summary-card{border:1.5px solid rgba(80,110,124,.14);border-radius:18px;background:rgba(255,253,247,.9);display:flex;align-items:center;justify-content:center;gap:.7vw;font-weight:900;box-shadow:0 5px 12px rgba(48,70,80,.06)}.summary-card strong{font-size:clamp(25px,2vw,38px)}.grid{height:67%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:1vh 1vw}.center-card{display:grid;grid-template-columns:44px minmax(170px,1.4fr) minmax(180px,1fr) minmax(160px,.95fr) 100px;align-items:center;gap:.9vw;padding:1vh 1vw;border-radius:18px;background:rgba(255,253,247,.94);border:1.5px solid rgba(78,108,122,.14);box-shadow:0 5px 12px rgba(48,70,80,.06)}.drag{font-size:24px;color:#8a9892;text-align:center;user-select:none}.name-wrap label,.cap-wrap label{display:block;font-size:clamp(10px,.7vw,13px);font-weight:900;color:#687a74;margin-bottom:.3vh}.name-input{width:100%;height:4.4vh;border:1.4px solid #b4c3c0;border-radius:10px;background:#fff;padding:0 .65vw;color:#173f72;font-size:clamp(15px,1vw,19px);font-weight:900}.cap-control{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:.35vw}.cap-control button{height:4.4vh;border:1.3px solid #adc0c0;border-radius:10px;background:#edf4f2;color:#173f72;font-size:22px;font-weight:900;cursor:pointer}.cap-value{height:4.4vh;border:1.3px solid #adc0c0;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,1.2vw,23px);font-weight:900}.toggle-wrap{display:flex;align-items:center;justify-content:center;gap:.55vw}.toggle{position:relative;width:58px;height:30px;border-radius:999px;background:#b9c4c1;cursor:pointer;transition:.15s}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:white;box-shadow:0 2px 5px rgba(0,0,0,.14);transition:.15s}.toggle.on{background:#6ea578}.toggle.on:after{left:31px}.state{font-weight:900;font-size:clamp(12px,.8vw,15px);min-width:46px}.order{display:flex;justify-content:flex-end;gap:.35vw}.order button{width:40px;height:36px;border:1.2px solid #b5c3c0;border-radius:9px;background:#f6f7f1;color:#173f72;font-size:17px;font-weight:900;cursor:pointer}.footer{height:10%;display:flex;align-items:center;justify-content:space-between;margin-top:1.4vh}.note{font-size:clamp(11px,.8vw,15px);color:#66756f;font-weight:700}.actions{display:flex;gap:.7vw}.actions button{border:0;border-radius:14px;padding:1.2vh 1.3vw;font-size:clamp(14px,.95vw,18px);font-weight:900;cursor:pointer}.reset{background:#ece9df;color:#42535a}.save{background:#648fae;color:white;box-shadow:0 5px 11px rgba(50,77,94,.16)}.toast{position:fixed;left:50%;bottom:3.5vh;transform:translateX(-50%) translateY(20px);opacity:0;background:#173f72;color:white;padding:1vh 1.2vw;border-radius:999px;font-weight:900;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><main class="page"><header class="top"><div><h1>Centers & Capacity</h1><div class="sub">Manage the centers children can choose and how many friends can play in each one.</div></div><button class="back" onclick="location.href='teachers-desk.html'">← Teacher’s Desk</button></header><section class="summary"><div class="summary-card"><span>Centers</span><strong id="centerCount">8</strong></div><div class="summary-card"><span>Open Today</span><strong id="openCount">8</strong></div><div class="summary-card"><span>Total Spots</span><strong id="spotCount">31</strong></div></section><section class="grid" id="grid"></section><footer class="footer"><div class="note">Changes are saved here first. We’ll connect this page to Center Choice after the layout is approved.</div><div class="actions"><button class="reset" id="resetBtn">Reset Defaults</button><button class="save" id="saveBtn">Save Changes</button></div></footer></main><div class="toast" id="toast">Saved!</div><script>const DEFAULTS=[{name:'Dramatic Play',capacity:4,open:true},{name:'Writing',capacity:4,open:true},{name:'Music',capacity:3,open:true},{name:'Blocks',capacity:4,open:true},{name:'Science',capacity:4,open:true},{name:'Art',capacity:4,open:true},{name:'Manipulatives',capacity:4,open:true},{name:'Reading',capacity:4,open:true}],KEY='eea-centers-config';let centers=load();const grid=document.getElementById('grid'),toast=document.getElementById('toast');function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(saved)&&saved.length)return saved.map(x=>({name:String(x.name||'Center'),capacity:Math.max(1,Math.min(12,Number(x.capacity)||1)),open:x.open!==false}))}catch(e){}return DEFAULTS.map(x=>({...x}))}function render(){grid.innerHTML='';centers.forEach((c,i)=>{const card=document.createElement('div');card.className='center-card';card.innerHTML=`<div class="drag">☰</div><div class="name-wrap"><label>Center Name</label><input class="name-input" value="${esc(c.name)}" data-name="${i}"></div><div class="cap-wrap"><label>Capacity</label><div class="cap-control"><button data-minus="${i}">−</button><div class="cap-value">${c.capacity}</div><button data-plus="${i}">+</button></div></div><div class="toggle-wrap"><div class="toggle ${c.open?'on':''}" data-toggle="${i}"></div><div class="state">${c.open?'Open':'Closed'}</div></div><div class="order"><button data-up="${i}" aria-label="Move up">↑</button><button data-down="${i}" aria-label="Move down">↓</button></div>`;grid.appendChild(card)});bind();updateSummary()}function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function bind(){document.querySelectorAll('[data-name]').forEach(el=>el.oninput=()=>centers[+el.dataset.name].name=el.value);document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const i=+b.dataset.minus;centers[i].capacity=Math.max(1,centers[i].capacity-1);render()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const i=+b.dataset.plus;centers[i].capacity=Math.min(12,centers[i].capacity+1);render()});document.querySelectorAll('[data-toggle]').forEach(t=>t.onclick=()=>{const i=+t.dataset.toggle;centers[i].open=!centers[i].open;render()});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1))}function move(i,d){const j=i+d;if(j<0||j>=centers.length)return;[centers[i],centers[j]]=[centers[j],centers[i]];render()}function updateSummary(){document.getElementById('centerCount').textContent=centers.length;document.getElementById('openCount').textContent=centers.filter(c=>c.open).length;document.getElementById('spotCount').textContent=centers.filter(c=>c.open).reduce((n,c)=>n+c.capacity,0)}function flash(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),1200)}document.getElementById('saveBtn').onclick=()=>{centers.forEach(c=>c.name=c.name.trim()||'Center');localStorage.setItem(KEY,JSON.stringify(centers));render();flash('Centers saved!')};document.getElementById('resetBtn').onclick=()=>{centers=DEFAULTS.map(x=>({...x}));render();flash('Defaults restored')};render();</script></body></html>
