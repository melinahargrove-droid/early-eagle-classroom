<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 1 Intro to Centers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.3vh 4.8vw;display:grid;grid-template-columns:46% 1fr;gap:4.5vw;align-items:center}.visual{position:relative;height:60vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;padding:3vh 2vw}.visual img{max-width:92%;max-height:55vh;object-fit:contain;border-radius:22px}.editVisual{position:absolute;left:14px;bottom:14px;z-index:35;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.95);color:#245c82;padding:.55vh .8vw;font-weight:900;font-size:clamp(11px,.72vw,14px);cursor:pointer;box-shadow:0 4px 12px #0002}.small{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px)}.content h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.sub{font-size:clamp(20px,1.35vw,27px);color:#527673;font-weight:900}.prompt{margin-top:2vh;padding:1.5vh 1.4vw;border-radius:19px;background:#e7f0ed;color:#416d61;font-size:clamp(21px,1.5vw,29px);font-weight:900;line-height:1.3}.reminder{margin-top:1.5vh;color:#557876;font-size:clamp(17px,1.12vw,22px);font-weight:850;line-height:1.4}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.next,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer}.teacher{background:#fffdf8;color:#245c78}.next,.done{background:#668f99;color:white;border-color:#668f99}.done{position:absolute;right:3.2vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(530px,37vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.45;color:#4e706c;font-weight:750}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · INTRO TO CENTERS</div><h1>Today in Centers</h1></div><div class="actions"><div class="chip" id="chip"></div><button class="icon" id="exit">×</button></div></div><section class="card"><div class="visual"><img id="art" alt="Center visual"><button class="editVisual" id="editVisual">✎ Edit Visual</button></div><div class="content"><div class="small" id="small"></div><h2 id="title"></h2><div class="sub" id="sub"></div><div class="prompt" id="prompt"></div><div class="reminder" id="reminder"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Notes</button><button class="next" id="next" style="display:none">Next Center →</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label">TEACHER NOTES</div><h3 id="noteTitle"></h3><p id="notes"></p><div class="label">MATERIALS / VOCABULARY</div><p id="materials"></p></aside></main><script src="visual-store.js?v=20260823-1054"></script><script src="lesson-visual-edit.js?v=20260823-1054"></script><script>(()=>{const all={Monday:[{title:'Drawing',sub:'Art Studio',img:'assets/art.webp',small:'NEW CENTER',prompt:'What can you make with crayons and paper?',reminder:'Choose your paper and crayons. When you are finished, put the crayons back.',notes:'Introduce the drawing materials and demonstrate making lines or rubbing color onto paper. Model choosing materials and returning crayons when finished.',materials:'Paper · crayons · draw'},{title:'Playdough',sub:'Discovery',img:'assets/science.webp',small:'NEW CENTER',prompt:'What can your hands do with playdough?',reminder:'Roll it. Pinch it. Press it. Playdough stays at the table.',notes:'Invite children to notice the playdough with touch, smell, and sight. Demonstrate rolling, pinching, and pressing.',materials:'Playdough · roll · pinch · press'}],Tuesday:[{title:'Exploring Blocks',sub:'Blocks',img:'assets/blocks.webp',small:'NEW CENTER',prompt:'What can you build with our blocks?',reminder:'Look at the shapes and sizes. Build carefully and keep blocks in the Blocks Center.',notes:'Connect to Lola and her friends building a castle. Show available blocks and invite children to explore shapes, sizes, and structures.',materials:'Unit blocks · build · shape · size'},{title:'Looking at Books',sub:'Library & Listening',img:'assets/reading.webp',small:'NEW CENTER',prompt:'What book would you like to look at?',reminder:'Use gentle hands. Turn pages carefully. Put the book back when you are done.',notes:'Model choosing a book, looking at der(){const d=items[i];$('chip').textContent='WEEK 1 · '+day.toUpperCase()+` · ${i+1}/${items.length}`;$('art').src=d.img;applyVisual(d);$('small').textContent=d.small;$('title').textContent=d.title;$('sub').textContent=d.sub;$('prompt').textContent=d.prompt;$('reminder').textContent=d.reminder;$('noteTitle').textContent=d.title;$('notes').textContent=d.notes;$('materials').textContent=d.materials;$('next').style.display=i<items.length-1?'inline-block':'none';$('done').style.display=i===items.length-1?'inline-block':'none';$('panel').classList.remove('open')}$('next').onclick=()=>{if(i<items.length-1){i++;render()}};$('done').onclick=$('exit').onclick=()=>location.href=target;$('teacher').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');$('editVisual').onclick=()=>{const q=new URLSearchParams(location.search);q.set('item',String(i));const back='centers-week1.html?'+q.toString();location.href='visual-editor.html?slot='+encodeURIComponent(slot())+'&return='+encodeURIComponent(back)};render()})();</script></body></html>
