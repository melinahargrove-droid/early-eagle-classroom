<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Building Blocks</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1120px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697}h1,h2,h3{color:#165487}.card p,.card li{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}.box{background:#e7f0ed;border-radius:18px;padding:15px;margin:12px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Building Blocks</h1><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'Count and Move in Patterns + Match and Name Shapes',html:`<h3>Patterns / Numeracy</h3><p>Count aloud from 1–10 in patterns of two, alternating by volume or action, then pausing after each pair.</p><h3>Geometry · Match and Name Shapes</h3><p>Give each child a Shape Set shape and hold up a matching shape. Ask who has the match and how they know. Pair children to compare shapes, decide whether they are the same or different, and name them.</p>`},Tuesday:{title:'Match Blocks + Circle Time',html:`<h3>Geometry · Match Blocks</h3><p>Use blocks with different-shaped faces and match those shapes to objects in the classroom. Outline a block face and ask what classroom objects have the same shape.</p><h3>Circle Time</h3><p>Use a large flat circle such as a hula hoop and circle-shaped objects. Notice that a circle is perfectly round and has one continuous curved line. Trace circles and make circles with fingers, hands, arms, and mouths.</p>`},Wednesday:{title:'Building Shapes / The Shape of Things + Circles and Cans',html:`<h3>Read Aloud · Building Shapes or The Shape of Things</h3><p>Read one of the big books and revisit familiar shapes. Introduce the term <b>rhombus</b> for the shape children may know as a diamond.</p><h3>Circles and Cans</h3><p>Trace the bottoms of different-size food cans. Children match the cans to the traced circles, including placing cans directly on traces to compare size.</p>`},Thursday:{title:'Wake Up, Jack in the Box + Match Blocks',html:`<h3>Numeracy</h3><p>Recite <b>Wake Up, Jack in the Box</b> together with gestures and counting.</p><h3>Geometry · Match Blocks</h3><p>Review rectangle, square, circle, and triangle blocks and find classroom objects with matching shapes. Reinforce shape attributes when children need support naming them.</p>`},Friday:{title:'Circle Poem + Circle Time + Circle or Not?',html:`<p>Recite the curriculum’s circle poem with gestures, making a small circle, larger circle, and great big circle, then counting 1–2–3.</p><h3>Circle Time</h3><p>Revisit the large circle and circle-shaped objects. Trace and make circles with different body parts.</p><h3>Circle or Not?</h3><p>Compare a true circle to an ellipse and other similar shapes. Ask why each example is or is not a circle, returning to the definition: perfectly round, with a continuous curved line that always curves the same way.</p>`}}[day];tag.textContent='WEEK 7 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
