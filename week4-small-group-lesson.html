<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 4 Small Group</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:#f7f2e7}.page{height:100vh;padding:4vh 6vw}.card{height:80vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;padding:5vh 6vw;display:grid;grid-template-columns:35% 1fr;gap:5vw;align-items:center}.visual{height:52vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;font-size:90px}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:55px;margin:1vh 0;color:#164f7f}.lead{font-size:25px;font-weight:900;color:#527673}.steps{display:grid;gap:1vh;margin-top:2vh}.step{background:#e7f0ed;border-radius:16px;padding:1.1vh 1vw;font-size:18px;font-weight:900;color:#416d61}.bottom{display:flex;justify-content:center;gap:14px;margin-top:2vh}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.bottom .done{background:#668f99;color:#fff;border-color:#668f99}</style></head><body><main class="page"><section class="card"><div class="visual" id="icon"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="steps" id="steps"></div></div></section><div class="bottom"><button id="back">← Small Group Choices</button><button class="done" id="doneBtn">Done with Small Groups ✓</button></div></main><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const d={writing:{icon:'✏️',title:'Writing Basics',lead:'Use drawing and dictation to communicate information about yourself.',steps:['Invite the child to draw something that communicates an idea about themself.','Talk together about what the drawing shows.','Support the child in adding details to the drawing when appropriate.']},skills:{icon:'🔤',title:'Skills Reinforcement',lead:'Revisit specific foundational literacy skills that need more practice.',steps:['Use observations to choose the skill to revisit.','Use the established Foundational Literacy reinforcement materials for the skill children need to practice.','Keep practice brief, responsive, and targeted.']},charades:{icon:'🏘️',title:'Neighborhood Charades',lead:'Act out activities people might do around their neighborhood.',steps:['Model an activity such as reading at the library, walking, getting a hairstyle, having a snack, or riding a bike.','One or two children act while everyone else guesses.','Ask: “What do you do in your neighborhood?”']},fine:{icon:'🤏',title:'Fine Motor Development',lead:'Choose practice based on observation and individual fine-motor goals.',steps:['Observe current skills and stamina.','Choose an appropriate activity from the established fine-motor options.','Provide the level of support the child needs without inventing a required Week 4 task.']}};const p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',x=d[p.get('activity')]||d.writing;icon.textContent=x.icon;eye.textContent='WEEK 4 · '+day.toUpperCase();title.textContent=x.title;lead.textContent=x.lead;steps.innerHTML=x.steps.map(s=>'<div class="step">'+s+'</div>').join('');back.onclick=()=>location.href='week4-small-groups.html?day='+encodeURIComponent(day);doneBtn.onclick=()=>location.href='daily-lessons.html?week=4&day='+days.indexOf(day)})();</script></body></html>
