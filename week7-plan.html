<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Plan</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:linear-gradient(#faf7ec,#eef4ef);color:#174f76}.page{padding:24px;max-width:1280px;margin:auto}.tag{font-size:12px;font-weight:900;letter-spacing:.11em;color:#789697}.hero{background:#fffdf8;border:1px solid #c9dadd;border-radius:30px;padding:28px;margin-bottom:18px}.hero h1{font-size:42px;margin:4px 0;color:#165487}.hero p{font-size:18px;font-weight:750;color:#55747b}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.day{background:#fffdf8;border:1px solid #c9dadd;border-radius:24px;padding:18px}.day h2{margin:0 0 12px;color:#165487}.day a{display:block;text-decoration:none;background:#e7f0ed;color:#315f66;border-radius:14px;padding:11px 12px;margin:8px 0;font-weight:900}.book{background:#f6eadf!important}@media(max-width:1050px){.days{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.days{grid-template-columns:1fr}}</style></head><body><main class="page"><section class="hero"><div class="tag">EARLY EAGLE ACADEMY · UNIT 1</div><h1>Week 7 · Together in Our Community</h1><p>Guiding question: Who are the people in our families?</p></section><div class="days" id="days"></div></main><script>const books={Monday:'Alma and How She Got Her Name · Read 1',Tuesday:'Alma and How She Got Her Name · Read 2',Wednesday:'Hair Love · Read 1',Thursday:'Hair Love · Read 2',Friday:'Hair Love · Read 3'};const lessons=[['Community Meeting','community-meeting-week7.html'],['Intro to Centers','week7-intro-centers.html'],['Read Aloud','week7-read-aloud.html','book'],['Foundational Literacy','week7-foundational.html'],['Writing','week7-writing.html'],['Literacy Small Groups','week7-small-groups.html'],['Building Blocks','week7-building-blocks.html'],['Storytelling & Story Acting','week7-storytelling.html'],['Centers Guide','week7-centers.html'],['Closing Circle','closing-circle-week7.html']];const root=document.getElementById('days');['Monday','Tuesday','Wednesday','Thursday','Friday'].forEach(day=>{const c=document.createElement('section');c.className='day';c.innerHTML=`<div class="tag">WEEK 7</div><h2>${day}</h2><div class="tag" style="margin-bottom:12px">${books[day]}</div>`+lessons.map(x=>`<a class="${x[2]||''}" href="${x[1]}?day=${day}">${x[0]}</a>`).join('');root.appendChild(c)});</script></body></html>
