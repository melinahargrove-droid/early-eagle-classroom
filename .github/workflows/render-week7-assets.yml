name: Render Week 7 Read Aloud Assets

on:
  push:
    branches:
      - fix-week7-reader-shell
    paths:
      - .github/workflows/render-week7-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-week7-reader-shell

      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils

      - name: Render Week 7 adapted books
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/week7/alma /tmp/week7/hair
          ALMA="v6-test/assets/_01b. Fo4s U1W7 Read Aloud_ Alma and How She Got Her Name - Adapted Text.pptx"
          HAIR="v6-test/assets/_02b. Fo4s U1W7 Read Aloud_ Hair Love - Adapted Text.pptx"
          soffice --headless --convert-to pdf --outdir /tmp/week7 "$ALMA"
          soffice --headless --convert-to pdf --outdir /tmp/week7 "$HAIR"
          ALMA_PDF="/tmp/week7/_01b. Fo4s U1W7 Read Aloud_ Alma and How She Got Her Name - Adapted Text.pdf"
          HAIR_PDF="/tmp/week7/_02b. Fo4s U1W7 Read Aloud_ Hair Love - Adapted Text.pdf"
          pdftoppm -jpeg -jpegopt quality=92 -r 150 "$ALMA_PDF" /tmp/week7/alma/slide
          pdftoppm -jpeg -jpegopt quality=92 -r 150 "$HAIR_PDF" /tmp/week7/hair/slide
          i=1
          for f in $(find /tmp/week7/alma -name 'slide-*.jpg' | sort -V); do
            printf -v n '%02d' "$i"
            cp "$f" "v6-test/assets/alma-and-how-she-got-her-name-$n.jpg"
            i=$((i+1))
          done
          i=1
          for f in $(find /tmp/week7/hair -name 'slide-*.jpg' | sort -V); do
            printf -v n '%02d' "$i"
            cp "$f" "v6-test/assets/hair-love-$n.jpg"
            i=$((i+1))
          done
          test -f v6-test/assets/alma-and-how-she-got-her-name-19.jpg
          test -f v6-test/assets/hair-love-16.jpg

      - name: Commit regenerated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- v6-test/assets/alma-and-how-she-got-her-name-*.jpg v6-test/assets/hair-love-*.jpg
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Regenerate Week 7 read aloud page images"
            git push origin HEAD:fix-week7-reader-shell
          fi
