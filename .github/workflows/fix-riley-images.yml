name: Fix What Riley Wore image paths

on:
  push:
    paths:
      - '.github/workflows/fix-riley-images.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Riley image paths and desktop packaging
        shell: pwsh
        run: |
          $files = @(
            'v6-test/what-riley-wore-read-1.html',
            'v6-test/what-riley-wore-read-2.html',
            'v6-test/what-riley-wore-read-3.html'
          )
          $old = '../what-riley-wore/'
          $live = 'https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/main/what-riley-wore/'
          foreach ($f in $files) {
            $text = Get-Content $f -Raw
            $text = $text.Replace($old, $live)
            Set-Content $f $text -Encoding UTF8
          }

          $wf = '.github/workflows/build-windows-app.yml'
          $text = Get-Content $wf -Raw
          if ($text -notmatch 'Copy-Item -Recurse what-riley-wore') {
            $text = $text.Replace('Copy-Item -Recurse v6-test desktop-app/app', "Copy-Item -Recurse v6-test desktop-app/app`n          Copy-Item -Recurse what-riley-wore desktop-app/app/what-riley-wore")
          }
          if ($text -notmatch '\$rileyPrefix') {
            $needle = "$prefix = 'https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/'"
            $replacement = "$prefix = 'https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/'`n          `$rileyPrefix = 'https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/main/what-riley-wore/'"
            $text = $text.Replace($needle, $replacement)
            $text = $text.Replace("`$text = `$text.Replace(`$prefix, '/remote-assets/')", "`$text = `$text.Replace(`$prefix, '/remote-assets/')`n            `$text = `$text.Replace(`$rileyPrefix, '/what-riley-wore/')")
          }
          Set-Content $wf $text -Encoding UTF8
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v6-test/what-riley-wore-read-1.html v6-test/what-riley-wore-read-2.html v6-test/what-riley-wore-read-3.html .github/workflows/build-windows-app.yml
          git diff --cached --quiet || git commit -m "Fix What Riley Wore book image loading"
          git push
