name: Build PWA Install Assets

on:
  push:
    paths:
      - '.github/workflows/generate-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Render existing EEA app icon at required PWA sizes
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path

          src = Path('v6-test/assets/app-icon.svg')
          for size in (192, 512):
              cairosvg.svg2png(
                  url=str(src),
                  write_to=f'v6-test/assets/pwa-icon-{size}.png',
                  output_width=size,
                  output_height=size,
              )
          PY
      - name: Keep Home install metadata current
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('v6-test/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '<title>EEA Classroom Companion — V6 Test</title>',
              '<title>EEA Classroom Companion</title>',
              1,
          )
          if 'rel="manifest"' not in text:
              marker = '<title>EEA Classroom Companion</title>'
              replacement = marker + '<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#174e88">'
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated install assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v6-test/assets/pwa-icon-192.png v6-test/assets/pwa-icon-512.png v6-test/index.html
          git commit -m "Keep EEA PWA install assets current" || exit 0
          git push
