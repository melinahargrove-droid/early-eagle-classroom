name: Audit V6 Static App

on:
  workflow_dispatch:
  push:
    paths:
      - 'v6-test/**'
      - 'scripts/audit_v6_static.py'
      - 'scripts/test_week9_history*.cjs'
      - 'scripts/test_week10_community*.cjs'
      - 'scripts/test_week10_readaloud*.cjs'
      - 'scripts/test_inline_scripts.cjs'
      - 'scripts/test_week2_reader*.cjs'
      - 'scripts/test_week3_5_centers*.cjs'
      - 'scripts/test_week1_centers_exit*.cjs'
      - 'scripts/test_week8_triangle_hunt*.cjs'
      - 'scripts/test_attendance_assets*.cjs'
      - '.github/workflows/audit-v6-static.yml'
  pull_request:
    paths:
      - 'v6-test/**'
      - 'scripts/audit_v6_static.py'
      - 'scripts/test_week9_history*.cjs'
      - 'scripts/test_week10_community*.cjs'
      - 'scripts/test_week10_readaloud*.cjs'
      - 'scripts/test_inline_scripts.cjs'
      - 'scripts/test_week2_reader*.cjs'
      - 'scripts/test_week3_5_centers*.cjs'
      - 'scripts/test_week1_centers_exit*.cjs'
      - 'scripts/test_week8_triangle_hunt*.cjs'
      - 'scripts/test_attendance_assets*.cjs'
      - '.github/workflows/audit-v6-static.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local V6 references
        run: python scripts/audit_v6_static.py
      - name: Check core JavaScript syntax
        run: |
          node scripts/test_inline_scripts.cjs
          node --check v6-test/sw.js
          node --check v6-test/class-profile.js
          node --check v6-test/classroom-protection.js
          node --check v6-test/star-engine.js
          node --check v6-test/center-choice-state.js
          node --check v6-test/choose-a-friend-state.js
      - name: Check Unit 1 runtime and Unit 2 history regressions
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/eea-history-qa" jsdom@26.1.0 playwright@1.62.1
          export NODE_PATH="$RUNNER_TEMP/eea-history-qa/node_modules"
          node scripts/test_week9_history.cjs
          node scripts/test_week10_community.cjs
          node scripts/test_week10_readaloud.cjs
          node scripts/test_week10_readaloud_tuesday.cjs
          node scripts/test_week10_readaloud_wednesday.cjs
          node scripts/test_week10_readaloud_colors.cjs
          node scripts/test_week2_reader.cjs
          node scripts/test_week3_5_centers.cjs
          node scripts/test_week1_centers_exit.cjs
          node scripts/test_week8_triangle_hunt.cjs
          node scripts/test_attendance_assets.cjs
          "$RUNNER_TEMP/eea-history-qa/node_modules/.bin/playwright" install --with-deps chromium
          node scripts/test_week9_history_browser.cjs
          WEEK10_SCREENSHOT_DIR="$RUNNER_TEMP/week10-qa" node scripts/test_week10_community_browser.cjs
          WEEK10_READALOUD_COLORS_SCREENSHOT_DIR="$RUNNER_TEMP/week10-readaloud-colors-qa" node scripts/test_week10_readaloud_colors_browser.cjs
          WEEK10_READALOUD_WEDNESDAY_SCREENSHOT_DIR="$RUNNER_TEMP/week10-readaloud-wednesday-qa" node scripts/test_week10_readaloud_wednesday_browser.cjs
          WEEK10_READALOUD_TUESDAY_SCREENSHOT_DIR="$RUNNER_TEMP/week10-readaloud-tuesday-qa" node scripts/test_week10_readaloud_tuesday_browser.cjs
          WEEK10_READALOUD_SCREENSHOT_DIR="$RUNNER_TEMP/week10-readaloud-qa" node scripts/test_week10_readaloud_browser.cjs
          node scripts/test_week2_reader_browser.cjs
          node scripts/test_week3_5_centers_browser.cjs
          node scripts/test_week1_centers_exit_browser.cjs
          node scripts/test_week8_triangle_hunt_browser.cjs
          ATTENDANCE_SCREENSHOT_DIR="$RUNNER_TEMP/attendance-qa" node scripts/test_attendance_assets_browser.cjs
      - name: Upload synthetic attendance verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-asset-verification
          path: ${{ runner.temp }}/attendance-qa/*.png
          if-no-files-found: ignore
      - name: Upload Week 10 Community verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-community-verification
          path: ${{ runner.temp }}/week10-qa/*.png
          if-no-files-found: ignore
      - name: Upload Monday Week 10 Read Aloud verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-monday-readaloud-verification
          path: ${{ runner.temp }}/week10-readaloud-qa/*.png
          if-no-files-found: ignore
      - name: Upload Tuesday Week 10 Read Aloud verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-tuesday-readaloud-verification
          path: ${{ runner.temp }}/week10-readaloud-tuesday-qa/*.png
          if-no-files-found: ignore
      - name: Upload Wednesday Week 10 Read Aloud verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-wednesday-readaloud-verification
          path: ${{ runner.temp }}/week10-readaloud-wednesday-qa/*.png
          if-no-files-found: ignore
      - name: Upload Thursday Friday book selector verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-color-readaloud-verification
          path: ${{ runner.temp }}/week10-readaloud-colors-qa/*.png
          if-no-files-found: ignore
