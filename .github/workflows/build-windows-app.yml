name: Build Windows Classroom Companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'v6-test/**'
      - 'what-riley-wore/**'
      - 'desktop-app/**'
      - '.github/workflows/build-windows-app.yml'
  pull_request:
    paths:
      - 'v6-test/**'
      - 'what-riley-wore/**'
      - 'desktop-app/**'
      - '.github/workflows/build-windows-app.yml'
      - 'desktop-app-build-trigger.txt'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare app files
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force desktop-app/app -ErrorAction SilentlyContinue
          Copy-Item -Recurse v6-test desktop-app/app
          Copy-Item -Recurse what-riley-wore desktop-app/app/what-riley-wore
          git fetch origin v6-clean-build
          git worktree add "$env:RUNNER_TEMP/v6-clean" origin/v6-clean-build
          New-Item -ItemType Directory -Force desktop-app/app/remote-assets | Out-Null
          Copy-Item -Recurse "$env:RUNNER_TEMP/v6-clean/Assets/*" desktop-app/app/remote-assets/
          $prefix = 'https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/'
          $rileyPrefix = 'https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/main/what-riley-wore/'
          Get-ChildItem desktop-app/app -Recurse -File | Where-Object { $_.Extension -in '.html','.js','.css' } | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text.Replace($prefix, '/remote-assets/')
            $text = $text.Replace($rileyPrefix, '/what-riley-wore/')
            Set-Content $_.FullName $text -Encoding UTF8
          }
          $chooseFriendPath = 'desktop-app/app/choose-a-friend.html'
          $chooseFriend = Get-Content $chooseFriendPath -Raw
          if ($chooseFriend -notmatch 'choose-a-friend-audio-fix\.js') {
            $chooseFriend = $chooseFriend.Replace('</body>', '<script src="./choose-a-friend-audio-fix.js"></script></body>')
            Set-Content $chooseFriendPath $chooseFriend -Encoding UTF8
          }

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build portable Windows app
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Early-Eagle-Classroom-Companion-Windows
          path: desktop-app/dist/Early-Eagle-Classroom-Companion.exe
          if-no-files-found: error
