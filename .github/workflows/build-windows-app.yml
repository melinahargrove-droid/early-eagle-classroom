name: Build Windows Classroom Companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'v6-test/**'
      - 'what-riley-wore/**'
      - 'desktop-app/**'
      - 'scripts/test_week10_centers_friday*.cjs'
      - 'scripts/test_week11_centers_monday*.cjs'
      - 'scripts/test_week11_centers_tuesday*.cjs'
      - 'scripts/fixtures/week11-centers-*-source.txt'
      - 'scripts/fixtures/week11-centers-monday-v95-sw.js'
      - 'scripts/fixtures/week11-centers-tuesday-v96-sw.js'
      - 'scripts/week11-centers-tuesday-response-capture.cjs'
      - 'scripts/test_week10_centers_thursday_target.cjs'
      - '.github/workflows/build-windows-app.yml'
  pull_request:
    paths:
      - 'v6-test/**'
      - 'what-riley-wore/**'
      - 'desktop-app/**'
      - 'scripts/test_week10_centers_friday*.cjs'
      - 'scripts/test_week11_centers_monday*.cjs'
      - 'scripts/test_week11_centers_tuesday*.cjs'
      - 'scripts/fixtures/week11-centers-*-source.txt'
      - 'scripts/fixtures/week11-centers-monday-v95-sw.js'
      - 'scripts/fixtures/week11-centers-tuesday-v96-sw.js'
      - 'scripts/week11-centers-tuesday-response-capture.cjs'
      - 'scripts/test_week10_centers_thursday_target.cjs'
      - '.github/workflows/build-windows-app.yml'
      - 'desktop-app-build-trigger.txt'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare app files
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force desktop-app/app -ErrorAction SilentlyContinue
          Copy-Item -Recurse v6-test desktop-app/app
          Copy-Item -Recurse what-riley-wore desktop-app/app/what-riley-wore
          Copy-Item 'timer back.png' 'desktop-app/app/timer back.png'
          Copy-Item 'timer front.png' 'desktop-app/app/timer front.png'

          $prefix = 'https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/v6-clean-build/Assets/'
          $rileyPrefix = 'https://raw.githubusercontent.com/melinahargrove-droid/early-eagle-classroom/main/what-riley-wore/'
          $sourceFiles = Get-ChildItem desktop-app/app -Recurse -File | Where-Object { $_.Extension -in '.html','.js','.css' }
          $legacyRefs = $sourceFiles | Select-String -SimpleMatch $prefix

          if ($legacyRefs) {
            Write-Host 'Legacy v6-clean-build asset references detected; packaging compatibility assets.'
            git fetch origin v6-clean-build
            git worktree add "$env:RUNNER_TEMP/v6-clean" origin/v6-clean-build
            New-Item -ItemType Directory -Force desktop-app/app/remote-assets | Out-Null
            Copy-Item -Recurse "$env:RUNNER_TEMP/v6-clean/Assets/*" desktop-app/app/remote-assets/
          } else {
            Write-Host 'No legacy v6-clean-build asset references detected; skipping compatibility asset branch.'
          }

          $sourceFiles | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            if ($legacyRefs) { $text = $text.Replace($prefix, '/remote-assets/') }
            $text = $text.Replace($rileyPrefix, '/what-riley-wore/')
            Set-Content $_.FullName $text -Encoding UTF8
          }

          $chooseFriendPath = 'desktop-app/app/choose-a-friend.html'
          $chooseFriend = Get-Content $chooseFriendPath -Raw
          if ($chooseFriend -notmatch 'choose-a-friend-audio-fix\.js') {
            $chooseFriend = $chooseFriend.Replace('</body>', '<script src="./choose-a-friend-audio-fix.js"></script></body>')
            Set-Content $chooseFriendPath $chooseFriend -Encoding UTF8
          }

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Windows Chromium verification tools
        shell: pwsh
        run: |
          npm install --no-save --prefix "$env:RUNNER_TEMP/friday-windows" playwright@1.62.1
          & "$env:RUNNER_TEMP/friday-windows/node_modules/.bin/playwright.cmd" install chromium

      - name: Verify prepared Windows app Center Choice at desktop and tablet sizes
        env:
          NODE_PATH: ${{ runner.temp }}/friday-windows/node_modules
          WEEK10_FRIDAY_APP_ROOT: ${{ github.workspace }}/desktop-app/app
          WEEK10_CENTERS_FRIDAY_SCREENSHOT_DIR: ${{ runner.temp }}/friday-windows-screenshots
        run: node scripts/test_week10_centers_friday_browser.cjs

      - name: Upload Windows Chromium verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-friday-center-choice-windows-chromium
          path: ${{ runner.temp }}/friday-windows-screenshots
          if-no-files-found: warn

      - name: Verify prepared Windows app Monday Week 11 Centers
        env:
          NODE_PATH: ${{ runner.temp }}/friday-windows/node_modules
          WEEK11_MONDAY_APP_ROOT: ${{ github.workspace }}/desktop-app/app
          WEEK11_MONDAY_SCREENSHOT_DIR: ${{ runner.temp }}/week11-monday-windows-screenshots
        run: node scripts/test_week11_centers_monday_browser.cjs

      - name: Upload Monday Week 11 Windows verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week11-monday-centers-windows-chromium
          path: ${{ runner.temp }}/week11-monday-windows-screenshots
          if-no-files-found: warn

      - name: Verify prepared Windows app Tuesday Week 11 Centers
        env:
          NODE_PATH: ${{ runner.temp }}/friday-windows/node_modules
          WEEK11_TUESDAY_APP_ROOT: ${{ github.workspace }}/desktop-app/app
          WEEK11_TUESDAY_SCREENSHOT_DIR: ${{ runner.temp }}/week11-tuesday-windows-screenshots
        run: node scripts/test_week11_centers_tuesday_browser.cjs

      - name: Upload Tuesday Week 11 Windows verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week11-tuesday-centers-windows-chromium
          path: ${{ runner.temp }}/week11-tuesday-windows-screenshots
          if-no-files-found: warn

      - name: Build portable Windows app
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Early-Eagle-Classroom-Companion-Windows
          path: desktop-app/dist/Early-Eagle-Classroom-Companion.exe
          if-no-files-found: error
