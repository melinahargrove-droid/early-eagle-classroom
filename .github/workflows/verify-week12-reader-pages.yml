name: Verify Week 12 Monday, Tuesday, Wednesday and Thursday Readers on Pages
on:
  push:
    branches: [main]
    paths:
      - 'v6-test/**'
      - 'scripts/test_week12_*.cjs'
      - 'scripts/fixtures/week12-readaloud-*.json'
      - '.github/workflows/verify-week12-reader-pages.yml'
permissions:
  contents: read
jobs:
  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium acceptance tools
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/week12-live" playwright@1.62.1
          "$RUNNER_TEMP/week12-live/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify exact deployed Week 12 Monday reader
        env:
          NODE_PATH: ${{ runner.temp }}/week12-live/node_modules
          WEEK12_READALOUD_SCREENSHOT_DIR: ${{ runner.temp }}/week12-monday-reader-live
        run: node scripts/test_week12_readaloud_live.cjs
      - name: Upload actual Pages screenshots and byte manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week12-monday-reader-live-pages
          path: ${{ runner.temp }}/week12-monday-reader-live
          if-no-files-found: warn

      - name: Verify exact deployed Week 12 Tuesday reader
        env:
          NODE_PATH: ${{ runner.temp }}/week12-live/node_modules
          WEEK12_READALOUD_TUESDAY_SCREENSHOT_DIR: ${{ runner.temp }}/week12-tuesday-reader-live
        run: node scripts/test_week12_readaloud_tuesday_live.cjs
      - name: Upload actual Tuesday Pages screenshots and byte manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week12-tuesday-reader-live-pages
          path: ${{ runner.temp }}/week12-tuesday-reader-live
          if-no-files-found: warn

      - name: Verify exact deployed Week 12 Wednesday reader
        env:
          NODE_PATH: ${{ runner.temp }}/week12-live/node_modules
          WEEK12_READALOUD_WEDNESDAY_LIVE_SCREENSHOT_DIR: ${{ runner.temp }}/week12-wednesday-reader-live
        run: node scripts/test_week12_readaloud_wednesday_live.cjs
      - name: Upload actual Wednesday Pages screenshots and byte manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week12-wednesday-reader-live-pages
          path: ${{ runner.temp }}/week12-wednesday-reader-live
          if-no-files-found: warn

      - name: Verify exact deployed Week 12 Thursday reader
        env:
          NODE_PATH: ${{ runner.temp }}/week12-live/node_modules
          WEEK12_READALOUD_THURSDAY_LIVE_SCREENSHOT_DIR: ${{ runner.temp }}/week12-thursday-reader-live
        run: node scripts/test_week12_readaloud_thursday_live.cjs
      - name: Upload actual Thursday Pages screenshots and byte manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week12-thursday-reader-live-pages
          path: ${{ runner.temp }}/week12-thursday-reader-live
          if-no-files-found: warn
