name: Export Exact Thursday Live Evidence
on:
  push:
    branches: [codex/week4-thursday-evidence-export]
    paths:
      - '.github/workflows/export-week12-reader-evidence.yml'
      - 'scripts/export_reader_evidence.cjs'
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: live
            spec: "{\"label\":\"live\",\"bytes\":88643631,\"artifactId\":11276843681,\"runId\":37131913959,\"name\":\"week12-thursday-reader-live-pages\",\"head\":\"1a742c15d4a068a14ac208fe6ab24fbe52be9dde\",\"sha256\":\"11069aedd5fece25d00fc44c9ae9491be2ead9ef256d265fee65536baaf1d69f\"}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and split immutable source artifact bytes
        uses: actions/github-script@v7
        env:
          EVIDENCE_SPEC: ${{ matrix.spec }}
          EVIDENCE_OUTPUT: evidence-export
        with:
          script: |
            await require('./scripts/export_reader_evidence.cjs')({github, context, core});
      - name: Upload verified export index
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-index
          path: evidence-export/evidence-export.json
          if-no-files-found: error
      - name: Upload evidence part 01
        if: ${{ hashFiles('evidence-export/part-01.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-part-01
          path: evidence-export/part-01.bin
          compression-level: 0
          if-no-files-found: error
      - name: Upload evidence part 02
        if: ${{ hashFiles('evidence-export/part-02.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-part-02
          path: evidence-export/part-02.bin
          compression-level: 0
          if-no-files-found: error
      - name: Upload evidence part 03
        if: ${{ hashFiles('evidence-export/part-03.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-part-03
          path: evidence-export/part-03.bin
          compression-level: 0
          if-no-files-found: error
      - name: Upload evidence part 04
        if: ${{ hashFiles('evidence-export/part-04.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-part-04
          path: evidence-export/part-04.bin
          compression-level: 0
          if-no-files-found: error
      - name: Upload evidence part 05
        if: ${{ hashFiles('evidence-export/part-05.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-part-05
          path: evidence-export/part-05.bin
          compression-level: 0
          if-no-files-found: error
      - name: Upload evidence part 06
        if: ${{ hashFiles('evidence-export/part-06.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-part-06
          path: evidence-export/part-06.bin
          compression-level: 0
          if-no-files-found: error
      - name: Upload evidence part 07
        if: ${{ hashFiles('evidence-export/part-07.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-part-07
          path: evidence-export/part-07.bin
          compression-level: 0
          if-no-files-found: error
      - name: Upload evidence part 08
        if: ${{ hashFiles('evidence-export/part-08.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: week4-thursday-evidence-${{ matrix.label }}-part-08
          path: evidence-export/part-08.bin
          compression-level: 0
          if-no-files-found: error
