name: Verify Tuesday Centers on Pages
on:
  push:
    branches: [main]
    paths:
      - 'v6-test/**'
      - 'scripts/test_week10_centers_tuesday_live.cjs'
      - '.github/workflows/verify-tuesday-centers-pages.yml'
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/tuesday-live" playwright@1.62.1
          "$RUNNER_TEMP/tuesday-live/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify exact deployed Tuesday chunk and earlier ready flows
        env:
          NODE_PATH: ${{ runner.temp }}/tuesday-live/node_modules
          WEEK10_TUESDAY_LIVE_SCREENSHOT_DIR: ${{ runner.temp }}/tuesday-live-screenshots
        run: node scripts/test_week10_centers_tuesday_live.cjs
      - name: Save actual Pages screenshots and byte verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-tuesday-centers-live-pages
          path: ${{ runner.temp }}/tuesday-live-screenshots
          if-no-files-found: warn
