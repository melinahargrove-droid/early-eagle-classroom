name: Verify Wednesday Centers on Pages
on:
  push:
    branches: [main]
    paths:
      - 'v6-test/**'
      - 'scripts/test_week10_centers_wednesday_live.cjs'
      - 'scripts/test_week11_centers_wednesday*.cjs'
      - 'scripts/week11-centers-wednesday-response-capture.cjs'
      - '.github/workflows/verify-wednesday-centers-pages.yml'
permissions:
  contents: read
jobs:
  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/wednesday-live" playwright@1.62.1
          "$RUNNER_TEMP/wednesday-live/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify exact deployed Wednesday chunk and earlier ready flows
        env:
          NODE_PATH: ${{ runner.temp }}/wednesday-live/node_modules
          WEEK10_WEDNESDAY_LIVE_SCREENSHOT_DIR: ${{ runner.temp }}/wednesday-live-screenshots
        run: node scripts/test_week10_centers_wednesday_live.cjs
      - name: Save actual Pages screenshots and byte verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-wednesday-centers-live-pages
          path: ${{ runner.temp }}/wednesday-live-screenshots
          if-no-files-found: warn

      - name: Verify exact deployed Wednesday Week 11 Centers
        env:
          NODE_PATH: ${{ runner.temp }}/wednesday-live/node_modules
          WEEK11_WEDNESDAY_LIVE_SCREENSHOT_DIR: ${{ runner.temp }}/week11-wednesday-live-screenshots
        run: node scripts/test_week11_centers_wednesday_live.cjs
      - name: Save actual Week 11 Wednesday Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week11-wednesday-centers-live-pages
          path: ${{ runner.temp }}/week11-wednesday-live-screenshots
          if-no-files-found: warn
