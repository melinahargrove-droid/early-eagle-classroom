name: Render Read Aloud PowerPoint

on:
  push:
    paths:
      - 'v6-test/assets/_01b. Fo4s U1W2 Read Aloud_ What Riley Wore - Adapted Book.pptx'
      - '.github/workflows/render-read-aloud-powerpoint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install slide rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
      - name: Render complete PowerPoint slides
        shell: bash
        run: |
          set -euo pipefail
          PPTX='v6-test/assets/_01b. Fo4s U1W2 Read Aloud_ What Riley Wore - Adapted Book.pptx'
          OUT='what-riley-wore-slides'
          test -f "$PPTX"
          rm -rf "$OUT"
          mkdir -p "$OUT" /tmp/eea-pdf /tmp/eea-jpg
          libreoffice --headless --convert-to pdf --outdir /tmp/eea-pdf "$PPTX"
          PDF="/tmp/eea-pdf/$(basename "${PPTX%.*}").pdf"
          pdftoppm -jpeg -r 160 -jpegopt quality=90 "$PDF" /tmp/eea-jpg/slide
          n=1
          for f in /tmp/eea-jpg/slide-*.jpg; do
            printf -v num '%02d' "$n"
            cp "$f" "$OUT/riley-$num.jpg"
            n=$((n+1))
          done
          echo "Rendered $((n-1)) complete slides to $OUT"
      - name: Commit rendered slides
        shell: bash
        run: |
          git config user.name 'Early Eagle App Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add what-riley-wore-slides
          if git diff --cached --quiet; then
            echo 'No slide changes to commit.'
          else
            git commit -m 'Render complete What Riley Wore PowerPoint slides'
            git push
          fi
