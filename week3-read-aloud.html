ax-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="bookTitle"></h1><div class="sub" id="subTitle"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="bookImg" alt="Adapted book page"></div><div class="side" id="side"><h2 id="sideTitle">Pause Here</h2><div class="stop" id="stop"></div></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit Visual</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-gesture" id="vocabGesture"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="notesCopy"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const p=new URLSearchParams(location.search),days=['Monday','Tuesday','Wednesday','Thursday','Friday'],day=days.includes(p.get('day'))?p.get('day'):'Monday',from=p.get('from')||'';const data={Monday:{title:'Sometimes I’m Bombaloo',sub:'Read 1 of 3 · What’s the story about?',prefix:'bombaloo-',pages:16,before:'What ideas do you have about feelings that can get very big?',notes:'Read the full text fluently. Use the mapped curriculum teaching stops and dedicated vocabulary screens.',stops:{5:'BOOK PAGE 8 • What are some things Katie can do? Thumbs up if you can do something like that too!',11:'BOOK PAGE 18 • What is one thing that happens when Katie is Bombaloo? Who might be yelling?'},vocabs:[{after:6,kicker:'QUICK WORD · BOOK PAGE 9',word:'Whine',definition:'When someone whines, they complain a lot.',gesture:'Give a quick example of whining.',icon:'💬',slot:'week3-bombaloo-whine'},{after:7,kicker:'QUICK WORD · BOOK PAGE 12',word:'Fierce',definition:'Fierce means strong and scary.',gesture:'Show a fierce face and then relax it.',icon:'🦁',slot:'week3-bombaloo-fierce'},{after:8,kicker:'QUICK WORD · BOOK PAGE 13',word:'Scrunch',definition:'To squeeze or wrinkle something up tightly.',gesture:'Show me how you scrunch your face!',icon:'😣',slot:'week3-bombaloo-scrunch'},{after:14,kicker:'QUICK WORD · BOOK PAGE 24',word:'Controlling Yourself',definition:'Controlling yourself means handling your own feelings without hurting other people’s feelings or bodies.',gesture:'Show a calm body with safe hands and feet.',icon:'🧘',slot:'week3-bombaloo-controlling-yourself'}]},Tuesday:{title:'Sometimes I’m Bombaloo',sub:'Read 2 of 3 · Reading the pictures',prefix:'bombaloo-',pages:16,before:'Let’s pay attention to the words and illustrations to get to know Katie.',notes:'Reread fluently and use only the curriculum-designated illustration stops.',stops:{6:'BOOK PAGE 10 • Katie is patiently building a castle. Her baby brother is smiling, but Katie is not. How does Katie feel? Why do you think so?',10:'BOOK PAGE 16 • Turn back through pages 14–15 and notice how Katie’s temper flares. Do you think she is really turning into a fierce monster? How do you know?',11:'BOOK PAGES 19–20 • The illustration is darker than the other pages. Why do you think the illustrator made that choice? How might it feel to take time by yourself to think about a problem?',14:'BOOK PAGE 24 • What do you notice about Katie’s face here? What happened that made her smile?'}},Wednesday:{title:'Sometimes I’m Bombaloo',sub:'Read 3 of 3 · Character and connections',prefix:'bombaloo-',pages:16,before:'Pay attention to the words and illustrations to get to know Katie more deeply.',notes:'Compare Bombaloo and Katie Honors and discuss how Katie changes from very upset to calm.',stops:{2:'BOOK PAGE 2 • What do you think it means that Katie is a “really good kid”? What is the author trying to tell us about Katie?',13:'BOOK PAGE 24 • What’s happening? Reread the page. How might Katie feel now? Do you think it is okay to say you hate something? Why or why not?',15:'BOOK PAGE 27 • Why might being Bombaloo be scary for Katie?'}},Thursday:{title:'The Rabbit Listened',sub:'Read 1 of 3 · What’s the story about?',prefix:'rabbit-',pages:19,before:'Listen for what the rabbit does differently from the other animals.',notes:'Read the full text fluently. Pause only at the curriculum-designated stops.',stops:{6:'BOOK PAGE 8 • Taylor felt proud of their creation. What happens to Taylor’s creation?',8:'BOOK PAGE 12 • What is the chicken’s suggestion for Taylor?',11:'BOOK PAGE 18 • Could the bear’s or elephant’s suggestion work for you if you had a similar experience? Which suggestion do you like better?',13:'BOOK PAGE 22 • What are some other suggestions you might give to help Taylor?'}},Friday:{title:'The Rabbit Listened',sub:'Read 2 of 3 · Reading the pictures',prefix:'rabbit-',pages:19,before:'Focus on Taylor’s facial expressions and changing emotions.',notes:'Reread fluently and focus on Taylor’s facial expressions and changing emotions.',stops:{5:'BOOK PAGE 6 • Look at the illustration. How does Taylor feel? Why do you think so?',10:'BOOK nt=v.kicker||'QUICK WORD';$('vocabWord').textContent=v.word;$('vocabDefinition').textContent=v.definition;$('vocabGesture').textContent=v.gesture||'';$('vocabEdit').onclick=()=>location.href='visual-editor.html?slot='+encodeURIComponent(v.slot)+'&return='+encodeURIComponent('week3-read-aloud.html?day='+day+(from?'&from='+from:''))}function render(){const item=current(),isV=item.type==='vocab';$('book').classList.toggle('hidden',isV);$('vocabSlide').classList.toggle('show',isV);hideSide();pauseShown=false;if(isV){beforeOpen=false;renderVocab(item)}else{token++;$('bookImg').src='assets/'+d.prefix+String(item.page).padStart(2,'0')+'.jpg?v=13';if(beforeOpen&&step===0)showSide('Before We Read',d.before)}$('count').textContent=isV?'Vocabulary · '+item.word:'Slide '+item.page+' of '+d.pages;$('fill').style.width=((step+1)/sequence.length*100)+'%';$('prev').disabled=false;$('next').textContent=beforeOpen?'Start Reading →':step===sequence.length-1?'Finish Read Aloud ✓':'Next →';notify()}$('prev').onclick=()=>{if(pauseShown){pauseShown=false;hideSide();$('next').textContent=step===sequence.length-1?'Finish Read Aloud ✓':'Next →';notify();return}if(beforeOpen)return;if(step>0){step--;render();return}beforeOpen=true;render()};$('next').onclick=()=>{const item=current();if(beforeOpen){beforeOpen=false;hideSide();$('next').textContent=step===sequence.length-1?'Finish Read Aloud ✓':'Next →';notify();return}if(item.type==='book'&&d.stops[item.page]&&!pauseShown){pauseShown=true;showSide('Curriculum Teaching Stop — Pause Here',d.stops[item.page]);$('next').textContent='Continue →';notify();return}if(pauseShown){pauseShown=false;hideSide()}if(step<sequence.length-1){step++;render()}else finish()};$('backBtn').onclick=overview;$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');render()})();</script></body></html>
