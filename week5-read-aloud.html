<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Week 5 Read Aloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#f7f2e7;color:#174f7d}.page{width:100vw;height:100vh;padding:1vh 1.6vw;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}header{height:7.5vh;display:grid;grid-template-columns:1fr auto;align-items:center}.meta{font-weight:900;letter-spacing:.12em;color:#789697;font-size:12px}h1{margin:.2vh 0 0;font-size:32px;line-height:1;color:#164f7f}.sub{margin:.25vh 0;color:#557876;font-size:15px;font-weight:800}.actions{display:flex;gap:.55vw;align-items:center}.chip,.iconbtn,.toolbtn{border:1px solid rgba(82,128,142,.16);background:#fffdf8;color:#245c82;font-weight:900;cursor:pointer}.chip{padding:.55vh .8vw;border-radius:999px;background:#dcecf0}.iconbtn{width:46px;height:46px;border-radius:50%;font-size:22px}.toolbtn{padding:.7vh 1vw;border-radius:14px}.stage{height:81vh;border:1.5px solid rgba(89,139,151,.24);border-radius:30px;background:#fffdfb;position:relative;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;box-shadow:0 14px 36px rgba(54,79,77,.07);overflow:hidden}.book{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;background:#eef4ef;position:relative}.book.hidden{display:none}.book img{display:block;width:100%;height:100%;object-fit:contain}.image-error{display:none;position:absolute;inset:10%;align-items:center;justify-content:center;text-align:center;padding:3vw;border-radius:24px;background:#fff7e8;color:#855d28;font-weight:900;font-size:18px;line-height:1.5}.image-error.show{display:flex}.stopcard{display:none;position:absolute;right:2vw;bottom:2vh;width:min(560px,44vw);max-height:72%;overflow:auto;z-index:5;background:rgba(255,253,248,.97);border:2px solid #e4c56d;border-radius:20px;padding:1.5vh 1.25vw;box-shadow:0 12px 28px rgba(54,79,77,.18);color:#71591f;font-size:17px;font-weight:900;line-height:1.35}.stopcard.show{display:block}.stopcard b{display:block;color:#9a6c13;font-size:11px;letter-spacing:.08em;margin-bottom:.55vh}.vocab-slide{display:none;width:92%;height:88%;grid-template-columns:42% 1fr;gap:4vw;align-items:center;padding:4vh 5vw;border-radius:28px;background:radial-gradient(circle at 50% 10%,#fffef9,#eaf3ee 72%,#ddebe7)}.vocab-slide.show{display:grid}.vocab-visual{position:relative;width:100%;max-width:470px;aspect-ratio:1.23;border-radius:26px;background:#fff;overflow:hidden;border:1px solid rgba(96,140,145,.15);box-shadow:0 12px 28px rgba(54,79,77,.12);display:flex;align-items:center;justify-content:center}.vocab-fallback{font-size:clamp(100px,10vw,180px)}.vocab-visual img{width:100%;height:100%;object-fit:contain}.vocab-edit{position:absolute;right:10px;top:10px;z-index:3;border:1px solid rgba(82,128,142,.2);border-radius:999px;background:rgba(255,253,248,.94);color:#245c82;padding:.5vh .7vw;font-weight:900;font-size:12px;cursor:pointer}.vocab-kicker{color:#9a6c13;font-weight:900;letter-spacing:.11em;font-size:13px}.vocab-copy h2{margin:.7vh 0 1.4vh;color:#164f7f;font-size:clamp(44px,4vw,72px)}.vocab-definition{color:#587875;font-weight:900;font-size:clamp(24px,1.8vw,34px);line-height:1.35}.vocab-example{margin-top:2.2vh;padding:1.25vh 1.3vw;border-radius:18px;background:rgba(216,234,237,.78);color:#4f765e;font-weight:900;font-size:clamp(18px,1.2vw,23px)}.footer{height:8.5vh;display:grid;grid-template-columns:16% 1fr 16%;align-items:center;gap:1vw}.nav{border:1.3px solid rgba(80,120,130,.13);border-radius:17px;padding:1.05vh 1.2vw;font-weight:900;font-size:16px;cursor:pointer}.prev{background:#fffdf8;color:#245c78}.next{background:#668f99;color:#fff}.progress{text-align:center;color:#607976;font-weight:900}.track{height:6px;border-radius:999px;background:#d8e8ed;overflow:hidden;margin-top:.55vh}.fill{height:100%;background:#6ea6c2}.panel{position:fixed;right:3vw;top:10vh;width:min(470px,34vw);max-height:76vh;overflow:auto;z-index:9;display:none;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:22px;padding:2vh 1.4vw;box-shadow:0 16px 34px #0002}.panel.open{display:block}.panel h3{color:#315f70}.panel p{color:#58716f;font-weight:750;line-height:1.43}.close{border:0;background:transparent;float:right;font-size:24px;color:#315f70;font-weight:900;cursor:pointer}</style></head><body><main class="page"><header><div><div class="meta">EARLY EAGLE ACADEMY · READ ALOUD</div><h1 id="title"></h1><div class="sub" id="sub"></div></div><div class="actions"><div class="chip" id="chip"></div><button class="toolbtn" id="notesBtn">Teacher Notes</button><button class="iconbtn" id="backBtn">×</button></div></header><section class="stage"><div class="book" id="book"><img id="pageImg" alt="Adapted book page"><div class="image-error" id="imageError"></div></div><div class="stopcard" id="stop"></div><div class="vocab-slide" id="vocabSlide"><div class="vocab-visual"><div class="vocab-fallback" id="vocabFallback"></div><img id="vocabCustom" hidden alt="Custom vocabulary visual"><button class="vocab-edit" id="vocabEdit">✎ Edit Visual</button></div><div class="vocab-copy"><div class="vocab-kicker" id="vocabKicker"></div><h2 id="vocabWord"></h2><div class="vocab-definition" id="vocabDefinition"></div><div class="vocab-example" id="vocabExample"></div></div></div></section><aside class="panel" id="notesPanel"><button class="close" id="closeNotes">×</button><h3 id="notesTitle"></h3><p id="focus"></p><p id="note"></p></aside><footer class="footer"><button class="nav prev" id="prev">← Previous</button><div class="progress"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><button class="nav next" id="next">Next →</button></footer></main><script src="visual-store.js"></script><script>(()=>{const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const data={Monday:{title:'Everybody in the Red Brick Building',sub:'Read 1 of 3 · What happens in the story?',prefix:'red-brick-building-',start:1,end:17,before:'Today we will read Everybody in the Red Brick Building. Listen for what happens in the story and notice how one sound leads to another.',focus:'Read the full text fluently, pausing only at the curriculum-designated places.',note:'After reading, use book pages 9–10, 17–18, and 21–22 to support retelling Natalia’s little story.',stops:{6:'BOOK PAGE 8 • What noise woke Benny, Cairo, and Miles up?',9:'BOOK PAGES 13–14 • There are almost no words here except the siren sound. What’s going on?',11:'BOOK PAGE 18 • Not many people are in the illustration. Where do you think everyone went?'},vocabs:[{after:4,kicker:'QUICK WORD · BOOK PAGE 3',word:'Howl',definition:'Howl means to cry loudly.',example:'Notice how the big writing helps show how loudly Izzie cried.',icon:'🐺',slot:'week5-redbrick-howl'},{after:6,kicker:'QUICK WORD · BOOK PAGE 8',word:'Challenge',definition:'Here, challenged means invited someone to play or try something.',example:'Benny challenged Cairo and Miles to play a game.',icon:'🎯',slot:'week5-redbrick-challenge'},{after:7,kicker:'QUICK WORD · BOOK PAGE 10',word:'Launch',definition:'Launch means to send something into the air.',example:'Pretend to launch something gently up into the air.',icon:'🚀',slot:'week5-redbrick-launch'}]},Tuesday:{title:'Everybody in the Red Brick Building',sub:'Read 2 of 3 · Retelling events',prefix:'red-brick-building-',start:1,end:17,before:'Today we will read the story again and use the illustrations to help retell what happened first, next, and after that.',focus:'Read the full text fluently and use the collage illustrations to retell events in order.',note:'After reading, slowly page through the whole story.',stops:{11:'BOOK PAGE 17 • COLLAGE — Look closely at the collage. What do you notice? What is happening at this point in the story?',15:'BOOK PAGE 26 • WORDS + PICTURES — Look at the collage and listen as the words are reread. What do you see and hear? What’s happening?'}},Wednesday:{title:'Everybody in the Red Brick Building',sub:'Read 3 of 3 · Acting out the story',prefix:'red-brick-building-',start:1,end:17,before:'The rug can become our stage today. Children may act out characters or sounds from the story, and anyone may choose to pass.',focus:'Read the story aloud while children act out a selected scene or the whole story.',note:'Children may play any character—even Pepper the cat or the car alarm—and may pass if they do not want to act.',stops:{}},Thursday:{title:'My Day with Gong Gong',sub:'Read 1 of 4 · What’s the story about?',prefix:'my-day-with-gong-gong-',start:1,end:19,before:'Today we will meet May and Gong Gong. Listen for how they communicate and how May’s feelings change during their day together.',focus:'Read the full text fluently, pausing only at the curriculum-designated places.',note:'After reading, ask whether children know someone who speaks a different language and how they communicate.',stops:{3:'BOOK PAGE 1 • COMMUNICATING — May and Gong Gong do not seem to speak the same language. Look at the pictures and words. How does May seem to feel?',7:'BOOK PAGE 9 • Notice how happy Gong Gong looks greeting people in his neighborhood.',10:'BOOK PAGE 15 • STOMP — We have read about half of the book. Show how you stomp your feet. How do you usually feel when you stomp? Do you think May feels that way?',13:'BOOK PAGE 21 • CHEERING UP — What is one way Gong Gong cheers up May?',19:'END — What happens at the end of the book?'},vocabs:[{after:7,kicker:'QUICK WORD · BOOK PAGE 9',word:'Néih Hóu',definition:'“Néih hóu” means hello in Cantonese.',example:'Practice greeting someone by saying “Néih hóu.”',icon:'👋',slot:'week5-gonggong-neih-hou'}]},Friday:{title:'My Day with Gong Gong',sub:'Read 2 of 4 · Retelling the first half',prefix:'my-day-with-gong-gong-',start:3,end:11,before:'Today we will reread the first half of My Day with Gong Gong and use the pictures to tell what happened first, next, and after that.',focus:'Read only the first half. Stop the text after book page 14, then use the page 16 illustration to support retelling.',note:'The final displayed spread is for the Page 16 illustration prompt, not for continuing the text.',stops:{6:'BOOK PAGE 6 • What does May see that she likes?',9:'BOOK PAGE 12 • Look at the illustration and listen as the words are reread. How is May feeling? Why? How do you feel when you are hungry?',10:'BOOK PAGE 14 • FRUSTRATED — May is so frustrated that she stomps at the birds. What is one reason she is upset? STOP THE READ-ALOUD TEXT AFTER PAGE 14.',11:'BOOK PAGE 16 • LOOK ONLY — Look at the illustration. How does May feel? Use this picture to support the first-half retell.'},vocabs:[{after:6,kicker:'QUICK WORD · BOOK PAGE 6',word:'Chinese Zodiac',definition:'The Chinese zodiac is a cycle in which each year is connected with an animal sign.',example:'Monkey is the zodiac sign matching the year May was born.',icon:'🐒',slot:'week5-gonggong-chinese-zodiac'}]}};const p=new URLSearchParams(location.search),day=days.includes(p.get('day'))?p.get('day'):'Monday',x=data[day],from=p.get('from')||'';let sequence=[];for(let i=x.start;i<=x.end;i++){sequence.push({type:'book',page:i});(x.vocabs||[]).filter(v=>v.after===i).forEach(v=>sequence.push({type:'vocab',...v}))}let step=0,beforeOpen=true,pauseShown=false,token=0;const $=id=>document.getElementById(id);$('title').textContent=x.title;$('sub').textContent=x.sub;$('chip').textContent='WEEK 5 · '+day.toUpperCase();$('notesTitle').textContent=x.title;$('focus').textContent=x.focus;$('note').textContent=x.note||'';function overview(){location.href='daily-lessons.html?week=5&day='+days.indexOf(day)+'&v='+Date.now()}function finish(){if(from==='daily'||from==='runner')location.href='lesson-runner-week5.html?week=5&day='+days.indexOf(day)+'&section=2&v='+Date.now();else overview()}function item(){return sequence[step]}function state(){const z=item();return{step,beforeOpen,pauseShown,atStart:beforeOpen&&step===0,atEnd:!beforeOpen&&step===sequence.length-1&&z.type==='book'&&(!x.stops[z.page]||pauseShown)}}window.EEASectionState=state;function notify(){try{window.dispatchEvent(new CustomEvent('eea-section-state',{detail:state()}))}catch(e){}}function showCard(label,copy){$('stop').innerHTML='<b>'+label+'</b>'+copy;$('stop').classList.add('show')}function hideCard(){$('stop').classList.remove('show')}function renderImage(page){const src='assets/'+x.prefix+String(page).padStart(2,'0')+'.jpg';$('imageError').classList.remove('show');$('pageImg').style.visibility='visible';$('pageImg').onerror=()=>{$('pageImg').style.visibility='hidden';$('imageError').textContent='Book image could not load: '+src;$('imageError').classList.add('show')};$('pageImg').src=src+'?v=94'}async function renderVocab(v){const t=++token,src=window.EEAVisualStore?await EEAVisualStore.get(v.slot):null;if(t!==token)return;$('vocabCustom').hidden=!src;$('vocabFallback').style.display=src?'none':'block';$('vocabFallback').textContent=v.icon||'🖼️';if(src)$('vocabCustom').src=src;$('vocabKicker').textContent=v.kicker||'QUICK WORD';$('vocabWord').textContent=v.word;$('vocabDefinition').textContent=v.definition;$('vocabExample').textContent=v.example||'';$('vocabEdit').onclick=()=>location.href='visual-editor.html?slot='+encodeURIComponent(v.slot)+'&return='+encodeURIComponent('week5-read-aloud.html?day='+day+(from?'&from='+from:''))}function render(){const z=item(),isV=z.type==='vocab';$('book').classList.toggle('hidden',isV);$('vocabSlide').classList.toggle('show',isV);hideCard();pauseShown=false;if(isV){beforeOpen=false;renderVocab(z)}else{token++;renderImage(z.page);if(beforeOpen&&step===0)showCard('BEFORE WE READ',x.before)}$('count').textContent=isV?'Vocabulary · '+z.word:'Slide '+(z.page-x.start+1)+' of '+(x.end-x.start+1);$('fill').style.width=((step+1)/sequence.length*100)+'%';$('prev').disabled=false;$('next').textContent=beforeOpen?'Start Reading →':step===sequence.length-1?'Finish Read Aloud ✓':'Next →';notify()}$('prev').onclick=()=>{if(pauseShown){pauseShown=false;hideCard();notify();return}if(beforeOpen)return;if(step>0){step--;render();return}beforeOpen=true;render()};$('next').onclick=()=>{const z=item();if(beforeOpen){beforeOpen=false;hideCard();notify();return}if(z.type==='book'&&x.stops[z.page]&&!pauseShown){pauseShown=true;showCard('CURRICULUM TEACHING STOP — PAUSE HERE',x.stops[z.page]);$('next').textContent='Continue →';notify();return}if(pauseShown){pauseShown=false;hideCard()}if(step<sequence.length-1){step++;render()}else finish()};$('backBtn').onclick=overview;$('notesBtn').onclick=()=>$('notesPanel').classList.toggle('open');$('closeNotes').onclick=()=>$('notesPanel').classList.remove('open');render()})();</script></body></html>
