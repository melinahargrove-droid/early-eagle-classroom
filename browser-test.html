<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Early Eagle Academy — Browser Test</title><style>html,body{margin:0;height:100%;font-family:"Trebuchet MS",Arial,sans-serif;background:#f6f1e5;color:#174f7d}body{display:grid;place-items:center}.card{width:min(680px,90vw);padding:36px;border-radius:28px;background:#fffdf8;text-align:center;box-shadow:0 16px 40px #0002}h1{margin:0 0 12px}p{font-weight:800;color:#557876}</style></head><body><main class="card"><h1>Opening fresh browser lessons…</h1><p id="status">Clearing old classroom web caches.</p></main><script>(async()=>{const p=new URLSearchParams(location.search),week=p.get('week')||'5',day=p.get('day')||'0',status=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/early-eagle-classroom/v6-test/')).map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('eea-companion')).map(k=>caches.delete(k)));}status.textContent='Fresh browser session ready.';}catch(e){status.textContent='Opening lessons without stored lesson HTML.';}location.replace(`daily-lessons.html?week=${encodeURIComponent(week)}&day=${encodeURIComponent(day)}&fresh=${Date.now()}`)})();</script></body></html>
