<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Building Blocks</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1150px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:28px}.tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:#789697}.card h1,.card h2{color:#165487}.card p,.card li{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}.box{background:#e7f0ed;border-radius:18px;padding:15px;margin:12px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Building Blocks</h1><h2 id="title"></h2><div id="content"></div><button class="back" onclick="location.href='week6-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const d={Monday:{title:'Bakers Truck + Compare Number Pizzas',html:`<p>Recite <b>Bakers Truck</b> with gestures, ending with five big pizzas.</p><div class="box">Use two paper plates as pizzas and counters as toppings. Put three toppings on each pizza, count them, then ask how to change each pizza so it has five toppings.</div>`},Tuesday:{title:'Count and Move in Patterns + Demonstrate Counting',html:`<p>Count 1–10 in repeating patterns of two, such as loud/quiet or step/stomp.</p><div class="box">Display four counters. Count 1, 2, 3, 4. Remove them, show one counter and explain that one tells how many are there all together. Show all four again, recount, and ask how many there are all together.</div>`},Wednesday:{title:'Count and Move + Demonstrate Counting + Compare Number Pizzas',html:`<p>Repeat Count and Move in Patterns, then demonstrate counting four counters.</p><div class="box">Return to two pizzas. Make three toppings on each, count, and ask: <b>How can we make them five?</b></div>`},Thursday:{title:'Count and Move in Patterns + Number Me (5)',html:`<p>Count 1–10 in a pattern of two.</p><div class="box">Play <b>Number Me (5)</b>. Ask children to show something on their body that has five. Guide attention to fingers and ask: <b>How do you know you have 5 fingers?</b> Make playful mistakes and invite children to count and prove it.</div>`},Friday:{title:'Count and Move + Counting Book',html:`<p>Count 1–10 in a pattern, then read a counting book such as <i>The Very Hungry Caterpillar</i>.</p><div class="box">Return to selected pages and count pictured objects. Pretend to be the caterpillar eating five berries: one, two, three, four, five!</div>`}}[day];tag.textContent='WEEK 6 · '+day.toUpperCase();title.textContent=d.title;content.innerHTML=d.html;</script></body></html>
