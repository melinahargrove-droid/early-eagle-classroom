<!doctype html>
<html lang="en">
<head>

<title>Clean Up Audio Compare Test</title>
<style>

</style>

<body>
<div class="card">
<h1>Clean Up Song — Audio Compare Test</h1>
<p class="note">Try both players. The first is the old Circle Time MP3 that was already in the app. The second is the new full-length MP3 extracted from the Canva video.</p>
<div class="test">
<h2>1. Old known file — Circle Time.mp3</h2>
<audio controls preload="metadata"><source src="assets/Circle%20Time.mp3" type="audio/mpeg"></audio>
</div>
<div class="test">
<h2>2. New full-length file</h2>
<audio controls preload="metadata"><source src="assets/EEA-Clean-Up-Song-full-audio.mp3" type="audio/mpeg"></audio>
</div>
</div>
