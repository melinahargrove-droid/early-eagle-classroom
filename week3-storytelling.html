<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Storytelling</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#174f7d;background:radial-gradient(circle at 50% 0,#fffdf7 0,#f7f1e4 58%,#e5efea 100%)}.page{height:100vh;padding:2.2vh 2.8vw}.top{height:9vh;display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:#789697;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,.75vw,14px)}h1{margin:.35vh 0 0;font-size:clamp(31px,2.5vw,48px);line-height:1;color:#164f7f}.actions{display:flex;gap:.65vw;align-items:center}.chip{padding:.55vh .85vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900;font-size:clamp(10px,.72vw,14px)}button{font-family:inherit}.icon{width:clamp(48px,3.2vw,62px);aspect-ratio:1;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900;cursor:pointer}.card{height:78vh;border:1.5px solid #cbdde0;border-radius:32px;background:#fffdf8;box-shadow:0 15px 36px rgba(54,79,77,.07);padding:4.2vh 4.8vw;display:grid;grid-template-columns:48% 1fr;gap:4.5vw;align-items:center}.art-wrap{height:60vh;display:flex;align-items:center;justify-content:center}.story-art{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;object-fit:contain;border-radius:30px;filter:drop-shadow(0 8px 18px rgba(54,82,82,.12))}.placeholder{width:100%;height:55vh;border-radius:30px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;color:#527673;font-weight:900;font-size:clamp(20px,1.6vw,30px)}.day{color:#789697;font-weight:900;letter-spacing:.11em;font-size:clamp(12px,.85vw,16px);text-transform:uppercase}.copy h2{font-size:clamp(42px,4vw,76px);line-height:1.02;margin:1vh 0;color:#164f7f}.lead{font-size:clamp(21px,1.55vw,30px);line-height:1.4;color:#527673;font-weight:900;max-width:650px}.cue{margin-top:2.2vh;padding:1.5vh 1.3vw;border-radius:18px;background:#e7f0ed;color:#416d61;font-size:clamp(17px,1.15vw,23px);font-weight:900;max-width:650px}.prompts{display:grid;gap:1vh;margin-top:1.7vh}.prompt{padding:1.15vh 1vw;border-radius:15px;background:#e7f0ed;color:#416d61;font-size:clamp(16px,1.05vw,21px);font-weight:900}.bottom{height:9vh;display:flex;justify-content:center;align-items:center;gap:1vw}.teacher,.print,.done{border:1px solid #d4e0df;border-radius:999px;padding:.8vh 1.25vw;font-weight:900;font-size:clamp(13px,.9vw,17px);cursor:pointer;background:#fffdf8;color:#245c78}.done{position:absolute;right:3.2vw;background:#668f99;color:white;border-color:#668f99;padding:1vh 1.8vw}.panel{display:none;position:fixed;z-index:10;right:3vw;top:11vh;width:min(560px,38vw);max-height:76vh;overflow:auto;background:#fffdf8;border:1.5px solid #c9dce0;border-radius:25px;padding:2.3vh 1.7vw;box-shadow:0 18px 45px rgba(44,67,68,.2)}.panel.open{display:block}.panel h3{font-size:clamp(20px,1.45vw,28px);margin:1.2vh 0 .5vh}.panel p{font-size:clamp(14px,.95vw,18px);line-height:1.48;color:#4e706c;font-weight:750;white-space:pre-line}.label{color:#789697;font-weight:900;letter-spacing:.08em;font-size:11px}.close{float:right;border:0;background:transparent;color:#245c78;font-size:25px;font-weight:900;cursor:pointer}</style></head><body><main class="page"><div class="top"><div><div class="eyebrow">EARLY EAGLE ACADEMY · STORYTELLING</div><h1>Stories in Our Minds</h1></div><div class="actions"><div class="chip" id="weekChip">WEEK 3</div><button class="icon" id="exit" aria-label="Back to Today's Plan">×</button></div></div><section class="card"><div class="art-wrap"><div id="art" class="placeholder"></div></div><div class="copy"><div class="day" id="day"></div><h2 id="title"></h2><div class="lead" id="lead"></div><div class="cue" id="cue"></div><div class="prompts" id="prompts"></div></div></section><div class="bottom"><button class="teacher" id="teacher">⌃ &nbsp; Teacher Story</button><button class="print" id="printBtn">🖨 Print Story</button><button class="done" id="done">Done ✓</button></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="label" id="panelLabel">TEACHER STORY</div><h3 id="panelTitle"></h3><p id="storyText"></p></aside></main><script>const stories=[{day:'Monday',title:'The Crumpled Picture',art:'Picture a bright art table, a special family drawing, and two preschool friends.',lead:'Close your eyes for a moment. Make the art table and Maya’s special picture in your mind.',cue:'After the story, act out drawing, the picture falling, a big feeling, asking how to help, and smoothing the paper together.',text:`Maya sat at the art table with a fresh piece of white paper in front of her. She picked up a yellow crayon and drew a giant round sun near the top. She could almost feel its warm rays shining down on her picture.\n\nNext she drew herself in a purple shirt. Beside her she drew her little brother, Nico, with his curly brown hair. Then she added their dog, Peanut, with a tail that curled like a question mark.\n\nMaya smiled. “This is my family at the park,” she told Eli. “I’m going to take it home and put it by my bed.”\n\nEli was drawing beside her. He needed the blue crayon on the other side of Maya’s paper. He reached across the table.\n\nHis elbow bumped the picture.\n\nWHOOSH!\n\nThe paper floated to the floor.\n\nBefore Eli could move, his sneaker came down on one corner.\n\nCRUNCH.\n\nMaya picked up her picture. A wrinkle ran right through the yellow sun. One corner was bent, and Peanut’s curly tail had a crease across it.\n\nMaya’s face felt hot. Her hands squeezed into tight little fists. “My picture!” she cried.\n\nEli’s stomach felt heavy. “I’m sorry! I can make you a new one,” he said quickly.\n\nMaya shook her head. “I don’t want a new one. I want THIS one.”\n\nEli started to say something else, but then he stopped. He sat quietly beside Maya.\n\nAfter a moment he asked, “Do you want me to help, or do you want to do it yourself?”\n\nMaya looked at the wrinkled paper. She took one slow breath. “You can help me flatten it.”\n\nThey placed the picture on the table. Maya smoothed one side with her hand. Eli gently smoothed the other. They pushed the bent corner flat.\n\nThe wrinkle did not disappear.\n\nMaya stared at it. Then she reached for her yellow crayon. She drew long, bright sun rays right across the wrinkle.\n\n“There,” she said. “Now my sun has extra sunshine.”\n\nEli smiled. “And Peanut still has his curly tail.”\n\nMaya smiled too. Her picture was not exactly the way it had been before. But it was still her picture.\n\nAnd when Maya carried it to her cubby, she held it carefully with both hands.`},{day:'Tuesday',title:'The Quiet Scientist',art:'Picture a science table covered with pinecones, leaves, sticks, and a magnifying lens.',lead:'Listen closely. Imagine the tiny details Nia and Sam discover when they slow down.',cue:'After the story, act out looking closely, touching gently, listening quietly, and discovering the tiny visitor.',text:`Nia and Sam stood at the science table. In front of them was a tray filled with things from outside—rough sticks, smooth stones, brown leaves, acorns, and one enormous pinecone.\n\nSam grabbed the pinecone first. “Look! I found the biggest thing!”\n\nNia picked up a small brown leaf. It did not look very exciting at first. Then she held a magnifying lens over it.\n\n“Whoa,” she whispered.\n\nSam leaned over. Through the magnifying lens, the tiny lines on the leaf looked like roads running in every direction.\n\n“Let me see!”\n\nThey looked with their eyes. Nia gently touched one of the bumpy veins with the tip of her finger. Sam rubbed the edge of the leaf and listened to its soft, scratchy sound.\n\nThen Nia froze.\n\n“Shhh.”\n\nSam stopped moving.\n\nScratch... scratch... scratch.\n\nThey heard something very tiny.\n\nScratch... scratch.\n\n“Where is it coming from?” Sam whispered.\n\nThey looked under the leaf. Nothing. They looked beside the pinecone. Nothing.\n\nThen Nia pointed to the edge of the tray.\n\nA tiny black beetle was crawling slowly beside a stick. Its little legs brushed against a dry leaf.\n\nScratch... scratch... scratch.\n\nSam’s eyes grew wide. “That’s what we heard!”\n\nThey watched without touching. The beetle climbed over the stick, disappeared behind the pinecone, and peeked out again.\n\n“We almost missed it,” Nia said.\n\nSam nodded. “Because we were looking at the biggest things.”\n\nFor the rest of science time, Nia and Sam moved slowly. They looked closely. They listened carefully.\n\nAnd the quieter they became, the more tiny things they discovered.`},{day:'Wednesday',title:'The Mask With Two Feelings',art:'Picture a colorful art table with paper masks, ribbons, markers, and two preschool friends.',lead:'As you listen, picture Leo’s mask changing as he realizes one feeling is not enough.',cue:'After the story, act out making a happy face, remembering something worrying, and showing two feelings at once.',text:`Leo was making a mask at the art table.\n\n“I know exactly what mine will be,” he said. “A HAPPY mask!”\n\nHe drew two bright eyes and a giant smile that stretched almost from one side of the paper to the other. He glued yellow paper around the edge and added three shiny blue circles.\n\n“Why are you happy?” Ava asked.\n\n“My grandma is picking me up today!” Leo said. “We’re going somewhere special.”\n\n“Where?”\n\n“To swimming lessons.”\n\nLeo looked at his giant smiling mask.\n\nHis own smile got a little smaller.\n\nHe had never been to swimming lessons before. He imagined the huge blue pool. He imagined water splashing near his face. He imagined standing at the edge while everyone else already knew what to do.\n\nLeo picked up his mask and turned it over.\n\nOn the back, he drew two wide eyes and a little wiggly mouth.\n\nAva looked puzzled. “I thought you were making a happy mask.”\n\n“I am,” Leo said. “But I’m worried too.”\n\nHe held up the smiling side. “I’m happy Grandma is coming.”\n\nThen he flipped it over. “And I’m worried about the pool.”\n\nAva thought for a moment. “Which one is the real feeling?”\n\nLeo looked at one side. Then the other.\n\n“Both.”\n\nHe tied a long blue ribbon to the mask. It wrapped around the edge so you could see a little bit of blue from either side.\n\n“When Grandma comes,” Leo said, “I think I’ll tell her both feelings.”\n\nAva nodded. “Maybe she can hold your hand when you get there.”\n\nLeo smiled.\n\nThis time, it was not quite as giant as the smile on his mask.\n\nBut it was real.`},{day:'Thursday',title:'The Wobbly Building',art:'Picture a block area with a very tall tower, two builders, and blocks scattered on the rug.',lead:'Make the tower in your mind. Can you feel it wobble as Zoe and Amir add one more block?',cue:'After the story, act out stacking, wobbling, crashing, noticing the problem, changing the plan, and trying again.',text:`Zoe and Amir had a plan.\n\n“We’re going to build the tallest building in the whole block center,” Amir announced.\n\nThey started with one long block on the rug. Then Zoe put another block on top. Amir added another.\n\nUp... up... up...\n\nThe building reached Zoe’s knees.\n\nThen her belly.\n\nThen almost to her shoulders.\n\n“One more!” Amir whispered.\n\nZoe carefully placed a block on top.\n\nThe building leaned a tiny bit to the left.\n\nThen to the right.\n\nWobble... wobble...\n\nCRASH!\n\nBlocks tumbled across the rug.\n\nZoe and Amir stared at the pile.\n\n“Again,” said Amir.\n\nThey stacked the blocks exactly the same way.\n\nUp... up... up...\n\nWobble... wobble...\n\nCRASH!\n\nAmir groaned. “It keeps falling!”\n\nZoe did not pick up a block right away. She sat back on her knees and looked at the pile. Then she looked at the spot where their building had been.\n\n“The bottom was skinny,” she said.\n\nAmir looked too. “Maybe the bottom needs more blocks.”\n\nThis time, they placed two long blocks side by side. Then two more beside those. Their building had a wide, strong bottom.\n\nZoe added the next block slowly. Amir added another.\n\nUp... up... up...\n\nThe building reached Zoe’s knees.\n\nThen her belly.\n\nThen her shoulders.\n\nAmir held his breath as Zoe placed the last block on top.\n\nThey waited.\n\nThe building stayed perfectly still.\n\n“We did it!” Amir whispered.\n\nZoe grinned. “Not the first time.”\n\n“Nope,” Amir said. “We had to figure out what the building needed.”\n\nThen Zoe picked up another block.\n\n“Want to make a bridge beside it?”\n\nAmir smiled. “I have an idea.”`},{day:'Friday',title:'You Tell the Feeling Story',art:'Picture several expressive faces—happy, sad, angry, worried, surprised—and imagine what might have happened.',lead:'Today YOU tell the story. Choose a feeling, imagine what happened, and tell us what comes next!',prompts:['Who is your character?','What happened to make the character feel that way?','What happened next?','How did your story end?'],cue:'Act out children’s stories as they tell them. There is no one correct story.',text:`Today, invite a child storyteller to choose a feeling and imagine a story about a character who feels that way.\n\nHelp children build their stories with simple questions:\n\nWho is your character?\n\nWhere is your character?\n\nWhat happened first?\n\nWhat made the character feel that way?\n\nWhat happened next?\n\nDid the feeling change?\n\nHow did the story end?\n\nIf a child says “I don’t know,” offer two simple possibilities and let the child choose. Follow the child’s idea rather than steering toward one correct story.\n\nWhen the story is finished, invite classmates to listen, respond, and—when appropriate—act it out together.`}];const params=new URLSearchParams(location.search);const names=['monday','tuesday','wednesday','thursday','friday'];let i=names.indexOf((params.get('day')||'monday').toLowerCase());if(i<0)i=0;const s=stories[i];day.textContent=s.day+(i===4?' · YOU TELL THE STORY':'');title.textContent=s.title;lead.textContent=s.lead;art.textContent=s.art;cue.textContent=s.cue;weekChip.textContent='WEEK 3 · '+s.day.toUpperCase();if(s.prompts){prompts.innerHTML=s.prompts.map(x=>'<div class="prompt">'+x+'</div>').join('');cue.style.marginTop='1.3vh'}panelTitle.textContent=s.title;storyText.textContent=s.text;if(i===4){teacher.innerHTML='⌃ &nbsp; Teacher Prompt';printBtn.textContent='🖨 Print Prompt';panelLabel.textContent='TEACHER PROMPT'}const target='week3-plan.html';teacher.onclick=()=>panel.classList.toggle('open');close.onclick=()=>panel.classList.remove('open');exit.onclick=done.onclick=()=>location.href=target;printBtn.onclick=()=>{const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>${s.title}</title><style>@page{size:letter;margin:.65in}body{font-family:Georgia,serif;color:#243d4d;max-width:7.2in;margin:auto}small{font-family:Arial,sans-serif;font-weight:bold;letter-spacing:.12em;color:#66858b}h1{font-size:30pt;color:#174f7d;margin:10px 0 6px}.day{font:700 12pt Arial,sans-serif;color:#66858b;margin-bottom:22px}.story{white-space:pre-line;font-size:14.5pt;line-height:1.48}footer{margin-top:24px;border-top:1px solid #ccd8d6;padding-top:10px;font:10pt Arial,sans-serif;color:#789}</style></head><body><small>EARLY EAGLE ACADEMY · UNIT 1 · WEEK 3 · STORYTELLING</small><h1>${s.title}</h1><div class="day">${s.day}</div><div class="story">${s.text}</div><footer>${i===4?'Child Storytelling Prompt':'Teacher Story · Tell naturally and allow children to make the pictures in their minds.'}</footer><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};</script></body></html>
