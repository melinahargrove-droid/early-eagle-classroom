<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 Visual Override Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3ef}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.edit{position:fixed;z-index:20;left:1.2vw;bottom:1.2vh;border:0;border-radius:999px;background:#173f72;color:#fff;padding:.85vh 1vw;font:900 14px "Trebuchet MS",Arial,sans-serif;box-shadow:0 5px 16px rgba(20,45,70,.22);cursor:pointer}.state{position:fixed;z-index:20;right:1.2vw;bottom:1.2vh;border-radius:999px;background:rgba(255,253,247,.96);color:#4f765e;padding:.75vh 1vw;font:900 12px "Trebuchet MS",Arial,sans-serif;border:1px solid #cad8d4}</style></head><body><iframe id="lesson" src="community-meeting-week3.html?day=Monday"></iframe><button class="edit" id="edit">✎ Edit This Visual</button><div class="state" id="state">Checking saved visual…</div><script>const KEY='eea-custom-visuals-v1',SLOTS=['week3-bunny-sit','week3-bunny-sniff','week3-bunny-calm'];const frame=document.getElementById('lesson'),state=document.getElementById('state');function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return{}}}function activeIndex(doc){const cards=[...doc.querySelectorAll('.card')];return Math.max(0,cards.findIndex(c=>c.classList.contains('active')))}function apply(){try{const doc=frame.contentDocument;if(!doc)return;const i=Math.min(activeIndex(doc),2),slot=SLOTS[i],data=saved(),card=[...doc.querySelectorAll('.card')][i],img=card&&card.querySelector('.cue img');if(img&&data[slot]){if(!img.dataset.defaultSrc)img.dataset.defaultSrc=img.getAttribute('src')||'';img.src=data[slot];state.textContent='Custom visual active: '+slot}else if(img){if(img.dataset.defaultSrc)img.src=img.dataset.defaultSrc;state.textContent='Using built-in visual: '+slot}}catch(e){state.textContent='Could not apply visual'}}frame.addEventListener('load',()=>{apply();try{new MutationObserver(apply).observe(frame.contentDocument.body,{subtree:true,attributes:true,attributeFilter:['class'],childList:true})}catch(e){}});edit.onclick=()=>{try{const i=Math.min(activeIndex(frame.contentDocument),2),slot=SLOTS[i];location.href='visual-editor.html?slot='+encodeURIComponent(slot)+'&return='+encodeURIComponent('week3-visual-test.html')}catch(e){location.href='visual-editor.html'}};window.addEventListener('storage',apply);</script></body></html>
