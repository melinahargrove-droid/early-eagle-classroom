<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Writing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:#f7f2e7;color:#174f76}.page{padding:24px}.card{max-width:1100px;margin:auto;background:#fffdf8;border:1px solid #c9dadd;border-radius:28px;padding:30px}.tag{font-size:12px;letter-spacing:.1em;font-weight:900;color:#789697}h1,h2,h3{color:#165487}.card p,.card li{font-size:18px;line-height:1.5;color:#55747b;font-weight:750}.box{background:#e7f0ed;border-radius:18px;padding:16px;margin:14px 0}.back{border:0;border-radius:999px;background:#668f99;color:#fff;padding:11px 20px;font-weight:900}</style></head><body><main class="page"><section class="card"><div class="tag" id="tag"></div><h1>Writing Basics</h1><div id="content"></div><button class="back" onclick="location.href='week7-plan.html'">Done ✓</button></section></main><script>const day=new URLSearchParams(location.search).get('day')||'Monday';const html=`<h2>Lesson 1 · Storytelling</h2><p><b>Goal:</b> Take turns telling a story.</p><div class="box">Remind children that last week the teacher told a true story. Today children use Turn and Talk to share true stories with a partner and learn more about each other.</div><p>Offer examples such as a time they went to a park or store with someone in their family, then invite children to decide what true story they want to share. Refer to Week 6 Literacy Small Group drawings if helpful. Circulate and make sure both partners have time to speak.</p><p><b>Closing:</b> Notice that children listened to and shared stories with partners.</p><h2>Lesson 2 · Storytelling Practice</h2><p><b>Goals:</b> Take turns speaking and listening; tell a story about an experience.</p><div class="box">Children again use Turn and Talk, this time listening especially carefully because they will be asked what their partner’s story was about.</div><p>Circulate while partners tell stories, then ask a few children to share what their partner’s story was about.</p><p><b>Teacher look-fors:</b> Do children follow partner routines? Remember what their partner said? Tell understandable stories? What needs reinforcement or reteaching?</p><div class="box"><b>Scheduling note:</b> The Week 7 source labels these as Lesson 1 and Lesson 2, not as specific weekdays. Use them in curriculum order on the Writing days in your schedule.</div>`;tag.textContent='WEEK 7 · '+day.toUpperCase();content.innerHTML=html;</script></body></html>
