<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Basket Layer Editor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;background:#c9d6d8;color:#123d78}.page{position:relative;width:100vw;height:100vh;overflow:hidden;background:url('./assets/caf-watercolor.webp') center/cover no-repeat}.scene{position:absolute;left:6%;right:6%;top:16%;bottom:7%}.left-scene{position:absolute;left:1%;top:2%;bottom:2%;width:36%}.eddie{position:absolute;left:-12%;bottom:3%;width:88%;height:112%;object-fit:contain;object-position:center bottom;pointer-events:none}.layer{position:absolute;cursor:grab;user-select:none;touch-action:none}.layer:active{cursor:grabbing}.layer img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.layer.selected{outline:3px dashed #ff3b30;outline-offset:4px}.back{left:34%;top:18%;width:66%;height:64%;z-index:1}.sticks{left:36%;top:29%;width:60%;height:58%;z-index:2}.front{left:34%;top:18%;width:66%;height:64%;z-index:3}.sticks-inner{position:relative;width:100%;height:100%}.stick{position:absolute;bottom:0;width:9%;border:2px solid rgba(118,82,45,.55);border-radius:999px;background:linear-gradient(180deg,#f8deb4,#e5bd84);transform-origin:center bottom}.stick:nth-child(1){left:4%;height:78%;transform:rotate(-7deg)}.stick:nth-child(2){left:12%;height:91%;transform:rotate(3deg)}.stick:nth-child(3){left:20%;height:84%;transform:rotate(-3deg)}.stick:nth-child(4){left:28%;height:94%;transform:rotate(4deg)}.stick:nth-child(5){left:36%;height:86%;transform:rotate(-4deg)}.stick:nth-child(6){left:44%;height:92%;transform:rotate(2deg)}.stick:nth-child(7){left:52%;height:83%;transform:rotate(-4deg)}.stick:nth-child(8){left:60%;height:93%;transform:rotate(5deg)}.stick:nth-child(9){left:68%;height:86%;transform:rotate(-2deg)}.stick:nth-child(10){left:76%;height:90%;transform:rotate(5deg)}.stick:nth-child(11){left:10%;height:68%;transform:rotate(4deg)}.stick:nth-child(12){left:19%;height:73%;transform:rotate(-5deg)}.stick:nth-child(13){left:28%;height:69%;transform:rotate(3deg)}.stick:nth-child(14){left:37%;height:74%;transform:rotate(-3deg)}.stick:nth-child(15){left:46%;height:70%;transform:rotate(4deg)}.stick:nth-child(16){left:55%;height:75%;transform:rotate(-4deg)}.stick:nth-child(17){left:64%;height:69%;transform:rotate(3deg)}.stick:nth-child(18){left:73%;height:73%;transform:rotate(-4deg)}.panel{position:absolute;right:18px;top:18px;z-index:50;width:290px;background:rgba(255,250,242,.97);border:3px solid #527da8;border-radius:20px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}.panel h2{margin:0 0 10px;font-size:21px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.panel button{border:2px solid #527da8;border-radius:10px;background:#fff;color:#123d78;font-weight:800;padding:7px;cursor:pointer}.panel button.active{background:#dcebf7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.size{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0}.readout{font:700 12px monospace;background:#eef5fa;border-radius:10px;padding:8px;white-space:pre-wrap;margin:8px 0}.copy{width:100%;background:#d9f0d1!important}.hint{font-size:12px;opacity:.75;line-height:1.25}
</style>
</head>
<body>
<div class="page">
  <div class="scene">
    <div class="left-scene" id="stage">
      <img class="eddie" src="./assets/caf-eddie-ready.webp" alt="">
      <div class="layer back selected" id="back"><img src="./assets/back%20basket.png" alt="Back basket"></div>
      <div class="layer sticks" id="sticks"><div class="sticks-inner">
        <span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span>
      </div></div>
      <div class="layer front" id="front"><img src="./assets/caf-basket.webp" alt="Front basket"></div>
    </div>
  </div>
  <div class="panel">
    <h2>Basket Layer Controls</h2>
    <div class="tabs"><button data-layer="back" class="active">Back</button><button data-layer="sticks">Sticks</button><button data-layer="front">Front</button></div>
    <div class="grid"><span></span><button data-move="up">↑</button><span></span><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div>
    <div class="size"><button data-size="smaller">− Size</button><button data-size="bigger">+ Size</button></div>
    <div class="size"><button data-wide="narrower">− Width</button><button data-wide="wider">+ Width</button></div>
    <div class="readout" id="readout"></div>
    <button class="copy" id="copy">Copy positions</button>
    <div class="hint">Drag a layer directly, or use the buttons. Arrow buttons move 0.5%; size changes 1%.</div>
  </div>
</div>
<script>
const layers={back:document.getElementById('back'),sticks:document.getElementById('sticks'),front:document.getElementById('front')};
let current='back';
const tabs=[...document.querySelectorAll('[data-layer]')],readout=document.getElementById('readout');
function vals(el){const p=el.parentElement;return{left:el.offsetLeft/p.clientWidth*100,top:el.offsetTop/p.clientHeight*100,width:el.offsetWidth/p.clientWidth*100,height:el.offsetHeight/p.clientHeight*100}}
function apply(el,p){el.style.left=p.left+'%';el.style.top=p.top+'%';el.style.width=p.width+'%';el.style.height=p.height+'%'}
function snapshot(){const out={};for(const [k,el] of Object.entries(layers)){const p=vals(el);out[k]={left:+p.left.toFixed(2),top:+p.top.toFixed(2),width:+p.width.toFixed(2),height:+p.height.toFixed(2)}}readout.textContent=JSON.stringify(out,null,2);return out}
function select(name){current=name;Object.values(layers).forEach(x=>x.classList.remove('selected'));layers[name].classList.add('selected');tabs.forEach(b=>b.classList.toggle('active',b.dataset.layer===name));snapshot()}
tabs.forEach(b=>b.onclick=()=>select(b.dataset.layer));
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const el=layers[current],p=vals(el),s=.5;if(b.dataset.move==='up')p.top-=s;if(b.dataset.move==='down')p.top+=s;if(b.dataset.move==='left')p.left-=s;if(b.dataset.move==='right')p.left+=s;apply(el,p);snapshot()});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const el=layers[current],p=vals(el),d=b.dataset.size==='bigger'?1:-1;p.width+=d;p.height+=d;apply(el,p);snapshot()});
document.querySelectorAll('[data-wide]').forEach(b=>b.onclick=()=>{const el=layers[current],p=vals(el),d=b.dataset.wide==='wider'?1:-1;p.width+=d;apply(el,p);snapshot()});
for(const el of Object.values(layers)){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    select(el.id);
    const parent=el.parentElement;
    const startX=e.clientX,startY=e.clientY;
    const start=vals(el);
    el.setPointerCapture(e.pointerId);
    const move=ev=>{
      const dx=(ev.clientX-startX)/parent.clientWidth*100;
      const dy=(ev.clientY-startY)/parent.clientHeight*100;
      el.style.left=(start.left+dx)+'%';
      el.style.top=(start.top+dy)+'%';
      snapshot();
    };
    const end=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end)};
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
  });
}
document.getElementById('copy').onclick=async e=>{const text=JSON.stringify(snapshot(),null,2);try{await navigator.clipboard.writeText(text);e.currentTarget.textContent='Copied!';setTimeout(()=>e.currentTarget.textContent='Copy positions',1200)}catch(err){prompt('Copy these values:',text)}};
snapshot();
</script>
</body>
</html>
