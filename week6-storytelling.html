<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 6 Storytelling</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea);color:#174f7d}.page{height:100vh;padding:3vh 5vw}.top{height:9vh;font-weight:900;letter-spacing:.12em;color:#789697}.card{height:75vh;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px;display:grid;grid-template-columns:45% 1fr;gap:4vw;align-items:center;padding:4vh 4vw}.visual{height:56vh;border-radius:28px;background:#eaf2ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:3vw;font-size:26px;font-weight:900;color:#527673}.eye{font-weight:900;letter-spacing:.1em;color:#789697}.copy h1{font-size:54px;line-height:1;margin:1vh 0;color:#164f7f}.lead{font-size:23px;line-height:1.4;font-weight:900;color:#527673}.cue{margin-top:2vh;background:#e7f0ed;border-radius:18px;padding:1.4vh 1.2vw;font-size:18px;font-weight:900;color:#416d61}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900;cursor:pointer}.panel{display:none;position:fixed;right:4vw;top:10vh;width:42vw;max-height:78vh;overflow:auto;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:25px;padding:3vh 2vw;box-shadow:0 15px 35px #0002}.panel.open{display:block}.panel h2{color:#164f7f}.panel p{white-space:pre-line;font:17px/1.5 Georgia,serif;color:#3e5f5c}</style></head><body><main class="page"><div class="top">EARLY EAGLE ACADEMY · STORYTELLING · WEEK 6</div><section class="card"><div class="visual" id="visual"></div><div class="copy"><div class="eye" id="eye"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="cue" id="cue"></div></div></section><div class="bottom"><button id="storyBtn">⌃ Teacher Story</button><button class="back" onclick="location.href='week6-plan.html'">Done ✓</button></div><aside class="panel" id="panel"><h2 id="pt"></h2><p id="text"></p></aside></main><script>const d={Monday:{title:'The Long Way to the Corner Store',visual:'Visual placeholder: Mina and Grandpa walking through their neighborhood past a garden, bakery, and park.',lead:'Imagine taking the long way through a familiar neighborhood and noticing all the things you usually pass by.',cue:'Visualize: bright tomatoes, warm bread, chalk suns, neighbors waving, and the details Mina notices on the walk.',text:`Mina and Grandpa were going to the corner store. Mina knew the fastest way: out the door, down the sidewalk, past the blue mailbox, and straight to the store.\n\nBut Grandpa turned the other way.\n\n“Grandpa,” Mina said, “the store is that way.” Grandpa smiled and pointed ahead.\n\nSo Mina followed. First they passed a tiny garden squeezed between two buildings. Mina imagined the bright red tomatoes hanging like little lanterns. A neighbor waved. Grandpa waved back.\n\nNext they passed a bakery. Mina imagined warm air drifting through the open door. She could almost smell sweet bread. Grandpa said hello to the baker, and the baker smiled.\n\nThen they reached a small park. Leaves rustled above them. A dog trotted by. Two children chalked giant yellow suns on the sidewalk. Grandpa stopped to look.\n\n“We are taking forever,” Mina sighed.\n\nGrandpa gently squeezed her hand. Then he pointed around them: to the garden, the baker, the park, the neighbors, the children, and the dog.\n\nMina looked again. The walk did feel long—but it also felt full. Full of colors. Full of sounds. Full of people who knew one another.\n\nWhen they finally reached the store, Mina chose an apple. On the walk home, Grandpa asked, “Fast way or long way?”\n\nMina thought about the tomatoes, the warm bread smell, and the chalk suns.\n\n“The long way,” she said. “But this time, I want to be the one who notices everything.”`},Tuesday:{title:'The Yellow Button',visual:'Visual placeholder: a bright yellow button surrounded by fabric, paper, string, and other Beautiful Stuff.',lead:'Picture one small object changing again and again as a child looks, listens, and imagines new possibilities.',cue:'Visualize: the yellow button as a sun, flower, wheel, submarine window, and finally a moon above a river.',text:`On the art table sat a tray of Beautiful Stuff: smooth bottle caps, twisty string, small cardboard tubes, shiny paper, soft fabric, and one bright yellow button.\n\nJalen picked up the yellow button first. He rolled it between his fingers and imagined it as the sun.\n\nHe placed it in the middle of his tray. Around it he arranged blue fabric for sky and little pieces of green paper for grass.\n\nThen Ava looked over. “That looks like a flower,” she said.\n\nJalen looked again. He imagined yellow petals growing around the button. For a moment, he wanted to change everything.\n\nThen Mateo walked by. “It could be a wheel,” he said.\n\nNow Jalen imagined a tiny red car with the yellow button rolling down a road.\n\nJalen laughed. “How can one button be so many things?”\n\nHe moved the pieces around. The sun became a flower. The flower became a wheel. The wheel became the round window on a pretend submarine.\n\nAt last Jalen stopped rearranging. He put the yellow button near the top of his tray, added a long strip of silver paper underneath it, and curled blue string around the bottom.\n\n“What is it?” Ava asked.\n\nJalen smiled. “It’s something I imagined. The yellow part is a moon, the silver part is moonlight, and the blue string is a river at night.”\n\nAva looked closely. “I can see it,” she said.\n\nJalen realized something: the button had not told him what to make. His ideas had changed as he looked, listened, and tried again. And now his idea was something another person could see too.`},Wednesday:{title:'The Wind That Changed the Walk',visual:'Visual placeholder: Sofia outside watching leaves spin, flowers nod, and clouds move in the wind.',lead:'Imagine walking a familiar path on a windy day and noticing how the weather changes everything around you.',cue:'Visualize: spinning leaves, moving branches, nodding flowers, clouds, and the quiet that returns when the wind stops.',text:`When Sofia stepped outside with her class, the morning felt quiet. The trees stood tall. The sidewalk was dry. A few leaves rested near the fence.\n\nThen—whoooosh.\n\nA breeze slipped around the corner of the school.\n\nSofia imagined it tickling the tops of the trees first. The branches began to sway. A leaf lifted from the ground and spun once, twice, three times before skittering across the sidewalk.\n\n“Look!” Sofia said.\n\nThe class kept walking. Another gust came. This one pushed Sofia’s hair across her cheek and puffed up the hood on her jacket.\n\nAt the garden, tall flowers nodded back and forth. A paper scrap raced along the fence. High above, clouds moved slowly across the sky.\n\nSofia had walked this same path many times, but today the wind made everything look different.\n\nShe wondered what the squirrel in the tree felt. Maybe its fur ruffled. She wondered about the birds. Maybe they tucked themselves closer to a branch. She wondered about the tiny insects hiding under leaves.\n\nThen the wind became quiet again.\n\nThe class stopped. Without the whoosh, Sofia could hear a bird chirping and the soft scrape of shoes on the sidewalk.\n\n“The weather changed our walk,” Sofia said.\n\nHer teacher nodded. “And you noticed.”\n\nOn the way inside, Sofia saw one last leaf tumble past the door. She pictured the breeze carrying it somewhere new, and she wondered what the schoolyard would look like tomorrow.`},Thursday:{title:'The Little Weather Reporter',visual:'Visual placeholder: Theo at a classroom window with a weather notebook, looking at clouds, drizzle, and the playground.',lead:'Picture a young weather reporter slowing down to look for evidence instead of making a quick guess.',cue:'Visualize: gray clouds, tiny raindrops, wet sidewalks, boots and a raincoat, and a patch of blue sky.',text:`Every morning, Theo wanted to know one thing: What is the weather doing today?\n\nHe used to look out the window for one second and announce, “It’s nice!” But one morning his teacher gave him a small notebook.\n\n“A weather reporter looks carefully,” she said.\n\nTheo pressed his face near the window. First he looked at the sky. He imagined the clouds like soft gray blankets stretched above the playground.\n\nThen he looked at the trees. Their branches barely moved.\n\nThen he looked at the ground. Tiny dark dots appeared on the sidewalk.\n\n“Wait,” Theo whispered. “Rain!”\n\nHe watched longer. The dots became more dots, but there were no giant splashes. It was only a light drizzle.\n\nTheo drew a cloud in his notebook and added little lines underneath. Then he thought about clothing.\n\n“Would flip-flops keep my feet dry?” he wondered. He pictured his toes getting wet and laughed.\n\nHe drew boots and a raincoat instead.\n\nAt recess time, the drizzle had stopped. The sidewalk still shone, and the air felt cool. Theo noticed that some children zipped their jackets. A bird hopped near a puddle.\n\nThat afternoon, Theo looked at his morning drawing. “The weather didn’t stay exactly the same,” he said.\n\nHe added one more picture: a small patch of blue sky peeking between the clouds.\n\nThe next morning, Theo did not announce, “It’s nice.” He opened his notebook, looked carefully, and said, “I need a minute. Weather reporters notice the evidence first.”`},Friday:{title:'The Story Between Two Friends',visual:'Visual placeholder: two children sitting knee-to-knee, listening and telling a story about a red leaf.',lead:'Today the child storyteller begins with one small true moment and lets a partner help uncover the details.',cue:'Prompts: Where did it happen? What did you notice? What happened next? How did you feel? What detail helps us picture it?',text:`Nora had a story in her head, but it felt too small to tell.\n\nHer teacher said, “Turn and talk to your partner. Tell one true thing that happened to you.”\n\nNora turned toward Eli. Their knees pointed toward each other, and they used quiet voices.\n\n“You can go first,” Eli said.\n\nNora thought. “Yesterday I found a red leaf.”\n\nThat was all.\n\nEli waited. Then he asked, “Where did you find it?”\n\nNora pictured the moment again. “By my steps.”\n\n“What did it look like?”\n\nNow Nora could see it clearly in her mind: a red leaf with a tiny yellow edge, resting on the wet sidewalk.\n\n“It looked like it had been painted,” Nora said.\n\n“What did you do with it?”\n\nNora smiled. “I carried it inside. My little brother wanted it, so I gave it to him. He put it on his pillow.”\n\nEli grinned. “That’s a whole story!”\n\nThen it was Eli’s turn. He told about helping his grandfather carry groceries. Nora listened and asked a question too.\n\nWhen the class came back together, Nora realized her story had not been too small. She had simply needed someone to listen while she found the details.\n\nOn the way home, she looked for another leaf. Not because she needed a bigger story—but because now she knew little moments could hold stories too.`}};let day=new URLSearchParams(location.search).get('day')||'Monday',x=d[day]||d.Monday;eye.textContent=day.toUpperCase()+(day==='Friday'?' · CHILD STORYTELLER':' · TEACHER STORY');title.textContent=x.title;visual.textContent=x.visual;lead.textContent=x.lead;cue.textContent=x.cue;pt.textContent=x.title;text.textContent=x.text;if(day==='Friday')storyBtn.textContent='⌃ Teacher Prompt';storyBtn.onclick=()=>panel.classList.toggle('open');</script></body></html>
