<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 8 Sections</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#fffdf7,#f5efe3 60%,#e5efea);color:#174f7d}button{font:inherit;cursor:pointer}.page{height:100vh;padding:3vh 5vw}.top{height:10vh;display:flex;justify-content:space-between;align-items:flex-start}.brand,.eye,.label{font-weight:900;letter-spacing:.1em;color:#789697}.chip{padding:.6vh .9vw;border-radius:999px;background:#dcecf0;color:#527985;font-weight:900}.card,.storycard,.closecard{background:#fffdf8;border:1.5px solid #cbdde0;border-radius:32px}.card{height:76vh;display:grid;grid-template-columns:43% 1fr;gap:5vw;align-items:center;padding:5vh 5vw}.visual,.storyvis,.closevis{border-radius:28px;background:linear-gradient(145deg,#edf5f1,#fbf6ea);display:flex;align-items:center;justify-content:center;text-align:center;color:#66858b;font-weight:900}.visual{height:55vh;font-size:clamp(70px,7vw,120px)}.copy h1,.storycopy h1{color:#164f7f;line-height:1.04}.copy h1{font-size:clamp(40px,3.5vw,68px);margin:1vh 0}.lead{font-size:clamp(20px,1.35vw,27px);font-weight:900;color:#527673;line-height:1.35}.steps{display:grid;gap:1vh;margin-top:2vh}.stepbox,.box,.cue,.prompt{background:#e7f0ed;border-radius:18px;color:#416d61;font-weight:900}.stepbox{padding:1.1vh 1.2vw;font-size:clamp(16px,1vw,20px);line-height:1.35}.bottom{height:10vh;display:flex;justify-content:center;gap:15px;align-items:center}.bottom button,.back{border:1px solid #cbdde0;border-radius:999px;background:#fffdf8;color:#245c78;padding:10px 20px;font-weight:900}.bottom .done,.back{background:#668f99;color:#fff}.choices{max-width:1500px;margin:3vh auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.25vw}.choice{min-height:59vh;border:1.5px solid #cbdde0;border-radius:30px;background:#fffdf8;padding:2.8vh 1.7vw;display:flex;flex-direction:column}.symbol{height:18vh;border-radius:24px;background:#edf5f1;display:flex;align-items:center;justify-content:center;font-size:clamp(62px,6vw,105px)}.choice h2{margin:.7vh 0;color:#164f7f;font-size:clamp(24px,1.8vw,35px)}.choice p,.detail p{color:#527673;font-weight:800;line-height:1.45}.open{margin-top:auto;align-self:flex-start;border:0;border-radius:999px;background:#668f99;color:#fff;padding:1vh 1.3vw;font-weight:900}.exit{width:54px;height:54px;border-radius:50%;border:1px solid #d3e0e2;background:#fffdf8;color:#245c82;font-size:28px;font-weight:900}.detail,.plain{max-width:1120px;margin:auto;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:30px;padding:4vh 4vw}.detail h1,.plain h1,.plain h2{color:#164f7f}.detail h1{font-size:clamp(38px,3vw,58px)}.box{padding:2vh 1.5vw;margin:2vh 0}.storycard{height:75vh;display:grid;grid-template-columns:45% 1fr;gap:4vw;align-items:center;padding:4vh}.storyvis{height:56vh;padding:3vw;font-size:28px}.storycopy h1{font-size:54px;margin:1vh 0}.cue{padding:1.4vh 1.2vw;margin-top:2vh;font-size:18px}.panel{display:none;position:fixed;right:4vw;top:10vh;width:42vw;max-height:78vh;overflow:auto;background:#fffdf8;border:1.5px solid #cbdde0;border-radius:25px;padding:3vh 2vw;box-shadow:0 15px 35px #0002}.panel.open{display:block}.closecard{height:70vh;padding:5vh 6vw;display:grid;grid-template-columns:40% 1fr;gap:5vw;align-items:center}.closevis{height:50vh;font-size:100px}.closecopy h2{font-size:60px;margin:1vh 0;color:#164f7f}.body{font-size:24px;font-weight:900;color:#527673;line-height:1.35}.prompt{margin-top:2vh;padding:2vh 1.5vw;font-size:28px;line-height:1.25}.plain p{font-size:18px;line-height:1.48;font-weight:750;color:#55747b}</style></head><body><main id="root"></main><script>(()=>{const p=new URLSearchParams(location.search),day=p.get('day')||'Monday',view=p.get('view')||'centers',root=document.getElementById('root'),days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const centers={Monday:['✏️','Writing & Drawing · Our Classroom Community','Introduce drawing classmates, teachers, and self-portraits. Children may use mirrors, photos, name strips, and letters. Model asking someone how to spell their name and writing it on the picture.','Continue Art Studio: Representing Hair; Blocks: Building Furniture; Discovery: Soap and Water; Dramatic Play: Caring for Hair; Library & Listening: Retelling Stories; Science & Engineering: Observing Ourselves.'],Tuesday:['🎨','Art Easel · Painting Inspired by Frederick','Introduce painting inspired by Leo Lionni’s collage illustrations. Children continue mixing colors and visualizing before they paint.','Continue the other Week 8 centers.'],Wednesday:['✨','Continue Centers','Support the Week 8 center experiences already in progress.',''],Thursday:['🧩','Continue Centers','Support the Week 8 center experiences already in progress.',''],Friday:['⭐','Continue Centers','Support the Week 8 center experiences already in progress.','']};const writing={Monday:['Our Field Trip in Sequential Order','Support children in recalling the class field-trip experience using sequence language such as first, next, and last.'],Tuesday:['Our Field Trip in Sequential Order','Continue drawing and discussing events from the field trip in order.'],Wednesday:['Retell Trip to the Museum','Use children’s drawings and oral language to retell the museum trip.'],Thursday:['Retell Trip to the Museum','Continue retelling and representing remembered events.'],Friday:['Continue Field Trip Retelling','Revisit children’s drawings and oral retellings as needed.']};const skills={Monday:['Unit 1 Foundational Literacy Review','Review previously introduced phonological-awareness and letter-identification skills. Use the Week 8 review sequence rather than introducing a new letter pair.'],Tuesday:['Poem · “You, Me, and Our Community”','Use the Week 8 poem for concepts of print, oral language, and community vocabulary.'],Wednesday:['Letter ID · Review','Revisit familiar letter names and sounds using the established classroom routines and Fundations supports.'],Thursday:['Concepts of Print · Review','Return to familiar print concepts while reading and discussing the Week 8 poem.'],Friday:['Week 8 Review','Revisit skills that children need most from the Unit 1 review sequence.']};const knowledge={Monday:['Writing Basics','Adult-led Writing Basics instruction.'],Tuesday:['Skill Reinforcement','Revisit specific foundational-literacy skills based on children’s needs.'],Wednesday:['Knowledge Building · Picture Cards','Use picture cards and familiar unit vocabulary to strengthen knowledge and oral language.'],Thursday:['Fine Motor Development','Offer fine-motor activities with minimal support to build stamina and control.'],Friday:['Week 8 Small-Group Review','Use the Week 8 small-group strands according to current child needs.']};const building={Monday:['Building Shapes / The Shape of Things','Read one of the Building Blocks big books and discuss familiar shapes.'],Tuesday:['Shape Show · Wake Up, Jack in the Box · Snapshots','Practice noticing, naming, and representing shapes through whole-group routines.'],Wednesday:['Shape Show · Rectangles','Explore rectangles and find examples in the classroom.'],Thursday:['Shape Show · Squares','Explore squares and find examples in the classroom.'],Friday:['Week 8 Shape Review','Revisit the Week 8 Building Blocks shape experiences and vocabulary.']};function top(label){return `<div class="top"><div class="brand">EARLY EAGLE ACADEMY · ${label} · WEEK 8</div><div class="chip">WEEK 8 · ${day.toUpperCase()}</div></div>`}function centersView(){const d=centers[day];root.innerHTML=`<main class="page">${top('INTRO TO CENTERS')}<section class="card"><div class="visual">${d[0]}</div><div class="copy"><div class="eye">${day.toUpperCase()} · CENTER INTRODUCTION</div><h1>${d[1]}</h1><div class="lead">${d[2]}</div><div class="steps">${d[3]?`<div class="stepbox">${d[3]}</div>`:''}</div></div></section><div class="bottom"><button id="prev">← Previous</button><button class="done" id="done">Done ✓</button></div></main>`}function choicesView(){root.innerHTML=`<main class="page"><header class="top"><div><div class="brand">EARLY EAGLE ACADEMY · LITERACY SMALL GROUPS</div><h1 style="margin:.5vh 0;color:#164f7f;font-size:52px">Small Group Choices</h1><div class="lead" style="font-size:20px">Choose the activity you’re teaching with this group.</div></div><div style="display:flex;gap:.7vw;align-items:center"><div class="chip">WEEK 8 · ${day.toUpperCase()}</div><button class="exit" id="exit">×</button></div></header><section class="choices"><article class="choice" data-a="writing"><div class="symbol">✏️</div><div class="label">ADULT-LED WRITING</div><h2>${writing[day][0]}</h2><p>${writing[day][1]}</p><button class="open">Open Directions →</button></article><article class="choice" data-a="skills"><div class="symbol">🔤</div><div class="label">FOUNDATIONAL LITERACY</div><h2>${skills[day][0]}</h2><p>${skills[day][1]}</p><button class="open">Open Directions →</button></article><article class="choice" data-a="knowledge"><div class="symbol">🧩</div><div class="label">SMALL-GROUP STRAND</div><h2>${knowledge[day][0]}</h2><p>${knowledge[day][1]}</p><button class="open">Open Directions →</button></article><article class="choice" data-a="fine"><div class="symbol">🤏</div><div class="label">MINIMAL SUPPORT</div><h2>Fine Motor Development</h2><p>Offer fine-motor activities with minimal support to build stamina and control.</p><button class="open">Open Directions →</button></article></section></main>`;document.getElementById('exit').onclick=()=>location.href='daily-lessons.html?week=8&day='+days.indexOf(day);document.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>detail(c.dataset.a))}function detail(a){const d=a==='writing'?writing[day]:a==='skills'?skills[day]:a==='knowledge'?knowledge[day]:['Fine Motor Development','Offer fine-motor activities with minimal support to build stamina and control.'];root.innerHTML=`<main class="page">${top('LITERACY SMALL GROUPS')}<section class="detail"><div class="label">${a.toUpperCase()}</div><h1>${d[0]}</h1><div class="box"><p>${d[1]}</p></div><div class="bottom"><button id="choose">← Small Group Choices</button><button class="done" id="done">Done ✓</button></div></section></main>`;document.getElementById('choose').onclick=choicesView}function buildingView(){const d=building[day];root.innerHTML=`<main class="page"><section class="plain"><div class="brand">WEEK 8 · ${day.toUpperCase()}</div><h1>Building Blocks</h1><h2>${d[0]}</h2><div class="box"><p>${d[1]}</p></div><button class="back">Done ✓</button></section></main>`}function storyView(){root.innerHTML=`<main class="page"><div class="brand" style="height:9vh">EARLY EAGLE ACADEMY · STORYTELLING · WEEK 8</div><section class="storycard"><div class="storyvis">Visual placeholder: adult storyteller and children preparing to act out the story.</div><div class="storycopy"><div class="eye">${day.toUpperCase()} · ADULT TELLS A STORY</div><h1>Adult Tells a Story</h1><div class="lead">An adult tells a story for Storytelling & Story Acting.</div><div class="cue">Use the teacher story you are prepared to tell today, then invite children to act it out.</div></div></section><div class="bottom"><button id="storyBtn">⌃ Teacher Story</button><button class="back">Done ✓</button></div><aside class="panel" id="panel"><h2>Teacher Story</h2><p>An adult tells a story for Storytelling & Story Acting.</p></aside></main>`;document.getElementById('storyBtn').onclick=()=>document.getElementById('panel').classList.toggle('open')}function closingView(){root.innerHTML=`<main class="page"><header style="height:10vh"><div class="brand">EARLY EAGLE ACADEMY · CLOSING CIRCLE</div><h1 style="font-size:42px;margin:.5vh 0;color:#164f7f">Ending Our Day Together</h1></header><section class="closecard"><div class="closevis">🧱</div><div class="closecopy"><div class="eye">WEEK 8 · ${day.toUpperCase()}</div><h2>Problem Stories</h2><div class="body">Use the Problem Stories characters (block people) to act out a short scenario based on something children are struggling with, such as sharing.</div><div class="prompt">Talk together about possible ways the characters could solve the problem.</div></div></section><div class="bottom"><button class="back">Done ✓</button></div></main>`}if(view==='centers')centersView();else if(view==='smallgroups')choicesView();else if(view==='building')buildingView();else if(view==='storytelling')storyView();else closingView()})();</script></body></html>
